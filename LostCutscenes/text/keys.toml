# Texts of Lost Cutscenes (mod id new_animations; «Lost Cutscenes» is not translated) (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("new_animations.<name>"): the mod's name and description on the «Mods» screen, in the game's language.
# A language missing here falls back to English.
schema = "vr_framework.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Lost Cutscenes"
mod_description = "Lost scenes back in matches: animations the game ships but never plays and scenes from earlier Inazuma Eleven games. Keeper: three save / goal pairs the game ships but never plays (standing catch and dives to both sides, each with its beaten version) join the random keeper-gauge scenes; «Effortless save»: a shot that takes at most 15 % of the gauge from a keeper without a move is stopped one-handed over his head (Galileo's catch from Chronicle Mode, played by the match's keeper). Duels: a Power Charge or Power Block won without a hyper move plays a Chrono Stone / Galaxy duel scene. De-summons: when a Keshin, a Keshin armour or a Miximax ends in open play, the player kneels, sweeps the spirit away or throws his arms out (Chrono Stone). Group summons: Griffin summoned by three players and Arthur by two (with Flamberge kicked by all three) when a game mode hands the participants (Inazuma Fantasy). Celebrations: the Inazuma Eleven Cross intros as goal celebrations of their characters (Mark Evans, Axel Blaze, Arion Sherwind…) and four open poses. Override chains: when a shot is chained into its combined move (Dragon Crash → Fire Tornado = Dragon Tornado, Cosmic Blaster, Wyvern Blizzard, Tiger Storm, Icebreaker, Emperor Penguin No. 2 feat. Shark, Beyond the Death Zone), the combined scene starts at the pass instead of repeating the first shot. Always on: the mod has no options."

[es.new]
mod_name = "Lost Cutscenes"
mod_description = "Escenas perdidas de vuelta en los partidos: animaciones que el juego trae pero nunca usa y escenas de juegos anteriores de Inazuma Eleven. Portero: tres parejas parada / gol que el juego trae y nunca usa (atrapada de pie y estiradas a izquierda y derecha, cada una con su versión batida) entran en las escenas al azar del indicador del portero; «Parada sin esfuerzo»: si un tiro le quita como mucho el 15 % del indicador y el portero no usa técnica, para el balón con una mano por encima de la cabeza (la parada de Galileo en el Modo Crónica, con el portero del partido). Duelos: una Carga Potente o un Bloqueo Potente ganados sin hipertécnica muestran una escena de duelo de Chrono Stone / Galaxy. Desinvocaciones: cuando se acaba un espíritu guerrero, una armadura o un miximax en pleno juego, el jugador se arrodilla, aparta el espíritu con el brazo o abre los brazos (Chrono Stone). Invocaciones en grupo: Grifo invocado por tres jugadores y Arturo por dos (y Flamberge chutado por los tres) cuando un modo de juego pone a los participantes (Inazuma Fantasy). Celebraciones: las intros de Inazuma Eleven Cross como celebraciones de gol de sus personajes (Mark Evans, Axel Blaze, Arion Sherwind…) y cuatro poses abiertas. Cadenas override: cuando un tiro se encadena en su combinada (Remate dragón → Tornado de fuego = Tornado dragón, Combo cósmico, Ventisca guiverno, Tormenta del tigre, Lanza gélida, Pingüino emperador n.º 2 + Tiburón, Triángulo letal triturador), la escena de la combinada empieza en el pase en vez de repetir el primer tiro. Todo está siempre activo: el mod no tiene opciones."

[fr.new]
mod_name = "Lost Cutscenes"
mod_description = "Des scènes perdues de retour en match : des animations que le jeu contient sans jamais les utiliser et des scènes des anciens jeux Inazuma Eleven. Gardien : trois paires arrêt / but que le jeu contient mais n'utilise jamais (prise debout et plongeons à gauche et à droite, chacune avec sa version battue) rejoignent les scènes aléatoires de la jauge du gardien ; « Arrêt sans effort » : un tir qui retire au plus 15 % de la jauge à un gardien sans technique est arrêté d'une main au-dessus de la tête (l'arrêt de Galileo dans le Mode Chronique, joué par le gardien du match). Duels : une Charge en force ou un Bloc en force gagnés sans hyper technique affichent une scène de duel de Chrono Stone / Galaxy. Fins d'invocation : quand un Keshin, une Armure Keshin ou un Miximax prend fin en plein jeu, le joueur s'agenouille, écarte l'esprit d'un geste du bras ou ouvre les bras (Chrono Stone). Invocations de groupe : Griffon invoqué par trois joueurs et Arthur par deux (et Sabre de feu tiré par les trois) quand un mode de jeu désigne les participants (Inazuma Fantasy). Célébrations : les intros d'Inazuma Eleven Cross comme célébrations de but de leurs personnages (Mark Evans, Axel Blaze, Arion Sherwind…) et quatre poses ouvertes. Enchaînements combinés : quand un tir s'enchaîne en sa technique combinée (Choc du dragon → Tornade de feu = Tornade du dragon, Attaque cosmique, Blizzard de la vouivre, Tempête du tigre, Gungnir de l'avalanche, Manchot empereur nº 2 avec requin, Triangle de la mort amélioré), la scène combinée commence à la passe au lieu de répéter le premier tir. Toujours actif : le mod n'a pas d'options."

[de.new]
mod_name = "Lost Cutscenes"
mod_description = "Verlorene Szenen zurück im Spiel: Animationen, die das Spiel enthält, aber nie zeigt, und Szenen aus früheren Inazuma-Eleven-Spielen. Torwart: Drei Paar Parade / Tor, die das Spiel enthält, aber nie zeigt (Fangen im Stand und Hechtsprünge nach links und rechts, jeweils mit der geschlagenen Version), kommen zu den zufälligen Szenen der Torwartanzeige hinzu; „Mühelose Parade“: Ein Schuss, der einem Torwart ohne Technik höchstens 15 % der Anzeige nimmt, wird einhändig über dem Kopf gehalten (Galileos Parade aus dem Chronik-Modus, ausgeführt vom Torwart des Spiels). Duelle: Ein ohne Hyper-Technik gewonnener Power-Angriff oder Power-Block zeigt eine Duellszene aus Chrono Stone / Galaxy. Ende der Beschwörung: Endet ein Keshin, eine Keshin-Rüstung oder ein Miximax im laufenden Spiel, kniet der Spieler nieder, wischt den Geist mit dem Arm beiseite oder breitet die Arme aus (Chrono Stone). Gruppenbeschwörungen: Greif von drei Spielern und Artus von zwei beschworen (und Flamberge von allen dreien geschossen), wenn ein Spielmodus die Beteiligten festlegt (Inazuma Fantasy). Jubel: Die Intros aus Inazuma Eleven Cross als Torjubel ihrer Figuren (Mark Evans, Axel Blaze, Arion Sherwind…) und vier offene Posen. Kombi-Ketten: Wird ein Schuss zu seiner Kombitechnik verkettet (Dragonball → Feuertornado = Dragontornado, Kosmischer Blaster, Eisiger Wyvern, Tigersturm, Eisbrecher, Kaiserpinguin II mit Hai, Jenseits des Todesdreiecks), beginnt die Kombiszene beim Pass, statt den ersten Schuss zu wiederholen. Immer aktiv: Der Mod hat keine Optionen."

[it.new]
mod_name = "Lost Cutscenes"
mod_description = "Scene perdute di nuovo in partita: animazioni che il gioco contiene ma non usa mai e scene dei precedenti giochi di Inazuma Eleven. Portiere: tre coppie parata / gol che il gioco contiene ma non usa mai (presa in piedi e tuffi a sinistra e a destra, ognuna con la sua versione battuta) entrano nelle scene casuali dell'indicatore del portiere; «Parata senza sforzo»: un tiro che toglie al massimo il 15 % dell'indicatore a un portiere senza tecnica viene fermato con una mano sopra la testa (la parata di Galileo nella Modalità Cronache, eseguita dal portiere della partita). Duelli: uno Sfondamento Impetuoso o un Contrasto Impetuoso vinti senza ipertecnica mostrano una scena di duello di Chrono Stone / Galaxy. Fine delle evocazioni: quando un Keshin, un'Armatura Keshin o un Miximax finisce in pieno gioco, il giocatore si inginocchia, scaccia lo spirito con il braccio o apre le braccia (Chrono Stone). Evocazioni di gruppo: Grifo evocato da tre giocatori e Artù da due (e Flamberga calciata da tutti e tre) quando una modalità di gioco indica i partecipanti (Inazuma Fantasy). Esultanze: le intro di Inazuma Eleven Cross come esultanze dei loro personaggi (Mark Evans, Axel Blaze, Arion Sherwind…) e quattro pose aperte. Catene combinate: quando un tiro si concatena nella sua tecnica combinata (Dragon Crash → Tornado di Fuoco = Dragon Tornado, Squarcio Spaziale, Drago Glaciale, Ruggito di Fuoco, Gungnir Siderale, Pinguino Imperatore Nº 2 con Squalo, Ultra Zona Micidiale), la scena combinata inizia dal passaggio invece di ripetere il primo tiro. Sempre attivo: la mod non ha opzioni."

[pt.new]
mod_name = "Lost Cutscenes"
mod_description = "Cenas perdidas de volta às partidas: animações que o jogo traz mas nunca usa e cenas dos jogos anteriores de Inazuma Eleven. Goleiro: três pares defesa / gol que o jogo traz mas nunca usa (pegada em pé e mergulhos para a esquerda e para a direita, cada um com a sua versão batida) entram nas cenas aleatórias do indicador do goleiro; «Defesa sem esforço»: um chute que tira no máximo 15 % do indicador de um goleiro sem técnica é parado com uma mão acima da cabeça (a defesa de Galileo no Modo Crônica, feita pelo goleiro da partida). Duelos: uma Investida Poderosa ou um Bloqueio Poderoso vencidos sem hipertécnica mostram uma cena de duelo de Chrono Stone / Galaxy. Fim das invocações: quando um Keshin, uma Armadura Keshin ou um Miximax acaba em pleno jogo, o jogador ajoelha-se, afasta o espírito com o braço ou abre os braços (Chrono Stone). Invocações em grupo: Grifo invocado por três jogadores e Artur por dois (e Flambérgia chutada pelos três) quando um modo de jogo define os participantes (Inazuma Fantasy). Comemorações: as intros de Inazuma Eleven Cross como comemorações de gol dos seus personagens (Mark Evans, Axel Blaze, Arion Sherwind…) e quatro poses abertas. Cadeias combinadas: quando um chute se encadeia na sua técnica combinada (Impacto Dragão → Furacão de Fogo = Furacão Dragão, Detonação Macrocósmica, Vendaval Wyvern, Tempestade do Tigre, Gungnir Congelante, Pinguins Imperiais nº 2 e Tubarão, Zona Mortal Implacável), a cena combinada começa no passe em vez de repetir o primeiro chute. Sempre ativo: o mod não tem opções."

[ja.new]
mod_name = "Lost Cutscenes"
mod_description = "失われた場面が試合に戻ってきます：ゲームに含まれているのに使われないアニメーションと、過去のイナズマイレブン作品の演出。キーパー：ゲームに含まれているのに使われないセーブ / 失点の３組（立ったままのキャッチと左右へのダイブ、それぞれ破られる版つき）が、キーパーゲージのランダム演出に加わります。「余裕のセーブ」：技を使わないキーパーのゲージを15 %以下しか削らないシュートは、頭上で片手で止めます（クロニクルモードのゴルレオのセーブを試合のキーパーが再現）。デュエル：超次元技なしで勝ったパワーチャージやパワーブロックで、クロノ・ストーン / ギャラクシーのデュエル演出が流れます。解除演出：化身、化身アームド、ミキシマックスがプレー中に終わると、選手がひざをつく、腕で化身を払う、または両腕を広げます（クロノ・ストーン）。合体召喚：ゲームモードが参加者を指定したとき、グリフォンを３人で、アーサーを２人で召喚します（ソード・オブ・ファイアは３人でシュート）（Inazuma Fantasy）。ゴールパフォーマンス：イナズマイレブンCROSSの登場演出を、そのキャラクター（円堂守、豪炎寺修也、松風天馬…）のゴールパフォーマンスとして追加し、さらに誰でも使える４つのポーズも追加。連携チェイン：シュートが合体技につながるとき（ドラゴンクラッシュ → ファイアトルネード = ドラゴントルネード、コズミックブラスター、ワイバーンブリザード、タイガーストーム、氷結のグングニル、皇帝ペンギン２号　ｆｅａｔ．シャーク、デスクラッシャーゾーン）、最初のシュートを繰り返さずにパスから合体技の演出が始まります。常に有効：このMODに設定はありません。"

[zh_hans.new]
mod_name = "Lost Cutscenes"
mod_description = "失落的场景重回比赛：游戏中存在却从未使用的动画，以及以往闪电十一人作品中的演出。门将：游戏中存在却从未使用的三组扑救 / 失球动画（站立接球和向左右扑救，各带被攻破的版本）加入门将槽的随机演出；“轻松扑救”：对未使用技能的门将，若射门最多只削减其槽的15 %，门将会单手在头顶接住球（编年史模式中哥鲁雷欧的扑救，由比赛中的门将演出）。对决：不使用超次元技能赢下的强力冲撞或强力阻挡会播放时空之石 / 银河的对决演出。解除演出：化身、化身武装或混合最大化在比赛中结束时，球员会跪下、挥臂驱散化身或张开双臂（时空之石）。合体召唤：当游戏模式指定参与者时，三名球员召唤格里芬、两名球员召唤亚瑟（并由三人踢出烈火圣剑）（Inazuma Fantasy）。庆祝动作：将闪电十一人CROSS的登场演出作为其角色（圆堂守、豪炎寺修也、松风天马…）的进球庆祝，另有四个通用姿势。连携连锁：射门连锁成其合体技时（猛龙冲击 → 烈焰龙卷风 = 猛龙龙卷风、宇宙冲击波、飞龙暴风雪、猛虎风暴、冰结永恒之枪、皇帝企鹅2号 feat.鲨鱼、死亡粉碎领域），合体技演出从传球开始，而不是重复第一脚射门。始终开启：本模组没有选项。"

[zh_hant.new]
mod_name = "Lost Cutscenes"
mod_description = "失落的場景重回比賽：遊戲中存在卻從未使用的動畫，以及以往閃電十一人作品中的演出。守門員：遊戲中存在卻從未使用的三組撲救 / 失球動畫（站立接球和向左右撲救，各附被攻破的版本）加入守門員量表的隨機演出；「輕鬆撲救」：對未使用技能的守門員，若射門最多只削減其量表的15 %，守門員會單手在頭頂接住球（編年史模式中哥魯雷歐的撲救，由比賽中的守門員演出）。對決：不使用超次元技贏下的動力充能或動力攔截會播放時空之石 / 銀河的對決演出。解除演出：化身、化身武裝或混合最大化在比賽中結束時，球員會跪下、揮臂驅散化身或張開雙臂（時空之石）。合體召喚：當遊戲模式指定參與者時，三名球員召喚葛利芬、兩名球員召喚亞瑟（並由三人踢出烈火聖劍）（Inazuma Fantasy）。慶祝動作：將閃電十一人CROSS的登場演出作為其角色（圓堂守、豪炎寺修也、松風天馬…）的進球慶祝，另有四個通用姿勢。連攜連鎖：射門連鎖成其合體技時（青龍咆哮 → 烈焰龍捲風 = 龍型龍捲風、宇宙衝擊波、翼龍暴風雪、猛虎風暴、冰結永恆之槍、皇帝企鵝2號 feat.鯊魚、死亡粉碎領域），合體技演出從傳球開始，而不是重複第一腳射門。始終開啟：本模組沒有選項。"
