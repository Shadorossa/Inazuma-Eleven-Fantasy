schema = "VRFW.field_clip/1"

# «Desinvocaciones» (aura-end clips): when a player's keshin, armour or miximax really ends in open play, he performs
# a short clip ON THE PITCH where he stands (no cut-in, no camera; the match goes on). The framework announces every
# aura end with a reason (docs/framework/aura-end.md) and plays the clip of the matching [[on_aura_end]] below: no
# code, no option.
# Reasons used here: time_out = the aura's own time ran out (the game's timer); gauge_empty = a mod that runs auras on
# a gauge ended it because the gauge is empty (Aura Points: PEG / SP at 0); release = ended with time left (the
# release button). A keshin turning into its armour (transform) and any end outside open play (play_stopped) play
# nothing.
# skip_controlled: never on the player the user controls (the clip would stop his run and he would lose the ball).
# Sources: the Chrono Stone cut-in packs data/chr/motion/waza/<id>.pck (3DS, Level-5), converted on the author's PC by
# research/scripts/aura_end_clip_build.py (actor only, 4 VR body rigs, root motion baked); the .glb are never
# committed (README.md «Generated animations»). Moved here from Inazuma Fantasy (rules\field_clips\aura_end.toml,
# 2026-10-02 .. 2026-10-08), so they work without it.

# kka0011 (化身消滅): the spirit leaves, the player drops to one knee.
[[field_clip]]
name = "aura_end_kneel"
glb = "assets/anims/aura_end/cs_kka0011.glb"

# kka0010 (化身解除): one arm sweeps out.
[[field_clip]]
name = "keshin_release_sweep"
glb = "assets/anims/aura_end/cs_kka0010.glb"

# vxa0011: both arms thrown out.
[[field_clip]]
name = "miximax_end_arms"
glb = "assets/anims/aura_end/cs_vxa0011.glb"

# The last frame of kka0011 held in place, looping like the match idle (research/scripts/field_clip_hold.py). Not
# played by this mod: Inazuma Fantasy's battery out (androids / robots out of PE kneel until the end of the match,
# docs/game/mechanics/aura-costs.md §11) maps its locomotion set to it after the kneel.
[[field_clip]]
name = "aura_end_kneel_hold"
glb = "assets/anims/aura_end/cs_kka0011_hold.glb"
loop = "stand"

# A keshin or an armour whose time or gauge ran out: the kneel.
[[on_aura_end]]
aura = ["keshin", "armour"]
reason = ["time_out", "gauge_empty"]
clip = "aura_end_kneel"
skip_controlled = true

# A keshin dismissed with the release button: the sweep.
[[on_aura_end]]
aura = "keshin"
reason = "release"
clip = "keshin_release_sweep"
skip_controlled = true

# A miximax whose time or gauge ran out: both arms out.
[[on_aura_end]]
aura = "miximax"
reason = ["time_out", "gauge_empty"]
clip = "miximax_end_arms"
skip_controlled = true
