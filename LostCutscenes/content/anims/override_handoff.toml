schema = "VRFW.anim/2"
owner = "match"   # the hand-off rules play them (content\techniques\overrides\handoff.toml), no single technique

# Override chain hand-off scenes (1.2.0, from Inazuma Fantasy; docs/game/mechanics/override-skills.md §10). In the
# retail chain combos (override condition type 2: a player shoots move A, a teammate holding B chains it and the shot
# becomes the combined move C) the game plays A's own scene and then C's FULL scene, which shows A's shot a second
# time. These events are C's scene from the moment the ball travels to the second player; the technique rules in
# content\techniques\overrides\handoff.toml play them instead of C's scene only when C's first shooter (seat s00) started A's
# scene just before. A direct use of C, or the chain the other way round, keeps the full scene. Built at boot from the
# player's own retail events (nothing Level-5-derived is shipped).

# Dragon Tornado (whs00350_or / whs00350, ev60_00350; s00 = Dragon Crash, s01 = Fire Tornado).
# Retail: c0100 both run in, c0200 s00's Dragon Crash (the dragon and the shot), c0300 the ball and the dragon fly
# in from s00's side while s01 jumps (the hand-off), c0400-c0600 s01's Fire Tornado finish. Kept: c0300-c0600
# (296 of 522 frames).
[[event]]
name = "dragon_tornado_handoff"
from = "ev60_00350"
id = "ev60_80350"
sound_cue = "ev60_80350_me"   # the trimmed copy of the move's SE (content\sounds\override_handoff.toml): every hit in sync
cuts = ["c0300", "c0400", "c0500", "c0600"]

# Cosmic Blaster (whs02980_or / whs02980_or_02, ev60_02980; s00 = Meteor Blade / Meteor Blade A, s01 = The Detonator).
# Retail: c0100 s00 dribbles in while s01 jumps, c0200 s00 kicks the ball up to s01, c0300 s01 (facing the camera)
# carries it into the sky, c0400-c0600 both finish it in space. Kept: c0300-c0600 (538 of 657 frames); Nacho
# 2026-10-07: start right on the cut where s01 faces the camera. Both scenes keep the move's own sound track.
[[event]]
name = "cosmic_blaster_handoff"
from = "ev60_02980"
id = "ev60_82980"
sound_cue = "ev60_82980_me"   # the trimmed copy of the move's SE (content\sounds\override_handoff.toml): every hit in sync
cuts = ["c0300", "c0400", "c0500", "c0600"]

# The other retail chain combos whose scene hands the ball from the first shooter (s00) to the partner(s) at a cut
# boundary (override-skills.md §10.3). Kept: from the partner's first cut on.

# Wyvern Blizzard (whs00840_or, ev60_00840; s00 = Wyvern Crash, s01 = Eternal Blizzard).
# c0100 both, c0200 s00's Wyvern Crash, c0300 s01 runs to meet the ball, c0400-c0500 his Eternal Blizzard finish.
[[event]]
name = "wyvern_blizzard_handoff"
