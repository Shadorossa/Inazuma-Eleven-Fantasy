id = "ev60_80840"
sound_cue = "ev60_80840_me"   # the trimmed copy of the move's SE (content\sounds\override_handoff.toml): every hit in sync
cuts = ["c0300", "c0400", "c0500"]

# Tiger Storm (whs01020_or, ev60_01020; s00 = Tiger Drive, s01 = Fireball Storm).
# c0100 both, c0200 s00's Tiger Drive sends the ball up, c0300 s01 rises to it, c0400-c0500 his finish.
[[event]]
name = "tiger_storm_handoff"
from = "ev60_01020"
id = "ev60_81020"
# the only «Tiger Storm» name call is s00's, in the dropped c0200: said again as the scene opens (with its special-line
# mate whs01020_sp_0, as in the base)
