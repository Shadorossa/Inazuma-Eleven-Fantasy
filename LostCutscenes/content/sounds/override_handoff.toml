schema = "VRFW.sound/1"
# Trimmed copies of the move SE of the override chain hand-off scenes (VRFW 2.1; docs/game/mechanics/override-trims-review.md
# §3 I1). A move's sound effects are ONE wave `<event>_me` started at frame 0 and timed to the full scene; a hand-off
# scene drops the first N frames, so it plays a copy of that wave that starts N frames in (`start_frame`, 60 fps):
# built at boot from the player's own waza_stream (no audio shipped, no re-encoding) and added to waza_stream; the
# scene names it with `sound_cue` (content\anims\override_handoff.toml).

# Dragon Tornado: ev60_80350 drops c0100-c0200 (frames 0-225)
[[sfx]]
add = "ev60_80350_me"
from = "ev60_00350_me"
bank = "waza_stream"
start_frame = 226

