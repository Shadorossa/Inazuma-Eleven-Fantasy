# Escenas del portero (new_animations 1.0.0; the mod keeper_scenes until 2026-10-08): three more pairs for the game's random keeper-gauge scenes (technique engine `[[keeper_scene]]`,
# docs/app/technique-engine.md §3.6). The game keeps 5 pairs {save, goal conceded} (ev71_31010/31020 … 31090/31100)
# and rolls ONE index per shot (never one of the last 2); the outcome picks the member. These pairs go after the
# retail ones (indices 5-7), so the retail mix stays and the new scenes are 3 of 8.
#
# The game ships six dormant short keeper scenes ev71_30010…30060 (1 cut, ~100 f, keeper in slot 6, ball, own camera
# and effect ev7130xx00, keeper_hp_gauge_menu, an event_env_config row, an EventKeeperHPAnimeConfig row 6.0 / 15 / 9
# and packs for the 4 body types). Like the retail 31xxx they are PAIRS, odd = save, even = goal conceded (the ball
# track of each event's b000001 pack against the keeper's hands, basic-move-cutscenes.md §1.4):
#   30010 standing catch (ball held at the hands)   / 30020 low drop, the ball goes through into the net
#   30030 dive left, ball held                       / 30040 dive left, the ball passes 0.9 m from the hands, into the net
#   30050 dive right, ball held                      / 30060 dive right, the ball passes 0.8 m from the hands, into the net
# (the sounds agree: 30010 / 30030 / 30050 play cue ev71_30010_me, 30020 / 30040 / 30060 cue ev71_30020_me).
# 1.0-1.3.2 declared all six as saves: a held shot could show 30020 / 30040 / 30060, the keeper beaten while the ball
# was saved (Nacho, 2026-10-06). 1.3.3: the three real pairs.
# Always on (keeper_scenes 1.3.1: the option «Escenas extra del portero» was retired).
# These pairs join the game's own random keeper-gauge pick (its index roll over the lists); the conditional saves
# (effortless_save.toml) are the framework scene selector's (docs/framework/scene-select.md).
schema = "vr_framework.technique/3"

[[keeper_scene]]
save = "ev71_30010"     # standing catch
goal = "ev71_30020"     # low drop, beaten: the ball goes through into the net

[[keeper_scene]]
save = "ev71_30030"     # dive to the left (2.4 m), ball held
goal = "ev71_30040"     # dive to the left (2.3 m), beaten

[[keeper_scene]]
save = "ev71_30050"     # dive to the right (2.4 m), ball held
goal = "ev71_30060"     # dive to the right (2.3 m), beaten
