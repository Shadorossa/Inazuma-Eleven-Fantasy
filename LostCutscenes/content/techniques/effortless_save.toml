# «Parada sin esfuerzo» (new_animations 1.0.0; keeper_scenes 1.1.0-1.4.0 before 2026-10-08): a save the keeper makes WITHOUT a move, from a shot that took at most
# 15 % of his keeper gauge, plays the cut-in content\anims\effortless_save.toml (1.4.0: the game's own one-hand catch,
# Galileo's ev74_01140 from the Chronicle match against Gemini Storm, played by the match's keeper). Any shot, with or without a technique; the random retail scenes stay for every other save.
# Only when the ball comes AT the keeper: his own save is a standing catch (front / high / low), never a dive
# (keeper_scenes 1.3; the game's save command of his SoccerCalcKeeperSaveComponent, basic-move-cutscenes.md §6.6).
# Mechanism: technique engine `[[keeper_scene]] max_gauge_damage` + `keeper_save` (docs/framework/types/technique.md;
# docs/game/mechanics/basic-move-cutscenes.md §6). Always on (1.3.1).
# Its choice among the conditional saves goes through the VR-Framework's scene selector (situation keeper.conditional,
# docs/framework/scene-select.md): the highest priority among the saves whose conditions hold, the roll among equals.
schema = "VRFW.technique/3"

[[keeper_scene]]
save = "effortless_save"          # this mod's event (anims\effortless_save.toml, id ev71_80030 since 1.4.0)
max_gauge_damage = 0.15           # the shot took at most 15 % of the keeper's full gauge
keeper_save = ["front", "low"]   # a standing catch (the ball at him): not high (it may jump), not a dive / a step only
