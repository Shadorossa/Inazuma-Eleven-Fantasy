  "tm_cro_ie3_0600",  # Knights of Queen
  "tm_cro_ie3_0800",  # Los Emperadores
  "tm_cro_ie3_0900",  # Unicorn
  "tm_cro_ie3_1000",  # Los Rojos
  "tm_cro_ie3_1100",  # Orfeo
  "tm_cro_ie3_1500",  # Os Reis
  "tm_cro_ie3_1800",  # Pequeños Gigantes
  "tm_cro_legend_IE3_04",  # Ases Internacionales
  "tm_cro_legend_IE2_06",  # Selección nacional A
  "tm_cro_legend_IE2_11",  # Selección nacional B
  "tm_cro_go2_2100",  # Inazuma Japón Legendario
  "tm_cro_go3_0200",  # Dragones de Fuego
  "tm_cro_go3_0300",  # Big Waves
  "tm_cro_go3_0400",  # Cimitarras
  "tm_cro_go3_0500",  # Muay Tigers
  "tm_cro_go3_0600",  # Resistencia Japón
  "tm_cro_go3_0700",  # Storm Wolves
  "tm_cro_orion_0100",  # Bisonte Rojo
  "tm_cro_orion_0200",  # Demonios Brillantes
  "tm_cro_orion_0300",  # Bailarines Eternos
  "tm_cro_orion_0400",  # Ejército del Fénix Árabe
  "tm_cro_orion_0500",  # Tropa Acrobática del Fútbol
  "tm_cro_orion_0600",  # Gigantes Invencibles
  "tm_cro_legend_ORION_06",  # Unicornios con Estrellas
  "tm_cro_orion_0700",  # Navy Invader
