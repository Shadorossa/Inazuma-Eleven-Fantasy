# Club variants («… A» / «… B») are compared on the team names of this language (team_text)
name_language = "es"
# Top scorers of the simulated matches: a starter's share of his team's goals = his kick stat x his position's weight
scorer_weight_forward = 1.0
scorer_weight_midfielder = 0.45

[net]
# The «Sala privada» match (scripts/net_match.lua): both PCs play it as the Campaña's match of this soccer game, at this
# difficulty (0-3: the teammates' AI of both sides), the host's team against the guest's at the guest team's stadium
game = 0x8F85B173
difficulty = 1

[daily_challenge]
# The «Reto diario» (1.75.0; the «Campaña» row's menu): a run of matches that is the same for every player on a given
# UTC day. Seed = the date (YYYYMMDD) + salt + version through the VR-Framework's seeded generator: change the salt or
# raise the version to get other runs on the same days (every player needs the same values). docs/game/modes/
# bb-daily-challenge.md
salt = "BattleBayDeluxe.DailyChallenge"
version = 1
# Matches of a run (1-3): the run is complete when every one is won; a lost match is played again (no limit)
matches = 3
# The game's difficulty of each match (1 Principiante, 2 Intermedio, 3 Avanzado, 4 Desafiante; a shorter list repeats
# its last value). A mod that owns the AI difficulty ([difficulty] owner_states) still sets it.
difficulty = [2, 2, 3]
# Days whose result (completed, best run) the save keeps
keep_days = 60

[daily_challenge.pool]
# The teams the draw takes (the player's loaned team and the rivals, all different): team table rows of this level
# whose key matches one of these globs (* = anything), listed by the Battle Bay, one per team name, in key order
level = 40
team_keys = ["bbcr_*_bb"]
