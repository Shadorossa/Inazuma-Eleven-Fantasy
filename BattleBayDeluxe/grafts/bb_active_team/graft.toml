# Battle Bay «Active team» tile (1.5.61; docs/game/modes/estadio-bb.md §16) of the mod bb_chronicle_teams (Battle Bay
# Deluxe): the first tile of «Equipos principales», before the Draft (the team evt_bbd_active_team,
# research/mods/BattleBayDeluxe/content/teams/51_active_team.toml). Its matches play the player's active team as it is
# (the mod's content\game\active_team.toml + scripts\active_team.lua); its own team_config players are placeholders,
# so this block keeps them off the grid's panel (the panel's 11 player cards of the side that shows the tile are
# hidden after the retail UpdateFormation; name, crest, description and tactics stay).
#   enjoy_team_select_menu_campaign   bbd_active_team.lua (the Campaña / Torneo grid)
#   enjoy_team_select_menu_offline    bbd_active_team.lua (the 1 vs 1 grid)
# Globals only (BBD_ACTIVE_TEAM, BBD_ACTIVE_TEAM_*); nothing runs at chunk load.
name = "bb_active_team"
mod = "bb_chronicle_teams"
order = 348
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["UpdateFormation"]
description = "Battle Bay: the Active team tile's panel shows no placeholder players"

[[files]]
stem = "enjoy_team_select_menu_campaign"

  [[files.ops]]
  type = "append_block"
  src = "bbd_active_team.lua"
  marker = "bb_active_team"

[[files]]
stem = "enjoy_team_select_menu_offline"

  [[files.ops]]
  type = "append_block"
  src = "bbd_active_team.lua"
  marker = "bb_active_team"
