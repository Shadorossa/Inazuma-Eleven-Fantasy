# Battle Bay «Draft» (docs/game/modes/estadio-bb.md §14) of the mod bb_chronicle_teams (moved from Inazuma Fantasy on
# 2026-10-08): plugin bb_chronicle_teams.dll (commands CMND_BBCR_DRAFT_*) + the VR-Framework's CMND_VRFW_BB_PAGE_REFRESH /
# _SLOT and VRFW_BBP_Hide (graft vrfw_bb_pages); data in research/mods/BattleBayDeluxe: the team evt_bbd_draft
# (teams/50_draft.toml; the pool is derived at run time by the plugin), the layers evt_bb_draft_slot / _card /
# _anchor (menus/bb_draft.toml: Campaña group, the anchor's input rows) and the texts evt_bbd_* (text/rows/).
#   enjoy_team_select_menu_campaign  bbd_campaign.lua: deciding the Draft tile opens the Draft screen: the pitch of the
#                                    formation + the bench (16 cards), the cursor moves over it (arrows on the input
#                                    anchor), Enter on an empty slot shows its 5 candidates (plain «Plantilla» cards),
#                                    Enter picks (Back refused there: NG + «Elige uno de los 5»); any order; 16 filled =
#                                    «¿Empezar la campaña con este equipo?» -> retail difficulty window; Back on the pitch
#                                    = the retail Sí / No window «¿Quieres abandonar el draft?». Clean HUD's formation
#                                    card object; Inazuma Fantasy's position_cards gives it the dock look when that
#                                    mod runs (EVT_FC_EXTRA, soccer_common), size x1.05.
#                                    Leaving it gives the grid back and rebuilds the page like a page turn.
#                                    1.5.26: Enter on an empty slot opens its 5 as a «pack opening» (screen darkened,
#                                    a band, the cards dealt face down and turned one by one, a unique best card last
#                                    with a gold glow; Enter / Back = all at once; then pick on the band, the card
#                                    flies to its slot): layers evt_bbd_pk_quad / _txt, config.toml [draft.pack].
#   enjoy_team_select_menu_campaign  bbd_roster.lua (1.5.69, owner 2026-10-15; 1.5.71 / 1.5.73 «Formación» look):
#                                    Y on a tile = the team's «Plantilla»: the picker hidden, the in-match formation
#                                    screen's background / pitch frame / formation bar opened on this menu, the cards
#                                    on the frame's pitch, bench and coach places, the retail player page of the
#                                    focused player on the right (personal_plate_menu, players-universe params);
#                                    arrows / click move, Q / E its pages, Back / Y close (the page first, then the
#                                    grid on the same tile). Footer «Plantilla» through VRFW_FooterPrompts.
#   enjoy_team_select_menu_offline   bbd_offline.lua + bbd_campaign.lua (1.5.42): the Draft in the 1 vs 1 (free match),
#                                    the Campaña's screen; scripts\campaign.lua routes the Draft tile's decide to it
#                                    (config.toml [draft] modes), 16 drafted = the tile's retail decide (1P / CPU)
#   bb_stadium_top_menu,             bbd_top.lua: at every opening the scripts sync the draft with the runs (the
#   soccer_top_menu                  Campaña's block or the Torneo's run with the Draft team keeps / restores the
#                                    drafted squad; else it is discarded). 1.5.42: also on soccer_top_menu, the hub
#                                    the Battle Bay is entered through now (bb_stadium_top_menu no longer opens)
#   enjoy_team_select_menu_campaign, bbd_difficulty_*.lua: while a mod owns the AI difficulty (config.toml [difficulty]
#   enjoy_team_select_menu_offline   owner_states, CMND_BBD_DIFFICULTY_OWNED) GetSelectDifficultyIdx answers its index,
#                                    the Campaña / Torneo team decide starts without the difficulty window
#                                    (CMND_BBD_DIFFICULTY_START) and the 1 vs 1's match settings hide the difficulty row
# Globals only; nothing runs at chunk load but bbd_roster.lua's footer prompt declaration (pure Lua).
name = "bb_draft"
mod = "BattleBayDeluxe"
order = 345
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInit", "OnSetupLayer", "OnOpenLayer", "OnDecideFocus", "OnBack", "OnFunction", "OnCloseEndLayer", "OnOpenEndLayer", "Step", "SetupEmblemIcon", "UpdateFormation", "UpdateTacticsLayer", "UpdateButtonGuide", "OnChangeFocus", "GetSelectDifficultyIdx"]
description = "Battle Bay: the Draft tile of the Campaña (pitch + bench, 1 of 5 per slot in any order, then the campaign)"

[[files]]
stem = "enjoy_team_select_menu_campaign"

  # first: the innermost OnDecideFocus wrapper (the retail team decide that opens the difficulty window)
  [[files.ops]]
  type = "append_block"
  src = "bbd_difficulty_common.lua"
  marker = "bb_draft difficulty common"

  [[files.ops]]
  type = "append_block"
  src = "bbd_difficulty_campaign.lua"
  marker = "bb_draft difficulty campaign"

  [[files.ops]]
  type = "append_block"
  src = "bbd_campaign.lua"
  marker = "bb_draft"

  [[files.ops]]
  type = "append_block"
  src = "bbd_roster.lua"
  marker = "bb_draft roster"

  [[files.ops]]
  type = "append_block"
  src = "bbd_diff_cursor.lua"
  marker = "bb_draft difficulty cursor"

[[files]]
stem = "enjoy_team_select_menu_offline"

  [[files.ops]]
  type = "append_block"
  src = "bbd_difficulty_common.lua"
  marker = "bb_draft difficulty common"

  [[files.ops]]
  type = "append_block"
  src = "bbd_difficulty_free.lua"
  marker = "bb_draft difficulty free"

  [[files.ops]]
  type = "append_block"
  src = "bbd_offline.lua"
  marker = "bb_draft offline"

  [[files.ops]]
  type = "append_block"
  src = "bbd_campaign.lua"
  marker = "bb_draft"

[[files]]
stem = "bb_stadium_top_menu"

  [[files.ops]]
  type = "append_block"
  src = "bbd_top.lua"
  marker = "bb_draft top"

[[files]]
stem = "soccer_top_menu"

  [[files.ops]]
  type = "append_block"
  src = "bbd_top.lua"
  marker = "bb_draft top"
