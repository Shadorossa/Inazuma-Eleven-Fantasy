# Battle Bay Deluxe: the key of the Campaña / Torneo selector in the Campaña screen's header bar (graft
# research/grafts/bb_tournament/bbt_mode.lua, polled with CMND_CHECK_INPUT on MENU_CTRL; its glyph
# <CMD_BBD_MODE_SWITCH>). A rebindable action (docs/framework/types/input.md §2b): the row «Cambiar Campaña / Torneo»
# in the game's «Configuración de controles», tab «Controles básicos» (the menus' tab), where the player rebinds it;
# the game keeps the choice in its own system save. Default pad RS (R3, pad index 2; owner 2026-10-15: Y opens the
# focused team's «Plantilla» now), keyboard B (index 1; the keyboard key of R3, N, is the top bar's open key on this
# screen). R3 has no retail command on the Battle Bay team grid (enjoy_team_select_menu: no CMD_FUNC6 row).
schema = "VRFW.input/1"

[[action]]
id = "BattleBayDeluxe.ModeSwitch"
command = "CMD_BBD_MODE_SWITCH"
ctrl = "MENU_CTRL"
category = "basic"
label = "evt_bbd_mode_switch_action"
pad = "RS"
keyboard = "B"
screens = ["bb_stadium_top_menu", "enjoy_team_select_menu_campaign"]   # graft bb_tournament (bbt_mode.lua)
