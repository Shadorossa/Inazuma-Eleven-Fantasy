schema = "vr_framework.team/2"
# The Battle Bay «Active team» tile (1.5.61, owner 2026-10-14: «jugar con tu equipo normal activo»): the first tile of
# «Equipos principales», right before the Draft. Hand-written (not generated by bb_chronicle_teams_build.py).
# Deciding it plays the player's ACTIVE TEAM as it is (the team the game uses outside the Battle Bay: the VS team set,
# its players with their own levels, moves, formation, kit and crest), with no draft and no team pick:
# content\game\active_team.toml + scripts\active_team.lua (docs/game/modes/estadio-bb.md §16). This team is only the
# tile: its key names it in the grid, the Campaña's session block and the Torneo's run; its players (Raimon's Battle
# Bay squad, from `based_on`) never play: every match request that carries this team as the player's side is turned
# into the game's own «player's team» request (team 0 = the active VS team, as a VS friendly) right before the match is
# built. The graft research/grafts/bb_active_team keeps those placeholder players off the grid's left panel.
# Name / description: text/rows/team_text.toml (0xD3032435 = crc32("evt_bbd_active_team_name"), the team type's
# default name text; 0x8695F667 = crc32("evt_bbd_active_team_desc")).
default_lang = "en"

# never locked (the framework's «win it to unlock it» rule would match its placeholder squad to a Raimon;
# docs/framework/bb-pages.md §8.1)
[VRFW.BbUnlock]
Open = ["active_team"]

[[team]]
name = "active_team"                      # Active team
key = "evt_bbd_active_team"
based_on = "bb_01_team_raimon"            # Raimon (its Battle Bay squad as the placeholder, its leader for the Campaña)
description = 0x8695F667
level = 40
emblem = "em900001"                       # the game's default crest of a new club (no real team's)
appears = [
  # the first tile of «Equipos principales»: right before the Draft tile (which sits `sort_before` the game's first
  # grid row, Raimon; docs/framework/bb-pages.md §2.1: chains are followed)
  { list = "bb_stadium", category = "main", season = "series_01", sort_before = "bb_chronicle_teams.draft", row = { copy = false, order = 0, stadium = 0x22E965A5, image = "ev_chronicle_img/ev_bb_s10g001_01.g4tx", bgm = 0x6C1E6CDD, unlock_text = 0x72758BF1 } },
]
