# the row plays at the team's home stadium with its card art (the team's `stadium_fallback` / `stadium_image`, or the
# game team's `stadium` an active mod declares: VR-Framework 2.0.101; none = the grid's first row's art). Then the game's own rows
# the rules touch (`row = { copy = false }`: the row itself, only its season / sort_after) and the hidden ones.
