schema = "vr_framework.team/2"
# The Battle Bay «Draft» team (docs/game/modes/estadio-bb.md §14): the second tile of «Equipos principales», after the
# «Active team» tile (51_active_team.toml, 1.5.61). Hand-written
# (not generated by bb_chronicle_teams_build.py); moved from Inazuma Fantasy (teams/10_ie1/0284_draft.toml) on 2026-10-08.
# Its key stays `evt_bbd_draft`: a campaign saved with the Draft team names it by its hash, and the
# roster (save blob bb_draft.json, the old bb_draft_slot<N>.json) carries it too. scripts\draft.lua finds this team by
# its name (config.toml [draft] team = "draft"):
# its members are the Draft's 16 places, its formation places the starters (the pool is derived at run time).
# The 16 members are PLACEHOLDERS (game players, Raimon's squad + one): scripts\draft.lua writes the drafted
# players over their rows in memory and the placeholders back when the campaign ends. Name / description:
# text/rows/team_text.toml; the unlock text 0x72758BF1 = crc32("evt_bbd_locked") (text/rows/menu_text.toml).
default_lang = "en"

# 2026-10-13 (owner: the Draft tile showed locked, «Gana a este equipo en "Cadena Nostalgia"»): its placeholder squad is
# Raimon's, so the framework's «win it to unlock it» rule matched it to a chain's Raimon. The Draft is never locked
# (docs/framework/bb-pages.md §8.1, [VRFW.BbUnlock] Open).
[VRFW.BbUnlock]
Open = ["draft"]

[[team]]
name = "draft"                            # Draft
key = "evt_bbd_draft"
based_on = "bb_01_team_raimon"            # Raimon (its tactics / team skills)
description = 0x479D6F92
level = 40
formation = 0x94116F1A
kit = 0x7A2BAC24
emblem = 0x26A73CBD
roster = "exact"
member = [
  { card = 0x3055CF22, slot = 0, captain = true, rarity_step = 4 },  # Mark Evans · GK
  { card = 0x0263ADA0, slot = 1, rarity_step = 4 },  # Jack Wallside · DF
  { card = 0x29C98EDE, slot = 2, rarity_step = 4 },  # Bobby Shearer · DF
  { card = 0x1B789CE1, slot = 3, rarity_step = 4 },  # Nathan Swift · DF
  { card = 0x54390A26, slot = 4, rarity_step = 4 },  # Tod Ironside · DF
  { card = 0xE197746B, slot = 5, rarity_step = 4 },  # Sam Kincaid · MF
  { card = 0x660F68A4, slot = 6, rarity_step = 4 },  # Tim Saunders · MF
  { card = 0x02E4DD1D, slot = 7, rarity_step = 4 },  # Erik Eagle · MF
  { card = 0x2B08403A, slot = 8, rarity_step = 4 },  # Jude Sharp · MF
  { card = 0x3197A515, slot = 9, rarity_step = 4 },  # Kevin Dragonfly · FW
  { card = 0x288C9454, slot = 10, rarity_step = 4 },  # Axel Blaze · FW
  { card = 0x1ABAF6D6, slot = 11, rarity_step = 4 },  # William Glass · FW
  { card = 0x4D223B67, slot = 12, rarity_step = 4 },  # Jim Wraith · DF
  { card = 0xF88C452A, slot = 13, rarity_step = 4 },  # Maxwell Carson · FW
  { card = 0x7F1459E5, slot = 14, rarity_step = 4 },  # Steve Grim · MF
  { card = 0x8968E5CD, slot = 15, rarity_step = 4 },  # Hurley Kane · DF
]
appears = [
  # the Draft tile is the first tile of «Equipos principales» (docs/framework/bb-pages.md §2.1): category main sorts by
  # season, then source order; the season of its placeholder squad (IE1) is named and `sort_before` the game's first
  # grid row (Raimon, table row 0) puts it ahead of every row (VR-Framework 2.0.1; without it the row sorted after every
  # game row of season 1)
  { list = "bb_stadium", category = "main", season = "series_01", sort_before = "bb_01_team_raimon", row = { copy = false, order = 0, stadium = 0x22E965A5, image = "ev_chronicle_img/ev_bb_s10g001_01.g4tx", bgm = 0x6C1E6CDD, unlock_text = 0x72758BF1 } },
]

# each drafted player plays its card's first 4 moves, all at level 1 (the engine reads them from the card; the Hiper
# comes from its slot 9), as the Battle Bay squads of Inazuma Fantasy did
[[edit]]
target = "bb_chronicle_teams.draft"
card_moves = 4
