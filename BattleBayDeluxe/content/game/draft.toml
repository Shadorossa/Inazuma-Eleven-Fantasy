handler = "BattleBayDeluxe.DraftCands"
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BBCR_DRAFT_PICK"
handler = "BattleBayDeluxe.DraftPick"
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BBCR_DRAFT_ABANDON"
handler = "BattleBayDeluxe.DraftAbandon"
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BBCR_DRAFT_SYNC"
handler = "BattleBayDeluxe.DraftSync"
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# 1.5.42: the free match (1 vs 1) Draft screen is done: the Draft tile's retail decide (GameDecide, called directly,
# not through the Decide hook) records the drafted team as 1P / CPU (scripts\campaign.lua)
name = "CMND_BBD_DRAFT_DECIDE"
handler = "BattleBayDeluxe.DraftDecide"
needs = ["GameDecide", "GridMenu", "GridSlot", "FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# 1.5.26: the candidates' «pack opening» look (config.toml [draft.pack]: timings, darkness, size, sounds), asked by the
# graft when the Draft screen opens; no game access, so no declaration needed (without it the graft keeps its defaults)
name = "CMND_BBD_DRAFT_PACK"
handler = "BattleBayDeluxe.DraftPack"

[[VRFW.Command]]
# 1.5.69: a starter slot's placement in a formation (formation_config, read by the script), for the «Plantilla» viewer
# of the Campaña grid (Y on a tile, graft bb_draft bbd_roster.lua); no game memory, so no declaration needed
name = "CMND_BBD_FORMATION_PLACE"
handler = "BattleBayDeluxe.FormationPlace"

# ---------------------------------------------------------------- what other readers see (game_state)
[[VRFW.State]]
# the Draft team hash (0 = no Draft this session): the Decide hook never draws it as a rival and refuses it outside
# the Campaña
key = "BattleBayDeluxe.draft.team"
fallback = 0
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.State]]
# 0 none, 1 picking, 2 complete, 3 campaign
key = "BattleBayDeluxe.draft.phase"
fallback = 0
needs = ["FindTeamConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]
