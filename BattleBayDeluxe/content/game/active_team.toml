# The «Active team» tile's native access as data (schema VRFW.game/1, docs/framework/native.md; 1.5.61, owner
# 2026-10-14). The tile (content\teams\51_active_team.toml) plays the player's ACTIVE TEAM as it is: no draft, no team
# pick. docs/game/modes/estadio-bb.md §16 has the reverse engineering; in short:
#
# * Every match of the Battle Bay (the 1 vs 1's start button and the Campaña's first match in the grid's Decide
#   0x1068350, every later Campaña / Torneo match in 0xCB4C90) is asked through StartMatchRequest 0x17B7260(scene,
#   request). The request's +0xA0 (u8) = 1 «explicit teams» (the Battle Bay's), +0xA4 = the player's team, +0xA8 = the
#   rival team (u32 team ids).
# * The match setup 0x16B59D0 builds the player's side from +0xA4; when it is 0 it takes the game row's own-side team
#   (soccer_game_config difficulty col 5: 0 in every row of fbtl_bb_stadium_00, as in the VS friendly fbtl_free_001)
#   with the «user team set» flag (setup +0x3C = 1): the team builder 0xE9C190 then builds the side from the player's
#   active VS team set, exactly as a VS friendly does (real levels, moves, formation, kit, crest).
# * So the hook below only rewrites the request: player's team = the Active team tile -> 0. The grid, the Campaña's
#   session block (+0x2CA6EC) and the Torneo's run keep the tile's team, so their screens keep showing its name and
#   crest; only the match is built from the active team.
#
# Native answer, no script on the game thread: the table BattleBayDeluxe.ActiveTeam holds the tile's team id
# (scripts\active_team.lua fills it at start). No entry = the request as the game made it.
#
# 1.5.66 (owner 2026-10-15: the VS screen showed another team, «Punishement»; the tile's crest and model kit were
# Raimon's; the active team should play at the Battle Bay's level sync 40 with every move usable):
# * The team set: the match setup takes the player's team set from the request's +0xC0 (u8, `0x16B59D0`: setup +4,
#   read by the team builder `0xE9C190` as `FUN_140da20a0(party, set)`). Every Battle Bay request fills it with
#   party +0x9F11, the online / Battle Bay team set (3..5), not the VS team set the team dock calls active
#   (party +0x9F10, CMND_GET_VS_USE_TEAM_SET; +0x9F13 in play mode 2). The answer below writes the active set
#   (table BattleBayDeluxe.ActiveSet, filled by the mirror); scripts\active_team.lua also writes it from the party
#   block itself on hook:StartMatchRequest.
# * Level sync: MatchCharaBuild `0x16058F0` computes an owned player's match stats with `GetLevel` of his saved
#   character (`0x1606121`, call to `0xD85710`, then `0x16053F0(stats, level)`). The call hook MatchStatLevel answers
#   min(level, sync) while the table BattleBayDeluxe.LevelSync holds the sync of an active-team match (set by the
#   script on that match's request, removed on any other request). Only the stats level is synced: the saved
#   characters keep their level, so their boards, learn levels and moves stay as they are (no move is held back by
#   the sync; the retail level-sync flag 0xFEAE6211 would cap GetLevel everywhere and close board pieces above it).
schema = "VRFW.game/1"

[[VRFW.Global]]
# the party block (CGDDPartyStatus): +0x9F10 the VS team set in use, +0x9F13 the same in play mode 2
name = "active_team_party"
base = "game_root"
chain = ["Game.RootParty"]

[[VRFW.State]]
# the address of the native block the StartMatchRequest answers mark a tile request in (set by scripts\active_team.lua)
key = "BattleBayDeluxe.active_team.request_mark"

[[VRFW.Struct]]
# the team record FindTeamConfig answers (team_config row in memory): kit (uniform_config id) and emblem (item id),
# as CMND 0x804100A6 fields 4 / 6 read them
name = "ActiveTeamRecord"
size = 0x30
fields = { uniform = { at = 0x1C, type = "u32" }, emblem = { at = 0x20, type = "u32" } }

# 1.5.77 (owner 2026-10-15: the Draft played as «Draft» with a generic crest and kit): the Draft team carries the active
# team's identity. Its crest and kit: the mirror writes them over the Draft's team record too (scripts\active_team.lua;
# the match setup reads the record at every build, the game's own kit clash rule still applies). Its name:
# TeamLookBuild(out, record, …) 0xE9B760 resolves the record's name text (+0x14) to the name string the match team set
# keeps (out +0x60, a char*: 0xE9B580 stores its 9th argument there), which the VS screen and the scoreboard show. The
# answer points it at the active team's name (a native block of the mod; table BattleBayDeluxe.TeamName: team id -> the
# block's address) for the teams in the table only, so the grid keeps the tile's own «Draft» text.
# Stolen bytes: mov [rsp+20h],rbx / push rbp / push rsi / push rdi / push r12 / push r13 / push r14 = 14 bytes, no
# relative operand (unique pattern in the v7.1.2 dump).
# Full signature: TeamLookBuild(out, record, const u32* p3, u32 flags, const u64[2]* p5, u8 p6) -> out; p5 and p6 are
# stack arguments that 0xE9B580 reads (p5 dereferenced at 0xE9B5D7). 1.5.77 declared only (out, record): the detour
# then passed 0 for both and every match crashed reading [0 + 8] (off in 1.5.78). The framework now forwards the
# stack slots in any case; the full list is declared here as well.
[[VRFW.Hook]]
name = "TeamLookBuild"
kind = "function"
pattern = "48 89 5C 24 20 55 56 57 41 54 41 55 41 56 41 57 48 8D 6C 24 E9 48 81 EC A0 00 00 00 45 33 ED 33 C0 4C 89 29 0F 57 C0 4C 89 69 08 4C 8B F1"
rva = 0xE9B760
steal = 14
args = ["ptr", "ptr", "ptr", "u32", "ptr", "u8"]
ret = "ptr"

# the record's team id (+0) has a name in the table: that name as the match team set's name (out +0x60). Written
# through args[1] (the out block the game filled), only for a non-null out and record and a team in the table; a
# missing entry gives no value, so nothing is written.
[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "args[1]", not = 0 },
  { value = "args[2]", not = 0 },
  { value = "[args[2]]:u32", in_table = "BattleBayDeluxe.TeamName" },
]
value = "lookup(BattleBayDeluxe.TeamName, [args[2]]:u32)"
write = "[args[1] + 0x60]:u64"

[[VRFW.Hook]]
# StartMatchRequest(scene, request) 0x17B7260: the generic «start this match» of every mode (15 callers). Stolen bytes:
# mov [rsp+18h],rbx / mov [rsp+20h],rsi / push rbp / push rdi / push r14 = 14 bytes, no relative operand (unique
# pattern in the v7.1.2 dump; the RIP operand after them is a wildcard).
name = "StartMatchRequest"
kind = "function"
pattern = "48 89 5C 24 18 48 89 74 24 20 55 57 41 56 48 8D 6C 24 90 48 81 EC 70 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 60 8B 42 6C"
rva = 0x17B7260
steal = 14
args = ["ptr", "ptr"]
ret = "u64"
# the script's handler writes the team set and the level sync of the match: it waits for a busy script VM
wait_ms = 500

# 1.5.67: which request carries the tile, for scripts\active_team.lua (an answer below turns the tile into 0, so the
# handler alone cannot tell it from a mode whose own request has player's team 0, e.g. a free match): the request's
# address for a tile request, else 0 (same target: the first answer that applies wins), in the script's native block
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "args[2]"
write = "[state(BattleBayDeluxe.active_team.request_mark)]:u64"

[[VRFW.Hook.answer]]
phase = "pre"
value = "0"
write = "[state(BattleBayDeluxe.active_team.request_mark)]:u64"

# 1.5.66: the player's team set of an active-team request = the active VS team set (first: its condition reads +0xA4
# before the next answer writes 0)
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "lookup(BattleBayDeluxe.ActiveSet, 0)"
write = "[args[2] + 0xC0]:u8"

# the player's team of a Battle Bay request (+0xA0 = 1) is the Active team tile: 0 = the player's active team
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "0"
write = "[args[2] + 0xA4]:u32"

# 2026-10-19 (owner): the Torneo's final is played in its drawn stadium. A Battle Bay request (+0xA0 = 1) carries its
# match info at +0x68 (filled by 0xEBA4B0 from the reservation's parameters; 0xCB4C90 passes the rival's stadium, its
# enjoy row +0xC); the match info's +0x20 is the stadium map. scripts\tournament.lua sets the table
# BattleBayDeluxe.FinalStadium (key 0 = the map crc) only while the player's next match is the final; no entry = the
# request's own stadium.
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "0", in_table = "BattleBayDeluxe.FinalStadium" },
]
value = "lookup(BattleBayDeluxe.FinalStadium, 0)"
write = "[args[2] + 0x88]:u32"

# 1.5.64 (owner 2026-10-14: the tile previewed Raimon / Mark Evans): the active team set mirrored onto the tile. The
# graft research/grafts/bb_active_team reads the active team set (CMND_GET_VS_USE_TEAM_SET and its members) and sends
# (captain chara_param, "position:chara_param,…"); scripts\active_team.lua writes them over the tile's member rows
# and its Battle Bay row leader in memory -> ok, what was done.
[[VRFW.Command]]
name = "CMND_BBD_ACTIVE_TEAM_MIRROR"
handler = "BattleBayDeluxe.ActiveTeamMirror"
needs = ["FindTeamConfig", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow", "ActiveTeamRecord"]

# 1.5.66: the level sync of the active team's match stats. MatchCharaBuild's GetLevel call before the stats are built
# from the level; the game profile's site Match.BuildCharaLevelCall gives the call and its callee per build.
[[VRFW.Hook]]
name = "MatchStatLevel"
game = "Match.BuildCharaLevelCall"
kind = "call"
args = ["ptr", "ptr"]
ret = "u16"

# no table entry = the game's level
[[VRFW.Hook.answer]]
phase = "post"
value = "min(ret, lookup(BattleBayDeluxe.LevelSync, 0))"
