# The Campaign's rival draw as native data (schema VRFW.game/1, docs/framework/native.md), handled by
# scripts\campaign.lua (`VRFW.on("hook:Decide")` / `VRFW.on("hook:Decide:post")`); since 1.3.0 (2026-10-10) it
# replaces bb_chronicle_teams.dll's campaign_rt.rs. The Draft's declarations are draft.toml (the same mod: one name
# space, `needs` reach across the files).
#
# Patterns: the DLL's (every one unique at its rva in the v7.1.2 dump); functions the DLL reached through a
# `call rel32` (FindChildByHash, EvalCondition) are declared here by a pattern at their own entry.
schema = "VRFW.game/1"

# ---------------------------------------------------------------- functions
[[VRFW.Function]]
# EnjoySelectTeamMenu::Decide(this, const u32* button, u32 index) 0x1068350: the grid decide and the campaign start
# (vr_sigs::bb::BB_MENU_DECIDE); named here so the hook can check the slot holds it (or a wrapper of it)
name = "GameDecide"
pattern = "48 89 5C 24 10 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 70 FF FF FF 48 81 EC 90 01 00 00 0F 29 B4 24 80 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 70 45 8B F8 44 89 7C 24 58 4C 8B EA 48 89 54 24 68 48 8B F1 8B 02 89 44 24 40 45 33 C0 48 8D 54 24 40 E8 ?? ?? ?? ??"
rva = 0x1068350
args = ["ptr", "ptr", "u32"]

[[VRFW.Function]]
# void* Menu::FindChildByHash(this, const u32* hash, u8) 0x533940: the grid layer's child (cursor slot at +0x154).
# Its 2nd argument is a POINTER to the layer hash: VRFW.mem.buffer("layer", 4) holds it.
name = "FindChildByHash"
pattern = "48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 57 41 54 41 55 41 56 41 57 48 83 EC 20 44 0F B7 61"
rva = 0x533940
args = ["ptr", "ptr", "u8"]
ret = "ptr"

[[VRFW.Function]]
# bool EvalCondition(const u8* cond) 0xDCB560 (the grid ctor's unlock-condition evaluator). The function has a twin
# (0x1830110, same first 120 bytes): the pattern starts on the end of the function before it.
name = "EvalCondition"
pattern = "48 8B C1 C3 CC CC CC CC 48 81 EC 48 02 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4"
offset = 8
rva = 0xDCB558
args = ["ptr"]
ret = "bool"

# ---------------------------------------------------------------- globals ([[g_gameRoot]+…])
[[VRFW.Global]]
# Code guard of the pre-phase: the campaign start inside Decide (0x1068B94: `cmp ecx,140980D9h; jne; mov r13,
# [rip+g_sceneReq]; …; cmp byte [rsi+885h],0; …; mov rax,[rip+g_gameRoot]; mov rax,[rax+69C8h]`), the code the
# pre-phase relies on (pool = unlocked grid slots, shuffle, resize to 7, rivals to S+0x2CA6F0, match 1 at once). Its
# RIP operand is g_gameRoot; the hook needs it (another build of that code = no hook, retail draw). The menu field and
# the game-root field are wildcards: the same code on v7.1.2 and v7.2.1 (0x1073E64: +0x8A5, +0x69D0).
name = "campaign_code"
rip = { pattern = "81 F9 D9 80 09 14 0F 85 ?? ?? ?? ?? 4C 8B 2D ?? ?? ?? ?? 4C 89 6C 24 ?? 80 BE ?? ?? ?? ?? 00 0F 84 ?? ?? ?? ?? 4D 85 ED 0F 84 ?? ?? ?? ?? 48 8B 05 ?? ?? ?? ?? 48 8B 80 ?? ?? ?? ??", disp_off = 0x31, next_ip_off = 0x35, rva = 0x1068B94, target_rva = 0x21F62A0 }

[[VRFW.Global]]
# enjoy_mode_team_config in memory: rows +0x108 (stride 0x40), count +0x110
name = "enjoy"
base = "game_root"
chain = ["Game.RootEnjoyTeams"]

[[VRFW.Global]]
# the session block S: +0x2CA6EC player team, +0x2CA6F0 the 7 rivals, +0x2CA70C match index
name = "session"
base = "game_root"
chain = ["Game.RootPlayData"]

# ---------------------------------------------------------------- structs
[[VRFW.Struct]]
name = "EnjoyTable"
size = 0x118
fields = { rows = { at = 0x108, type = "ptr" }, count = { at = 0x110, type = "i32" } }

[[VRFW.Struct]]
# one enjoy row (stride 0x40): +0x10 = its unlock condition (null = none)
name = "EnjoyRow"
size = 0x40
fields = { team = { at = 0x0, type = "u32" }, leader = { at = 0x4, type = "u32" }, stadium = { at = 0xC, type = "u32" }, cond = { at = 0x10, type = "ptr" }, bgm = { at = 0x2C, type = "u32" } }

[[VRFW.Struct]]
# the grid menu object: campaign variant byte; 28 slot records of 0x38 bytes from +0x258 (GridSlot);
# player_one_decided (1.5.61): the 1 vs 1's player side is picked (the next grid decide picks the rival; GameDecide
# 0x1068350: `cmp byte [rsi+885h], 0; jne; movzx eax, byte [rsi+895h]; cmp byte [rsi+894h], 0`). Both offsets are
# read from that code (the menu base class grew by 0x20 on v7.2.1: +0x8A5, +0x8B4).
name = "GridMenu"
size = 0x8C8
fields = { campaign = { at = 0x885, type = "u8", pattern = "80 BE ?? ?? ?? ?? 00 0F 85 ?? ?? ?? ?? 0F B6 86 ?? ?? ?? ?? 80 BE ?? ?? ?? ?? 00 0F 84", capture = "disp32@2", rva = 0x1068570, moves_with = "GridMenu.Campaign" }, player_one_decided = { at = 0x894, type = "u8", pattern = "80 BE ?? ?? ?? ?? 00 0F 85 ?? ?? ?? ?? 0F B6 86 ?? ?? ?? ?? 80 BE ?? ?? ?? ?? 00 0F 84", capture = "disp32@22", rva = 0x1068570, moves_with = "GridMenu.Campaign" } }

[[VRFW.Struct]]
# one grid slot record, addressed as menu + GridMenu.Slots + slot * 0x38 (scripts\lib\game.lua). The fields are read
# from GameDecide's code (`imul rbx, rcx, 38h; mov ebx, [rbx+rsi+25Ch]`, `cmp byte [rdx+rsi+28Bh], 0`) minus where
# the records start on the running build (`relative_to`: v7.1.2 +0x258, v7.2.1 +0x278), so they stay +0x4 / +0x33.
name = "GridSlot"
size = 0x38
fields = { team = { at = 0x4, type = "u32", pattern = "48 0F BF 88 ?? ?? ?? ?? 48 6B D9 38 8B 9C 33 ?? ?? ?? ?? 48 0F BF 86 ?? ?? ?? ?? 48 6B F8 38 8B BC 37", capture = "disp32@15", rva = 0x10687B2, relative_to = "GridMenu.Slots" }, unlocked = { at = 0x33, type = "u8", pattern = "81 F9 F6 71 54 06 0F 85 ?? ?? ?? ?? 49 6B D7 38 80 BC 32 ?? ?? ?? ?? 00 0F 84", capture = "disp32@19", rva = 0x10683BB, relative_to = "GridMenu.Slots" } }

[[VRFW.Struct]]
# the grid layer's cursor slot, read from the same GameDecide code (`movsx rcx, word [rax+154h]`)
name = "GridChild"
size = 0x158
fields = { cursor = { at = 0x154, type = "i16", pattern = "48 0F BF 88 ?? ?? ?? ?? 48 6B D9 38 8B 9C 33 ?? ?? ?? ?? 48 0F BF 86 ?? ?? ?? ?? 48 6B F8 38 8B BC 37", capture = "disp32@4", rva = 0x10687B2 } }

[[VRFW.Struct]]
name = "Session"
size = 0x2CA710
fields = { game = { at = 0x2CA6E4, type = "u32" }, difficulty = { at = 0x2CA6E8, type = "u8" }, player = { at = 0x2CA6EC, type = "u32" }, rival1 = { at = 0x2CA6F0, type = "u32" }, match = { at = 0x2CA70C, type = "u8" } }

# ---------------------------------------------------------------- the hook (step H phase 2)
[[VRFW.Hook]]
# EnjoySelectTeamMenu vtable (.rdata 0x19F75D8, named by the ctor's `lea rax,[rip+vtable]`) slot 43 = Decide. The
# framework's BB pages service wraps it first; this hook chains on top (expect_fn: a WARN, not a refusal).
#   pre  (button 0x140980D9 + campaign menu): draw the 7 rivals from every unlocked enjoy row (EvalCondition for the
#        conditioned rows off the grid), leave only rival 1 unlocked on the grid; a decide on the Draft tile outside
#        the Campaña is refused (return override 0, the game's Decide not called)
#   post: grid slots back; rivals 2-7 written to Session +0x2CA6F0 when the block holds player, rival 1, 0 × 6
# The ctor's member offsets are wildcards: the same code on v7.1.2 and v7.2.1 (0x10755DB, vtable 0x1A0B668, slot 43 =
# Decide 0x1073620 with the same arguments).
name = "Decide"
kind = "vtable"
pattern = "48 8B 05 ?? ?? ?? ?? 48 89 81 ?? ?? ?? ?? 48 8D 05 ?? ?? ?? ?? 48 89 01 48 81 C1 ?? ?? 00 00 B2 1C E8"
rva = 0x106A30B
rip = { disp_off = 0x11, next_ip_off = 0x15, target_rva = 0x19F75D8 }
slot = 43
expect_fn = "GameDecide"
args = ["ptr", "ptr", "u32", "u64"]
ret = "u64"
needs = ["campaign_code", "FindChildByHash", "enjoy", "session", "EnjoyTable", "EnjoyRow", "GridMenu", "GridSlot", "GridChild", "Session"]

# bool IsNetworkSession() 0x1239C70 (1.5.42): the free match's Draft is refused in a network session (the online
# Battle Bay). Two functions have these bytes (0x1239C70 and 0x1239ED0, the same global); the trailing padding picks
# the first (as BetterUI's content/game/prematch_editor.toml declares it).
[[VRFW.Function]]
name = "IsNetworkSession"
pattern = "48 8B 15 ?? ?? ?? ?? 8B 82 10 24 00 00 85 C0 74 27 FF C8 0F B6 84 10 14 24 00 00 3C 02 73 19 48 69 C0 08 12 00 00 48 03 C2 74 0D 0F B6 80 00 12 00 00 C0 E8 02 24 01 C3 32 C0 C3 CC CC CC CC CC CC CC CC"
rva = 0x1239C70
ret = "bool"
