# The Battle Bay «Torneo» bracket overlay (docs/game/modes/bb-tournament.md §6), added to the Battle Bay top menu
# (bb_stadium_top_menu) and drawn by the graft research/grafts/bb_tournament (bbt_top.lua). 1.5.47 (owner
# 2026-10-13): the top menu's «Torneo» row (1.4.1-1.5.45: a 4th medium row, its list locator, its icon) is gone; the
# Torneo is a mode of the Campaña screen, picked in its header (the selector's layers below, graft bbt_mode.lua), and
# the loading telop's path has as many nodes as the match's mode can have (fade_menu_encount_campaign, bbt_encount.lua).
# 1.5.15 (owner, in game: the Victory Road bracket art showed «Cuadro: mitad izquierda» / right half pages, 16 names as
# white text on two big white boxes, the slot bars and crowns outside them): the WHOLE bracket in one view, built
# from the number of teams (rounds = log2(teams), always a power of two), scaled to fit; each team on a list plate of
# the game (the emblem list's row, team06_02: plate, crest slot, name) with its crest left of the name on the left
# side and mirrored on the right side (crest on the outer edge, the name right-aligned), the connectors drawn as
# lines (the winners' path lit), each match's score at its joint, the champion on a plate above the final with a
# crown. Of the Victory Road art only its background stays (vroad04_01_p1_bg).
# Every layer is in the menu's layer group with the «not opened with the group» flags (as the Draft's layers): the
# graft opens / closes them. align [1, 8] + scale 0.2 (as the framework's chain board): the Lua places each instance
# in screen px from the top left (CMND_SET_LAYER_LOCAL_POS x, -y) and sizes it (CMND_SET_LAYER_SCALE).
# The input anchor takes the keys while the overlay is up: Enter (next match / close), Back, right click, L1 / R1
# (pages: results, groups, the bracket) -> CMD_FUNCTION evt_bbd_tn_prev / _next = 0xDD7A8C24 / 0x65B7144D; the
# arrows evt_bbd_lg_left / _right (1.58.0), the same pages outside the League hub's dashboard.
schema = "VRFW.menu/2"

[[patch]]
menu = "bb_stadium_top_menu"
res = [
    # 1.5.15: the bracket's own drawings (connector line, crown): content\images\menu\220_img\bbd_tn.toml
    # (1.5.57: the mode selector's atlas bbd_md only on the grid: the selector's layers left this menu)
    "#/menu/220_img/bbd_tn/bbd_tn.g4tx",
    # 1.12.0: the score digits (1.9.0) in an atlas of their own: a g4tx holds at most 255 sprites
    "#/menu/220_img/bbd_tn_num/bbd_tn_num.g4tx",
    # 1.83.0: the retail bracket's digit atlases went with its art to the bracket screen (now VRFW's vrfw_bracket_menu)
]

# ---- objects (1.5.15) --------------------------------------------------------------------------------------------
# a team's plate, left side: the emblem list's row (team06_02_emblem_list_item) on a narrower copy of its layout
# (520 px: plate, crest slot 22 px from the left edge, the name after it); no hit zone (the overlay is keys only),
# no attach to the emblem list's locators; its atlas named (a renamed layout takes the atlas of its own name else)
[[object]]
name = "evt_bbd_tn_row_l"
from = "team06_02_emblem_list_item"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
set = [{ param = "SkeletonAnime", match = { 1 = "common/menu/102_team/team06/team06_02/team06_02.g4pkm" }, values = { 1 = "common/menu/102_team/team06/evt_bbd_tn_row_l/evt_bbd_tn_row_l.g4pkm" } }]
add = [{ block = "gmdMenuObj", param = "Texture", values = ["#/menu/102_team/team06/team06_02/team06_02.g4tx"] }]

# the right side's plate: the same row mirrored: the crest on the outer (right) edge, the name right-aligned
