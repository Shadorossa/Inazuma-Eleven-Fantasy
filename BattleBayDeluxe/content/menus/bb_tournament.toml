# ---- layers ------------------------------------------------------------------------------------------------------
# counts = the largest bracket (T.MAX_SIZE 64 teams, 1.5.44): 32 plates a side (+ the champion's), 63 match scores (results /
# groups pages: 16 plates, 16 values, 4 group titles), 4 x 62 + 3 connector pieces (a match: 2 stubs + 2 half joints;
# the final: 2 stubs + the stem to the champion)
# 1.5.35: + lone crests (evt_bbd_tn_crest; 1.5.44: 32); 1.5.44: 64-team bracket counts
# 1.5.57 (owner in game 2026-10-13: the Battle Bay top menu stayed WHITE): the engine sets up at most ~844 layer
# instances in one open menu (docs/game/ui/menu-layer-limits.md §2.1-§2.2); past it the menu never finishes opening
# (no background open end, no fade in). 1.5.54 (group tables, every group on one page: row_l 64, txt 336, box 112 and
# 304 card / band / mark quads) took bb_stadium_top_menu to 1440. 1.5.57: the 1.5.53 pools (the last build that
# opened) + txt 100, the group tables paged on the bracket's pools.
# 1.5.60 (owner 2026-10-14: the group stage always on ONE page): the group tables are drawn in a menu of their own
# (evt_bbd_tn_groups_menu, the [[screen]] at the end of this file), so this menu keeps only the bracket's pools: txt 64
# (the 63 scores of a 64-team bracket, the 64 goals of a 32-match results page, the champion screen's 2). Budget of
# bb_stadium_top_menu: retail 26 + Utilities (top bar 36) + these 484 = 546.
# 2026-10-19: + the 16-team retail bracket's 50, box 64 -> 36 (a results page draws at most 32 boxes, the tree page
# the final stadium's panel: 2), txt 64 -> 66 (the final stadium's name and label beside a 64-team tree's 63 scores):
# these 508 = 803. Every pool costs its
# instances at every opening: add none without taking as many away.
# 1.8.0 (owner 2026-10-21: the bracket in the Victory Road look): + the Victory Road stadium background (1, below):
# 804. The look's other pieces cost no instance: the team strips are the plates' own sprite swapped, the stars, the
# focus band and the stadium panel are box-pool quads (a tree page: at most 32 + 1 + 1 of 36), the trophy is the
# retail one already in this menu.
# 1.9.0 (owner 2026-10-21: the results as in the Victory Road bracket, two digits stacked at each joint): the scores
# are digit sprites of the mod's atlas on the connector pool, no texts: evt_bbd_tn_line 256 -> 348 (a 64-team tree:
# 251 pieces + 62 pairs + the final's 2 digits + up to 33 shoot-out digits), evt_bbd_tn_txt 66 -> 4 (the final
# stadium's two lines, the champion screen's two): 804 + 92 - 62 = 834.
# 1.12.0: evt_bbd_tn_line 348 -> 330 (up to 15 shoot-out digits on a 64-team tree): 816, a margin under the cap.

# 1.8.0: the Victory Road mode's stadium background (victory_road_top_menu's vroad01_00_background: _bg_v01, 2640 x
# 1080 from x -360, layout in screen px), opened under the bracket by the graft (BBT_Open) behind its pools
# (draw priority 560; its own 200 would draw over them); the band (vroad04_01_p1_bg, 195) stays in front of it
[[patch]]
menu = "bb_stadium_top_menu"
add_layer = { name = "vroad01_00_background", object = "vroad01_00_background", count = 1, align = [1, 8], scale = 0.20000000298023224, groups = [{ group = "bb_stadium_top_menu", flags = [0, 0, 0, 0, 1, 0] }] }

[[patch]]
menu = "bb_stadium_top_menu"
add_layer = { name = "vroad04_01_p1_bg", object = "vroad04_01_p1_bg", count = 1, align = [1, 8], scale = 0.20000000298023224, groups = [{ group = "bb_stadium_top_menu", flags = [0, 0, 0, 0, 1, 0] }] }

# ---- the Victory Road bracket art for a 16-team knockout (2026-10-19) ---------------------------------------------
# The retail objects of victory_road_final_tournament_menu, with their RETAIL layer names: the tree base
# (vroad04_01_tournament_base: the unlit bracket mesh _tournament01) attaches the 16 gold path strips, the trophy, the
# per-round scores and the schedule panel to its own nodes by layer name, and each strip attaches the star instance of
# its slot (vroad04_04_light_on_line, instance 0-15) to the head of its lit part. The graft (bbt_top.lua
# BBT_DrawRetail) places the base at the screen origin (its layout is in screen px), sets each strip's «move» rate
# (0.25 a round won), the score digits and the panel's texts, and draws BBD's own plates at the base's name nodes.
# Only a knockout of exactly 16 teams uses them; every other bracket keeps the generic lines (BBT_DrawTree).
# Not added: the plates of the online tournament (vroad04_05 / soccer00_40 / cmn01_54), the player focus, the
# champion ribbon (BBD's own plates and champion plate are drawn instead).
# Budget of bb_stadium_top_menu: 779 before + these 50 - 28 (evt_bbd_tn_box 64 -> 36) + 2 (evt_bbd_tn_txt 64 -> 66)
# = 803 of the engine's ~844 (docs/game/ui/menu-layer-limits.md §2.1).
[[patch]]
menu = "bb_stadium_top_menu"
add_layer = { name = "vroad04_01_tournament_base", object = "vroad04_01_tournament_base", count = 1, align = [1, 8], scale = 0.20000000298023224, after = "vroad04_01_p1_bg", groups = [{ group = "bb_stadium_top_menu", flags = [0, 0, 0, 0, 1, 0], after = "vroad04_01_p1_bg" }] }

