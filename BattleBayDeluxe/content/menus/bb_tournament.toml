# ---- the group stage's own menu (1.5.60) ---------------------------------------------------------------------------
# Owner 2026-10-14: «que la fase de grupos no se divida nunca en páginas, siempre 1 sola página». Every group on one
# page (16 groups: 4 x 4 cards) takes 642 layer instances, more than the Battle Bay top menu can still hold (779 of the
# engine's ~844 per open menu, docs/game/ui/menu-layer-limits.md §2.1-2.3), so the tables live in a menu of their own,
# with its own budget: a display-only child menu, opened over its host (bb_stadium_top_menu, or soccer_top_menu with
# Inazuma Fantasy's hub) by the overlay while the group page is shown (graft bb_tournament, bbt_top.lua
# BBT_GroupsShow) and closed when another page is shown or the overlay closes. The host keeps the keys, its header
# title and the bracket's background (vroad04_01_p1_bg, 195); this menu only draws the cards and the legend.
# * Registry row: language_option_menu's (the draw class of the host's own menus, 9) with priority 0 (as the retail
#   display-only children chara_model_only_view_menu / fade_menu_encount_*): the engine gives the pad to the menus of
#   the highest priority (contact-map.md §7), so the host (220 / 230) keeps it. No input layer, no focus group, no
#   command row: nothing here can take a key.
# * Setting: chara_model_only_view_menu's (the retail display-only child: one layer group named after the menu, no
#   command, resource, focus or shift row) with its layer list replaced by these five pools, all opened with the
#   menu's group (flags [0, 1, …]); the script hides each instance as the engine sets it up and draws once all are.
# * Counts (the script's N: change both together): 16 tiny cards = card 16, band 49 (header + top-2 tints + the
#   player's row), mark 178 (2 header strokes, 2 qualification bars, 3 separators, 4 points cells a card + the legend's
#   2), row 64, txt 322 (a card's title, 3 labels and 4 x 4 values + the legend's 2); 8 compact cards = 8, 25, 189 (the
#   form dots on the mark pool), 32, 294. Total 16 + 50 + 190 + 64 + 322 = 642 (the framework's budget check warns
#   from 800). Whether the engine's limit is per menu or for every open menu together is still open (§2.1): the
#   script logs, once per opening, the instances requested / set up per pool and the groups drawn.
[[screen]]
name = "evt_bbd_tn_groups_menu"
like = "language_option_menu"
set = { priority = 0 }
base = "chara_model_only_view_menu"
script = "assets/lua/screens/evt_bbd_tn_groups_menu.lua"

[screen.rows]
layer = [
    { layer = "evt_bbd_gt_card", object = "evt_bbd_tn_card", count = 16, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "evt_bbd_gt_band", object = "evt_bbd_tn_band", count = 50, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "evt_bbd_gt_mark", object = "evt_bbd_tn_mark", count = 190, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "evt_bbd_gt_row", object = "evt_bbd_tn_row_l", count = 64, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "evt_bbd_gt_txt", object = "evt_bbd_tn_txt", count = 322, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "evt_bbd_gt_face", object = "evt_bbd_tn_face", count = 12 },
]
