# Battle Bay Deluxe's private online room mode (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §10):
# a 1 vs 1 Battle Bay match between two players with the same gameplay mod set, on the framework's Steam transport
# (never the game's EOS rooms). The room screen is the graft research/grafts/bb_net_room («Multijugador» row of the
# Battle Bay top menu -> «Sala privada»).
#   key        the room mode (CMND_VRFW_NET_CREATE("bbd_1v1"))
#   players    2 (the game's online match is 1 vs 1)
#   game_mode  the game's online mode byte ([g_session]+0x26E2): 4 = Battle Bay (what retail network_menu sets)
#   menu       the online screen the session opens once up: the Battle Bay team select
#   team_pick  "hash": each player's team travels as its team_config hash on the room channel, so every Battle Bay
#              Deluxe page / category can be picked (the retail slot byte only reaches the first 28 rows)
# Draft and Torneo are not played online (owner scope 2026-10-11).

[[VRFW.NetMode]]
key = "bbd_1v1"
players = 2
game_mode = 4
menu = "enjoy_team_select_menu"
team_pick = "hash"
