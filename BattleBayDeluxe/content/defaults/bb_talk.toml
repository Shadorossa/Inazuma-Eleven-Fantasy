# Battle Bay Deluxe: its part of the Estadio BB campaign pre-match talk's defaults (the VR-Framework's
# defaults\bb_talk.toml, docs/framework/bb-prematch.md; merged over it key by key, a later mod wins).
[bb_talk]
# Lip sync of a line with no voice of its own (moved from the framework on 2026-10-14): the silent cues this mod adds
# to the talks' voice bank `ev40` (content/sounds/bb_talk_lip.toml, with their viseme tracks
# assets/sound/<ja|en>/<cue>.p3lip), one per length; `{tenths}` = the length in tenths of a second. A line takes the
# shortest length that covers it (about 13 characters a second).
lip = { cue = "ev40_bbd_lip_{tenths}", seconds = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0] }

# Generic lines of a team with no voiced retail line (owner 2026-10-22: «una pool de 30 textos genéricos»): text keys of
# this mod (text/keys.toml, 9 languages); each team speaks one per side, always the same (crc32 of team id and side over
# the side's keys). The rival side also picks from `rival_pool` (challenges to the other team).
pool = ["bb_chronicle_teams.bb_talk_pool_01", "bb_chronicle_teams.bb_talk_pool_02",
    "bb_chronicle_teams.bb_talk_pool_03", "bb_chronicle_teams.bb_talk_pool_04", "bb_chronicle_teams.bb_talk_pool_05",
    "bb_chronicle_teams.bb_talk_pool_06", "bb_chronicle_teams.bb_talk_pool_07", "bb_chronicle_teams.bb_talk_pool_08",
    "bb_chronicle_teams.bb_talk_pool_09", "bb_chronicle_teams.bb_talk_pool_10", "bb_chronicle_teams.bb_talk_pool_11",
    "bb_chronicle_teams.bb_talk_pool_12", "bb_chronicle_teams.bb_talk_pool_13", "bb_chronicle_teams.bb_talk_pool_15",
    "bb_chronicle_teams.bb_talk_pool_16", "bb_chronicle_teams.bb_talk_pool_17", "bb_chronicle_teams.bb_talk_pool_18",
    "bb_chronicle_teams.bb_talk_pool_19", "bb_chronicle_teams.bb_talk_pool_20", "bb_chronicle_teams.bb_talk_pool_21",
    "bb_chronicle_teams.bb_talk_pool_23", "bb_chronicle_teams.bb_talk_pool_24", "bb_chronicle_teams.bb_talk_pool_25",
    "bb_chronicle_teams.bb_talk_pool_26", "bb_chronicle_teams.bb_talk_pool_27", "bb_chronicle_teams.bb_talk_pool_28",
    "bb_chronicle_teams.bb_talk_pool_29"]
rival_pool = ["bb_chronicle_teams.bb_talk_pool_14", "bb_chronicle_teams.bb_talk_pool_22",
    "bb_chronicle_teams.bb_talk_pool_30"]

# Retail lines (docs/framework/bb-prematch.md «Retail lines»; the mechanism is the VR-Framework's): a team of this mod
# has no BB talk of its own, so its captain speaks a line the game already has for him, with its voice and his pose,
# instead of the default line. The rival and the player's team are arbitrary, so only a GENERIC line fits: no name of a
# team, a player, a place or a story thing (owner 2026-10-22: «Torch» named Raimon). Sources, in this order: the
# captain also leads a retail Battle Bay team (that team's own line, voice and pose, unless the line holds one of
# the rejects below); a line he speaks in the Chronicle pre-match talk of a match against his own team; in any Chronicle
# pre-match talk; in any other talk of the Chronicle chapters he is cast in (owner: «¿186 con voz no has encontrado
# nada que pegue?»: a voiced in-match cry such as «Here I come!»). A side with none keeps the default line (generic,
# silent lip cue).
[bb_talk.retail]
sources = ["bb_captain", "pre_match_own", "pre_match", "chronicle"]
# The chosen lines of these sources get their voice (copied at start into the talks' voice bank, about 70 KB each).
voice_sources = ["pre_match_own", "pre_match", "chronicle"]
# The filters read the English text. A line is kept when it is voiced (its own cue in its talk's bank), one row of 6 to
# 90 characters, a cry (ends in «!»), about the match or fighting spirit (one of `require_words`: a word, or words in a
# row), and holds none of `reject` (a tag: `<...>` names another character; a question) nor of `reject_words` (the
# proper nouns of the game's texts, the techniques and items a line names, a few story words). A retail BB captain's
# own line is only checked against the two rejects.
# `reject` (substrings, English and Spanish text): a tag, a question; a line that speaks to a role of the story team
# (the coach, the manager); a line about a past match or someone gone («since that», «aquel partido», «de vuelta»); a
# condition («If ...», «Si ...») or an agreement («Okay.», «De acuerdo»): it answers something said before.
reject = ["<", "?", "coach", "Coach", "entrenador", "Entrenador", "manager", "Manager", "míster", "Míster",
    "since that", "that match", "aquel partido", "ese partido", "de vuelta", "back!", "If ", "Si ", "Okay.",
    "De acuerdo"]
# The same checks on the Spanish text too (a translation can name a character or a technique where English does not).
check_langs = ["es"]
require_voiced = true
require_end = ["!"]
require_words = ["win", "wins", "winning", "victory", "match", "beat", "crush", "lose", "losing", "opponent",
    "opponents", "challenge", "defeat", "strongest", "battle", "fight", "let's go", "here we go", "here i come",
    "leave it to me", "leave this to me", "count on me", "i won't lose", "we won't lose", "we'll win", "let's win",
    "let's do this", "let's do it", "bring it on", "get ready", "let's play", "show you", "our power", "my power",
    "full power", "all out", "give it our all", "give it everything", "fired up", "here goes", "i'm ready",
    "we're ready", "ready or not", "take you on", "no holding back", "time to play", "let's show", "show them",
    "play some", "real football"]
prefer_end = ["!"]
prefer_voiced = true
max_rows = 1
max_chars = 90
min_chars = 6
