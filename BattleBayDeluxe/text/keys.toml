[it.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Aggiunge le squadre della modalità Cronaca alla Baia Battaglia come squadre selezionabili e avversarie: 221 squadre (l'avversario di ogni partita della Cronaca e le squadre leggendarie), al livello 40, con i loro giocatori, divise, formazioni e stemmi originali e le supertecniche e supertattiche delle loro versioni leggendarie. Gli avversari delle partite si trovano nella categoria «Squadre principali» e le squadre leggendarie in «Squadre secondarie», raggruppate per stagione. La Campagna sorteggia i suoi 7 avversari tra tutte le squadre della Baia Battaglia, non solo quelle della pagina a schermo. Draft: la prima casella delle «Squadre principali»; nella Campagna scegli 1 giocatore su 5 per ciascuno dei 16 posti della tua rosa (gli 11 ruoli della formazione e 5 riserve, nell'ordine che vuoi) e gioca la Campagna con quella squadra. Nessun file del gioco viene sostituito. Torneo: una modalità della schermata della Campagna (Campagna / Torneo nella sua intestazione), un'eliminazione diretta o una fase a gironi ed eliminazione da 4 a 64 squadre della Baia Battaglia sul tabellone di Victory Road; giochi le tue partite (quelle a eliminazione con supplementari e rigori) e le altre vengono simulate."
