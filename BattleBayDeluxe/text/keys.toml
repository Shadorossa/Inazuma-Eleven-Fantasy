[es.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Añade los equipos del modo Crónica a Bahía Batalla como equipos elegibles y rivales: 221 equipos (el rival de cada partido de Crónica y los equipos legendarios), a nivel 40, con sus jugadores, equipaciones, formaciones y escudos originales y las supertécnicas y supertácticas de sus versiones legendarias. Los rivales de los partidos salen en la categoría «Equipos principales» y los equipos legendarios en «Equipos secundarios», agrupados por temporada. La Campaña sortea sus 7 rivales entre todos los equipos de Bahía Batalla, no solo los de la página en pantalla. Draft: la primera casilla de «Equipos principales»; en la Campaña, elige 1 de 5 jugadores para cada uno de los 16 puestos de tu plantilla (las 11 posiciones de la formación y 5 suplentes, en el orden que quieras) y juega la Campaña con ese equipo. No sustituye ningún archivo del juego. Torneo: un modo de la pantalla de Campaña (Campaña / Torneo en su cabecera), una eliminatoria directa o una fase de grupos y eliminatoria de 4 a 64 equipos de Bahía Batalla sobre el cuadro de Victory Road; juegas tus partidos (los de eliminatoria con prórroga y penaltis) y los demás se simulan."
ruleset_bbd_knockout = "Torneo de Bahía Batalla: eliminatoria (prórroga + penaltis)"
ruleset_bbd_final = "Torneo de Bahía Batalla: final (prórroga + penaltis, celebración de campeones)"
