[fr.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Ajoute les équipes du mode Chronique à la Baie Bataille comme équipes sélectionnables et adversaires : 221 équipes (l'adversaire de chaque match de la Chronique et les équipes légendaires), au niveau 40, avec leurs joueurs, maillots, formations et emblèmes d'origine et les supertechniques et supertactiques de leurs versions légendaires. Les adversaires des matchs apparaissent dans la catégorie « Équipes principales » et les équipes légendaires dans « Équipes secondaires », regroupées par saison. La Campagne tire ses 7 adversaires parmi toutes les équipes de la Baie Bataille, pas seulement celles de la page affichée. Draft : la première case des « Équipes principales » ; dans la Campagne, choisis 1 joueur sur 5 pour chacune des 16 places de ton effectif (les 11 postes de la formation et 5 remplaçants, dans l'ordre que tu veux) et joue la Campagne avec cette équipe. Aucun fichier du jeu n'est remplacé. Tournoi : un mode de l'écran de Campagne (Campagne / Tournoi dans son en-tête), une élimination directe ou une phase de groupes et élimination de 4 à 64 équipes de la Baie Bataille sur le tableau de Victory Road ; tu joues tes matchs (ceux à élimination avec prolongation et tirs au but) et les autres sont simulés."
ruleset_bbd_knockout = "Tournoi de la Baie Bataille : élimination (prolongation + tirs au but)"
