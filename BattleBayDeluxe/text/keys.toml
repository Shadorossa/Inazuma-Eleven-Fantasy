[de.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Fügt die Teams des Chronik-Modus als wählbare Teams und Gegner zur Kampfbucht hinzu: 221 Teams (der Gegner jedes Chronik-Spiels und die Legendenteams), auf Level 40, mit ihren ursprünglichen Spielern, Trikots, Formationen und Wappen und den Spezialtechniken und -taktiken ihrer Legendenversionen. Die Gegner der Spiele stehen in der Kategorie „Hauptteams“ und die Legendenteams in „Nebenteams“, nach Staffel gruppiert. Die Kampagne lost ihre 7 Gegner aus allen Teams der Kampfbucht aus, nicht nur aus der angezeigten Seite. Draft: das erste Feld der „Hauptteams“; wähle in der Kampagne für jeden der 16 Plätze deines Kaders 1 von 5 Spielern (die 11 Positionen der Formation und 5 Ersatzspieler, in beliebiger Reihenfolge) und spiele die Kampagne mit diesem Team. Keine Spieldatei wird ersetzt. Turnier: ein Modus des Kampagnen-Bildschirms (Kampagne / Turnier in seiner Kopfleiste), ein K.-o.-System oder eine Gruppenphase mit K.-o.-Runde mit 4 bis 64 Teams der Kampfbucht auf dem Victory-Road-Turnierbaum; du spielst deine Spiele (K.-o.-Spiele mit Verlängerung und Elfmeterschießen), die übrigen werden simuliert."
ruleset_bbd_knockout = "Kampfbucht-Turnier: K.-o. (Verlängerung + Elfmeterschießen)"
ruleset_bbd_final = "Kampfbucht-Turnier: Finale (Verlängerung + Elfmeterschießen, Siegerfeier)"
