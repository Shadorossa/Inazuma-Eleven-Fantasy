schema = "vr_framework.text_key/1"
# «Battle Bay Deluxe» (mod id bb_chronicle_teams; the name is not translated; «Chronicle Teams in Battle Bay» before
# 1.2.0): the mod's name and description on the «Mods» screen, in the game's language
# (docs/framework/mods-panel.md §3.2). The teams' own names are the game's (each team's name_text).

[en.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Adds the Chronicle mode teams to the Battle Bay as a selectable team and rival: 221 teams (the opponent of each Chronicle match and the legend teams), at level 40, with their original players, kits, formations and emblems, and the special moves and tactics of their legend versions. The match rivals are listed in the «Main teams» category and the legend teams in «Secondary teams», grouped by season. The Campaign draws its 7 rivals from every team of the Battle Bay, not only the page on screen. Draft: the first tile of «Main teams»; in the Campaign, pick 1 of 5 players for each of the 16 places of your squad (the 11 positions of the formation and 5 substitutes, in any order) and play the Campaign with that team. No game file is replaced. Tournament: a mode of the Campaign screen (Campaign / Tournament in its header), a straight knockout or a group stage + knockout of 4 to 64 Battle Bay teams on the Victory Road bracket; you play your matches (knockout ones with extra time and penalties) and the others are simulated."
ruleset_bbd_knockout = "Battle Bay tournament: knockout (extra time + penalties)"

[es.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Añade los equipos del modo Crónica a Bahía Batalla como equipos elegibles y rivales: 221 equipos (el rival de cada partido de Crónica y los equipos legendarios), a nivel 40, con sus jugadores, equipaciones, formaciones y escudos originales y las supertécnicas y supertácticas de sus versiones legendarias. Los rivales de los partidos salen en la categoría «Equipos principales» y los equipos legendarios en «Equipos secundarios», agrupados por temporada. La Campaña sortea sus 7 rivales entre todos los equipos de Bahía Batalla, no solo los de la página en pantalla. Draft: la primera casilla de «Equipos principales»; en la Campaña, elige 1 de 5 jugadores para cada uno de los 16 puestos de tu plantilla (las 11 posiciones de la formación y 5 suplentes, en el orden que quieras) y juega la Campaña con ese equipo. No sustituye ningún archivo del juego. Torneo: un modo de la pantalla de Campaña (Campaña / Torneo en su cabecera), una eliminatoria directa o una fase de grupos y eliminatoria de 4 a 64 equipos de Bahía Batalla sobre el cuadro de Victory Road; juegas tus partidos (los de eliminatoria con prórroga y penaltis) y los demás se simulan."
ruleset_bbd_knockout = "Torneo de Bahía Batalla: eliminatoria (prórroga + penaltis)"

[fr.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Ajoute les équipes du mode Chronique à la Baie Bataille comme équipes sélectionnables et adversaires : 221 équipes (l'adversaire de chaque match de la Chronique et les équipes légendaires), au niveau 40, avec leurs joueurs, maillots, formations et emblèmes d'origine et les supertechniques et supertactiques de leurs versions légendaires. Les adversaires des matchs apparaissent dans la catégorie « Équipes principales » et les équipes légendaires dans « Équipes secondaires », regroupées par saison. La Campagne tire ses 7 adversaires parmi toutes les équipes de la Baie Bataille, pas seulement celles de la page affichée. Draft : la première case des « Équipes principales » ; dans la Campagne, choisis 1 joueur sur 5 pour chacune des 16 places de ton effectif (les 11 postes de la formation et 5 remplaçants, dans l'ordre que tu veux) et joue la Campagne avec cette équipe. Aucun fichier du jeu n'est remplacé. Tournoi : un mode de l'écran de Campagne (Campagne / Tournoi dans son en-tête), une élimination directe ou une phase de groupes et élimination de 4 à 64 équipes de la Baie Bataille sur le tableau de Victory Road ; tu joues tes matchs (ceux à élimination avec prolongation et tirs au but) et les autres sont simulés."
ruleset_bbd_knockout = "Tournoi de la Baie Bataille : élimination (prolongation + tirs au but)"

[de.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Fügt die Teams des Chronik-Modus als wählbare Teams und Gegner zur Kampfbucht hinzu: 221 Teams (der Gegner jedes Chronik-Spiels und die Legendenteams), auf Level 40, mit ihren ursprünglichen Spielern, Trikots, Formationen und Wappen und den Spezialtechniken und -taktiken ihrer Legendenversionen. Die Gegner der Spiele stehen in der Kategorie „Hauptteams“ und die Legendenteams in „Nebenteams“, nach Staffel gruppiert. Die Kampagne lost ihre 7 Gegner aus allen Teams der Kampfbucht aus, nicht nur aus der angezeigten Seite. Draft: das erste Feld der „Hauptteams“; wähle in der Kampagne für jeden der 16 Plätze deines Kaders 1 von 5 Spielern (die 11 Positionen der Formation und 5 Ersatzspieler, in beliebiger Reihenfolge) und spiele die Kampagne mit diesem Team. Keine Spieldatei wird ersetzt. Turnier: ein Modus des Kampagnen-Bildschirms (Kampagne / Turnier in seiner Kopfleiste), ein K.-o.-System oder eine Gruppenphase mit K.-o.-Runde mit 4 bis 64 Teams der Kampfbucht auf dem Victory-Road-Turnierbaum; du spielst deine Spiele (K.-o.-Spiele mit Verlängerung und Elfmeterschießen), die übrigen werden simuliert."
ruleset_bbd_knockout = "Kampfbucht-Turnier: K.-o. (Verlängerung + Elfmeterschießen)"

[it.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Aggiunge le squadre della modalità Cronaca alla Baia Battaglia come squadre selezionabili e avversarie: 221 squadre (l'avversario di ogni partita della Cronaca e le squadre leggendarie), al livello 40, con i loro giocatori, divise, formazioni e stemmi originali e le supertecniche e supertattiche delle loro versioni leggendarie. Gli avversari delle partite si trovano nella categoria «Squadre principali» e le squadre leggendarie in «Squadre secondarie», raggruppate per stagione. La Campagna sorteggia i suoi 7 avversari tra tutte le squadre della Baia Battaglia, non solo quelle della pagina a schermo. Draft: la prima casella delle «Squadre principali»; nella Campagna scegli 1 giocatore su 5 per ciascuno dei 16 posti della tua rosa (gli 11 ruoli della formazione e 5 riserve, nell'ordine che vuoi) e gioca la Campagna con quella squadra. Nessun file del gioco viene sostituito. Torneo: una modalità della schermata della Campagna (Campagna / Torneo nella sua intestazione), un'eliminazione diretta o una fase a gironi ed eliminazione da 4 a 64 squadre della Baia Battaglia sul tabellone di Victory Road; giochi le tue partite (quelle a eliminazione con supplementari e rigori) e le altre vengono simulate."
ruleset_bbd_knockout = "Torneo della Baia Battaglia: eliminazione (supplementari + rigori)"

[pt.new]
mod_name = "Battle Bay Deluxe"
mod_description = "Adiciona os times do modo Crônica à Baía Batalha como times selecionáveis e rivais: 221 times (o rival de cada partida da Crônica e os times lendários), no nível 40, com seus jogadores, uniformes, formações e escudos originais e as supertécnicas e supertáticas de suas versões lendárias. Os rivais das partidas aparecem na categoria «Times principais» e os times lendários em «Times secundários», agrupados por temporada. A Campanha sorteia seus 7 rivais entre todos os times da Baía Batalha, não só os da página na tela. Draft: o primeiro quadro de «Times principais»; na Campanha, escolha 1 de 5 jogadores para cada uma das 16 vagas do seu elenco (as 11 posições da formação e 5 reservas, na ordem que quiser) e jogue a Campanha com esse time. Nenhum arquivo do jogo é substituído. Torneio: um modo da tela de Campanha (Campanha / Torneio no seu cabeçalho), uma eliminatória direta ou fase de grupos e eliminatória de 4 a 64 times da Baía Batalha na chave de Victory Road; você joga suas partidas (as eliminatórias com prorrogação e pênaltis) e as demais são simuladas."
ruleset_bbd_knockout = "Torneio da Baía Batalha: eliminatória (prorrogação + pênaltis)"

[ja.new]
mod_name = "Battle Bay Deluxe"
mod_description = "クロニクルモードのチームを、BBスタジアムで選べるチーム・対戦相手として追加します：221チーム（クロニクルの各試合の対戦相手とレジェンドチーム）、レベル40、元の選手・ユニフォーム・フォーメーション・エンブレムに、レジェンド版の必殺技と必殺タクティクス。試合の対戦相手は「メインチーム」、レジェンドチームは「サブチーム」カテゴリに、シーズンごとにまとめて表示されます。キャンペーンの7つの対戦相手は、画面のページだけでなくBBスタジアムの全チームから選ばれます。ドラフト：「メインチーム」の最初のマス。キャンペーンで、チームの16枠（フォーメーションの11ポジションと控え5人、好きな順番で）それぞれに5人から1人を選び、そのチームでキャンペーンに挑みます。ゲームのファイルは置き換えません。トーナメント：キャンペーン画面のモード（ヘッダーのキャンペーン／トーナメント）で、BBスタジアムの4〜64チームによるノックアウト方式またはグループステージ＋ノックアウトを、Victory Roadのトーナメント表で。自分の試合をプレイし（ノックアウトは延長戦とPK戦あり）、他の試合はシミュレートされます。"
ruleset_bbd_knockout = "BBトーナメント：ノックアウト（延長＋PK戦）"

[zh_hans.new]
mod_name = "Battle Bay Deluxe"
mod_description = "将编年史模式的队伍加入BB体育场，作为可选择的队伍和对手：221支队伍（编年史每场比赛的对手和传奇队伍），等级40，保留原有的球员、球衣、阵型和队徽，并使用其传奇版本的必杀技和必杀战术。比赛对手显示在“主要队伍”分类中，传奇队伍显示在“次要队伍”中，按赛季分组。战役的7个对手从BB体育场的所有队伍中抽取，而不仅是屏幕上的那一页。选秀：“主要队伍”的第一格；在战役中，为阵容的16个位置（阵型的11个位置和5名替补，顺序随意）各从5名球员中选择1名，并用这支队伍进行战役。不替换任何游戏文件。锦标赛：战役画面的一种模式（标题栏中的战役／锦标赛），进行由4至64支BB球队参加的单场淘汰赛或小组赛＋淘汰赛，使用Victory Road的对阵表；你亲自进行自己的比赛（淘汰赛有加时和点球大战），其他比赛自动模拟。"
ruleset_bbd_knockout = "BB锦标赛：淘汰赛（加时＋点球）"

[zh_hant.new]
mod_name = "Battle Bay Deluxe"
mod_description = "將編年史模式的隊伍加入BB體育場，作為可選擇的隊伍和對手：221支隊伍（編年史每場比賽的對手和傳奇隊伍），等級40，保留原有的球員、球衣、陣型和隊徽，並使用其傳奇版本的必殺技和必殺戰術。比賽對手顯示在「主要隊伍」分類中，傳奇隊伍顯示在「次要隊伍」中，按賽季分組。戰役的7個對手從BB體育場的所有隊伍中抽取，而不只是畫面上的那一頁。選秀：「主要隊伍」的第一格；在戰役中，為陣容的16個位置（陣型的11個位置和5名替補，順序隨意）各從5名球員中選擇1名，並用這支隊伍進行戰役。不替換任何遊戲檔案。錦標賽：戰役畫面的一種模式（標題列中的戰役／錦標賽），進行由4至64支BB球隊參加的單場淘汰賽或小組賽＋淘汰賽，使用Victory Road的對陣表；你親自進行自己的比賽（淘汰賽有延長賽和PK大戰），其他比賽自動模擬。"
ruleset_bbd_knockout = "BB錦標賽：淘汰賽（延長＋PK）"
