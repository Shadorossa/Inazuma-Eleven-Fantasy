id = "hissatsu_effects"
# «Hissatsu Effects» (provisional name, owner 2026-10-14). Split out of Inazuma Fantasy (its _phases.toml part
# technique_fx + the move card's effect page of its part skill_table): gameplay mini-effects of RETAIL special moves,
# framework keys only (technique / effect types, no DLL), and the «Habilidades» move card page that shows them.
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description
# (text\keys.toml) in the game's language.
name = "Hissatsu Effects"
prefix = "HissatsuEffects"
folder = "HissatsuEffects"
version = "1.0.9"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Gameplay effects for special moves of the game. Excalibur gets stronger the farther it flies and is also a counter shot; Doom Rain splits into 7 balls that blocks take away one by one; Electric Trap locks the shot it stops; Needle Hammer steals tension; Grand Fire gains power for each fire team mate; Emperor Penguin No. 1 spends PE for more power (with Inazuma Fantasy's PE); Power Shield clears the ball low. Double Tornado takes the elements of its two performers, with its tornadoes recoloured to match. The move card of the Habilidades list gets a second page (Q / E, LT / RT) that explains the move's effect. With Living Shots on, the shots also get its flights and auras."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-15"
# vr_framework: the technique type's mini-effect / ball / dual-element keys and CMND_VRFW_TECHNIQUE_BALL_EFFECT /
# CMND_VRFW_TECHNIQUE_MINI_FX (the card page), the effect type's [[recolor]], the core's if_mod / if_not_mod.
# shot_fx (Living Shots) is optional (not in requires) and owns every visual part (flights, auras, the hidden real ball of
# Doom Rain); this mod is gameplay only. Living Shots adds only hide_ball to its Doom Rain split_shot (merged key by
# key since VRFW 2.4.7).
# Inazuma Fantasy is not needed; with it, Emperor Penguin No. 1 pays its PE (IF's module stamina).
# hissatsu_reforged: its base (the special-move balance, the double icon its Excalibur shows); this mod is one of its
# modules (below).
requires = ["vr_framework>=2.4.13", "hissatsu_reforged>=1.0.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# lua_early (1.0.5, 2026-10-14): its move card patch of ability_list_menu (graft skill_card) promotes the script's
# locals and redefines OnInit / OnSetupLayer / OnChangeFocus / ... It must run BEFORE the VR-Framework's host of that
# script (docs/framework/lua-hosts.md §2, §5): run after it, it dropped the host's dispatchers, so the framework's
# skill tab handlers (menu lua _all/22_skill_tabs.lua: icons / titles / filters of the declared tabs, the spare tab
# plates) never ran. Early, the host sits on top of these functions and serves their promoted locals.
lua_early = true
permissions = []

[exports]
functions = []
keys = []

# A MODULE of Hissatsu Reforged (owner request 2026-10-14, docs/framework/mod-families.md): the Mods screen, the ModManager
# and `vrfw list` show it inside Hissatsu Reforged's entry («Módulos y ajustes»: on / off); switching Hissatsu Reforged
# off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "hissatsu_reforged"
order = 10
