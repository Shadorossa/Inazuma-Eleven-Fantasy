en = "Clears the ball{dist}{height}{dir}."
fr = "Dégage le ballon{dist}{height}{dir}."
de = "Wehrt den Ball{dist}{height}{dir} ab."
it = "Respinge il pallone{dist}{height}{dir}."
pt = "Afasta a bola{dist}{height}{dir}."
ja = "ボールを{dir}{dist}{height}クリアする。"
zh_hans = "将球{height}{dir}解围{dist}。"
zh_hant = "將球{height}{dir}解圍{dist}。"

