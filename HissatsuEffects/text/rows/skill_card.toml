# Shot / keeper mini-effects (docs/framework/technique.md §4e, CMND_VRFW_TECHNIQUE_MINI_FX): one sentence per effect,
# joined with a space when a move has several (shown after the ball sentence when a move has both).
[[row]]
id = "evt_skc_fx_distance"  # distance_falloff = "inverted" (Excálibur)
es = "Cuanto más lejos, más potente."
en = "The farther it flies, the stronger it gets."
fr = "Plus il vient de loin, plus il est puissant."
de = "Je weiter der Schuss fliegt, desto stärker wird er."
it = "Più è lontano, più è potente."
pt = "Quanto mais longe, mais forte."
ja = "遠くから撃つほど威力が上がる。"
zh_hans = "距离越远，威力越强。"
zh_hant = "距離越遠，威力越強。"

[[row]]
id = "evt_skc_fx_lock"  # on_win_lock_opponent_move = true (Malla eléctrica)
es = "Bloquea la supertécnica del rival hasta que vuelvas a usarla."
en = "Locks the rival's special move until you use this one again."
fr = "Bloque la supertechnique adverse jusqu'à ce que tu la réutilises."
de = "Sperrt die Spezialtechnik des Gegners, bis du diese erneut einsetzt."
it = "Blocca la supertecnica avversaria finché non la riusi."
pt = "Bloqueia a supertécnica do rival até a voltares a usar."
ja = "再び使うまで、相手の必殺技を封じる。"
zh_hans = "封印对手的必杀技，直到再次使用此招。"
zh_hant = "封印對手的必殺技，直到再次使用此招。"

[[row]]
id = "evt_skc_fx_pe"  # pe_sacrifice (Pingüino emperador nº1); {pct} = the share of the current PE (15)
es = "Gasta un {pct} % de PE para aumentar su potencia."
en = "Spends {pct}% of GP to boost its power."
fr = "Dépense {pct} % de PE pour augmenter sa puissance."
de = "Verbraucht {pct} % KP, um seine Stärke zu erhöhen."
it = "Consuma il {pct}% di PE per aumentarne la potenza."
pt = "Gasta {pct}% de PE para aumentar a sua potência."
ja = "PEを{pct}%消費して威力を上げる。"
zh_hans = "消耗{pct}%的PE来提升威力。"
zh_hant = "消耗{pct}%的PE來提升威力。"

[[row]]
id = "evt_skc_fx_participants"  # power_per_participant (Fuego total); {pct} = percent per performer, {element} = evt_skc_elem_N
es = "+{pct} % de potencia por cada compañero de elemento {element} que la realiza."
en = "+{pct}% power for each {element} team mate performing it."
fr = "+{pct} % de puissance par coéquipier d'élément {element} qui l'exécute."
de = "+{pct} % Stärke für jeden ausführenden Mitspieler vom Element {element}."
it = "+{pct}% di potenza per ogni compagno di elemento {element} che la esegue."
pt = "+{pct}% de potência por cada colega de elemento {element} que a executa."
ja = "技を行う{element}属性の仲間1人につき威力+{pct}%。"
zh_hans = "每有一名{element}属性队友参与，威力+{pct}%。"
zh_hant = "每有一名{element}屬性隊友參與，威力+{pct}%。"

[[row]]
id = "evt_skc_fx_participants_any"  # power_per_participant with element "any" / "void"
es = "+{pct} % de potencia por cada compañero que la realiza."
en = "+{pct}% power for each team mate performing it."
fr = "+{pct} % de puissance par coéquipier qui l'exécute."
de = "+{pct} % Stärke für jeden ausführenden Mitspieler."
it = "+{pct}% di potenza per ogni compagno che la esegue."
pt = "+{pct}% de potência por cada colega que a executa."
ja = "技を行う仲間1人につき威力+{pct}%。"
zh_hans = "每有一名队友参与，威力+{pct}%。"
zh_hant = "每有一名隊友參與，威力+{pct}%。"

[[row]]
id = "evt_skc_fx_steal"  # on_win_steal_tension (Martillo defensor); {pct} = share of the shot's tension cost (15)
es = "Si para el tiro, gana un {pct} % de la tensión que gastó el rival."
en = "If it stops the shot, gains {pct}% of the tension the rival spent."
fr = "S'il arrête le tir, récupère {pct} % de la tension dépensée par l'adversaire."
de = "Hält er den Schuss, erhält er {pct} % der Spannung, die der Gegner verbraucht hat."
it = "Se para il tiro, ottiene il {pct}% della tensione spesa dall'avversario."
pt = "Se defender o remate, ganha {pct}% da tensão que o rival gastou."
ja = "シュートを止めると、相手が使ったテンションの{pct}%を得る。"
zh_hans = "若挡下射门，获得对手所耗气势的{pct}%。"
zh_hant = "若擋下射門，獲得對手所耗氣勢的{pct}%。"

[[row]]
id = "evt_skc_fx_dive"  # trajectory = "dive" (Lanza letal): Bezier arc; unblockable on a long shot
es = "El balón sube y cae en picado sobre la portería; en un tiro lejano, los bloqueos no pueden pararlo."
en = "The ball rises and dives into the goal; on a long shot, blocks cannot stop it."
fr = "Le ballon monte puis plonge sur le but ; sur un tir de loin, les contres ne peuvent pas l'arrêter."
de = "Der Ball steigt und stürzt ins Tor; bei einem Fernschuss können Blocks ihn nicht aufhalten."
it = "Il pallone sale e piomba in porta; su un tiro da lontano, i blocchi non possono fermarlo."
pt = "A bola sobe e cai a pique sobre a baliza; num remate de longe, os bloqueios não a param."
ja = "ボールが上昇し、ゴールへ急降下する。ロングシュートではブロックで止められない。"
zh_hans = "球升起后俯冲入门；远射时封堵无法拦下。"
zh_hant = "球升起後俯衝入門；遠射時封堵無法攔下。"

[[row]]
id = "evt_skc_fx_dive_plain"  # trajectory = { mode = "dive", unblockable = false }
es = "El balón sube y cae en picado sobre la portería."
en = "The ball rises and dives into the goal."
fr = "Le ballon monte puis plonge sur le but."
de = "Der Ball steigt und stürzt ins Tor."
it = "Il pallone sale e piomba in porta."
pt = "A bola sobe e cai a pique sobre a baliza."
