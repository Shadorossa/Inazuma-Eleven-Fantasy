schema = "VRFW.text/2"
# Hissatsu Effects (moved out of Inazuma Fantasy 2026-10-14). Hand-written (edit freely): texts of the «Habilidades» move card's second page (Q / E, pad LT / RT: the move's ball
# mini-effect, CMND_VRFW_TECHNIQUE_BALL_EFFECT). Read by the graft research/grafts/skill_card (CMND_TEXT_GET of
# crc32(id)). docs/framework/technique.md §4b.
# The page is the title evt_skc_title (centred, Nacho 2026-10-06) over ONE plain sentence built from the effect data
# (no metres / degrees):
#   evt_skc_sentence with {dist} {height} {dir} filled from the pieces below (a piece carries its own leading space /
#   punctuation, "" when that part is the game's own); an effect with no known part shows evt_skc_generic.
#   distance: <= 18 m short, <= 30 m mid, longer long; height: launch >= 40° high, <= 15° low; direction: forward.
# Only characters every menu font has (no °, ·, ˚).
table = "menu_text"

[[row]]
id = "evt_skc_guide_effect"  # button guide label on the description page
es = "Efecto"
en = "Effect"
fr = "Effet"
de = "Effekt"
it = "Effetto"
pt = "Efeito"
ja = "効果"
zh_hans = "效果"
zh_hant = "效果"

[[row]]
id = "evt_skc_guide_desc"  # button guide label on the effect page
es = "Descripción"
en = "Description"
fr = "Description"
de = "Beschreibung"
it = "Descrizione"
pt = "Descrição"
ja = "説明"
zh_hans = "说明"
zh_hant = "說明"

[[row]]
id = "evt_skc_sentence"  # the effect page: {dist} {height} {dir} = the pieces below
