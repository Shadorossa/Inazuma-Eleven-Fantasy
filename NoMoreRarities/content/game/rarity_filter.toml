schema = "VRFW.game/2"

# No More Rarities › where the «Rareza» tab of the two filter windows («FILTRAR» of the player lists and of the fichas
# list) starts: config.toml [rarity_filter] first_listed_rarity (default 5: the removed 1★-4★ rarities and the 5★
# normal card have no box; every normal card is rarity 4 and always passes a specific set, graft
# no_more_rarities_filter). docs/game/characters/rarity-removal.md §8. Split out of Inazuma Fantasy's
# content\game\rarity_filter.toml on 2026-10-14 (the patches were Fantasy.Rarity*Mov / *First / *Nop; nothing saved
# names them); Inazuma Fantasy keeps its Prime entry on the same four loops (the call stubs and the loop ends).
#
# The tab's items are not data: each list view builds them with a hard-coded loop (twice: the tab builder and the full
# rebuild = 4 sites), then pairs them two per row under «Todos»:
#   +0          mov r9d, <zero reg> + alignment nop    <- mov r9d, first listed rarity (0 = every rarity, as the game)
#   +head       xor r8d, r8d; mov edx, r9d; mov rcx, rbx
#   +head+9     call AddTempItem(this, value, option 0, sortKey r9d)
#   +head+14    inc r9d; cmp r9d, 9
#   +head+21    jb loop
# Item values stay rarity values, so the Lua (texture t6[value + 1]), the filter params {5, rarity, 0} / «Todos»
# {9, 5, 0}, the engine filter and the filter state in the save (one bit per rarity, bit 0x6F0 + rarity) keep their
# meaning.

# ---- CMenuListViewCharaFilter (player filter window), builder of the «Rareza» tab 0x1029460
[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaTabMov"
edit = "Card.RarityCharaTab.MoveRewrite"

[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaTabFirst"
game = "Card.RarityCharaTab.First"
expect = ["CF 66 0F 1F", "?? 00 00 00"]
value = { config = "rarity_filter.first_listed_rarity", default = 5, min = 0, max = 8 }
width = "u32"
needs = ["NoMoreRarities.RarityCharaTabMov"]

[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaTabNop"
edit = "Card.RarityCharaTab.SkipRewrite"
needs = ["NoMoreRarities.RarityCharaTabMov"]

# ---- CMenuListViewCharaFilter, the same loop in the full rebuild switch 0x1029E00 (case rarity)
[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaRebuildMov"
edit = "Card.RarityCharaRebuild.MoveRewrite"

[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaRebuildFirst"
game = "Card.RarityCharaRebuild.First"
expect = ["CE 0F 1F 44", "?? 00 00 00"]
value = { config = "rarity_filter.first_listed_rarity", default = 5, min = 0, max = 8 }
width = "u32"
needs = ["NoMoreRarities.RarityCharaRebuildMov"]

[[VRFW.Patch]]
name = "NoMoreRarities.RarityCharaRebuildNop"
edit = "Card.RarityCharaRebuild.SkipRewrite"
needs = ["NoMoreRarities.RarityCharaRebuildMov"]

# ---- CMenuListViewSoccerSpiritFilter (ficha filter window), builder of the «Rareza» tab 0x11996E0
[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritTabMov"
edit = "Card.RaritySpiritTab.MoveRewrite"

[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritTabFirst"
game = "Card.RaritySpiritTab.First"
expect = ["C9 66 66 66", "?? 00 00 00"]
value = { config = "rarity_filter.first_listed_rarity", default = 5, min = 0, max = 8 }
width = "u32"
needs = ["NoMoreRarities.RaritySpiritTabMov"]

[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritTabNop"
edit = "Card.RaritySpiritTab.SkipRewrite"
needs = ["NoMoreRarities.RaritySpiritTabMov"]

# ---- CMenuListViewSoccerSpiritFilter, the loop in its full rebuild switch
[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritRebuildMov"
edit = "Card.RaritySpiritRebuild.MoveRewrite"

[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritRebuildFirst"
game = "Card.RaritySpiritRebuild.First"
expect = ["CE 0F 1F 84", "?? 00 00 00"]
value = { config = "rarity_filter.first_listed_rarity", default = 5, min = 0, max = 8 }
width = "u32"
needs = ["NoMoreRarities.RaritySpiritRebuildMov"]

[[VRFW.Patch]]
name = "NoMoreRarities.RaritySpiritRebuildNop"
edit = "Card.RaritySpiritRebuild.SkipRewrite"
needs = ["NoMoreRarities.RaritySpiritRebuildMov"]
