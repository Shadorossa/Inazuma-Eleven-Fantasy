schema = "VRFW.text_key/1"
# The mod's name and description on the «Mods» screen, in the game's language (docs/framework/mods-panel.md §3.2).

[en.new]
mod_name = "Career Mode"
mod_description = "A mode in the title's «Game modes». Start a career with a Battle Bay Deluxe club: a Swiss SuperLiga of 12 rounds with every club, a pot draw of the best 56 into 4 leagues of 14 (home and away), then the single-match Football Frontier, where the final wins the cup. You play your matches, the rest are simulated. Every player is in one club only; squads of 16. One career per save slot."

[es.new]
mod_name = "Modo carrera"
mod_description = "Un modo en «Modos de juego» del título. Empieza una carrera con un club de Battle Bay Deluxe: una SuperLiga suiza de 12 rondas con todos los clubes, un sorteo en bombos de los 56 mejores en 4 ligas de 14 (ida y vuelta) y el Fútbol Frontier a partido único, cuya final da la copa. Juegas tus partidos; el resto se simula. Cada jugador está en un solo club; plantillas de 16. Una carrera por ranura de guardado."

[fr.new]
mod_name = "Mode Carrière"
mod_description = "Un mode dans «Modes de jeu» du titre. Commence une carrière avec un club de Battle Bay Deluxe : une SuperLigue suisse de 12 tours avec tous les clubs, un tirage par chapeaux des 56 meilleurs en 4 ligues de 14 (aller-retour), puis le Football Frontier sur un match, dont la finale donne la coupe. Tu joues tes matchs, le reste est simulé. Chaque joueur est dans un seul club ; effectifs de 16. Une carrière par emplacement de sauvegarde."

[de.new]
mod_name = "Karrieremodus"
mod_description = "Ein Modus in den «Spielmodi» des Titelbildschirms. Starte eine Karriere mit einem Verein von Battle Bay Deluxe: eine Schweizer SuperLiga mit 12 Runden und allen Vereinen, eine Auslosung der besten 56 aus Lostöpfen in 4 Ligen mit 14 (Hin- und Rückspiel), dann der Football Frontier mit Einzelspielen, dessen Finale den Pokal bringt. Du spielst deine Spiele, der Rest wird simuliert. Jeder Spieler ist nur in einem Verein; Kader mit 16. Eine Karriere pro Speicherplatz."

[it.new]
mod_name = "Modalità carriera"
mod_description = "Una modalità in «Modalità di gioco» del titolo. Inizia una carriera con un club di Battle Bay Deluxe: una SuperLega svizzera di 12 turni con tutti i club, un sorteggio a urne dei migliori 56 in 4 leghe da 14 (andata e ritorno), poi il Football Frontier a gara secca, la cui finale vale la coppa. Giochi le tue partite, il resto è simulato. Ogni giocatore è in un solo club; rose da 16. Una carriera per slot di salvataggio."

[pt.new]
mod_name = "Modo carreira"
mod_description = "Um modo em «Modos de jogo» do título. Começa uma carreira com um clube do Battle Bay Deluxe: uma SuperLiga suíça de 12 rondas com todos os clubes, um sorteio por potes dos 56 melhores em 4 ligas de 14 (ida e volta) e o Futebol Frontier a jogo único, cuja final dá a taça. Jogas os teus jogos, o resto é simulado. Cada jogador está num só clube; plantéis de 16. Uma carreira por ranhura de gravação."

[ja.new]
mod_name = "キャリアモード"
mod_description = "タイトルの「ゲームモード」にあるモード。Battle Bay Deluxeのクラブでキャリアを始めよう：全クラブ参加の12ラウンドのスイス式スーパーリーグ、上位56クラブをポット抽選で14チームのリーグ4つに分け（ホーム＆アウェー）、最後は一発勝負のフットボールフロンティア。決勝に勝てばトロフィー。自分の試合はプレイし、ほかはシミュレート。選手は1クラブのみ、メンバーは16人。セーブスロットごとにキャリアはひとつ。"

[zh_hans.new]
mod_name = "生涯模式"
mod_description = "位于标题「游戏模式」中的模式。用一支Battle Bay Deluxe俱乐部开始生涯：全部俱乐部参加的12轮瑞士制超级联赛，前56名抽签分档组成4个14队联赛（主客场），最后是单场淘汰的足球边境大赛，赢下决赛即可捧杯。你踢自己的比赛，其余模拟。每名球员只属一家俱乐部，阵容16人。每个存档位一个生涯。"

[zh_hant.new]
mod_name = "生涯模式"
mod_description = "位於標題「遊戲模式」中的模式。用一支Battle Bay Deluxe俱樂部開始生涯：全部俱樂部參加的12輪瑞士制超級聯賽，前56名抽籤分檔組成4個14隊聯賽（主客場），最後是單場淘汰的足球邊境大賽，贏下決賽即可捧盃。你踢自己的比賽，其餘模擬。每名球員只屬一家俱樂部，陣容16人。每個存檔位一個生涯。"
