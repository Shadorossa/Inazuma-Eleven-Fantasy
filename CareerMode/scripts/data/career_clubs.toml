# Career mode: the career's clubs (owner 2026-10-30; config.toml [squads] clubs_file). Edit freely.
# Every career team (Battle Bay Deluxe's clubs and the game's own Battle Bay teams, config.toml [teams]) is a club of its
# own unless listed here:
# * [[club]]: one club made of several versions of a team. `key` = the team that gives the club its name, crest, kit and
#   roster rows; `versions` = the other teams whose players join its squad (a person once; each player still belongs to
#   the earliest version that has him, scripts/data/club_order.toml). The versions are no clubs of their own.
# * drop: teams that are no career club (their players go to the other clubs that have them, else to the free players).
# A club enters a career with config.toml [squads] min_players own players or more; the squad keeps every own player
# (it may pass fill_to) and a match takes [match] squad_size of them.

