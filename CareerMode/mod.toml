id = "CareerMode"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Career Mode"
version = "0.134.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Career mode, in the title row group «Game modes». Start a career with a club and play its season. The clubs are Battle Bay Deluxe's and the game's own Battle Bay teams; the versions of one club in several games are one club (content/career/clubs.toml, editable), its squad all their players: the SuperLiga (every club, a Swiss system of 12 rounds), the draw of the best 56 into 4 leagues of 14 (14 pots of 4, drawn ball by ball on screen), 26 home-and-away matchdays, then the Football Frontier (single matches: places 1-2 of each league go to the round of 16, places 3-6 play a round of 32; winning the final plays Battle Bay Deluxe's trophy lift). You play your club's matches, the other results are simulated; a club out of the season sees it and starts the next one. Every player exists once in a career: a player shared by several clubs stays with his earliest club in the story, the clubs that keep 11 of their own players enter, and their squads are completed to 16 with free players of the same position and strength (the same game first, drawn per career); a squad keeps every own player; a match takes 19 of them (the player picks his club's call-up on «Convocatoria», a rival plays its best); the «Plantilla» tab is the game's own team screen with the club (formation, starters and bench, kit, crest, coach, player pages), kept by the career and played in its matches; the «Mercado» tab is a transfer market inside the windows (buy at the club's asking price or sign free players, each of your players listed for sale, listed for loan (loan offers: a fee and a length, he plays for the borrower and comes back) or blocked (no offers; unlisted players get a bid now and then), answer the AI clubs' offers on «En venta» (accept, refuse, or «Negociar» a transfer: ask a higher price and the bidder answers in a few days, as news, with the price agreed, a better bid or walking away; in every talk each offer or ask costs the other club patience by how far it is from what it accepts (its demand by club), shown before it is sent, and at none it breaks off), the AI clubs also trade; a player's value from his career level, the room to his potential, form, recent rise and position, the price his club asks from his role there (star, starter, reserve), the club's stature and its need at his position, worked out again each matchday; the mode's own money; the bar's sections «Buscar» (L2 / R2) and «En venta»: the «Buscar» list scrolls through every player with a name search, filters (position, club, level, price, series, free agents, affordable) and orders (rating, price, value, potential, form), «En venta» lists the offers received; the player card shows his rating, last match scores, value, the club's asking price and the budget after it, or the offer); a squad holds 24 players at most, every signing on the bench; every list shows each player's miniface in the kit of the side he plays for. Every fixture has a date (FIFA-style calendar from config.toml [calendar]: the season starts on August 1, the final is played by June 1; the transfer windows of August and January and the World Cup's days are shown on the calendar and on the hub). National sides (the FFI of IE3, Galaxy's Asian qualifiers, Orion) play no club competition: their players may also be signed by a club. After the Frontier final, the World Cup: one national team per country (the versions of a country in several games are one country, config.toml [[world_cup.countries]]), today 24 countries (Galaxy's planets Sílice, Naiadi, Magmavís, Fertilia and Falam Medius among them) in 6 groups of 4, the first two and the 4 best thirds to the round of 16; the player is offered one country at random and picks its squad among every player of that nationality. The career hub has tabs (home, calendar by month, competition: each competition by name, its table or bracket; the World Cup's groups together, then its bracket, squad). «Inicio» has a news feed, never empty (the season's opening: the club's presentation, the title favourite, the board's goals; each matchday's result, player of the matchday and next rival; signings, sales, offers, table changes and new leaders, the Fútbol Frontier and World Cup, the transfer windows; an empty feed is filled when a career loads), each card with the player posing in 3D in the kit of his club (VRFW_ModelCard). After the club pick, the new career's options (config.toml [setup]): the transfer market on or off (off: no «Mercado» tab, no transfers, the squads stay as they start), the financial backing (an amount added to the club's first budget, many steps), how hard the AI clubs negotiate with the player, how often they trade, and whether the board may sack him. Inside the career no player's special moves, auras or Mix-Max can be changed: the skill board only shows them (the VR-Framework's skill board lock). As in Battle Bay Deluxe, a career has no player passives: in its menus and matches every passive slot, own passive and team bonus is off (Utilities' «Modes without passives», the mode key careermode.career). The board sets objectives each season from the club's place in the rating order (config.toml [board]: a SuperLiga place, a league place, a Fútbol Frontier round), shown on «Inicio» and on the setup screen; it warns in the news once the SuperLiga is over and halfway through the league, and with the «sacking» option on, missing the league objective and one other ends the career («Despedido»: its pages stay to look at, nothing more is played). Every player has a career level of his own («media», the level the game shows and gives him in his club and on the team screen, 60-94 at the start from his growth rank, fame and stats; 99 only by growth), a potential and a form (-3..+3) from his last 5 matches; he plays each match at level + form, grows or falls every month with his minutes and form, and the clubs' strength (simulation, stars) is the mean of their best 11. One career per save slot."
priority = 0
tags = ["Mode"]
updated = "2026-10-31"
prefix = "CareerMode"
folder = "CareerMode"
# The clubs, their rosters and ratings are Battle Bay Deluxe's (read at run time, never copied: config.toml [teams]
# sources / national_mod; the ratings through its exported BattleBayDeluxe.Ratings, config.toml [ratings];
# content\teams\stand_in.toml is based on one of its teams): that data is why it is required. The screens and texts come from the VR-Framework's menu and text engines; the competitions' round robin,
# standings and knockout tree and the bracket screen are the framework's (VRFW/lib/competition, VRFW_Bracket).
requires = ["VRFW>=2.399.0", "text_engine>=1.1.0", "menu_engine>=1.0.0", "BattleBayDeluxe>=1.90.0"]
conflicts = []
# the career commands (content\game\commands.toml) answered by scripts\career.lua; its state key careermode.skill_board_locked
permissions = ["command", "state"]
loader_modules = ["lua_bridge"]

[exports]
functions = []
keys = []
