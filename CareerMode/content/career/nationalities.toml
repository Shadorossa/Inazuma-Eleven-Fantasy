# Career mode: player nationalities beyond the national team rosters (config.toml [world_cup] nationality_file).
# Every player of a national team's roster has that team's country (config.toml [[world_cup.countries]]); a player listed
# here gets this country instead (the call-up pool of the World Cup is every player of a nationality).
# [[CareerMode.Nationality]] country = "<country id>", players = [cards ("0x…") or character keys ("<mod>.<name>")]
