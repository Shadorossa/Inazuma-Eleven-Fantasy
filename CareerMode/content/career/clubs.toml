schema = "CareerMode.career/1"

# Career mode: the career's clubs (config.toml [squads] clubs_file; kind CareerMode.career/1,
# content/types/career.toml). Edit freely.
# Every career team (Battle Bay Deluxe's clubs and the game's own Battle Bay teams, config.toml [teams]) is a club of its
# own unless listed here:
# * [[CareerMode.Club]]: one club made of several versions of a team. `key` = the team that gives the club its name,
#   crest, kit and roster rows; `versions` = the other teams whose players join its squad (a person once; each player
#   still belongs to the earliest version that has him, content/career/club_order.toml). The versions are no clubs of
#   their own.
# * [[CareerMode.NoClub]]: a team that is no career club (its players go to the other clubs that have them, else to
#   the free players).
# * [[CareerMode.GameClub]]: a team of the game's team table (no source mod declares it) that is a career club:
#   `key` its team_config key, `name_text` (optional) another team_text name for it, `series` its series (the
#   [[team]] series names, for its tag next to a same-name club). Its place in the club order: content/career/
#   club_order.toml.
# A club enters a career with config.toml [squads] min_players own players or more; the squad keeps every own player
# (it may pass fill_to) and a match takes [match] squad_size of them.

