# Career Mode › the declaration schema of the career's data files (kind CareerMode.career/1, content\career\*.toml).
# The run time is scripts\career.lua and scripts\lib\squads.lua, which read the files config.toml names
# ([squads] clubs_file / order_file, [world_cup] nationality_file); this file lists every key they read, so
# `vrfw check` validates the files and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "CareerMode.career/1"
folder = "content/career"

[entry.Club]
doc = "one career club made of several versions of a team"
unique = "key"
key = { type = "string", required = true, ref = "team", doc = "the team that gives the club its name, crest, kit and roster rows" }
versions = { type = "strings", ref = "team", doc = "the other teams whose players join its squad; they are no clubs of their own" }

[entry.NoClub]
doc = "a team that is no career club: its players go to the other clubs that have them, else to the free players"
unique = "key"
key = { type = "string", required = true, ref = "team", doc = "the team" }

[entry.ClubOrder]
doc = "a club's rank for a player shared by several clubs (the lowest game, kind, place, number keeps him); generated by research/scripts/career_club_order_build.py"
unique = "key"
key = { type = "string", required = true, ref = "team", doc = "the club's team" }
game = { type = "int", min = 1, doc = "series type: 1 ie1 … 6 go3, 7 ares, 8 orion, 9 victory_road" }
kind = { type = "int", min = 0, max = 2, doc = "0 story club, 1 legend club of one team, 2 mixed legend club" }
place = { type = "ints", max_items = 2, doc = "the first Chronicle board piece [route progress, piece]; [999, 999] = none" }
number = { type = "int", min = 0, doc = "the number in the club's key" }

[entry.Nationality]
doc = "players of a country beyond the national team rosters (the World Cup call-up pool is every player of a nationality)"
unique = "country"
country = { type = "string", required = true, doc = "the country id (config.toml [[world_cup.countries]] id)" }
players = { type = "strings", doc = "cards (\"0x…\") or character keys (\"<mod>.<name>\")" }

[entry.LevelScale]
doc = "the stats' scale of the initial levels (the lowest and highest Lv99 stats among the career's players); generated by research/scripts/career_levels_build.py"
unique = "key"
key = { type = "string", required = true, doc = "\"stats\"" }
stats_low = { type = "number", doc = "the lowest position stats at level 99" }
stats_high = { type = "number", doc = "the highest position stats at level 99" }
players = { type = "int", min = 0, doc = "how many career players the shares were taken among" }

[entry.InitialLevel]
doc = "a card's starting career level; generated by research/scripts/career_levels_build.py"
unique = "card"
card = { type = "string", required = true, doc = "the card, chara_param id (\"0x…\")" }
level = { type = "int", min = 1, max = 99, doc = "the starting level (config [levels] start_curve at the share)" }
share = { type = "number", min = 0, max = 1, doc = "the quality's place among the career's players (the potential's margin row)" }
quality = { type = "number", min = 0, doc = "the quality score (a card missing from the file is placed by it)" }
