# The career's matches (docs/game/mods/career-mode-proposal.md §8): the hub screen (evt_career_menu) starts the club's
# match with VRFW_MATCH.start (docs/framework/match-start.md). The match row is config.toml [match] game; both sides are
# career clubs through the match engine's next-match overrides teams.user.team / teams.rival.team, at the host club's
# home stadium (the screen passes the host as the context's rival; rival_home). Nothing of the match reaches the save
# slot (sink); the career records the game's own result (scripts\career.lua, signal vrfw.match_result). After the
# match the title opens again and presses the career's button (origin = its title item), so the hub comes back.
schema = "VRFW.friendly/1"

[[friendly]]
id = "career_match"
name = "Career mode match"
team = "current"
pre_match = true
rival_home = true
save = "sink"
return = "title"
keep_game = false
origin = "career_mode"
before = [{ op = "fade_encounter" }]
