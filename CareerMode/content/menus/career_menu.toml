# The career hub, evt_career_menu: the mode's own screen, opened by its title row button (title_row.toml) as the root of
# its own menu scene (root_menu: the game kept in memory, reset straight into it; no title under it). The «Guardar» screen's background and header, one
# retail list row kept off screen as the input anchor (every key of the screen comes to it: cmd rows -> OnFunction /
# OnBack), and the screen's drawing pools: quads of cmn01_10_new_icon showing retail sprites (window bases, list
# plates, the cursor), the retail team row of the emblem list (team06_02: plate, crest, name) and the retail
# back-button text for the texts; the news card's 3D player (VRFW model card: its backdrop, the card colour in the
# background pass, the model; docs/framework/model-card.md). Script: assets/lua/screens/evt_career_menu.lua.
schema = "VRFW.menu/2"

[[object]]
name = "career_panel"
from = "cmn01_10_new_icon"
set = [
    { param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1001 } },
]

[[object]]
name = "career_plate"
from = "cmn01_10_new_icon"
set = [
    { param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1002 } },
]

[[object]]
name = "career_icon"
from = "cmn01_10_new_icon"
set = [
    { param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1003 } },
]

# a club: the emblem list's row (plate, crest, name); no hit zone, no attach to the emblem list's locators
[[object]]
name = "career_team"
from = "team06_02_emblem_list_item"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
priority = 1004

# a player's miniface: a copy of the retail list character card, shown as its portrait only (VRFW_FaceIcon.Card)
[[object]]
name = "career_face"
from = "team00_01_chara_card_for_list"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
priority = 1004

[[object]]
name = "career_text"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { param = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 1005 } },
]

# the confirmation window over everything else
[[object]]
name = "career_dialog"
from = "cmn01_10_new_icon"
set = [
    { param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1006 } },
]

[[object]]
name = "career_dialog_text"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { param = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 1007 } },
]

# the news card's club crest, faint over its background: a quad in the background pass over the model card's ground
# (priority 210), under the 3D model
[[object]]
name = "career_news_ghost"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 211 } }]
add = [{ block = "CMenuRenderComponent", param = "m_drawType", values = [1] }]

# Counts (the script's pools follow the layers' real instance counts): panels 24 (the draw: 14 pots, 6 leagues, the card), plates 120 (rows, bars, tab, form
# chips), icons 50 (stars, arrows, tab icons, cursor, dots), clubs 172 (the draw: 84 clubs in the pots, 84 in the leagues, the drawn ball's card), faces 40 (Mercado:
# the Plantilla list (15 rows) beside the search list (14 rows), the card and the talk window), texts 300 (a 20-club table: name + 9 values a row), dialog 24 + 28 (the
# market's talk window); keys 2: the retail change-page
# plate team00_40_change_page_guide, its grey base hidden, the L1 / R1 glyphs in the tab bar's end caps (VRFW_TabBarCaps).
[[screen]]
name = "evt_career_menu"
like = "language_option_menu"
base = "savedata_management_menu"
script = "assets/lua/screens/evt_career_menu.lua"

# the background in the background pass (mainmenu90_00_background_draw_type_before, as the retail team hubs
# soccer_top_menu / team_dock_common_top_menu): the team screen of «Equipo» opens over this menu, and a normal-pass
# background (priority 450) covered its layers under 450 (the pitch lines, the kit, the panel's icon buttons)
[screen.rows]
layer = [
    { layer = "mainmenu90_00_background", object = "mainmenu90_00_background_draw_type_before" },
    { layer = "mainmenu90_01_header" },
    { layer = "save01_02_list_item", count = 1 },
    # the news card's model-card layers (backdrop, card colour, faint crest, 3D model)
    { layer = "career_backdrop", object = "vrfw_model_card_backdrop", count = 1 },
    { layer = "career_news_ground", object = "vrfw_model_card_ground", count = 1, scale = 0.01 },
    { layer = "career_news_ghost", object = "career_news_ghost", count = 1, scale = 0.01 },
    { layer = "career_news_model", object = "vrfw_model_card", count = 1 },
    { layer = "career_panel", object = "career_panel", count = 24, scale = 0.01 },
    { layer = "career_plate", object = "career_plate", count = 120, scale = 0.01 },
    { layer = "career_icon", object = "career_icon", count = 50, scale = 0.01 },
    { layer = "career_team", object = "career_team", count = 172, scale = 0.01 },
    { layer = "career_face", object = "career_face", count = 40 },
    { layer = "career_text", object = "career_text", count = 300, scale = 0.01 },
    { layer = "career_dialog", object = "career_dialog", count = 24, scale = 0.01 },
    { layer = "career_dialog_text", object = "career_dialog_text", count = 28, scale = 0.01 },
    { layer = "career_keys", object = "team00_40_change_page_guide", count = 2 },
    { layer = "career_prompts", object = "team00_40_change_page_guide", count = 2 },
    { layer = "career_switch", object = "team00_40_change_page_guide", count = 2 },
]
# the anchor takes every key: A accepts, B / Esc / right click go back (the screen closes from its first page), the
# arrows move (the club, the league of the table, the calendar's page), L1 / R1 change the league on the club pick and
# the tab on the hub, Y draws the leagues again on the club pick, L2 / R2 change the «Mercado» list's filter / order; a left click (CMD_EVT_MOUSE_LEFT, VRFW
# content\inputs\pointer.toml) presses the hub button under the pointer; the right stick
# (content\inputs\news_scroll.toml)
# and the wheel (CMD_EVT_WHEEL_UP / DOWN) scroll the news feed of «Inicio», the «Mercado» list, the month of «Fechas» and
# the table's page of «Torneos»
cmd = [
    { layer = "save01_02_list_item", input = "CMD_BACK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_MOUSE_RIGHT_CLICK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_ENTER", command = "CMD_FUNCTION", arg = "career_accept", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_UP", command = "CMD_FUNCTION", arg = "career_up", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_DOWN", command = "CMD_FUNCTION", arg = "career_down", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_LEFT", command = "CMD_FUNCTION", arg = "career_left", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_RIGHT", command = "CMD_FUNCTION", arg = "career_right", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCL1", command = "CMD_FUNCTION", arg = "career_prev", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCR1", command = "CMD_FUNCTION", arg = "career_next", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC3", command = "CMD_FUNCTION", arg = "career_redraw", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC4", command = "CMD_FUNCTION", arg = "career_x", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCL2", command = "CMD_FUNCTION", arg = "career_l2", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCR2", command = "CMD_FUNCTION", arg = "career_r2", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_EVT_MOUSE_LEFT", command = "CMD_FUNCTION", arg = "career_click", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_CAREERMODE_NEWS_UP", command = "CMD_FUNCTION", arg = "career_news_up", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_CAREERMODE_NEWS_DOWN", command = "CMD_FUNCTION", arg = "career_news_down", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_EVT_WHEEL_UP", command = "CMD_FUNCTION", arg = "career_news_up", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_EVT_WHEEL_DOWN", command = "CMD_FUNCTION", arg = "career_news_down", flag = 1 },
]
res = [
    "#/menu/20_cmn/cmn06/cmn06_01/cmn06_01.g4tx",
    "#/menu/51_save/save01/save01_02/save01_02.g4tx",
    "#/menu/20_cmn/cmn05/cmn05_01/cmn05_01.g4tx",
    "#/menu/102_team/team06/team06_02/team06_02.g4tx",
    "#/menu/102_team/team00/team00_01/<LG>/team00_01.g4tx",
    "#/menu/00_soccer/soccer11/soccer11_14/soccer11_14.g4tx",
    "#/menu/10_win/win05/win05_28/win05_28.g4tx",
    "#/menu/00_soccer/soccer00/soccer00_31/soccer00_31.g4tx",
    "#/menu/20_cmn/cmn03/cmn03_02/cmn03_02.g4tx",
    "#/menu/200_icon/16_icon_list_tab/icon_list_tab.g4tx",
    "#/menu/220_img/career_tint/career_tint.g4tx",
    "#/menu/220_img/career_panels/career_panels.g4tx",
    "#/menu/220_img/career_rows/career_rows.g4tx",
    "#/menu/220_img/career_news_bg/career_news_bg.g4tx",
    "#/menu/20_cmn/cmn06/cmn06_20/cmn06_20.g4tx",
]
# two groups, as the retail hubs (soccer_top_menu): «common» (group flag 0) keeps its layers drawn while the screen is
# suspended under a child menu: the background, the header and the tab bar's layers (panels, plates, icons, texts, the
# L1 / R1 caps), so the bar stays over the game's team screen of «Plantilla»; the screen's own group (flag 1: hidden
# while suspended) holds the input anchor, the crests, the minifaces, the dialog and the news card's 3D player
group_base = [
    { layer = "mainmenu90_00_background", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "mainmenu90_01_header", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_panel", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_plate", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_icon", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_text", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_keys", flags = [0, 0, 1, 0, 1, 0] },
    { layer = "career_prompts", flags = [0, 0, 1, 0, 1, 0] },
    { layer = "save01_02_list_item", flags = [1, 1, 0, 0, 1, 0] },
    { layer = "career_team", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "career_face", flags = [0, 0, 0, 0, 1, 0] },
    { layer = "career_dialog", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "career_dialog_text", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "career_backdrop", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "career_news_ground", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "career_news_ghost", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "career_news_model", flags = [0, 1, 1, 0, 1, 0] },
]
group = [
    { group = "common", slice = [0, 7] },
    # slice = [start, count] of group_base: every row must be inside one group, a row in none is never loaded
    { group = "evt_career_menu", flags = [1], slice = [7, 10] },
]
focus_base = [[0x3A06AC3D, 0, 0]]
focus_group = [
    { layer = "save01_02_list_item", flags = [0, 0, 0], slice = [0, 1] },
]
shift_base = []
shift = []
