# Career Mode › no player passives in a career (Utilities' passive declarations, schema utilities.passive_config/1,
# docs/game/mechanics/pasivas-configurables.md «Modes without passives»). While a career runs (its menus and matches,
# the current-mode key careermode.career: content\game_modes\career.toml), no player of either team has a passive: the
# generic slots 1-3 and the archetype slots 4-5 read empty, so the team has no «Bonificaciones de equipo»; with Special
# Players its own passive and the script-driven character passives are off too. Nothing applies in the match; the
# player plate hides its passive rows and the formation screen its «Bonific. de equipo» guide. The saved configuration
# is not touched: outside the career everything is as before. Without Utilities this file is not read.
schema = "utilities.passive_config/1"

[[off_mode]]
mode = "careermode.career"
