# Career Mode: the right stick up / down on the hub's «Inicio» scrolls the news feed. Copies of the retail right stick
# rows of the menu controllers (pad axis 3, past half tilt), one command per direction.
schema = "VRFW.input/1"

[[command]]
ctrl = "MENU_CTRL"
name = "CMD_CAREERMODE_NEWS_UP"
pad = [4, 5, 3, 0.5, 1.1]

[[command]]
ctrl = "MENU_CTRL"
name = "CMD_CAREERMODE_NEWS_DOWN"
pad = [4, 5, 3, -1.1, -0.5]

[[command]]
ctrl = "MENU_CTRL_WITH_ANALOG_MOVE_FOCUS"
name = "CMD_CAREERMODE_NEWS_UP"
pad = [4, 5, 3, 0.5, 1.1]

[[command]]
ctrl = "MENU_CTRL_WITH_ANALOG_MOVE_FOCUS"
name = "CMD_CAREERMODE_NEWS_DOWN"
pad = [4, 5, 3, -1.1, -0.5]
