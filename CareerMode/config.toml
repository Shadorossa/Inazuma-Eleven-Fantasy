[[world_cup.countries]]
id = "russia"
teams = ["bbcr_orion_1200_bb"]  # Chispas Perfectas
# Galaxy's planets (owner 2026-10-30): each a country of its own; a club listed here leaves the club competitions
[[world_cup.countries]]
