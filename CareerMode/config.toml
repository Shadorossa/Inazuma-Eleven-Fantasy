# Career mode: default configuration shipped with the mod (the loader's config.toml [mods.CareerMode] overrides it key by
# key). Read by scripts\career.lua with VRFW.files.config("<section>.<key>"). The mode is always on with the mod.

# The clubs: every [[team]] of these mods' content\teams\ at this level that has a roster and every field of `require`
# (the Battle Bay special tiles, as the Draft and the active team, have no series). Roster rows up to
# player_slot_max (0-10 starters, 11-18 bench; 19 / 20 = coach and manager) are the club's players.
[teams]
sources = ["BattleBayDeluxe"]
level = 40
require = ["series"]
player_slot_max = 18
# the game's own Battle Bay teams are career clubs too (team_config keys matching this Lua pattern, at `level`)
game_team_pattern = "^bb_%d+_team_"
# The national sides: the team keys listed at `national_list` of mod `national_mod`'s config (Battle Bay Deluxe's
# [league] national_teams: the team data has no national flag). A source team is national when its key, a key of its
# `same_as` or its name text is one of theirs. National sides play no club competition (SuperLiga, leagues, Fútbol
# Frontier) and own no player: the unique-player rule is among the clubs only, so a club may sign a national side's
# player, who stays in his national side as well. They keep their whole rosters (the World Cup phase, the proposal's §12).
national_mod = "BattleBayDeluxe"
national_list = "league.national_teams"
# only the teams of these series (the [[team]] `series`) are national sides (owner 2026-10-30: the FFI of IE3, the Asian
# qualifiers of Galaxy (GO3), Orion); a listed team of another series is a club
national_series = ["IE3", "GO3", "ORION"]
# the game's team table: the teams of [[world_cup.countries]] no mod declares (story teams) are read from it
game_table = "data/common/gamedata/team/team_config_*.cfg.bin"
# listed teams that are not national teams (combined or legend squads: owner 2026-10-30): clubs
national_exclude = [
    "bbcr_legend_ie3_04_bb",    # Ases Internacionales
    "bbcr_legend_orion_02_bb",  # Selección Mundial
    "bbcr_legend_orion_08_bb",  # Neo Japón Implacable
]

# The club strength the draw's pots use: the Battle Bay rating table (any mod may ship it); a club it does not rate
# gets the median. Without the table every club has the same rating.
[ratings]
table = "data/common/gamedata/team/evt_bb_team_rating.cfg.bin"
rows = "EVT_BB_RATING"

# Squads (docs/game/mods/career-mode-proposal.md §9): every player exists once in a career. A player shared by several
# clubs belongs to the earliest one by order_file (generated from game data: research/scripts/
# career_club_order_build.py). A club enters the career when it keeps min_players of its own. The roster rows its moved
# players leave, and its squad up to fill_to, are signed from the free players: the same main position, the closest
# strength (chara_param column strength_column, at most strength_reach apart), the club's own game first
# (same_game_first); with free_need_team only characters of some belong team (chara_base), not townsfolk; drawn once
# per career.
[squads]
order_file = "scripts/data/club_order.toml"
min_players = 11
fill_to = 16
# the career's clubs (owner 2026-10-30): which teams are one club (versions merged) and which are no club
clubs_file = "scripts/data/career_clubs.toml"
strength_column = "rank"
strength_reach = 5
same_game_first = true
free_need_team = true

# The season (§8). SuperLiga: every club, a Swiss system of `rounds` rounds (no rival twice, home and away balanced);
# the first `qualify` go on (a multiple of the league count; the rest of the season is simulated when the player's club
# is out).
[superliga]
rounds = 12
qualify = 56

# The qualified clubs in pots of `count` (SuperLiga order), one club of each pot per league: `count` leagues. double =
# home and away (26 matchdays with 14 clubs).
[leagues]
count = 4
double = true

# Fútbol Frontier: places 1..direct_places of each league go straight to the knockout rounds; places playoff_places
# (first to last) play a single-match play-off (best against worst of another league). Every knockout match is single,
# the final too (a draw goes to penalties). Direct clubs + play-off winners must be a power of two. The round after the
# play-off is drawn when the Frontier starts: each direct club against the winner of a play-off match, never one with a
# club of its own league when the draw allows it.
[frontier]
direct_places = 2
playoff_places = [3, 6]

# The season's days (the proposal's §11, «as in FIFA»): every fixture has a date. Season n starts on season_start of
# first_year + n - 1 (calendar day 1; the calendar year rolls over with the season). The first matchday is the
# first_match weekday of its month (nth 1 = the first, -1 = the last); the final is played on season_end at the latest.
# Match days by phase: "weekend" (the weekend day, one round a week), "midweek" (the midweek day), "both"; the final has
# its own mode. Two matches of a club are rest_days apart at least; the pots draw is draw_after_days after the last
# SuperLiga round, the leagues start the first league day after it. When the final would come after season_end, the
# phases of `compress` play on both days (one more phase each try), then the breaks are given up. Dates are "MM-DD" (a
# month before the season_start month is the next calendar year's).
[transfers]
# A club sells one of its players only with min_squad_to_sell career players or more (owner 2026-10-30: a club of 11
# refuses, a sale would leave it short). CareerMode.CanSell checks it for every sale between clubs.
min_squad_to_sell = 12

[calendar]
first_year = 2026
season_start = "08-01"
first_match = { month = 8, weekday = "sat", nth = -1 }
season_end = "06-01"
weekend = "sat"
midweek = "wed"
rest_days = 3
draw_after_days = 4
superliga = "weekend"
league = "weekend"
frontier = "midweek"
final = "weekend"
compress = ["superliga", "frontier", "league"]
# days without matches (if they fit)
breaks = [{ from = "12-22", to = "01-03" }]
# the transfer windows (shown on the calendar and on «Inicio»; scripts\career.lua CareerMode.WindowAt(day))
transfer_windows = [{ from = "08-01", to = "08-31" }, { from = "01-01", to = "01-31" }]
# the World Cup's days after the club season (reserved: the World Cup phase of the proposal's §12)
world_cup = { from = "06-24", to = "07-15" }

# The World Cup (the proposal's §12): after the Fútbol Frontier final, in the [calendar] world_cup days. One national
# team per country plays; the player is offered one country at random and picks its squad (squad players, at least
# `keepers` goalkeepers) among the players of that nationality. Every country plays: as few groups of group_size as
# hold them (sizes differ by one at most), single round robin; the knockout is the power of two the first `advance` of
# each group fill best (the next places complete a larger one when there are enough of them, else the best qualified
# fill a smaller one); single matches (a draw goes to penalties), simulated with [sim]. It changes nothing in the
# career (no growth, no trophy). enabled = false: the season ends at the final.
[world_cup]
enabled = true
group_size = 4
advance = 2
squad = 16
keepers = 2
# every player's nationality: the country of the national team rosters that hold him, then this file's players
# ([country] <id> = [cards or chara keys]) for players of no national roster or a different country
nationality_file = "scripts/data/nationalities.toml"

# The countries (owner 2026-10-30): a country's national teams by team key; the first one plays the World Cup (name,
# crest, kit); the call-up pool is every player of that nationality. pool_teams: teams whose players also have the
# country's nationality (no entrant). A key no mod declares is the game's own team ([teams] game_table). A club listed
# in `teams` plays as that country's national team, out of the club competitions. A national team in no country is a
# country alone.
[[world_cup.countries]]
id = "australia"
teams = ["bbcr_ie3_0200_bb", "bbcr_go3_0300_bb", "bbcr_orion_0200_bb"]  # Big Waves IE3, GO3; Demonios Brillantes
[[world_cup.countries]]
