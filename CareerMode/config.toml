# The simulated results: goals per side ~ Poisson(goals x (rating / rival rating) ^ power, x home_advantage at home),
# at most max_goals; a knockout draw goes to penalties, won by the stronger club more often (rating ^ penalties_power);
# the shoot-out's kicks: each one scored with penalty_kick, penalty_kicks a club before sudden death.
# The ratings are the club ratings of [ratings].
# The season's player stats per competition («Torneos»: CMND_CAREERMODE_STATS): a goalkeeper keeps a clean sheet when
# on the pitch clean_sheet_minutes or more and his club concedes none; rating = rating_base + mean match score x
# rating_scale (0..10), listed from rating_min_matches matches; max_rows = the most rows a call answers
[stats]
clean_sheet_minutes = 60
rating_base = 6.0
rating_scale = 2.0
rating_min_matches = 3
max_rows = 50
# «Torneos»: the club's best players shown under the stats list
club_rows = 3

[sim]
goals = 1.35
power = 1.2
home_advantage = 1.15
max_goals = 9
penalties_power = 0.5
penalty_kick = 0.75
penalty_kicks = 5

# The player's matches: a friendly (content\friendlies\career.toml) on match row `game` at `difficulty`, the career
# clubs on both sides; a won final sends the signal trophy_signal (Battle Bay Deluxe's trophy lift; "" = none).
# user_team / rival_team: the slot teams (content\teams\stand_in.toml, team keys) that stand in for the
# two clubs with their whole career squads (starters and bench, at most the slot team's player rows).
[match]
user_team = "evt_career_user"
rival_team = "evt_career_rival"
friendly = "career_match"
game = "fbtl_bb_stadium_00"
difficulty = 1
trophy_signal = "BattleBayDeluxe.TrophyPlay"
# a match takes squad_size players of each club (the slot teams' player rows): the player picks his club's on the
# «Plantilla» tab, a rival plays its best squad_size by strength ([squads] strength_column), at least `keepers`
# goalkeepers among them
squad_size = 19
keepers = 2
# the level the career levels count from on the slot teams' member rows (CMND_VRFW_TEAM_MEMBER_LEVELS base): 0 = the
# team record's level (the stand-in copies the club's)
level_base = 0

# Club families: the team names of this language tell two versions of one club apart («… A» / «… B»)
[family]
language = "en"

# League points
[standings]
win = 3
draw = 1
loss = 0

# The club's card (club pick, «Inicio»): numbers the hub screen reads from the game's own stats at the club's level.
# A player's rating = the mean of the game's shown stats `stats` (engine order: 0 Disparo, 1 Control, 2 Técnica,
# 3 Presión, 4 Físico, 5 Inteligencia, 6 Agilidad). The starters = formation places below `starter_places`. The lines
# (ATA / MED / DEF) = the mean rating of the starters of these main positions (1 GK, 2 FW, 3 MF, 4 DF); the formation
# shape counts the starters of defence, midfield, attack (the goalkeeper apart). The stars = the club's place among the
# clubs of its league by the starters' mean, from stars_min (last) to stars_max (first) in steps of stars_step.
[rating]
stats = [0, 1, 2, 3, 4, 5, 6]
starter_places = 11
attack = [2]
midfield = [3]
defence = [4]
goalkeeper = [1]
stars_min = 1.0
stars_max = 5.0
stars_step = 0.5
best_players = 5
# with [ratings] source = "levels": the stars from the club's rating on a fixed scale (rating -> stars, in steps of
# stars_step; owner 2026-10-30), not from its place in the league
stars_by_rating = [[62, 1.0], [67, 2.0], [72, 3.0], [77, 4.0], [83, 5.0]]

# The careers of a save slot: the title menu offers `slots` of them (career 1 is the save blob career.json, the
# single career of earlier versions; career k the blob career_<k>.json).
[careers]
slots = 4

# The hub: rows per page of the calendar and of a table, the last results shown on «Forma» (2 rows) and as form chips, and its tabs in order
# (L1 / R1). A tab is a page id the screen draws (home, calendar, competition, squad) with its label text
# (text\rows\career.toml CareerMode.<text>), its icon (a sprite of the retail tab icon atlas icon_list_tab) and, when it
# shows only in some phases of the season, `phases` (superliga, pots, league, frontier, worldcup, over); `callup = true`
# shows it only while the club's squad is larger than [match] squad_size. «squad» is the game's own team screen with
# the club (formation, starters and bench, kit, crest, coach, tactics, player pages), «callup» the players its matches
# take. A page id the screen does not know shows «coming soon».
[hub]
# tabs: `text` = the tab bar's short label (at most 8 letters, 4 wide characters: 7 tabs share the bar)
rows_per_page = 10
table_rows = 18
form_matches = 10
# «Continuar» / «Ir al partido» walk the days one at a time: the frames each day takes (about 0.4 s at 24)
day_step_frames = 24
tabs = [
    { id = "home", text = "TabBarHome", icon = "icon_list_tab_town01" },
    { id = "calendar", text = "TabBarCalendar", icon = "icon_list_tab_history01" },
    { id = "competition", text = "TabBarCompetition", icon = "icon_list_tab_vroad01" },
    { id = "squad", text = "TabBarSquad", icon = "icon_list_tab_uniform01" },
    { id = "callup", text = "TabBarCallUp", icon = "icon_list_tab_coach01", callup = true },
    { id = "market", text = "TabBarMarket", icon = "icon_list_tab_ticket01", phases = ["superliga", "pots", "league", "frontier"], market = true },
    { id = "settings", text = "TabBarSettings", icon = "icon_list_tab_option01" },
]

# «Noticias» (scripts\lib\news.lua): the news kept per career (newest first), the rival clubs' deals shown per day of
# the market, and each picture's pose: per role, the clips tried in order ("pack:clip" of the player's own motion set,
# common/chr/<set>/<set>_<pack>.g4pk); the first one his motion set holds is played, the stand when none
# (VRFW_ModelCard, docs/framework/model-card.md). Roles: celebrate (a signing, a win, a title, the lead), let_down (a
# loss, a place lost, out of a cup), proud (a sale, a star of the club), stand (an offer, a draw). Every role tries the
# game's celebration motions first (goal celebrations, bond emotes), the menu poses last (unused while picture.static).
# The picture (owner 2026-10-31: «el modelo nunca puede sobresalir del rectángulo», «estático»): static = the stand
# only, no clip played; fit = the whole model inside the card's image area (VRFW [fit] envelope): the card minus side px
# on the left and right, top px under its top (top_transfer on a transfer card, under its crests) and bottom px over its
# bottom (the tag, title and body band); centre = the body's centre as a part of the area's width.
[news]
keep = 40
# the feed shows the items of the last max_age_days career days (from the career's date)
max_age_days = 4
ai_transfers_per_round = 3

[news.poses]
celebrate = ["p250:Bイベガンダレス喜び飛び跳ね1L", "p030:戦1ゴール後その場喜び2L", "p400:キズナエモート飛び跳ね1L", "p250:Bイベゴール後その場喜び2L", "p030:戦1ゴール後その場喜び1L", "p010:VS画面ポーズ1L"]
let_down = ["p030:戦1ゴール後その場がっかり1L", "p250:Bイベ落胆小1L", "p060:NPCうなだれ立ち1L"]
proud = ["p250:Bイベガンダレス喜びガッツ1L", "p030:戦1ゴール後その場喜び2L", "p400:キズナエモート飛び跳ね1L", "p030:戦1ゴール後その場喜び1L", "p010:ステータスポーズ豪快1L"]
stand = ["p400:キズナエモート応援立ち1L", "p010:ステータスポーズ陽気1L", "p010:VS画面ポーズ1L"]

[news.picture]
static = true
fit = true
centre = 0.5
side = 14
top = 14
top_transfer = 128
bottom = 232

# The players' career levels (owner 2026-10-30; docs/game/mods/career-mode-levels.md): every player of a career has a
# level 1-99 («media») of his own, kept in the career, never in the game's save. The starting level: a quality score
# (quality_weights: chara_param growth rank out of rank_max, fame = how many of the career's source teams hold the person,
# up to fame_cap more than one, and the stats of his position at level 99 from the game's growth table) as a share of
# the career's players (0 the lowest .. 1 the highest), put on start_curve (every player 60-94, most of them 60-75, the
# best ones near 94; 99 only by growth). The potential: the starting level + a seeded draw in [minimum, maximum] of the
# potential_margin row of his share ([share from, minimum, maximum]), at most max_level. In a match each player plays at
# his match level = level + form (the engine level of his member row, apply_in_match).
[levels]
quality_weights = { rank = 0.55, fame = 0.20, stats = 0.25 }
rank_max = 5
fame_cap = 4
start_curve = [[0.0, 60], [0.50, 67], [0.80, 74], [0.93, 81], [0.98, 87], [0.995, 91], [1.0, 94]]
potential_margin = [[0.0, 3, 12], [0.80, 3, 9], [0.98, 2, 6]]
max_level = 99
min_level = 1
apply_in_match = true
# the level the game gives a club's player outside a match (owner 2026-10-31: «el nivel de los jugadores se rige por
# las medias»): his member row in the club's team and the team screen («Equipo», its team level the mean of them).
# "level" = his career level («media»), "match" = level + form; within min_level..max_level
squad_level = "level"

# the position's stats (growth table columns <stat>_99, main position order 1 GK, 2 FW, 3 MF, 4 DF), the chara_param
# columns of the stat modifiers (0-based), the growth key columns (main position, growth pattern, growth rank) and the
# engine's stat rule at level 99 (+rarity_bonus per rarity step, mod_stage per modifier point; docs/game/mechanics/
# stats-system.md)
growth_table = "data/common/gamedata/character/growth_table_config_*.cfg.bin"
growth_list = "m_growthTableMainList"
# the starting levels of every card a career can hold, generated from these rules by
# research/scripts/career_levels_build.py (run it again after changing the quality rules, start_curve or the clubs);
# a card missing from it is computed at run time with the same rules when he is first asked for
initial_file = "content/career/initial_levels.toml"
position_stats = [["Ag", "Ps"], ["Kc", "Cr"], ["Tc", "Cr"], ["Pr", "Ps"]]
stat_mod_columns = { Kc = 29, Cr = 30, Tc = 31, Pr = 32, Ps = 33, It = 34, Ag = 35 }
position_column = 3
pattern_column = 7
growth_rank_column = 9
rarity_step = 4
rarity_bonus = 0.1
mod_stage = 20
# The form (-3..+3): the weighted mean of the last form_matches match scores (form_weights, oldest first) x 3 /
# form_scale; 0 with fewer than form_min_played matches played.
form_matches = 5
form_weights = [1, 1, 2, 2, 3]
form_scale = 1.0
form_min_played = 2
# The progression, at the end of every month of the calendar (one season: owner 2026-10-30): a club player gains
# growth_per_month x his share of the month's minutes x (potential - level) / growth_gap (at most 1) + form_bonus[form
# -3..+3] when he played; he loses bench_decline when his share is below bench_share, and bad_form_decline after two
# months in a row with form -2 or worse. A free player loses free_decline a month ± a seeded free_drift (training on his
# own). Every whole point moves the level (never above the potential). A regular starter gains ~4-6 in a season, an
# unused one loses ~3-4, a free player ~1-2.
growth_per_month = 0.55
growth_gap = 5
form_bonus = [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
bench_share = 0.15
bench_decline = 0.4
bad_form_decline = 0.4
free_decline = 0.15
free_drift = 0.35
history_months = 6
# a level change is news (CareerMode.LevelNews) for the player's club, or for others reaching news_min_level or moving
# news_min_change at once; the last news_keep are kept
news_min_level = 80
news_min_change = 2
news_keep = 30

# The EXP bar under «Nv.» on the team screen («Equipo») and its player pages (owner 2026-10-31): how close each player
# is to his next career level change. A player's way = the points kept from the past months (+1 = one level up at the
# month's end, -1 = one down; [levels] growth_per_month, form_bonus, bench / bad form declines) + this month's so far
# (with_month, once his club has played in it). The bar: `neutral` (0.5 = half) = no change on the way, full = a level
# up near, empty = a level down near; the same at his potential (no rise) and at min_level (no fall).
[levels.exp_bar]
neutral = 0.5
with_month = true

# A match's score of a player (form): the result (win / draw / loss) x his share of 90 minutes, + goal per goal, save
# per keeper save, technique per move used (at most technique_cap), duel per duel won (at most duel_cap), red per red
# card, conceded per goal against (goalkeepers and defenders); at most ± score_cap. The player's own matches: the match
# engine's events; the simulated ones: the best `starters` by match level play 90', sim_bench_subs bench players
# sub_minutes, the goals go to the players on the pitch by sim_goal_weights (GK, FW, MF, DF) x level, and each score gets
# a draw within ± sim_noise_by_position.
[levels.form]
win = 0.5
draw = 0.0
loss = -0.5
goal = 0.6
save = 0.25
technique = 0.05
technique_cap = 0.3
duel = 0.03
duel_cap = 0.3
conceded = -0.15
red = -0.6
score_cap = 1.5
starters = 11
sim_bench_subs = 3
sub_minutes = 30
sim_goal_weights = [0, 5, 3, 1]
sim_noise_by_position = [0.2, 0.4, 0.4, 0.3]

# A player's market value in value points ([market] unit): value_curve(level) x min(pot_cap, 1 + pot_weight x
# (potential - level)) x (1 + form_weight x form) x (1 + trend_weight x the levels gained in the last trend_months
# months, within trend_min..trend_max) x position (by main position: GK, FW, MF, DF). CareerMode.PlayerValue(card)
# answers it (the transfer market reads it).
[levels.value]
value_curve = [[40, 0.02], [50, 0.05], [60, 0.15], [65, 0.28], [70, 0.5], [75, 0.85], [80, 1.5], [85, 3.0], [88, 4.5], [90, 6.0], [94, 10.0], [99, 20.0]]
pot_weight = 0.04
pot_cap = 1.5
form_weight = 0.05
trend_weight = 0.04
trend_min = 0.8
trend_max = 1.3
trend_months = 3
position = [0.85, 1.15, 1.05, 0.95]
