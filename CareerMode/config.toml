# Career mode: default configuration shipped with the mod (the loader's config.toml [mods.CareerMode] overrides it key by
# key). Read by scripts\career.lua with VRFW.files.config("<section>.<key>"). The mode is always on with the mod.

# The clubs: every [[team]] of these mods' content\teams\ at this level that has a roster and every field of `require`
# (the Battle Bay special tiles, as the Draft and the active team, have no series). Roster rows up to
# player_slot_max (0-10 starters, 11-18 bench; 19 / 20 = coach and manager) are the club's players.
[teams]
sources = ["BattleBayDeluxe"]
level = 40
require = ["series"]
player_slot_max = 18
# the game's own Battle Bay teams are career clubs too (team_config keys matching this Lua pattern, at `level`)
game_team_pattern = "^bb_%d+_team_"
# The national sides: the team keys listed at `national_list` of mod `national_mod`'s config (Battle Bay Deluxe's
# [league] national_teams: the team data has no national flag). A source team is national when its key, a key of its
# `same_as` or its name text is one of theirs. National sides play no club competition (SuperLiga, leagues, Fútbol
# Frontier) and own no player: the unique-player rule is among the clubs only, so a club may sign a national side's
# player, who stays in his national side as well. They keep their whole rosters (the World Cup phase, the proposal's §12).
national_mod = "BattleBayDeluxe"
national_list = "league.national_teams"
# only the teams of these series (the [[team]] `series`) are national sides (owner 2026-10-30: the FFI of IE3, the Asian
# qualifiers of Galaxy (GO3), Orion); a listed team of another series is a club
national_series = ["IE3", "GO3", "ORION"]
# the game's team table: the teams of [[world_cup.countries]] no mod declares (story teams) are read from it
game_table = "data/common/gamedata/team/team_config_*.cfg.bin"
# listed teams that are not national teams (combined or legend squads: owner 2026-10-30): clubs
national_exclude = [
    "bbcr_legend_ie3_04_bb",    # Ases Internacionales
    "bbcr_legend_orion_02_bb",  # Selección Mundial
    "bbcr_legend_orion_08_bb",  # Neo Japón Implacable
]
# clubs the player cannot pick for a new career (team keys); they still play in the career as rivals (owner 2026-10-31)
pick_exclude = []
# a career club whose name another club has too (another era's team: content/career/clubs.toml versions that share
# fewer than [squads] merge_overlap of their players) shows this tag of its series after its name, «Royal Academy (GO)»
series_tags = { IE1 = "IE", IE2 = "IE2", IE3 = "IE3", GO1 = "GO", GO2 = "Chrono Stone", GO3 = "Galaxy", ARES = "Ares",
    ORION = "Orion", ORIGINAL = "Original", VICTORY = "Victory Road" }
# teams that are no part of a career at all (team keys, owner 2026-10-31): no club to pick, in no competition (the next
# clubs of the club order take their places), and their players that no other team has are in no squad and no market
# pool. A career started before keeps them in its competitions
career_exclude = [
    "bbcr_go2_2100_bb",         # Inazuma Japón Legendario
    "bbcr_original_0200_bb",    # Zanark Outsiders
    "bbcr_ie2_2000_bb",         # Emperadores Oscuros
]

# The club strength (the simulated matches, so the SuperLiga order and the pots, and the stars of the club pick and the
# hub): the ratings an exported function answers ("<Prefix>.<Function>", team id -> rating): Battle Bay Deluxe's rating
# table (any mod may ship it, its header checked by Battle Bay Deluxe); a club it does not rate gets the median. When it
# rates none of the clubs, fallback = "best_players" rates every club from its players (its career squad, a national
# side its roster): `base` + the mean strength_column of its best `count` players x `scale`. The simulation uses the
# ratio of two ratings: chara_param `rank` is the growth rank of the game's stat table (0 most players, 3 the main
# characters, Hero 4, Diamond 5), so 100 + 10 per rank puts the strongest clubs about 1.5x the weakest, near the ratio
# of their Lv99 stats. "" = every club the same rating. source = "levels" (owner 2026-10-30): a club's rating is the mean
# match level (career level + form, [levels]) of its best `count` players, a goalkeeper among them; recalculated after
# every round. The national sides and the clubs before a career keep the rules above.
[ratings]
source = "levels"
fallback = "best_players"
strength_column = "rank"
count = 11
base = 100
scale = 10

# Squads (docs/game/mods/career-mode-proposal.md §9): every player exists once in a career. A player shared by several
# clubs belongs to the earliest one by order_file (generated from game data: research/scripts/
# career_club_order_build.py). A club enters the career when it keeps min_players of its own. The roster rows its moved
# players leave, and its squad up to fill_to, are signed from the free players: the same main position, the closest
# strength (chara_param column strength_column, at most strength_reach apart), the club's own game first
# (same_game_first); with free_need_team only characters of some belong team (chara_base), not townsfolk; drawn once
# per career.
[squads]
order_file = "content/career/club_order.toml"
min_players = 11
fill_to = 16
# the career's clubs (owner 2026-10-30): which teams are one club (versions merged) and which are no club
clubs_file = "content/career/clubs.toml"
# a version of clubs_file joins its club only when at least this share of the smaller roster's players are in both
# (owner 2026-10-31: the same name with other players, another era's team, is a club of its own)
merge_overlap = 0.3
strength_column = "rank"
strength_reach = 5
same_game_first = true
# a player in several teams belongs to a team of his own game (his card's series) first, then by order_file (owner
# 2026-10-31: Victory Road characters in their Victory Road club, not in an older game's team they also appear in)
home_own_game_first = true
free_need_team = true
# The squad cap (owner 2026-10-31: 21 = 11 starters + two bench columns of 5): a club holds max_players players at
# most and signs nobody while full (the market, the talks, free players, the AI clubs). A running career's player club
# over it keeps its players and only sells (at the career's start the players on a roster row stay, then the bench by
# strength; the rest are free players), max_managers managers and max_coaches coach
# (the career's clubs keep their team's own staff: no staff is signed today)
max_players = 21
# The cards no career has (owner 2026-10-31): exclude_no_face = cards whose character has no face icon of its own
# (data/dx11/menu/200_icon/10_icon_chr/face/<chara_base name>_l.g4tx in no game or mod file: the engine draws Mark
# Evans' face, the transformation bodies and placeholders); exclude_aura_types = the aura variant cards of these
# aura_skill_config types (0 keshin, 1 armed, 2 miximax, 3 totem). Left out of the free players and of every new
# career's squads; a running career drops them from the other clubs' squads once (the player's club keeps them).
exclude_no_face = true
exclude_aura_types = [2]
# exclude_staff = every card of a character with a coach or manager card (owner 2026-10-31: staff, never a player)
exclude_staff = true
max_managers = 3
max_coaches = 1
# «Equipo» (owner 2026-10-31: no loading transition): the game's team screen stays open, hidden, between visits of the
# tab while the hub is up (L1 / R1 switch at once); it closes before a match, a day, a save, a market deal or leaving
# the hub. false (the default) = it opens and closes on every visit; true is off for now: on L1 / R1 the hidden screen
# stayed drawn and the menu took no input (install 397)
keep_team_screen = false
# «Equipo»: A on a player card opens its popup («PERSONAJE»: move, equipment, abilities...) right on the team screen,
# Y opens the player page (VRFW_TeamEditor spec.inline_card_actions). false = A opens the game's lineup screen and its
# popup, as the game does. Off (owner 2026-10-31, install 408): the hidden lineup screen still drew its layers
# half-transparent over «Equipo» and the popup, with a second cursor
team_screen_card_actions = false

# The season (§8). SuperLiga: every club, a Swiss system of `rounds` rounds (no rival twice, home and away balanced);
# the first `qualify` go on (a multiple of the league count; the rest of the season is simulated when the player's club
# is out). 6 leagues of 14 (owner 2026-10-31: two more leagues so more clubs go on): a season whose leagues were dealt
# before keeps them; one still in the SuperLiga deals the new ones.
[superliga]
rounds = 12
qualify = 84

# The qualified clubs in pots of `count` (SuperLiga order), one club of each pot per league: `count` leagues. double =
# home and away (26 matchdays with 14 clubs).
[leagues]
count = 6
double = true

# The pots' colours (pot k = colour k, cycled past the last): the strip left of each place in the SuperLiga table (the
# pot that place goes to in the draw) and the header strip of each pot on the draw screen. The swatches are built from
# this list (research/scripts/career_tint_art.py: rerun it after a change).
[pots]
colours = ["#D93A3A", "#E8782A", "#E3B21F", "#9BC23A", "#2FA65A", "#1FA59A", "#23A8D9", "#2F6FD6", "#5B4BC9",
    "#9A4CC4", "#D14FA3", "#8A5A3C", "#6E7B8C", "#2C3E50"]

# Fútbol Frontier: places 1..direct_places of each league go straight to the knockout rounds; places playoff_places
# (first to last) play a single-match play-off (best against worst of another league). Every knockout match is single,
# the final too (a draw goes to penalties). When direct clubs + play-off winners are no power of two (6 leagues: 12 + 12),
# the knockout takes the largest one below (16): the direct clubs, and play-off matches between the best ranked clubs
# of the play-off places (place, then points per match, goal difference, goals), the best against the worst. The round after the
# play-off is drawn when the Frontier starts: each direct club against the winner of a play-off match, never one with a
# club of its own league when the draw allows it.
[frontier]
# entrants (owner 2026-10-31: «tiene que haber 8tavos»): the Fútbol Frontier starts with a round of `entrants` clubs
# (a power of two; 0 = the play-off rule below): places 1..entrants / leagues of every league, then the best clubs of
# the next place (place, then points per match, goal difference, goals) until it is full (6 leagues: places 1-5 and
# the two best 6th). Round 1 pairs the best ranked against the worst (the league winners against the last ones in),
# with another league whenever it can. A Frontier already drawn keeps its rounds.
entrants = 32
direct_places = 2
playoff_places = [3, 6]

# The season's days (the proposal's §11, «as in FIFA»): every fixture has a date. Season n starts on season_start of
# first_year + n - 1 (calendar day 1; the calendar year rolls over with the season). The first matchday is the
# first_match weekday of its month (nth 1 = the first, -1 = the last); the final is played on season_end at the latest.
# Match days by phase: "weekend" (the weekend day, one round a week), "midweek" (the midweek day), "both"; the final has
# its own mode. Two matches of a club are rest_days apart at least; the pots draw is draw_after_days after the last
# SuperLiga round, the leagues start the first league day after it. When the final would come after season_end, the
# phases of `compress` play on both days (one more phase each try), then the breaks are given up. Dates are "MM-DD" (a
# month before the season_start month is the next calendar year's).
[transfers]
# A club sells one of its players only with min_squad_to_sell career players or more (owner 2026-10-30: a club of 11
# refuses, a sale would leave it short). CareerMode.CanSell checks it for every sale between clubs.
min_squad_to_sell = 12

# The transfer market (the hub's «Mercado» tab, scripts\lib\market.lua). Money is the mode's own: `unit` is one
# «value point». A player's value = unit × value_curve(his strength, [squads] strength_column, as a share 0-1 of the
# career's players and the free ones); his club asks value × ask_starter (one of its best 11 by strength) or
# × ask_reserve; a free player costs value × free_agent_fee. Every club starts with unit × start_budget_by_rank(its
# place among the clubs by rating, 0 = the best .. 1 = the last) and earns unit × income_per_round each round played.
# A club holds [squads] max_players at most (a full squad can only sell). Inside a window, each round: at most
# ai_deals_per_round AI deals (a club below need_by_position [GK, FW, MF, DF] at a position signs the strongest player
# of it it can pay with ai_spend_share of its money, among ai_sample players drawn), and each player the club listed
# gets a bid with the chance bid_chance (value × bid_range(a draw)). The offers lapse when the window closes.
[market]
# the mode's money is shown as this game item: its icon (sprite currency_item of the atlas currency_atlas) and its
# name. tk_bb000001 = «Puntos de pasión» with Inazuma Fantasy (it renames the item and replaces its icon), the
# retail «Medalla rara BB» without it
currency_item = "tk_bb000001"
currency_atlas = "#/menu/200_icon/02_icon_item/icon_item10.g4tx"
unit = 1000000
value_curve = [[0.0, 0.1], [0.5, 0.4], [0.9, 1.2], [1.0, 2.5]]
start_budget_by_rank = [[0.0, 3.0], [0.5, 1.5], [1.0, 0.6]]
# Prices (scripts\lib\market.lua). A player's value = [levels.value] (his level, the room to his potential, form,
# recent rise, position) x unit. The price his club asks = value x his role there (ask_star: its best star_count
# players by level + form; ask_starter: its best `starters`; ask_reserve: the rest) x the club's stature
# (stature_by_rank: by its rank among the clubs by rating, 0 = the best) x need_ask when it has no more players at his
# position than need_by_position x the career's negotiation option. A free player's fee = free_agent_fee x his value.
# Amounts are rounded by price_round ([from, step]: amounts from `from` up are rounded to `step`). The values are
# worked out again each day of the career (a round, a month of levels); price_batch = values worked out per market
# call while a day's list is priced.
ask_star = 1.6
star_count = 3
starters = 11
ask_starter = 1.35
ask_reserve = 1.0
stature_by_rank = [[0.0, 1.2], [0.5, 1.0], [1.0, 0.85]]
need_ask = 1.25
free_agent_fee = 0.25
price_round = [[0, 1000], [100000, 5000], [1000000, 25000], [10000000, 100000]]
price_batch = 1200
# the most time (ms) a market call spends working the list out (values, rows, names) before it answers with its
# progress; the screen asks again the next frame
work_ms = 8
income_per_round = 0.05
ai_deals_per_round = 6
ai_spend_share = 0.5
ai_sample = 40
need_by_position = [2, 4, 5, 5]
bid_chance = 0.35
bid_range = [[0.0, 0.85], [1.0, 1.15]]
# a player on no list (not blocked, no offer waiting) gets a bid now and then: unlisted_bid_chance a round, the bid
# value × unlisted_bid_range(a draw) (above his value: he was not for sale). A blocked player gets none
unlisted_bid_chance = 0.04
unlisted_bid_range = [[0.0, 1.1], [1.0, 1.4]]
# a player listed for loan gets a loan offer with the chance loan_offer_chance a round: a fee of value ×
# loan_fee_range(a draw), paid by the borrower, and a length drawn from loan_lengths ("window" = until the next
# transfer window closes, "season" = until the season's end). He plays for the borrower and comes back on that day;
# every loan ends when a new season starts
loan_offer_chance = 0.35
loan_fee_range = [[0.0, 0.05], [1.0, 0.15]]
loan_lengths = ["window", "season"]
log_size = 30
# the «Buscar» list: rows on screen
rows_per_page = 14
# The «Buscar» search (owner 2026-10-31, mock-up Mercado 2 A): a name is searched among the players' names in the
# game's language, named name_batch players per call the first time; the media rows step by
# search_level_step between search_level_low and search_level_high; the price row's limits (money)
name_batch = 150
search_level_step = 1
search_level_low = 40
search_level_high = 99
search_prices = [500000, 1000000, 2000000, 3000000, 5000000, 8000000, 10000000, 15000000, 20000000, 30000000, 50000000]
# The transfer talks for a club's player (owner 2026-10-31, mock-up Mercado 2 A). The club's lowest price (its floor) =
# its asking price x talk_floor_<role> (star / starter / reserve), x talk_poor_floor when its money is under
# talk_poor_units x unit. Patience (both sides, owner 2026-10-31): a club starts a talk with talk_patience; each offer
# (or ask) costs it talk_patience_cost (points: the gap to what it accepts as a share, 0 = at it -> the patience used)
# x its demand (its stature by rating rank, +- talk_demand_noise drawn per save and club); at 0 it breaks off. An
# offer at its ask, or at the floor within talk_accept_gap (share of the ask) of it or with its patience under
# talk_accept_patience x the start, buys him. Else the club counters (its ask comes down talk_give of the gap to the
# offer; under talk_low_share x the floor: «too low»). The first offer shown = talk_first_offer x the ask; the offer
# moves in steps of talk_step_share x the ask (talk_big_steps of them with L2 / R2). An offer received: the player may ask more; the bidder pays up to talk_bid_max x its first
# An offer received («Negociar»): the player asks more and the bidder answers after talk_reply_days [min, max] days
# (seeded per save): it pays up to talk_bid_max x the larger of its first offer and the player's value (and its money);
# an ask within that is agreed; an ask over it costs its patience (the gap = ask / that most - 1), and with none left it
# walks away; else it bids again talk_sell_give of the way to the ask (points: the gap as a share of its bid -> the
# share given, +- talk_sell_jitter).
talk_patience = 1.0
talk_patience_cost = [[0.0, 0.06], [0.1, 0.15], [0.25, 0.35], [0.5, 0.65], [1.0, 1.3]]
talk_demand_noise = 0.15
talk_accept_patience = 0.35
talk_low_share = 0.8
talk_give = 0.4
talk_accept_gap = 0.04
talk_floor_star = 0.95
talk_floor_starter = 0.85
talk_floor_reserve = 0.75
talk_poor_units = 1.0
talk_poor_floor = 0.9
talk_first_offer = 0.85
talk_step_share = 0.02
talk_big_steps = 10
talk_bid_max = 1.2
talk_reply_days = [1, 3]
talk_sell_give = [[0.0, 0.6], [0.5, 0.45], [1.0, 0.25]]
talk_sell_jitter = 0.15

# the new career's options, picked on the setup screen after the club (kept in the career, c.options):
# * market_default: the transfer market on (the «Mercado» tab, AI deals, bids); off = the squads stay as built
# * backing_steps: the financial backing (the mode's money) added to the club's first budget; backing_default and
#   backing_jump (LB / RB) are steps of that list (1-based)
# * [[setup.negotiation]]: how the AI clubs deal with the player: ask = × the price they ask him, bid = × their bids for
#   his listed players, bid_chance = × the chance of a bid
# * [[setup.activity]]: the AI clubs' market: deals = their deals per round inside a window, bid_chance = × the
#   chance of a bid
# * sacking_default: the board sacks the manager who misses its objectives at the season's end
[setup]
market_default = true
backing_steps = [0, 100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000, 25000000, 50000000, 100000000, 250000000]
backing_default = 1
backing_jump = 3
negotiation_default = 2
activity_default = 3
sacking_default = true

[[setup.negotiation]]
id = "easy"
text = "NegotiationEasy"
ask = 0.8
bid = 1.15
bid_chance = 1.3

[[setup.negotiation]]
id = "normal"
text = "NegotiationNormal"
ask = 1.0
bid = 1.0
bid_chance = 1.0

[[setup.negotiation]]
id = "hard"
text = "NegotiationHard"
ask = 1.25
bid = 0.85
bid_chance = 0.7

[[setup.activity]]
id = "off"
text = "ActivityOff"
deals = 0
bid_chance = 0.0

[[setup.activity]]
id = "low"
text = "ActivityLow"
deals = 3
bid_chance = 0.6

[[setup.activity]]
id = "normal"
text = "ActivityNormal"
deals = 6
bid_chance = 1.0

[[setup.activity]]
id = "high"
text = "ActivityHigh"
deals = 10
bid_chance = 1.4

# The board's objectives each season (scripts\lib\board.lua), from the club's place in the career's rating order (rank /
# clubs, 1 = the best): the first band whose top_share holds it. superliga_share = the SuperLiga place asked, as a share
# of the clubs; league = the league place asked (0 = none); frontier = the Fútbol Frontier round to reach (Playoff,
# Round16, Quarter, Semi, Final, Champion; empty = none). The board warns once the SuperLiga is over and after
# warn_league_after of the league's matchdays. Missing the league objective and one other sacks the manager at the
# season's end when the career's «sacking» option is on.
[board]
# a band's SuperLiga target (superliga_share x the clubs) never lies past the places that go on to the leagues
warn_league_after = 0.5
bands = [
    { top_share = 0.08, superliga_share = 0.1, league = 2, frontier = "Semi" },
    { top_share = 0.2, superliga_share = 0.25, league = 3, frontier = "Quarter" },
    { top_share = 0.4, superliga_share = 0.4, league = 6, frontier = "Round16" },
    { top_share = 0.6, superliga_share = 0.55, league = 9, frontier = "Round32" },
    { top_share = 1.0, superliga_share = 0.8, league = 12, frontier = "" },
]

[calendar]
# «Fechas»: each competition's colour on the month's match days and on the season's line (names of the career
# screen's colours, the career_tint atlas: navy, direct, cut, gold, orange, win, loss, ...)
competition_colours = { superliga = "navy", league = "direct", frontier = "orange", worldcup = "loss", window = "cut" }
first_year = 2026
season_start = "08-01"
first_match = { month = 8, weekday = "sat", nth = -1 }
season_end = "06-01"
weekend = "sat"
midweek = "wed"
rest_days = 3
draw_after_days = 4
superliga = "weekend"
league = "weekend"
frontier = "midweek"
final = "weekend"
compress = ["superliga", "frontier", "league"]
# days without matches (if they fit)
breaks = [{ from = "12-22", to = "01-03" }]
# the transfer windows (shown on the calendar and on «Inicio»; scripts\career.lua CareerMode.WindowAt(day))
transfer_windows = [{ from = "08-01", to = "08-31" }, { from = "01-01", to = "01-31" }]
# the World Cup's days after the club season (reserved: the World Cup phase of the proposal's §12)
world_cup = { from = "06-24", to = "07-15" }

# The World Cup (the proposal's §12): after the Fútbol Frontier final, in the [calendar] world_cup days. One national
# team per country plays; the player is offered one country at random and picks its squad (squad players, at least
# `keepers` goalkeepers) among the players of that nationality. Every country plays: as few groups of group_size as
# hold them (sizes differ by one at most), single round robin; the knockout is the power of two the first `advance` of
# each group fill best (the next places complete a larger one when there are enough of them, else the best qualified
# fill a smaller one); single matches (a draw goes to penalties), simulated with [sim]. It changes nothing in the
# career (no growth, no trophy). enabled = false: the season ends at the final.
[world_cup]
enabled = true
group_size = 4
advance = 2
squad = 16
keepers = 2
# every player's nationality: the country of the national team rosters that hold him, then this file's players
# ([[CareerMode.Nationality]] country, players = [cards or chara keys]) for players of no national roster or a different country
nationality_file = "content/career/nationalities.toml"

# The countries (owner 2026-10-30): a country's national teams by team key; the first one plays the World Cup (name,
# crest, kit); the call-up pool is every player of that nationality. pool_teams: teams whose players also have the
# country's nationality (no entrant). A key no mod declares is the game's own team ([teams] game_table). A club listed
# in `teams` plays as that country's national team, out of the club competitions. A national team in no country is a
# country alone.
[[world_cup.countries]]
id = "australia"
teams = ["bbcr_ie3_0200_bb", "bbcr_go3_0300_bb", "bbcr_orion_0200_bb"]  # Big Waves IE3, GO3; Demonios Brillantes
[[world_cup.countries]]
id = "south_korea"
teams = ["bbcr_ie3_0500_bb", "bbcr_go3_0200_bb", "bbcr_orion_0100_bb"]  # Dragones de Fuego IE3, GO3; Bisonte Rojo
[[world_cup.countries]]
id = "england"
teams = ["bbcr_ie3_0600_bb"]  # Knights of Queen
[[world_cup.countries]]
id = "italy"
teams = ["bbcr_ie3_1100_bb", "bbcr_orion_1000_bb"]  # Orfeo; Guardianes de la Reina
[[world_cup.countries]]
id = "united_states"
teams = ["bbcr_ie3_0900_bb", "bbcr_orion_0700_bb", "bbcr_legend_orion_06_bb"]  # Unicorn; Navy Invader; Unicornios con Estrellas
[[world_cup.countries]]
id = "brazil"
teams = ["bbcr_ie3_1500_bb", "bbcr_orion_0900_bb"]  # Os Reis; Olé de Samba
[[world_cup.countries]]
id = "spain"
teams = ["bbcr_ie3_1000_bb", "bbcr_orion_0600_bb"]  # Los Rojos; Gigantes Invencibles
