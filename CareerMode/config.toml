[[world_cup.countries]]
id = "saudi_arabia"
teams = ["bbcr_go3_0400_bb", "bbcr_orion_0400_bb"]  # Cimitarras; Ejército del Fénix Árabe
[[world_cup.countries]]
id = "uzbekistan"
teams = ["bbcr_go3_0700_bb", "bbcr_orion_0300_bb"]  # Storm Wolves; Bailarines Eternos
[[world_cup.countries]]
id = "south_africa"
teams = ["bbcr_legend_ie3_07_bb"]  # Caimanes del Cabo
[[world_cup.countries]]
id = "congo"
teams = ["bbcr_ie3_1800_bb"]  # Pequeños Gigantes
[[world_cup.countries]]
id = "qatar"
teams = ["bbcr_ie3_0300_bb"]  # Leones del Desierto
[[world_cup.countries]]
id = "france"
teams = ["bbcr_legend_ie3_05_bb"]  # Grifos de Rosa
[[world_cup.countries]]
id = "germany"
teams = ["bbcr_legend_ie3_06_bb"]  # Brocken Brigade
[[world_cup.countries]]
id = "argentina"
teams = ["bbcr_ie3_0800_bb"]  # Los Emperadores
[[world_cup.countries]]
