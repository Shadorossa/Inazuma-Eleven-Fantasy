[[world_cup.countries]]
id = "italy"
teams = ["bbcr_ie3_1100_bb", "bbcr_orion_1000_bb"]  # Orfeo; Guardianes de la Reina
[[world_cup.countries]]
id = "united_states"
teams = ["bbcr_ie3_0900_bb", "bbcr_orion_0700_bb", "bbcr_legend_orion_06_bb"]  # Unicorn; Navy Invader; Unicornios con Estrellas
[[world_cup.countries]]
id = "brazil"
teams = ["bbcr_ie3_1500_bb", "bbcr_orion_0900_bb"]  # Os Reis; Olé de Samba
[[world_cup.countries]]
id = "spain"
