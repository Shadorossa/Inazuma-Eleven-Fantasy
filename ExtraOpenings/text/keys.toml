mod_description = "タイトルのオープニングを追加します：ニンテンドーDS版イナズマイレブン2（「つながリーヨ」）とイナズマイレブン3（「気合でハリケーン」）のオープニングをHDリマスターで。DS版にあった言語ではゲームの言語で歌います（IE2：日本語、スペイン語／IE3：日本語、英語、スペイン語、イタリア語）。MODオプションの「Opening」の行で選ぶと、ロゴの後とタイトル画面のループで流れます。どちらもシーンアーカイブ（クラブルーム）の専用タブ「イナズマイレブン」にも入っています。このMOD自体に設定はありません。また、DS版のメニュー曲をメニューのBGMに：MODオプションの「メニューBGM」の行。"
