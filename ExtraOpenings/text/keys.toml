title_opening_ie3 = "IE3 | Kiai de Hurricane"
menu_music_ie23 = "Inazuma Eleven 2 / 3"

[zh_hans.new]
mod_name = "额外片头"
mod_description = "更多标题片头：任天堂DS版闪电十一人2（《Tsunagariyo》）和闪电十一人3（《Kiai de Hurricane》）的片头，HD重制，在DS版有该语言时以游戏语言演唱（IE2：日语、西班牙语；IE3：日语、英语、西班牙语、意大利语）。在模组选项的「Opening」一行中选择：它们在标志之后和标题画面循环中播放。两者也收录在场景档案（俱乐部活动室）的专属分页「闪电十一人」中。本模组没有自己的选项。另含DS版的菜单曲，可用作菜单音乐：模组选项的「菜单音乐」一行。"
title_opening_ie2 = "IE2 | Tsunagariyo"
title_opening_ie3 = "IE3 | Kiai de Hurricane"
menu_music_ie23 = "Inazuma Eleven 2 / 3"

[zh_hant.new]
mod_name = "額外片頭"
