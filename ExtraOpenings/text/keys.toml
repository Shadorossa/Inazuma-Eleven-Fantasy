# Texts of Extra Openings (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("extra_openings.<name>"): the mod's name and description on the «Mods» screen, and the labels of its openings
# in the VR-Framework's «Opening» row (content/scenes/openings.toml `label`: title_opening_<id>; the song names are the same
# in every language) and of its DS menu theme in the «Música del menú» row (content/sounds/sounds.toml [[VRFW.MenuMusic]]
# Text: menu_music_ie23, the same in every language). A language missing here falls back to English. (The scene archive
# titles are fixed-id rows:
# text\rows\scene_archive_text.toml.)
schema = "vr_framework.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Extra Openings"
mod_description = "More title openings: the Nintendo DS openings of Inazuma Eleven 2 («Tsunagariyo») and Inazuma Eleven 3 («Kiai de Hurricane»), remastered in HD, sung in the game's language where the DS games had it (IE2: Japanese, Spanish; IE3: Japanese, English, Spanish, Italian). Choose them in Mod options, row «Opening»: they play after the logos and in the title screen's loop. Both are also in the scene archive (Club room), in its own «Inazuma Eleven» tab. The mod has no options of its own. Also the DS games' menu theme for the menus: Mod options, row «Menu music»."
title_opening_ie2 = "IE2 | Tsunagariyo"
title_opening_ie3 = "IE3 | Kiai de Hurricane"
menu_music_ie23 = "Inazuma Eleven 2 / 3"

