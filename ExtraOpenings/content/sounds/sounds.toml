schema = "vr_framework.sound/1"
# Extra Openings' music tracks (sound type of the VR-Framework: docs/framework/types/sound.md). New tracks, BGM id =
# crc32(name), the same names (and ids) they had inside Inazuma Fantasy until 2026-10-08. Generated by
# research/scripts/ds_opening_build.py (`hca`, `previews`), tracked as they were in IF; the .hca in assets\sounds\music\
# (standard mod layout, 1.2.0: `file` = the path relative to the mod).

# Title opening songs (docs/game/media/opening-selector-bank.md §4). Each one is played once (no loop baked:
# `loop = false`, the .hca used as it is), 48 kHz stereo:
# * if_op_<game>_<lang>: the sound of the DS opening movies (bgmName of the movie rows the VR-Framework adds from
#   content/scenes/openings.toml and of the scene archive rows in content/tables/common/gamedata/movie/
#   movie_playing_config.toml) and
#   the «Opening» row's ▶ preview. ja = the 4K remaster video's own audio; es / en / it = the ROM's op00(f).SAD of that
#   language, aligned to the video by cross-correlation (IE3 +0.082 s, IE2 +0.0545 s), cut to the video length.
# * if_op_vr_*: the retail VR opening songs (anime_stream cues ev01_00050 / ev07_00140 / ev20_00050) cut to their
#   movie's length, made for the ▶ preview of IF's old selector row. Nothing names them today (the framework's
#   detected openings have no preview: docs/framework/opening.md §6); kept as tracks for a later preview.
[[music]]
add = "if_op_ie3_ja"
file = "assets/sounds/music/if_op_ie3_ja.hca"
loop = false

[[music]]
add = "if_op_ie3_es"
file = "assets/sounds/music/if_op_ie3_es.hca"
loop = false

[[music]]
add = "if_op_ie3_en"
file = "assets/sounds/music/if_op_ie3_en.hca"
loop = false

[[music]]
add = "if_op_ie3_it"
file = "assets/sounds/music/if_op_ie3_it.hca"
loop = false

[[music]]
add = "if_op_ie2_ja"
file = "assets/sounds/music/if_op_ie2_ja.hca"
loop = false

[[music]]
add = "if_op_ie2_es"
file = "assets/sounds/music/if_op_ie2_es.hca"
loop = false

[[music]]
add = "if_op_vr_op1"
file = "assets/sounds/music/if_op_vr_op1.hca"
loop = false

[[music]]
add = "if_op_vr_op2"
file = "assets/sounds/music/if_op_vr_op2.hca"
loop = false

[[music]]
add = "if_op_vr_chronicle"
file = "assets/sounds/music/if_op_vr_chronicle.hca"
loop = false

# The Nintendo DS menu theme (since 1.1.0): the music of the DS games' title menu (title screen + its New game /
# Continue menu), data_iz/sound/sp/TITLE.SAD («INAZUMATHEME», Procyon SADL). IE2 (NDS ROM) and IE3 (3DS romfs) ship
# the same file byte for byte, so it is ONE track for both. 48 kHz stereo, 49.92 s, the DS loop kept (loop on, from
# sample 44 = 0.0009 s to the end) and baked in the .hca; loudness matched to the retail menu BGM bg10000
# (-13.7 LUFS vs -13.6, -1 dBFS peak limiter). Generated by research/scripts/ds_menu_music_build.py.
[[music]]
add = "exop_menu_ie23"
name = "Inazuma Eleven 2 / 3"
file = "assets/sounds/music/exop_menu_ie23.hca"

# A theme of the VR-Framework's «Música del menú» row (Opciones de mods; docs/framework/menu-music.md): the main menu,
# the team dock and the market play it instead of the retail menu music while it is picked. Label: text\keys.toml
# menu_music_ie23 (9 languages).
[[VRFW.MenuMusic]]
Name = "ExtraOpenings.MenuIE23"
Music = "exop_menu_ie23"
Text = "menu_music_ie23"
