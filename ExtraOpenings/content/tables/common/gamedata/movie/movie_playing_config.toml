schema = "vr_framework.table/1"
# Movie rows of the scene archive rows of Extra Openings (scenes/scene_archive.toml). The title openings' own rows
# (if_op_ie2_{ja,es}, if_op_ie3_{ja,es,en,it}) are not here: the VR-Framework adds them from scenes/openings.toml
# (kind vr_framework.opening/1, docs/framework/opening.md). These are the archive's: `ev_if_vt_op_<game>` (the default
# song) and `ev_if_vt_op_<game>_<lang>` (the variant the VR-Framework's scene archive plays for that game language),
# clones of ev74_01190 (2638440937: event subtitle menu, no subtitles, no staff roll) with the opening's USM and song.
table = "movie/movie_playing_info"

# ---- videoteca: GENERATED by research/scripts/videoteca_build.py data (docs/game/ui/videoteca.md) ----
# The «Videoteca» movies (scene archive rows, scenes/scene_archive.toml): movieId = crc32 of the event the archive
# row names (ev_if_vt_<key>), `<event>_<lang>` = the variant the VR-Framework's scene_archive_menu handler plays for
# that game text language.
# Anime scenes: the IE3 ROM's subtitles (files\data\common\text\<lg>\event + gamedata\event\subtitle).

[[add]]
key = "ev_if_vt_op_ie2"
from = 2638440937
cells = { moviePath = "common/movie/if_op_ie2.usm", bgmName = "if_op_ie2_ja" }

