schema = "vr_framework.scene_archive/1"
# «Archivo de escenas» (docs/game/ui/videoteca.md, docs/framework/scene-archive.md): the sections (tabs) these
# rows use, shared by id with every other mod that declares them (one tab), and the rows. Row order = `order`
# (100 + the entry's position in videoteca_build.py ENTRIES, so the rows of several mods interleave), then load
# order. event = an event of type 8 (techniques/events/videoteca_env.toml) whose movie row
# (tables/common/gamedata/movie/movie_playing_config.toml) the archive plays; title (default the key) = a
# scene_archive_text row (text/rows/scene_archive_text.toml). Generated by research/scripts/videoteca_build.py data.

[[section]]
id = "inazuma_eleven"
text = { ja = "イナズマイレブン", en = "Inazuma Eleven", es = "Inazuma Eleven", fr = "Inazuma Eleven", de = "Inazuma Eleven", it = "Inazuma Eleven", pt = "Inazuma Eleven", zh_hans = "闪电十一人", zh_hant = "閃電十一人" }
order = 100

[[row]]
