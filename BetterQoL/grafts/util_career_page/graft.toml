# Career page «TRAYECTORIA» of the mod Utilities (docs/game/mechanics/player-career-stats.md §4; feature career,
# scripts\career.lua answers CMND_BETTERQOL_CAREER_EX): one more page of the player plate (personal_plate_menu); v6
# (2026-10-16): a timeline (signing, first goal, first MVP, today) with three chips over a card-back table (modes,
# total, record line), on the free text layers util_cs_text / util_cs_textb, the chips util_cs_cellt and the sprite
# quads util_cs_band / util_cs_icon (Utilities' menus\102_team\career.toml, images\menu\career_band.toml).
# * The page (BetterQoL.Career, index 5, type 6, Last) is declared to the VR-Framework's player page registry
#   (VRFW_PlayerPages, docs/framework/player-pages.md): always the last page, after the retail four or after Inazuma
#   Fantasy's pages; the framework maps the type and steps Q/E (formation / team dock screens, the plate). The retail
#   character banks keep the retail four (their page table is a chunk local); Inazuma Fantasy's bank tables hold it.
# * Inazuma Fantasy's paged plate: IF's plate_pages block hands the page change to UTIL_CS.PageChange under its own
#   wrappers and draws the page dots from the registry.
# HOOK files (docs/framework/lua-hosts.md §7): the globals are wrapped directly (once per VM, chained over the host
# dispatchers / IF's lua_early files). Generated: edit util_cs_*.src.lua and run gen_hooks.py (fills @crc, includes
# the common block in the plate file). Layouts / objbins: research/scripts/career_panel.py --utilities.
# Moved from Inazuma Fantasy (graft career_page, table EVT_CS, CMND_EVT_CAREER_EX) on 2026-10-08.
name = "util_career_page"
mod = "BetterQoL"
order = 960
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Career page «TRAYECTORIA» on the player plate (retail or Inazuma Fantasy's) (Utilities)"

[[hooks]]
stem = "team_dock_formation_menu"
src = "util_cs_common.lua"

[[hooks]]
stem = "soccer_team_dock_menu"
src = "util_cs_common.lua"

[[hooks]]
stem = "soccer_formation_menu"
src = "util_cs_common.lua"

[[hooks]]
stem = "chara_bank_menu"
src = "util_cs_common.lua"

[[hooks]]
stem = "chara_bank_menu_for_search"
src = "util_cs_common.lua"

[[hooks]]
stem = "personal_plate_menu"
src = "util_cs_plate.lua"
