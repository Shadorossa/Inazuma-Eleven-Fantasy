description = { ja = "５バックで最終ラインを固めた　バランス型の陣形。\n中央からの攻撃が得意。\nどんな相手にも対応しやすい。", en = "A balanced formation built on a back line of five.\nIts play goes mainly through the middle. It adapts\nwell to any opponent.", es = "Una formación equilibrada con una línea defensiva de\ncinco. Su juego pasa sobre todo por el centro. Se\nadapta bien a cualquier rival.", fr = "Une formation équilibrée bâtie sur une défense à cinq.\nSon jeu passe surtout par l'axe. Elle s'adapte bien à\ntout adversaire.", de = "Eine ausgewogene Aufstellung mit einer Abwehrreihe aus\nfünf Spielern. Das Spiel läuft vor allem durch die Mitte.\nSie passt sich jedem Gegner gut an.", it = "Una formazione equilibrata con una linea difensiva a\ncinque. Il gioco passa soprattutto per il centro. Si\nadatta bene a qualsiasi avversario.", pt = "Formação equilibrada com uma linha defensiva de\ncinco. O jogo passa principalmente pelo meio.\nAdapta-se bem a qualquer adversário.", zh_hans = "以五名后卫构筑防线的平衡型阵型。\n擅长中路进攻。\n能灵活应对各种对手。", zh_hant = "以五名後衛構築防線的平衡型陣型。\n擅長中路進攻。\n能靈活應對各種對手。" }

