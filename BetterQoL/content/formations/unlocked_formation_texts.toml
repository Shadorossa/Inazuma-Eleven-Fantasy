# Better QoL › Unlocked formations: the names and descriptions of the formations the game has but never offers, in
# the 9 languages. Each name is the game's own name of that language with its DF-MC-DL shape first (position_id 2-3 /
# 4-7 / 8-10), written as that language writes the offered formations; where the game left only a Japanese placeholder
# for the description, it is built from the layout by research/scripts/formation_descriptions.py. The formations with
# a layout of their own in series_formations.toml carry their texts there; the two descriptions translated from the
# game's Japanese text (F-Raimon, F-Basic) are text rows (text/rows/formation_descriptions.toml).
schema = "VRFW.formation/1"

