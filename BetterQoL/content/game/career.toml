# Career stats («TRAYECTORIA» page of the player plate): what the feature reads from the game (nie.exe PC v7.1.2) and
# the Lua commands it answers. The logic is scripts\career.lua (BetterQoL.Career.*). docs/game/mechanics/player-career-stats.md
# Was utilities.dll's career module (crates/plugins/utilities/src/career, removed 2026-10-10).
schema = "VRFW.game/2"

# ---------------------------------------------------------------- game functions

# ---------------------------------------------------------------- globals

# The match info block `mi` = [[g_gameRoot]+0x6A58].
[[VRFW.Global]]
name = "match_info"
base = "game_root"
chain = ["ROOT_MATCH"]

# The play data block [[g_gameRoot]+0x69C8] (+0x2CAC6F = the play-mode byte).
[[VRFW.Global]]
name = "play_data"
base = "game_root"
chain = ["ROOT_PLAY_DATA"]

# `[g_ballOwner]` = the ball-owner block (+0x1494 owner actor handle, +0x1498 its team): the site in the handler of
# `CMND_IS_BALL_OWNER_CHARA` 0xC2A98A.
[[VRFW.Global]]
name = "ball"
game = "Ball.Global"

# ---------------------------------------------------------------- Lua commands (crc32 of the name: the grafts ask
# `@crc:NAME@`; the CMND_EVT_* names are the ones Inazuma Fantasy registered until 2026-10-08)

# CMND_BETTERQOL_CAREER_MATCH(mode) -> state (0 idle, 1 tracking, 2 recorded / done). From the match HUD (graft
# util_career_match): 1 kick-off, 0 every frame, 2 half time, 3 full-time result.
[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER_MATCH"
aliases = ["CMND_EVT_CAREER_MATCH"]
handler = "BetterQoL.Career.Match"
needs = ["Match.ActorUnit", "match_info", "Match.SoccerActors.ViaSkillUsed", "ball"]

# CMND_BETTERQOL_CAREER(charaStHdl) -> ok, signed, before, matches, wins, draws, losses, goals, assists, mvp, topSkill, topUses
[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER"
aliases = ["CMND_EVT_CAREER"]
handler = "BetterQoL.Career.Get"

# CMND_BETTERQOL_CAREER_EX(charaStHdl, group) -> ok, then the numbers of a group (graft util_career_page)
[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER_EX"
aliases = ["CMND_EVT_CAREER_EX"]
handler = "BetterQoL.Career.Ex"

# «Estadísticas del club» (the row of «Caseta del club», graft util_club_stats_row; the panel
# assets/lua/play_guide_top_menu/150_club_stats.lua):
# CMND_BETTERQOL_CLUB_STATS(langCode) -> ok, players, since, matches, wins, draws, losses, goalsFor, goalsAgainst,
# cleanSheets, bestWinFor, bestWinAgainst, bestWinDay, bestWinRun, bestUnbeatenRun, storeSince, today
[[VRFW.Command]]
name = "CMND_BETTERQOL_CLUB_STATS"
handler = "BetterQoL.Career.Club"

# CMND_BETTERQOL_CLUB_STATS_ROW(i) -> chara_base, name, matches, wins, draws, losses, goals, assists, mvp, signed
[[VRFW.Command]]
name = "CMND_BETTERQOL_CLUB_STATS_ROW"
handler = "BetterQoL.Career.ClubRow"
