schema = "VRFW.game/2"

# Utilities › «Modo Comandante automático» (feature auto_commander; docs/game/ui/comandante-guia.md §7). With the
# option row utilities.auto_commander (options.toml) on, a match starts in Commander mode (the AI plays your team,
# you give orders) in Battle Bay matches (beaten rival or not, gate open) and in free matches / Heroic battles against a
# beaten rival; other matches keep the game's rules. The player can still switch to Manual in the match. Logic:
# scripts\auto_commander.lua.
#
# How the game does it (nie.exe v7.1.2):
# * Coach-mode object [g_soccerMgr 0x21F6350] + 0x2028: u32 state, u32 flags (+0x2C), +0x30 pending mode, +0x31 lock,
#   +0x32 mode (0 Manual, 1 Commander, 2 Spectator, 3 event, 5 none).
# * RequestCoachMode(u8 mode, Req* req) 0x15E29B0: the engine's mode change (online forces 0; a set req+8 with the lock
#   on makes it pending). Req = { u32 flags_set, u32 flags_clear, u8 defer, u8, u8 keep_flags, u8 force } (16 bytes).
# * The match scene's InitState 0x1439C30 sets the first mode right after SetupTeamAIs: RequestCoachMode(debug byte
#   0x22AE7F6, &zeroed req) at 0x143A1E2 (the byte is 0 in the retail build: Manual). The scene's second init 0x143D470
#   does the same with a literal 0 at 0x143D6A4. BattleSettingFlow 0x1436F50 state 0x11 later forces 1 only for the
#   matches flagged 0x200000 (match info +0), 0 online and 3 for its spectator case.
# * The player's toggle (CMD_CHANGE_COACH_MODE, 0x15995B0) first asks CoachModeBlocked(u8* why) 0xEBF110: true =
#   refused; why = 1 → «No se puede usar contra rivales que no hayas vencido ya.» (SendErrorMessageChangeCoachAI). It
#   is refused when the running (game, difficulty) row of the match table has its victory bit clear, when the match has
#   no row at all (silently), and by fixed exits (online, tutorial, flagged matches). The HUD guide asks it too and shows
#   «Modo Comandante» only with why = 1 (SetVisibleChangeCoachAIModeButton).
#
# The AI of the user's team in Commander mode: the game's Commander class (SoccerAIProperty_Coach). With the row on and a
# mod that gives the rival a match AI profile (VRFW.MatchAI, e.g. Football Reforged's Legendary Match), the user's team
# plays the same profiles while it is in Commander mode (hook BetterQoL.CoachAISet below); without one, the game's.
#
# What Utilities does: the two init calls are hooked (`call` hooks): with the row on, the script classifies the match
# (match info game id +4, difficulty +0x15; config.toml [auto_commander]) and, for a Battle Bay match or a free match /
# Heroic battle the game would allow (the original gate), turns their mode into 1 with the flags the player's toggle
# uses (set 2, clear 0xC00). Only for a Battle Bay match it fills the table BetterQoL.AutoCommander so the gate answers
# "allowed" natively for the rest of that match. Every init empties the tables first: the game's own rules.

# [[g_gameRoot] + 0x6A58] = the running match's info (u32 flags at +0: 0x200000 = a match the game starts in Commander
# mode itself and keeps there)
[[VRFW.Global]]
name = "util_match_info"
base = "game_root"
chain = ["ROOT_MATCH"]

# InitState 0x1439C30: movzx ecx, byte [rip + debug mode]; lea rdx, [rbp-78h]; xorps; movups [rbp-78h], xmm0;
# call RequestCoachMode (0x143A1E2). The calls before it (SetupTeamAIs …) are wildcarded.
[[VRFW.Hook]]
name = "BetterQoL.CoachModeInit"
game = "Match.CoachModeInitFirst"
kind = "call"
wait_ms = 500

# The scene's second init 0x143D470: xorps; lea rdx, [rbp-10h]; xor ecx, ecx; movups [rbp-10h], xmm0;
# call RequestCoachMode (0x143D6A4).
[[VRFW.Hook]]
name = "BetterQoL.CoachModeInit2"
game = "Match.CoachModeInitSecond"
kind = "call"
wait_ms = 500

# bool CoachModeBlocked(u8* why) 0xEBF110: push rbx; push r14; sub rsp, 48h; mov rax, [rip + g_gameRoot] (15 bytes
# stolen, the RIP operand relocated). Answered natively after the game's code while the table holds the match's entry.
[[VRFW.Hook]]
name = "BetterQoL.CoachModeGate"
game = "Match.IsCoachModeBlocked"
kind = "function"

# the guide's «Modo Comandante» is shown (why = 1) when the game refused; first, so it still sees the game's answer
[[VRFW.Hook.answer]]
table = "BetterQoL.AutoCommanderWhy"
key = ["0"]
when = [
  { value = "ret", not = 0 },
  { value = "args[1]", not = 0 },
]
write = "[args[1]]:u8"

# then the answer itself: 0 = not blocked
[[VRFW.Hook.answer]]
table = "BetterQoL.AutoCommander"
key = ["0"]
when = { value = "ret", not = 0 }
write = "ret"

# The rival's AI for the user's team in Commander mode. void SetCoachAI(CoachAI* ai, bool on) 0x14AE0F0 (v7.1.2
# 0x1490010, the same bytes): the coach AI object = TeamAI + 0x12440 (+0 its team, +0xE0 its mode: 1 Commander); on:
# SetTeamAIProperty(team, row level, &crc32("SoccerAIProperty_Coach")), off: SetTeamAIProperty(team, row level, &0)
# (the row's class). Callers: the mode switches 0x148BBB0 / 0x148BC60, 0x14AE6D0 (to spectator: off first), 0x123E6B0.
# Pre (scripts\auto_commander.lua): with the row on, «on» for the user's team asks the framework's match AI service to
# play the rival's profiles on the user's side (VRFW.ai.mirror_profiles), before the game loads the class, so a class
# among them replaces the Commander class; «off» takes them away again (VRFW.ai.reset_profiles) before the row's class
# comes back. Prologue: mov [rsp+20h], rbx; push rdi; sub rsp, 20h; cmp byte [rcx+0E0h], 1 (17 bytes, no RIP operand).
[[VRFW.Hook]]
name = "BetterQoL.CoachAISet"
kind = "function"
pattern = "48 89 5C 24 20 57 48 83 EC 20 80 B9 E0 00 00 00 01 0F B6 FA 48 8B D9 0F 94 C0 3A C2 0F 84 ?? ?? ?? ?? 88 91 E0 00 00 00 E8"
rva = 0x14AE0F0
steal = 17
args = ["ptr", "u8"]
wait_ms = 500

# ------------------------------------------------------------------------------------------------ Commander speed
# The game's own Commander speed-up (Settings «Modo Comandante veloz», settings byte +0x72): GameTick (v7.2.1
# 0xF91600), while the user's team plays in Commander mode and no event scene runs, multiplies the frame's time scale
# by 2.0 (`test r11b, cl; je; movss xmm0, [timeScale]; mulss xmm0, [2.0]; movss [timeScale], xmm0`). With these two
# patches the factor comes from the buffer BetterQoL.CommanderSpeed (f32, scripts\auto_commander.lua): 0 = the game's
# rule (its setting, x2); above 0 = that factor for every Commander frame, whatever the game's setting (1.0 = normal
# speed). Written once per session by the script; the buffer changes the factor live.
#
# Stub at the gate (5 bytes `test r11b, cl; je +0x18`): mov rax, buffer; movss xmm1, [rax]; xorps xmm2, xmm2;
# comiss xmm1, xmm2; ja own; test r11b, cl; je skip; mov eax, 2.0; movd xmm1, eax; jmp scale; own: test cl, cl;
# je skip; scale: jmp gate + 5; skip: jmp after the store. xmm1 / xmm2 / rax are free there (a call follows).
[[VRFW.Patch]]
name = "BetterQoL.CommanderSpeedGate"
kind = "stub"
apply = "script"
pattern = "44 38 2D ?? ?? ?? ?? 0F 44 C8 41 84 CB 74 18 F3 0F 10 05 ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? F3 0F 11 05"
rva = 0xF91BFB
offset = 0x0A
expect = "41 84 CB 74 18"
code = "48 B8 ?? ?? ?? ?? ?? ?? ?? ?? F3 0F 10 08 0F 57 D2 0F 2F CA 77 10 41 84 CB 74 14 B8 00 00 00 40 66 0F 6E C8 EB 04 84 C9 74 05 E9 ?? ?? ?? ?? E9 ?? ?? ?? ??"
tail = false
refs = [{ at = 43, to = 0x0F }, { at = 48, to = 0x27 }]
imm = [{ at = 2, width = "u64", value = 0 }]

# the multiply takes the stub's factor: mulss xmm0, [rip + 2.0] -> mulss xmm0, xmm1
[[VRFW.Patch]]
name = "BetterQoL.CommanderSpeedFactor"
pattern = "44 38 2D ?? ?? ?? ?? 0F 44 C8 41 84 CB 74 18 F3 0F 10 05 ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? F3 0F 11 05"
rva = 0xF91BFB
offset = 0x17
expect = "F3 0F 59 05 ?? ?? ?? ??"
bytes = "F3 0F 59 C1 90 90 90 90"
apply = "script"
