# Utilities: the list window of «Configuración de pasivas» on the player plate (personal_plate_menu, page «PASIVAS
# DE EQUIPO»; Lua research/grafts/passive_config util_pc_plate.src.lua, docs/game/mechanics/pasivas-configurables.md
# §2.6). Everything here is a declaration over the player's own game files (retail objects / layouts copied and
# moved), so the screen works with only the VR-Framework and Utilities installed. Since 2026-10-08 (before: Inazuma
# Fantasy's layers evt_ss_listbg / evt_ss_list / team08_02_ability_list_item / evt_pc_filter).
#   util_pc_listbg   blue backdrop (cmn02_01_bluebg on a resized layout), behind the list
#   util_pc_list     the board picker's list frame (team08_01) without its native list view: 6 row anchors 102 px
#                    apart; its empty-list text node is the category name of the filter header
#   util_pc_row      x6, the list row (team08_02) taller (104 px, 2-line text box 660 x 88) with the plate row's icon
#                    block (backing 72 px, effect icon 64 px, archetype badge 44 px)
#   util_pc_filter   the filter header «Z ‹ Todas › C» (the team dock number's arrows and Z / C glyphs)
# Draw priorities are set by the Lua at OnSetupLayer (449 backdrop, 450 list, 451 rows, 452 header).
schema = "VRFW.menu/2"

