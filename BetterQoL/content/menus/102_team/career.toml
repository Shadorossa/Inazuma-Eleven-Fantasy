    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xC9751E57, 0x73029157, 0x7654A160, 5] },
    # v6: the milestone icons / today's dot [util_cs_icon<i>, _atc_passive01, util_cs_icon, i]
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x9FEB91FF, 0x73029157, 0x5B1F2A50, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xE8ECA169, 0x73029157, 0x5B1F2A50, 1] },
