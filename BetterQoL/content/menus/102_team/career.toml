    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xCE18DA4E, 0x73029157, 0x7654A160, 1] },
    # v6: band instances 2..5 (timeline line, chip backs) [util_cs_band<i>, _atc_passive01, util_cs_band, i]
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x57118BF4, 0x73029157, 0x7654A160, 2] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x2016BB62, 0x73029157, 0x7654A160, 3] },
