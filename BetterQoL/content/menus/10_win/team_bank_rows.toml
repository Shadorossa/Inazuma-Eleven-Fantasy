# Team bank pages (feature team_banks): the rows of the «PLANTILLA DE EQUIPO» dock list (sub_window type 2, window
# win05_15_sub_list_locator_doc + rows mainmenu90_31_doc_item) drawn at the window's own scale.
#
# Why (Nacho 2026-10-08, in game): the rows were 64 % of their size inside the retail window, so they sat 104 px
# apart with big gaps and left the right ~40 % of the panel empty. Cause: the row layer shares its layout
# mainmenu90_31.g4pkm with the team panel of the top bar, and Clean HUD scales that layout's root
# (mainmenu90_31_output) for its compact top bar; an attached layer does not inherit an attach locator's scale
# (docs/game/ui/ui-redesign.md §1.2), so the shrink was put on the shared layout and reached this list too.
# Fix: the list's row layer uses its own object util_tb_doc_item (the retail object, OBJ_BGN name kept) on its own
# layout copy whose root scale is set below. 2026-10-08 round 2 (Nacho: window too wide): the window (Utilities'
# assets\ win05_15.g4pkm) and these rows are scaled uniformly by the same factor (the panel background is one quad
# with rounded corners: only a uniform scale keeps them), so the rows still fill the list and sit at the retail
# spacing; cursor, scroll step and page keys stay the retail list's (mViewNum 5, locators _list00.._list06).
# The scale below and the window's geometry are written by research/scripts/team_banks_window_build.py (SCALE): do not
# edit them by hand. Independent of Clean HUD (with or without it).
# Applies to every user of the sub_window dock list (team banks, Partido libre «cambiar equipo activo», the VR
# tournament team lists): all of them are the same window.
schema = "VRFW.menu/2"

[[layout]]
file = "common/menu/100_mainmenu/mainmenu90/util_tb_doc_item/util_tb_doc_item.g4pkm"
from = "common/menu/100_mainmenu/mainmenu90/mainmenu90_31/mainmenu90_31.g4pkm"

# the rows' root scale in the dock list = team_banks_window_build.py SCALE (set explicitly: `from` may be another
# mod's scaled copy)
[[layout]]
file = "common/menu/100_mainmenu/mainmenu90/util_tb_doc_item/util_tb_doc_item.g4pkm"
joint = "mainmenu90_31_output"
scale = [0.8, 0.8, 1.0]

# the category label «PLANTILLA DE EQUIPO» (_sdock_gtxt_teamdock01, a per-language texture, 728 px wide, its text spans
# 23 % (pt) .. 59 % (fr) of it) ran into «Nv. EQUIPO» in the longest languages (Italian / French: the label ended 4-7 px from
# the level label). Uniform 0.88 about its top-left corner (retail 364 x 40 at 258, -13), moved down 2.4 to stay centred:
# the text now ends >= 24 px before the level text in all 9 languages (v7.1.2 and v7.2.1 layouts are identical).
[[layout]]
file = "common/menu/100_mainmenu/mainmenu90/util_tb_doc_item/util_tb_doc_item.g4pkm"
joint = "_sdock_gtxt_teamdock01"
translate = [258.0, -15.4, 0.0]
scale = [320.32, 35.2, 1.0]

[[object]]
name = "util_tb_doc_item"
from = "mainmenu90_31_doc_item"
keep_name = true
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/100_mainmenu/mainmenu90/mainmenu90_31/mainmenu90_31.g4pkm" }, values = { 1 = "common/menu/100_mainmenu/mainmenu90/util_tb_doc_item/util_tb_doc_item.g4pkm" } },
]

[[patch]]
menu = "sub_window"
layer = "mainmenu90_31_doc_item"
object = "util_tb_doc_item"
