# Utilities › passive configurator: what it knows about the GAME's own passives (format: the module docs of
# crates/utilities-core/src/passive_config/decl.rs, docs/game/mechanics/pasivas-configurables.md §3).
# The game's passives themselves come from the passive tables the game loads (retail keys ps1NNNN are offered);
# other mods add theirs with their own passive_config\*.toml (mod root, or features\<x>\content\passive_config\).
# Moved here on 2026-10-10 from research/mods/BetterQoL/passive_config/retail.toml (same content).
schema = "utilities.passive_config/1"

# «Recompensas» group of the picker: general passives whose effect raises an acquisition rate. The handlers are the
# soccer_basic_effect_config funcNames of the team drop rate of common items and of unusual items (v7.1.2 has no
# passive effect for experience, money, Puntos de pasión / amistad or scout chance: every funcName a passive uses was
# checked). A mod that adds such a handler declares it in its own file.
[[reward_handler]]
func = 0x2B2D1BB3
[[reward_handler]]
func = 0x59726FA4

# The basic effect ids of those handlers in v7.1.2 (PASSIVE_SKILL_EFFECT_INFO_EFFECT_DATA column 0 of ps10050 /
# ps10051), used when soccer_basic_effect_config is not readable (it is packed in the CPK).
[[reward_effect]]
id = 0xA98249C2
[[reward_effect]]
id = 0xC945C027
