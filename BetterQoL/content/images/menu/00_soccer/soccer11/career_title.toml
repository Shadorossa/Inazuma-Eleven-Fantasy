# util_career_page swaps it into the six-sense title mesh: UTIL_CS.SP_TITLE). 1200 x 128 like the retail titles, one
# per language (default = ja / en / zh). Moved from Inazuma Fantasy (evt_gtxt_career01 / texture evt_cs_title) on
# 2026-10-08: the same pictures (the mod's own lettering). In the mod's own localised atlas util_career_title (never
