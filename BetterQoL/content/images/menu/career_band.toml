# Utilities: the row band of the player plate's career page «TRAYECTORIA» (feature career; the Lua research/grafts/
# util_career_page swaps it into the frame of its gauge copies util_cs_band: UTIL_CS.SP_BAND). A slanted light-blue
# rectangle, 780 x 72 (the band Nacho approved on Inazuma Fantasy's player page, round 14c, 2026-10-06).
# Every sprite of the page is in the mod's own atlas util_career_page (never a game atlas; the plate menus load it:
# content\menus\102_team\career.toml), one texture with each sprite at a fixed place.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/102_team/util_career_page/util_career_page.g4tx"
name = "util_career_page"
size = [1680, 388]

[[sprite]]
atlas = "#/menu/102_team/util_career_page/util_career_page.g4tx"
name = "util_cs_band"
texture = "util_career_page"
x = 0
y = 104
png = "02_btl/btl06/btl06_13/util_cs_band.png"

# v6 (2026-10-16, «línea de vida» + «reverso de cromo»): the quads of the page (util_cs_band / util_cs_icon instances,
# graft util_career_page UTIL_CS.QUAD_SPRITE): row bands of the card-back table, the timeline line, the chips' backs
# and today's dot (Utilities' own pictures, research/scripts/career_page_sprites.py) and the three milestone icons,
# made on the player's PC from the retail icons of icon_common (signing: a player, first goal: the golden ball, first
# «Jugador del partido»: the star badge).
