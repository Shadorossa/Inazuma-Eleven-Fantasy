# Utilities, feature neutral_element (docs/game/ui/neutral-element-icon.md): the text icon [$gaiji_cmd_type00] (purple
# square, black rim, black ensō) of the «neutro» element in gaiji_game.g4tx. Made at the first start (and after a game
# update) from the PLAYER'S own game files by an image recipe (docs/framework/types/image.md §2.1): the retail wind
# gaiji with its glyph covered by a stretched glyph-free column, its blue moved to the neutral purple (the black rim
# stays black), and our own ensō (neutral\enso_gaiji.png, research/scripts/util_neutral_icon_parts.py) on top.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/font/gaiji_game.g4tx"
name = "gaiji_game"
size = [908, 928]

[[sprite]]
atlas = "#/font/gaiji_game.g4tx"
name = "gaiji_cmd_type00"
texture = "gaiji_game"
x = 4
y = 860
size = [64, 64]
recipe = "gaiji"

[[recipe]]
name = "enso"
png = "neutral/enso_gaiji.png"

[[recipe]]
name = "wind"
game = "#/font/gaiji_game.g4tx"
sprite = "gaiji_cmd_type01"

[[recipe]]
name = "strip"
from = "wind"
ops = [{ op = "crop", box = [12, 0, 13, 64] }, { op = "resize", size = [39, 64] }]

# wind blue (120, 180, 255) -> purple (173, 81, 234), black (the rim) stays black
[[recipe]]
name = "gaiji"
from = "wind"
ops = [
    { op = "paste", image = "strip", at = [12, 0] },
    { op = "affine", mul = [1.4417, 0.45, 0.9176], add = [0.0, 0.0, 0.0] },
    { op = "paste", image = "enso", at = [0, 0] },
]
