# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
name = "BetterQoL"
version = "1.88.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Quality-of-life tools for any save. Team Dock pages: the Team Dock gets pages of 11 squads (10 pages by default, set in config.toml); R3 / N opens the squad list, L2 / R2 (Q / E) turn the pages. Passive configurator: choose which passives each player has (3 slots by default, up to 5 in config.toml; coaches and managers choose from their role's passives); other mods can add their own passives to the list. The player's archetype follows his two archetype passives (two of one archetype = that one; two different archetypes = a double archetype, shown next to each other in Character Reforged's player header). Match camera options. Home / Away kit: in the kit picker, Y shows the away version of any kit and A saves it. Void element icon: players without an element and Void moves show the purple ensō wherever the game draws element icons. Visual style: the look of the 3D image (Original, IE3, Chrono Stone, Soft or Thick outline) in Mod options, applied at once without restarting. Unlocked formations: the 11-a-side formations the game has but never offers (the series' F- formations) can be chosen in the formation picker. Role medal without matches: any player can get the coach or manager medal without the game's 10 / 30 matches (the numbers are set in config.toml [role_medal], 0 by default). Shop filter: in the shop tabs of equipment, kits, emblems, moves and auras, Tab opens the game's item filter window (series, stat, element...) and filters the tab's goods. Move level badges (Spanish): the level badges and grade icons of special moves as stars instead of +1 / +2 / +3, a row of Mod options. Player career stats: a CAREER page on the player plate with each player's signing date, matches, wins / draws / losses, goals, assists, MVP awards, shots, saves and more, counted from every match. Club stats: a «Club stats» row in the Clubroom opens a page of its own (like the Scene archive) with the club totals (matches, wins / draws / losses, win %, goals for and against, clean sheets, biggest win, longest runs) and every player of the save who has played a match, with his matches, goals, assists, MVP awards, win % and signing date; Select changes the sort. Chronicle route map: hold R2 (E) to move the map cursor twice as fast (x2, set in config.toml); the map's button guide shows «R2 Cursor speed». Original names by team: in Settings › Game settings, «Character names» gets «By team»; A on the row opens a picker with one tab per series (IE1 … Victory Road and mods' series) where you tick the teams or whole series whose players show their original names. Bank commands: choosing a player in the Team Dock's Bank opens a command list with Skill board, Equipment and Passive settings for that player, Quick retire (retires him and saves) and the game's equipment rows. Team planner: in a Team Dock squad, A on an empty slot offers «Add from the bank» or «Plan team»: any character of the game or the mods shows as a semi-transparent ghost card in that slot until you get him, then his card takes the slot by itself; a squad with ghosts cannot be the active one. No Hero / Diamond limits: a squad can field any number of Hero and Diamond cards (the game allows 2 Heroes and 1 Diamond). Top bar shortcuts: icons on the right of the menus' top bar go straight to the game's modes (Competition, Battle Bay with a dropdown of Campaign, 1v1 and Online, Chronicle, My Team, Market); mouse or R3 (on the Chronicle route map the bar shows only in its pause menu); other mods add their own icons. Auto Commander Mode: an option row starts Battle Bay matches in Commander Mode, and free matches and Heroic battles against beaten rivals. Technique preview: on the special move card of the «Supertécnicas» list, RS (P on the keyboard; rebindable in the game's controls screen) plays the move's cut-in full screen with a player of your active squad at the move's position (shoot: a forward, dribble: a midfielder, block: a defender, catch: the keeper; one who learns it first), then the list is back as it was. No auto-run in focus battles: LB / RB no longer run your player to a side by themselves (the game's focus auto-run is switched off). Longer team names: the Team Dock's name takes up to 24 characters (the game: 12; set in config.toml), a long name drawn a little smaller to fit the header. Player album: a «Player album» row in the Clubroom lists every player of the game and the mods by name or by game (Y the type, LB / RB the group, L2 / R2 the player page), ticks the ones your club has and shows the selected player's page on the right. In the walk-in and entrance scenes, «(X) Kick-off» beside «Skip»: hold X to go straight to the kick-off."

