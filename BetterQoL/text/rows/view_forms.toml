# Utilities' «Cambiar forma» texts (docs/game/mechanics/form-viewer.md §8): rows of menu_text in 9 languages, read
# with CMND_TEXT_GET by id = crc32(row id) by assets\lua\_all\utilities_view_forms.lua and the graft util_view_forms,
# and by the game's «Configuración de controles» (the action's row, content\inputs\view_forms.toml). The form names
# follow the form ids of the VR-Framework's form viewer (0 Normal, 1 Miximax, 2 Armour, 3 the miximax's own armour +
# Miximax, 4 the aura slot's armour + Miximax); their translations are Inazuma Fantasy's (text\rows\player_forms.toml).

schema = "VRFW.text/2"
table = "menu_text"

# the action's glyph: the button bound now (the engine draws it for the device in use)
# crc32("utilities_view_forms") = 508024922
[[row]]
id = "utilities_view_forms"
es = "<CMD_UTIL_VIEW_FORMS>"
en = "<CMD_UTIL_VIEW_FORMS>"
fr = "<CMD_UTIL_VIEW_FORMS>"
de = "<CMD_UTIL_VIEW_FORMS>"
it = "<CMD_UTIL_VIEW_FORMS>"
pt = "<CMD_UTIL_VIEW_FORMS>"
ja = "<CMD_UTIL_VIEW_FORMS>"
zh_hans = "<CMD_UTIL_VIEW_FORMS>"
zh_hant = "<CMD_UTIL_VIEW_FORMS>"

# the button guide's label (after the glyph)
# crc32("utilities_view_forms_prompt") = 3087075317
[[row]]
id = "utilities_view_forms_prompt"
es = "Cambiar forma"
en = "Change form"
fr = "Changer de forme"
de = "Form wechseln"
it = "Cambia forma"
pt = "Mudar forma"
ja = "フォーム切り替え"
zh_hans = "切换形态"
zh_hant = "切換形態"

