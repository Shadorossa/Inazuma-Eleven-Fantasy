schema = "VRFW.technique/3"
# Hissatsu Reforged › the technique families (docs/game/mods/technique-families-v2-proposal.md, approved 2026-10-28):
# declared once here ([[VRFW.TechniqueFamily]], ids HissatsuReforged.<Name>) and given to the retail moves with
# `families` on an [[edit]] (an edit with only `families` changes no table cell). Each family is one concept: a line
# and its relatives, a team's power set, a summoned being or a shared motif. Variants (Ensueño, numbered versions)
# and the _or / _mm / _cro copies carry their base move's families. A move in two families counts once for any one
# bonus source (the highest matching bonus applies). Mods that add moves give them `families` on their own
# [[technique]] rows; a later mod may change a move's list with [[edit]].
# Each family's `name` is its full id (HissatsuReforged.<Name>): the declaring mod's internal id is hissatsu_reforged,
# so a bare <Name> would become hissatsu_reforged.<Name> and match none of the moves' HissatsuReforged.<Name>.

