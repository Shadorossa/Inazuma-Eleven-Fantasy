schema = "VRFW.technique/3"
# Hissatsu Reforged › the technique families (docs/game/mods/technique-families.md, owner list 2026-10-31): declared
# once here ([[VRFW.TechniqueFamily]], ids HissatsuReforged.<Name>) and given to the retail moves with `families` on an
# [[edit]] (an edit with only `families` changes no table cell). A family holds exactly the moves of its list: every
# retail id that carries one of the listed names (its _or / _mm / _cro copies included). Dreamscape («Ensueño») moves
# are never members. Mods that add moves give them `families` on their own [[technique]] rows; a later mod may change a
# move's list with [[edit]].
# Each family's `name` is its full id (HissatsuReforged.<Name>): the declaring mod's internal id is hissatsu_reforged,
# so a bare <Name> would become hissatsu_reforged.<Name> and match none of the moves' HissatsuReforged.<Name>.

