    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xDCBC408A, 0x5A709C12, 0x6527353D, 5] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x45B51130, 0x5A709C12, 0x6527353D, 6] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x32B221A6, 0x5A709C12, 0x6527353D, 7] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xFEBEDF7E, 0x5A709C12, 0x65AE788E, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x89B9EFE8, 0x5A709C12, 0x65AE788E, 1] },
