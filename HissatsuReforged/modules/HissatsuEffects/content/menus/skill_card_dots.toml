object = "team02_02_skill_detail_info"
to = "evt_skc_card"
menus = ["ability_list_menu"]

[[patch]]
menu = "ability_list_menu"
add_layer = { name = "evt_skc_dots", object = "evt_skc_dots", count = 8, align = [0, 0], scale = 1, after = "team00_40_change_page_guide", groups = [{ group = "common", flags = [0, 1, 0, 0, 1, 0], after = "team00_40_change_page_guide" }] }
res = ["#/menu/00_soccer/soccer11/soccer11_05/<LG>/soccer11_05.g4tx"]

# the family page's move plates: the retail Plantilla move row (soccer11_09_formation_chara_skill: element plate,
# category icon, name), without its index attach rows and touch zone; attached to the card by the Lua (traces
# evt_skc_plate0..5). Atlases: the row's own (soccer11_09: the element plates) and icon_common (the category icons).
[[object]]
name = "evt_skc_plate"
from = "soccer11_09_formation_chara_skill"
remove_block = ["CMenuAttachLocator", "MenuCollisionSetting"]

[[patch]]
menu = "ability_list_menu"
add_layer = { name = "evt_skc_plate", object = "evt_skc_plate", count = 13, align = [0, 0], scale = 1, after = "evt_skc_dots", groups = [{ group = "common", flags = [0, 1, 0, 0, 1, 0], after = "evt_skc_dots" }] }
res = ["#/menu/00_soccer/soccer11/soccer11_09/<LG>/soccer11_09.g4tx", "#/menu/200_icon/15_icon_common/icon_common.g4tx", "#/menu/102_team/team02/evt_skc_badges/evt_skc_badges.g4tx"]

# the page prompt «Y <next page>» (Hissatsu Effects 1.18.0, the retail keshin cards' paging): ONE copy of the retail
# change-page plate (button glyph _text_btn01 + text _text_guide01 on an auto-sized plate), at the place the game puts that
# guide; the Lua (VRFW_Pager, style ycycle) fills and shows it. Layer evt_skc_ypage.
[[object]]
name = "evt_skc_ypage"
from = "team00_40_change_page_guide"

[[patch]]
menu = "ability_list_menu"
add_layer = { name = "evt_skc_ypage", object = "evt_skc_ypage", count = 1, align = [0, 0], scale = 1, after = "evt_skc_dots", groups = [{ group = "common", flags = [0, 1, 0, 0, 1, 0], after = "evt_skc_dots" }] }
