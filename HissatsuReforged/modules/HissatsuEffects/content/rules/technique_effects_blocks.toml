schema = "VRFW.behaviour/1"
# Hissatsu Effects › technique effects of the blocks: each rule acts only on the move being used (its
# `technique` list: the move, its same-name versions and its _or / _mm / _cro variants), for any player, the CPU
# included. `text` = the sentence the move card shows (text\en.toml, text\es.toml). Family rules: one rule per
# teammate count (`team_family`), the multipliers multiply. Values are starting values: tune them here or in
# ModManager. docs/game/mods/technique-passives-proposal.md.

# Corro de la patata (whd00170)
[[rule]]
id = "te_whd00170"
on = "move_power"
text = "HissatsuEffects.te_whd00170"
when = { technique = ["whd00170", "whd00170_or"], near = { who = "teammates", radius_m = 15.0, count = { min = 2 } } }
do = { power_mult = 1.15 }

# Sentencia final (whd00940)
[[rule]]
id = "te_whd00940"
on = "move_power"
text = "HissatsuEffects.te_whd00940"
when = { technique = ["whd00940"], half = 2, half_fraction_from = "2/3" }
do = { power_mult = 1.18 }

