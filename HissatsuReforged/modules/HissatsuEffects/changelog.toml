[[release]]
icon = "general"
notes = [
    "Efectos de juego en supertécnicas del juego.",
    "Tiros más fuertes de lejos y tiros divididos en balones.",
    "Porteros que bloquean el tiro parado o roban tensión.",
    "Tornado doble toma los elementos de sus dos ejecutores.",
    "Q / E en la tarjeta de técnica explican su efecto.",
]

[release.en]
notes = [
    "Gameplay effects on the game's special moves.",
    "Shots stronger from afar and shots split into balls.",
    "Keepers that lock the stopped shot or steal tension.",
    "Double Tornado takes the elements of its two users.",
    "Q / E on the move card explain its effect.",
]

[release.fr]
notes = [
    "Effets de jeu sur les techniques spéciales du jeu.",
    "Tirs plus forts de loin et tirs divisés en ballons.",
    "Gardiens qui bloquent le tir arrêté ou volent tension.",
    "Une technique à deux éléments, ceux de ses exécutants.",
    "Q / E sur la carte de technique expliquent son effet.",
]

[release.de]
notes = [
    "Spieleffekte für die Spezialtechniken des Spiels.",
    "Stärkere Fernschüsse und Schüsse, die sich teilen.",
    "Torhüter sperren den gehaltenen Schuss oder Spannung.",
    "Eine Technik mit den Elementen ihrer zwei Spieler.",
    "Q / E auf der Technikkarte erklären ihren Effekt.",
]

[release.it]
notes = [
    "Effetti di gioco sulle tecniche speciali del gioco.",
