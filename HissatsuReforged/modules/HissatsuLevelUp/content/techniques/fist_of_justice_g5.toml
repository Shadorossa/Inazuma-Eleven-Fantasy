# G5 events (content\anims\fist_of_justice_g5.toml). Nobody learns it: the grade rule
# (content\hissatsu_level_up\grade_animations.toml) plays its cut-ins for whk00440 from G5; the move itself keeps its name,
# power, element, cost and recast.

[[technique]]
name = "fist_of_justice_g5"
base = "whk00440"
event = "HissatsuLevelUp.fist_of_justice_g5"
fail_event = "HissatsuLevelUp.fist_of_justice_g5_fail"
name_text = "base"   # the base move's name and description (the copy shows as Superpuño invencible)
desc_text = "base"
