# TURBO's sparks, back auras and light column in lime, cut by cut (Superpuño cut -> the TURBO clip of the same place)
# (the copies' cuts are renamed c0010, c0020… by position: c0010-c0060 = the base's c0100, c0200, c0300, c0400,
# c0501 / c0502, c0601)
[[event_effect]]
event = "ev63_80440"
object = "ev63005541"
actor = "ev63005541"
cuts = ["c0010", "c0020", "c0030", "c0040", "c0050", "c0060"]
clips = { c0010 = "c0100", c0020 = "c0200", c0030 = "c0300", c0040 = "c0400", c0050 = "c0500", c0060 = "c0601" }
attach = { point = "point_eff", locator = "evp_eff01" }

