# Hissatsu Level Up's move-rank items used from the skill views (docs/game/mechanics/move-rank-items.md; owner 2026-10-14:
# «el libro y el cuaderno, usables en ambas vistas, de HissatsuLevelUp»). The Libro de mejora de supertécnica (+1 level, up
# to the second-to-last) or the Cuaderno de evolución definitiva (second-to-last -> last level), whichever applies to
# the move's grade; ids, caps and rules are Hissatsu Level Up's script (CMND_HISSATSULEVELUP_RANK_ITEMS / _RANK_ITEM), texts
# its text\rows\rank_items.toml. HOOK files only (graft [[hooks]], shipped as is; GENERATED by gen_hooks.py from the
# *.src.lua sources + rank_items_core.src.lua):
#   * evt_skill_slot_menu (Character Reforged's «Fantasy» skill table): the function HissatsuLevelUp.SkillTableRankItem of
#     the row action this mod declares on that screen's host (content\menus\skill_table_rank_items.toml, host
#     character_reforged.skill_table.row_action, Character Reforged's graft skill_table_host): CMD_FUNC1 (Start) on a
#     move row, Sí / No window, the rows redrawn;
#   * ability_learning_board_menu (Victory Road's own board): Start (CMD_FUNC1) on a move piece (the retail quick bean
#     equip, the screen's OpenBeansSetMenu, is withheld there; elsewhere it stays), two presses through the board's
#     telop (the native board keeps its input: no window over it), the guide entry «<Start> Subir nivel» over the
#     retail Start entry through VRFW_FooterPrompts (Replaces, Attach). Owner 2026-10-14: Start in both views, as in
#     Inazuma Fantasy (until Hissatsu Level Up 1.0.5 the board used a rebindable LT / U action).
# Until 2026-10-14 this was a text block built into the skill table script by Character Reforged (mod =
# character_reforged, rebuilt by Inazuma Fantasy), which put Hissatsu Level Up's code in the screen's mod; now the screen
# only offers the place and Hissatsu Level Up owns the use. Without Hissatsu Level Up nothing is declared or loaded.
name = "move_rank_items"
mod = "HissatsuLevelUp"
order = 220
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Hissatsu Level Up: the move-rank items used from the Fantasy skill table and from Victory Road's board"

[[hooks]]
stem = "evt_skill_slot_menu"
src = "rank_items_skill_table.lua"
require = ["EVT_OpenOriginalBoard", "EVT_PickCoroutine"]

[[hooks]]
stem = "ability_learning_board_menu"
src = "rank_items_board.lua"
