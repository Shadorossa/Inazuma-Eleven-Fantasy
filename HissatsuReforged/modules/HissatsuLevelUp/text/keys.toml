schema = "VRFW.text_key/1"
# Texts of «Hissatsu Level Up» (mod HissatsuLevelUp, 2026-10-14) (format: docs/framework/types/text.md): the «Mods» screen's
# name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Hissatsu Level Up"
mod_description = "Special moves level up the classic way: each player's move grows with the times he uses it in matches, and a banner says when it levels up. The last level needs the Ultimate Evolution Manual (Inazuma Eleven GO Galaxy's notebook, in the general shop); a game item becomes the Technique Upgrade (+1 level). A player can no longer carry the same special move twice, whatever board you use. From G5 on, some moves play the cut-in of their evolution."

[es.new]
mod_name = "Hissatsu Level Up"
mod_description = "Las supertécnicas suben de nivel como en los juegos clásicos: la técnica de cada jugador crece con las veces que la usa en los partidos, y un aviso lo dice cuando sube. El último nivel necesita el Cuaderno de evolución definitiva (el de Inazuma Eleven GO Galaxy, en la Tienda general); el objeto «Nuevas posibilidades» pasa a ser la Mejora de supertécnica (+1 nivel). Un jugador ya no puede llevar la misma supertécnica dos veces, uses el tablero que uses. Desde G5, algunas supertécnicas muestran la animación de su evolución."

[fr.new]
mod_name = "Hissatsu Level Up"
mod_description = "Les supertechniques montent de niveau comme dans les jeux classiques : la technique de chaque joueur progresse avec le nombre de fois qu'il l'utilise en match, et un message l'annonce. Le dernier niveau demande le Livre d'évolution ultime (celui d'Inazuma Eleven GO Galaxy, à la boutique générale) ; un objet du jeu devient l'Amélioration de technique (+1 niveau). Un joueur ne peut plus porter deux fois la même supertechnique, quel que soit le tableau utilisé. Dès G5, certaines supertechniques affichent l'animation de leur évolution."

[de.new]
mod_name = "Hissatsu Level Up"
mod_description = "Spezialtechniken steigen wie in den klassischen Spielen auf: Die Technik jedes Spielers wächst mit jeder Anwendung im Spiel, und eine Meldung zeigt den Aufstieg an. Die letzte Stufe braucht das Buch der ultimativen Evolution (aus Inazuma Eleven GO Galaxy, im allgemeinen Laden); ein Gegenstand des Spiels wird zur Technik-Verbesserung (+1 Stufe). Ein Spieler kann dieselbe Spezialtechnik nicht mehr zweimal tragen, egal mit welcher Tafel. Ab G5 zeigen manche Spezialtechniken die Animation ihrer Weiterentwicklung."

[it.new]
mod_name = "Hissatsu Level Up"
mod_description = "Le supertecniche salgono di livello come nei giochi classici: la tecnica di ogni giocatore cresce con le volte che la usa in partita, e un avviso lo segnala. L'ultimo livello richiede il Libro dell'evoluzione suprema (quello di Inazuma Eleven GO Galaxy, nel negozio generale); un oggetto del gioco diventa il Potenziamento tecnica (+1 livello). Un giocatore non può più avere due volte la stessa supertecnica, qualunque tabella usi. Dal G5 alcune supertecniche mostrano l'animazione della loro evoluzione."

[pt.new]
mod_name = "Hissatsu Level Up"
mod_description = "As supertécnicas sobem de nível como nos jogos clássicos: a técnica de cada jogador cresce com as vezes que a usa nas partidas, e um aviso mostra quando sobe. O último nível precisa do Livro da evolução suprema (o de Inazuma Eleven GO Galaxy, na loja geral); um objeto do jogo passa a ser a Melhoria de técnica (+1 nível). Um jogador já não pode levar a mesma supertécnica duas vezes, seja qual for o tabuleiro. A partir de G5, algumas supertécnicas mostram a animação da sua evolução."

[ja.new]
mod_name = "Hissatsu Level Up"
mod_description = "必殺技が昔のシリーズのように成長する：選手ごとの必殺技は試合で使った回数で進化し、進化するとお知らせが出る。最終段階には究極進化の書（イナズマイレブンGO ギャラクシーの書、よろず屋で販売）が必要。ゲームのアイテムの1つが必殺技強化（1段階進化）になる。どのボードを使っても、同じ必殺技を2つ装備できない。G5からは、一部の必殺技が進化版の演出で発動する。"

[zh_hans.new]
mod_name = "Hissatsu Level Up"
mod_description = "必杀技像经典系列一样成长：每名球员的必杀技随比赛中使用的次数进化，进化时会有提示。最终阶段需要究极进化之书（闪电十一人GO 银河的书，在杂货店出售）；游戏中的一个道具变为必杀技强化（进化一个阶段）。无论使用哪个面板，同一名球员都不能装备两个相同的必杀技。从G5起，部分必杀技会以进化版的演出发动。"

[zh_hant.new]
mod_name = "Hissatsu Level Up"
mod_description = "必殺技像經典系列一樣成長：每名球員的必殺技隨比賽中使用的次數進化，進化時會有提示。最終階段需要究極進化之書（閃電十一人GO 銀河的書，在雜貨店出售）；遊戲中的一個道具變為必殺技強化（進化一個階段）。無論使用哪個面板，同一名球員都不能裝備兩個相同的必殺技。從G5起，部分必殺技會以進化版的演出發動。"
