[de.new]
mod_name = "Hissatsu Reforged"
mod_description = "Gleicht die Spezialtechniken des Spiels neu aus: neue minimale und maximale Stärke, Spannungskosten und Abklingzeit für 683 Techniken. Die Stärke, die jede Stufe hinzufügt, bleibt die des Spiels. Eine Technik mit zwei Eigenschaften (Fernschuss und Konterschuss) zeigt beide Symbole in jeder Liste und auf ihrer Karte. Die Basis der Spezialtechnik-Mods: Hissatsu Effects und Hissatsu Level Up sind ihre Module. Spezialtechniken können einen kritischen Treffer landen, der ihre Stärke vervielfacht, und der Durchbruch-Stil wird zum Kritisch-Stil (höhere kritische Chance)."
