schema = "VRFW.text_key/1"
# Texts of «Hissatsu Reforged» (mod hissatsu_reforged, 2026-10-14) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rebalances the game's special moves: new minimum and maximum power, tension cost and recast time for 683 moves. The power each grade adds stays the game's. A move with two properties (long shot and counter shot) shows both icons in every move list and on its card. The base of the special-move mods: Hissatsu Effects and Hissatsu Level Up are its modules. Special moves can land a critical hit that multiplies their power, and the Breach team build becomes the Critical build (more critical chance)."
