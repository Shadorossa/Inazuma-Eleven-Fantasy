[es.new]
mod_name = "Hissatsu Reforged"
mod_description = "Reequilibra las supertécnicas del juego: nueva potencia mínima y máxima, coste de tensión y tiempo de recarga de 683 supertécnicas. La potencia que añade cada grado sigue siendo la del juego. Una supertécnica con dos propiedades (tiro largo y tiro de contraataque) muestra los dos iconos en todas las listas y en su ficha. Es la base de los mods de supertécnicas: Hissatsu Effects y Hissatsu Level Up son sus módulos. Las supertécnicas pueden lograr un golpe crítico que multiplica su potencia, y la configuración Brecha pasa a ser Crítico (más probabilidad de crítico)."
