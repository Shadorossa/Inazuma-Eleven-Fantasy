schema = "VRFW.text_key/1"
# Texts of «Hissatsu Reforged» (mod hissatsu_reforged, 2026-10-14) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rebalances the game's special moves: new minimum and maximum power, tension cost and recast time for 683 moves. The power each grade adds stays the game's. A move with two properties (long shot and counter shot) shows both icons in every move list and on its card. The base of the special-move mods: Hissatsu Effects and Hissatsu Level Up are its modules."

[es.new]
mod_name = "Hissatsu Reforged"
mod_description = "Reequilibra las supertécnicas del juego: nueva potencia mínima y máxima, coste de tensión y tiempo de recarga de 683 supertécnicas. La potencia que añade cada grado sigue siendo la del juego. Una supertécnica con dos propiedades (tiro largo y tiro de contraataque) muestra los dos iconos en todas las listas y en su ficha. Es la base de los mods de supertécnicas: Hissatsu Effects y Hissatsu Level Up son sus módulos."

[fr.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rééquilibre les supertechniques du jeu : nouvelle puissance minimale et maximale, coût de tension et temps de recharge pour 683 supertechniques. La puissance ajoutée par chaque rang reste celle du jeu. Une supertechnique à deux propriétés (tir de loin et contre-attaque) montre les deux icônes dans toutes les listes et sur sa fiche. C'est la base des mods de supertechniques : Hissatsu Effects et Hissatsu Level Up sont ses modules."

[de.new]
mod_name = "Hissatsu Reforged"
mod_description = "Gleicht die Spezialtechniken des Spiels neu aus: neue minimale und maximale Stärke, Spannungskosten und Abklingzeit für 683 Techniken. Die Stärke, die jede Stufe hinzufügt, bleibt die des Spiels. Eine Technik mit zwei Eigenschaften (Fernschuss und Konterschuss) zeigt beide Symbole in jeder Liste und auf ihrer Karte. Die Basis der Spezialtechnik-Mods: Hissatsu Effects und Hissatsu Level Up sind ihre Module."

[it.new]
mod_name = "Hissatsu Reforged"
mod_description = "Ribilancia le supertecniche del gioco: nuova potenza minima e massima, costo di tensione e tempo di ricarica per 683 supertecniche. La potenza aggiunta da ogni grado resta quella del gioco. Una supertecnica con due proprietà (tiro da lontano e contropiede) mostra entrambe le icone in ogni lista e sulla sua scheda. È la base delle mod di supertecniche: Hissatsu Effects e Hissatsu Level Up sono i suoi moduli."

[pt.new]
mod_name = "Hissatsu Reforged"
mod_description = "Reequilibra as supertécnicas do jogo: nova potência mínima e máxima, custo de tensão e tempo de recarga de 683 supertécnicas. A potência que cada grau adiciona continua a do jogo. Uma supertécnica com duas propriedades (chute de longe e contra-ataque) mostra os dois ícones em todas as listas e na sua ficha. É a base dos mods de supertécnicas: Hissatsu Effects e Hissatsu Level Up são os seus módulos."

[ja.new]
mod_name = "Hissatsu Reforged"
mod_description = "ゲームの必殺技683個のバランスを調整する：最小・最大威力、テンション消費、リキャスト時間。ランクごとに上がる威力はゲームのまま。2つの特性（ロングシュートとカウンターシュート）を持つ技は、すべてのリストと詳細で両方のアイコンを表示。必殺技系MODのベースで、Hissatsu EffectsとHissatsu Level Upはそのモジュール。"

[zh_hans.new]
mod_name = "Hissatsu Reforged"
mod_description = "重新平衡游戏中的683个必杀技：新的最小与最大威力、气势消耗和冷却时间。每个等级增加的威力保持游戏原样。拥有两种属性（远射与反击射门）的必杀技在所有列表和详情中显示两个图标。必杀技类模组的基础：Hissatsu Effects 与 Hissatsu Level Up 是它的模块。"

[zh_hant.new]
mod_name = "Hissatsu Reforged"
mod_description = "重新平衡遊戲中的683個必殺技：新的最小與最大威力、氣勢消耗和冷卻時間。每個等級增加的威力保持遊戲原樣。擁有兩種屬性（遠射與反擊射門）的必殺技在所有列表和詳情中顯示兩個圖示。必殺技類模組的基礎：Hissatsu Effects 與 Hissatsu Level Up 是它的模組。"
