mod_description = "重新平衡游戏中的683个必杀技：新的最小与最大威力、气势消耗和冷却时间。每个等级增加的威力保持游戏原样。拥有两种属性（远射与反击射门）的必杀技在所有列表和详情中显示两个图标。必杀技类模组的基础：Hissatsu Effects 与 Hissatsu Level Up 是它的模块。必杀技可能打出暴击、威力倍增；必杀流派改为暴击流派（暴击率提升）。"
