schema = "VRFW.text_key/1"
# BetterMenu's texts (key better_menu.<name>): the line the «Modo Historia» balloon adds on the main menu (X = the Avatar
# menu, docs/game/mods/better-menu.md §14); the mode header's caption over the banner (§29: the scene's name); the
# team drawer's close hint (§24).
default_lang = "es"

[es.new]
team_close = "<CMD_BACK> Cerrar"
scene_caption = "CASETA DEL CLUB"
avatar_prompt = "X: Avatar"
avatar_hotspot = "Avatar"

