schema = "VRFW.menu_scene/1"

# The Odaiba clubhouse of South Cirrus (both floors) under the main menu (docs/game/mods/better-menu.md §7-§14), on
# BetterMenu's own map w50i901: a copy of the retail w50i001 with only what the shots see, the window panes white, the
# exit door that opens, block ranges and build radius that cover the pitch and no NPC of its own (§47, §60). After
# changing a shot: python research/scripts/better_menu_club_visibility.py, then better_menu_club_map_build.py.
# The walker arrives at the map's right door (the right side wing, never in a shot); the camera moves between the shots
# below as the mode row's focus moves (Sparking Zero / Persona 5 style). The save's avatar sits on the right-side sofa;
# 16 players, 3 managers and the coach stand or sit in the living room and on the gallery. After changing a
# spot: python
# research/scripts/menu_scene_people_build.py --mod research/mods/BetterMenu --scene clubhouse --npc-base-map w50i001
# (writes clubhouse_people.toml; the own map has no NPC file of its own in the game data).
[[VRFW.MenuScene]]
name = "clubhouse"
menu = "title_menu_2"
map = "w50i901"
field_mode = "clubhouse"
entry_point = "0x683C6995"               # the map's right door arrival (layout point at (9.05, 0, -3.25), facing 180): the
                                          # right-side sofa is the avatar's spot
entry_x = 9.05
entry_y = 0.0
entry_z = -3.25
entry_rot = 180.0
# the main menu's full-screen background and the notice list over «Información» (white plates on the map); the mode
# row with its name label and balloon, and the banners over it (Mi equipo, AVATAR, VICTORIAS): the shots are the mode
# selection (shots_select_modes below)
hide_layers = ["title02_00_title_bg_2", "info01_03_banner_list_item", "title00_07_item_button_upper",
    "title02_03_item_name_2", "title02_09_flavor_balloon_upper", "title02_10_my_team_banner", "title02_11_avatar_banner",
    "title02_07_victory_counter", "title02_12_victory_counter_detail"]
# the field HUD and its pop-ups: gauges, button guide, minimap, the day / time telop («MIÉ»)
close_menus = ["rpg_info_window", "talk_icon", "notification_log", "activity_telop_menu"]
map_tags_on = ["SC", "BMHOME"]            # the projection screen w50ai025 unrolled (its fabric model_w50ai025_ar01_SC_; §25)
                                          # and the post the home shot hides (BMHOME, §48)
title_play_mode = 6                       # what the game's own title start writes
settle_frames = 1                         # hand over after the real NPC load completes
timeout_seconds = 10
npc_spawn_radius = 10000.0                # the game makes NPCs only within 65 m of the player's position, and a menu
                                          # scene has no walker (the position is the last player's, another map's):
                                          # wider than the map, so every person shows (the pitch is ~155 m away)
guests = "actors"                         # the Competition players as scene characters, not NPCs
people_as = "actors"                      # the team as scene characters too (all shown together, a team edit swaps only who changed)
actor_type = 2                            # the actors created as NPCs (create type 2); 1 = scene characters (face test, VRFW 2.5.2)
people = "active_team"                    # 16 players, 3 managers and 1 coach; none = no NPCs; map = the map's own NPC file
people_kit = "team"                       # team = the active team's kit, default = each character's default look
actor_face = "default"                    # each actor's default face set again when its pose plays and when it is shown
actor_hold_face = true                    # and kept: the idle clips' face channel off (no open mouths while they loop)
people_seconds = 8                        # keep the cover until the full lineup's NPCs finish loading
people_min_seconds = 0.0                  # no fixed presentation delay after map arrival
people_quiet_seconds = 0.0                # NPCUpdate's load completion gates the hand-over
camera = "RpgCamera"                      # the field camera: the shots below drive it
default_shot = "team_overview"
home_shot = "team_overview"                # start wide enough to keep the gallery pair in view too
shot_seconds = 0.5                        # the move from shot to shot when no range applies
shot_ease = "smoother"                    # ease in and out, softer start and stop
shot_turn = "slerp"                       # the view turns along the shortest arc; the eye moves in a straight line
shot_seconds_min = 0.6                    # a small change of view ...
shot_seconds_max = 1.1                    # ... to a quarter turn or 8 m of travel or more (shot_seconds_metres): slower,
                                          # softer moves between the modes (owner 2026-10-19)
drift_metres = 0.04                       # a slow idle sway of the eye (0 = still)
drift_seconds = 18
cut_metres = 40                           # a move to or from the pitch (about 150 m out of the lodge) is a cut, never a flight through the walls
# The shots are the mode selection: the mode row is not drawn; L2 / R2 (and left / right on the scene) go to the
# previous / next mode and its shot, down / up go between the scene and the lower row, A / X act on the mode on screen.
# The cycle starts on the home entry (home_shot): the full clubhouse with no mode, where A and X do nothing and Y opens
# the team drawer; next from it = the first mode, previous = the last one.
# The mode's name (the game's own tile text) at the bottom left, over the lower row (content\menus\title_scene.toml adds
# its layer).
shots_select_modes = true
mode_label = false                        # BetterMenu draws its own mode header (assets\lua\title_menu_2\220_mode_header.lua)
mode_label_x = 250                        # inside the screen also on a 4:3 window (the label has no screen anchor)
mode_label_y = 846                        # over the lower row's own labels (centre y 914)
mode_label_scale = 0.8
when = { config = "experiment.map_under_menu", default = true }

# Shots (L2 / R2 on the main menu cycle them by `order`): the mode row's tiles (the title's item ids) that call them. A tile without a shot of its own gets the default;
# the lower row (Guía, Opciones, Información, Guardar, Mods) and the banners keep the shot on screen. Inside the lodge
# only: living room x -7..7, z -7..5 (glass front at z 5, fireplace right, cabinet left), left wing x -11.7..-7, kitchen /
# dining room z -22..-14, gallery y 4 (back walkway z -14.5..-10).
[[VRFW.MenuSceneShot]]                    # from the glass front over the living room, the team on the sofa
scene = "clubhouse"
name = "living_room"
order = 1                                 # L2 / R2 cycle the shots in this order
eye_x = 0.0
eye_y = 1.6
eye_z = 4.4
target_x = 0.0
target_y = 1.8
target_z = -7.0
fov = 50

[[VRFW.MenuSceneShot]]                    # Modo Historia: the door to Odaiba and the avatar on the bench
