[[VRFW.MenuSceneShot]]                    # Battle Bay: square on to the pull-down screen (w50ai025, image rectangle
scene = "clubhouse"                       # __ev09_01300__screen01_01: x -1.18 .. 1.18, y 1.325 .. 2.525 at z 4.817), its
name = "table"                            # centre in the middle of the frame (owner 2026-10-19), the screen about half the
order = 5                                 # frame's width: it shows the Battle Bay top menu (the hotspots below)
eye_x = 0.0
