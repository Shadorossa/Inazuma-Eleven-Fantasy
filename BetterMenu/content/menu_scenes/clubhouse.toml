# The Battle Bay top menu on the pull-down screen (docs/game/mods/better-menu.md §57, [experiment] bb_live_menu): a copy
# of the game's bb_stadium_top_menu pieces (content\menus\title_bb_live.toml: its button locator, stadium art, logo,
# next-match badge and cross-play note; the buttons themselves follow the locator), fitted so the menu's 1920 x 1080
# design covers the screen's whole image rectangle (2.36 x 1.2 m, a little wider than 16:9; owner 2026-10-19).
[[VRFW.MenuSceneScreen]]
scene = "clubhouse"
shot = "table"
keep_shots = ["table_screen"]
name = "battle_bay_menu"
x = 0.0
y = 1.925
z = 4.81
width = 2.36
height = 1.2
rot = 180.0
layers = ["vs01_00_p2_background_bb_stadium", "mainmenu90_25_list_item_locator", "vs01_47_bb_stadium_header_logo"]
# (the next-match badge vs11_01_next_stage_guide and the cross-play note mainmenu90_35_cross_play_guide are not shown:
# owner 2026-10-19, the small bar over the stadium art)
fade_seconds = 0.3
# (no `when`: [[VRFW.MenuSceneScreen]] has no such key and the whole screen was left out; the layers are gated by
# experiment.bb_live_menu in content\menus\title_bb_live.toml)

# the copy's blue background (content\menus\title_bb_live.toml) on the same rectangle: its layout is 2640 px wide
# (x -360 .. 2280), so a screen of its own fits that width to the rectangle
[[VRFW.MenuSceneScreen]]
scene = "clubhouse"
shot = "table"
keep_shots = ["table_screen"]
name = "battle_bay_background"
x = 0.0
y = 1.925
z = 4.81
width = 2.36
height = 1.2
rot = 180.0
layers = ["better_menu_bb_live_background"]
# the area the layer really draws (measured on the owner's screenshot of 0.6.80, design -360, 0, 2640, 1080: the blue
# covered x 162 .. 2474 and y 113 .. 964 of that design), so it now covers the whole image rectangle
design_x = -198.0
design_y = 113.0
design_width = 2312.0
design_height = 851.0
fade_seconds = 0.3

