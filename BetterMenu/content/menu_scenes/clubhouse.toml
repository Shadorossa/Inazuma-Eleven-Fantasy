# The story shot's buttons in the wing (left / right between them, A): the umbrella stand «Historia+», the door
# «Continuar» (or «Partida nueva» without a story save), the doormat «Historia extendida». Each text is the game's own
# entry of the story submenu, drawn where the camera sees the object (position and size follow the shot); the
# selected one shows its white silhouette (outline_tag: the own map's outline models, docs/game/mods/better-menu.md §101). Rectangles
# from the map's own models (w50i001.g4sk placements, model bounding boxes; docs/game/mods/better-menu.md §19-§20).
# With [experiment] bb_live_menu: the same choice over the projected copy of the menu, plus its Opciones and Guardar
# (Ayuda is hidden): hotspots that the framework does not draw (draw = false); assets\lua\title_menu_2\250_bb_live_menu.lua
# shows the selected one on the projected button. Order = the menu's own list order.
[[VRFW.MenuSceneHotspot]]
scene = "clubhouse"
shot = "table"
name = "bb_live_campaign"
order = 1
start = true
x = 0.0
y = 1.93
z = 4.8
width = 2.0
height = 1.0
surface = "wall"
rot = 180.0
actions = ["open_group", "menu_pick"]   # a campaign save: the continue / new choice on the screen first;
open_group = "bb_campaign"                # none: straight into a new campaign (the game's own press)
open_group_if = "bb_campaign_save"
text = "943773677"                       # «Campaña»
draw = false
push_shot = "table_screen"
seconds = 1.1                             # the push-in (0.7 s), then the projected menu fades to the screen's white
leave_fade = "white"
pick_layer = "716364754"
return = "title"                          # Back from the menu it opens comes to this shot of the title
pick_index = 0
when = { config = "experiment.bb_live_menu", default = true }

