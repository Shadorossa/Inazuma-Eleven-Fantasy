order = 3                                 # the eye 0.65 m over the grass, 3.33 m from the group, heading 88, looking up at
eye_x = -105.482                          # the three in a wide V with the sky behind; the players' places follow their
eye_y = -7.45                             # bodies (content\competition_court\court.toml)
eye_z = 96.199
