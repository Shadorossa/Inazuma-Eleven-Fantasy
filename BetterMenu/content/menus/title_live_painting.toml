schema = "VRFW.menu/2"

# The live painting of the main menu over the clubhouse (docs/game/mods/better-menu.md §37): one quad over the big
# painting of the Crónica shot that plays the Chronicle top menu's loop (speed tunnel, hexagons, the hovering caravan)
# as a flipbook. The framework places, scales and fades it ([[VRFW.MenuSceneScreen]] chronicle_painting,
# content\menu_scenes\clubhouse.toml); assets\lua\title_menu_2\240_live_painting.lua swaps its frames. Layer (not opened
# with the group: the framework opens it on the screen's first show):
#   better_menu_live_painting  1 x a copy of the 36 px quad cmn01_10 (layout better_menu_live_painting.g4pkm, reading
#                              the atlas of its own folder: content\images\menu\20_cmn\better_menu_live_painting.toml,
#                              GENERATED by research/scripts/better_menu_live_painting_build.py); draw priority 160,
#                              over the 3D room and under the hotspot texts and outline (vrfw_ms_label / vrfw_ms_frame)
when = { config = "experiment.map_under_menu", default = true }

[[layout]]
file = "common/menu/20_cmn/cmn01/better_menu_live_painting/better_menu_live_painting.g4pkm"
from = "common/menu/20_cmn/cmn01/cmn01_10/cmn01_10.g4pkm"

[[object]]
name = "better_menu_live_painting"
from = "cmn01_10_new_icon"
set = [
    { param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 160 } },
    { param = "SkeletonAnime", match = { 1 = "common/menu/20_cmn/cmn01/cmn01_10/cmn01_10.g4pkm" }, values = { 1 = "common/menu/20_cmn/cmn01/better_menu_live_painting/better_menu_live_painting.g4pkm" } },
]

[[patch]]
menu = "title_menu_2"
add_layer = { name = "better_menu_live_painting", object = "better_menu_live_painting", count = 1, after = "title02_04_version", groups = [{ group = "title_menu_2", flags = [0, 0, 0, 0, 1, 0], after = "title02_04_version" }] }
