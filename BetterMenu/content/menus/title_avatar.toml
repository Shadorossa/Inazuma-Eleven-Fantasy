schema = "VRFW.menu/2"

# The avatar on BetterMenu's main menu (docs/game/mods/better-menu.md §14): no AVATAR banner (its layout off screen at
# its root joint: not seen, not clickable; assets\lua\title_menu_2\210_avatar.lua sends up / down to «Mi equipo»
# instead), and X on the mode row = the Avatar menu while «Modo Historia» is focused (the same Lua). The avatar itself
# stands in the clubhouse's left wing (content\menu_scenes\clubhouse.toml, the «story» shot).

# the AVATAR banner (title02_11_avatar_banner, top left)
[[layout]]
file = "common/menu/50_title/title02/title02_11/title02_11.g4pkm"
joint = "title02_11_output"
translate = [-5000.0, 0.0]

# The Avatar menu on «Modo Historia»: X on a pad is the title's CMD_FUNC1 = «Inazuma Post» (0x5A8A6C8D); the Lua takes
# it over while «Modo Historia» is focused. CMD_FUNC4 (0x55960DD8, free since the top cleanup took the notices off) ->
# CMD_FUNCTION crc32("better_menu_avatar") does the same.
# L2 / R2 (CMD_FUNCL2 / CMD_FUNCR2, unused by the title) on both rows -> the menu scene's previous / next shot
# (CMD_FUNCTION crc32("vrfw_menu_scene_shot_prev") / ("vrfw_menu_scene_shot_next"), the framework's title handler).
[[patch]]
menu = "title_menu_2"
add_cmd = [
    { layer = "title00_07_item_button_upper", input = 0x55960DD8, command = "CMD_FUNCTION", arg = 0xB7B6E1A0 },
    { layer = "title00_07_item_button_upper", input = "CMD_FUNCL2", command = "CMD_FUNCTION", arg = 0x807AF060 },
    { layer = "title00_07_item_button_upper", input = "CMD_FUNCR2", command = "CMD_FUNCTION", arg = 0x38B76809 },
    { layer = "title00_07_item_button_lower", input = "CMD_FUNCL2", command = "CMD_FUNCTION", arg = 0x807AF060 },
    { layer = "title00_07_item_button_lower", input = "CMD_FUNCR2", command = "CMD_FUNCTION", arg = 0x38B76809 },
]
