id = "clean_hud"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
# «BetterUI» since 1.17.1 (2026-10-11; «Clear View» 1.16.0-1.17.0, «Clean HUD» / «Interfaz limpia» before; repo / install
# folder ClearView until 1.17.1, Lua prefix ClearView kept as an alias of BetterUI); the id stays clean_hud (saved values, requires)
name = "BetterUI"
version = "1.21.28"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Cleaner match HUD and original game menus: a compact menu top bar (67 px instead of 122, with each menu's content and the Team Dock moved up), shop shortcuts (L2 / R2 or Q / E go to the previous / next shop of the Market; formerly the «Shop shortcuts» mod); rival markers removed, bond plate («MAX %») slanted like the gauge bars, smaller upgrade row centred at the bottom, sprint, cursor-speed and «Focus field» guides removed, passive icons 5 % smaller, «Go up!» under «Pass», «RB + lightning» on a smaller rectangular plate a little to the left, tactics ring and menu (LB) on the left, coach mode guide at the top centre, minimap higher, smaller focus / zone / duel banners, a less tall keeper-vs-shot duel gauge (the bar at half its height), with a timeline under the zone / focus / clash banner that shrinks as time runs out, a translucent dark-glass menu top bar (Windows 11 style: the background shows through, thin line at the bottom) with the original slanted section plate, Esc guide without a pill, «Team bonus» like the other guides, no «Nickname» pill or sort guide in the Bank, corner buttons styled like the list, and no «Controls guide» / «Tutorial» corner buttons in Competition and Chronicle; Chronicle's top menu with its Team, Items, Shop and Options rows as 4 square icon boxes under the gacha banner; in the Team Dock (the special tactics as in the original game), a smaller «Team settings» next to «Formation», the kit between the team name and the player plate, a blue «Lv. 99» after the player plate, the formation / team settings block at the bottom left beside the squad number, smaller squad-number arrows and «Team AT / DF» at half size under the goalkeeper. The framework's «Mods» screen sits higher for the lower top bar. And no team editor between the VS screen and kick-off (offline matches); after the walk-in, «Edit» / «Data» on the two lineup screens (your team in the match editor, the rival read-only). Compact player cards on the formation screens (pitch, bench, coach / managers), on the rival squad screens (Chronicle VS preview, rival team info, Battle Bay team select: both sides alike) and in the player bank: narrower card with the face centred, the element icon at the left and the position at the right, without name or level; the bank grid with 8 columns instead of 6. Shirt numbers and AI roles set for the whole team from the Team Dock «Commands» window («Shirt number settings» / «AI settings»: the goal celebration list with each player's number / AI role), no longer from each player's menu. The player menu of the formation screen («PERSONAJE»; no «Move», no per-player AI role and no Diamond «Change build») as one column instead of a two-column grid, always in the same order: Skill board, Equipment, Passives, Captain, then any other row. In the walk-in and entrance scenes, «(X) Kick-off» beside «Skip»: hold X to jump straight to the kick-off (no fade, no black screen). On the player plate, the Q / E key glyphs (the pad's buttons on a pad) on both ends of the page dots. The Team Dock list without the «Team settings» and «Formation» rows. No rules, data or saves changed."
priority = 0
tags = ["Gráficos"]
