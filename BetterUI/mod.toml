# (CMD_CLEAN_HUD_XSKIP_HOLD), text clean_hud.prematch_skip, config.toml prematch_skip_hold (clean_hud.dll answers
# CMND_EVT_CHD_XSKIP_HOLD); docs/game/ui/prematch-skip.md
# (1.26.0, owner 2026-10-21: the pre-match X skip above moved to Utilities 1.17.0: graft util_prematch_skip, its
# content, script, config key and text are Utilities' now.)
# 1.15.3 (Nacho): the keeper-vs-shot duel gauge (keeper_hp_gauge_menu, soccer08_47.g4pkm) less tall: content\menus\keeper_gauge.toml
# ([[layout]] joint edits: the bar quads at 70 % height about their centre line, the element icon groups, power locators
# and centre pop text 7.56 px down with the bar's top edge, the portraits 7.56 px up with its bottom edge; widths and
# icon / text sizes unchanged; VR-Framework's extra dual-element icons hang on the same _atc_type0N_0x locators)
# 1.15.4 (Nacho: «menos alta aún»): the keeper gauge bar at 50 % of its height (content\menus\keeper_gauge.toml recomputed: icons,
# power locators and pop text 12.6 px down, portraits 12.6 px up; the pop text keeps its size, centred on the top edge)
# 1.18.1 (Nacho): the top bar on the Chronicle board's menu (START: the retail kizuna_town_mainmenu, Plantilla de
# equipo / Objetos / Ayuda / Opciones / Guardar) only over the board (gate CLEAN_HUD_TopBarOnBoard in
# assets\lua\_all\clean_hud_top_bar.lua; Estación Kizuna keeps its menu without bar); the board's row and no red
# badge at the top-left corner need VR-Framework's 10_top_bar.lua of 2026-10-11 (the board's patch dropped its
# hooks: docs/framework/top-bar.md §15)
conflicts = []
# Parches Lua de 31 scripts (30 menús + title_main) + la pantalla «Mods» del framework (vrfw_mods_menu: VRFW_MM_LAYOUT.top_dy = -55)
# (assets\lua\, construidos con research/scripts/menu_assemble.py build --mod clean_hud) + assets\lua\_all\clean_hud_top_bar.lua + 37 ficheros
# de interfaz (assets\data; todos del mismo tamaño que los originales salvo team00_11_p1_tactics_focus.objbin y los dos atlas nuevos evt_hl_timeline / clean_hud_topbar.g4tx; 18 son
# mainmenu90_01/02.g4tx: barra superior de cristal translúcido (placas de sección originales), research/scripts/header_bar_clean_build.py). Solo usa CMND_EVT_LOG del puente Lua para su log.
loader_modules = ["lua_bridge"]
# No native plugin since 1.17.0 (crates/plugins/clean_hud deleted): the skipped pre-kick-off editor (docs/game/modes/
# prematch-lineups.md, Revisión 6; config.toml skip_prematch_editor) is content\game\prematch_editor.toml
# ([[VRFW.Hook]] kind = "mid") + scripts\prematch_editor.lua; the commands CMND_EVT_CHD_XSKIP_HOLD / _TACTIC_SLICES are
# content\game\commands.toml + scripts\better_ui.lua; the tactic row gradient and the slanted kizuna plate are image
# recipes (+ a menu [[layout]], config.toml slanted_kizuna).
# `prematch`: the ModLoader's old built-in module (removed in 1.8.0) this mod replaced; since 1.12.0 also the mod
# «Atajos de tienda» (shop_shortcuts 1.0.3, now part of BetterUI): an installed copy is skipped
provides = ["prematch", "shop_shortcuts=1.0.3"]
# ModLoader con plugins (API v1), parches Lua por mod (assets\lua\<script>\*.lua + assets\lua\_fingerprints.json) y assets\data
loader_min = "1.0.0"
# The mod's own names (docs/framework/native.md §5): BetterUI.<Name> (scripts\, and the game Lua table BetterUI of
# assets\lua\_all\better_ui.lua); commands keep their CMND_EVT_CHD_* names.
prefix = "BetterUI"
folder = "BetterUI"
# content\game\commands.toml: two game Lua commands answered by scripts\better_ui.lua (command);
# content\game\prematch_editor.toml: the mid hook (hook), IsNetworkSession (call), the match info struct (memory)
permissions = ["command", "hook", "call", "memory"]

# What other mods may use (they require clean_hud): the game Lua functions of the global table BetterUI (every menu
# VM; assets\lua\_all\better_ui.lua). The old globals stay as aliases: CLEAN_HUD_TopBarOn (the top bar hosts' gate:
# Utilities' since 1.21.0, BetterUI.TopBarOn answers through it when Utilities is on), CLEAN_HUD_SS_CO (read softly by Utilities' shop filter), CLEAN_HUD_PC_* (Inazuma
# Fantasy's position_cards), CLEAN_HUD_SHIRT_NUMBER (Inazuma Fantasy's team_cmd_dock). No TOML keys of its own.
[exports]
functions = ["TopBarOn", "ShopSwitching", "CardIsLayer", "CardIsCompact", "CardHideName", "CardKeepName", "CardHideLevel", "ShirtNumberOn", "ShirtNumberArm", "AddDockButton"]
keys = []
# game-Lua globals of assets\lua\ other mods' game Lua may use (the BetterUI table in the menu VMs)
game_lua = ["BetterUI"]

# UI only: left out of the mod set two players must share in a private online room, and of «gameplay mods enabled»
# (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §5)
[VRFW.Mod]
AffectsMatch = false
