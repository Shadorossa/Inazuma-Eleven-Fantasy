# BetterUI «PERSONAJE» player menu as one column (docs/game/ui/chara-menu-one-column.md).
# Team dock «Formación» (team_dock_formation_menu): the per-player command window (OpenSubWinSelectCharaSetting) is
# retail sub-window type 26, a two-column grid (win05_05_sub_list_locator_basic12_two_line, rows filled left to right).
# This graft opens it as sub-window type 0 (win05_13_sub_list_locator: one column, same win05_04_sub_list_item12 button
# objbin, so the same button width; the window height comes from the size code for the row count).
# 1.21.28 (owner 2026-10-14): the row order (Tabla de habilidades > Equipamiento > Configuración de pasivas >
# Establecer como capitán > the rest) is an Order rule of the VR-Framework's list rows; «Cambiar configuración»
# (type 8) is hidden. The old «down the grid's columns» re-sort of GetSelectSettingTypeOrderList is gone.
# 1.21.26 (owner 2026-10-14): «Mover» (type 0) and «Configurar rol de la IA» (type 7) are hidden, always: Hide rules of
# the VR-Framework's list rows (docs/framework/list-rows.md), applied by the framework's handler where the retail script
# builds the list (no wrapper of this graft filters it).
# Order 906: after the patches that replace / filter GetSelectSettingTypeOrderList (Inazuma Fantasy's merged file 100,
# IF team_cmd_dock 200); these wrappers chain by assignment at run time, outermost (the one-column window applies to the
# list the framework's rules produced).
name = "clean_hud_chara_menu"
order = 906
module = "lua_bridge"
mod = "clean_hud"
requires = []
conflicts = []
wraps = []   # OpenSubWinSelectCharaSetting and MENU_DEF.OpenSubWindow are wrapped by
             # assignment at run time
description = "BetterUI: the team dock's per-player menu (PERSONAJE) as a one-column list in the owner's row order"

[[files]]
stem = "team_dock_formation_menu"

  [[files.ops]]
  type = "append_block"
  src = "chara_menu.lua"
  marker = "clean_hud chara_menu"
  crc = "none"
