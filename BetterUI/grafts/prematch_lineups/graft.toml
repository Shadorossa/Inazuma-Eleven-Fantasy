# Pre-match lineups, a feature of Clean HUD («Interfaz limpia», research/mods/BetterUI; Inazuma Fantasy's graft until
# 2026-10-08; docs/game/ui/prematch-lineups.md, docs/game/modes/prematch-lineups.md section 11-12): the two lineup
# screens after the walk-in (soccer_battle_setting_flow_formation_menu) get «Editar» (own) / «Datos» (rival) as a second
# big button (Siguiente mirrored, bottom left); they open soccer_formation_menu (retail CMND_OPEN_FORMATION_MENU) in edit
# mode or read-only on the rival, then the screen is shown again. Always on (no option row
# since Clean HUD 1.14.6; offline matches only). Data of the left button: Clean HUD's
# menus\soccer_battle_setting_flow_vs_menu.toml (layer, CMD_FUNC3 rows), files\data (layout / objbin,
# research/scripts/prematch_buttons_build.py) and text.toml (clean_hud.prematch_edit / prematch_data). The auto-advance
# (rev 3) and the rival view after the pre-match editor's close (rev 2) stay in the code, off. soccer_formation_menu is
# patched with wrappers only (append_block): Inazuma Fantasy's Pachanga formation screen wraps the same input callbacks,
# and a redefined retail function in a later mod would drop its wrappers. The editor right after the VS is skipped by
# Clean HUD's plugin (clean_hud.dll), not here. Not migrated (decision 2026-09-26, probes dropped): the probe-only files
# soccer_battle_setting_flow_vs_menu, chronicle_mode_soccer_vs_menu, soccer_member_change_menu.
name = "prematch_lineups"
mod = "BetterUI"
order = 100
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Clean HUD, pre-match lineups: Editar / Datos on the lineup screens (team editor, rival read-only)"

