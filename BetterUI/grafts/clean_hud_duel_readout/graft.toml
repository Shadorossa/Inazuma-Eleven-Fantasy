# BetterUI duel readout (docs/game/ui/duel-readout.md): after a special-move / power-action focus duel, each player's
# total on the shot readout's plates (left the player's side, right the rival's: «<label> <total>»), the values the game
# compared (BetterUI's scripts\duel_readout.lua, CMND_BETTERUI_DUEL_READOUT). Layers: BetterUI content\menus\
# duel_readout.toml (clean_hud_duel_telop_self / _enemy, clean_hud_duel_label). Switch: Mods options «Duel counter»
# (clean_hud.duel_readout, read live). Both match HUD scripts (soccer_constant_menu, soccer_battle_constant_menu: the
# layers are in both groups). Wrappers only; nothing runs at chunk load.
name = "clean_hud_duel_readout"
mod = "clean_hud"
order = 330
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInit", "OnOpenLayer", "Step"]
description = "BetterUI: the duel readout (each player's total after a special-move / power-action duel)"

[[files]]
stem = "soccer_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "duel_readout.lua"
  marker = "BetterUI duel readout"

[[files]]
stem = "soccer_battle_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "duel_readout.lua"
  marker = "BetterUI duel readout"
