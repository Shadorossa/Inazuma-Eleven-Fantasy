[ja.new]
mod_name = "BetterUI"
mod_description = "試合のHUDと元のゲームのメニューをすっきりさせます：メニュー上部バーをコンパクトに（122 pxから67 pxへ、各メニューとチームドックの内容も上へ）。ショップのショートカット（L2 / R2 または Q / E でマーケットの前 / 次のショップへ。以前の「ショップのショートカット」MOD）。試合では、相手のマーカーを削除、絆プレート（「MAX %」）をゲージのバーのように傾け、強化の列を小さくして下中央に、ダッシュ・カーソル加速・「フォーカスフィールド」のガイドを削除、パッシブのアイコンを5 %小さく、「上がれ！」を「パス」の下に、「RB＋稲妻」を小さな長方形のプレートにして少し左へ、作戦リングとメニュー（LB）を左へ、監督モードのガイドを上中央へ、ミニマップを上へ、フォーカス / ゾーン / デュエルの表示を小さくし、ゾーン / フォーカス / 競り合いの表示の下に残り時間とともに縮むタイムラインを追加。メニューでは、上部バーを半透明のダークガラス風に（Windows 11風：背景が透け、下に細い線）し、元の傾いたセクションプレートを維持、Escガイドの枠を削除、「チームボーナス」を他のガイドと同じ見た目に、バンクの「ニックネーム」の枠と並べ替えガイドを削除、角のボタンをリストと同じ見た目に（コンペティションとクロニクルでは「操作ガイド」「チュートリアル」を削除、クロニクルではガチャバナーの下にチーム・アイテム・ショップ・設定を4つの四角いアイコンボックスで表示）。チームドックでは、「チーム設定」を小さくして「フォーメーション」の隣に、ユニフォームをチーム名と選手プレートの間に、「Lv.99」を選手プレートの後ろに、メンバー番号の矢印を小さく、「チームAT / DF」を半分の大きさでキーパーの下に。フレームワークの「Mods」画面も低くなった上部バーに合わせて上へ。さらに、VS画面とピッチ入場の間のチーム編集を省略します（オフラインの試合）。入場後の2つのラインナップ画面に「編集」（試合の編集画面で自チーム）と「データ」（相手、閲覧のみ）を追加。フォーメーション画面（ピッチ、ベンチ、監督／マネージャー）と選手バンク（6列→8列）の選手カードをコンパクトに：幅を狭め、顔を中央に、属性は左・ポジションは右、名前・レベルなし。背番号はチーム編成の「コマンド」からチーム全体でまとめて変更（「背番号設定」：ゴールパフォーマンスの一覧に各選手の背番号を表示）。選手ごとのメニューからは変更しません。AIの役割も同様です（「AI設定」：各選手のAIの役割、決定でゲームの役割選択）。選手メニューから「移動」と選手ごとのAIの役割を外しました。ルール・データ・セーブは一切変更しません。必殺技やラフアタック（パワーチャージ／パワーブロック）で決まった競り合いの後、シュート表示のプレートに両選手の合計値を表示。2つの数値表示はMODオプション（「BetterUI モジュール」）で隠せます。クロニクルのVS画面では、Xで選手カードを「プレビュー」と「基本データ」(各選手のレベルと名前)に切り替えます。"
shop_switch = "ショップ切り替え"
prematch_edit = "編集"
prematch_data = "データ"
