[fr.new]
mod_name = "BetterUI"
mod_description = "HUD de match et menus du jeu d'origine plus épurés : barre du haut des menus compacte (67 px au lieu de 122, avec le contenu de chaque menu et la Composition d'équipe remontés), raccourcis de boutique (L2 / R2 ou Q / E passent à la boutique précédente / suivante du Marché ; autrefois le mod « Raccourcis de boutique ») ; marqueurs adverses retirés, plaque de lien (« MAX % ») inclinée comme les barres de la jauge, rangée d'améliorations plus petite et centrée en bas, guides de sprint, d'accélération du curseur et de « Champ de focus » retirés, icônes de passifs 5 % plus petites, « Montez ! » sous « Passe », « RB + éclair » sur une plaque rectangulaire plus petite et un peu plus à gauche, anneau et menu des tactiques (LB) à gauche, guide du mode entraîneur en haut au centre, mini-carte plus haute, bandeaux de focus / zone / duel plus petits, avec une ligne de temps sous le bandeau de zone / focus / affrontement qui raccourcit à mesure que le temps s'écoule, barre du haut des menus en verre sombre translucide (style Windows 11 : on voit le fond, fine ligne en bas) avec la plaque de section inclinée d'origine, guide Échap sans pastille, « Bonus d'équipe » comme les autres guides, sans pastille « Surnom » ni guide de tri dans la Banque, boutons de coin avec l'aspect de la liste, aucun (« Guide des commandes », « Tutoriel ») en Compétition et Chronique, et en Chronique Équipe, Objets, Boutique et Options en 4 cases carrées à icône sous la bannière du gacha ; dans la Composition d'équipe, « Config. d'équipe » plus petite à côté de « Formation », le maillot entre le nom de l'équipe et la plaque du joueur, « Nv 99 » après la plaque du joueur, des flèches du numéro d'effectif plus petites et « AT / DF d'équipe » à moitié de taille sous le gardien. L'écran « Mods » du framework, plus haut pour la barre du haut abaissée. Et plus d'éditeur d'équipe entre l'écran VS et l'entrée sur le terrain (matchs hors ligne). Après l'entrée, les deux écrans de composition ont « Modifier » (ton équipe dans l'éditeur du match) et « Données » (l'adversaire, en lecture seule). Cartes de joueur compactes sur les écrans de formation (terrain, banc, entraîneur / managers) et dans la réserve de joueurs (8 colonnes au lieu de 6) : carte plus étroite, visage centré, élément à gauche, poste à droite, sans nom ni niveau. Les numéros de maillot se changent pour toute l'équipe depuis « Commandes » de l'Effectif (« Réglages des numéros » : la liste des célébrations de but avec le numéro de chaque joueur), plus depuis le menu de chaque joueur ; les rôles de l'IA aussi (« Réglages de l'IA » : le rôle IA de chaque joueur, Valider = le sélecteur de rôles du jeu). Le menu du joueur n'a plus « Déplacer » ni le rôle IA par joueur. Aucune règle, donnée ni sauvegarde modifiée. Après un duel décidé par des techniques ou une attaque brutale (Charge en force / Bloc en force), le total de chaque joueur sur les plaques du compteur de tir ; les deux compteurs peuvent être masqués dans Options des mods (« Modules de BetterUI »). Sur l'écran VS de la Chronique, X fait passer les cartes de joueur de «Aperçu» à «Données de base» (niveau et nom de chaque joueur sur sa carte) et inversement."
