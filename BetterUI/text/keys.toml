modules_help = "Off: both BetterUI match readouts hidden. Your choices are kept."
duel_readout = "Duel counter"
duel_readout_help = "After a special-move or rough-attack duel, each player's total."
shot_readout = "AT / PP counter"
shot_readout_help = "When shooting, the shot's total AT against the keeper's PP."

[es.new]
mod_name = "BetterUI"
mod_description = "HUD del partido y menús del juego original más limpios: barra superior de los menús compacta (67 px en vez de 122, con el contenido de cada menú y la Plantilla subidos), atajos de tienda (L2 / R2 o Q / E pasan a la tienda anterior / siguiente del Mercado; antes el mod «Atajos de tienda»); marcadores del rival fuera, placa de vínculo («MÁX. %») inclinada como las barras del medidor, fila de mejoras más pequeña y centrada abajo, guías de esprint, de acelerar cursor y de «Campo de foco» fuera, iconos de pasivas un 5 % más pequeños, «¡Subid!» bajo «Pase», «RB + rayo» en una placa rectangular más pequeña y algo más a la izquierda, anillo y menú de tácticas (LB) a la izquierda, guía del modo del entrenador arriba en el centro, minimapa más arriba, rótulos de foco / zona / duelo más pequeños, con una línea de tiempo bajo el rótulo de zona / foco / disputa que se acorta mientras se agota el tiempo, barra superior de los menús de cristal oscuro translúcido (estilo Windows 11: se ve el fondo, línea fina abajo) con la placa de sección inclinada original, guía Esc sin pastilla, «Bonific. de equipo» como las demás guías, sin pastilla «Apodo» ni guía de orden en el Banco, botones de esquina con el aspecto de la lista, sin ellos («Guía de controles», «Tutorial») en Competición, Crónica y Estadio BB (en Crónica y Estadio BB la guía de controles es «Y Guía de controles» en la guía de botones de abajo), y en Crónica Plantilla, Objetos, Tienda y Opciones como 4 cajas cuadradas con icono bajo el banner del gacha; en Plantilla, «Conf. de equipo» más pequeña junto a «Formación», la equipación entre el nombre del equipo y la placa del jugador, «Nv. 99» tras la placa del jugador y las flechas del número de plantilla más pequeñas y «AT / DF de equipo» a la mitad de tamaño bajo el portero. La pantalla «Mods» del framework, más arriba para la barra superior baja. Y sin el editor de equipo entre la pantalla VS y la entrada al campo (partidos sin conexión). Tras la entrada, las dos pantallas de alineación llevan «Editar» (tu equipo en el editor del partido) y «Datos» (el rival, solo lectura). Cartas de jugador compactas en las pantallas de formación (campo, banquillo, entrenador / mánagers) y en el banco de jugadores (8 columnas en vez de 6): carta más estrecha con la cara centrada, elemento a la izquierda y posición a la derecha, sin nombre ni nivel. Los dorsales se cambian para todo el equipo desde «Comandos» en Plantilla («Ajustes de dorsales»: la lista de celebración de gol con el número de cada jugador), ya no desde el menú de cada jugador; los roles de la IA también («Ajustes de la IA»: el rol de la IA de cada jugador, Entrar = el selector de roles del juego). El menú del jugador ya no tiene «Mover» ni el rol de la IA de cada jugador. Nada de reglas, datos ni partidas. Tras un duelo decidido con supertécnicas o un ataque duro (Carga potente / Bloqueo potente), el total de cada jugador en las placas del contador de tiro; los dos contadores se pueden ocultar en Opciones de mods («Módulos de BetterUI»). En la pantalla VS de Crónica, X cambia las cartas de jugador entre «Previsualización» y «Datos básicos» (el nivel y el nombre de cada jugador en su carta)."
