schema = "VRFW.text_key/1"
# Texts of BetterUI (mod clean_hud; «Clear View» 1.16.0-1.17.0, «Clean HUD» / «Interfaz limpia» before) (format of the VR-Framework texts: docs/framework/types/text.md). New
# texts get the id crc32("clean_hud.<name>"): the guide label «<L2><R2> Cambiar de tienda» of the shop shortcuts
# (shop_switch, asked by research/grafts/shop_shortcuts with CMND_VRFW_TEXT_ID; was shop_shortcuts.switch of the mod
# shop_shortcuts until 2026-10-08). Pre-match (2026-10-08, from Inazuma Fantasy): the lineup buttons «Editar» / «Datos»
# (prematch_edit / prematch_data, asked by research/grafts/prematch_lineups with CMND_VRFW_TEXT_ID). (The pre-match
# «hold X» label prematch_skip moved to Utilities in 1.26.0.) The match
# readouts (1.22.0): the duel labels duel_dribble / duel_defense / duel_power_charge / duel_power_block (asked by
# research/grafts/clean_hud_duel_readout with CMND_VRFW_TEXT_ID) and the «Opciones de mods» rows of options.toml
# (modules, duel_readout, shot_readout and their help lines); every other feature is always on.
# The Chronicle VS screen (1.24.0): the two views of its player cards vs_preview / vs_basic_data, the label of the
# pill under the pitch (asked by assets\lua\_all\vs_basic_data.lua with CMND_VRFW_TEXT_ID).
# A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "BetterUI"
mod_description = "Cleaner match HUD and original game menus: a compact menu top bar (67 px instead of 122, with each menu's content and the Team Dock moved up), shop shortcuts (L2 / R2 or Q / E go to the previous / next shop of the Market; formerly the «Shop shortcuts» mod); rival markers removed, bond plate («MAX %») slanted like the gauge bars, smaller upgrade row centred at the bottom, sprint, cursor-speed and «Focus field» guides removed, passive icons 5 % smaller, «Go up!» under «Pass», «RB + lightning» on a smaller rectangular plate a little to the left, tactics ring and menu (LB) on the left, coach mode guide at the top centre, minimap higher, smaller focus / zone / duel banners, with a timeline under the zone / focus / clash banner that shrinks as time runs out, a translucent dark-glass menu top bar (Windows 11 style: the background shows through, thin line at the bottom) with the original slanted section plate, Esc guide without a pill, «Team bonus» like the other guides, no «Nickname» pill or sort guide in the Bank, corner buttons styled like the list, none («Controls guide», «Tutorial») in Competition, Chronicle and Battle Bay (in Chronicle and Battle Bay the controls guide is «Y Controls guide» in the bottom button guide), and Chronicle's Team, Items, Shop and Options as 4 square icon boxes under the gacha banner; in the Team Dock, a smaller «Team settings» next to «Formation», the kit between the team name and the player plate, «Lv. 99» after the player plate, smaller squad-number arrows and «Team AT / DF» at half size under the goalkeeper. The framework's «Mods» screen sits higher for the lower top bar. And no team editor between the VS screen and kick-off (offline matches). After the walk-in, the two lineup screens get «Edit» (your team in the match editor) and «Data» (the rival, read-only). Compact player cards on the formation screens (pitch, bench, coach / managers) and in the player bank (8 columns instead of 6): narrower card with the face centred, element at the left, position at the right, without name or level. Shirt numbers are set for the whole team from «Commands» in the Team Dock («Shirt number settings»: the goal celebration list with each player's number), no longer from each player's menu; the AI roles too («AI settings»: each player's AI role, Enter = the game's role chooser). The player menu has no «Move» and no per-player AI role. No rules, data or saves changed. After a duel decided by special moves or a rough attack (Power Charge / Power Block), each player's total on the shot readout's plates; both readouts can be hidden in Mod options («BetterUI modules»). On the Chronicle VS screen, X switches the player cards between «Preview» and «Basic data» (each player's level and name on his card)."
shop_switch = "Switch shop"
prematch_edit = "Edit"
prematch_data = "Data"
