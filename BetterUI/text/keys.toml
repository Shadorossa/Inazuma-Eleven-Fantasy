[zh_hans.new]
mod_name = "BetterUI"
mod_description = "让比赛HUD和原版游戏菜单更简洁：紧凑的菜单顶部栏（67 px而非122 px，各菜单和编组队伍的内容随之上移），商店快捷键（L2 / R2 或 Q / E 前往市场的上一个 / 下一个商店；原“商店快捷键”模组）；比赛中去掉对手标记，羁绊牌（“MAX %”）像量表的条一样倾斜，强化栏缩小并居中于底部，去掉冲刺、光标加速和“聚焦领域”的提示，被动技能图标缩小5 %，“上啊！”移到“传球”下方，“RB＋闪电”改为更小的矩形牌并稍微左移，战术环和菜单（LB）移到左侧，教练模式提示移到顶部中央，小地图上移，聚焦 / 区域 / 对决的标题变小，并在区域 / 聚焦 / 争夺标题下加入随时间流逝而缩短的时间条；菜单顶部栏改为半透明的深色玻璃（Windows 11风格：可透出背景，底部一条细线），保留原版倾斜的分区牌，Esc提示去掉底框，“队伍加成”与其他提示一致，阵容库中去掉“昵称”底框和排序提示，角落按钮与列表外观一致（竞技与编年史中去掉“操作指南”“教程”，编年史在扭蛋横幅下以4个方形图标框显示队伍、道具、商店、选项）；编组队伍中，“队伍设置”缩小并放在“阵型”旁，球衣放在队名和球员牌之间，“Lv.99”放在球员牌之后，阵容编号箭头缩小，“队伍AT / DF”缩小一半放在门将下方。框架的“Mods”画面也随更低的顶部栏上移。另外，VS画面和入场之间不再出现队伍编辑（离线比赛）。入场后的两个阵容画面加入“编辑”（在比赛编辑中修改你的队伍）和“数据”（对手，只读）。阵型画面（球场、替补席、教练／经理）和球员库（6列改为8列）的球员卡更紧凑：卡片更窄、脸部居中，属性在左、位置在右，不显示名字和等级。球衣号码改在阵容的“指令”中为全队统一设置（“球衣号码设置”：进球庆祝列表中显示每名球员的号码），不再在每名球员的菜单中设置；AI职责也一样（“AI设置”：每名球员的AI职责，确定 = 游戏的职责选择）。球员菜单不再有“移动”和单个球员的AI职责。不改变任何规则、数据或存档。由必杀技或粗野动作（强力冲撞／强力阻挡）决定的对决之后，在射门数值的面板上显示双方球员的合计值；两个数值显示可在模组选项（“BetterUI 模块”）中隐藏。编年史的VS画面中,按X可将球员卡在「预览」与「基本数据」(每名球员的等级与名字)之间切换。"
