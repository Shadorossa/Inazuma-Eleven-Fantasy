[de.new]
mod_name = "BetterUI"
mod_description = "Aufgeräumteres Spiel-HUD und Menüs des Originalspiels: kompakte obere Menüleiste (67 px statt 122, mit dem Inhalt jedes Menüs und der Team-Bank weiter oben), Laden-Kurzbefehle (L2 / R2 oder Q / E wechseln zum vorigen / nächsten Laden des Markts; früher der Mod „Laden-Kurzbefehle“); Gegnermarkierungen entfernt, Bindungsplakette („MAX %“) schräg wie die Balken der Anzeige, kleinere Verbesserungsreihe mittig unten, Hinweise für Sprint, Cursor-Beschleunigung und „Fokusfeld“ entfernt, Passiv-Symbole 5 % kleiner, „Rückt vor!“ unter „Pass“, „RB + Blitz“ auf einer kleineren rechteckigen Plakette etwas weiter links, Taktikring und -menü (LB) links, Hinweis des Trainermodus oben in der Mitte, Minikarte weiter oben, kleinere Fokus- / Zonen- / Duell-Banner, mit einer Zeitleiste unter dem Zonen- / Fokus- / Zweikampf-Banner, die mit ablaufender Zeit schrumpft, obere Menüleiste aus durchscheinendem dunklem Glas (Windows-11-Stil: der Hintergrund scheint durch, dünne Linie unten) mit der originalen schrägen Abschnittsplakette, Esc-Hinweis ohne Pille, „Teambonus“ wie die übrigen Hinweise, ohne „Spitzname“-Pille und Sortierhinweis in der Bank, Eckknöpfe im Stil der Liste, keine («Steuerung», «Tutorial») in Wettkampf und Chronik, und in der Chronik Team, Items, Laden und Optionen als 4 quadratische Symbolfelder unter dem Gacha-Banner; in der Team-Bank kleinere „Team-Einst.“ neben „Aufstellung“, das Trikot zwischen Teamname und Spielerplakette, „Lv. 99“ hinter der Spielerplakette, kleinere Pfeile der Kadernummer und „Team-AT / -DF“ in halber Größe unter dem Torwart. Der „Mods“-Bildschirm des Frameworks sitzt höher für die niedrigere obere Leiste. Und kein Teameditor zwischen VS-Bildschirm und Einlauf (Offline-Spiele). Nach dem Einlauf haben die beiden Aufstellungsbildschirme „Bearbeiten“ (dein Team im Spieleditor) und „Daten“ (der Gegner, nur ansehen). Kompakte Spielerkarten auf den Formationsbildschirmen (Feld, Bank, Trainer / Manager) und in der Spielerreserve (8 statt 6 Spalten): schmalere Karte mit zentriertem Gesicht, Element links, Position rechts, ohne Name und Level. Rückennummern werden für das ganze Team unter «Befehle» im Kader geändert («Rückennummern»: die Torjubel-Liste mit der Nummer jedes Spielers), nicht mehr im Menü jedes Spielers; ebenso die KI-Rollen («KI-Einstellungen»: die KI-Rolle jedes Spielers, Bestätigen = die Rollenauswahl des Spiels). Das Spielermenü hat kein «Bewegen» und keine KI-Rolle pro Spieler mehr. Keine Regeln, Daten oder Spielstände geändert. Nach einem Duell, das Spezialtechniken oder ein rauer Angriff (Power-Angriff / Power-Block) entscheiden, der Gesamtwert jedes Spielers auf den Plaketten der Schussanzeige; beide Anzeigen lassen sich in den Mod-Optionen ausblenden („BetterUI-Module“). Auf dem VS-Bildschirm der Chronik schaltet X die Spielerkarten zwischen «Vorschau» und «Grunddaten» um (Level und Name jedes Spielers auf seiner Karte)."
