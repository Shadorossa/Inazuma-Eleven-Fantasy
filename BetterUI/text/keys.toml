[pt.new]
mod_name = "BetterUI"
mod_description = "HUD da partida e menus do jogo original mais limpos: barra superior dos menus compacta (67 px em vez de 122, com o conteúdo de cada menu e o Clube mais acima), atalhos de loja (L2 / R2 ou Q / E passam para a loja anterior / seguinte do Mercado; antes o mod «Atalhos de loja»); marcadores do rival removidos, placa de vínculo («MÁX. %») inclinada como as barras do medidor, fila de melhorias menor e centrada embaixo, guias de corrida, de acelerar o cursor e de «Campo de foco» removidas, ícones de passivas 5 % menores, «Avancem!» abaixo de «Passe», «RB + raio» numa placa retangular menor e um pouco mais à esquerda, anel e menu de táticas (LB) à esquerda, guia do modo treinador em cima no centro, minimapa mais acima, letreiros de foco / zona / duelo menores, com uma linha de tempo sob o letreiro de zona / foco / disputa que encolhe enquanto o tempo se esgota, barra superior dos menus de vidro escuro translúcido (estilo Windows 11: vê-se o fundo, linha fina embaixo) com a placa de seção inclinada original, guia Esc sem pílula, «Bônus de time» como as demais guias, sem pílula «Apelido» nem guia de ordenação no Banco, botões de canto com o aspecto da lista, nenhum («Controles», «Tutorial») em Competição e Crônica, e na Crônica Equipe, Itens, Loja e Opções como 4 caixas quadradas com ícone sob o banner do gacha; no Clube, «Config. de time» menor ao lado de «Formação», o uniforme entre o nome do time e a placa do jogador, «Nv. 99» depois da placa do jogador, setas do número do elenco menores e «AT / DF do time» com metade do tamanho abaixo do goleiro. A tela «Mods» do framework, mais acima para a barra superior mais baixa. E sem o editor de time entre a tela VS e a entrada em campo (partidas offline). Depois da entrada, as duas telas de escalação têm «Editar» (o seu time no editor da partida) e «Dados» (o rival, só leitura). Cartas de jogador compactas nas telas de formação (campo, banco, treinador / gerentes) e no banco de jogadores (8 colunas em vez de 6):