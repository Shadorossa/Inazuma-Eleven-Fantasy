[zh_hant.new]
mod_name = "BetterUI"
mod_description = "讓比賽HUD和原版遊戲選單更簡潔：緊湊的選單頂部欄（67 px而非122 px，各選單和編組隊伍的內容隨之上移），商店快捷鍵（L2 / R2 或 Q / E 前往市場的上一個 / 下一個商店；原「商店快捷鍵」模組）；比賽中移除對手標記，羈絆牌（「MAX %」）像量表的條一樣傾斜，強化欄縮小並置中於底部，移除衝刺、游標加速和「聚焦領域」的提示，被動技能圖示縮小5 %，「上啊！」移到「傳球」下方，「RB＋閃電」改為更小的矩形牌並稍微左移，戰術環和選單（LB）移到左側，教練模式提示移到頂部中央，小地圖上移，聚焦 / 區域 / 對決的標題變小，並在區域 / 聚焦 / 爭奪標題下加入隨時間流逝而縮短的時間條；選單頂部欄改為半透明的深色玻璃（Windows 11風格：可透出背景，底部一條細線），保留原版傾斜的分區牌，Esc提示移除底框，「隊伍加成」與其他提示一致，陣容庫中移除「暱稱」底框和排序提示，角落按鈕與列表外觀一致（競技與編年史中移除「操作方式」「教學」，編年史在扭蛋橫幅下以4個方形圖示框顯示隊伍、道具、商店、選項）；編組隊伍中，「隊伍設定」縮小並放在「陣型」旁，球衣放在隊名和球員牌之間，「Lv.99」放在球員牌之後，陣容編號箭頭縮小，「隊伍AT / DF」縮小一半放在守門員下方。框架的「Mods」畫面也隨更低的頂部欄上移。另外，VS畫面和進場之間不再出現隊伍編輯（離線比賽）。進場後的兩個陣容畫面加入「編輯」（在比賽編輯中修改你的隊伍）和「數據」（對手，唯讀）。陣型畫面（球場、替補席、教練／經理）和球員庫（6列改為8列）的球員卡更緊湊：卡片更窄、臉部置中，屬性在左、位置在右，不顯示名字和等級。球衣號碼改在陣容的「指令」中為全隊統一設定（「球衣號碼設定」：進球慶祝列表中顯示每名球員的號碼），不再在每名球員的選單中設定；AI職責也一樣（「AI設定」：每名球員的AI職責，確定 = 遊戲的職責選擇）。球員選單不再有「移動」和單一球員的AI職責。不改變任何規則、資料或存檔。由必殺技或粗暴攻擊（動力充能／動力攔截）決定的對決之後，在射門數值的面板上顯示雙方球員的合計值；兩個數值顯示可在模組選項（「BetterUI 模組」）中隱藏。編年史的VS畫面中,按X可將球員卡在「預覽」與「基本資料」(每名球員的等級與名字)之間切換。"
