[it.new]
mod_name = "BetterUI"
mod_description = "HUD della partita e menu del gioco originale più puliti: barra superiore dei menu compatta (67 px invece di 122, con il contenuto di ogni menu e lo Slot Squadra spostati in alto), scorciatoie dei negozi (L2 / R2 o Q / E passano al negozio precedente / successivo del Mercato; prima la mod «Scorciatoie dei negozi»); indicatori degli avversari rimossi, targa del legame («MAX %») inclinata come le barre dell'indicatore, fila dei potenziamenti più piccola e centrata in basso, guide di scatto, di accelerazione del cursore e di «Campo di focus» rimosse, icone delle passive più piccole del 5 %, «Avanti!» sotto «Passaggio», «RB + fulmine» su una targa rettangolare più piccola e un po' più a sinistra, anello e menu delle tattiche (LB) a sinistra, guida della modalità allenatore in alto al centro, minimappa più in alto, scritte di focus / zona / duello più piccole, con una linea del tempo sotto la scritta di zona / focus / contesa che si accorcia mentre scade il tempo, barra superiore dei menu in vetro scuro traslucido (stile Windows 11: si vede lo sfondo, linea sottile in basso) con la targa di sezione inclinata originale, guida Esc senza pastiglia, «Bonus squadra» come le altre guide, senza pastiglia «Soprannome» né guida di ordinamento nella Banca, pulsanti d'angolo con l'aspetto dell'elenco, nessuno («Comandi», «Tutorial») in Competizione e Cronaca, e in Cronaca Squadra, Oggetti, Negozio e Opzioni come 4 riquadri quadrati con icona sotto il banner del gacha; nello Slot Squadra, «Impost. squadra» più piccola accanto a «Formazione», la divisa tra il nome della squadra e la targa del giocatore, «Liv. 99» dopo la targa del giocatore, frecce del numero di rosa più piccole e «AT / DF di squadra» a metà dimensione sotto il portiere. La schermata «Mods» del framework, più in alto per la barra superiore ribassata. E niente editor della squadra tra la schermata VS e l'ingresso in campo (partite offline). Dopo l'ingresso, le due schermate delle formazioni hanno «Modifica» (la tua squadra nell'editor della partita) e «Dati» (l'avversario, sola lettura). Carte giocatore compatte nelle schermate di formazione (campo, panchina, allenatore / manager) e nella riserva giocatori (8 colonne invece di 6): carta più stretta con il volto al centro, elemento a sinistra, ruolo a destra, senza nome né livello. I numeri di maglia si cambiano per tutta la squadra da «Comandi» nella Rosa («Impostazioni numeri»: l'elenco delle esultanze con il numero di ogni giocatore), non più dal menu di ogni giocatore; anche i ruoli dell'IA («Impostazioni IA»: il ruolo IA di ogni giocatore, Conferma = il selettore di ruoli del gioco). Il menu del giocatore non ha più «Sposta» né il ruolo IA per giocatore. Nessuna regola, dato o salvataggio modificato. Dopo un duello deciso da tecniche speciali o da un attacco impetuoso (Sfondamento / Contrasto impetuoso), il totale di ogni giocatore sulle placche del contatore di tiro; i due contatori si possono nascondere in Opzioni mod («Moduli di BetterUI»). Nella schermata VS della Cronaca, X alterna le carte giocatore tra «Anteprima» e «Dati di base» (livello e nome di ogni giocatore sulla sua carta)."
