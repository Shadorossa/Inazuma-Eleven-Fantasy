# BetterUI settings (mod clean_hud). Can also go in <game>\evt_loader\config.toml under [mods.clean_hud].

# No team editor between the VS screen and the walk-in (offline matches; online / observer matches keep it).
# Always on for the player (no «Opciones de mods» row since 1.14.6). false = developer kill switch: the original editor
# opens (read at every match by scripts\prematch_editor.lua, the handler of the mid hook content\game\prematch_editor.toml).
skip_prematch_editor = true


# The match HUD's kizuna plate («MÁX. n %») slanted like the gauge bars (image recipe content\images\menu\00_soccer\
# soccer08\soccer08_04.toml + the mesh move content\menus\kizuna_plate.toml, both `when = { config = "slanted_kizuna" }`).
# false = the retail rounded capsule (read at the next game start).
slanted_kizuna = true

# The card colour of each player position, wherever cards are coloured by position (team screen, formation, bench,
# Competition lists, the player page header, drop lists: No More Rarities' position looks). Each position takes the
# look (card frame, plates, row colour) of the position named here: goalkeeper (gold), defender (blue), midfielder
# (green), forward (red). Owner 2026-10-19: midfielders blue, defenders green. Read at the first card of each screen
# (scripts\better_ui.lua BetterUI.PositionLook, CMND_BETTERUI_POSITION_LOOK); a missing or unknown name = the
# position's own look. Without No More Rarities nothing changes.
[position_card_looks]
goalkeeper = "goalkeeper"
defender = "midfielder"
midfielder = "defender"
forward = "forward"

# The pitch cards of the formation screens moved apart where they touch (assets\lua\_all\formation_card_spread.lua,
# asked once per screen through CMND_BETTERUI_FORMATION_CARD_SPREAD). The game puts each card at the formation's
# attacking position; in the attacking half the rows sit close and the cards overlap. Only the cards that touch move,
# each pair along the side where it overlaps least, inside the pitch; when that is not enough the cards are drawn a
# little smaller (down to smallest_scale), and when even that does not help the formation stays as the game draws it.
# Matches and the formations themselves are not changed. Sizes and limits in layout pixels of the pitch frame
# (soccer11_02, card centres; y grows upwards, the centre circle is 0). enabled = false: the game's own placement.
[formation_card_spread]
enabled = true
card_width = 154      # the compact card's touch area (team00_01_evt_fc _touch_chr01)
card_height = 116
gap = 6               # space kept between two cards that had to move
smallest_scale = 0.8  # the smallest card size tried when moving is not enough
scale_step = 0.05     # the size steps tried from 1 down to smallest_scale
pitch_side = 300      # how far left / right of the centre a card centre may go (the bench starts beyond)
pitch_top = 262       # the highest card centre (the far goal line is at 278)
pitch_bottom = -323   # the lowest card centre (the own goal line is at -381)
