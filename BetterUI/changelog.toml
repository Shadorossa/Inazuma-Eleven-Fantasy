[[release]]
icon = "general"
notes = [
    "HUD de partido más limpio: sin medidores del rival.",
    "Rótulos de duelo y zona más pequeños, con su tiempo.",
    "Barra superior compacta y translúcida en los menús.",
    "Cartas compactas, Banco a 8 columnas, L2/R2 en tiendas.",
    "Crónica y Plantilla con menús reordenados.",
    "Mantén X antes del partido: directo al saque.",
    "Ficha del jugador y menú «Personaje» más claros.",
]

[release.en]
notes = [
    "Cleaner match HUD: no rival meters or sprint guides.",
