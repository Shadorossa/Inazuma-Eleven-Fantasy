    "Compact, translucent top bar in the menus.",
    "Compact cards, 8-column Bank, L2/R2 switch shops.",
    "Reworked Chronicle and Team Dock menus.",
    "Hold X before a match: straight to the kick-off.",
    "Clearer player plate and «Character» menu.",
]

