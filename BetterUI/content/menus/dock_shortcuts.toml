# Hand-maintained. «Plantilla de equipo» (soccer_team_dock_menu), round 9 (owner 2026-10-19): a row of four shortcut
# tiles in the panel, under TÁCTICAS: Vínculo de Afinidad, Comandos de hipertécnicas, Habilidades, Banco, each opening
# what the dock list's row of that kind opens (graft ui_clean_dock_panel, CHD.ROW: the dock's own OnDecideFocus of that
# row). The tiles are a copy of the CONF. DE EQUIPO box's object (team00_14_build_type_icon) without its balloon
# attach (the balloon stays on CONF. DE EQUIPO), four instances of one layer; the graft scales and places them, hides
# their title, name each with its list row's text and put BetterUI's own glyph in each (icon_common.g4tx, the menu resource below; content\images\menu\200_icon\15_icon_common\shortcut_icons.toml); the list
# loses those four rows. Input rows: ENTER (the graft's
# OnEnter), the arrows as CMD_FUNCTION betterui_dock_shortcut_left / _right / _up / _down (the graft's OnFunction:
# no polling), the dock's function keys (team switch, …) and back, as the synergy buttons have them.
schema = "VRFW.menu/2"

[[object]]
name = "betterui_dock_shortcut"
from = "team00_14_build_type_icon"
remove = [{ param = "NullLayerName", match = { 3 = -1380324264 } }]
# the notices of the list rows the tiles replace, attached like the list item attaches them (same labels): the «!» of a
# new ability (cmn01_10_new_icon_ability) on _pos_atc_flavor01 (the box's top-right corner), the bank's player count
# (team14_05_chara_bank_count) on _pos_atc_free01 (the graft moves it onto the box's top edge). Copies of the cursor's
# attach row; the graft keeps each traced only by its own tile
copy = [
    { param = "NullLayerName", match = { 1 = 0xC57F6A8E }, values = { 1 = 0xC9BC4393, 2 = 0x0B696401, 3 = 0x2C3573CA } },
    { param = "NullLayerName", match = { 1 = 0xC57F6A8E }, values = { 1 = 0x8EB7B730, 2 = 0xFFEC46CA, 3 = 0xE9F2D8C0 } },
]

[[patch]]
menu = "soccer_team_dock_menu"
add_layer = { name = "betterui_dock_shortcut", object = "betterui_dock_shortcut", count = 4, after = "team00_17_synergy_attachment_button_flag", groups = [{ group = "soccer_team_dock_menu", flags = [0, 1, 0, 0, 1, 0], after = "team00_17_synergy_attachment_button_flag" }], focus = { info = [973515837, 0, 0] } }
res = ["#/menu/200_icon/15_icon_common/icon_common.g4tx"]

[[patch]]
menu = "soccer_team_dock_menu"
add_cmd = [
    { layer = "betterui_dock_shortcut", input = 1981080283, command = "CMD_ENTER", arg = 4108050209, arg2 = 4108050209, flag = 1 },
