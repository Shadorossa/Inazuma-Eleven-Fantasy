# ---- your half (vs_route_town_vs_team_menu) -------------------------------------------------------------------------
# both card layers take their own object here (the formation redirect of menus\player_cards.toml no longer lists this
# screen)
[[patch]]
menu = "vs_route_town_vs_team_menu"
layer = "team00_01_chara_card_for_soccer"
object = "better_ui_vs_card"

[[patch]]
menu = "vs_route_town_vs_team_menu"
layer = "team00_01_chara_card_for_leader"
object = "better_ui_vs_leader_card"

[[patch]]
menu = "vs_route_town_vs_team_menu"
add_layer = { name = "better_ui_card_name", object = "better_ui_card_name", count = 19, align = ["right", "middle"], scale = 0.20000000298023224, after = "vsroute02_05_my_formation_base", groups = [{ group = "vs_route_town_vs_team_menu", flags = [0, 0, 0, 0, 1, 0], after = "vsroute02_05_my_formation_base" }] }

[[patch]]
menu = "vs_route_town_vs_team_menu"
add_layer = { name = "better_ui_card_name_leader", object = "better_ui_card_name", count = 1, align = ["right", "middle"], scale = 0.20000000298023224, after = "better_ui_card_name", groups = [{ group = "vs_route_town_vs_team_menu", flags = [0, 0, 0, 0, 1, 0], after = "better_ui_card_name" }] }

