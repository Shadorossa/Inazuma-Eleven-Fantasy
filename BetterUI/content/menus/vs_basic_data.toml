joint = "_touch_list01"
scale = [0.0, 0.0, 1.0]

# ---- the cards ------------------------------------------------------------------------------------------------------
# Index attach rows: NullLayerIndexName [row label, card locator, name layer] (labels crc32("better_ui_card_name_large")
# / "_small" / "better_ui_card_name_leader_large" / "_small"; _pos_base01 = 0x5A709C12, _pos_base02 = -1015427672;
# better_ui_card_name = 98463589, better_ui_card_name_leader = 770171539). The rival's pitch / bench card
# (team00_01_chara_card_for_vsroute_evt, menus\player_cards.toml) carries the rows too. The coach card is its own
# object on both halves, so the coach's name never shares an instance with card 0's.

# your half: the formation card of menus\player_cards.toml (team00_01_chara_card_for_formation_evt's rows) with the rows
[[object]]
name = "better_ui_vs_card"
from = "team00_01_chara_card_for_soccer"
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/102_team/team00/team00_01/team00_01.g4pkm" }, values = { 1 = "common/menu/102_team/team00/team00_01/team00_01_evt_fc.g4pkm" } },
    { param = "AttachEffect", match = { 1 = 0x151AA0C6, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x2A0667AE } },
    { param = "AttachEffect", match = { 1 = 0x8C13F17C, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x2A0667AE } },
    { param = "AttachEffect", match = { 1 = 0xDDFA2FB6, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x2A0667AE } },
    { param = "AttachEffect", match = { 1 = 0x33F44E9A, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x2A0667AE } },
]
add = [
    { block = "CMenuAttachLocator", param = "NullLayerIndexName", values = [1346942742, 0x5A709C12, 98463589] },
    { block = "CMenuAttachLocator", param = "NullLayerIndexName", values = [2087089339, -1015427672, 98463589] },
]

