# BetterUI, match HUD: the slanted kizuna plate's mesh (docs/game/ui/ui-redesign.md §2.12). With «/» ends the lower
# right corner is the narrowest point of the plate's right end, exactly where «%» sits (units 163..181, rows 18..30):
# the plate mesh _kizuna_base01 (retail top-left (0, 18), 192 x 36 units under _pos_offset01; no clip animates it)
# moves 5 units right so the slanted end clears «%». The texts («MÁX.», the number, «%») are their own meshes and stay.
# The picture is content\images\menu\00_soccer\soccer08\soccer08_04.toml. Until 1.16.0 clean_hud.dll moved it
# (crates/plugins/clean_hud/src/kizuna.rs build_layout). Only with config.toml slanted_kizuna (default true).
schema = "vr_framework.menu/2"
when = { config = "slanted_kizuna", default = true }

# retail translate x 0.0
[[layout]]
file = "common/menu/00_soccer/soccer08/soccer08_04/soccer08_04.g4pkm"
joint = "_kizuna_base01"
translate = [5.0]
