schema = "VRFW.text_key/1"
# Texts of Inazuma Fantasy (mod inazuma_fantasy_2): the «Mods» screen's name and description.
default_lang = "en"

[en.new]
mod_name = "Inazuma Fantasy"
mod_description = "The Market has three shops of its own, priced in Passion Points (the BB Rare Medal renamed; the Victory Star becomes Friendship Points): a General Store (tickets, consumables, name plates, kits, emblems, Kizuna decorations, stickers, titles), a Training Shop (player equipment, special tactics, synergies, keshin and other moves) and Special Moves (one tab per move type: shot, dribble, block, catch). Those goods leave the game's shops, player spirits and premade Diamonds are no longer sold, and an emptied shop leaves the Market; the modes' shop buttons open the General Store. Nine Idols of the original Inazuma Fantasy take the place of the game's Idols of the same players."

[es.new]
mod_name = "Inazuma Fantasy"
mod_description = "El Mercado tiene tres tiendas propias, con precios en Puntos de pasión (la Medalla rara BB renombrada; la Estrella de la victoria pasa a ser Puntos de amistad): una Tienda general (tiques, consumibles, placas, equipaciones, emblemas, decoraciones del Kizuna, pegatinas, títulos), una Tienda de entrenamiento (equipamiento de jugador, supertácticas, sinergias, supertécnicas de keshin y otras) y Supertécnicas (una pestaña por tipo: tiro, regate, defensa, parada). Esos artículos salen de las tiendas del juego, los espíritus de jugador y los Diamantes prediseñados dejan de venderse, y una tienda que se queda vacía sale del Mercado; los botones de tienda de los modos abren la Tienda general. Nueve Ídolos del Inazuma Fantasy original ocupan el lugar de los Ídolos del juego de los mismos jugadores."

[fr.new]
mod_name = "Inazuma Fantasy"
mod_description = "Le Marché compte trois boutiques propres, au prix de Points de passion (la Médaille rare BB renommée ; l'Étoile de la victoire devient Points d'amitié) : une Boutique générale (tickets, consommables, plaques, maillots, emblèmes, décorations Kizuna, autocollants, titres), une Boutique d'entraînement (équipement de joueur, supertactiques, synergies, supertechniques de keshin et autres) et Supertechniques (un onglet par type : tir, dribble, défense, arrêt). Ces articles quittent les boutiques du jeu, les esprits de joueur et les Diamants préfabriqués ne sont plus vendus, et une boutique vidée quitte le Marché ; les boutons de boutique des modes ouvrent la Boutique générale. Neuf Idoles de l'Inazuma Fantasy original remplacent les Idoles du jeu des mêmes joueurs."

[de.new]
mod_name = "Inazuma Fantasy"
mod_description = "Der Markt hat drei eigene Läden, bezahlt mit Leidenschaftspunkten (die umbenannte BB Seltene Medaille; der Siegesstern wird zu Freundschaftspunkten): ein Gemischtwarenladen (Tickets, Verbrauchsgegenstände, Namensschilder, Trikots, Embleme, Kizuna-Dekorationen, Sticker, Titel), ein Trainingsladen (Spielerausrüstung, Spezialtaktiken, Synergien, Keshin- und weitere Techniken) und Spezialtechniken (ein Reiter je Typ: Schuss, Dribbling, Abwehr, Parade). Diese Waren verlassen die Läden des Spiels, Spielergeister und vorgefertigte Diamanten werden nicht mehr verkauft, und ein geleerter Laden verlässt den Markt; die Laden-Schaltflächen der Modi öffnen den Gemischtwarenladen. Neun Idole des ursprünglichen Inazuma Fantasy ersetzen die Idole des Spiels derselben Spieler."

[it.new]
mod_name = "Inazuma Fantasy"
mod_description = "Il Mercato ha tre negozi propri, a prezzi in Punti passione (la Medaglia rara BB rinominata; la Stella della vittoria diventa Punti amicizia): un Negozio generale (biglietti, consumabili, targhe, divise, stemmi, decorazioni Kizuna, adesivi, titoli), un Negozio di allenamento (equipaggiamento dei giocatori, supertattiche, sinergie, supertecniche keshin e altre) e Supertecniche (una scheda per tipo: tiro, dribbling, difesa, parata). Questi articoli lasciano i negozi del gioco, gli spiriti dei giocatori e i Diamanti predefiniti non sono più in vendita, e un negozio rimasto vuoto lascia il Mercato; i pulsanti negozio delle modalità aprono il Negozio generale. Nove Idoli dell'Inazuma Fantasy originale prendono il posto degli Idoli del gioco degli stessi giocatori."

[pt.new]
mod_name = "Inazuma Fantasy"
mod_description = "O Mercado tem três lojas próprias, com preços em Pontos de paixão (a Medalha Rara da BB renomeada; a Estrela da vitória passa a Pontos de amizade): uma Loja geral (bilhetes, consumíveis, placas, equipamentos de equipa, emblemas, decorações Kizuna, autocolantes, títulos), uma Loja de treino (equipamento de jogador, supertáticas, sinergias, supertécnicas de keshin e outras) e Supertécnicas (um separador por tipo: remate, drible, defesa, defesa do GR). Esses artigos saem das lojas do jogo, os espíritos de jogador e os Diamantes pré-feitos deixam de ser vendidos, e uma loja que fica vazia sai do Mercado; os botões de loja dos modos abrem a Loja geral. Nove Ídolos do Inazuma Fantasy original substituem os Ídolos do jogo dos mesmos jogadores."

[ja.new]
mod_name = "Inazuma Fantasy"
mod_description = "マーケットには専用ショップが3つ。価格は情熱ポイント（ＢＢレアメダルを改名、勝利の星は友情ポイントに）です。「よろず屋」（チケット、消費アイテム、プレート、ユニフォーム、エンブレム、キズナの飾り、ステッカー、称号）、「トレーニングショップ」（選手の装備、必殺タクティクス、シナジー、化身などの必殺技）、「必殺技」（シュート・ドリブル・ブロック・キャッチのタブ）。これらの商品はゲームのショップから移動し、選手のスピリットと既製のダイヤモンドは販売されなくなり、空になったショップはマーケットから消え、各モードのショップボタンは「よろず屋」を開きます。元祖Inazuma Fantasyのアイドル9人が、同じ選手のゲーム内アイドルと入れ替わります。"

[zh_hans.new]
mod_name = "Inazuma Fantasy"
mod_description = "市场有三家专属商店，以热情点数购买（BB稀有奖章改名，胜利之星改为友情点数）：“综合商店”（门票、消耗品、名牌、队服、队徽、羁绊装饰、贴纸、称号）、“训练商店”（球员装备、必杀战术、协同、化身等必杀技）以及“必杀技”（射门、盘带、防守、扑救分页）。这些商品移出游戏的商店，球员灵魂与预设钻石不再出售，清空的商店从市场中移除，各模式的商店按钮改为打开“综合商店”。原版Inazuma Fantasy的9张偶像卡取代同一球员的游戏偶像卡。"

[zh_hant.new]
mod_name = "Inazuma Fantasy"
mod_description = "市場有三家專屬商店，以熱情點數購買（BB稀有勳章改名，勝利之星改為友情點數）：「綜合商店」（門票、消耗品、名牌、隊服、隊徽、羈絆裝飾、貼紙、稱號）、「訓練商店」（球員裝備、必殺戰術、協同、化身等必殺技）以及「必殺技」（射門、盤帶、防守、撲救分頁）。這些商品移出遊戲的商店，球員靈魂與預設鑽石不再出售，清空的商店從市場中移除，各模式的商店按鈕改為打開「綜合商店」。原版Inazuma Fantasy的9張偶像卡取代同一球員的遊戲偶像卡。"
