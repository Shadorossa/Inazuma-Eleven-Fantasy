schema = "VRFW.text_key/1"
# Texts of Inazuma Fantasy (mod inazuma_fantasy_2): the «Mods» screen's name and description.
default_lang = "en"

[en.new]
mod_name = "Inazuma Fantasy"
mod_description = "A General Store at the top of the Market sells every team emblem, ticket (stadiums, Kizuna areas), Kizuna decoration and sticker of every shop in the game, priced in Passion Points (the BB Rare Medal renamed; the Victory Star becomes Friendship Points). Nine Idols of the original Inazuma Fantasy take the place of the game's Idols of the same players."

[es.new]
mod_name = "Inazuma Fantasy"
mod_description = "Una Tienda general al principio del Mercado vende todos los emblemas de equipo, tiques (estadios, zonas del Kizuna), decoraciones del Kizuna y pegatinas de todas las tiendas del juego, con precios en Puntos de pasión (la Medalla rara BB renombrada; la Estrella de la victoria pasa a ser Puntos de amistad). Nueve Ídolos del Inazuma Fantasy original ocupan el lugar de los Ídolos del juego de los mismos jugadores."

[fr.new]
mod_name = "Inazuma Fantasy"
mod_description = "Une Boutique générale en tête du Marché vend tous les emblèmes d'équipe, tickets (stades, zones Kizuna), décorations Kizuna et autocollants de toutes les boutiques du jeu, au prix de Points de passion (la Médaille rare BB renommée ; l'Étoile de la victoire devient Points d'amitié). Neuf Idoles de l'Inazuma Fantasy original remplacent les Idoles du jeu des mêmes joueurs."

[de.new]
mod_name = "Inazuma Fantasy"
mod_description = "Ein Gemischtwarenladen ganz oben im Markt verkauft alle Teamembleme, Tickets (Stadien, Kizuna-Gebiete), Kizuna-Dekorationen und Sticker aller Läden des Spiels, bezahlt mit Leidenschaftspunkten (die umbenannte BB Seltene Medaille; der Siegesstern wird zu Freundschaftspunkten). Neun Idole des ursprünglichen Inazuma Fantasy ersetzen die Idole des Spiels derselben Spieler."

[it.new]
mod_name = "Inazuma Fantasy"
mod_description = "Un Negozio generale in cima al Mercato vende tutti gli stemmi di squadra, i biglietti (stadi, zone Kizuna), le decorazioni Kizuna e gli adesivi di tutti i negozi del gioco, a prezzi in Punti passione (la Medaglia rara BB rinominata; la Stella della vittoria diventa Punti amicizia). Nove Idoli dell'Inazuma Fantasy originale prendono il posto degli Idoli del gioco degli stessi giocatori."

[pt.new]
mod_name = "Inazuma Fantasy"
mod_description = "Uma Loja geral no topo do Mercado vende todos os emblemas de equipa, bilhetes (estádios, zonas Kizuna), decorações Kizuna e autocolantes de todas as lojas do jogo, com preços em Pontos de paixão (a Medalha Rara da BB renomeada; a Estrela da vitória passa a Pontos de amizade). Nove Ídolos do Inazuma Fantasy original substituem os Ídolos do jogo dos mesmos jogadores."

[ja.new]
mod_name = "Inazuma Fantasy"
mod_description = "マーケットの一番上に「よろず屋」が登場。ゲーム内すべてのショップで売られているチームエンブレム、チケット（スタジアム・キズナエリア）、キズナの飾り、ステッカーをまとめて販売します。価格は情熱ポイント（ＢＢレアメダルを改名、勝利の星は友情ポイントに）です。元祖Inazuma Fantasyのアイドル9人が、同じ選手のゲーム内アイドルと入れ替わります。"

[zh_hans.new]
mod_name = "Inazuma Fantasy"
mod_description = "市场顶部新增“综合商店”，汇集游戏中所有商店出售的队徽、门票（球场、羁绊区域）、羁绊装饰和贴纸，以热情点数购买（BB稀有奖章改名，胜利之星改为友情点数）。原版Inazuma Fantasy的9张偶像卡取代同一球员的游戏偶像卡。"

[zh_hant.new]
mod_name = "Inazuma Fantasy"
mod_description = "市場頂部新增「綜合商店」，匯集遊戲中所有商店出售的隊徽、門票（球場、羈絆區域）、羈絆裝飾和貼紙，以熱情點數購買（BB稀有勳章改名，勝利之星改為友情點數）。原版Inazuma Fantasy的9張偶像卡取代同一球員的遊戲偶像卡。"
