schema = "VRFW.text_key/1"
# Texts of Inazuma Fantasy (mod inazuma_fantasy_2): the «Mods» screen's name and description.
default_lang = "en"

[en.new]
mod_name = "Inazuma Fantasy"
mod_description = "The Market opens with four shops of its own, priced in Passion Points (the BB Rare Medal renamed; the Victory Star becomes Friendship Points): a General Store (tickets, consumables, name plates, kits, emblems, Kizuna decorations, stickers), a Training Shop (player equipment, special tactics, synergies, keshin and other moves) and two move shops (shots; dribbles and defence). Those goods leave the game's shops, player spirits and premade Diamonds are no longer sold, and an emptied shop leaves the Market. Nine Idols of the original Inazuma Fantasy take the place of the game's Idols of the same players."

[es.new]
mod_name = "Inazuma Fantasy"
mod_description = "El Mercado empieza con cuatro tiendas propias, con precios en Puntos de pasión (la Medalla rara BB renombrada; la Estrella de la victoria pasa a ser Puntos de amistad): una Tienda general (tiques, consumibles, placas, equipaciones, emblemas, decoraciones del Kizuna, pegatinas), una Tienda de entrenamiento (equipamiento de jugador, supertácticas, sinergias, supertécnicas de keshin y otras) y dos tiendas de supertécnicas (tiro; regate y defensa). Esos artículos salen de las tiendas del juego, los espíritus de jugador y los Diamantes prediseñados dejan de venderse, y una tienda que se queda vacía sale del Mercado. Nueve Ídolos del Inazuma Fantasy original ocupan el lugar de los Ídolos del juego de los mismos jugadores."

[fr.new]
mod_name = "Inazuma Fantasy"
mod_description = "Le Marché s'ouvre sur quatre boutiques propres, au prix de Points de passion (la Médaille rare BB renommée ; l'Étoile de la victoire devient Points d'amitié) : une Boutique générale (tickets, consommables, plaques, maillots, emblèmes, décorations Kizuna, autocollants), une Boutique d'entraînement (équipement de joueur, supertactiques, synergies, supertechniques de keshin et autres) et deux boutiques de supertechniques (tirs ; dribbles et défense). Ces articles quittent les boutiques du jeu, les esprits de joueur et les Diamants préfabriqués ne sont plus vendus, et une boutique vidée quitte le Marché. Neuf Idoles de l'Inazuma Fantasy original remplacent les Idoles du jeu des mêmes joueurs."

[de.new]
mod_name = "Inazuma Fantasy"
mod_description = "Der Markt beginnt mit vier eigenen Läden, bezahlt mit Leidenschaftspunkten (die umbenannte BB Seltene Medaille; der Siegesstern wird zu Freundschaftspunkten): ein Gemischtwarenladen (Tickets, Verbrauchsgegenstände, Namensschilder, Trikots, Embleme, Kizuna-Dekorationen, Sticker), ein Trainingsladen (Spielerausrüstung, Spezialtaktiken, Synergien, Keshin- und weitere Techniken) und zwei Technikläden (Schüsse; Dribbling und Abwehr). Diese Waren verlassen die Läden des Spiels, Spielergeister und vorgefertigte Diamanten werden nicht mehr verkauft, und ein geleerter Laden verlässt den Markt. Neun Idole des ursprünglichen Inazuma Fantasy ersetzen die Idole des Spiels derselben Spieler."

[it.new]
mod_name = "Inazuma Fantasy"
mod_description = "Il Mercato si apre con quattro negozi propri, a prezzi in Punti passione (la Medaglia rara BB rinominata; la Stella della vittoria diventa Punti amicizia): un Negozio generale (biglietti, consumabili, targhe, divise, stemmi, decorazioni Kizuna, adesivi), un Negozio di allenamento (equipaggiamento dei giocatori, supertattiche, sinergie, supertecniche keshin e altre) e due negozi di supertecniche (tiri; dribbling e difesa). Questi articoli lasciano i negozi del gioco, gli spiriti dei giocatori e i Diamanti predefiniti non sono più in vendita, e un negozio rimasto vuoto lascia il Mercato. Nove Idoli dell'Inazuma Fantasy originale prendono il posto degli Idoli del gioco degli stessi giocatori."

[pt.new]
mod_name = "Inazuma Fantasy"
mod_description = "O Mercado abre com quatro lojas próprias, com preços em Pontos de paixão (a Medalha Rara da BB renomeada; a Estrela da vitória passa a Pontos de amizade): uma Loja geral (bilhetes, consumíveis, placas, equipamentos de equipa, emblemas, decorações Kizuna, autocolantes), uma Loja de treino (equipamento de jogador, supertáticas, sinergias, supertécnicas de keshin e outras) e duas lojas de supertécnicas (remates; drible e defesa). Esses artigos saem das lojas do jogo, os espíritos de jogador e os Diamantes pré-feitos deixam de ser vendidos, e uma loja que fica vazia sai do Mercado. Nove Ídolos do Inazuma Fantasy original substituem os Ídolos do jogo dos mesmos jogadores."

[ja.new]
mod_name = "Inazuma Fantasy"
mod_description = "マーケットの先頭に専用ショップが4つ登場。価格は情熱ポイント（ＢＢレアメダルを改名、勝利の星は友情ポイントに）です。「よろず屋」（チケット、消費アイテム、プレート、ユニフォーム、エンブレム、キズナの飾り、ステッカー）、「トレーニングショップ」（選手の装備、必殺タクティクス、シナジー、化身などの必殺技）、必殺技ショップ2つ（シュート／ドリブル・ディフェンス）。これらの商品はゲームのショップから移動し、選手のスピリットと既製のダイヤモンドは販売されなくなり、空になったショップはマーケットから消えます。元祖Inazuma Fantasyのアイドル9人が、同じ選手のゲーム内アイドルと入れ替わります。"

[zh_hans.new]
mod_name = "Inazuma Fantasy"
mod_description = "市场开头新增四家专属商店，以热情点数购买（BB稀有奖章改名，胜利之星改为友情点数）：“综合商店”（门票、消耗品、名牌、队服、队徽、羁绊装饰、贴纸）、“训练商店”（球员装备、必杀战术、协同、化身等必杀技）以及两家必杀技商店（射门；盘带与防守）。这些商品移出游戏的商店，球员灵魂与预设钻石不再出售，清空的商店从市场中移除。原版Inazuma Fantasy的9张偶像卡取代同一球员的游戏偶像卡。"

[zh_hant.new]
mod_name = "Inazuma Fantasy"
mod_description = "市場開頭新增四家專屬商店，以熱情點數購買（BB稀有勳章改名，勝利之星改為友情點數）：「綜合商店」（門票、消耗品、名牌、隊服、隊徽、羈絆裝飾、貼紙）、「訓練商店」（球員裝備、必殺戰術、協同、化身等必殺技）以及兩家必殺技商店（射門；盤帶與防守）。這些商品移出遊戲的商店，球員靈魂與預設鑽石不再出售，清空的商店從市場中移除。原版Inazuma Fantasy的9張偶像卡取代同一球員的遊戲偶像卡。"
