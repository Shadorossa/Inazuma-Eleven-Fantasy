# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Inazuma Fantasy"
version = "1.27.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Inazuma Fantasy. The Market has three shops of its own, priced in Passion Points (the BB Rare Medal renamed; the Victory Star becomes Friendship Points): a «General Store» with every ticket (Kizuna areas, stadiums), consumable, name plate, kit, team emblem (but the crests a Chronicle battle gives), Kizuna decoration, sticker and title the game's shops sell (the titles at their Chronicle collection costs); a «Training Shop» with every piece of player equipment, special tactic, synergy and keshin / miximax / soul move; and «Special Moves», one tab per move type (shot, dribble, block, catch). Those rows leave the game's shops, player spirits and premade Diamonds are no longer sold, and the game's Market shops, left empty, leave the Market, and every menu entry of them (Chronicle, Vs, Kizuna and other mode menus) opens the General Store; the story shops keep theirs. Every match also pays Friendship and Passion Points at its end (amounts in config.toml). Nine Idol cards of the earlier Inazuma Fantasy replace the game's Idol cards of the same players (same card ids). Every shop lists what it does not sell yet with a padlock and what unlocks it. The title screen shows the Inazuma Fantasy logo and its own press-start key art. Formations: the 16 eleven-a-side formations of Inazuma Eleven 3 that Victory Road lacks (Gemini, Epsilon, Genesis, Orpheus, Little Gigantes, Ogre, Chaos...) and the 10 five-a-side B- formations of GO Galaxy, with their original layouts made left / right symmetric; the 15 IE1-era formations Victory Road has by name only (Death Zone, Heaven's Gate, Phalanx...) get their real layouts. Better QoL's unlocked formations lists the eleven-a-side ones in the formation picker. «Partido libre» gets an «Inazuma Eleven Fantasy» section on its second page (L2 / R2) with four teams of the mod: Leyenda Viva, Llama Eterna, Punishment and Crossed Japan, at levels 50, 125 and 200."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-30"
prefix = "InazumaFantasy"
folder = "InazumaFantasy"
# A new mod (2026-10-14). The earlier Inazuma Fantasy (id inazuma_fantasy) is kept apart in research/mods/_aside/; this
# id is new so that its saved data, its grafts and the other mods' `if_mod = "inazuma_fantasy"` rows stay with it.
#   _general_store.toml                 the shops' rule (developer file, not installed)
#   content\shops\general_store.toml, training_shop.toml, technique_shop.toml
#                                       GENERATED (research/scripts/inazuma_fantasy_general_store.py): the three shops
#   content\shop_tabs\technique_shop.toml  GENERATED: its moves tab split per move type (VRFW [[VRFW.ShopTab]])
#   content\shops\moved_rows.toml       GENERATED: the retail rows they replace, hidden (story shops untouched)
#   content\shop_redirects\emptied_shops.toml  GENERATED: the emptied retail shops open the General Store (VRFW redirect)
#   content\menus\market_menu.toml      the Mercado's 3 bars (layer count)
#   assets\menu\150_shop\...\shop01_20.g4pkm   GENERATED: research/scripts/inazuma_fantasy_market_bar.py
#   text\rows\shop_text.toml            GENERATED: the bars' names and the split tabs' titles
#   content\items\currencies.toml       Puntos de amistad (tk_hr000008) / Puntos de pasión (tk_bb000001): retail items
#                                       renamed, the match rules that pay them (every match adds both at its end: the
#                                       amounts in config.toml [match_drops]); their icons in content\images\...\currencies*
#   content\characters\idols.toml       the Idol cards: each replaces a game Idol card of the same player (same card id);
#                                       Hidetoshi Nakata (no game Idol) is a new card, not obtainable yet
#   content\teams\byron_love_idol_fire_dragon.toml   Dragones de Fuego (IE3, tm_cro_ie3_0500 / _0520) fields
#                                       the Byron Love Idol card in Byron Love's slot
#   content\teams\crossed_japan.toml    «Crossed Japan» (key evt_ct_ft_crossed_japan): an Inazuma Japan squad on
#                                       game cards, from the earlier Inazuma Fantasy; listed by the free-match picker
#   content\techniques\idols.toml       their move whs00010_solo and their ability boards
#   content\items\idol_titles.toml      their titles
#   assets\menu\200_icon\10_icon_chr\face\c900001*_l.g4tx   their face icons
#   content\shop_locks\all_shops.toml  every shop lists its locked rows (VRFW shop locks); text\rows\shop_locks.toml
#   content\images\menu\50_title\title_art.toml   the title logo (press-start, mode menu, ending logo) and the
#                                       press-start key art, PNGs in title_art\; config.toml [VRFW.TitleArt] own = true
#   _tezcat_arion_miximax.toml         the Tezcat x Arion miximax rule (developer file, not installed); GENERATED from it
#                                       by research/scripts/inazuma_fantasy_tezcat_arion_build.py:
#   content\techniques\tezcat_arion_miximax.toml   Tezcat may use the miximax item «Arion» (wmm00210)
#   content\characters\tezcat_arion_miximax.toml   the look he takes (variant c90370080) and the same look as a player
#                                       of his own, «Tezcat (Mixi Max Arion)» (c90370081, at the Office on Tezcat's page);
#                                       tezcat_arion_miximax_reforged.toml: Character Reforged's values of Tezcat's card
#   content\models\characters\c90370080.toml + assets\models\characters\c90370080\   the head
#   content\models\characters\c90000146.toml + assets\models\characters\c90000146\   the Byron Love Idol head (red eyes, pale blond hair, toothy grin, angled brows)
#   assets\menu\200_icon\10_icon_chr\face\c9037008{0,1}_l.g4tx   their face icons
#   content\gacha\chronicle_deluxe_kizuna_coin.toml   «Tezcat (Mixi Max Arion)» in Chronicle Deluxe's board gacha (1.8.0;
#                                       nothing without Chronicle Deluxe); content\base_tables\gamedata\soccer\soccer_drop_config.toml:
#                                       his character in that gacha's drop-rate list (1.10.0, if_mod chronicle_deluxe)
#   content\formations\series_formations.toml   GENERATED (research/scripts/inazuma_fantasy_formations_build.py): the
#                                       IE3 / Galaxy formations Victory Road lacks and the real layouts of its 15 IE1-era
#                                       formations (names only in the game); every layout left / right symmetric (lone
#                                       centre players on the axis; only B- Left / Right Wing one-sided); a formation
#                                       within 0.1 field units of one the player can already pick (line by line, mirrored
#                                       too) is left out, the more iconic one kept (13 IE3 ones, e.g. F-Dark Emperors)
#                                       slots in the game's line order (keeper, back line, midfield, forwards), mirrored
#                                       pairs exact, menu cards (bustup_pos) in role rows; research/scripts/
#                                       formation_layout_check.py checks it and draws the menu layouts (--sheet)
# Graft (research/grafts): inazuma_fantasy_general_store (the Mercado entries, market_menu: its four shops first, a retail
# shop whose every row is hidden left out).
# lua_early: the graft is a merge-path patch of market_menu; early, the later wrappers of that script stay on top of it.
lua_early = true
