id = "inazuma_fantasy_2"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Inazuma Fantasy"
version = "1.4.6"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Inazuma Fantasy. The Market has three shops of its own, priced in Passion Points (the BB Rare Medal renamed; the Victory Star becomes Friendship Points): a «General Store» with every ticket (Kizuna areas, stadiums), consumable, name plate, kit, team emblem, Kizuna decoration, sticker and title the game's shops sell (the titles at their Chronicle collection costs); a «Training Shop» with every piece of player equipment, special tactic, synergy and keshin / miximax / soul move; and «Special Moves», one tab per move type (shot, dribble, block, catch). Those rows leave the game's shops, player spirits and premade Diamonds are no longer sold, and the game's Market shops, left empty, leave the Market, and every menu entry of them (Chronicle, Vs, Kizuna and other mode menus) opens the General Store; the story shops keep theirs. Every match also pays Friendship and Passion Points at its end (amounts in config.toml). Nine Idol cards of the earlier Inazuma Fantasy replace the game's Idol cards of the same players (same card ids). Every shop lists what it does not sell yet with a padlock and what unlocks it."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-19"
prefix = "InazumaFantasy"
folder = "InazumaFantasy"
# A new mod (2026-10-14). The earlier Inazuma Fantasy (id inazuma_fantasy) is kept apart in research/mods/_aside/; this
# id is new so that its saved data, its grafts and the other mods' `if_mod = "inazuma_fantasy"` rows stay with it.
#   _general_store.toml                 the shops' rule (developer file, not installed)
#   content\shops\general_store.toml, training_shop.toml, technique_shop.toml
#                                       GENERATED (research/scripts/inazuma_fantasy_general_store.py): the three shops
#   content\shop_tabs\technique_shop.toml  GENERATED: its moves tab split per move type (VRFW [[VRFW.ShopTab]])
#   content\shops\moved_rows.toml       GENERATED: the retail rows they replace, hidden (story shops untouched)
#   content\shop_redirects\emptied_shops.toml  GENERATED: the emptied retail shops open the General Store (VRFW redirect)
#   content\menus\market_menu.toml      the Mercado's 3 bars (layer count)
#   assets\menu\150_shop\...\shop01_20.g4pkm   GENERATED: research/scripts/inazuma_fantasy_market_bar.py
#   text\rows\shop_text.toml            GENERATED: the bars' names and the split tabs' titles
#   content\items\currencies.toml       Puntos de amistad (tk_hr000008) / Puntos de pasión (tk_bb000001): retail items
#                                       renamed, the match rules that pay them (every match adds both at its end: the
#                                       amounts in config.toml [match_drops]); their icons in content\images\...\currencies*
#   content\characters\idols.toml       the Idol cards: each replaces a game Idol card of the same player (same card id);
#                                       Hidetoshi Nakata (no game Idol) is a new card, not obtainable yet
#   content\techniques\idols.toml       their move whs00010_solo and their ability boards
#   content\items\idol_titles.toml      their titles
#   assets\menu\200_icon\10_icon_chr\face\c900001*_l.g4tx   their face icons
#   content\shop_locks\all_shops.toml  every shop lists its locked rows (VRFW shop locks); text\rows\shop_locks.toml
#   _tezcat_arion_miximax.toml         the Tezcat x Arion miximax rule (developer file, not installed); GENERATED from it
#                                       by research/scripts/inazuma_fantasy_tezcat_arion_build.py:
#   content\techniques\tezcat_arion_miximax.toml   Tezcat may use the miximax item «Arion» (wmm00210)
#   content\characters\tezcat_arion_miximax.toml   the look he takes (variant c90370080) and the same look as a player
#                                       of his own, «Tezcat (Mixi Max Arion)» (c90370081, at the Office on Tezcat's page);
#                                       tezcat_arion_miximax_reforged.toml: Character Reforged's values of Tezcat's card
#   content\models\characters\c90370080.toml + assets\models\characters\c90370080\   the head
#   assets\menu\200_icon\10_icon_chr\face\c9037008{0,1}_l.g4tx   their face icons
# Graft (research/grafts): inazuma_fantasy_general_store (the Mercado entries, market_menu: its four shops first, a retail
# shop whose every row is hidden left out).
# lua_early: the graft is a merge-path patch of market_menu; early, the later wrappers of that script stay on top of it.
lua_early = true
# 1.4.3 (vr_framework 2.4.147: [[VRFW.ShopRedirect]]): the emptied shops' menu entries open the General Store.
# 1.4.2 (vr_framework 2.4.146: [[VRFW.ShopTab]], [[edit]] hide_unknown_items): one move shop with a tab per move type;
# the titles in the General Store. 1.4.1 (vr_framework 2.4.141: [[edit]] hide_spirits): the player spirit rows hidden.
# 1.3.3 (vr_framework 2.4.133: [[VRFW.MatchDropExtra]]): every match pays Puntos de amistad / pasión at its end.
requires = ["vr_framework>=2.4.147"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = []

