# X when the board was opened without a team (story field, scout): no squad to choose from
[[row]]
id = "utilities.cp_no_team"
es = "Abre la tabla desde la plantilla de equipo para elegir compañeros."
en = "Open the board from the Team Dock to choose partners."
fr = "Ouvre le tableau depuis la Composition d'équipe pour choisir des partenaires."
de = "Öffne die Tafel über die Team-Bank, um Partner zu wählen."
