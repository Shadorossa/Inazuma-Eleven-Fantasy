de = "Wähle den Partner, der die Technik mit diesem Spieler ausführt."
it = "Scegli il compagno che esegue la tecnica con questo giocatore."
pt = "Escolhe o parceiro que executa a técnica com este jogador."
ja = "この選手と一緒に必殺技を使うパートナーを選んでください。"
zh_hans = "选择与该球员一起施展必杀技的搭档。"
zh_hant = "選擇與該球員一起施展必殺技的搭檔。"

