# Utilities: texts of «Configuración de pasivas» (research/grafts/passive_config, docs/game/mechanics/pasivas-configurables.md).
# Moved from Inazuma Fantasy on 2026-10-08 with the same ids: evt_pc_* (crc32 of the label) and the two retail rows
# the screen renames; utilities.pc_* are the former inazuma_fantasy.pc_* keys of IF's text\keys.toml (ids =
# crc32 of the new label, the Lua asks @crc:utilities.pc_…@). Format: docs/framework/types/text.md
# «Rows with fixed ids».
schema = "VRFW.text/2"
table = "menu_text"

# retail «Pasivas heredadas» (team dock setting type 9, the bank popup entry) renamed
[[row]]
id = 0xAD44E2A5
es = "Configuración de pasivas"
en = "Passive Settings"
fr = "Réglage des passifs"
de = "Passiv-Einstellungen"
it = "Impostazione passive"
pt = "Configurar Passivas"
ja = "パッシブ設定"
zh_hans = "被动技能设定"
zh_hant = "被動技能設定"

# its explanation (help line of the setting). Utilities alone follows the game's own slots; a mod with its own slot
# rules (Inazuma Fantasy: passive_config\slots.toml) replaces this row with its own explanation (text conflict WARN:
# the later mod wins)
[[row]]
id = 0x8EF137E5
es = "Elige las pasivas del jugador entre todas las del juego, en cualquiera de sus 5 espacios.\\nPuedes cambiar tantos espacios como permita el límite de pasivas configurables (3 por defecto);\\nlos demás conservan su pasiva. Para cambiar otro espacio con el límite lleno, quita una primero."
en = "Choose the player's passives from every passive in the game, in any of his 5 slots.\\nYou can change as many slots as the configurable passive limit allows (3 by default);\\nthe others keep their passive. To change another slot when the limit is full, remove one first."
fr = "Choisis les passifs du joueur parmi tous ceux du jeu, dans n'importe lequel de ses 5 emplacements.\\nTu peux en changer autant que le permet la limite de passifs configurables (3 par défaut) ;\\nles autres gardent leur passif. Limite atteinte : retire-en un avant d'en changer un autre."
de = "Wähle die Passive des Spielers aus allen Passiven des Spiels, auf jedem seiner 5 Plätze.\\nDu kannst so viele Plätze ändern, wie das Limit konfigurierbarer Passive erlaubt (standardmäßig 3);\\ndie übrigen behalten ihr Passiv. Ist das Limit voll, entferne zuerst eines."
it = "Scegli le passive del giocatore tra tutte quelle del gioco, in uno qualsiasi dei suoi 5 slot.\\nPuoi cambiare tanti slot quanti ne consente il limite di passive configurabili (3 di base);\\ngli altri mantengono la loro passiva. A limite pieno, rimuovine una prima di cambiarne un'altra."
pt = "Escolhe as Passivas do jogador entre todas as do jogo, em qualquer um dos seus 5 espaços.\\nPodes mudar tantos espaços quantos o limite de Passivas configuráveis permitir (3 por defeito);\\nos outros mantêm a sua Passiva. Com o limite cheio, retira uma antes de mudar outra."
ja = "ゲームの全パッシブから、選手の５つの枠のどれにでもパッシブを設定できる。\\n変更できる枠の数は設定可能パッシブ数の上限まで（初期値３）。他の枠は元のパッシブのまま。\\n上限に達したら、別の枠を変える前にどれかを外そう。"
zh_hans = "可从游戏的全部被动技能中为球员的5个栏位任意设定被动技能。\\n可更改的栏位数以可设定被动技能的上限为准（默认3个），其余栏位保留原有被动技能。\\n达到上限时，请先移除一个再更改其他栏位。"
zh_hant = "可從遊戲的全部被動技能中為選手的5個欄位任意設定被動技能。\\n可更改的欄位數以可設定被動技能的上限為準（預設3個），其餘欄位保留原有被動技能。\\n達到上限時，請先移除一個再更改其他欄位。"

