# shown once per session when the player has configured passives beyond [passives] max_slots (kept, not applied)
[[row]]
id = "utilities.pc_inactive"
es = "Este jugador tiene pasivas configuradas por encima del límite actual:\\nse conservan guardadas, pero no se aplican (sus espacios salen en gris)."
en = "This player has configured passives beyond the current limit:\\nthey are kept, but not applied (their slots are grey)."
fr = "Ce joueur a des passifs configurés au-delà de la limite actuelle :\\nils sont conservés, mais pas appliqués (leurs emplacements sont grisés)."
de = "Dieser Spieler hat konfigurierte Passive über dem aktuellen Limit:\\nsie bleiben gespeichert, werden aber nicht angewendet (ihre Plätze sind grau)."
it = "Questo giocatore ha passive configurate oltre il limite attuale:\\nrestano salvate, ma non vengono applicate (i loro slot sono grigi)."
pt = "Este jogador tem Passivas configuradas acima do limite atual:\\nficam guardadas, mas não são aplicadas (os seus espaços ficam cinzentos)."
ja = "この選手には現在の上限を超えて設定されたパッシブがある。\\n保存されたままだが適用されない（枠はグレー表示）。"
zh_hans = "该球员设定的被动技能超出了当前上限：\\n会保留，但不会生效（其栏位显示为灰色）。"
zh_hant = "該選手設定的被動技能超出了目前上限：\\n會保留，但不會生效（其欄位顯示為灰色）。"

# the configurator refuses another slot: [passives] max_slots slots are configured already (the game's own slots)
[[row]]
id = "utilities.pc_limit"
es = "Ya has cambiado el máximo de espacios de pasivas de este jugador.\\nQuita una pasiva configurada para poder cambiar otro espacio."
en = "You have already changed the maximum number of passive slots for this player.\\nRemove a configured passive to change another slot."
fr = "Tu as déjà changé le nombre maximum d'emplacements de passifs de ce joueur.\\nRetire un passif configuré pour en changer un autre."
de = "Du hast bei diesem Spieler bereits die maximale Anzahl an Passiv-Plätzen geändert.\\nEntferne ein konfiguriertes Passiv, um einen anderen Platz zu ändern."
it = "Hai già cambiato il numero massimo di slot delle passive di questo giocatore.\\nRimuovi una passiva configurata per cambiare un altro slot."
pt = "Já mudaste o número máximo de espaços de Passivas deste jogador.\\nRetira uma Passiva configurada para mudar outro espaço."
ja = "この選手のパッシブ枠はすでに上限まで変更している。\\n別の枠を変えるには、設定したパッシブをどれか外そう。"
zh_hans = "该球员已更改的被动技能栏位已达上限。\\n请先移除一个已设定的被动技能，再更改其他栏位。"
zh_hant = "該選手已更改的被動技能欄位已達上限。\\n請先移除一個已設定的被動技能，再更改其他欄位。"

# a row the configurable-slot limit keeps closed ([passives] max_slots: CMND_UTIL_PC_SLOT lock reason 2), as the
# player tries to change it (the card rules' own locks keep evt_pc_locked)
[[row]]
id = "utilities.pc_slot_closed"
es = "Este espacio está fuera del límite de pasivas configurables (max_slots en la configuración de Utilities).\nSube ese límite para poder cambiarlo; mientras tanto conserva su pasiva."
en = "This slot is beyond the configurable passive limit (max_slots in the Utilities settings).\nRaise that limit to change it; until then it keeps its passive."
fr = "Cet emplacement dépasse la limite de passifs configurables (max_slots dans les réglages d'Utilities).\nAugmente cette limite pour le changer ; en attendant, il garde son passif."
de = "Dieser Platz liegt über dem Limit konfigurierbarer Passive (max_slots in den Utilities-Einstellungen).\nErhöhe das Limit, um ihn zu ändern; bis dahin behält er sein Passiv."
it = "Questo slot è oltre il limite di passive configurabili (max_slots nelle impostazioni di Utilities).\nAlza quel limite per cambiarlo; nel frattempo mantiene la sua passiva."
pt = "Este espaço está fora do limite de Passivas configuráveis (max_slots nas definições do Utilities).\nAumenta esse limite para o mudar; até lá mantém a sua Passiva."
ja = "この枠は設定可能パッシブ数の上限外（Utilitiesの設定のmax_slots）。\n変更するには上限を上げよう。それまでは今のパッシブのまま。"
zh_hans = "该栏位超出了可设定被动技能的上限（Utilities设置中的max_slots）。\n提高该上限即可更改；在此之前保留其被动技能。"
zh_hant = "該欄位超出了可設定被動技能的上限（Utilities設定中的max_slots）。\n提高該上限即可更改；在此之前保留其被動技能。"
