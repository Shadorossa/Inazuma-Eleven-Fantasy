[pt.new]
mod_name = "Utilitários"
mod_description = "Ferramentas práticas para qualquer jogo salvo. Páginas do Clube: o Clube tem páginas de 11 times (10 páginas por padrão, ajustável em config.toml); R3 / N abre a lista de times e L2 / R2 (Q / E) mudam de página. Configurador de passivas: escolha quais passivas cada jogador tem (3 espaços por padrão, até 5 em config.toml); outros mods podem adicionar as suas próprias passivas à lista. Opções da câmera da partida. Uniforme Casa / Visitante: no seletor de uniforme, Y mostra a versão de visitante de qualquer uniforme e A salva-a. Ícone do elemento Neutro: os jogadores sem elemento e as técnicas Neutro mostram o ensō roxo onde quer que o jogo desenhe ícones de elemento. Estilo visual: o aspecto da imagem 3D (Original, IE3, Chrono Stone, Suave ou Contorno grosso) em Opções de mods, aplicado na hora e sem reiniciar. Formações desbloqueadas: as formações de 11 contra 11 que o jogo tem mas nunca oferece (as formações F- da série) podem ser escolhidas no seletor de formação. Parceiros de combos: no quadro de habilidades, X numa técnica combinada escolhe que colegas a executam com o jogador. Filtro de lojas: nos separadores de equipamento, kits, emblemas, técnicas e auras, Tab abre a janela de filtro de objetos do jogo e mostra só os artigos que coincidem. Carreira dos jogadores: a ficha do jogador tem uma página CARREIRA (Q / E) com a data de contratação, partidas, vitórias / empates / derrotas, gols, assistências, MVP, chutes, defesas e mais, contados em cada partida. Mapa de rotas da Crónica: mantém R2 (E) premido para mover o cursor do mapa ao dobro da velocidade (×2, ajustável em config.toml); o guia do mapa mostra «R2 Velocidade do cursor». Nomes originais por jogador: em Opções › Definições do jogo, «Nomes das personagens» ganha «Por equipa»; A na linha abre os emblemas das equipas de cada série (IE1 … Victory Road e as séries de outros mods, Q / E) e A numa equipa mostra as caras dos seus jogadores: a cinzento os que mantêm o nome da dobragem, a cores os que mostram o nome original; A muda um jogador, Y a equipa inteira. Comandos do Banco: ao escolher um jogador no Banco do Clube abre-se uma lista de comandos com Quadro de técnicas, Equipamento e Configurar Passivas desse jogador, Retirada rápida (retira-o e salva o jogo) e as linhas de equipamento do jogo. Planeador de equipa: numa equipa do Plantel, A num lugar vazio oferece «Adicionar do banco» ou «Planear equipa»: escolhe qualquer personagem do jogo ou dos mods; aparece como carta fantasma semitransparente nesse lugar até o conseguires, e depois a carta dele ocupa o lugar sozinha. Uma equipa com fantasmas não pode ser a equipa ativa. Sem limite de Ídolos e Diamantes: uma equipa pode alinhar quantas cartas Ídolo e Diamante quiseres (o jogo permite 2 Ídolos e 1 Diamante). Atalhos da barra superior: ícones à direita da barra superior dos menus levam direto aos modos do jogo (Competição, Baía Batalha com um menu suspenso de Campanha, 1v1 e Online, Crônica - direto ao mapa de rotas -, Meu Time, Mercado); mouse ou R3 (R3 mantido no mapa de rotas da Crônica, onde a barra também aparece); outros mods adicionam os seus próprios ícones. Modo Comandante automático: uma linha de opções faz começar no Modo Comandante as partidas da Battle Bay, e as partidas livres e batalhas Heroicas contra rivais já vencidos. Prévia de supertécnicas: no cartão de uma supertécnica da lista, RS (P) reproduz a animação com um jogador do teu elenco ativo e volta à lista como estava."

