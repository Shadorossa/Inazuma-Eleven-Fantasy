[ja.new]
mod_name = "ユーティリティ"
mod_description = "どのセーブデータでも使える便利機能。チームドックのページ：チームドックに11チームずつのページを追加します（標準10ページ、config.tomlで変更可）。R3 / N でチーム一覧を開き、L2 / R2（Q / E）でページをめくります。パッシブ設定：各選手が持つパッシブを選べます（標準3枠、config.tomlで最大5枠）。他のMODも独自のパッシブを一覧に追加できます。試合カメラのオプション。ホーム / アウェイのユニフォーム：ユニフォーム選択で Y を押すとどのユニフォームでもアウェイ版を表示し、A で保存します。無属性アイコン：属性のない選手と無属性の技は、ゲームが属性アイコンを描くすべての場所で紫の円相を表示します。映像スタイル：3D映像の見た目（オリジナル、IE3、クロノ・ストーン、ソフト、太い輪郭線）を「MODオプション」で、再起動なしですぐに変更できます。フォーメーションの解放：ゲームに含まれているのに選べない11人制フォーメーション（シリーズのF-フォーメーション）を、フォーメーション選択で選べるようにします。連携技のパートナー：スキルボードで連携技にXを押すと、一緒に使う味方を選べます。ショップの絞り込み：装備品・ユニフォーム・エンブレム・必殺技・オーラのタブでTabを押すと、ゲームのアイテム絞り込み画面が開き、条件に合う商品だけを表示します。選手の経歴：選手プレートに「経歴」ページ（Q / E）が加わり、加入日・試合数・勝敗・ゴール・アシスト・MVP・シュート・セーブなどを毎試合記録します。クロニクルのルートマップ：R2（E）を押している間、マップのカーソルが2倍速で動きます（×2、config.tomlで設定）。マップのボタンガイドに「R2 カーソル速度」を表示します。 チームごとのオリジナル名：オプション › ゲーム設定の「キャラクターの名前」に「チームごと」を追加。行でAを押すとシリーズごとのチームエンブレム（IE1 … ヴィクトリーロード、他のMODのシリーズ、Q／E）が開き、チームでAを押すと選手の顔が並びます。灰色は吹き替えの名前、カラーはオリジナルの名前で表示されます。Aで選手ごと、Yでチーム全員を切り替えます。 バンクのコマンド：チームドックのバンクで選手を選ぶと、その選手のスキルボード・装備・パッシブ設定、クイック引退（引退させてセーブ）とゲームの装備コマンドを含むコマンド一覧が開きます。チームプランナー：チーム編成の空き枠でAを押すと「バンクから追加」か「チームを計画」を選べます。ゲームやMODのどのキャラクターでも選べ、手に入れるまで半透明のゴーストカードとしてその枠に表示され、手に入れるとそのカードが自動で枠に入ります。ゴーストのいるチームはアクティブにできません。 アイドル・ダイヤモンドの上限なし：チームにアイドルとダイヤモンドのカードを何枚でも編成できます（ゲームでは2枚と1枚まで）。上部バーのショートカット：メニュー上部バーの右側のアイコンからゲームモードへ直接移動できます（対戦、キャンペーン・1v1・オンラインのドロップダウン付きのBBスタジアム、クロニクル（ルートマップへ直接）、マイチーム、マーケット）。マウスまたは R3（クロニクルのルートマップではバーも表示され、R3長押しで操作）。他のMODも独自のアイコンを追加できます。監督AIモードで開始：オプションの項目で、バトルベイの試合と、すでに勝った相手とのフリーマッチ・ヒロイックバトルを監督AIモードで始められます。 必殺技プレビュー：必殺技リストのカードでRS（P）を押すと、出場チームの選手がその必殺技の演出を再生し、終わるとリストに元のまま戻ります。"

