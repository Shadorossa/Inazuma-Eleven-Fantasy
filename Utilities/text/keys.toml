[fr.new]
mod_name = "Utilitaires"
mod_description = "Outils pratiques pour n'importe quelle partie. Pages de Composition d'équipe : la Composition d'équipe a des pages de 11 équipes (10 pages par défaut, réglable dans config.toml) ; R3 / N ouvre la liste des équipes et L2 / R2 (Q / E) changent de page. Configurateur de passifs : choisissez les passifs de chaque joueur (3 emplacements par défaut, jusqu'à 5 dans config.toml) ; d'autres mods peuvent ajouter leurs propres passifs à la liste. Options de la caméra de match. Maillot Domicile / Extérieur : dans le sélecteur de maillot, Y affiche la version extérieur de n'importe quel maillot et A l'enregistre. Icône de l'élément Néant : les joueurs sans élément et les techniques Néant affichent l'ensō violet partout où le jeu dessine des icônes d'élément. Style visuel : l'aspect de l'image 3D (Original, IE3, Chrono Stone, Doux ou Contour épais) dans Options des mods, appliqué aussitôt sans redémarrer. Formations débloquées : les formations à 11 que le jeu contient mais ne propose jamais (les formations F- de la série) peuvent être choisies dans le sélecteur de formation. Partenaires de combo : sur le tableau de compétences, X sur une technique combinée choisit les coéquipiers qui l'exécutent avec le joueur. Filtre de boutique : dans les onglets d'équipement, de tenues, d'emblèmes, de techniques et d'auras, Tab ouvre la fenêtre de filtre d'objets du jeu et n'affiche que les articles correspondants. Parcours des joueurs : la fiche du joueur a une page PARCOURS (Q / E) avec la date de recrutement, les matchs, victoires / nuls / défaites, buts, passes décisives, MVP, tirs, arrêts et plus, comptés à chaque match. Carte des routes de la Chronique : maintenez R2 (E) pour déplacer le curseur de la carte deux fois plus vite (×2, réglable dans config.toml) ; le guide de la carte affiche « R2 Vitesse du curseur ». Noms originaux par joueur : dans Options › Paramètres du jeu, «Noms des personnages» a la valeur «Par équipe» ; A sur la ligne ouvre les écussons des équipes de chaque série (IE1 … Victory Road et les séries d'autres mods, Q / E), et A sur une équipe montre les visages de ses joueurs : en gris ceux qui gardent le nom du doublage, en couleur ceux qui affichent leur nom original ; A change un joueur, Y toute l'équipe. Commandes de la Banque : choisir un joueur dans la Banque de la Composition d'équipe ouvre une liste de commandes avec Tableau de techniques, Équipement et Réglage des passifs de ce joueur, Retrait rapide (le retire et sauvegarde) et les lignes d'équipement du jeu. Planificateur d'équipe : dans une équipe de l'Effectif, A sur une place vide propose «Ajouter depuis la banque» ou «Planifier l'équipe» : choisissez n'importe quel personnage du jeu ou des mods ; il apparaît comme carte fantôme semi-transparente à cette place jusqu'à ce que vous l'obteniez, puis sa carte prend la place toute seule. Une équipe avec des fantômes ne peut pas être l'équipe active. Plus de limite d'Idoles ni de Diamants : une équipe peut aligner autant de cartes Idole et Diamant que vous voulez (le jeu en permet 2 et 1). Raccourcis de la barre du haut : des icônes à droite de la barre du haut des menus mènent directement aux modes du jeu (Compétition, Baie Bataille avec un menu déroulant Campagne, 1v1 et En ligne, Chronique - directement sur la carte des routes -, Mon équipe, Marché) ; souris ou R3 (R3 maintenu sur la carte des routes de la Chronique, où la barre s'affiche aussi) ; d'autres mods ajoutent leurs propres icônes. Mode commandement automatique : une ligne d'options fait commencer en Mode commandement les matchs de Battle Bay, et les matchs libres et combats Héroïques contre des adversaires déjà battus. Aperçu des supertechniques : sur la carte d'une supertechnique de la liste, RS (P) joue son animation avec un joueur de ton effectif actif, puis revient à la liste telle quelle."

