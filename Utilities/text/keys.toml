[es.new]
mod_name = "Utilidades"
mod_description = "Herramientas para cualquier partida. Páginas de plantillas: la Plantilla de equipo tiene páginas de 11 equipos (10 páginas por defecto, ajustable en config.toml); R3 / N abre la lista de equipos y L2 / R2 (Q / E) pasan de página. Configurador de pasivas: elige qué pasivas tiene cada jugador (3 huecos por defecto, hasta 5 en config.toml); otros mods pueden añadir sus propias pasivas a la lista. Opciones de la cámara del partido. Equipación Local / Visitante: en el selector de equipación, Y muestra la versión de visitante de cualquier kit y A la guarda. Icono de elemento Neutro: los jugadores sin elemento y las técnicas de elemento Neutro muestran el ensō morado allí donde el juego dibuja iconos de elemento. Estilo visual: el aspecto de la imagen 3D (Original del juego, IE3, Chrono Stone, Suave o Trazado grueso) en Opciones de mods, al momento y sin reiniciar. Formaciones desbloqueadas: las formaciones 11 contra 11 que el juego tiene pero nunca ofrece (las F- de la saga) se pueden elegir en el selector de formación. Compañeros de combos: en la tabla de habilidades, X sobre una supertécnica combinada elige qué compañeros la realizan con el jugador. Filtro de tienda: en las pestañas de equipamiento, equipaciones, emblemas, supertécnicas y auras, Tab abre la ventana de filtro de objetos del juego y deja solo los productos que coinciden. Trayectoria de los jugadores: la ficha del jugador tiene una página TRAYECTORIA (Q / E) con la fecha de fichaje, partidos, victorias / empates / derrotas, goles, asistencias, MVP, tiros, paradas y más, contados en cada partido. Mapa de rutas de la Crónica: mantén R2 (E) para mover el cursor del mapa al doble de velocidad (×2, ajustable en config.toml); la guía del mapa muestra «R2 Velocidad del cursor». Nombres originales por jugador: en Opciones › Ajustes del juego, «Nombres de los personajes» tiene «Por equipos»; A en la fila abre los escudos de los equipos de cada serie (IE1 … Victory Road y las series de otros mods, Q / E) y A en un equipo muestra las caras de sus jugadores: en gris los que mantienen el nombre del doblaje, en color los que muestran su nombre original; A cambia un jugador, Y todo el equipo. Comandos del Banco: al elegir un jugador en el Banco de la Plantilla de equipo se abre una lista de comandos con Tabla de habilidades, Equipamiento y Configuración de pasivas de ese jugador, Retiro rápido (lo retira y guarda la partida) y las filas de equipamiento del juego. Planificador de equipo: en una plantilla de la Plantilla de equipo, A en un hueco vacío ofrece «Añadir del banco» o «Planificar equipo»: elige cualquier personaje del juego o de los mods y aparece como carta fantasma semitransparente en ese hueco hasta que lo consigas; entonces su carta ocupa el hueco sola. Una plantilla con fantasmas no puede ser el equipo activo. Sin límite de Ídolos ni Diamantes: un equipo puede alinear cualquier número de cartas Ídolo y Diamante (el juego permite 2 Ídolos y 1 Diamante). Atajos de la barra superior: iconos a la derecha de la barra superior de los menús que llevan directo a los modos del juego (Competición, Bahía Batalla con un desplegable de Campaña, 1v1 y Online, Crónica - directo al mapa de rutas -, Mi equipo, Mercado); ratón o R3 (R3 mantenido en el mapa de rutas de la Crónica, donde la barra también aparece); otros mods añaden sus propios iconos. Modo Comandante automático: una fila de opciones hace empezar en Modo Comandante los partidos de Battle Bay, y los partidos libres y batallas Heroicas contra rivales ya vencidos. Vista previa de supertécnicas: en la tarjeta de una supertécnica de la lista «Supertécnicas», RS (P) reproduce su animación con un jugador de tu plantilla activa y vuelve a la lista tal como estaba."

