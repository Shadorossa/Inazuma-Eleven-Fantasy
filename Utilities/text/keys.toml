[de.new]
mod_name = "Werkzeuge"
mod_description = "Komfortwerkzeuge für jeden Spielstand. Team-Bank-Seiten: Die Team-Bank erhält Seiten mit je 11 Teams (standardmäßig 10 Seiten, einstellbar in config.toml); R3 / N öffnet die Teamliste, L2 / R2 (Q / E) blättern. Passiv-Konfigurator: Wähle, welche Passivfähigkeiten jeder Spieler hat (standardmäßig 3 Plätze, bis zu 5 in config.toml); andere Mods können eigene Passivfähigkeiten zur Liste hinzufügen. Optionen der Spielkamera. Heim- / Auswärtstrikot: In der Trikotauswahl zeigt Y die Auswärtsversion jedes Trikots, A speichert sie. Symbol für das Element Neutral: Spieler ohne Element und Techniken des Elements Neutral zeigen das violette Ensō überall, wo das Spiel Elementsymbole zeichnet. Grafikstil: das Aussehen des 3D-Bildes (Original, IE3, Chrono Stone, Sanft oder Dicke Kontur) in den Mod-Optionen, sofort und ohne Neustart. Freigeschaltete Formationen: Die 11-gegen-11-Formationen, die das Spiel enthält, aber nie anbietet (die F-Formationen der Reihe), sind in der Formationsauswahl wählbar. Kombi-Partner: Auf der Fähigkeitentafel wählt X bei einer Kombi-Technik, welche Mitspieler sie mit dem Spieler ausführen. Ladenfilter: In den Laden-Reitern für Ausrüstung, Trikots, Embleme, Techniken und Auren öffnet Tab das Objektfilter-Fenster des Spiels und zeigt nur passende Waren. Spielerlaufbahn: Die Spielerkarte erhält eine Seite LAUFBAHN (Q / E) mit Verpflichtungsdatum, Spielen, Siegen / Unentschieden / Niederlagen, Toren, Vorlagen, MVP, Schüssen, Paraden und mehr, in jedem Spiel gezählt. Routenkarte der Chronik: R2 (E) gedrückt halten bewegt den Kartencursor doppelt so schnell (×2, einstellbar in config.toml); die Tastenhilfe der Karte zeigt «R2 Cursor-Tempo». Originalnamen pro Spieler: In Optionen › Spieleinstellungen erhält «Charakternamen» den Wert «Nach Team»; A auf der Zeile öffnet die Teamwappen jeder Serie (IE1 … Victory Road und Serien anderer Mods, Q / E), A auf einem Team zeigt die Gesichter seiner Spieler: grau behalten den Namen der Synchronisation, farbig zeigen ihren Originalnamen; A wechselt einen Spieler, Y das ganze Team. Bank-Befehle: Wählst du in der Bank der Team-Bank einen Spieler, öffnet sich eine Befehlsliste mit Technikbrett, Ausrüstung und Passiv-Einstellungen dieses Spielers, Schnellentlassung (entlässt ihn und speichert) und den Ausrüstungszeilen des Spiels. Teamplaner: In einem Team der Teamaufstellung bietet A auf einem leeren Platz «Aus der Bank hinzufügen» oder «Team planen»: Wähle eine beliebige Figur des Spiels oder der Mods; sie erscheint als halbtransparente Geisterkarte auf diesem Platz, bis du sie bekommst, dann nimmt ihre Karte den Platz von selbst ein. Ein Team mit Geistern kann nicht das aktive Team sein. Keine Idol- / Diamant-Grenze: Ein Team kann beliebig viele Idol- und Diamant-Karten aufstellen (das Spiel erlaubt 2 Idole und 1 Diamanten). Kurzbefehle der oberen Leiste: Symbole rechts in der oberen Menüleiste führen direkt zu den Spielmodi (Wettbewerb, Kampfbucht mit einem Aufklappmenü Kampagne, 1v1 und Online, Chronik - direkt auf die Routenkarte -, Mein Team, Markt); Maus oder R3 (R3 gedrückt halten auf der Routenkarte der Chronik, wo die Leiste ebenfalls erscheint); andere Mods fügen eigene Symbole hinzu. Commander-Modus automatisch: Eine Optionszeile startet Battle-Bay-Spiele sowie freie Spiele und Heroische Kämpfe gegen besiegte Gegner im Commander-Modus. Spezialtechnik-Vorschau: Auf der Karte einer Spezialtechnik in der Liste spielt RS (P) ihre Animation mit einem Spieler deines aktiven Kaders ab und kehrt dann unverändert zur Liste zurück."

