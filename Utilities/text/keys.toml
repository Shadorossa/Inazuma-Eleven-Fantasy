[zh_hant.new]
mod_name = "實用工具"
mod_description = "適用於任何存檔的便利工具。編組隊伍分頁：編組隊伍增加每頁11支隊伍的分頁（預設10頁，可在config.toml中調整）；R3 / N 開啟隊伍列表，L2 / R2（Q / E）翻頁。被動技能配置：選擇每名球員擁有的被動技能（預設3個欄位，config.toml中最多5個）；其他模組可以向列表中加入自己的被動技能。比賽鏡頭選項。主場 / 客場球衣：在球衣選擇中，按 Y 顯示任何球衣的客場版本，按 A 儲存。無屬性圖示：沒有屬性的球員和無屬性技能，在遊戲繪製屬性圖示的所有地方顯示紫色的圓相。畫面風格：在「模組選項」中更改3D畫面的外觀（原版、IE3、時空之石、柔和或粗輪廓線），立即生效，無需重新啟動。解鎖陣型：遊戲中存在卻從不提供的11人制陣型（系列的F-陣型）可以在陣型選擇中選用。合體技搭檔：在技能盤上對合體技按X，可選擇與該球員一起施展的隊友。商店篩選：在裝備、球衣、徽章、招式和氣場的商店分頁中按Tab，開啟遊戲的道具篩選視窗，只顯示符合條件的商品。球員生涯：球員資料新增「生涯」頁面（Q / E），記錄加入日期、比賽、勝/平/負、進球、助攻、MVP、射門、撲救等，每場比賽都會統計。編年史路線地圖：按住 R2（E）可讓地圖游標以兩倍速度移動（×2，可在 config.toml 中設定）；地圖的按鍵提示顯示「R2 游標速度」。 按球員顯示原名：在選項 › 遊戲設定的「角色名稱」中新增「按隊伍」；在該行按A開啟各系列的隊徽（IE1 … 勝利之路及其他MOD的系列，Q／E），在隊伍上按A顯示其球員頭像：灰色保留配音版名字，彩色顯示原名；A切換單個球員，Y切換整支隊伍。 倉庫指令：在編組隊伍的倉庫中選擇球員時，會開啟指令列表：該球員的技能表、裝備、被動技能設定，快速退役（讓其退役並存檔）以及遊戲原有的裝備指令。隊伍規劃：在隊伍編成的空位上按A，可選擇「從倉庫新增」或「規劃隊伍」：選擇遊戲或模組中的任意角色，在獲得他之前，他會以半透明的幽靈卡顯示在該位置；獲得後他的卡會自動佔據該位置。有幽靈卡的隊伍不能設為出戰隊伍。 偶像、鑽石無上限：隊伍可以編入任意數量的偶像卡和鑽石卡（遊戲原本只允許2張偶像、1張鑽石）。頂部欄捷徑：選單頂部欄右側的圖示可直接前往遊戲模式（對戰、帶有戰役 / 1v1 / 線上下拉選單的BB體育場、編年史（直接進入路線地圖）、我的隊伍、市場）；滑鼠或 R3（編年史路線地圖上也會顯示該欄，長按 R3 進入）；其他模組可加入自己的圖示。自動指揮官模式：選項中的一行可讓Battle Bay的比賽，以及對已擊敗對手的自由比賽和英雄戰，以指揮官模式開始。 必殺技預覽：在必殺技列表的卡片上按RS（P），由目前陣容的球員播放該必殺技的演出，結束後原樣回到列表。"

