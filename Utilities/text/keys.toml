[zh_hans.new]
mod_name = "实用工具"
mod_description = "适用于任何存档的便利工具。编组队伍分页：编组队伍增加每页11支队伍的分页（默认10页，可在config.toml中调整）；R3 / N 打开队伍列表，L2 / R2（Q / E）翻页。被动技能配置：选择每名球员拥有的被动技能（默认3个栏位，config.toml中最多5个）；其他模组可以向列表中添加自己的被动技能。比赛镜头选项。主场 / 客场球衣：在球衣选择中，按 Y 显示任意球衣的客场版本，按 A 保存。无属性图标：没有属性的球员和无属性技能，在游戏绘制属性图标的所有地方显示紫色的圆相。画面风格：在“模组选项”中更改3D画面的外观（原版、IE3、时空之石、柔和或粗轮廓线），立即生效，无需重启。解锁阵型：游戏中存在却从不提供的11人制阵型（系列的F-阵型）可以在阵型选择中选用。合体技搭档：在技能盘上对合体技按X，可选择与该球员一起施展的队友。商店筛选：在装备、球衣、徽章、招式和气场的商店分页中按Tab，打开游戏的道具筛选窗口，只显示符合条件的商品。球员生涯：球员资料新增“生涯”页面（Q / E），记录加入日期、比赛、胜/平/负、进球、助攻、MVP、射门、扑救等，每场比赛都会统计。编年史路线地图：按住 R2（E）可让地图光标以两倍速度移动（×2，可在 config.toml 中设置）；地图的按键提示显示「R2 光标速度」。 按球员显示原名：在选项 › 游戏设置的「角色名称」中新增「按队伍」；在该行按A打开各系列的队徽（IE1 … 胜利之路及其他MOD的系列，Q／E），在队伍上按A显示其球员头像：灰色保留配音版名字，彩色显示原名；A切换单个球员，Y切换整支队伍。 仓库指令：在编组队伍的仓库中选择球员时，会打开指令列表：该球员的技能表、装备、被动技能设定，快速退役（让其退役并存档）以及游戏原有的装备指令。队伍规划：在队伍编成的空位上按A，可选择「从仓库添加」或「规划队伍」：选择游戏或模组中的任意角色，在获得他之前，他会以半透明的幽灵卡显示在该位置；获得后他的卡会自动占据该位置。有幽灵卡的队伍不能设为出战队伍。 偶像、钻石无上限：队伍可以编入任意数量的偶像卡和钻石卡（游戏原本只允许2张偶像、1张钻石）。顶部栏快捷方式：菜单顶部栏右侧的图标可直接前往游戏模式（对战、带有战役 / 1v1 / 在线下拉菜单的BB体育场、编年史（直接进入路线地图）、我的队伍、市场）；鼠标或 R3（编年史路线地图上也会显示该栏，长按 R3 进入）；其他模组可添加自己的图标。自动指挥官模式：选项中的一行可让Battle Bay的比赛，以及对已击败对手的自由比赛和英雄战，以指挥官模式开始。 必杀技预览：在必杀技列表的卡片上按RS（P），由当前阵容的球员播放该必杀技的演出，结束后原样回到列表。"

