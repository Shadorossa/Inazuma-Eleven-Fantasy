schema = "VRFW.text_key/1"
# Texts of Utilities (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("utilities.<name>"). «Estilo visual» (feature visual_style): the row utilities.visual_style of «Opciones de
# mods» (options.toml) and its values (they were the mod visual_presets' «preset*» texts until 2026-10-08).
# Original names (feature original_names): names_by_team = the middle value «Por equipos» of the game's «Nombres de
# los personajes» row; names_picker_* = its picker (title, the page line «<L2> ‹ series  chosen/players › <R2>» with
# the framework bank filter's key glyphs); names_teams_hint = the keys of the team emblem grid; names_grid_info /
# names_grid_hint = the player grid's guide box («team  chosen/players  ·  dub → original», the keys).
# Team planner (feature team_planner): tp_add_bank / tp_plan / tp_unplan = the rows of the menu on an empty squad
# slot; tp_picker_* / tp_teams_hint / tp_grid_info / tp_owned / tp_not_owned = the picker; tp_refuse_active /
# tp_refuse_leave / tp_assigned = the dock's messages (docs/game/ui/team-planner.md).
# A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Utilities"
mod_description = "Quality-of-life tools for any save. Team Dock pages: the Team Dock gets pages of 11 squads (10 pages by default, set in config.toml); R3 / N opens the squad list, L2 / R2 (Q / E) turn the pages. Passive configurator: choose which passives each player has (3 slots by default, up to 5 in config.toml); other mods can add their own passives to the list. Match camera options. Home / Away kit: in the kit picker, Y shows the away version of any kit and A saves it. Void element icon: players without an element and Void moves show the purple ensō wherever the game draws element icons. Visual style: the look of the 3D image (Original, IE3, Chrono Stone, Soft or Thick outline) in Mod options, applied at once without restarting. Unlocked formations: the 11-a-side formations the game has but never offers (the series' F- formations) can be chosen in the formation picker. Combo partners: on the skill board, X on a combo move chooses which teammates perform it with the player. Shop filter: in the shop tabs of equipment, kits, emblems, moves and auras, Tab opens the game's item filter window and shows only the goods that match. Player career stats: the player plate gets a CAREER page (Q / E) with the signing date, matches, wins / draws / losses, goals, assists, MVP awards, shots, saves and more, counted from every match. Chronicle route map: hold R2 (E) to move the map cursor twice as fast (×2, set in config.toml); the map's guide shows «R2 Cursor speed». Original names by player: in Settings › Game settings, «Character names» gets «By team»; A on the row opens the team emblems of each series (IE1 … Victory Road and mods' series, Q / E), and A on a team shows its players' faces: grey ones keep their dub name, coloured ones show their original name; A switches a player, Y the whole team. Bank commands: choosing a player in the Team Dock's Bank opens a command list with Skill board, Equipment and Passive settings for that player, Quick retire (retires him and saves) and the game's equipment rows. Team planner: in a Team Dock squad, A on an empty slot offers «Add from the bank» or «Plan team»: pick any character of the game or the mods and he shows as a semi-transparent ghost card in that slot until you get him; then his card takes the slot by itself. A squad with ghosts cannot be the active squad. No Hero / Diamond limits: a squad can field any number of Hero and Diamond cards (the game allows 2 Heroes and 1 Diamond). Top bar shortcuts: icons on the right of the menus' top bar go straight to the game's modes (Competition, Battle Bay with a dropdown of Campaign, 1v1 and Online, Chronicle - straight onto the route map -, My Team, Market); mouse or R3 (held R3 on the Chronicle route map, where the bar shows too); other mods add their own icons. Auto Commander Mode: an option row starts Battle Bay matches in Commander Mode, and free matches and Heroic battles against beaten rivals. Technique preview: on a special move card of the «Supertécnicas» list, RS (P) plays the move's cut-in with a player of your active squad, then the list is back as it was."

