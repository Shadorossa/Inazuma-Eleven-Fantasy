[it.new]
mod_name = "Utilità"
mod_description = "Strumenti utili per qualsiasi partita salvata. Pagine dello Slot Squadra: lo Slot Squadra ha pagine da 11 squadre (10 pagine di base, regolabile in config.toml); R3 / N apre l'elenco delle squadre e L2 / R2 (Q / E) cambiano pagina. Configuratore di abilità passive: scegli quali abilità passive ha ogni giocatore (3 spazi di base, fino a 5 in config.toml); altre mod possono aggiungere le proprie abilità passive all'elenco. Opzioni della telecamera della partita. Divisa Casa / Trasferta: nel selettore della divisa, Y mostra la versione da trasferta di qualsiasi divisa e A la salva. Icona dell'elemento Neutro: i giocatori senza elemento e le tecniche Neutro mostrano l'ensō viola ovunque il gioco disegni icone di elemento. Stile visivo: l'aspetto dell'immagine 3D (Originale, IE3, Chrono Stone, Morbido o Contorno spesso) in Opzioni delle mod, applicato subito senza riavviare. Formazioni sbloccate: le formazioni a 11 che il gioco contiene ma non offre mai (le formazioni F- della serie) si possono scegliere nel selettore di formazione. Compagni delle combo: nella tabella abilità, X su una tecnica combinata sceglie quali compagni la eseguono con il giocatore. Filtro dei negozi: nelle schede di equipaggiamento, divise, emblemi, tecniche e aure, Tab apre la finestra filtro oggetti del gioco e mostra solo gli articoli corrispondenti. Carriera dei giocatori: la scheda del giocatore ha una pagina CARRIERA (Q / E) con data d'ingaggio, partite, vittorie / pareggi / sconfitte, gol, assist, MVP, tiri, parate e altro, contati in ogni partita. Mappa dei percorsi della Cronaca: tieni premuto R2 (E) per muovere il cursore della mappa al doppio della velocità (×2, regolabile in config.toml); la guida della mappa mostra «R2 Velocità del cursore». Nomi originali per giocatore: in Opzioni › Impostazioni di gioco, «Nomi dei personaggi» ha il valore «Per squadra»; A sulla riga apre gli stemmi delle squadre di ogni serie (IE1 … Victory Road e le serie di altre mod, Q / E) e A su una squadra mostra i volti dei suoi giocatori: in grigio quelli che tengono il nome del doppiaggio, a colori quelli che mostrano il nome originale; A cambia un giocatore, Y tutta la squadra. Comandi della Banca: scegliendo un giocatore nella Banca dello Slot Squadra si apre un elenco di comandi con Tabella abilità, Equipaggiamento e Impostazione passive di quel giocatore, Ritiro rapido (lo ritira e salva) e le righe dell'equipaggiamento del gioco. Pianificatore di squadra: in una squadra della Rosa, A su un posto vuoto offre «Aggiungi dalla banca» o «Pianifica squadra»: scegli qualsiasi personaggio del gioco o delle mod; appare come carta fantasma semitrasparente in quel posto finché non lo ottieni, poi la sua carta prende il posto da sola. Una squadra con fantasmi non può essere la squadra attiva. Nessun limite di Idoli e Diamanti: una squadra può schierare quante carte Idolo e Diamante vuoi (il gioco ne permette 2 e 1). Scorciatoie della barra superiore: icone a destra della barra superiore dei menu che portano direttamente alle modalità di gioco (Competizione, Baia Battaglia con un menu a tendina Campagna, 1v1 e Online, Cronaca - direttamente sulla mappa dei percorsi -, La mia squadra, Mercato); mouse o R3 (R3 tenuto premuto sulla mappa dei percorsi della Cronaca, dove la barra appare anche); altre mod aggiungono le proprie icone. Modalità Comandante automatica: una riga delle opzioni fa iniziare in Modalità Comandante le partite della Battle Bay, e le partite libere e battaglie Eroiche contro avversari già battuti. Anteprima supertecniche: sulla carta di una supertecnica della lista, RS (P) riproduce la sua animazione con un giocatore della tua rosa attiva e poi torna alla lista com'era."

