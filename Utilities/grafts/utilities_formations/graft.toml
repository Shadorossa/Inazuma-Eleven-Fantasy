# Unlocked formations of the mod Utilities (feature formations, docs/game/characters/uvr-removal.md §7-§8,
# docs/release/utilities.md): the formation picker's list (main-chunk local t6 of the INCLUDE'd
# soccer_formation_menu_inc, also held by l2: the formations the game offers) gets the 11-a-side formations the game
# has but never offers appended IN PLACE, once per menu VM, the first time the picker runs one of its list functions.
# The ids come from the plugin (CMND_UTIL_FORMATION, derived from the loaded formation_config / item_config /
# item_text: no id list here); utilities.dll also raises the native row count by the same number. Without the plugin
# the list stays the game's. Replaces Inazuma Fantasy's graft uvr_formations (UVR's hard-coded 54 ids, 2026-10-08).
# Built into the mod: menu_assemble.py build --mod utilities.
name = "utilities_formations"
mod = "utilities"
order = 150
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInitFormationCommon", "UpdateListItem", "OnMoveListItem"]
description = "formations: the game's unoffered 11-a-side formations in the formation picker"

[[files]]
stem = "soccer_formation_menu_inc"

  [[files.ops]]
  type = "bytecode_child"
  src = "utilities_formations.lua"
  marker = "utilities_formations"
  crc = "at"
  include = { "@UPV@" = "../_lib/evt_upvalues.lua" }
