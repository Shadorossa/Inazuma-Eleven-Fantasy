# «Configuración de pasivas» of the mod Utilities (docs/game/mechanics/pasivas-configurables.md; plugin
# utilities.dll, feature passive_config, answers CMND_UTIL_PC_*): setting type 9 of the team dock (retail «Pasivas
# heredadas») runs a session on the player's own plate page «PASIVAS DE EQUIPO» (personal_plate_menu): the board
# picker's list window with every passive of the game and of the mods' declarations (special / general / archetype
# slots, as many as [passives] max_slots of Utilities' config.toml allows), L1/R1 categories, «Quitar». The retail
# inherit menu is no longer used.
# HOOK files (docs/framework/lua-hosts.md §7): EVT_Host handlers on the VR-Framework's hosts of the two stems
# (research/mods/VRFW/assets/lua/menu/<stem>/000_host.lua), never merged with other grafts, no promoted locals. Their text
# is generated: edit util_pc_*.src.lua and run gen_hooks.py (fills @crc / @ICONS@ = _lib/util_passive_icons.lua /
# --@lib). The dispatch of type 9 inside the dock's per-player coroutine is a Handle rule of the VR-Framework's list
# rows (docs/framework/list-rows.md, Utilities 1.15.10; the text graft passive_config_dispatch, which redefined the
# dock's OnDecideFocus for one line, is gone); Inazuma Fantasy's merged team_dock_formation_menu file still carries the
# same call in its graft prime_dock. IF's Supertécnicas screen uses the same picker rows
# (graft ss2_pc_rows, mod inazuma_fantasy).
name = "passive_config"
mod = "utilities"
order = 300
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Configurable passives: team dock entry + session on the player plate with the list picker (Utilities)"

[[hooks]]
stem = "team_dock_formation_menu"
src = "util_pc_dock.lua"

[[hooks]]
stem = "personal_plate_menu"
src = "util_pc_plate.lua"

# a mode without player passives ([[off_mode]]): the formation screen hides «Bonificaciones de equipo»
[[hooks]]
stem = "soccer_formation_menu"
src = "util_pc_formation.lua"
