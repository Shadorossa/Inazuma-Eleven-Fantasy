# Combo partners of the mod Utilities (docs/game/mechanics/combo-partners.md §6; plugin utilities.dll, feature
# combo_partners, answers CMND_UTIL_COMBO_*): on the RETAIL «Tabla de habilidades» (ability_learning_board_menu) the
# bottom guide gets «X Compañeros» on a move node whose move needs partners, and X opens the partner picker
# (Utilities' list window, layers of menus\102_team\combo_partners.toml); the confirm popup is the retail card
# window of general_window with the performers' cards (layer util_cp_card). Inazuma Fantasy's skill table
# (evt_skill_slot_menu, its graft combo_partners) uses the same commands and the same general_window cards.
# Since 2026-10-14 the same picker also runs on Character Reforged's «Fantasy» skill table (evt_skill_slot_menu) without
# Inazuma Fantasy: X = the x_action entry «partners» of that screen's host (content\menus\102_team\
# skill_table_partners.toml, function Utilities.SkillTablePartners in util_cp_skill_table.lua; the screen's list cover
# and Utilities' list layers util_pc_list / util_pc_row added there). Both hook files carry the one picker
# util_cp_core.src.lua (gen_hooks.py builds it in).
# HOOK files (docs/framework/lua-hosts.md §7): neither screen has a VR-Framework host for this, so the files wrap the
# globals directly (once per VM, chained). Generated: edit util_cp_*.src.lua and run gen_hooks.py (fills @crc and the
# shared picker). The skill table has no retail original: its hook names the script's globals in `require`.
# Moved from Inazuma Fantasy (graft combo_partners, general_window block evt_combo_partners_gw.lua) on 2026-10-08.
name = "util_combo_partners"
mod = "utilities"
order = 320
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Combo partners: X «Compañeros» on the retail skill board and on Character Reforged's skill table + the confirm popup's performer cards (Utilities)"

[[hooks]]
stem = "ability_learning_board_menu"
src = "util_cp_board.lua"

[[hooks]]
stem = "evt_skill_slot_menu"
src = "util_cp_skill_table.lua"
require = ["EVT_OpenOriginalBoard", "EVT_PickCoroutine"]

[[hooks]]
stem = "general_window"
src = "util_cp_gw.lua"
