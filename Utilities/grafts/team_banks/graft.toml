# Team bank pages of the mod Utilities (docs/game/mechanics/team-squads-extended.md section 6.4): N pages x 11 team
# docks, R3 / N opens the dock list, Q / E page through the pages. A HOOK file (docs/framework/lua-hosts.md §7): it
# registers EVT_Host handlers (around OnInit, Step, FuncOnBack, OnFunction, OnEnter, OnDecideFocus...) on the
# VR-Framework's host of soccer_team_dock_menu (research/mods/VRFW/assets/lua/menu/soccer_team_dock_menu/000_host.lua), is
# never merged with other grafts and promotes no locals: the retail chunk's locals are reached through EVT_DEBUG (TB.L:
# the live copy, promoted by another mod's merge-path patch, or the retail one). Inazuma Fantasy's pachanga dock and
# INAROGUE dock talk to it at run time (UTIL_TB, UTIL_TB_HOOKS, UTIL_TEAM_BANKS). Built into the mod:
# menu_assemble.py build --mod utilities.
name = "team_banks"
mod = "utilities"
order = 310
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Team bank pages: N pages x 11 docks in the team dock (Utilities)"

[[hooks]]
stem = "soccer_team_dock_menu"
src = "util_team_banks_dock.lua"
