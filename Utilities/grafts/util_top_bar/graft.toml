# Utilities' top bar shortcuts, title side (docs/framework/top-bar.md; research/mods/Utilities/content/menus/top_bar.toml,
# generated by research/scripts/top_bar_build.py). A shortcut goes back to the title with the retail reset (the
# framework's runtime, lua\_all\10_top_bar.lua) and leaves the title item to press in the param of Utilities'
# [top_bar_title] (`go = "utilities_topbar_go"`). The title then presses that item through the retail OnEnter, once
# title_main reads requests (param utilities_title_ready, set by ut_title_main.lua in SwitchCaseTitleInputWait).
# Inazuma Fantasy declares its own [top_bar_title] (graft modes_hub, its title row differs) and the framework keeps the
# last loaded one: with IF, this graft stays inert (nothing writes its param). Wrappers only; nothing runs at chunk
# load. Moved here from Inazuma Fantasy on 2026-10-08 (docs/refactor/if-adaptation-after-e3.md §35); BetterUI's graft
# clean_hud_top_bar until 2026-10-12 (owner decision: the top bar is Utilities'; its globals are Utilities.TopBar.*,
# its params utilities_topbar_go / utilities_title_ready).
# BetterUI 1.12.1: ut_title_main.lua also keeps the title -> mode step black when the title is already black (the retail
# white fade 4011714927 turned the shortcut's black screen white: the white flash); IF's modes_hub does it when on.
# BetterUI 1.14.3: while a shortcut is in flight (evt_top_bar_busy) title_main's timed waits (WaitFade, EndFadeInit) are skipped
# through its locals (VRFW_Host title_main L), for Utilities' and IF's hand-offs; else retail.
name = "util_top_bar"
mod = "utilities"
order = 335
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInit", "Step", "GetTitleMenuItemId", "IsEnableMenuItemButton", "SwitchCaseTitleInputWait", "SwitchCaseTitleFade",
         "SwitchCaseTitleWaitFade", "SwitchCaseTitleEndFadeInit"]
description = "Top bar shortcuts: the title presses the item a shortcut asked for"

[[files]]
stem = "title_menu_2"

  [[files.ops]]
  type = "append_block"
  src = "ut_title.lua"
  marker = "utilities top_bar title"
  crc = "none"

[[files]]
stem = "title_main"

  [[files.ops]]
  type = "append_block"
  src = "ut_title_main.lua"
  marker = "utilities top_bar title_main"
  crc = "none"
