# Utilities' «Cambiar forma» key (2026-10-14, owner: the RS button of Inazuma Fantasy's character view moved here;
# docs/game/mechanics/form-viewer.md §8): cycles the forms of the character a menu shows. A rebindable [[action]]
# (docs/framework/types/input.md §2b): a row «Cambiar forma (ver personaje)» in the game's «Configuración de controles»,
# tab «Controles básicos»; the game keeps the player's binding. Defaults: pad RS (R3, index 2: the button IF's player
# page used, retail CMD_FUNC6's) / keyboard G (index 6: free in the three controllers; F / R are the «Ver apariencia»
# camera's, N the top bar's). Controllers: MENU_CTRL and MENU_CTRL_WITH_ANALOG_MOVE_FOCUS (the menus, the player page)
# and MENU_CTRL_SEPARATE_CROSS_KEY (the controller the retail «Ver apariencia» switches to). Polled by
# assets\lua\_all\utilities_view_forms.lua only in the menus the host «utilities.view_forms» lists
# (content\menus\view_forms.toml + other mods' entries). Its glyph: <CMD_UTIL_VIEW_FORMS> (text row utilities_view_forms).
# Not the technique preview's action (Utilities' «Previsualizar» on the move card): another command, other menus.
schema = "VRFW.input/1"

[[action]]
id = "Utilities.ViewForms.Cycle"
command = "CMD_UTIL_VIEW_FORMS"
ctrl = ["MENU_CTRL", "MENU_CTRL_WITH_ANALOG_MOVE_FOCUS", "MENU_CTRL_SEPARATE_CROSS_KEY"]
category = "basic"
label = "utilities_view_forms_action"
pad = "RS"
keyboard = "G"
screens = ["personal_plate_menu", "team_dock_formation_menu"]   # the menus of the host «utilities.view_forms» (content\menus\view_forms.toml + Character Reforged's player page)
