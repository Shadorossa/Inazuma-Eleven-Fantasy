schema = "VRFW.game/2"

# Utilities › Home / Away kit (feature away_kit; docs/game/mechanics/away-kit.md). The kit picker's Lua (graft
# research/grafts/away_kit) calls CMND_UTIL_TEAM_UNIFORM / CMND_UTIL_AK_PAIR and shows Local / Visitante when module
# mask bit 19 (524288) is lit. The logic is scripts\away_kit.lua; this file only names what it uses in the game.

# TeamInfo* GetTeamInfo(CGDDPartyStatus* party, u8 logicalSet, u8 team) (0xDA20A0): logical set -> physical slot,
# data + slot*0x874 + team*0x2D0 (team >= 3 -> 0). 0xDA2000 is a byte-identical copy (non-const overload): the pattern
# runs into the padding and the prologue of the next function to stay unique.
[[VRFW.Function]]
name = "GetTeamInfo"
game = "Team.SetStruct"

# [[g_gameRoot] + 0x69A8] = CGDDPartyStatus (team sets at +0x17B8)
[[VRFW.Global]]
name = "party"
base = "game_root"
chain = ["ROOT_PARTY"]

# TeamInfo (0x2D0 bytes, saved as teamInfoList[] of block 0x07): +0x290 uniformId (the kit every consumer reads:
# CMND_GET_TEAM_SET_INFO field 7, face icons, dock 3D view, Kizuna town, match team record), +0x294 uniformInvHdl (the
# owned kit item, field 12; only the kit picker and the dock kit icon read it).
[[VRFW.Struct]]
name = "TeamInfo"
size = 0x2D0
fields = { uniform = { at = 0x290, type = "u32" }, uniform_item = { at = 0x294, type = "u32" } }

# set, team [, uniform [, src_team]] -> ok, uniformId (the old name: Inazuma Fantasy's pachanga / INAROGUE Lua and the
# VR-Framework's pachanga_core call it)
[[VRFW.Command]]
name = "CMND_UTIL_TEAM_UNIFORM"
aliases = ["CMND_EVT_TEAM_UNIFORM"]
handler = "Utilities.TeamUniform"
needs = ["GetTeamInfo", "party", "TeamInfo"]

# uniform -> its away twin (or the kit of a twin), 0 = none
[[VRFW.Command]]
name = "CMND_UTIL_AK_PAIR"
handler = "Utilities.AwayKitPair"
needs = ["GetTeamInfo", "party", "TeamInfo"]

# the kit picker's Lua tests mods / 524288 % 2: it must never move (was IF's MOD_AWAY_KIT)
[[VRFW.ModuleMask]]
bit = 19
needs = ["CMND_UTIL_TEAM_UNIFORM", "CMND_UTIL_AK_PAIR"]
