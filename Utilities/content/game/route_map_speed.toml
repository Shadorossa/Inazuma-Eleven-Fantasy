schema = "VRFW.game/2"

# Utilities › Chronicle route map speed (feature route_map_speed; docs/game/ui/chronicle-route-map-cursor.md). On the
# route map (vs_route_town_menu and its variants) holding R2 (pad RT; keyboard keys of config.toml) moves the map cursor
# faster: the per-frame update of the native game::CVSRouteTownMenu (vtable slot 3) is wrapped; while R2 is held the
# script multiplies the cursor speed (+0x270, f32) by the factor around the game's update and puts the game's value back
# right after. Only that class's update is wrapped. The board's bottom guide shows «R2 Velocidad del cursor» (graft
# util_route_map_speed asks CMND_UTIL_ROUTE_MAP_SPEED).

# void CVSRouteTownMenu::Update(this) (0x1220E70): only to check the slot holds the game's function before wrapping it
[[VRFW.Function]]
name = "RouteTownUpdate"
game = "Route.TownUpdate"

# In the ctor of CVSRouteTownMenu (0x1222050), after the base ctor: lea r11, [rip + vftable]; mov [rcx], r11; ...
# (the shorter prefix also matches a sibling map menu's ctor at 0x1156F30). vftable = .rdata 0x1A25D80.
[[VRFW.Hook]]
name = "RouteMapUpdate"
game = "Route.MapUpdate"
kind = "vtable"
expect_fn = "RouteTownUpdate"

# () -> bool: the boost works this session (the board's hook file asks it before adding the prompt)
[[VRFW.Command]]
name = "CMND_UTIL_ROUTE_MAP_SPEED"
handler = "Utilities.RouteMapSpeedOn"
