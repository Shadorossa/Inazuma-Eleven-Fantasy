# Team bank pages of the Team dock (feature team_banks; docs/game/mechanics/team-squads-extended.md §6): what the
# feature reads / calls in the game (nie.exe PC v7.1.2) and the Lua commands it answers. The logic is
# scripts\team_banks.lua (Utilities.TeamBanks.*), the page format scripts\lib\tb_store.lua. The dock's Lua (graft
# research/grafts/team_banks) calls CMND_UTIL_TEAMBANK_INFO / SET / MENU and shows the pages when module mask bit 21
# (2097152) is lit. Was utilities.dll's module team_banks (2026-10-10); the party Load post-hook (TB_PartyLoad, below) is data too since
# step H phase 2.
schema = "VRFW.game/2"

# ---------------------------------------------------------------- game functions

# `void SetOrganizedFlagBit(TeamMember* m, u8 logicalSet, bool on)` 0xE796F0: the member's record organizedTeamFlag bit
# of that set (record +0x1EC, u16).
[[VRFW.Function]]
name = "TB_SetOrganizedFlagBit"
game = "Party.SetOrganizedFlagBit"

# `void RecountTeamInfo(TeamInfo*)` 0xDA76F0: rebuilds the members' synergy flag byte (+0xF) and the counters.
[[VRFW.Function]]
name = "TB_RecountTeamInfo"
game = "Party.RecountTeamInfo"

# `u8 LogicalToPhysical(_, u8 logical)` 0xDA7690: the logical -> physical team-set table (.rdata 0x19D7E28). The
# script asks it for the 16 logical sets once (no table is shipped).
[[VRFW.Function]]
name = "TB_LogicalToPhysical"
game = "Party.LogicalToPhysical"

# `bool CGameDataBackup::IsJobPending(CGameDataBackup*)` 0xD4C9E0: a save / load job runs (no page swap then).
[[VRFW.Function]]
name = "TB_IsJobPending"
game = "Save.IsJobPending"

# ---------------------------------------------------------------- globals

# [[g_gameRoot] + 0x69A8] = CGDDPartyStatus: +0x17B8 team-set data pointer (stride 0x874), +0x9F10..0x9F12 the vs /
# esports / tournament active set (logical, u8).
[[VRFW.Global]]
name = "tb_party"
base = "game_root"
chain = ["ROOT_PARTY"]

# [g_gameDataBackup] (the save / load job object): the `mov rcx, [rip+x]` at +0x4C of the Lua handler of
# LOAD_GAME_DATA 0xC9BF80.
[[VRFW.Global]]
name = "tb_game_data_backup"
game = "Save.GameDataBackup"

# ---------------------------------------------------------------- Lua commands (same names, args and returns as the
# Rust module; the dock graft asks them by crc32 of the name)

# -> ok (false: feature off / not ready), mounted page (0-based), pages, page name, used mask, slot
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_INFO"
handler = "Utilities.TeamBanks.Info"
needs = ["TB_SetOrganizedFlagBit", "TB_RecountTeamInfo", "TB_LogicalToPhysical", "tb_party"]

# (page, online 0/1) -> ok, code, players emptied, new page (bool)
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_SET"
handler = "Utilities.TeamBanks.Set"
needs = ["TB_SetOrganizedFlagBit", "TB_RecountTeamInfo", "TB_LogicalToPhysical", "TB_IsJobPending", "tb_party", "tb_game_data_backup"]

# (page, name) -> ok
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_RENAME"
handler = "Utilities.TeamBanks.Rename"
needs = ["TB_LogicalToPhysical", "tb_party"]

# (page) -> ok, code (the mounted page cannot be deleted)
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_DELETE"
handler = "Utilities.TeamBanks.Delete"
needs = ["TB_LogicalToPhysical", "tb_party"]

# (open 0/1, online 0/1) -> ok: the team-dock menu fence
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_MENU"
handler = "Utilities.TeamBanks.Menu"
needs = ["TB_LogicalToPhysical", "tb_party"]

# -> crc32 of the 11 live docks, dock-bit errors, team-0 members (and a log block); -1 x 3 when not readable
[[VRFW.Command]]
name = "CMND_UTIL_TEAMBANK_DUMP"
handler = "Utilities.TeamBanks.Dump"
needs = ["TB_LogicalToPhysical", "tb_party"]

# the dock Lua tests mods / 2097152 % 2: it must never move (was Inazuma Fantasy's MOD_TEAM_BANKS)
[[VRFW.ModuleMask]]
bit = 21
needs = ["CMND_UTIL_TEAMBANK_INFO", "CMND_UTIL_TEAMBANK_SET", "CMND_UTIL_TEAMBANK_MENU"]

# ---------------------------------------------------------------- game_state keys (set by the script)

# mounted page (0-based); -1 = feature off / not ready; 0 while pages cannot be switched (slot 1, blocked mode)
[[VRFW.State]]
key = "utilities.team_banks.mounted"
fallback = -1
needs = ["CMND_UTIL_TEAMBANK_INFO"]

# pages ([team_banks] pages, raised by other mods' utilities\team_banks.toml min_pages; 2..32)
[[VRFW.State]]
key = "utilities.team_banks.count"
fallback = 0
needs = ["CMND_UTIL_TEAMBANK_INFO"]

# 1 while pages can be switched (a player slot 2+ and no blocked game mode)
[[VRFW.State]]
key = "utilities.team_banks.active"
fallback = 0
needs = ["CMND_UTIL_TEAMBANK_INFO"]

# ---------------------------------------------------------------- party Load (was the Rust remnant)

# `bool CGDDPartyStatus::Load(this, ...)` 0xDA7FE0 (party vtable 0x19D40A8 slot 4): CGDDSerialize::Load, then the
# per-team counter pass. Post-hook: the script counts the loads (a load must make it take the slot's sidecar again;
# the slot events tell a switch, not whether the load really happened). Three 5-byte `mov [rsp+x], reg` stolen.
[[VRFW.Hook]]
name = "TB_PartyLoad"
game = "Party.Load"
kind = "function"

# party loads since boot (set by scripts\team_banks.lua from the hook)
[[VRFW.State]]
key = "utilities.team_banks.loads"
