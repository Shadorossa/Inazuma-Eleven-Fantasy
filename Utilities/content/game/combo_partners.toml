schema = "VRFW.game/2"

# Utilities › combo partners (feature combo_partners; docs/game/mechanics/combo-partners.md). The teammates who perform a
# combo / cooperative move with its executor are chosen per player and move (the retail «Tabla de habilidades»: graft
# util_combo_partners asks the commands below) and cast in the match: BuildEventCast post-hook. Logic and the saved
# choices (blob skill_partners.json per slot): scripts/combo_partners.lua.

# SkillInfo** SkillInfoFind(SkillTable* t = [g_gameRoot+0x948], SkillInfo** out, const u32* skillId) 0xE16730
[[VRFW.Function]]
name = "SkillInfoFind"
game = "Technique.SkillInfoFind"

# bool IsActorOnPitch(actor, 0) 0x15B3210
[[VRFW.Function]]
name = "IsActorOnPitch"
game = "Match.IsActorOnPitch"

# [g_gameRoot] + 0x948 = the skill table SkillInfoFind takes
[[VRFW.Global]]
name = "skill_table"
base = "game_root"
chain = [0x948]

# SKILL_INFO record (engine copy): skill id, partnerType (2-4 = performers), the three named partners (character ids)
[[VRFW.Struct]]
name = "SkillInfo"
size = 0x48
fields = { skill = { at = 0x00, type = "u32" }, partner_type = { at = 0x38, type = "u8" }, partner1 = { at = 0x3C, type = "u32" }, partner2 = { at = 0x40, type = "u32" }, partner3 = { at = 0x44, type = "u32" } }

# soccer actor ([g_soccerActors] + (hdl & 0xFF) * 0x570): its handle, the character handle it plays (the match copy of
# the card), its team, its character id (what BuildEventCast compares the SKILL_EX_SETTING roles with)
[[VRFW.Struct]]
name = "Actor"
size = 0x570
fields = { handle = { at = 0x94, type = "u32" }, chara = { at = 0x9C, type = "u32" }, team = { at = 0xD0, type = "u8" }, chara_id = { at = 0xD8, type = "u32" } }

# void BuildEventCast(ctx*, u32* cast, u32 n, SKILL_INFO* rec, EX_SETTING* ex, char acting, u16 lv, int* mode) 0x16A49A0:
# fills cast[0..n] (executor, the ex-setting roles, bond teammates, the nearest teammates); called twice per event,
# acting = 1 for the performing side. Post-hook. The prologue starts with `test rdx,rdx; je rel32`: 19 bytes stolen
# (test 3 + je 6 + two 5-byte movs), the je's displacement relocated (bytes 5..9). A subscriber of the framework's
# relocated entry of the function (one patch, shared with the hook bus game event `match:event_cast`, run order 100):
# order 0 = after it (its post handler sees the cast the other subscribers left).
[[VRFW.Hook]]
name = "BuildEventCast"
game = "Battle.BuildEventCast"
kind = "function"
order = 0

# skill -> performers, free, named1, named2, named3
[[VRFW.Command]]
name = "CMND_UTIL_COMBO_INFO"
aliases = ["CMND_EVT_SKILL_PARTNERS"]
handler = "Utilities.ComboInfo"

# charaStHdl, skill -> ok, p1, p2, p3
[[VRFW.Command]]
name = "CMND_UTIL_COMBO_GET"
aliases = ["CMND_EVT_COMBO_GET"]
handler = "Utilities.ComboGet"

# charaStHdl, skill, p1[, p2, p3] -> ok
[[VRFW.Command]]
name = "CMND_UTIL_COMBO_SET"
aliases = ["CMND_EVT_COMBO_SET"]
handler = "Utilities.ComboSet"

# charaStHdl[, skill] -> ok
[[VRFW.Command]]
name = "CMND_UTIL_COMBO_CLEAR"
aliases = ["CMND_EVT_COMBO_CLEAR"]
handler = "Utilities.ComboClear"

# mask[, vk …] -> seconds held (0 = not held, -1 = no input source)
[[VRFW.Command]]
name = "CMND_UTIL_PAD_HELD"
aliases = ["CMND_EVT_PAD_HELD"]
handler = "Utilities.PadHeld"
