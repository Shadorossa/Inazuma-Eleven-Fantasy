schema = "VRFW.game/2"

# Utilities › shop filter (feature shop_filter, always on; docs/game/modes/tienda-general.md §15). In a shop tab whose
# goods have retail filter categories the end of the tab bar shows the retail filter icon + Tab; the key opens the
# retail item filter window (item_filter_menu) and its accept button keeps in the tab only the rows the engine's own
# item test passes. Lua side: graft research/grafts/util_shop_filter (shop, window, banner). Logic:
# scripts/shop_filter.lua.

# bool ItemTestSeriesStat(_, u64 invMask, const u32* item, const u8* filter) 0xD8E150: kits / emblems (series) and
# equipment (stats); filter = the 0x20-byte block SetItemFilter (0xCEE7F0) fills
[[VRFW.Function]]
name = "ItemTestSeriesStat"
game = "Item.TestSeriesStat"

# bool ItemTestSkill(_, u64 invMask, u8 kind, const u32* item, const u8* filter) 0xD8DC10: moves (kind 1-4) and auras
# (kind 8); filter = the 0x38-byte block of 0xD8D990
[[VRFW.Function]]
name = "ItemTestSkill"
game = "Transform.AbilityItemFilterPass"

# The shop tab builder 0x118A100 (CMenuListViewShop, 320 rows a tab): `test rbx,rbx; je; movzx r8d,word [rbx+3Eh];
# movzx edx,word [rbx+3Ch]; call 0x118BCA0 (category, sub -> tab); cmp r9d,eax; je`. Live there: r13 = list view
# (shop id +0x2040, slot type +0x2048, the «new» list +0x2054), rsi = row (item +4), r9d = the slot type being built
# (kept by the caller across the call: the hook stub keeps every register). The call goes through the hook.
[[VRFW.Hook]]
name = "ShopTabOf"
game = "Shop.TabOf"
kind = "call"
needs = ["ItemTestSeriesStat", "ItemTestSkill"]

# The game's tab of a row (0x118BCA0: category, sub-kind -> shop slot type) has no entry for the mode change items
# (special-skill category 160, sub-kind 178: the game never sold them) and files them under slot type 1, the «Tiques»
# tab, whose row and detail panel find no ticket data (no price, stock 0, blank image, no name). They are listed in the
# aura tab (slot type 17) with the other aura items (keshin, armour, miximax, totem: sub-kinds 125, 171-176).
[[VRFW.Hook.answer]]
phase = "post"
when = [{ value = "args[2]", equals = 160 }, { value = "args[3]", equals = 178 }]
value = "17"

# slot, inv, t1, v1, o1, … -> ok (no triples = that slot's filter removed)
[[VRFW.Command]]
name = "CMND_UTIL_SHOP_FILTER_SET"
handler = "Utilities.ShopFilterSet"

# inv, t1, v1, o1, … -> shown, total over the rows of the tab built last
[[VRFW.Command]]
name = "CMND_UTIL_SHOP_FILTER_COUNT"
handler = "Utilities.ShopFilterCount"

# -> live, cleared (every slot's filter dropped)
[[VRFW.Command]]
name = "CMND_UTIL_SHOP_FILTER_RESET"
handler = "Utilities.ShopFilterReset"

# -> n, id1, …: the engine's «new» list of the shop list view built last
[[VRFW.Command]]
name = "CMND_UTIL_SHOP_NEW_LIST"
handler = "Utilities.ShopNewList"

# id -> true, isNew
[[VRFW.Command]]
name = "CMND_UTIL_SHOP_NEW_STATE"
handler = "Utilities.ShopNewState"
