# Utilities › the combo partner picker on Character Reforged's «Fantasy» skill table (evt_skill_slot_menu; research/
# grafts/util_combo_partners, docs/game/mechanics/combo-partners.md §6.3, docs/framework/skill-table-host.md). Only
# with Character Reforged (the screen is its [[screen]]):
#
# 1. X on a move row whose move needs partners: an X ACTION of the screen's host (Character Reforged's graft
#    skill_table_host). The function is Utilities' hook file of the screen (util_cp_skill_table.lua); the guide entry is
#    «Compañeros» (utilities.cp_btn). It answers «not available» while Inazuma Fantasy's own picker is in the screen
#    (its X stays alone). The [[host]] is Character Reforged's; it is declared here too (same id, same list).
# 2. The picker's list: the passive configurator's objects (util_pc_list = the frame, util_pc_row x 6 = the rows; the
#    frame's row attaches name the layer util_pc_row), in the screen's own list group next to its list popups
#    (evt_ss_list / evt_ss_listbg), hidden until X opens them (draw priorities 450 / 451 set by the Lua, as the
#    screen's own lists). No backdrop layer: the screen's list cover (PL.ListCover) draws it and hides the buttons.
schema = "VRFW.menu/2"
if_mod = "character_reforged"

[[host]]
id = "character_reforged.skill_table.x_action"
label = { es = "Tabla de habilidades: acción X", en = "Skill table: X action", fr = "Table des techniques : action X", de = "Fähigkeitentabelle: X-Aktion", it = "Tabella abilità: azione X", pt = "Tabela de habilidades: ação X", ja = "スキル表：Xのアクション", zh_hans = "技能表：X 操作", zh_hant = "技能表：X 操作" }

[[entry]]
host = "character_reforged.skill_table.x_action"
id = "partners"
text = "utilities.cp_btn"
order = 100
action = { lua = "Utilities.SkillTablePartners" }

[[patch]]
menu = "evt_skill_slot_menu"
add_layer = { name = "util_pc_list", object = "util_pc_list", count = 1, align = ["left", "middle"], scale = 0.20000000298023224, after = "evt_ss_listbg", groups = [{ group = "evt_skill_slot_menu", flags = [0, 1, 1, 0, 1, 0], after = "evt_ss_listbg" }] }

[[patch]]
menu = "evt_skill_slot_menu"
add_layer = { name = "util_pc_row", object = "util_pc_row", count = 6, align = ["left", "middle"], scale = 0.20000000298023224, after = "util_pc_list", groups = [{ group = "evt_skill_slot_menu", flags = [0, 1, 1, 0, 1, 0], after = "util_pc_list" }] }

[[patch]]
menu = "evt_skill_slot_menu"
res = [
    "#/menu/20_cmn/cmn02/cmn02_01/cmn02_01.g4tx",
    "#/menu/102_team/team08/team08_01/team08_01.g4tx",
    "#/menu/00_soccer/soccer11/soccer11_20/soccer11_20.g4tx",
    "#/menu/200_icon/15_icon_common/icon_common.g4tx",
    "#/menu/200_icon/15_icon_common2/<LG>/icon_common2.g4tx",
]
