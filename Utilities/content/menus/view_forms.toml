# Utilities' «Cambiar forma» (docs/game/mechanics/form-viewer.md §8): the menus where the action
# Utilities.ViewForms.Cycle (content\inputs\view_forms.toml, default RS) cycles the shown character's forms. A menu
# entry host of Utilities: every [[entry]] host = "utilities.view_forms" names the menus (script stems, `menus`) and
# the game-Lua function called on each press there (`action = { lua = "<global>" }`, "A.B" paths allowed); read by
# assets\lua\_all\utilities_view_forms.lua (the menu needs a VR-Framework Lua host). Other mods add their own screens
# the same way (Inazuma Fantasy: its player page, IF menus\102_team\view_forms.toml). One RS action per menu: never a
# menu of the technique preview's action.
schema = "VRFW.menu/2"

[[host]]
id = "utilities.view_forms"
label = { es = "Cambiar forma", en = "Change form", fr = "Changer de forme", de = "Form wechseln", it = "Cambia forma", pt = "Mudar forma", ja = "フォーム切り替え", zh_hans = "切换形态", zh_hant = "切換形態" }

# the retail «Ver apariencia» of the team dock (Plantilla / Formación -> a player -> «Ver apariencia»): graft
# util_view_forms (research/grafts/util_view_forms) builds the picked form
[[entry]]
host = "utilities.view_forms"
id = "appearance"
menus = ["team_dock_formation_menu"]
action = { lua = "Utilities.ViewForms.Appearance" }

# The form indicator of «Ver apariencia» (owner 2026-10-14: «arriba a la derecha del personaje», the look of Inazuma
# Fantasy's form badges): while the shown character has more than one form, two square tiles at his top right, a dark
# one with the form's glyph and a light one under the bound key's glyph. Three layer instances (menu layer budget,
# docs/game/ui/menu-layer-limits.md):
#   util_vf_tile   x2, a cmn01_10 quad each (0 the form tile, 1 the key tile) showing the sprites of Utilities' own
#                  atlas #/menu/102_team/util_view_forms/util_view_forms.g4tx (content\images\menu\view_forms_badge.toml)
#   util_vf_badge  the retail change-page plate team00_40_change_page_guide, its grey base hidden: only its text, the
#                  action's glyph <CMD_UTIL_VIEW_FORMS> (the pad's button on a pad, the key on a keyboard), over tile 1
# The team dock's Formación is the menu object soccer_formation_menu running the script team_dock_formation_menu: the
# layers go in that menu's group team_dock_formation_menu (the match / pre-match Formación group never opens them).
# The graft util_view_forms opens them, fills them, places them from config.toml [view_forms] and hides them out of
# the view.
[[object]]
name = "util_vf_tile"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 690 } }]

[[patch]]
menu = "soccer_formation_menu"
add_layer = { name = "util_vf_tile", object = "util_vf_tile", count = 2, align = [1, 8], scale = 0.2, after = "team02_01_attach_formation_frame", groups = [{ group = "team_dock_formation_menu", flags = [0, 1, 0, 0, 1, 0], after = "team02_01_attach_formation_frame" }] }
res = ["#/menu/102_team/util_view_forms/util_view_forms.g4tx"]

[[patch]]
menu = "soccer_formation_menu"
add_layer = { name = "util_vf_badge", object = "team00_40_change_page_guide", count = 1, align = [0, 0], scale = 1, after = "util_vf_tile", groups = [{ group = "team_dock_formation_menu", flags = [0, 1, 0, 0, 1, 0], after = "util_vf_tile" }] }
