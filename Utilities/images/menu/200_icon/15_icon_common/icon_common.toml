# Utilities, feature neutral_element (docs/game/ui/neutral-element-icon.md): the «neutro» element icon (the purple ensō)
# for characters of element 0 / 5 and techniques of element 5, in the element-icon sprites of icon_common.g4tx. Made at
# the first start (and after a game update) from the PLAYER'S own game files by the image type's recipes
# (docs/framework/types/image.md §2.1): each sprite starts from the retail wind sprite of its family, the wind glyph is
# covered with a stretched glyph-free column of the same sprite, the colour moves to the neutral purple, and our own
# ensō (neutral\*.png, research/scripts/util_neutral_icon_parts.py) goes on top. No Level-5 pixel in the mod.
# Sprite names / places as Inazuma Fantasy shipped them (the Lua and the office icons name them).
schema = "vr_framework.image/1"

# the framework's screens (Mods panel: technique / character lists and editors) show this icon for the elements the
# game has none of (VR-Framework [[VRFW.ElementIcon]] of the image type): void (element 5 moves, characters) and neutral
# (element 0 characters). Without Utilities those show no icon.
[[VRFW.ElementIcon]]
Element = "void"
Atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
Sprite = "icon_cmd_type00"

[[VRFW.ElementIcon]]
Element = "neutral"
Atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
Sprite = "icon_cmd_type00"

[[texture]]
atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
name = "icon_common"
size = [1192, 1180]

[[sprite]]
atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
name = "icon_cmd_type00"
texture = "icon_common"
x = 4
y = 1112
size = [64, 64]
recipe = "cmd"

[[sprite]]
atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
name = "icon_cmd_on_type00"
texture = "icon_common"
x = 72
y = 1112
size = [64, 64]
recipe = "cmd_on"

[[sprite]]
atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
name = "icon_focus_type00"
texture = "icon_common"
x = 140
y = 1112
size = [64, 64]
recipe = "focus"

# the bare ensō with its glow: our own picture
[[sprite]]
atlas = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
name = "icon_type00"
texture = "icon_common"
x = 208
y = 1112
png = "neutral/icon_type00.png"

# ---- own parts --------------------------------------------------------------------------------------------------------
[[recipe]]
name = "enso_cmd"
png = "neutral/enso_cmd.png"

[[recipe]]
name = "enso_focus"
png = "neutral/enso_focus.png"

# ---- icon_cmd_type00: the flat square (wind glyph covered by columns 8-9, which hold no glyph), flat purple, black ensō
[[recipe]]
name = "cmd_wind"
game = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
sprite = "icon_cmd_type01"

[[recipe]]
name = "cmd_strip"
from = "cmd_wind"
ops = [{ op = "crop", box = [8, 0, 10, 64] }, { op = "resize", size = [46, 64] }]

[[recipe]]
name = "cmd"
from = "cmd_wind"
ops = [{ op = "paste", image = "cmd_strip", at = [9, 0] }, { op = "fill", rgb = [173, 81, 234] }, { op = "paste", image = "enso_cmd", at = [0, 0] }]

# ---- icon_cmd_on_type00: the same from the selected (pastel) wind sprite
[[recipe]]
name = "cmd_on_wind"
game = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
sprite = "icon_cmd_on_type01"

[[recipe]]
name = "cmd_on_strip"
from = "cmd_on_wind"
ops = [{ op = "crop", box = [8, 0, 10, 64] }, { op = "resize", size = [46, 64] }]

[[recipe]]
name = "cmd_on"
from = "cmd_on_wind"
ops = [{ op = "paste", image = "cmd_on_strip", at = [9, 0] }, { op = "fill", rgb = [198, 135, 240] }, { op = "paste", image = "enso_cmd", at = [0, 0] }]

# ---- icon_focus_type00: the gradient square + drop shadow (glyph covered by column 10), moved to purple (hue + 0.18
# turn, saturation x 0.75, value x 0.92: the purple of neutral_element_build.purple within a few levels), white ensō
[[recipe]]
name = "focus_wind"
game = "#/menu/200_icon/15_icon_common/icon_common.g4tx"
sprite = "icon_focus_type01"

[[recipe]]
name = "focus_strip"
from = "focus_wind"
ops = [{ op = "crop", box = [10, 0, 11, 64] }, { op = "resize", size = [44, 64] }]

[[recipe]]
name = "focus"
from = "focus_wind"
ops = [
    { op = "paste", image = "focus_strip", at = [10, 0] },
    { op = "hue", turns = 0.18 },
    { op = "saturate", factor = 0.75 },
    { op = "affine", mul = [0.92, 0.92, 0.92], add = [0.0, 0.0, 0.0] },
    { op = "paste", image = "enso_focus", at = [0, 0] },
]
