# «Living Shots» (shot_fx): the flight of Rugido de león (Lion Assault, whs02710) and of the moves with the same
# cut-in, Rugido de Doruga (Doruga Assault, whs02711) and Rugido de Goliger (Goliger Assault, whs02712), cut-in
# ev60_02710. Nacho 2026-10-10: every aura move its own flight, heights over distances (docs/framework/technique.md
# §4e, docs/game/mechanics/move-mini-effects.md §7).
# In the cut-in (c0400) the ball, held 3.8-4.0 m up in the lion's roar, is struck at 3.79 m and driven down a 15 deg
# line to 2.74 m 3.96 m on, where the scene whites out (no further flight is shown); in the match it flies that start
# from the kick and holds 2.74 m into the goal.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move lion_assault): the event ball (s01) of
# ev60_02710 c0400, event frames 1342-1354: [[0.00, 3.79], [3.96, 2.74]] (largest height error 0.00 m).
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

