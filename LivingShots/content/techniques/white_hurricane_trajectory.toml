schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the dive of Ciclón blanco (White Hurricane, whs01670; the rule covers whs01670_mm, and
# whs01670_cro, the Chronicle copy with the same cut-in, has its own edit below) (Nacho 2026-10-08: each move its own
# fall, matching its cut-in). In the cut-in's shot cut (c0400) the ball is kicked from high up and comes down a long
# line onto the pitch, flattening as it speeds up; in the match it comes into the goal at the cut-in's end angle: the
# angled dive (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7.6). Its dive line is ~35 m
# long, so on most shots the start comes down onto the 21° line over the kick point and the ball flies one straight
# line; from farther it leaves level at 15.1 m and bends into it. Its aura (content\effects\white_hurricane_ball.toml) is
# turned along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move white_hurricane): the event ball (b000001
# c_add_1_0) of ev60_01670 c0400, event frames 1308 (the kick, its highest point) - 1390 (it reaches the pitch):
# (-2.72, 15.22, -2.74) -> (22.52, -0.02, 15.24), 15.22 m -> 0 m over 30.99 m on the ground = 26.2° down on average,
# 39.8° over the first 4 frames, 21.0° over the last 4.
#   height     = 15.1: the start (15.22 m) over a kick on the pitch (ball radius 0.11).
#   angle      = 21:   the angle the ball comes in at (the last frames; the mean 26° includes the steeper start).
#   end_height = 1.8:  the cut-in ends on the pitch: brought to 1.8 m, in the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for these moves (no conflict).

# Ciclón blanco (whs01670; covers whs01670_mm).
[[edit]]
target = "whs01670"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 15.21 m (15.1 over a kick on the pitch) held until 34.93 m before the goal point, then the 21.0
# deg line down into 1.8 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 17.47 m down (bend 0.5). A shot shorter
# than 34.93 m starts lower, on the line.
trajectory = { goal_points = [[34.93, 15.21, 999, 17.47], [0.0, 1.8]], unblockable = false }
# Ciclón blanco, Chronicle copy (whs01670_cro: not an _or / _mm variant, so not covered by the base's rule).
[[edit]]
target = "whs01670_cro"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 15.21 m (15.1 over a kick on the pitch) held until 34.93 m before the goal point, then the 21.0
# deg line down into 1.8 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 17.47 m down (bend 0.5). A shot shorter
# than 34.93 m starts lower, on the line.
trajectory = { goal_points = [[34.93, 15.21, 999, 17.47], [0.0, 1.8]], unblockable = false }
