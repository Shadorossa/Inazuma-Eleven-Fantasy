schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the dive of Omega Assault (whs02280) (Nacho 2026-10-08: each move its own fall,
# matching its cut-in). In the cut-in's shot cut (c0030) the ball is fired from the prism high in the sky and flies
# down a long, shallow straight line; in the match it comes into the goal at that angle: the angled dive
# (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7.6). Its dive line is ~54 m long, so
# on almost every shot the start comes down onto the 18° line over the kick point (e.g. ~10 m from 25 m out) and the
# ball flies one straight line, like the cut-in; only from farther it leaves level at 19.4 m first. Its aura
# (content\effects\omega_assault_ball.toml) is turned along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move omega_assault): ball_aura_set (on the event ball) of
# ev60022800 c0030, frames 428-494 (fired at 430, eased to a stop at 494, then it hovers ~10 m up):
# (0.00, 19.52, 0.00) -> (1.97, 9.86, 29.34), 19.52 m -> 9.86 m over 29.40 m on the ground = 18.2° down (19.7° early,
# 17.3° late; the last frames' 35° is the ease-out, not the flight).
#   height     = 19.4: the start (19.52 m, the prism) over a kick on the pitch (ball radius 0.11).
#   angle      = 18:   the descent angle (the straight line's mean).
#   end_height = 2.0:  the cut-in stops at 9.9 m (it never reaches the goal): brought to 2.0 m, in the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for this move (no conflict).

# Omega Assault (whs02280).
[[edit]]
target = "whs02280"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 19.51 m (19.4 over a kick on the pitch) held until 53.89 m before the goal point, then the 18.0
# deg line down into 2.0 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 26.95 m down (bend 0.5). A shot shorter
# than 53.89 m starts lower, on the line.
trajectory = { goal_points = [[53.89, 19.51, 999, 26.95], [0.0, 2.0]], unblockable = false }
