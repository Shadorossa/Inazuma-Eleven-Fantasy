# «Living Shots» (shot_fx): the flight of Cañonazo de Ixaal (Ixaal Canon, whs02730) and Cañonazo de Vairaas (Vairaas
# Canon, whs02731), one cut-in ev60_02730.
#
# Measured (research/scripts/ixaal_canon_ball_fx.py): in c0300 the ball does not fly; the cannon beam fires from the
# ball's place at 5.58 m along a straight line 20.1 deg down. Flight (owner rules 2026-10-21: never curved; a high shot
# starts only a little above a normal one): one straight line from the beam's start height, lowered by
# _flight_height.toml, into 2.0 m at the goal over 40 m (a shorter shot starts at the line's height at the kick), so the
# aura's beam keeps one direction from the kick point. speed = 25 (m/s): the aura's mouth and Ixaal stay at the kick
# point by sliding back from the ball at 25 m/s, so the shot flies at that speed.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point; the first height is held.

# Cañonazo de Ixaal (whs02730).
