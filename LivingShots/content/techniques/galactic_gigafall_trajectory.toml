schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the dive of Galactic GigaFall (whs02630) (Nacho 2026-10-08: each move its own fall,
# matching its cut-in). In the cut-in's shot cut (c0400) the ball falls almost straight down from the sky onto the
# goal as a comet; in the match the ball starts that high over the kick point and comes into the goal at its steep
# angle: the angled dive (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7.6). Close in
# the start comes down onto the 61° line; farther the ball leaves level at 18.3 m and bends into it. Its aura
# (content\effects\galactic_gigafall_ball.toml, the comet) is turned along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move galactic_gigafall): the event ball (b000001
# c_add_1_0) of ev60_02630 c0400, its clip frames 0-118 (a straight line at constant speed):
# (-2.48, 18.41, 41.54) -> (-1.06, 5.79, 48.46), 18.41 m -> 5.79 m over 7.06 m on the ground = 60.8° down.
#   height     = 18.3: the start (18.41 m) over a kick on the pitch (ball radius 0.11).
#   angle      = 61:   the descent angle.
#   end_height = 2.0:  the cut-in ends at 5.8 m (over the bar): brought to 2.0 m (the line reaches it ~2 m further
#                      on), in the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for this move (no conflict).

# Galactic GigaFall (whs02630).
[[edit]]
target = "whs02630"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 18.41 m (18.3 over a kick on the pitch) held until 9.1 m before the goal point, then the 61.0
# deg line down into 2.0 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 4.55 m down (bend 0.5). A shot shorter
# than 9.1 m starts lower, on the line.
trajectory = { goal_points = [[9.1, 18.41, 999, 4.55], [0.0, 2.0]], unblockable = false }
