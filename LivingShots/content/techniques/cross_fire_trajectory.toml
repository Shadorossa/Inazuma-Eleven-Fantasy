schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the dive of Fuego cruzado (Cross Fire; whs00950 fire, whs03400 wind, the same cut-in)
# (Nacho 2026-10-08: each move its own fall, matching its cut-in). In the cut-in's shot cut (c0500) the two players strike the ball ~5.6 m up and it comes down onto the goal
# in a long shallow descent, steeper at first, easing to ~1.4 m at the goal mouth; in the match it leaves high and
# comes down that line: the angled dive (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md
# §7.6). Its aura (content\effects\cross_fire_ball.toml, the fire and ice coils) is turned along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move cross_fire; cross_fire_ball_fx.py --trajectory):
# the event ball (b000001 c_add_1_0) of ev60_00950 c0500 (ev60_03400 identical), event frames 1336 (the cut opens on
# it, its highest point) - 1420 (the cut's end at the goal mouth): (-8.76, 5.59, -26.70) -> (-2.81, 1.37, 35.87),
# 5.59 m -> 1.37 m over 62.9 m on the ground = 3.8° down on average, 6.8° over the first 4 frames, 0.9° over the
# last 4 (it levels off); it never reaches the pitch.
#   height     = 5.5: the start (5.59 m) over a kick on the pitch (ball radius 0.11).
#   angle      = 5:   the fall line; the mean (3.8°) is under the angled dive's minimum 5°, the first frames 6.8°:
#                     5° keeps it the shallow long descent of the cut-in (dive line ~47 m).
#   end_height = 1.4: the cut-in's own end height at the goal mouth (1.37 m), in the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for these keys (no conflict). Its override keys whs00950_or / whs03400_or are not edited here: they are new moves of
# Inazuma Fantasy, which loads after shot_fx (it requires it), so an [[edit]] of them here would be an unknown
# technique (technique.md §8); the aura (content\effects\cross_fire_ball.toml) does cover them.

# Fuego cruzado (whs00950, fire).
[[edit]]
target = "whs00950"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 5.61 m (5.5 over a kick on the pitch) held until 48.12 m before the goal point, then the 5.0
# deg line down into 1.4 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 24.06 m down (bend 0.5). A shot shorter
# than 48.12 m starts lower, on the line.
# measured flight (lowered by _flight_height.toml): trajectory = { goal_points = [[48.12, 5.61, 999, 24.06], [0.0, 1.4]], unblockable = false }
trajectory = { goal_points = [[48.12, 4.24, 999.0, 24.06], [0.0, 1.4]], unblockable = false }
