schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the dive of Sombra de Orión (Orion's Shade, whs03060) (Nacho 2026-10-08: each move its
# own fall, matching its cut-in). In the cut-in the player jumps with the ball ~12.5 m up (c0100-c0400), kicks it
# (c0400 frame 304) and it leaves on a line down towards the goal; the last cut (c0500, the ball not shown) is the shot
# itself: the red-and-black shadow flame coming down out of the sky on one straight line; in the match the ball comes
# into the goal down that line: the angled dive (docs/framework/technique.md §4e,
# docs/game/mechanics/move-mini-effects.md §7.6). Its aura (content\effects\orions_shade_ball.toml, the shadow flame) is turned
# along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move orions_shade; orions_shade_ball_fx.py --trajectory),
# in the effect object's space (ev60030600, Y up, the event camera's space; the event ball pack b000001 reads with Y
# and Z swapped through the generic bone chain, so the effect's own joints are sampled):
#   c0400 ball_pos, effect frames 304 (the kick) - 362 (the cut's end): (0.00, 12.50, 1.36) -> (0.00, 9.99, 14.49),
#     12.50 m -> 9.99 m over 13.1 m on the ground = 10.8° down on average, 11.2° over the last 4 frames;
#   c0500 last_shoot_rot (the flame's head, the shot), effect frames 363-473: (-12.38, 24.22, 11.23) ->
#     (-1.06, 10.21, 36.46), 24.22 m -> 10.21 m over 27.7 m on the ground = 26.9° down, a straight line (26.9° over
#     the last 4 frames too); it never reaches the pitch in the cut (the camera holds).
#   height     = 12.4: the kick (12.50 m) over a kick on the pitch (ball radius 0.11); c0500's 24 m is the shot staged
#                      out of the sky, not a kick point.
#   angle      = 27:   the c0500 shot line (26.9°), the cut that shows the shot to the goal (c0400's first 13 m after
#                      the kick are 10.8°).
#   end_height = 1.2:  the line never reaches the pitch in the cut-in; brought into the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for this move (no conflict).

# Sombra de Orión (whs03060).
[[edit]]
target = "whs03060"
# Flight (2026-10-10, heights over distances: docs/framework/technique.md §4e): the angled dive above as points, the same
# flight: 12.51 m (12.4 over a kick on the pitch) held until 22.2 m before the goal point, then the 27.0
# deg line down into 1.2 m at the goal; the bend from the level start into the line (999 before the top: the whole level piece) joins it 11.1 m down (bend 0.5). A shot shorter
# than 22.2 m starts lower, on the line.
trajectory = { goal_points = [[22.2, 12.51, 999, 11.1], [0.0, 1.2]], unblockable = false }
