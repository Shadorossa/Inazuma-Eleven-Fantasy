# «Living Shots» (shot_fx): the dive of Caliburn (whs01890) (Nacho 2026-10-08: each move its own fall, matching its
# cut-in). In the cut-in the two players carry the ball up over the storm (c0400: 12.13 -> 12.79 m), hold it there
# (c0500 event frames 1380-1410, 12.83 m) and strike it with the sword at 1410: it leaves as a flying slash on one
# straight line down towards the goal until the white-out takes the picture (1474-1488); in the match the ball comes
# into the goal down that line: the angled dive (docs/framework/technique.md §4e,
# docs/game/mechanics/move-mini-effects.md §7.6). Its aura (content\effects\caliburn_ball.toml, the sword slash) is turned
# along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move caliburn; caliburn_ball_fx.py --trajectory), the
# event ball b000001 s00 c_add_1_0 of c0500 (the effect's ball_pos follows it within 0.06 m):
#   event frames 1410 (the strike) - 1482 (the descent's end; it stays at 3.57 m to the cut's end, 1488):
#     (0.22, 12.83, -7.88) -> (18.54, 3.57, 18.80), 12.83 m -> 3.57 m over 32.4 m on the ground = 16.0 deg down,
#     a straight line (14.9 deg over the last 4 frames).
#   height     = 12.7: the strike (12.83 m) over a kick on the pitch (ball radius 0.11).
#   angle      = 16:   the c0500 shot line.
#   end_height = 1.2:  the line never reaches the pitch in the cut-in (3.57 m when the white-out comes); brought into
#                      the keeper's reach.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for this move (no conflict). The move has no _or / _mm / _cro variant.

