schema = "VRFW.technique/3"
# «Living Shots»: option «Todos los tiros son lejanos» (options.toml `all_long_shots`, default off). While it is on,
# every shot technique of the built skill table (the game's and every mod's new shots) gets the long-shot bit (4) of
# `skillEffectBitFlag` (docs/framework/technique.md §4c / §8b `[[edit_every]]`): the «Tiro largo» badge, the game's
# long-shot rules (it can be shot from outside the shoot zone, its power falls off per second of flight outside the
# area: `longShootAttenuationRatePerSecond`). Its other bits (chain, counter) are kept. Read when the technique data
# builds: a change applies at the next start.
option = "all_long_shots"

[[edit_every]]
category = "shoot"
add_effect_flags = 4
