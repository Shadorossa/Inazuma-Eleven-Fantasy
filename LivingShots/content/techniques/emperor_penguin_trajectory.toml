schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the flight of Pingüino emperador nº1 / nº2 / nº3 (Emperor Penguin; whs00610, whs00400 +
# _or, whs01050 + _or / _mm). Nacho 2026-10-10: every aura move its own flight, heights over distances
# (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7).
# nº1: kicked from 11.6 m, the ball comes down a ~29 deg line, a little steeper at first; nº2: from 5.8 m a straight
# 16 deg line onto the pitch at the goal mouth; nº3: an almost vertical drop from 25 m onto the pitch, then a low
# skim into the goal. Inazuma Fantasy declares a trajectory for whs00610 ("dive") and whs01050 ("drop_skim") too
# and loads after this mod: with both on, its rules win (a technique conflict note).
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move emperor_penguin_1 / _2 / _3):
# nº1: event ball s00 of c0900, event frames 1552-1616: [[0, 11.59], [9.30, 6.17], [14.50, 3.68]] (0.13 m); the last
# piece's slope continued down to 2.0 m (18.01 m in all), placed back from the goal point.
# nº2: event ball s00 of c0080, event frames 1570-1630: 5.84 m -> 0.18 m (the pitch) over 19.78 m, straight (0.06 m).
# nº3: event ball s01 of c0050, event frames 1392-1504: [[0, 25.21], [9.42, 10.90], [12.87, 1.90]] then 0.5-0.75 m
# to 58.66 m (1.03 m with 4 points: the drop is curved); placed on a 30 m shot: the drop starts 30 m before the
# goal point and reaches the pitch's skim (0.6 m) 5.87 m before it.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

