# «Living Shots» (shot_fx): the flight of Embate de lobo (Wolf Strike, whs02700) and of the moves with the same cut-in,
# Embate de lobo plateado (Silver Wolf Strike, whs02701) and Embate de Dragnova (Dragnova Strike, whs02702), cut-in
# ev60_02700. Nacho 2026-10-10: every aura move its own flight, heights over distances (docs/framework/technique.md
# §4e, docs/game/mechanics/move-mini-effects.md §7).
# In the cut-in (c0300) the ball is kicked from 1.21 m in a lob, over 13.7 m, and comes down to the pitch 41.5 m on;
# in the match it flies that lob into the goal at 2.0 m (39.93 m from the kick on the cut-in's path), counted back from
# the goal, a smooth curve through the measured points (a shorter shot starts at the lob's height at the kick).
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move wolf_strike): the event ball (s01) of
# ev60_02700 c0300, event frames 1348-1444: [[0.00, 1.21], [17.59, 13.55], [33.56, 9.13], [41.48, -0.42]] (largest
# height error 1.57 m on straight segments); 2.0 m is crossed at 39.93 m (between 37.29 m / 6.13 m and the end).
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

