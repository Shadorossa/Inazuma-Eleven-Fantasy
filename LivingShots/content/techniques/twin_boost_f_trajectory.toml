# «Living Shots» (shot_fx): the flight of Remate combinado F (Twin Boost F, whs00770 and whs00770_or, same cut-in
# ev60_00770; whs00770_or covered by the base move's rule). Nacho 2026-10-10: every aura move its own flight, heights
# over distances (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7).
# In the cut-in (c0500) the ball is kicked 21.6 m up and comes down a curve that steepens: ~5 deg, ~13 deg, then
# ~28 deg; the camera passes the ball at 21.5 m on and the effect's comet (ball_aura_set) flies on down to 7.0 m at
# 40.8 m. In the match the ball comes down that whole curve, brought to the goal (its last ~28 deg line extended to
# 2.0 m): on a shorter shot the ball starts at the curve's height at the kick.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move twin_boost_f): the event ball (s00) of
# ev60_00770 c0500, event frames 1406-1440 (to where the camera passes it): [[0.00, 21.61], [0.44, 21.50],
# [2.50, 21.24], [19.95, 17.71]] (0.20 m); the comet ball_aura_set (= the ball to 428) over effect frames 394-452:
# [[0.00, 21.62], [10.65, 19.76], [21.48, 17.24], [40.79, 7.00]] (0.16 m); the last piece's 27.9 deg line brought to
# 2.0 m = 50.2 m from the kick.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

