# «Living Shots» (shot_fx): the dive of Soy todopoderoso (I Am the Almighty, whs02340; covers whs02340_mm)
# (Nacho 2026-10-08: each move its own dive, matching its cut-in). In the cut-in's shot cut (c0040) the ball is hidden
# and the drill's tip is the shot: it leaves the vortex in the sky and bores down onto the goal mouth; in the match the
# ball starts at the tip's height over the kick point and comes into the goal at the drill's angle: the angled dive
# (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7.6). Close in the start comes down onto
# the 35° line; farther the ball leaves level at 10.8 m and bends into the 35° line half way down it. Its aura
# (content\effects\i_am_the_almighty_ball.toml, the drill behind the ball) is turned along the flight.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --move i_am_the_almighty): the drill tip
# _264__16l04_uzu_centerTOP_a1 of ev60023400 c0040, frames 440-574 (under the vortex until ~465, at the goal mouth at
# 574): (-2.22, 10.95, 37.51) -> (0.30, 3.34, 48.30), 10.95 m -> 3.34 m over 11.08 m on the ground = 34.5° down (35.0°
# over the last 4 frames, the drill's own axis). The vortex mouth itself hangs ~20 m up; the ball is the tip.
#   height     = 10.8: the start (10.95 m, the tip) over a kick on the pitch (ball radius 0.11).
#   angle      = 35:   the descent angle.
#   end_height = 2.0:  the cut-in ends at the goal mouth at 3.3 m (over the bar): brought to 2.0 m, under the
#                      crossbar, a high ball the keeper scene can play.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Inazuma Fantasy declares no trajectory
# for this move (no conflict).

