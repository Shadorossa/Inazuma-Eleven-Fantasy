schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the flight of Frente frío (Cold Front, whs02930 and its override whs02930_or), cut-in
# ev60_02930.
#
# In the cut-in (c0500) the ball is shot from 13.5 m up down towards the goal. Flight (owner rules 2026-10-21: never
# curved; a high shot starts at most 4.5 m up and ends at about 2.0 m): one straight line from 4.5 m at the kick into
# 2.0 m at the goal. unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball
# centre over the pitch (m); goal_points count back from the goal point, points from the kick.

# Frente frío (whs02930).
[[edit]]
target = "whs02930"
trajectory = { points = [[0.0, 4.5]], goal_points = [[0.0, 2.0]], unblockable = false }

# Frente frío (whs02930_or).
[[edit]]
target = "whs02930_or"
trajectory = { points = [[0.0, 4.5]], goal_points = [[0.0, 2.0]], unblockable = false }
