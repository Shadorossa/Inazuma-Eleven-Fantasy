schema = "VRFW.technique/3"
# «Living Shots» (shot_fx): the flight of Combo cósmico (Cosmic Blaster, whs02980; the same cut-in plays for
# whs02980_or and whs02980_or_02).
#
# The cut-in has no ball flight to measure (the ball zigzags between the players in space, the last cuts have no
# ball). Flight (owner rules 2026-10-21: never curved; a low shot starts at kick height): one straight line from 0.5 m
# at the kick into 2.0 m at the goal. speed = 25 (m/s): the aura's black hole stays at the kick point by sliding back
# from the ball at 25 m/s, so the shot flies at that speed.
# unblockable = false: the game's block rules (shot_fx changes no block rule). Heights are the ball centre over the
# pitch (m); points count from the kick, goal_points back from the goal point.

# Combo cósmico (whs02980).
[[edit]]
target = "whs02980"
trajectory = { points = [[0.0, 0.5]], goal_points = [[0.0, 2.0]], speed = 25.0, unblockable = false }

