# «Impulso efímero» (Ephemeral Boost, whs02040 and whs02040_mm, same cut-in; forest; cut-in ev60_02040): while the
# ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0500, the ball as a white / cyan
# comet): the spiky comet heads turning about the flight, the ball glows and the glowing ball, the tails and wind
# streaks behind it (grown from the kick point with the ball, their far end faded out), instead of the plain forest
# special-shot aura (ega0075d).
# The object is ev6204eb00 (effect/event/ev60/ev6204eb00/), built by research/scripts/ephemeral_boost_ball_fx.py from
# the cut-in's effect object ev60020400: c0500 replayed from 382, then held at frame 430, the heads turning on, ball at
# the origin flying +Z, x1. docs/game/media/ephemeral-boost-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\ephemeral_boost_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "ephemeral_boost"
from = "ega0075d"
object = "effect/event/ev60/ev6204eb00/ev6204eb00.objbin"

[[shot_aura]]
name = "ephemeral_boost"
when = { techniques = ["whs02040", "whs02040_mm"] }
aura = "ephemeral_boost"
like = "ega0075d"
