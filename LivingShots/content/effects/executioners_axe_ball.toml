# «Hacha del Azote negro» (Executioner's Axe, whs01880; forest shot, cut-in ev60_01880): while the ball flies to the
# goal after the cut-in it keeps the look of the cut-in's last cut (c0400, the ball struck by the keshin's axe,
# skimming the pitch): the three dark flame fins standing up from it, its smokes and ground mark, the light streak on
# the pitch and the earth thrown up behind it, instead of the plain forest special-shot aura (ega0075d). The object
# is ev6188ea00 (effect/event/ev60/ev6188ea00/), built by research/scripts/executioners_axe_ball_fx.py from the
# cut-in's effect object ev60018800: c0400 replayed from its first frame (368), then held at frame 436, ball at the
# origin flying +Z, x1. Left out: the scenery (backdrop, ground, skies), the strike's shock and the axe's auras, the
# white smokes at the kick point, the keshin's auras. docs/game/media/executioners-axe-ball-fx.md. The trigger copies
# the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the ball's velocity
# every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\executioners_axe_trajectory.toml. Mod «Living
# Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "executioners_axe"
from = "ega0075d"
object = "effect/event/ev60/ev6188ea00/ev6188ea00.objbin"

[[shot_aura]]
name = "executioners_axe"
when = { techniques = ["whs01880"] }
aura = "executioners_axe"
like = "ega0075d"
# the aura's replay (68 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 68 }
