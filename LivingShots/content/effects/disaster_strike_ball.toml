# «Disaster Strike» («Golpe cataclismo», whs02080 and Inazuma Fantasy's whs02080_mm, same cut-in; mountain shot,
# cut-in ev60_02080): while the ball runs to the goal after the cut-in it keeps the look of the cut-in's last cut
# (c0040, the ball just kicked along the pitch) instead of the plain mountain special-shot aura (ega0075a): its two
# brown-gold aura shells (spinning as in the cut-in), the small glow discs on it, the red lightning round it
# (flickering as in the cut-in), the dust wake behind it, and the ground furrow it ploughs with its dust waves and
# flying pebbles.
# The object is ev6208ds00 (assets\data\{common,dx11}\effect\event\ev60\ev6208ds00\), built by
# research/scripts/disaster_strike_ball_fx.py from the cut-in's effect object ev60020800 (c0040 held at frame 340,
# shells' spin measured from their keys, lightning flicker and pebbles replayed, texture flow running on through a
# 30 s loop; placed through its groups and top-level joints, the root still): the ball at the origin, its run along
# +Z, ball parts and wake x1.35, the furrow x1 on the pitch (depth test on, floor 0.03 m up, leading edge on the
# ball). docs/game/media/disaster-strike-ball-fx.md.
# The trigger copies the mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along
# the ball's velocity every frame (aura-balon-tiro.md §2b). The aura lives from the first flight frame to the end of
# the shot like every [[shot_aura]] (the framework starts and stops it: no per-aura key).
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "disaster_strike_furrow"
from = "ega0075a"
object = "effect/event/ev60/ev6208ds00/ev6208ds00.objbin"

[[shot_aura]]
name = "disaster_strike_furrow"
when = { techniques = ["whs02080", "whs02080_mm"] }
aura = "disaster_strike_furrow"
like = "ega0075a"
