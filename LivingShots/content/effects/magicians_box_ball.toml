# «Caja de sorpresas» (Magician's Box, whs01810; forest shot, cut-in ev60_01810): while the ball flies to the goal after
# the cut-in it keeps the look of the cut-in's last cut (c0500, the ball shot out of the bursting box): its dark purple
# tip streak and the three purple-black streak sheets along its way, instead of the plain forest special-shot aura
# (ega0075d).
# The object is ev6181mb00 (effect/event/ev60/ev6181mb00/), built by research/scripts/magicians_box_ball_fx.py from the
# cut-in's effect object ev60018100: c0500 replayed from its first frame (396), then held at frame 440 (the sheets'
# texture scales held, their scrolls running on), ball at the origin flying +Z, x1. Left out: the box's burst at the
# kick point (shards, smoke, impact, light, white-out) and the keshin, which stay there.
# docs/game/media/magicians-box-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\magicians_box_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "magicians_box"
from = "ega0075d"
object = "effect/event/ev60/ev6181mb00/ev6181mb00.objbin"

[[shot_aura]]
name = "magicians_box"
when = { techniques = ["whs01810"] }
aura = "magicians_box"
like = "ega0075d"
# the aura's replay (44 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 44 }
