# «Coletazo de Belion» (Belion Whip, whs02720, forest; with the same cut-in «Coletazo de Begiran» / Begiran Whip
# whs02721, void, and «Coletazo de Pelion» / Pelion Whip whs02722, wind; cut-in ev60_02720): while the ball flies to
# the goal after the cut-in it keeps the look of the cut-in's last cut (c0300, the ball whipped down into a skim): its
# glowing core, grids and spiked rings, and the blue / purple X slash blades turning round it, instead of the plain
# special-shot aura of its element (ega0075d / ega0075e / ega0075b). The object is ev6272bw00
# (effect/event/ev60/ev6272bw00/), built by research/scripts/belion_whip_ball_fx.py from the cut-in's effect object
# ev60027200: c0300 replayed from the whip's strike (394), then held at frame 434, ball at the origin flying +Z, x1.
# Left out: the black backdrop, the pink strike flash X, the earlier cuts' parts, the beast (it stays at the kick).
# docs/game/media/belion-whip-ball-fx.md. One aura, one trigger per element: each copies its element's special-shot
# aura row (like): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). Its
# flight: content\techniques\belion_whip_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "belion_whip"
from = "ega0075d"
object = "effect/event/ev60/ev6272bw00/ev6272bw00.objbin"

[[shot_aura]]
name = "belion_whip"
when = { techniques = ["whs02720"] }
aura = "belion_whip"
like = "ega0075d"
# the aura's replay (40 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 40 }

[[shot_aura]]
name = "belion_whip_void"
when = { techniques = ["whs02721"] }
aura = "belion_whip"
like = "ega0075e"
# the aura's replay (40 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 40 }

[[shot_aura]]
name = "belion_whip_wind"
when = { techniques = ["whs02722"] }
aura = "belion_whip"
like = "ega0075b"
# the aura's replay (40 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 40 }
