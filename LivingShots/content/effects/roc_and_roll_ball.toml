# «Asalto aéreo» (Roc and Roll, whs01840; mountain shot, cut-in ev60_01840): while the ball flies to the goal after
# the cut-in it keeps the look of the cut-in's last cut (c0400, the ball struck down from 9.6 m, diving to skim the
# pitch): its black core, blue light and dark shells, the claws' black strokes and dust round it, and behind it the
# tracks gouged in the pitch and the dust streaks, instead of the plain mountain special-shot aura (ega0075a). The
# object is ev6184rr00 (effect/event/ev60/ev6184rr00/), built by research/scripts/roc_and_roll_ball_fx.py from the
# cut-in's effect object ev60018400: c0400 replayed from the strike (380), then held at frame 458, ball at the origin
# flying +Z, x1. Left out: the claw slash and impact at the kick point, the wind-up's winds, the drifting feathers of
# the kick point, the keshin. docs/game/media/roc-and-roll-ball-fx.md. The trigger copies the mountain special-shot
# aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along the ball's velocity every frame
# (aura-balon-tiro.md §2b). Its flight: content\techniques\roc_and_roll_trajectory.toml. Mod «Living Shots»
# (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own cut-in effects by
# research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "roc_and_roll"
from = "ega0075a"
object = "effect/event/ev60/ev6184rr00/ev6184rr00.objbin"

[[shot_aura]]
name = "roc_and_roll"
when = { techniques = ["whs01840"] }
aura = "roc_and_roll"
like = "ega0075a"
# the aura's replay (78 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 78 }
