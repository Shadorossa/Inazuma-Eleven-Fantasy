# «Bloodsucker Bite» («Mordisco de vampiro», whs02300, mountain shot, cut-in ev60_02300): while the ball flies to the
# goal it is wrapped in the cut-in's OWN spiked blood aura (the last cut c0200, the ball kicked from ~10 m up in
# front of the moon, held at frame 376, the blood's texture flow running on), the red blood streaks of its path
# trailing behind it, instead of the plain mountain special-shot aura (ega0075a). The sky and the moon, the
# camera-facing black front plate, the flat glow discs behind the ball (bars from the touchline), the blood powder
# discs and specks left along the path and the dummy ball are dropped; x0.2 of the cut-in size (aura ~0.6 m wide,
# streaks ~5 m behind the ball). The object is ev6230bs00 (assets\data\{common,dx11}\effect\event\ev60\ev6230bs00\),
# built by research/scripts/bloodsucker_bite_ball_fx.py from ev60023000; docs/game/media/bloodsucker-bite-ball-fx.md.
# The trigger copies the mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along
# the ball's velocity every frame (aura-balon-tiro.md §2b). The move has no _or / _mm / _cro variant.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "bloodsucker_bite_blood"
from = "ega0075a"
object = "effect/event/ev60/ev6230bs00/ev6230bs00.objbin"

[[shot_aura]]
name = "bloodsucker_bite_blood"
when = { techniques = ["whs02300"] }
aura = "bloodsucker_bite_blood"
like = "ega0075a"
