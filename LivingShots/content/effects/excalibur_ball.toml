# «Excálibur» (Excalibur, whs00970, wind long shot, cut-in ev60_00970): while the ball runs to the goal after the
# cut-in it rides the slash wave of the cut-in's last cut (c0400) instead of the plain wind long-shot aura (ega0085b);
# Nacho 2026-10-07: «el disparo … tiene que ir pegado al suelo como la animación de su disparo» (the shot skims the
# pitch: Inazuma Fantasy's techniques\move_mini_effects.toml trajectory = "ground", so the wave stays upright on the ground).
# The wave is ev6097sw00 (assets\data\{common,dx11}\effect\event\ev60\ev6097sw00\), built by
# research/scripts/excalibur_ball_fx.py from the cut-in's effect object ev60009700: the cyan-white blades (_500_slash,
# _540/_560/_580_slash_c0400, the _520 streak) and the sand dust wall (_200/_600/_750 smoke waves) as they run in c0400
# (from frame 300, their texture flow looping), the ground cut and fake particles dropped (static along the whole
# line, 22 m of it ahead of the ball); ball at the origin with the pitch 0.1 m under it, the run along +Z, x1.0
# (blades up to ~4 m at the ball, the wake ~18-24 m behind).
# 1.3.6: placed through its top-level joints (the engine ignores an effect root's tracks: placed by its root up to
# 1.3.5, the wave rode 12.7 m behind the ball, seen mid-flight only) and a 30 s loop (the game plays `loop` once):
# docs/game/media/excalibur-ball-fx.md §6.
# The ball's aura trigger copies the wind long-shot aura's row (like = "ega0085b"), whose callback
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b).
# docs/game/media/excalibur-ball-fx.md.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
# Its ground trajectory is declared by this mod too since 2026-10-08 (content\techniques\excalibur_trail.toml, the same value as
# Inazuma Fantasy's): the aura skims the pitch into the goal with or without Inazuma Fantasy.
schema = "VRFW.effect/1"

[[effect]]
name = "excalibur_wave"
from = "ega0085b"
object = "effect/event/ev60/ev6097sw00/ev6097sw00.objbin"

[[shot_aura]]
name = "excalibur_wave"
when = { techniques = "whs00970" }
aura = "excalibur_wave"
like = "ega0085b"

# The ground trail is content\effects\ground_marks.toml (excalibur_mark, built on ega2011) since 1.3.6.
