# «Lanza de carámbanos» (Icicle Road, whs01830; wind shot, cut-in ev60_01830): while the ball flies to the goal after
# the cut-in it keeps the look of the cut-in's last cut (c0300, the ball kicked low along the pitch): its ice ball, ice
# caps and tails, the ground freezing under it and bursting into ice crystals behind it, the blizzard streak and the
# ice glints, instead of the plain wind special-shot aura (ega0075b).
# The object is ev6183ir00 (effect/event/ev60/ev6183ir00/), built by research/scripts/icicle_road_ball_fx.py from the
# cut-in's effect object ev60018300: c0300 replayed from the ice caps' birth (314), then held at frame 428, ball at the
# origin flying +Z, x1. Left out: the cut's scenery (sky, ice floor, hill, background ice / smokes / crystals), the
# keshin's smokes and the kick slashes at the kick point, the camera-attached blizzard cards, the wind-up's ball
# effects, the ptlb emitters. docs/game/media/icicle-road-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\icicle_road_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "icicle_road"
from = "ega0075b"
object = "effect/event/ev60/ev6183ir00/ev6183ir00.objbin"

[[shot_aura]]
name = "icicle_road"
when = { techniques = ["whs01830"] }
aura = "icicle_road"
like = "ega0075b"
# the aura's replay (114 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 114 }
