# «Desfile de pingüinos» (Royal Penguin Parade, whs10100; forest; cut-in ev60_10100): while the ball flies to the goal
# after the cut-in it carries the end of the cut-in's last cut (c0400 frame 551) instead of the plain forest
# special-shot aura (ega0075d): the king penguin's rainbow aura burst round the ball, the white wind streaming back, the
# ball's own light, the king penguin himself 1.8 m behind the ball and four little penguins with their lights behind
# him (brought nearer: 6-10 m behind the ball), the penguins' coloured tails.
# The object is ev6101pp00 (effect/event/ev60/ev6101pp00/), built by research/scripts/penguin_parade_ball_fx.py from the
# cut-in's effect object ev60101000 and the event's penguin models (ev60_10100 / ev60_10101 / ev60_10102, baked into
# rigid meshes at their pose of frame 551, drawn with an effect material). docs/game/media/penguin-parade-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame. Its flight: content\techniques\penguin_parade_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "penguin_parade"
from = "ega0075d"
object = "effect/event/ev60/ev6101pp00/ev6101pp00.objbin"

[[shot_aura]]
name = "penguin_parade"
when = { techniques = "whs10100" }
aura = "penguin_parade"
like = "ega0075d"
