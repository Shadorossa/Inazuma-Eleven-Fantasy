# «Prisión escarlata» (Crimson Prison, whs02380; mountain shot, cut-in ev60_02380): while the ball flies to the goal
# after the cut-in it keeps the look of the cut-in's last cut (c0500, the ball breaking its chains and diving ~21 deg
# inside its red crystal cage): its lights and sparks, the red crystal cage round it with its red auras and
# lightning, and the broken chain links flying off, instead of the plain mountain special-shot aura (ega0075a). The
# object is ev6238cp00 (effect/event/ev60/ev6238cp00/), built by research/scripts/crimson_prison_ball_fx.py from the
# cut-in's effect object ev60023800: c0500 replayed from the cage bursting (394), then held at frame 450, ball at the
# origin flying +Z, x1. Left out: the sky backdrop, the chains and their fixings, the first frames' shock, the
# top-level parts gone before the cut's end, the ptlb emitters, the keshin.
# docs/game/media/crimson-prison-ball-fx.md. The trigger copies the mountain special-shot aura's row (like =
# "ega0075a"): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). Its
# flight: content\techniques\crimson_prison_trajectory.toml. Mod «Living Shots» (shot_fx): visuals only. The effect
# objects are generated on the author's PC from the game's own cut-in effects by research/scripts/*_ball_fx.py (never
# committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "crimson_prison"
from = "ega0075a"
object = "effect/event/ev60/ev6238cp00/ev6238cp00.objbin"

[[shot_aura]]
name = "crimson_prison"
when = { techniques = ["whs02380"] }
aura = "crimson_prison"
like = "ega0075a"
# the aura's replay (40 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 40 }
