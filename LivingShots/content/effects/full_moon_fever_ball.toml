# «Fiebre de luna llena» (Full Moon Fever, whs02400; forest shot, cut-in ev60_02400): while the ball flies to the goal
# after the cut-in it keeps the look of the cut-in's last cut (c0400, the ball turned into a blue full moon diving
# ~30 deg from 35 m): the moon with its ring, glow discs, inner shells and craters, and its last blue auras, instead
# of the plain forest special-shot aura (ega0075d). The object is ev6240fm00 (effect/event/ev60/ev6240fm00/), built by
# research/scripts/full_moon_fever_ball_fx.py from the cut-in's effect object ev60024000: c0400 replayed from the kick
# (414), then held at frame 486, ball at the origin flying +Z, x1. Left out: the night sky backdrop, the keshin's hand
# auras, the kick flash and ring at the kick point, the keshins. docs/game/media/full-moon-fever-ball-fx.md. The
# trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\full_moon_fever_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "full_moon_fever"
from = "ega0075d"
object = "effect/event/ev60/ev6240fm00/ev6240fm00.objbin"

[[shot_aura]]
name = "full_moon_fever"
when = { techniques = ["whs02400"] }
aura = "full_moon_fever"
like = "ega0075d"
# the aura's replay (72 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 72 }
