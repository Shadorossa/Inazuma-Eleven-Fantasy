# «Lanza gélida» (Icebreaker, whs03360 and whs03360_or, same cut-in; wind shot of two players, cut-in ev60_03360):
# while the ball flies to the goal after the cut-in it keeps the look of the end of the cut-in's last cut (c0500 538-
# 546, the ball shot out of the giant snowflake): the red spiral beam lit along its way from the kick point to the
# ball (beam, beam light, its root flare at the kick end) with its red spirals winding and turning round it, and at
# the kick the ice aura and ice shell on the ball, instead of the plain wind special-shot aura (ega0075b).
# The object is ev6336ib00 (effect/event/ev60/ev6336ib00/), built by research/scripts/icebreaker_ball_fx.py from the
# cut-in's effect object ev60033600: the cut-in's motion from the kick (538) replayed with every part kept in its place
# relative to the ball (the beam stays where the ball was shot from), then held at c0500 frame 546 (the ball at the
# beam's tip, the beam 15 m back to the kick point, texture flow running on, the spirals turning on), ball at the
# origin flying +Z, x1. Left out: the backdrop, ice trees and shards, the snowflake and its light waves, the kick
# impact rings, flat camera-facing discs and camera cards. docs/game/media/icebreaker-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\icebreaker_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "icebreaker"
from = "ega0075b"
object = "effect/event/ev60/ev6336ib00/ev6336ib00.objbin"

[[shot_aura]]
name = "icebreaker"
when = { techniques = ["whs03360", "whs03360_or"] }
aura = "icebreaker"
like = "ega0075b"
# the aura's replay (8 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 8 }
