# «Pingüino emperador n.º 2 + Tiburón» (Emperor Penguin No. 2 feat. Shark, whs03330 and whs03330_or, same cut-in;
# forest shot of three players, cut-in ev60_03330): while the ball flies to the goal after the cut-in it keeps the
# look of the cut-in's last cut (c0600, the ball shot down into the goal): the SHARK carrying it at its snout and the
# FIVE PENGUINS following far behind (the cut-in's own waza models), the ball's glow and the shark's eye lights,
# instead of the plain forest special-shot aura (ega0075d).
# The object is ev6333ps00 (effect/event/ev60/ev6333ps00/), built by research/scripts/emperor_penguin_2_shark_ball_fx.py
# from the cut-in's effect object ev60033300 and the waza models ev60_03100 (shark) and ev60_03330 (penguins), baked
# as rigid segments by waza_replay_aura.py (several models in one aura): the cut-in's motion from c0600's start (438)
# replayed with every part, the shark and the penguins in their place relative to the ball, then held at frame 453
# (the shark's swimming going on, back and forth), ball at the origin flying +Z, x0.4. Left out: the water spray walls
# and eye light streaks fixed along the path. docs/game/media/emperor-penguin-2-shark-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\emperor_penguin_2_shark_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "emperor_penguin_2_shark"
from = "ega0075d"
object = "effect/event/ev60/ev6333ps00/ev6333ps00.objbin"

[[shot_aura]]
name = "emperor_penguin_2_shark"
when = { techniques = ["whs03330", "whs03330_or"] }
aura = "emperor_penguin_2_shark"
like = "ega0075d"
# the aura's replay (15 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 15 }
