# «Living Shots» (shot_fx): the ground-trail pieces (content\techniques\*.toml `ground_trail`, docs/game/mechanics/move-mini-effects.md §9.12).
# Built on the retail grounding dust ega2011, the one battle effect proven to draw when the effect manager plays it loose
# in a match (A/B in game 2026-10-08 14:07: its pieces seen along Chut ancestral's path through the very same request;
# the event copy ev6097gs00 never drew): research/scripts/ground_mark_fx.py makes a [[recolor]] copy of ega2011 per move
# (container, skeleton, effect_define template row and group: ega2011's), drops its particles and puts in the move's
# OWN ground mark from its cut-in (meshes baked flat at the frame the mark is fully drawn, its material and textures,
# priority <= 30, the root still), 1.4 x 1.8 m along +Z (the play request turns it along the shot); clips `life` (lit
# 3.5 s, faded to 0 in 1 s) and `gone` (alpha 0): in = life, loop = gone, so a piece plays once and stays invisible.
# Files generated on the author's PC under assets\data\{common,dx11}\effect\battle\common\egx*\ (never committed).
# 1.3.7 (in game 17:49: Doom Break's furrow drew, Excálibur's / Katana Kick's did not; it drew over the players, stuck out
# ahead of the ball and was still there at the next kickoff): every mark has depth test on, no soft fade, its leading
# edge on the ball's point (body behind), and is played 0.12 m over the pitch; the technique type removes each piece
# after `life` s and all of them on save / goal / shot end (content\techniques\*.toml, move-mini-effects.md §9.14).
schema = "VRFW.effect/1"

# Excálibur (whs00970): the c0300 ground cut (Effect_T1_65) of ev60009700, frame 289.
[[effect]]
name = "excalibur_mark"
from = "ega2011"
object = "effect/battle/common/egx0970/egx0970.objbin"
clips = { in = "life", loop = "gone", out = "" }

# Chut ancestral / Katana Kick (whs01500): the c0300 hollow trench (MA_mat_hollow_3) of ev60015000, frame 300.
[[effect]]
name = "katana_mark"
from = "ega2011"
object = "effect/battle/common/egx1500/egx1500.objbin"
clips = { in = "life", loop = "gone", out = "" }
