# «Remate asalto» (Assault Shot, whs00890, fire, cut-in ev60_00890): while the ball flies to the goal after the cut-in it
# travels among the cut-in's rain of seven burning balls with their white-gold streaks, as they stand at the end of its
# last cut (c0400 frame 399: gathered round the ball), instead of the plain fire special-move aura (ega0075c). The real
# match ball is not drawn meanwhile (`hide_ball`, techniques\assault_shot_trajectory.toml).
# The object ev6089as_7 (assets\data\{common,dx11}\effect\event\ev60\ev6089as_7\) is built by
# research/scripts/assault_shot_ball_fx.py from the cut-in's own effect object ev60008900 (the same joints and cuts as
# Doom Rain's ev60013900, its own burning balls, smoke and streak meshes and colours) with Doom Rain's pipeline
# (doom_rain_ball_fx.py): held at frame 399 and looped (texture scrolls, each ball's tumble and sway), spread round the
# ball, the rain's direction along +Z, x0.85. The trigger row copies the fire special-move aura's (like = "ega0075c":
# its callback turns +Z along the ball's velocity). docs/game/media/assault-shot-ball-fx.md.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "assault_shot"
from = "ega0075c"
object = "effect/event/ev60/ev6089as_7/ev6089as_7.objbin"

[[shot_aura]]
name = "assault_shot"
when = { techniques = "whs00890" }
aura = "assault_shot"
like = "ega0075c"
