# «Atomic Flare» («Llamarada atómica», whs00790 and its _mm copy whs00790_mm, fire shot, counter shot:
# skillEffectBitFlag 16, cut-in ev60_00790): while the ball flies to the goal it keeps the cut-in's OWN look at its
# end (the cut c0030, the ball struck out of the sun, fallen onto the pitch and running low into the goal, held at
# frame 330): a small spinning sun (the swirl disc, its red rim and the flame wreath and fire ring round it, all
# spinning as in the cut-in, texture flow running on) with its fire tail streaming behind, instead of the plain fire
# special-shot aura (ega0075c). As in the cut-in the sun's discs face forward along the flight and spin about it
# (set exactly on the flight; an edge-on spinning ring from the touchline); the tail (~19 m in the cut-in, a bent arc rising up the
# path from the sun) and the thin shoot strands are straightened, cut to x0.14 and laid straight behind the ball; the
# cut-in's flames are left behind in chunks (its ptlb). The big sun and its prominences, backdrops, camera plate, fire
# walls, foot flames and impact flash are dropped; x2.5 of the cut-in size (sun ~1.3 m, flame wreath ~2.2 m, tail
# ~6.6 m).
# The object is ev6079af00 (assets\data\{common,dx11}\effect\event\ev60\ev6079af00\), built by
# research/scripts/atomic_flare_ball_fx.py from ev60007900; docs/game/media/atomic-flare-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"; skillEffectBitFlag 16 = counter shot, not a
# chain or long shot): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b).
# No other technique key uses ev60_00790.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "atomic_flare_sun"
from = "ega0075c"
object = "effect/event/ev60/ev6079af00/ev6079af00.objbin"

[[shot_aura]]
name = "atomic_flare_sun"
when = { techniques = ["whs00790", "whs00790_mm"] }
aura = "atomic_flare_sun"
like = "ega0075c"
