# «White Hurricane» («Ciclón blanco», whs01670, wind shot, cut-in ev60_01670): while the ball flies to the goal it is
# wrapped in the cut-in's OWN white wind sheath (the last cut c0400, the ball kicked down out of the white hurricane,
# held at frame 380, the wind's texture flow running on), the hurricane's white wind tunnel trailing behind it,
# instead of the plain wind special-shot aura (ega0075b). The sky backdrop and clouds, the kick flash and its lines,
# the camera-facing flares round the ball (30-40 m flat lights: bars from the touchline), the 40 m lines and rings
# under the ball and the fake particles are dropped; x0.15 of the cut-in size (sheath ~0.4 m wide, tunnel ~4.6 m
# behind the ball). The object is ev6167wh00 (assets\data\{common,dx11}\effect\event\ev60\ev6167wh00\), built by
# research/scripts/white_hurricane_ball_fx.py from ev60016700; docs/game/media/white-hurricane-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). whs01670_mm (the _mm variant) and whs01670_cro (the Chronicle
# copy, a long shot: retail aura ega0085b) share the cut-in.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "white_hurricane_wind"
from = "ega0075b"
object = "effect/event/ev60/ev6167wh00/ev6167wh00.objbin"

[[shot_aura]]
name = "white_hurricane_wind"
when = { techniques = ["whs01670", "whs01670_mm", "whs01670_cro"] }
aura = "white_hurricane_wind"
like = "ega0075b"
