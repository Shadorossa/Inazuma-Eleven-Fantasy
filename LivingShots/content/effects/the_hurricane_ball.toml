# «Huracán» (The Hurricane, whs01120 and whs01120_or, same cut-in; wind shot of two players, cut-in ev60_01120): while
# the ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0500, the ball shot low and
# almost level): the lacy cyan-white wind beam streaming ~20 m back from it with its wind sheaths, the ice block round
# the ball and the ice grains whirling along the beam (turning as in the cut-in), and the three wind rings it throws
# back early in the flight, instead of the plain wind special-shot aura (ega0075b).
# The object is ev6112hu00 (effect/event/ev60/ev6112hu00/), built by research/scripts/the_hurricane_ball_fx.py from
# the cut-in's effect object ev60011200: the cut-in's motion replayed from the cut's first frame (416), then held at
# c0500 frame 470 (texture flow running on, the turning parts turning on), ball at the origin flying +Z, x1. Nothing
# left out (c0500 has no backdrop or kick part). docs/game/media/the-hurricane-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\the_hurricane_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "the_hurricane"
from = "ega0075b"
object = "effect/event/ev60/ev6112hu00/ev6112hu00.objbin"

[[shot_aura]]
name = "the_hurricane"
when = { techniques = ["whs01120", "whs01120_or"] }
aura = "the_hurricane"
like = "ega0075b"
# the aura's replay (54 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 54 }
