# «Dragon Drive» («Rizo de dragón», whs01990, wind chain shot, cut-in ev60_01990): while the ball flies to the goal the
# cut-in's yellow dragon leads it: the ball on the glowing orb of the dragon's head, the snout to the goal, the body
# and the flame spikes of its back running straight back behind it along the flight (owner 2026-10-21: shot auras are
# never curved; the head is the front-most part), instead of the plain wind special-shot aura (ega0075b). The dragon
# is the one of the cut-in's first cut (c0010) in its end pose (frame 86, texture flow running on), its curved body
# laid straight and its back scales lined up behind the head as the cut-in has them at frame 68; x1. Dropped: the
# black backdrop, the kick flash, the fake particles, the coiling dragon of c0020 and the shot of c0030 (light beam,
# shock rings, speed lines).
# The object is ev6199dd00 (assets\data\{common,dx11}\effect\event\ev60\ev6199dd00\), built by
# research/scripts/dragon_drive_ball_fx.py from ev60019900; docs/game/media/dragon-drive-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"; the move is a chain shot, skillEffectBitFlag
# 8: in a chain of 2+ the retail aura is ega0080b, the rule fires on the move either way): CB_SkillShootBallAura turns
# +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). The flight: content	echniques\dragon_drive_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

