# «Astrorremate» (Astro Break, whs00500; forest, cut-in ev60_00500): while the ball flies to the goal after the
# cut-in, the cut-in's look of the ball skimming the pitch goes with it instead of the plain forest special-move aura
# (ega0075d): the purple globe with its rings and back glows, the light cross flaring on it every 6 frames, the smoke
# rising over it and the dust wings it throws up on both sides; the furrow it ploughs runs on the grass from the kick
# point to the ball, growing with the shot, and the crater under the ball.
# The object ev6050ab00 (assets\data\{common,dx11}\effect\event\ev60\ev6050ab00\) is built by
# research/scripts/astro_break_ball_fx.py from the cut-in's effect object ev60005000 (cutin_replay_aura.py; c0030
# from 282 (formed) to 306, then held with its texture scrolls running on; every part in the cut-in's orientation, x1,
# priorities <= 30). The trigger row copies the forest special-move aura's (like = "ega0075d": its callback turns +Z
# along the ball's velocity). docs/game/media/astro-break-ball-fx.md. Its flight: content\techniques\
# astro_break_trajectory.toml. No other technique key uses ev60_00500.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "astro_break"
from = "ega0075d"
object = "effect/event/ev60/ev6050ab00/ev6050ab00.objbin"

[[shot_aura]]
name = "astro_break"
when = { techniques = ["whs00500"] }
aura = "astro_break"
like = "ega0075d"
