# «Doom Rain» (Doom Rain, whs01390, fire long shot, cut-in ev60_01390): while the ball flies to the goal after the
# cut-in it travels among the rain of dark balls of the cut-in's last cut (c0400), spread around it, instead of the plain
# fire long-shot aura (ega0085c). With Inazuma Fantasy the shot is a split shot (Inazuma Fantasy's techniques\move_mini_effects.toml `split_shot`: its power
# in 7 balls; a block takes balls away and the shot flies on with the power of the rest); the variant with the balls
# left is shown (`split_left`, shared by the technique type at run time: vr_framework::shot_split).
# The variants ev6139dl_<n> (assets\data\{common,dx11}\effect\event\ev60\ev6139dl_<n>\, n = balls shown) are built
# by research/scripts/doom_rain_ball_fx.py from the cut-in's effect object ev60013900: the seven dark balls with
# their black flame rings, glows and red-black streaks at c0400 frame 345, spread around the real ball (x2.4 across,
# x2.0 up, x0.45 along the path: ~10 m wide, ~4 m high), the rain's direction along +Z, x0.85; the balls lost first
# are the farthest from the ball. The trigger rows copy the fire long-shot aura's (like = "ega0085c": its callback
# turns +Z along the ball's velocity). Load order: the last matching rule wins, so the 7-ball rule (no split_left:
# also the look when the split state is not known) comes first; without a split shot only it matches. docs/game/media/doom-rain-ball-fx.md.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
# A trajectory named below (dive, ground, drop_skim, split shot) is a GAMEPLAY mini-effect of Inazuma Fantasy, not of
# this mod: without it the aura rides the game's own flight.
schema = "VRFW.effect/1"

