# «Perseus Strike» («Orbe de Perseo», whs03240, forest shot of three players, cut-in ev60_03240): while the ball flies
# to the goal it is wrapped in the cut-in's OWN cyan light orb (the last cut c0500, the ball struck down by the sword
# of Perseus, held at frame 368, the orb's texture flow running on: the light dome and its rim, the spiky outer aura,
# the inner swirl, the small lights, the heat blur and the sparks on the ball) instead of the plain forest
# special-shot aura (ega0075d). The sword (planted in the pitch ahead of the kick spot, 18 m), the shoot rings left
# along the path (perpendicular to the flight: bars from the touchline), the black backdrop, the camera-front blur,
# the 5-6 m flat camera-facing lights round the ball and the kick's flashes, charge strips, rings and squares are
# dropped; x0.6 of the cut-in size (orb ~0.6 m wide). The object is ev6324ps00
# (assets\data\{common,dx11}\effect\event\ev60\ev6324ps00\), built by research/scripts/perseus_strike_ball_fx.py from
# ev60032400; docs/game/media/perseus-strike-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d", skillEffectBitFlag 0): CB_SkillShootBallAura
# turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). The move has no _or / _mm / _cro variant.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "perseus_strike_orb"
from = "ega0075d"
object = "effect/event/ev60/ev6324ps00/ev6324ps00.objbin"

[[shot_aura]]
name = "perseus_strike_orb"
when = { techniques = ["whs03240"] }
aura = "perseus_strike_orb"
like = "ega0075d"
