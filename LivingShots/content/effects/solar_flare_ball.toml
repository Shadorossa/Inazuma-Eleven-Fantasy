# «Llamarada solar» (Solar Flare, whs01860; fire shot, cut-in ev60_01860): while the ball flies to the goal after the
# cut-in it keeps the look of the cut-in's last cut (c0500, the ball inside its small sun, kicked from 11.2 m and
# diving ~30 deg): the sun round the ball (its spheres, cores, back glow, ring auras, swirls and fire grains, the
# fire drops round it), instead of the plain fire
# special-shot aura (ega0075c). The object is ev6186sf00 (effect/event/ev60/ev6186sf00/), built by
# research/scripts/solar_flare_ball_fx.py from the cut-in's effect object ev60018600: c0500 replayed from its first
# frame (390), then held at frame 504, the ball being the sun's joint `shoot`, ball at the origin flying +Z, x1. Left out: the kick's giant shock rings and kick waves, the sky backdrop, the ptlb emitters, the keshin.
# docs/game/media/solar-flare-ball-fx.md. The trigger copies the fire special-shot aura's row (like = "ega0075c"):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). Its flight:
# content\techniques\solar_flare_trajectory.toml. Mod «Living Shots» (shot_fx): visuals only. The effect objects are
# generated on the author's PC from the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed:
# research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "solar_flare"
from = "ega0075c"
object = "effect/event/ev60/ev6186sf00/ev6186sf00.objbin"

[[shot_aura]]
name = "solar_flare"
when = { techniques = ["whs01860"] }
aura = "solar_flare"
like = "ega0075c"
# the aura's replay (114 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 114 }
