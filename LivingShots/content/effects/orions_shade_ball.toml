# «Orion's Shade» («Sombra de Orión», whs03060, void shot, cut-in ev60_03060): while the ball flies to the goal it is
# the head of the cut-in's OWN red-and-black shadow flame (the last cut c0500, the shot coming down out of the sky,
# held at frame 440, texture flow running on): the flat flame card of last_shoot_set (_500_main_01 / _600_main_02),
# stood upright along the flight and seen face on from the touchline, its tail fading out, instead of the plain void
# special-shot aura (ega0075e); the ball at the flame's own narrow bright tip, the shot's head as c0500 shows it.
# With it, as in the cut-in: its rings round the flight axis, emitted at the head every 19 frames, growing and running
# back along the flame (~0.4 -> 3.4 m across). The ball's c0400 set (not with the shot in c0500), the c0400 charge
# (cross, shock rings, lines, kick sparks), the shadow clones and their lightning, the players' round aura, ground
# disc, jump / kick sets and the front white-out / blur cards are dropped; kept materials draw both faces; x0.15 of
# the cut-in size, its own taper kept (Nacho 2026-10-08: bigger, opening up towards the tail): ~5 m to the faded
# tail, ~3-5 m tall at its widest part.
# The object is ev6306os00 (assets\data\{common,dx11}\effect\event\ev60\ev6306os00\), built by
# research/scripts/orions_shade_ball_fx.py from ev60030600; docs/game/media/orions-shade-ball-fx.md.
# The trigger copies the void special-shot aura's row (like = "ega0075e", skillColorIdx 4, skillEffectBitFlag 0):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). No _or / _mm / _cro
# variant of whs03060 exists (skill_config, Inazuma Fantasy): no other key uses this cut-in.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "orions_shade_flame"
from = "ega0075e"
object = "effect/event/ev60/ev6306os00/ev6306os00.objbin"

[[shot_aura]]
name = "orions_shade_flame"
when = { techniques = ["whs03060"] }
aura = "orions_shade_flame"
like = "ega0075e"
