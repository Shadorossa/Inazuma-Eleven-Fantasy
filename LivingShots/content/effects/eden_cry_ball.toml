# «Grito del Edén» (Scream of Eden, whs02640; forest; cut-in ev60_02640): while the ball flies to the goal after the
# cut-in it is wrapped in the finished violet aura of the end of the cut-in's last cut (c0500 frame 518: the ball
# aura, the back auras with their white-blue swirl facing back along the flight as toward the cut-in's camera, the
# dark streaks behind the ball) instead of the plain forest special-shot aura (ega0075d).
# The object is ev6264ed00 (effect/event/ev60/ev6264ed00/), built by research/scripts/eden_cry_ball_fx.py from the
# cut-in's effect object ev60026400 (cutin_replay_aura.py: held at 518, texture scrolls running on, every part in the
# cut-in's orientation, priorities <= 30). docs/game/media/eden-cry-ball-fx.md.
# The trigger copies the forest special-shot aura's row (like = "ega0075d"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame. Its flight: content\techniques\eden_cry_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "eden_cry"
from = "ega0075d"
object = "effect/event/ev60/ev6264ed00/ev6264ed00.objbin"

[[shot_aura]]
name = "eden_cry"
when = { techniques = "whs02640" }
aura = "eden_cry"
like = "ega0075d"
