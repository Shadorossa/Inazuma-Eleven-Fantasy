# «Estocada samurái» (Bushin Blades, whs01865; mountain shot, cut-in ev60_01865): while the ball flies to the goal
# after the cut-in it keeps the look of the cut-in's last cut (c0400, the ball cut down from 16.5 m by the keshin's
# blades, diving inside their crossed slashes): the crossed red slashes, the flashes' rings, the speed lines, the
# ring and the ball's cards round it, instead of the plain mountain special-shot aura (ega0075a). The object is
# ev61865bb0 (effect/event/ev60/ev61865bb0/), built by research/scripts/bushin_blades_ball_fx.py from the cut-in's
# effect object ev60018650: c0400 replayed from the cut (404), then held at frame 486, ball at the origin flying +Z,
# x1; the slashes' X keeps the cut-in's orientation (facing forward, across the flight) and is there from the
# aura's first frame; the round auras, cards and ring face along the flight. Left out: the sky backdrop, the wind-up's maple leaves
# and tails, the white-out card, the keshin. docs/game/media/bushin-blades-ball-fx.md. The trigger copies the
# mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along the ball's velocity
# every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\bushin_blades_trajectory.toml. Mod «Living
# Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "bushin_blades"
from = "ega0075a"
object = "effect/event/ev60/ev61865bb0/ev61865bb0.objbin"

[[shot_aura]]
name = "bushin_blades"
when = { techniques = ["whs01865"] }
aura = "bushin_blades"
like = "ega0075a"
# the aura's replay (82 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 82 }
