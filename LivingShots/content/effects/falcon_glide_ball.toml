# «Vuelo de halcón» (Falcon Glide, whs02690, wind; with the same cut-in «Vuelo de águila calva» / Bald Eagle Glide
# whs02691, mountain; cut-in ev60_02690): while the ball flies to the goal after the cut-in it keeps the look of the
# cut-in's last cut (c0400, the ball gliding low with the falcon): the falcon itself (the waza model a000030, baked)
# flying with it, its blue lights, the dust cloud rolling behind it and the dust puffs it kicks up, instead of the
# plain special-shot aura of its element (ega0075b / ega0075a). The object is ev6269fg00
# (effect/event/ev60/ev6269fg00/), built by research/scripts/falcon_glide_ball_fx.py from the cut-in's effect object
# ev60026900 and the falcon: c0400 replayed from its first frame (350), then held at frame 458, ball at the origin
# flying +Z, x1. Left out: the 48 m wind streaks, the earlier cuts' parts. docs/game/media/falcon-glide-ball-fx.md.
# One aura, one trigger per element: each copies its element's special-shot aura row (like): CB_SkillShootBallAura
# turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). Its flight:
# content\techniques\falcon_glide_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "falcon_glide"
from = "ega0075b"
object = "effect/event/ev60/ev6269fg00/ev6269fg00.objbin"

[[shot_aura]]
name = "falcon_glide"
when = { techniques = ["whs02690"] }
aura = "falcon_glide"
like = "ega0075b"
# the aura's replay (108 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 108 }

[[shot_aura]]
name = "falcon_glide_mountain"
when = { techniques = ["whs02691"] }
aura = "falcon_glide"
like = "ega0075a"
# the aura's replay (108 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 108 }
