# «Rugido de león» (Lion Assault, whs02710, forest; with the same cut-in «Rugido de Doruga» / Doruga Assault
# whs02711, fire, and «Rugido de Goliger» / Goliger Assault whs02712, mountain; cut-in ev60_02710): while the ball
# flies to the goal after the cut-in it keeps the look the cut-in gives it at the strike (c0400): the lion's golden
# roar round it, its light, rings and waves and the shot's turning fire swirls, instead of the plain special-shot aura
# of its element (ega0075d / ega0075c / ega0075a). The object is ev6271la00 (effect/event/ev60/ev6271la00/), built by
# research/scripts/lion_assault_ball_fx.py from the cut-in's effect object ev60027100: c0400 replayed from the roar
# (286), then held at the strike (342), ball at the origin flying +Z, x1. Left out: the blur cards, the whiteout, the
# aftermath, the lion (it stays behind). docs/game/media/lion-assault-ball-fx.md. One aura, one trigger per element:
# each copies its element's special-shot aura row (like): CB_SkillShootBallAura turns +Z along the ball's velocity
# every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\lion_assault_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "lion_assault"
from = "ega0075d"
object = "effect/event/ev60/ev6271la00/ev6271la00.objbin"

[[shot_aura]]
name = "lion_assault"
when = { techniques = ["whs02710"] }
aura = "lion_assault"
like = "ega0075d"
# the aura's replay (56 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 56 }

[[shot_aura]]
name = "lion_assault_fire"
when = { techniques = ["whs02711"] }
aura = "lion_assault"
like = "ega0075c"
# the aura's replay (56 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 56 }

[[shot_aura]]
name = "lion_assault_mountain"
when = { techniques = ["whs02712"] }
aura = "lion_assault"
like = "ega0075a"
# the aura's replay (56 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 56 }
