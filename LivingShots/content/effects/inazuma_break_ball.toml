# «Ruptura relámpago» (Inazuma Break, whs00380 and whs00380_mm, same cut-in; wind shot of three players, cut-in
# ev60_00380): while the ball flies to the goal after the cut-in it carries the cut-in's strike lightning and the
# ball's own light (c0070) instead of the plain wind special-shot aura (ega0075b): the ten yellow / purple bolts of
# the strike crackling round the ball in all directions (ahead, behind, up, down, to the sides; their tips at most
# 1.4 m from it), the whole shell turning about the flight axis (one turn every 0.75 s), the ball's yellow glow and
# its two blinking light cards.
# The object is ev6038in00 (effect/event/ev60/ev6038in00/), built by research/scripts/inazuma_break_ball_fx.py from
# the cut-in's effect object ev60003800 (held at c0070 frame 612, every bolt crackling on over its own flicker window
# 604-618, the light cards over 626-648; each part in the cut-in's shape, the bolts' width x0.5, their length cut to
# the shell). No replay: the aura is the same from its first frame to its last. docs/game/media/inazuma-break-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\inazuma_break_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "inazuma_break"
from = "ega0075b"
object = "effect/event/ev60/ev6038in00/ev6038in00.objbin"

[[shot_aura]]
name = "inazuma_break"
when = { techniques = ["whs00380", "whs00380_mm"] }
aura = "inazuma_break"
like = "ega0075b"
