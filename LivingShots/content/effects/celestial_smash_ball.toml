# «Descenso estelar» (Celestial Smash, whs01430; fire shot, cut-in ev60_01430, effect object ev60014300): while the
# ball flies to the goal it rides inside the head of the cut-in's galaxy cannon (the beam fired at the end of the
# cut-in, c0300), the cannon coming out of the kick point without stretching and the planets drifting inside its
# head. The object is ev6143cs00 (effect/event/ev60/ev6143cs00/), built by research/scripts/celestial_smash_ball_fx.py;
# docs/game/media/celestial-smash-ball-fx.md. The trigger copies the fire special-shot aura's row (like = "ega0075c"):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame. Mod «Living Shots» (shot_fx): visuals only.
# The effect objects are generated on the author's PC from the game's own cut-in effects (never committed).
schema = "VRFW.effect/1"

[[effect]]
name = "celestial_smash"
from = "ega0075c"
object = "effect/event/ev60/ev6143cs00/ev6143cs00.objbin"

[[shot_aura]]
name = "celestial_smash"
when = { techniques = ["whs01430"] }
aura = "celestial_smash"
like = "ega0075c"
