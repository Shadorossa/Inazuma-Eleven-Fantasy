# «Alas de halcón» (Thunderclaw, whs01800; wind shot, cut-in ev60_01800): while the ball flies to the goal after the
# cut-in it keeps the look of the cut-in's last cut (c0400, the ball diving from 15.3 m): its blue wind auras and white
# cores, its light disc, and trailing it the two falcon feathers, the long wind lines and the streak ribbons, instead
# of the plain wind special-shot aura (ega0075b).
# The object is ev6180tc00 (effect/event/ev60/ev6180tc00/), built by research/scripts/thunderclaw_ball_fx.py from the
# cut-in's effect object ev60018000: c0400 replayed from its first frame (450), then held at frame 506, the feathers
# turning on at their measured rates, ball at the origin flying +Z, x1; the light disc facing along the flight
# (1.4.41). Nothing else is alive in c0400.
# docs/game/media/thunderclaw-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\thunderclaw_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "thunderclaw"
from = "ega0075b"
object = "effect/event/ev60/ev6180tc00/ev6180tc00.objbin"

[[shot_aura]]
name = "thunderclaw"
when = { techniques = ["whs01800"] }
aura = "thunderclaw"
like = "ega0075b"
# the aura's replay (56 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 56 }
