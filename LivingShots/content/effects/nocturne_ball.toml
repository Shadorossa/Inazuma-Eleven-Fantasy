# «Nocturne» («Escena nocturna», whs02310, wind shot, cut-in ev60_02310) and Inazuma Fantasy's whs02310_or (same
# cut-in): while the ball flies to the goal it keeps the end of the cut-in's OWN look (the cut c0300, after the wolf
# has bitten the ball): the black wolf's head holding the ball in its open jaws (the cut-in's waza model, still in its
# jaws-open pose as in the cut-in from event frame 1412 to the end), the red-black funnel streaming behind it and
# growing as in the cut-in (its shells, beast auras and glow sheet, x0.5: ~4 m long at the start, up to ~21 m behind
# and ~14 m wide by 1.3 s, then held), the red fragments it sheds (flung back and dissolving, replayed in a cycle;
# turned to face the touchline), the red debris spray (its two particle emitters kept on) and the swarm of 19 bats
# flying 3-7 m behind it, their wings beating as in the cut-in (a 6-pose flipbook of their own 6-frame beat), texture
# flow running on, instead of the plain wind special-shot aura (ega0075b). The night sky and moon, the camera cards,
# the c0200 moon-ball sets and the parts that fade out before the funnel opens (ball glows, claw lines, back cards)
# are dropped.
# The object is ev6231nc00 (assets\data\{common,dx11}\effect\event\ev60\ev6231nc00\), built by
# research/scripts/nocturne_ball_fx.py from ev60023100 (+ the waza models chr/_waza/ev60_02310, ev60_02300);
# docs/game/media/nocturne-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"; skillColorIdx 1, skillEffectBitFlag 0):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). The flight is the
# technique type's level flight at mid height, not the cut-in's dive (content\techniques\nocturne_trajectory.toml).
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "nocturne"
from = "ega0075b"
object = "effect/event/ev60/ev6231nc00/ev6231nc00.objbin"

[[shot_aura]]
name = "nocturne"
when = { techniques = ["whs02310", "whs02310_or"] }
aura = "nocturne"
like = "ega0075b"
