# «Mortal Smash» («Asalto mortal», whs02410, mountain shot, keshin shot of Evera, cut-in ev60_02410): while the ball
# flies to the goal it keeps the end of the cut-in's OWN look (the last cut c0400, the ball punched out of the keshin's
# fist and flying low, held at frame 408, the texture flow running on): the blue energy ball with its domes, shells
# and glows throbbing (the cut-in's 8-frame pulse) and the blue lightning bolts flickering round it (their own blinks
# and pose jumps replayed from the cut-in; nothing spins in the cut-in), instead of the plain mountain special-shot
# aura (ega0075a); x0.45 of the cut-in size (ball ~0.75 m, bolts ~1-2.7 m). The ball's domes and glow cards face the
# cut-in camera flying just ahead of the ball: stood 90 deg about the vertical to face the touchline (as Atomic Flare's
# sun discs). The scenery of the cut-in (black backdrop, background, the keshin smoke banks lying on its pitch) and
# the parts already off in c0400 (hand lights, the fist's round auras, kick shock, front flash, early bolts) are
# dropped. The object is ev6241ms00 (assets\data\{common,dx11}\effect\event\ev60\ev6241ms00\), built by
# research/scripts/mortal_smash_ball_fx.py from ev60024100; docs/game/media/mortal-smash-ball-fx.md.
# The trigger copies the mountain special-shot aura's row (like = "ega0075a"; skillEffectBitFlag 0):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). The move has no _or /
# _mm / _cro variant. Its flight: content\techniques\mortal_smash_trajectory.toml (drop and skim).
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "mortal_smash_lightning"
from = "ega0075a"
object = "effect/event/ev60/ev6241ms00/ev6241ms00.objbin"

[[shot_aura]]
name = "mortal_smash_lightning"
when = { techniques = ["whs02410"] }
aura = "mortal_smash_lightning"
like = "ega0075a"
