# «Cross Fire» («Fuego cruzado»; whs00950 fire shot and whs03400 wind shot, the same two-player combo of Fire Tornado
# and Eternal Blizzard under two elements, plus Inazuma Fantasy's whs00950_or / whs03400_or; cut-ins ev60_00950 /
# ev60_03400, both playing ev60009500): while the ball flies to the goal it stays wrapped in the cut-in's OWN fire and
# ice (the last cut c0500, the shot onto the goal, held at frame 396, the textures' flow running on): the red-orange
# fire and pale-blue ice ribbons coiled round the ball and their twisted trails behind it, instead of the plain fire /
# wind special-shot aura (ega0075c / ega0075b). The camera-facing glow discs on the ball (bars from the touchline),
# the space backdrop and earth, the kicks' fire / ice / wind sets, the crystals and the impact rings are dropped;
# x0.25 of the cut-in size (coils ~1.6 m across, trails ~4 m).
# The object is ev6095cf00 (assets\data\{common,dx11}\effect\event\ev60\ev6095cf00\), built by
# research/scripts/cross_fire_ball_fx.py from ev60009500; docs/game/media/cross-fire-ball-fx.md.
# One object, two triggers: each copies the special-shot aura row of its element (fire: like = "ega0075c"; wind:
# like = "ega0075b"): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b).
# No other technique key uses ev60_00950 / ev60_03400.
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "cross_fire_fire"
from = "ega0075c"
object = "effect/event/ev60/ev6095cf00/ev6095cf00.objbin"

[[effect]]
name = "cross_fire_wind"
from = "ega0075b"
object = "effect/event/ev60/ev6095cf00/ev6095cf00.objbin"

[[shot_aura]]
name = "cross_fire_fire"
when = { techniques = ["whs00950", "whs00950_or"] }
aura = "cross_fire_fire"
like = "ega0075c"

[[shot_aura]]
name = "cross_fire_wind"
when = { techniques = ["whs03400", "whs03400_or"] }
aura = "cross_fire_wind"
like = "ega0075b"
