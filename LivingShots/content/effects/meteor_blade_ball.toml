# «Cañón de meteoritos» (Meteor Blade, whs00510; fire; cut-in ev60_00510): while the ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0040, the meteor diving
# out of the sky): the meteor's beam of white, yellow, orange and purple sheets, its back end left at the kick point
# for the whole shot and its head on the ball (the ball inside it), x0.25, instead of the plain fire special-shot aura
# (ega0075c).
# The object is ev6051mb00 (effect/event/ev60/ev6051mb00/), built by research/scripts/meteor_blade_ball_fx.py from the cut-in's
# effect object ev60005100. docs/game/media/meteor-blade-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\meteor_blade_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "meteor_blade"
from = "ega0075c"
object = "effect/event/ev60/ev6051mb00/ev6051mb00.objbin"

[[shot_aura]]
name = "meteor_blade"
when = { techniques = "whs00510" }
aura = "meteor_blade"
like = "ega0075c"
