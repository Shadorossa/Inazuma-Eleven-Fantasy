# «Caliburn» (whs01890, void shot for 2 players, cut-in ev60_01890): while the ball flies to the goal it keeps the end
# of the cut-in's OWN look (the last cut c0500, the ball struck out of the storm sky and diving at the goal, held at
# frame 452, the texture flow running on): the flying sword slash the ball becomes (the white-blue blade, its blue base
# and the rim-lit crescent wave, ~6.8 m wide and ~4 m deep at x0.6, flat as in the cut-in) with the blue lightning loops
# crackling round it (their own blinks replayed from the cut-in, reaching ~4.5 m up; nothing spins in the cut-in),
# instead of the plain void special-shot aura (ega0075e). The cut-in camera flies ahead of the ball looking back, so
# the whole aura is turned 90 deg about the vertical to show the touchline that view (the blade, still flat, lies
# along the flight), as Mortal Smash's ball set; its materials draw both faces. The cut-in's storm scenery
# (sky, ground, smoke), the thunder strikes from the sky, the flashes and white-outs, the sword swing's trace (left in
# the world where the sword struck) and the parts of the earlier cuts are dropped; the glow on the sword in the
# player's hand (ev60018901) is not used. The object is ev6189cb00 (assets\data\{common,dx11}\effect\event\ev60\
# ev6189cb00\), built by research/scripts/caliburn_ball_fx.py from ev60018900; docs/game/media/caliburn-ball-fx.md.
# The trigger copies the void special-shot aura's row (like = "ega0075e", skillColorIdx 4, skillEffectBitFlag 0):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). The move has no _or /
# _mm / _cro variant. Its flight: content\techniques\caliburn_trajectory.toml (the dive).
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "caliburn_slash"
from = "ega0075e"
object = "effect/event/ev60/ev6189cb00/ev6189cb00.objbin"

[[shot_aura]]
name = "caliburn_slash"
when = { techniques = ["whs01890"] }
aura = "caliburn_slash"
like = "ega0075e"
