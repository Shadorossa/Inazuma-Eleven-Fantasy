# «Averno de Guma» (Gooma Inferno, whs02740; fire shot, cut-in ev60_02740): while the ball flies to the goal after the
# cut-in it keeps the look of the cut-in's last cut (c0300, the ball at the head of the fire beam): the beam's fire
# streaming back from it, its turning shot aura and the fire grains round it, instead of the plain fire special-shot
# aura (ega0075c). The object is ev6274gi00 (effect/event/ev60/ev6274gi00/), built by
# research/scripts/gooma_inferno_ball_fx.py from the cut-in's effect object ev60027400: c0300 replayed from its first
# frame (404), then held at frame 464, ball at the origin flying +Z, x1. Left out: the backdrop, the shout and front
# rings, the whiteouts, the stones and the earlier cuts' parts, the beast. docs/game/media/gooma-inferno-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\gooma_inferno_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's own
# cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "gooma_inferno"
from = "ega0075c"
object = "effect/event/ev60/ev6274gi00/ev6274gi00.objbin"

[[shot_aura]]
name = "gooma_inferno"
when = { techniques = ["whs02740"] }
aura = "gooma_inferno"
like = "ega0075c"
# the aura's replay (60 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 60 }
