# «Ventisca triple» (Triple Blizzard, whs02950 and whs02950_or, same cut-in; wind shot of three players, cut-in
# ev60_02950): while the ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0500, a
# slow-motion close-up of the ball 3.4 m up): the ice head round it with its turning ice cones, the ice wind sheaths,
# the long turning wind lines (~30 m back), the wind swirls and the blizzard puffs streaming behind it, instead of the
# plain wind special-shot aura (ega0075b).
# The object is ev6295tz00 (effect/event/ev60/ev6295tz00/), built by research/scripts/triple_blizzard_ball_fx.py from
# the cut-in's effect object ev60029500: the whole of c0500 replayed, then held at frame 598, the ice cones and wind
# lines turning on at their measured rates, ball at the origin, the head's axis (+Z of the effect: the ball barely
# moves in this slow-motion cut) turned to +Z, x1. Left out: the frozen ground patch with its ice crystals under and
# behind the ball, the camera-front blizzard. docs/game/media/triple-blizzard-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\triple_blizzard_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "triple_blizzard"
from = "ega0075b"
object = "effect/event/ev60/ev6295tz00/ev6295tz00.objbin"

[[shot_aura]]
name = "triple_blizzard"
when = { techniques = ["whs02950", "whs02950_or"] }
aura = "triple_blizzard"
like = "ega0075b"
# the aura's replay (115 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 115 }
