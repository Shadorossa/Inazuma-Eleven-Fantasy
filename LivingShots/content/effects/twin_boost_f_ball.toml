# «Remate combinado F» (Twin Boost F, whs00770 and whs00770_or, same cut-in; fire shot of two players, cut-in
# ev60_00770): while the ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0500, the
# ball kicked 21.6 m up and coming down past the camera): its purple-and-fire comet (streaks, dark and fire waves, the
# turning fire ball) and the red and yellow glows round it, instead of the plain fire special-shot aura (ega0075c).
# The object is ev6077tb00 (effect/event/ev60/ev6077tb00/), built by research/scripts/twin_boost_f_ball_fx.py from the
# cut-in's effect object ev60007700: the cut-in's motion from the kick (394) replayed, then held at c0500 frame 428 (the
# last frame the cut-in shows the ball), the fire ball turning on at its measured rate, ball at the origin flying +Z,
# x1. Left out: the speed-line backdrop, the kick's dark rings, the fire chunks shed in the world.
# docs/game/media/twin-boost-f-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\twin_boost_f_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "twin_boost_f"
from = "ega0075c"
object = "effect/event/ev60/ev6077tb00/ev6077tb00.objbin"

[[shot_aura]]
name = "twin_boost_f"
when = { techniques = ["whs00770", "whs00770_or"] }
aura = "twin_boost_f"
like = "ega0075c"
# the aura's replay (34 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 34 }
