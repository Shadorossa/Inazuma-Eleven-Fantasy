# «Oso polar n.º 2» (Polar Bear No. 2, whs02770 and whs02770_or, same cut-in; mountain shot of three players, cut-in
# ev60_02770): while the ball flies to the goal after the cut-in it keeps the look of the cut-in's last cut (c0500, the
# polar bear's ice beam shooting the ball off its 8.3 m perch): the ice ball head with its ice light discs and the ice
# beam it rides (two light ribbons ~12 m back along the path, ice spikes round the ball), instead of the plain mountain
# special-shot aura (ega0075a).
# The object is ev6277pb00 (effect/event/ev60/ev6277pb00/), built by research/scripts/polar_bear_2_ball_fx.py from the
# cut-in's effect object ev60027700: the cut-in's motion from the kick (490) replayed, then held at c0500 frame 512,
# ball at the origin flying +Z, x1; the ice light discs (they face the cut-in's camera) facing
# along the flight (1.4.42). Left out: the night backdrop, the bear (silhouette cards, lights, waza model: ~20 m behind at the kick
# point), the beam's impact at the kick point, the camera-front snow / blur / blizzard.
# docs/game/media/polar-bear-2-ball-fx.md.
# The trigger copies the mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along
# the ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\polar_bear_2_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "polar_bear_2"
from = "ega0075a"
object = "effect/event/ev60/ev6277pb00/ev6277pb00.objbin"

[[shot_aura]]
name = "polar_bear_2"
when = { techniques = ["whs02770", "whs02770_or"] }
aura = "polar_bear_2"
like = "ega0075a"
# the aura's replay (22 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 22 }
