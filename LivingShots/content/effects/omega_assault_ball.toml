# «Omega Assault» («Ataque Omega», whs02280, void shot, cut-in ev60_02280): while the ball flies to the goal it is
# wrapped in the cut-in's OWN cyan comet (the last cut c0030, the ball shot out of the crystal prism in the sky, held
# at frame 480, texture flow running on) and rides the wide end of the prism's rainbow, its seven coloured beams
# fanning out of a point behind the ball, instead of the plain void special-shot aura (ega0075e). The rainbow is
# turned 9.8° onto the ball's flight and moved 4.9 m (cut-in size) along it so its wide end meets the comet (in the
# cut-in it stays at the prism while the ball flies on). The prism crystal, its flat glow discs, the white / whs0083
# backdrops, the camera light and the thin ring round the ball's head (a bar from the touchline) are dropped; x0.15 of
# the cut-in size (rainbow ~3 m long and ~3 m wide behind the ball, comet ~0.4 m).
# The object is ev6228oa00 (assets\data\{common,dx11}\effect\event\ev60\ev6228oa00\), built by
# research/scripts/omega_assault_ball_fx.py from ev60022800; docs/game/media/omega-assault-ball-fx.md.
# The trigger copies the void special-shot aura's row (like = "ega0075e"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). No other skill_config row uses this cut-in (no _or / _mm).
# Mod «Living Shots» (shot_fx): visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "omega_assault_rainbow"
from = "ega0075e"
object = "effect/event/ev60/ev6228oa00/ev6228oa00.objbin"

[[shot_aura]]
name = "omega_assault_rainbow"
when = { techniques = ["whs02280"] }
aura = "omega_assault_rainbow"
like = "ega0075e"
