# «Estocada de Lancelot» (Lancelot Lunge, whs01780; fire shot, cut-in ev60_01780): while the ball flies to the goal
# after the cut-in it keeps the look of the cut-in's shot cut (c0500): its small fire and the fire grains it sheds,
# and its KESHIN (Lancelot, the cut-in's own keshin model k000020) charging after it, sword forward,
# ~14 m behind, instead of the plain fire special-shot aura (ega0075c).
# The object is ev6178ll00 (effect/event/ev60/ev6178ll00/), built by research/scripts/lancelot_lunge_ball_fx.py from
# the cut-in's effect object ev60017800 and the keshin model chr/_keshin/k000020 (baked as rigid bone segments by
# waza_replay_aura.py): c0500 replayed from its first frame (260) with every part and the keshin in their place
# relative to the ball, then held at 290 (the keshin's charge over 274-290 going on, back and forth), ball at the origin
# flying +Z, x1. docs/game/media/lancelot-lunge-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\lancelot_lunge_trajectory.toml.
# Mod «Living Shots» (shot_fx): visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/LivingShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "lancelot_lunge"
from = "ega0075c"
object = "effect/event/ev60/ev6178ll00/ev6178ll00.objbin"

[[shot_aura]]
name = "lancelot_lunge"
when = { techniques = ["whs01780"] }
aura = "lancelot_lunge"
like = "ega0075c"
# the aura's replay (30 effect frames to the end-of-shot look) stretched to the real flight (docs/framework/effect.md §6 «Fit to the flight»)
fit = { replay = 30 }
