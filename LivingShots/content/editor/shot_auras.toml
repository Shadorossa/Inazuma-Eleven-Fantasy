# Living Shots › the ModManager editor of its shot auras (docs/framework/modmanager-editor-schemas.md): the ball auras of
# content\effects\*.toml ([[shot_aura]] rules and the [[effect]] objects they show, the framework's effect type,
# docs/framework/effect.md §3 / §6). ModManager lists the rules on its «Auras de tiro» page (Section = "shot_aura"),
# draws the form of each from these shapes, edits the files in place and plays the aura on the ball of the move's shot
# (Preview). The game does not read this folder. Scale, offset and turn of an aura are baked into its effect object
# (the engine turns +Z along the ball's flight; effect.md §6): no key holds them.
schema = "VRFW.editor/1"

[[Editor]]
Id = "shot_auras"
Title = { es = "Auras de tiro", en = "Shot auras" }
Help = { es = "El efecto que rodea al balón mientras vuela un tiro: qué tiros lo llevan y qué objeto de efecto se ve.", en = "The effect around the ball while a shot flies: which shots carry it and which effect object shows." }
Section = "shot_aura"
Files = ["content/effects/*.toml"]
# the automatic auras (research/scripts/ls_auto_aura.py --emit): listed as «automática», «Convertir en manual» moves one
# into content\effects\ (the generator then leaves its shot alone)
Automatic = ["content/effects/auto/*.toml"]
Table = "shot_aura"
Key = "name"
Shape = "shot_aura"

[[Editor]]
Id = "effects"
Title = { es = "Objetos de aura", en = "Aura objects" }
Help = { es = "Los efectos propios del mod que las auras de tiro muestran.", en = "The mod's own effects the shot auras show." }
Section = "shot_aura"
Files = ["content/effects/*.toml"]
Table = "effect"
Key = "name"
Shape = "effect"

# ------------------------------------------------------------------------------------------------ a rule

[[Shape]]
Id = "shot_aura"
Preview = { Kind = "shot_aura", Technique = "when.techniques", Aura = "aura", Element = "color", HideBall = "hide_ball", Fit = "fit.replay", Effect = { Table = "effect", Key = "name", Object = "object", Shape = "effect" } }
  [[Shape.Field]]
  Key = "name"
  Type = "id"
  Required = true
  Label = { es = "Clave", en = "Key" }
  Help = { es = "Id propio de la regla (LivingShots.<clave>); la clave completa de una regla de otro mod la sustituye.", en = "The rule's own id (LivingShots.<key>); another mod's full rule id replaces that rule." }
  [[Shape.Field]]
  Key = "when"
  Type = "table"
  Of = "when"
  Inline = true
  Label = { es = "Cuándo", en = "When" }
