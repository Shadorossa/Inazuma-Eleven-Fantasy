  [[Shape.Field]]
  Key = "aura"
  Type = "ref"
  Ref = "record:effects"
  Values = ["ega0075", "ega0080", "ega0085", "ega0021"]
  Label = { es = "Aura", en = "Aura" }
  Help = { es = "Un objeto de aura del mod, o una familia del juego de cinco (una por elemento), o el aura del tiro normal.", en = "One of the mod's aura objects, or a game family of five (one per element), or the normal shot's aura." }
  [Shape.Field.ValueLabels]
  ega0075 = { es = "La del juego por elemento", en = "The game's, by element" }
  ega0080 = { es = "Tiro en cadena del juego", en = "The game's chain shot" }
  ega0085 = { es = "Tiro lejano del juego", en = "The game's long shot" }
  ega0021 = { es = "Tiro normal del juego", en = "The game's normal shot" }
  [[Shape.Field]]
  Key = "like"
  Type = "enum"
  Values = ["ega0075a", "ega0075b", "ega0075c", "ega0075d", "ega0075e", "ega0080a", "ega0080b", "ega0080c", "ega0080d", "ega0080e", "ega0085a", "ega0085b", "ega0085c", "ega0085d", "ega0085e", "ega0021"]
  Label = { es = "Copia la fila", en = "Copies the row" }
  Help = { es = "Fila del juego cuyo disparador copia un aura propia (clips in / loop / out y el giro por la velocidad del balón).", en = "The game row whose trigger an own aura copies (clips in / loop / out and the turn along the ball's velocity)." }
  [[Shape.Field]]
  Key = "color"
  Type = "enum"
  Values = ["wind", "forest", "fire", "mountain", "void"]
  Label = { es = "Elemento forzado", en = "Forced element" }
  Help = { es = "Con una familia de cinco: la letra de este elemento en vez del de la técnica.", en = "With a family of five: this element's letter instead of the move's." }
  [Shape.Field.ValueLabels]
  wind = { es = "Aire", en = "Wind" }
  forest = { es = "Bosque", en = "Forest" }
  fire = { es = "Fuego", en = "Fire" }
  mountain = { es = "Montaña", en = "Mountain" }
  void = { es = "Neutro", en = "Void" }
  [[Shape.Field]]
  Key = "fit"
  Type = "table"
  Of = "fit"
  Inline = true
  Label = { es = "Ajuste al vuelo", en = "Fit to the flight" }
  Help = { es = "Estira la repetición del aura (fotogramas a 60 fps) al vuelo real, para que su final llegue al portero.", en = "Stretches the aura's replay (frames at 60 fps) to the real flight, so its end look lands on the keeper." }
  [[Shape.Field]]
  Key = "trail_level"
  Type = "int"
  Min = 1
  Max = 4
  More = true
  Label = { es = "Nivel de estela", en = "Trail level" }
  Help = { es = "Estela del balón 1-4 mientras vuela el tiro (solo visual).", en = "Ball trail level 1-4 while the shot flies (visual only)." }
  [[Shape.Field]]
  Key = "cutin_scale"
  Type = "float"
  Min = 0.0
  Max = 4.0
  Step = 0.05
  Unit = "×"
  More = true
  Label = { es = "En el cut-in del portero", en = "In the keeper's cut-in" }
  Help = { es = "También sobre el balón del cut-in de portero / bloqueo que recibe el tiro, a esta escala.", en = "Also on the ball of the keeper / block cut-in the shot meets, at this scale." }
  [[Shape.Field]]
  Key = "hide_ball"
  Type = "bool"
  Label = { es = "Ocultar el balón principal", en = "Hide the main ball" }
  Help = { es = "Mientras el aura se ve en el campo, el balón real del partido no se dibuja (para auras que llevan su propio balón o varios). Vuelve al acabar el aura.", en = "While the aura plays on the pitch the real match ball is not drawn (for auras that carry their own ball or several). It comes back when the aura ends." }
  [[Shape.Field]]
  Key = "remove"
  Type = "bool"
  More = true
  Label = { es = "Quitar la regla", en = "Drop the rule" }
  Help = { es = "Quita la regla de otro mod con esta clave completa.", en = "Drops another mod's rule with this full key." }

