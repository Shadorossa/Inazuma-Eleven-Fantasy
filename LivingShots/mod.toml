# «Living Shots» (until 1.4.0 «Efectos de tiro» / Shot FX). name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
name = "Living Shots"
# the mod's own name prefix (docs/framework/new-core/plan.md «Mod prefixes»): its own TOML keys / Lua names are
# LivingShots.X; the mod id stays shot_fx (saved option values, `requires`, Inazuma Fantasy's dependency)
prefix = "LivingShots"
folder = "LivingShots"
version = "1.68.168"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Special shots keep their cut-in look while the ball flies: Doom Spear travels inside its red lattice spear, Excalibur rides its slash wave and leaves a burnt gash on the pitch, Doom Rain flies among its rain of dark balls, Emperor Penguin No. 1 / 2 / 3 carry their penguins, Katana Kick its wave and maple leaves, God Knows flies inside its lightning orb and Ultimate Eleven Assault inside its golden sphere with pulsing rainbow rings; every other special shot gets its own aura too, also on saves and blocks with a move. Visual only: no power, cost or block change. The shot camera, the special goals and the seven finished auras of Chaos Break, Doom Break, Black Dawn, Pegasus Punch, Meteor Attack, Avenging Eagle and Doom Dive Drive are in Strikers Shots, made to be used with this mod."
priority = 0
tags = ["Visual"]
updated = "2026-10-24"
# Data only (no DLL, no Lua): the shot auras of content\effects\ ([[effect]] + [[shot_aura]] of the effect type,
# docs/framework/effect.md §6, the automatic ones in content\effects\auto\) and their visual keys of the technique
# type (content\techniques\: trajectories, ground_trail, hide_ball). Works on the retail moves, alone or with
# «Strikers Shots» (the shot camera, the special goals and six finished auras moved there in 1.65.0 / 1.67.0; no
# dependency either way). `requires` also makes it load after the framework.
requires = ["VRFW>=2.136.0"]
