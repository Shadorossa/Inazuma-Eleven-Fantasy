schema = "VRFW.option/2"
# Setting of «Living Shots»'s Goal Smash feature (the standalone mod goal_smash until 2026-10-08, merged into this
# mod) in the Opciones tab «Opciones de mods» (format: docs/app/mod-options.md §3). Value kept in
# evt_loader\mod_options\shot_fx.json ({"format": 1, "owner": "shot_fx", "values": {"skip_goal_scene": 1}}), read live by
# the technique engine's goal-event hook at every goal (no restart): on = a goal scored with a move of
# content\techniques\goal_smash.toml plays the normal goal (docs/game/mechanics/goal-smash.md §9.3). The id is the engine's
# convention (technique_engine goal::SKIP_OPTION): any mod with goal_event rules can offer the same row. A value saved by
# the old goal_smash mod (goal_smash.json) is taken over once by the engine (this mod `provides` goal_smash).

[[option]]
id = "skip_goal_scene"                        # row key shot_fx.skip_goal_scene
type = "toggle"                               # 0 = Desactivado (goal smash plays), 1 = Activado (normal goal)
label = "skip_goal_scene"                     # «Saltar la cinemática de gol especial» (text\keys.toml, 9 languages)
help = "skip_goal_scene_help"
default = false
order = 300
