schema = "VRFW.text_key/1"
# Texts of «Living Shots» (former id shot_fx; «Efectos de tiro» / Shot FX until 1.4.0): the «Mods» screen's name and
# description (format of the text engine: docs/framework/types/text.md). A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Living Shots"
mod_description = "Special shots keep their cut-in look while the ball flies: Doom Spear travels inside its red lattice spear, Excalibur rides its slash wave and leaves a burnt gash on the pitch, Doom Rain flies among its rain of dark balls, Emperor Penguin No. 1 / 2 / 3 carry their penguins and Katana Kick its wave and maple leaves. Visual only: no power, cost, path or block change. The shot camera, the special goals and seven finished auras are in Strikers Shots, made to be used with this mod."

[es.new]
mod_name = "Living Shots"
mod_description = "Las supertécnicas de tiro conservan su aspecto de la cinemática mientras el balón vuela: Lanza letal viaja dentro de su lanza roja, Excalibur cabalga su onda de corte y deja un tajo en el campo, Diluvio letal vuela entre su lluvia de balones oscuros, Pingüino emperador n.º 1 / 2 / 3 llevan sus pingüinos y Chut ancestral su onda y sus hojas de arce. Solo visual: no cambia potencia, coste, trayectoria ni bloqueos. La cámara de los tiros, los goles especiales y siete auras terminadas están en Strikers Shots, pensado para usarse con este mod."

[fr.new]
mod_name = "Living Shots"
mod_description = "Les tirs spéciaux gardent l'aspect de leur cinématique pendant que le ballon vole : Lance des ténèbres voyage dans sa lance rouge, Excalibur chevauche son onde tranchante et laisse une entaille brûlée sur le terrain, Pluie des ténèbres vole parmi sa pluie de ballons sombres, Manchot empereur nº 1 / 2 / 3 emportent leurs manchots et Tir katana ancestral son onde et ses feuilles d'érable. Purement visuel : ni puissance, ni coût, ni trajectoire, ni blocages ne changent. La caméra des tirs, les buts spéciaux et sept auras finies sont dans Strikers Shots, fait pour être utilisé avec ce mod."

[de.new]
mod_name = "Living Shots"
mod_description = "Spezialschüsse behalten ihr Aussehen aus der Zwischensequenz, während der Ball fliegt: Schattenspeer fliegt in seinem roten Speer, Excalibur reitet auf seiner Schnittwelle und hinterlässt eine verbrannte Kerbe auf dem Platz, Schattenhagel fliegt in seinem Regen aus dunklen Bällen, Kaiserpinguin I / II / III tragen ihre Pinguine und Katana-Kick seine Welle und Ahornblätter. Nur optisch: Stärke, Kosten, Flugbahn und Blocks bleiben gleich. Die Schusskamera, die Spezialtore und sieben fertige Auren sind in Strikers Shots, gedacht für die Nutzung mit diesem Mod."

[it.new]
mod_name = "Living Shots"
mod_description = "I tiri speciali mantengono l'aspetto della loro scena mentre il pallone vola: Lancia Micidiale viaggia dentro la sua lancia rossa, Excalibur cavalca la sua onda di taglio e lascia un solco bruciato sul campo, Raffica Micidiale vola tra la sua pioggia di palloni oscuri, Pinguino Imperatore Nº 1 / 2 / 3 portano i loro pinguini e Tiro Ancestrale la sua onda e le sue foglie d'acero. Solo visivo: potenza, costo, traiettoria e blocchi non cambiano. La telecamera sui tiri, i gol speciali e sette aure finite sono in Strikers Shots, pensata per essere usata con questa mod."

[pt.new]
mod_name = "Living Shots"
mod_description = "Os chutes especiais mantêm o visual da sua cena enquanto a bola voa: Lança Mortal viaja dentro da sua lança vermelha, Excalibur cavalga a sua onda de corte e deixa um rasgo queimado no campo, Chuva Mortal voa entre a sua chuva de bolas sombrias, Pinguins Imperiais nº 1 / 2 / 3 levam os seus pinguins e Chute Ancestral a sua onda e as suas folhas de bordo. Apenas visual: não muda potência, custo, trajetória nem bloqueios. A câmera nos chutes, os gols especiais e sete auras acabadas estão em Strikers Shots, feito para ser usado com este mod."

[ja.new]
mod_name = "Living Shots"
mod_description = "必殺シュートが、ボールが飛んでいる間もカットインの見た目を保ちます：デススピアーは赤い槍に包まれて飛び、エクスカリバーは斬撃の波に乗ってフィールドに焼け跡を残し、デスレインは黒いボールの雨の中を飛び、皇帝ペンギン１号 / ２号 / ３号はペンギンを、伝来宝刀は波動とカエデの葉を引き連れます。見た目だけの変更で、威力・消費・軌道・ブロックは変わりません。シュートカメラ、特殊ゴール、完成した７つのオーラは、このMODと一緒に使う Strikers Shots に入っています。"

[zh_hans.new]
mod_name = "Living Shots"
mod_description = "必杀射门在球飞行时也保持过场演出中的外观：死亡之枪在红色长枪中飞行，王者之剑乘着斩击波前进并在球场上留下烧焦的刀痕，死亡弹雨在黑色弹雨中飞行，皇帝企鹅1号 / 2号 / 3号带着企鹅，传承宝刀带着波动和枫叶。仅为视觉效果：威力、消耗、轨迹和阻挡都不变。射门镜头、特殊进球和七个完成的光环在与本模组搭配使用的 Strikers Shots 中。"

[zh_hant.new]
mod_name = "Living Shots"
mod_description = "必殺射門在球飛行時也保持過場演出中的外觀：驟死巨矛在紅色長矛中飛行，誓約勝利之劍乘著斬擊波前進並在球場上留下燒焦的刀痕，死亡彈雨在黑色彈雨中飛行，皇帝企鵝1號 / 2號 / 3號帶著企鵝，傳承寶刀帶著波動和楓葉。僅為視覺效果：威力、消耗、軌跡和攔截都不變。射門鏡頭、特殊進球和七個完成的光環在與本模組搭配使用的 Strikers Shots 中。"
