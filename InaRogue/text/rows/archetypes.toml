# InaRogue › the names and explanations of the INAROGUE archetypes (content/archetypes/inarogue.toml); the explanation
# says they come from the rogue items.

[[row]]
id = "InaRogue.Archetype_siege"
es = "Asedio"
en = "Siege"
fr = "Siège"
de = "Belagerung"
it = "Assedio"
pt = "Cerco"
ja = "包囲"
zh_hans = "围攻"
zh_hant = "圍攻"

[[row]]
id = "InaRogue.ArchetypeDesc_siege"
es = "Asedio: encierra al rival en su campo y cárgalo a tiros.\nSu rango es el número de objetos de Asedio (hasta 5)."
en = "Siege: lock the rival in his half and load him with shots.\nIts rank is the number of Siege items (up to 5)."
fr = "Siège : enferme le rival dans sa moitié de terrain et crible-le de tirs.\nSon rang est le nombre d'objets de Siège (jusqu'à 5)."
de = "Belagerung: Sperre den Gegner in seiner Hälfte ein und überhäufe ihn mit Schüssen.\nIhr Rang ist die Anzahl der Belagerungs-Gegenstände (bis zu 5)."
it = "Assedio: chiudi il rivale nella sua metà campo e riempilo di tiri.\nIl suo rango è il numero di oggetti Assedio (fino a 5)."
pt = "Cerco: prenda o rival na metade dele e encha-o de chutes.\nO nível é o número de itens de Cerco (até 5)."
ja = "包囲：相手を自陣に閉じ込め、シュートを浴びせる。\nランクは包囲アイテムの数（最大5）。"
zh_hans = "围攻：把对手关在他的半场，用射门轰炸他。\n等级就是围攻道具的数量（最多5个）。"
zh_hant = "圍攻：把對手關在他的半場，用射門轟炸他。\n等級就是圍攻道具的數量（最多5個）。"
