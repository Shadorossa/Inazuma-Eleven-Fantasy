# InaRogue › the names of the item rarities and the names and explanations of the rogue items (content/rogue/items.toml; ids
# InaRogue.rogue_item_<key>_name / _desc, scripts/lib/rogue/items.lua I.text_keys). The Asedio names are placeholders
# until the owner names them.

[[row]]
id = "InaRogue.rogue_item_siege_long_shot_tension_name"
es = "Objeto de Asedio 1"
en = "Siege item 1"

[[row]]
id = "InaRogue.rogue_item_siege_long_shot_tension_desc"
es = "Los disparos lejanos gastan un 15 % menos de tensión (40 % al nivel máximo)."
en = "Long shots cost 15 % less tension (40 % at the top level)."

[[row]]
id = "InaRogue.rogue_item_siege_technique_cooldown_name"
