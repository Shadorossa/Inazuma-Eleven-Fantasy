es = "Los pases van un 2,5 % más rápido (5 % al nivel máximo)."
en = "Passes travel 2.5 % faster (5 % at the top level)."

[[row]]
id = "InaRogue.rogue_item_siege_max_grade_name"
es = "Objeto de Asedio 5"
en = "Siege item 5"

[[row]]
id = "InaRogue.rogue_item_siege_max_grade_desc"
es = "Todas las supertécnicas pasan a grado máximo durante 3 partidos."
en = "Every special move plays at its top grade for 3 matches."

[[row]]
id = "InaRogue.rogue_item_siege_focus_at_name"
es = "Objeto de Asedio 6"
en = "Siege item 6"

[[row]]
id = "InaRogue.rogue_item_siege_focus_at_desc"
es = "AT de foco +5 % (+30 % al nivel máximo)."
en = "Focus AT +5 % (+30 % at the top level)."

