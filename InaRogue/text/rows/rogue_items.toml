en = "Siege item 2"

[[row]]
id = "InaRogue.rogue_item_siege_technique_cooldown_desc"
es = "El enfriamiento de las supertécnicas se reduce un 40 % (75 % al nivel máximo)."
en = "Special moves recharge 40 % faster (75 % at the top level)."

[[row]]
id = "InaRogue.rogue_item_siege_wall_breaker_name"
es = "Objeto de Asedio 3"
en = "Siege item 3"

[[row]]
id = "InaRogue.rogue_item_siege_wall_breaker_desc"
es = "Los muros rivales reducen un 10 % menos la AT del tiro."
en = "Rival walls take 10 % less of the shot's AT."

[[row]]
id = "InaRogue.rogue_item_siege_pass_speed_name"
es = "Objeto de Asedio 4"
en = "Siege item 4"

[[row]]
