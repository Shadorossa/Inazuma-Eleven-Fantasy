[[row]]
id = "InaRogue.dock.roster"
es = "Tu banco de INAROGUE ({1} jugadores) está en la plantilla del juego, a Nv. 5.\nElige tu equipo en «Plantilla de equipo»: 11 titulares y hasta 5 suplentes,\nentrenador y gerentes. Presupuesto: {2} puntos (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nAtrás en la plantilla = volver a INAROGUE."
en = "Your INAROGUE bank ({1} players) is in the game's team, at Lv. 5.\nPick your team in «Team Dock»: 11 starters and up to 5 subs,\ncoach and managers. Budget: {2} points (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nBack in the dock = return to INAROGUE."
fr = "Ta réserve d'INAROGUE ({1} joueurs) est dans l'effectif du jeu, au Nv. 5.\nChoisis ton équipe dans « Effectif » : 11 titulaires et jusqu'à 5 remplaçants,\nentraîneur et managers. Budget : {2} points (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nRetour dans l'effectif = revenir à INAROGUE."
de = "Deine INAROGUE-Bank ({1} Spieler) ist im Team des Spiels, auf Lv. 5.\nWähle dein Team in „Teamaufstellung“: 11 Stammspieler und bis zu 5 Ersatzspieler,\nTrainer und Manager. Budget: {2} Punkte (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nZurück in der Aufstellung = zurück zu INAROGUE."
it = "La tua riserva di INAROGUE ({1} giocatori) è nella formazione del gioco, al Liv. 5.\nScegli la squadra in «Formazione squadra»: 11 titolari e fino a 5 riserve,\nallenatore e manager. Budget: {2} punti (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nIndietro nella formazione = torna a INAROGUE."
pt = "Seu banco do INAROGUE ({1} jogadores) está no elenco do jogo, no Nv. 5.\nEscolha seu time em «Elenco do time»: 11 titulares e até 5 reservas,\ntreinador e gerentes. Orçamento: {2} pontos (1★ 1, 2★ 2, 3★ 4, 4★ 6, 5★ 9).\nVoltar no elenco = voltar ao INAROGUE."
ja = "INAROGUEのバンク（{1}人）はLv. 5でゲームのチームにいます。\n「チーム編成」でチームを選ぼう：スタメン11人と控え最大5人、\n監督とマネージャー。予算：{2}ポイント（1★ 1、2★ 2、3★ 4、4★ 6、5★ 9）。\n編成で戻る＝INAROGUEに戻る。"
zh_hans = "你的INAROGUE球员库（{1}名球员）以Lv. 5在游戏队伍中。\n在“队伍编成”中选择队伍：11名首发和最多5名替补，\n教练和经理。预算：{2}点（1★ 1、2★ 2、3★ 4、4★ 6、5★ 9）。\n在编成中返回＝回到INAROGUE。"
