[[row]]
id = "InaRogue.map.event_pending"
es = "Evento\nUna escena con varias opciones: premio o riesgo.\n(Contenido pendiente: esta casilla cuenta como superada.)"
en = "Event\nA scene with several choices: reward or risk.\n(Content pending: this space counts as cleared.)"
fr = "Événement\nUne scène avec plusieurs choix : récompense ou risque.\n(Contenu à venir : cette case compte comme réussie.)"
de = "Ereignis\nEine Szene mit mehreren Optionen: Belohnung oder Risiko.\n(Inhalt folgt: Dieses Feld zählt als geschafft.)"
it = "Evento\nUna scena con varie opzioni: premio o rischio.\n(Contenuto in arrivo: questa casella conta come superata.)"
pt = "Evento\nUma cena com várias opções: prêmio ou risco.\n(Conteúdo pendente: esta casa conta como superada.)"
ja = "イベント\n報酬かリスクか、いくつかの選択肢がある場面です。\n（内容は準備中：このマスはクリア扱いになります。）"
zh_hans = "事件\n一个有多个选项的场景：奖励或风险。\n（内容待定：此格视为已通过。）"
zh_hant = "事件\n一個有多個選項的場景：獎勵或風險。\n（內容待定：此格視為已通過。）"

