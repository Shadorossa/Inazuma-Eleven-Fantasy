[[row]]
id = "InaRogue.map.recruit_ask_one"
es = "¡{1} ({2} estrella, coste {3}) quiere unirse a tu equipo!\nEntrará en tu banco y en el banquillo. ¿Aceptar?"
en = "{1} ({2} star, cost {3}) wants to join your team!\nThey go into your bank and onto the bench. Accept?"
fr = "{1} ({2} étoile, coût {3}) veut rejoindre ton équipe !\nIl ira dans ta réserve et sur le banc. Accepter ?"
de = "{1} ({2} Stern, Kosten {3}) will deinem Team beitreten!\nEr kommt in deine Bank und auf die Ersatzbank. Annehmen?"
it = "{1} ({2} stella, costo {3}) vuole unirsi alla tua squadra!\nEntrerà nella tua riserva e in panchina. Accettare?"
pt = "{1} ({2} estrela, custo {3}) quer entrar no seu time!\nEle vai para o seu banco e para a reserva. Aceitar?"
ja = "{1}（★{2}、コスト{3}）がチームに入りたがっています！\nバンクとベンチに入ります。受け入れますか？"
zh_hans = "{1}（{2}星，费用{3}）想加入你的队伍！\n他将进入你的球员库和替补席。接受吗？"
zh_hant = "{1}（{2}星，費用{3}）想加入你的隊伍！\n他將進入你的球員庫和替補席。接受嗎？"

