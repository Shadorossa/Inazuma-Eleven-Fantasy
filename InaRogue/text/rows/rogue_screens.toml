schema = "VRFW.text/2"
table = "menu_text"
# InaRogue › the texts of its screens (menus, dock, route map, shop, coaches, title entry, slot card, unlock
# notices). Hand-written; the screens read them by crc32 of the id (CMND_TEXT_GET). {1}.. = values.

[[row]]
id = "InaRogue.formation.locked"
es = "Formación bloqueada (rareza {1} de 4).\nSe gana en INAROGUE: partidos, Élite y jefes (las mejores).\nTienes {2} de {3} formaciones."
en = "Formation locked (rarity {1} of 4).\nWon in INAROGUE: matches, Elite and bosses (the best ones).\nYou have {2} of {3} formations."
fr = "Formation verrouillée (rareté {1} sur 4).\nÀ gagner dans INAROGUE : matchs, Élite et boss (les meilleures).\nTu as {2} formations sur {3}."
de = "Formation gesperrt (Seltenheit {1} von 4).\nZu gewinnen in INAROGUE: Spiele, Elite und Bosse (die besten).\nDu hast {2} von {3} Formationen."
it = "Modulo bloccato (rarità {1} di 4).\nSi vince in INAROGUE: partite, Élite e boss (i migliori).\nHai {2} moduli su {3}."
pt = "Formação bloqueada (raridade {1} de 4).\nGanha no INAROGUE: partidas, Elite e chefes (as melhores).\nVocê tem {2} de {3} formações."
ja = "ロック中のフォーメーション（レア度 {1}/4）。\nINAROGUEの試合・エリート・ボス（最上位）で手に入ります。\n所持フォーメーション：{2}/{3}。"
zh_hans = "阵型未解锁（稀有度 {1}/4）。\n可在INAROGUE中获得：比赛、精英和首领（最好的阵型）。\n你拥有 {2}/{3} 个阵型。"
zh_hant = "陣型未解鎖（稀有度 {1}/4）。\n可在INAROGUE中獲得：比賽、精英和首領（最好的陣型）。\n你擁有 {2}/{3} 個陣型。"

