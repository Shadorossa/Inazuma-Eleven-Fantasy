# Settings of InaRogue's scripts (kind VRFW.script/1, docs/framework/scripts.md §2). No [[script]] list: every
# top-level scripts\*.lua is an entry point (name order), every .lua below (lib\) a library for `require`.
schema = "VRFW.script/1"
# INAROGUE reads its avatar catalogue (5k rows) and lays out the album (5k cards) inside one call
[settings]
budget = 5000000
memory_kb = 65536
