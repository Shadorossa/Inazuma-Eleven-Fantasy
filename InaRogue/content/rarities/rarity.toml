banner_text = { es = "VESTIGIO", it = "VESTIGIO", en = "VESTIGE", fr = "VESTIGE", de = "ÜBERREST", pt = "VESTÍGIO", ja = "名残", zh_hans = "遗迹", zh_hant = "遺跡" }
