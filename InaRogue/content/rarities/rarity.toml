schema = "VRFW.rarity/1"
# InaRogue's rarities (moved from Inazuma Fantasy 2026-10-14): the «¿Y si…?» Vestigio cards and the five
# INAROGUE tiers, scoped to the mode inarogue.run (docs/framework/card-filter.md).

[[rarity]]
id = "vestige"
value = 5
frame = 13
also_frames = [14, 15]
group = "idol"
texture = "evt_whatif_atl"
