schema = "VRFW.team/2"
# InaRogue › the SLOT TEAMS of the random rivals (docs/framework/random-team.md §3.3): ordinary teams whose players
# are placeholders; right before a node's match the VR-Framework's random team service writes the drawn roster,
# name, crest, kit and formation over them in memory (nothing saved). One slot per pool tier and format; each
# appears once in INAROGUE's pool lists (content\teams\lists.toml) with the tag `random`, so the run draws it as
# a rival row of that tier (scripts\lib\rogue\pool.lua) and the game Lua builds it before the match
# (CMND_EVT_RL_RUN_RIVAL -> CMND_VRFW_RANDOM_TEAM_BUILD). Replaces the ~1 460 pre-generated rival teams (2026-10-14).
default_lang = "en"

