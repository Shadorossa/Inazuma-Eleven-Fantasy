# INAROGUE's button on the title's mode row: a VRFW title row entry (docs/framework/title-row.md) in the group
# «Modos de juego» (`group = "game_modes"`, VRFW's group button): it shows in the group's sub-row, ordered by `order`
# among the group's members. A = EVT_IR_TitlePress (graft inarogue: its own coroutine opens evt_inarogue_menu as a
# child of the title). Locked while [modes] inarogue is off (graft modes_switch's EVT_MS_Locked). `item` keeps the
# title item the top bar's INAROGUE shortcut presses (it reaches the button inside the group too).
schema = "VRFW.menu/2"

[[entry]]
host = "title_menu_2.upper"
id = "inarogue"
text = "InaRogue.Title"
icon = "title00_07:icon_btn12"
order = 660
group = "game_modes"
action = { lua = "EVT_IR_TitlePress" }

[entry.title]
plate = ["btn_base06_on", "btn_base06_off"]
flavor = "InaRogue.TitleFlavor"
players = 1
item = "evt_title_menu_custom_item"
