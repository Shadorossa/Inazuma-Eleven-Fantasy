# InaRogue: the INAROGUE coach selector evt_rogue_coach_menu (docs/game/modes/inarogue.md «Entrenadores»;
# written from menus/rogue_shop.toml, the same frame and pools). Base savedata_management_menu (background, header,
# guide line, cursor, button guides, the off-screen input anchor) + the route map's quad objects as pools, by draw
# priority: evt_rogue_map_bg (451, backdrop), evt_rogue_map_plat (455, card plates), evt_rogue_map_emb (457, faces),
# evt_rogue_map_tag (458, name plate + lock per card), evt_rogue_map_hint (459, cursor ring); _lev / _runner unused
# (1 each). Pool counts = research/scripts/rogue_coaches_build.py GEOM (MAX_CARDS). The Lua is the graft
# research/grafts/rogue_coaches/evt_rogue_coach_menu.lua (menu_assemble.py new_file). Art: evt_rogue_coach.g4tx
# (rogue_coaches_build.py: card plates, ring, lock, the coaches' retail face icons and name plates).
schema = "VRFW.menu/2"

[[screen]]
name = "evt_rogue_coach_menu"
like = "language_option_menu"
# the registry is full at 384 rows (the game dies at boot past that, docs/game/ui/menu-layer-limits.md):
# this screen takes over the row of a trial-build title menu that the PC game never opens
replaces = "title_menu_trial_thankyou_tgs2024"
base = "savedata_management_menu"

[screen.rows]
layer = [
    { layer = "save01_01_list_attach_base", object = "evt_rogue_bank_rows" },
    { layer = "save01_02_list_item", count = 1 },
