# InaRogue: the INAROGUE «Tienda» screen evt_rogue_shop_menu (written by hand;
# docs/game/modes/inarogue-avatars.md §2.3). The route map's frame (base savedata_management_menu: background, header,
# guide line (hidden), cursor, button guides, the off-screen input anchor), the route map's quad objects
# (screen_objects.toml) as pools and three retail layers of shop_menu for the top row (07/10: cmn06_01_list_tab_attach,
# the tab bar with its L1 / R1 glyphs; cmn06_20_list_tab_item x9 (the retail count), one tab per shop of
# content/rogue/shop_tabs.toml attached to the bar; shop01_04d_token_item_5dig, the currency pill). The pool COUNTS are written by
# research/scripts/rogue_shop_build.py from its GEOM (one page of the adaptive hex grid), by draw priority:
# evt_rogue_map_plat (455, hexagons), evt_rogue_map_emb (457, shadows), evt_rogue_map_tag (458, 8 per hex: prices /
# locks / «EN USO» / team counter + the team crest), evt_rogue_map_hint (459, cursor ring, page arrows / dots),
# evt_rogue_map_runner (460, the IE3 avatars). The Lua is the graft research/grafts/rogue_shop/evt_rogue_shop_menu.lua
# (menu_assemble.py new_file). Art: evt_rogue_shop.g4tx (research/scripts/rogue_shop_build.py) + the avatar and crest
# atlases (evt_rogue/avatars/, evt_rogue/crests/, loaded by the Lua).
schema = "VRFW.menu/2"

[[screen]]
name = "evt_rogue_shop_menu"
like = "language_option_menu"
# the registry is full at 384 rows (the game dies at boot past that, docs/game/ui/menu-layer-limits.md):
# this screen takes over the row of a trial-build title menu that the PC game never opens
replaces = "title_menu_trial_thankyou_tgs2025"
base = "savedata_management_menu"

[screen.rows]
