# Oficina de fichajes: las pruebas («Prueba», pruebas fijas EVT_TRIALS, pruebas con desafío de los mods [[recruit.trials]],
# prueba de robo). Se juegan DENTRO de la partida del jugador, desde el Mercado: sumidero (ningún guardado llega a su
# fichero desde el lanzamiento hasta la vuelta) y el título vuelve a leer la partida del disco (keep_game = false). El
# «superada» va por carta en el save engine (office.<carta>.<n.º de requisito>), nunca en un bit global de la partida.
# Contexto: tag = carta (chara_param), sub = n.º del requisito de la carta (1..4), game / difficulty de la prueba,
# objective = código del desafío; aux1 = fila del Mercado + 1, aux2 = partido de la página, aux3 = NN de EVT_TRIALS.
