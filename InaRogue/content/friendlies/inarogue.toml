schema = "VRFW.friendly/1"
# INAROGUE's node matches (moved from Inazuma Fantasy 2026-10-14; docs/game/modes/inarogue.md §20, §28).

[[friendly]]
id = "inarogue_5v5"
name = "INAROGUE: pachanga 5 contra 5"
team = "current"            # el dock VS de la run (contexto: set = IRD.set)
kit_from_11 = true
pre_match = true
save = "game"
return = "title"
keep_game = true
field_net = false           # INAROGUE tiene su propia red (rogue_field)
before = [
  { op = "deactivate", menu = "soccer_team_dock_menu" },
  { op = "fade_black", secs = 0.3, frames = 60 },
  { op = "byte", key = "EVT_IR_LAYER", value = 23 },   # byte 606 = 23: partido lanzado desde el dock
]
after = [
  { op = "close", menu = "team_dock_common_top_menu" },
  { op = "wait_settled", frames = 120 },
  { op = "top_wait", secs = 1.5 },
  { op = "close", menu = "soccer_team_dock_menu" },
]

