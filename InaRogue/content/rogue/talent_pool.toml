schema = "InaRogue.talent_pool/1"
# InaRogue › the talents a v2 run can give (docs/game/mods/inarogue-loop-v2.md «Talento propio»): one per player of the
# run's team (only a player with no «Talento propio» of content/rogue/talents.toml), in his custom passive slot until
# the run ends. Read by scripts/lib/rogue/talent_pool.lua; offered by the Tienda (price by rarity), an Élite reward
# and the event «El mentor» (weights per source: config.toml [rogue.run] talent_weights). Texts (9 languages):
# text/rows/rogue_talents.toml, InaRogue.run_talent_<key>_name / _desc.
#
# [[talent]]
#   key      a-z 0-9 _
#   rarity   common / rare / epic
#   passive  the game passive in the slot (a retail base id: the game picks its version by the player's rarity;
#            one single effect each, values in docs/game/mechanics/pasivas-configurables.md)
#   sources  shop / elite / event

