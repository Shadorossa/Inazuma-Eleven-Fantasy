# INAROGUE rival strength ranks and phase bands (docs/game/modes/inarogue-pachangas.md §4; loader module
# rogue::ranks, [rogue.rivals] ranks in config.toml). Ranks 0-1000. Boards of rule 2+ draw a node's rival from the
# rank band of its phase instead of the old tier window; the match level comes from the phase's level curve
# ([rogue] level_curve + the node's bonus) ± `spread` levels by the rival's place in the band.
#
# [band] is hand-tuned (research/scripts/rogue_rival_pool_build.py keeps it and reads it to size the ladders);
# [rows] is GENERATED by that script (the Chronicle clones evt_rl_f_* / evt_rl_s_* and the special bosses evt_rl_b_*,
# which are not in the pool table). The pool table's own rows carry their rank in roguelite_team's `rank` column.
schema = "inazuma_fantasy.rogue_ranks/1"

[band]
# [phase, centre rank]: phase 1 = VR clubs and the first IE1 clubs, ~phase 8 Aliea, ~12 FFI / GO, ~25 Galaxy and the
# VR originals, 50+ legends and Cross / Fantasy teams.
curve = [[1, 60], [3, 150], [5, 240], [8, 350], [12, 460], [18, 570], [25, 670], [35, 770], [50, 870], [70, 950]]
width = 70          # normal nodes (5v5 pachanga, 11v11): centre ± width (adjacent phases overlap)
elite = 60          # Élite: centre .. centre + width + elite
boss = 90           # phase boss: the band's top, centre + width/2 .. centre + width + boss
epic = 40           # «Jefe épico»: centre .. centre + width + epic (easier than the boss)
gate = 160          # «Jefe de puerta»: centre + width + boss/2 .. centre + width + gate (above the boss)
spread = 3          # levels: band top +spread, band bottom -spread over the phase's level
min_rows = 6        # a band with fewer rows widens by `width` steps

