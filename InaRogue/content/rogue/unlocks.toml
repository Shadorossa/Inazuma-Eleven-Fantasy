# INAROGUE unlocks → the Oficina de fichajes (docs/game/modes/inarogue-unlocks.md). Hand-edited: Nacho, change cards,
# prices and conditions here. Read by the loader (module rogue, [rogue.unlocks] of config.toml) and by
# research/scripts/rogue_unlocks_office_build.py, which writes the office page from it (rerun it after editing cards,
# prices, levels or [office]; hints and conditions need no rebuild).
#
# A card is UNLOCKED by playing INAROGUE (save slot 4) and is then SIGNED in the normal game's office, page «INAROGUE»
# (Historia tab, first row), with fichas of its element like any office player. Nothing is granted for free. Unlocks
# are global: they count for every normal save slot.
#
# [[card.when]] rules (all of a card's rules must hold; progress counts across runs, since this feature exists; the
# runs / best phase the INAROGUE bank already had are copied once):
#   phase        { phase }                         reach phase N in a run
#   boss_phase   { phase }                         beat the boss of phase N or a later one
#   beat         { rival, node?, phase? }          beat a rival: Spanish team name (case-insensitive) or evt_rl_* row;
#                                                  node = "boss" (default) / "elite" / "boss_or_elite" / "any"
#   with_player  { params, label?, node?, phase? } win a node (default: a boss) with any of these cards in the team
#   wins         { count }                         matches won
#   bosses       { count }                         phase bosses beaten
#   runs         { count }                         runs finished (lost, abandoned or won)
#   runs_won     { count }                         runs won
#   album        { count }                         cards owned in the INAROGUE album
#   rival_with_player { rival, params, label?, node?, phase? }  beat that rival while one of these cards plays for it
#                                                  (a guest of [[rogue.rivals.guest]] in config.toml: a rare line-up)
#   beat_era     { era, node?, phase? }            beat a rival of that era ([rogue.rivals] eras: ie1 … cs … orion)
# enabled = false: the card stays listed but is inactive (never unlocks, not in the office at all).
#
# Nacho 2026-10-06: only Byron Love, Nakata Hidetoshi and Arion Sherwind (Ídolos) are active; the rest «pending — Nacho».
# hint = the line the office shows on a locked card (empty = built from the rules); counters add their progress.
schema = "inazuma_fantasy.rogue_unlocks/1"

[office]
shop = "evt_oficina_4"        # office shop of the page (rows appended there)
slot = 51                     # EVT_OFI_TEAM page slot in that shop (evt_oficina_4 uses 0-50 today)
game = "evt_ofi_inarogue"     # fake game id of the hub row (like the old Ojeadores row)
title = "INAROGUE"
show_locked = true            # true: locked cards as silhouettes with their hint; false: only unlocked cards

