# INAROGUE boss tiers and special bosses (docs/game/modes/inarogue.md §33 «Jefes especiales»). Hand-written data:
# the loader module rogue::bosses reads it ([rogue.bosses] file in config.toml); research/scripts/rogue_bosses_build.py
# turns every [[special]] into its match game evt_rl_b_<id> (soccer_game_config base table + result trigger).
#
# Three boss tiers per phase, all match nodes of the route map:
#   [boss]  the phase boss (last column, mandatory): the 11v11 pool as before; with special_chance a [[special]] whose
#           roles include "boss" takes its place (from its min_phase).
#   [epic]  «Jefe épico»: an OPTIONAL side node in a middle column, EASIER than the phase boss (level_offset below it).
#           Pool: the 11v11 rows that are not emblematic + [[special]] with role "epic"; rows tagged "minor" (the
#           original minor story teams) weigh minor_weight times more.
#   [gate]  «Jefe de puerta»: an OPTIONAL node in the column right before the phase boss, HARDER than the boss
#           (level_offset above it). Pool: the emblematic rivals ([rogue.rivals] emblematic) + [[special]] with role
#           "gate" (special_weight each, x their own weight).
# Board rule: an optional node never closes the way (a path that avoids every Élite / épico / puerta always exists);
# from_phase = the first phase it can appear (that phase always gets one: the «new thing» moment), then `chance` per
# phase. Saved runs keep their current board; the rule applies from their next phase.
# Rewards: [rogue.points] win[4] (épico) / win[5] (puerta, + boss_per_phase x phase like the boss); a won puerta gives
# the boss fragments (frags_boss).
schema = "inazuma_fantasy.rogue_bosses/1"
# Fusion / successor bosses ([[special]] requires_defeated): "run" = the components must be beaten in the current run
# (as seen when the phase began), "lifetime" = beaten in any INAROGUE run (the unlock store).
requires_scope = "run"

[boss]
special_chance = 0.30        # a phase boss is a [[special]] (role "boss") this often, when one is available
special_level_bonus = 4      # extra levels of a special boss over the phase boss level

[epic]
enabled = true
from_phase = 2
chance = 0.45
level_offset = 5             # levels below the phase boss
minor_weight = 4.0           # rows tagged "minor" weigh this many times more
special_weight = 1.0

[gate]
enabled = true
from_phase = 4
chance = 0.35
level_offset = 8             # levels above the phase boss
emblematic_weight = 1.0
special_weight = 2.0

# The difficulty ladder of every special boss game (one difficulty row per level, AI class rising with the level);
# a [[special]] may give its own `ladder`. The loader takes the first level at or above the node's target.
[ladder]
levels = [8, 12, 16, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80, 90, 100, 110, 125, 140, 160, 180, 200]
template_game = "fbtl_free_001"     # builder: info row + AI classes of the free match
stadium = 0x22E965A5                # the free match's stadium (a [[special]] may name its own)

# Tier tags of rivals (shared vocabulary with the 5v5 rival pools, inarogue.md §33.4): tag -> rival names (Spanish
# team_text, case-insensitive) or evt_rl_* row names. Tags in use: minor (the original minor story teams: favoured
# as «Jefe épico»), boss_only (only a phase boss or a gate boss may draw them: never a normal, Élite or épico node),
# special, crossover, legend (read from the [[special]] entries).
[tags]
# Nacho 06/10: boss / gate-boss teams only (the fusion bosses below)
boss_only = ["Dinastía Galáctica", "Criaturas de la Noche", "Caos", "Ángel Oscuro", "Equipo Zero", "Cuerno Demoníaco",
             "Ragnah"]
minor = [
  "Inazuma Kids FC", "Occult", "Wild", "Brain", "Otaku", "Shuriken", "Farm", "Kirkwood", "Servicio Secreto",
  "Caballeros Templarios", "Empollones", "Vía Láctea", "Poderosa Fe", "Alpino", "Cala Pirata", "Ultramegahiedra",
]

