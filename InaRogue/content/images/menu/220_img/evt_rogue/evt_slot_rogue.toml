# ---- game sources (the player's game files) -------------------------------------------------------------------------
# card bodies: the save info plate, focused (a whole texture) and unfocused (a sprite)
[[recipe]]
name = "base_on"
game = "dx11/menu/51_save/save01/save01_04/es/save01_04.g4tx"
texture = "save_info_base01"

[[recipe]]
name = "base_off"
game = "dx11/menu/51_save/save01/save01_04/es/save01_04.g4tx"
sprite = "save_info_base02"

# the route map of the main menu: the INAROGUE mark (crest, title band, «En curso» row)
[[recipe]]
name = "route_map"
game = "dx11/menu/100_mainmenu/mainmenu90/mainmenu90_02_2/mainmenu90_02_2.g4tx"
sprite = "icon_menu07_on"
ops = [{ op = "alpha_crop" }, { op = "alpha_normalize" }]

# the title screen's tournament-route picture (slanted 392 x 160): its straight middle, 301 x 45, to 424 x 64
[[recipe]]
name = "strip"
game = "dx11/menu/50_title/title00/title00_07/title00_07.g4tx"
sprite = "btn_base08_on"
ops = [{ op = "crop", box = [44, 58, 345, 103] }, { op = "resize", size = [424, 64] }, { op = "hue", turns = 0.08 }]

# ---- card body (as the framework's): one 168 px period of the hexagon body tiled from y 4, the grey row bands, the
# bottom bar, a thin top line, rounded lower corners; then the INAROGUE violet (0.14 turns of hue) ------------------
