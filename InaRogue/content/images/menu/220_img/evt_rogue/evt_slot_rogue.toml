# InaRogue: the INAROGUE card art on the VR-Framework's save slot screen (#/menu/220_img/evt_rogue/evt_slot_rogue.g4tx,
# a NEW atlas). The card's provider (graft inarogue_slot, inarogue_slot_card.lua) names these sprites. Every picture is
# made at the first start (and after a game update) from the player's own game files by the image type's recipes
# (docs/framework/types/image.md §2.1).
# Look: the framework's card body (VRFW evt_slot_base.toml) in the INAROGUE violet, the route-map icon as the crest and
# on the title band, the title screen's tournament-route picture as the banner, one game icon per row.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/220_img/evt_rogue/evt_slot_rogue.g4tx"
name = "evt_slot_rogue"
size = [1332, 624]

# ---- sprites (the card binds them by crc32 of the name) ------------------------------------------------------------
