# ---------------------------------------------------------------------------------------------------- overlay session
# scripts\lib\rogue\svc_session.lua over VRFW.session (INAROGUE's reserved slot, journal rogue_session.json)

# CMND_EVT_RL_SESSION_BEGIN (kind 0 INAROGUE swap / 1 test) -> ok, code, imageKiB, ms (code 12 = no game yet)
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_BEGIN"
aliases = ["CMND_EVT_RL_SESSION_BEGIN"]
handler = "InaRogue.Mode.SessionBegin"

# CMND_EVT_RL_SESSION_END (mode 0..3) -> ok, code, dirtyBlocks, ms
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_END"
aliases = ["CMND_EVT_RL_SESSION_END"]
handler = "InaRogue.Mode.SessionEnd"

# CMND_EVT_RL_SESSION_STATE -> open, slot, discardedWrites, imageKiB, reloadArmed, enabled, debug, swapped
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_STATE"
aliases = ["CMND_EVT_RL_SESSION_STATE"]
handler = "InaRogue.Mode.SessionState"

# CMND_EVT_RL_SESSION_RELOAD -> ok, code
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_RELOAD"
aliases = ["CMND_EVT_RL_SESSION_RELOAD"]
handler = "InaRogue.Mode.SessionReload"

# CMND_EVT_RL_SESSION_DISK_CHECK -> ok, same, dirtyBlocks
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_DISK_CHECK"
aliases = ["CMND_EVT_RL_SESSION_DISK_CHECK"]
handler = "InaRogue.Mode.SessionDiskCheck"

# CMND_EVT_RL_SESSION_ORPHAN -> wasOpen, code
[[VRFW.Command]]
name = "CMND_INAROGUE_RL_SESSION_ORPHAN"
aliases = ["CMND_EVT_RL_SESSION_ORPHAN"]
handler = "InaRogue.Mode.SessionOrphan"

# module bit 32768 of CMND_EVT_LOADER_VERSION (was the plugin's MOD_ROGUE: INAROGUE's commands answer): on with the mod
[[VRFW.ModuleMask]]
bit = 15
needs = ["CMND_INAROGUE_RL_BANK_COUNT"]
