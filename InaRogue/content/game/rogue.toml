# InaRogue › INAROGUE (docs/game/modes/inarogue.md; docs/framework/new-core/if-wave6a.md). Logic: scripts\inarogue.lua +
# scripts\lib\rogue\. Was the Rust module rogue of inazuma_fantasy.dll until 2026-10-10. Commands CMND_INAROGUE_RL_* /
# CMND_INAROGUE_RU_* with the old names as aliases (the grafts and menus call those). The session wrappers
# CMND_EVT_RL_SESSION_*, the «Sin rol» commands CMND_EVT_RL_NO_ROLE / _NO_ROLE_ALL / _ROLE_CARRY and the coaches'
# stat_mult on the match copy were the plugin's until 2026-10-11 (IF final round, docs/framework/new-core/if-final-misc.md).
schema = "VRFW.game/2"

# ---------------------------------------------------------------------------------------------------- game code

# TeamInfo& TeamInfo::operator=(TeamInfo* dst, const TeamInfo* src) 0x20D440 (0x2D0 bytes with its sub-arrays)
[[VRFW.Function]]
name = "RL_TeamInfoAssign"
game = "Party.TeamInfoAssign"

# [[g_gameRoot] + 0x69A8] = CGDDPartyStatus (charaBank at +0x9F70, rpgCharaBank at +0xF24C, team sets at +0x17B8)
[[VRFW.Global]]
name = "rl_party"
base = "game_root"
chain = ["ROOT_PARTY"]

# ---------------------------------------------------------------------------------------------------- the INAROGUE save

# INAROGUE is the game in memory: the active save slot is INAROGUE's reserved slot (the native table InaRogue.Slot,
# filled by scripts\inarogue.lua from [save_slots] slot). Computed at each read: native answers of other IF
# pieces and other mods' scripts read it (was the plugin's rogue::game_active until 2026-10-11).
[[VRFW.State]]
key = "inarogue.active"
formula = "lookup_or(InaRogue.Slot, 0, slot)"

# Utilities' away_kit kit-less extension point: the one kit INAROGUE may write on a team that has no kit yet, the
# retail «Equipación estándar» uni_u119101 (0x9EDB7BFC), only while the INAROGUE save is loaded (docs/game/modes/
# inarogue.md §21; was the plugin's if_boot answer)
[[VRFW.State]]
key = "utilities.away_kit.kitless.uniform"
formula = "if(lookup_or(InaRogue.Slot, 0, slot) == 1, 0x9EDB7BFC, 0)"

# The run coach's stat_mult effects on the match copy of the run's own players (docs/game/modes/inarogue.md
# «Entrenadores»): the multipliers are the native table InaRogue.CoachMult (scripts\lib\rogue\svc_meta.lua coach_sync:
# key (handle, stat) of a listed run handle, (0, stat) when the run lists none); d = round(f32(stat × f32(k − 1))),
# clamped to 1..9999 with the stat. After the trained points (10), before the run speed (100).
# Plus the flat points of InaRogue.CoachAdd (the items' stat_bonus, same keys; absent = 0).
[[VRFW.MatchStat]]
name = "InaRogue.Coach"
order = 20
when = { value = ["slot"], in_table = "InaRogue.Slot" }
stat = "let(k, f32(lookup_or(InaRogue.CoachMult, lookup(InaRogue.CoachMult, 0, i), args[2], i)), clamp(args[4] + round(f32(args[4] * f32(k - 1))) + round(f32(lookup_or(InaRogue.CoachAdd, lookup_or(InaRogue.CoachAdd, 0, 0, i), args[2], i))), 1, 9999))"

# void SetTrophyTier(const u32* trophyId, u32 tier, bool notify) 0xE89BE0: the retail «logros» setter (the banner, the
# trophy count, the Steam achievement). A pre handler skips it while the INAROGUE save is the loaded game
# (docs/game/modes/inarogue.md §21). Stolen bytes: mov [rsp+8],rbx; mov [rsp+10h],rbp; mov [rsp+18h],rsi (15, fixed).
[[VRFW.Hook]]
name = "RL_TrophySetTier"
game = "Chronicle.TrophySetTier"
kind = "function"

