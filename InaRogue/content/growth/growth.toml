schema = "InaRogue.growth/1"
# InaRogue's own growth (decision 3 of docs/refactor/roguelite-split-map.md; docs/game/modes/inarogue-growth.md): the
# numbers INAROGUE's levels follow, declared here and depending on no other mod. Read by scripts\lib\rogue\growth.lua.
#   LevelCap      the highest level INAROGUE gives or plays (rival ladders, boss levels): 1..999 (inarogue-infinite-scaling:
#                 the cap stays <= 999; a run's rivals scale by rule multipliers past it, never by level)
#   StartLevel    the level of a player when he joins the INAROGUE bank (starter, gift, gacha, recruit)
#   RivalLevels   [phase, target level] keyframes of the rivals (linear between keys; a node column rises toward the next
#                 phase's value; Élite / boss add [rogue] elite_bonus / boss_bonus). [rogue] level_curve of config.toml,
#                 when set, replaces it (a player's tuning)
# The player's own EXP cap follows the game's level table (99 retail; another mod's [VRFW.Level] raises it for every save).
# A cap per mode (inarogue.run) needs the framework's scoped growth (V8, not built yet): until then LevelCap bounds what
# INAROGUE itself sets.

[InaRogue.Growth]
LevelCap = 99
StartLevel = 5
RivalLevels = [[1, 6], [2, 9], [3, 13], [5, 18], [8, 25], [12, 35], [18, 45], [25, 55], [35, 65], [50, 75], [70, 85], [90, 95]]
