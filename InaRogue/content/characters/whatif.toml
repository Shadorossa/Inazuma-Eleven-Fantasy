  [character.text.ja]
  description = "もしも[豪炎寺/ごうえんじ]が[木戸川清修/きどがわせいしゅう]を[去/さ]らなかったら…。\nその[炎/ほのお]は[今/いま]、[木戸川/きどがわ]の[色/いろ]に[燃/も]える。"

  [character.text.en]
  description = "What if Axel had never left Kirkwood?\nHis fire now burns in Kirkwood's colours."

  [character.text.es]
  description = "¿Y si Axel nunca hubiera dejado el Kirkwood?\nSu fuego arde ahora con los colores del Kirkwood."

  [character.text.fr]
  description = "Et si Axel n'avait jamais quitté Kirkwood ?\nSa flamme brûle désormais aux couleurs de Kirkwood."

  [character.text.de]
  description = "Was, wenn Axel Kirkwood nie verlassen hätte?\nSein Feuer brennt jetzt in Kirkwoods Farben."

  [character.text.it]
  description = "E se Axel non avesse mai lasciato la Kirkwood?\nIl suo fuoco ora arde con i colori della Kirkwood."

  [character.text.pt]
  description = "E se Axel nunca tivesse deixado a Kirkwood?\nSeu fogo agora arde com as cores da Kirkwood."

  [character.text.zh_hans]
  description = "如果豪炎寺从未离开木户川清修……\n他的火焰如今燃烧着木户川的颜色。"

  [character.text.zh_hant]
  description = "如果豪炎寺從未離開木戶川清修……\n他的火焰如今燃燒著木戶川的顏色。"

