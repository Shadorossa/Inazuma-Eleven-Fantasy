  [character.text.en]
  description = "What if Vladimir had never been hurt?\nAlongside <FFC:TSURUGI>, he is Raimon's mastermind."

  [character.text.es]
  description = "¿Y si Vladimir nunca se hubiera lesionado?\nJunto a Víctor, cerebro del Raimon."

  [character.text.fr]
  description = "Et si Vladimir ne s'était jamais blessé ?\nAux côtés de <FFC:TSURUGI>, le cerveau de Raimon."

  [character.text.de]
  description = "Was, wenn Vladimir sich nie verletzt hätte?\nMit <FFC:TSURUGI> der Kopf von Raimon."

  [character.text.it]
  description = "E se Vladimir non si fosse mai infortunato?\nAccanto a <FFC:TSURUGI>, la mente della Raimon."

  [character.text.pt]
  description = "E se Vladimir nunca tivesse se machucado?\nAo lado do <FFC:TSURUGI>, o cérebro do Raimon."

  [character.text.zh_hans]
  description = "如果优一从未受伤……\n与剑城京介并肩的雷门司令塔。"

  [character.text.zh_hant]
  description = "如果優一從未受傷……\n與劍城京介並肩的雷門司令塔。"

