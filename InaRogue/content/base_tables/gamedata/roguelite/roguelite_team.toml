# InaRogue › INAROGUE's rival pool table (scripts\lib\rogue\pool.lua): the rows are the pool lists' entries
# (content\teams\lists.toml: the random-team slot teams), added by the team build; the header's col 2 counts them.
# The 100 numbered rivals evt_rl_tm_001..100 were removed on 2026-10-14 (their names / crests / kits are the look pool).
# Rival 1 stays as the row template the team build clones for the pool rows; it is tagged `retired`, so never drawn.
schema = "VRFW.base_table/1"
file = "data/common/gamedata/roguelite/roguelite_team.cfg.bin"

[new]
order = ["ROGUE_TEAM_HEADER", "ROGUE_TEAM_INFO", "ROGUE_TEAM_MEMBER", "ROGUE_TEAM_DIFFICULTY"]

[[entry]]
name = "ROGUE_TEAM_HEADER"
values = [1, 0x01352840, 1, 5]

[[list]]
name = "ROGUE_TEAM_INFO"
columns = ["no", "team", "team_key", "name", "game", "game_key", "tier", "stadium", "emblem", "uniform", "formation", "element", "power", "template_game", "tags", "format", "rank"]
rows = [
  [1, 0x953B0010, "evt_rl_tm_001", "Leones Errantes", 0xE58E6E7E, "evt_rl_t_001", 1, 0x932A0650, 0xBCDA243E, 0xC9C2A801, 0x5D71E8B3, 3, 5527, "sbtl_space_01", "retired", 5, -1],
]

[[list]]
name = "ROGUE_TEAM_MEMBER"
columns = ["team_no", "slot", "chara_param", "position", "element", "rogue_rarity", "name"]
rows = [
  [1, 0, 0x0C482AD0, 1, 1, 1, "Volbert Brackenbal"],
  [1, 1, 4879573, 4, 2, 1, "Kipp Sycamore"],
  [1, 2, 0x2EEB69E6, 4, 2, 1, "Richter Poole"],
  [1, 3, 0xA0FD65DC, 3, 3, 1, "Kenneth Frostner"],
  [1, 4, 0x28333221, 2, 3, 1, "Masala Mettler"],
]

[[list]]
name = "ROGUE_TEAM_DIFFICULTY"
columns = ["team_no", "difficulty", "level"]
rows = [
  [1, 1, 6], [1, 2, 7], [1, 3, 9], [1, 4, 10], [1, 5, 12], [1, 6, 13], [1, 7, 15], [1, 8, 16], [1, 9, 18], [1, 10, 19],
]
