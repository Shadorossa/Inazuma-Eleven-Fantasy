schema = "TrueHissatsu.rules/1"
# Inazuma Fantasy's rules for the mod True Hissatsu (its scripts read [TrueHissatsu.Rules] of every active mod's
# content\true_hissatsu\*.toml; docs/refactor/aura-mods-split.md «True Hissatsu»). Was the [rogue] move_rank_by_use
# switch of IF's module skill_rank until 2026-10-14 (Nacho 2026-10-07; docs/game/modes/inarogue.md «Move grades in
# INAROGUE»): special moves do NOT level up by use while INAROGUE is the loaded game; every player keeps his card's
# move grades (characters\move_grades.toml) plus the INAROGUE boosts (CMND_TRUEHISSATSU_RANK_BOOST, alias
# CMND_EVT_SKILL_RANK_BOOST). Normal slots level up by use as always. The state key is set by content\game\rogue.toml.
# max_grade_states: the piece technique_grade_override of the rogue items (scripts/lib/rogue/svc_pieces.lua sets
# InaRogue.max_grade = 1 while such an item has matches left): every move of the user's players plays at the last
# grade in those matches; the saved grades stay.

[TrueHissatsu.Rules]
no_rank_up_states = ["inarogue.active"]
boost_states = ["inarogue.active"]
max_grade_states = ["InaRogue.max_grade"]
