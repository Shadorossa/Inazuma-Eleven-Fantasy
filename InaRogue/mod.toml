id = "InaRogue"
former_ids = ["inarogue"]
name = "InaRogue"
version = "1.50.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "INAROGUE: el modo roguelite de Inazuma Eleven. Elige tu equipo de tu colección, supera 3 fases y el jefe final, ficha a jugadores de tus rivales, consigue reliquias y sube la Exigencia (ranura 4)."
priority = 0
tags = ["Mode"]
updated = "2026-10-30"
# 1.1.0 (owner 2026-10-20): the welcome gacha of the first entry (docs/game/modes/inarogue-welcome-gacha.md): the
# first-run gift drawn in a gold copy of the Players Universe scene, each player revealed by the retail summon
# performance, then a summary of the players.
# INAROGUE (docs/game/modes/inarogue.md) out of Inazuma Fantasy as a mod of its own (owner 2026-10-13/14,
# docs/refactor/roguelite-split-map.md). It runs on the VR-Framework alone: Chronicles Deluxe (remastered crests),
# Inazuma Fantasy (office unlocks, IF's cards in the tiers / rival pool), Utilities and BetterUI are optional
# companions (if_mod gates, soft commands). Inazuma Fantasy requires InaRogue, never the other way round.
# vr_framework 2.2.205: the save import service ([[VRFW.SaveImport]]: INAROGUE's saved files of mod inazuma_fantasy) and the
# reserved-slot hand-over (`takes_over`); 2.2.159: if_mod gates; 2.2.x: the title row host, the random team service.
# Optional data for other mods, read only when they are enabled: content/album (schema BetterQoL.album/1, BetterQoL's
# player album) and content/hissatsu_level_up (schema HissatsuLevelUp.rules/1).
requires = ["VRFW>=2.268.0"]
# its title press / menus run before the other mods' patches, as INAROGUE did inside Inazuma Fantasy
lua_early = true
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
prefix = "InaRogue"
folder = "InaRogue"
# RL_* game functions, the RL_TrophySetTier hook, the slot / mode commands and state keys (content\game\)
permissions = ["memory", "call", "patch", "command", "state", "hook"]

[exports]
# called by Inazuma Fantasy's scripts (it requires InaRogue): INAROGUE's save slot, the Rogue points item id and TalentOfCard(card) -> passive id, always open, talent name. Phase 2 of the split adds the collectibles' read API here.
functions = ["SaveSlot", "PointsItem", "TalentOfCard"]
keys = []
# the talent slot (content\rogue\talents.toml, scripts\lib\rogue\talents.lua): VRFW's passive slot detours
# (service S6, vr_framework 2.8.25) read these, keyed by INAROGUE's save slot
tables = ["Passive.SlotsOff", "Passive.SignatureSlot", "Passive.SignatureOpen", "Passive.SignatureOnly"]

# its own content\ folders read only by its scripts (no framework type): the catalogues (content\rogue\) and its growth
# (content\growth\), its rule for the mod Hissatsu Level Up (content\hissatsu_level_up\: no move rank-up by use in INAROGUE)
[layout]
script_folders = ["rogue", "growth", "hissatsu_level_up"]

# Debug switches (docs/framework/debug-flags.md): the config.toml settings a debug flag forces on (e.g. while the mod
# Debug Tools is enabled); config.toml keeps them off. Flag `unlock_all`: every avatar, office unlock, coach, album entry and
# formation owned / shown; `all_players`: every draw-pool card in the INAROGUE bank (in memory only); `tools`: the
# INAROGUE debug commands (CMND_EVT_RL_BANK_DEBUG_FILL, CMND_EVT_RL_FRAGS_ADD, CMND_EVT_RL_PROBE_INFO).
[[VRFW.DebugSwitch]]
Flag = "unlock_all"
Config = "rogue.avatars.unlock_all"

[[VRFW.DebugSwitch]]
Flag = "unlock_all"
Config = "rogue.unlocks.unlock_all"

[[VRFW.DebugSwitch]]
Flag = "unlock_all"
Config = "rogue.coaches.unlock_all"

[[VRFW.DebugSwitch]]
Flag = "unlock_all"
Config = "rogue.album.unlock_all"

[[VRFW.DebugSwitch]]
Flag = "unlock_all"
Config = "rogue.formations.unlock_all"

[[VRFW.DebugSwitch]]
Flag = "all_players"
Config = "rogue.debug_all_players"

[[VRFW.DebugSwitch]]
Flag = "tools"
Config = "rogue.debug_tools"
