# INAROGUE (research/scripts/inarogue_build.py; docs/game/modes/inarogue.md): the title button «Inarogue» is a VRFW
# title row entry (menus/50_title/title_row_inarogue.toml, docs/framework/title-row.md: no fixed list index; its
# action is EVT_IR_TitlePress below) and opens the new menu evt_inarogue_menu (src/evt_inarogue_menu.lua + the dock flow
# evt_inarogue_dock.lua; the debug probe block evt_inarogue_probes.lua and its «Pruebas (debug)» row are no longer
# merged, 2026-09-28); slot 4 hosts only INAROGUE (evt_title_rogue_slot.lua, OnOpenLayer wrapper). Screen (§30):
# Continuar-Empezar + the Nueva partida icon (§28) / tiles Álbum (§14.5), Plantilla de equipo (§21), Tienda (hook
# EVT_IR_EXTRA.shop) / Ayuda (§30.3). The menu Lua is edited in place (the src mirror is no longer regenerated into it;
# texts: rogue_play_text_build.py). The rogue_probes test mod is discarded (decision 2026-09-26). Registry / setting /
# objbin stay in the script. Until 2026-10-13 the button was the 9th button of graft mm_entry (tables t3 / t5-t12,
# list index 12); that graft is gone.
name = "inarogue"
mod = "InaRogue"
order = 300
