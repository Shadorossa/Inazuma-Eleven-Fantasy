# Eras of the rivals (INAROGUE unlock rule beat_era, docs/game/modes/inarogue-unlocks.md §3): era -> fragments of the
# evt_rl_* row name, i.e. the Chronicle route of the game the row was cloned from (cro05 = route 4, Chrono Stone).
eras = { ie1 = ["_cro01_"], ie2 = ["_cro02_"], ie3 = ["_cro03_"], go = ["_cro04_"], cs = ["_cro05_"], galaxy = ["_cro06_"], ares = ["_cro07_"], orion = ["_cro08_"] }

# Guest players of a rival's line-up (inarogue-unlocks.md §3b): `chara` (a card) joins `rival` (team name or evt_rl_*
# row) with probability `chance` per node, seeded by (run seed, phase, node) like the rival. On a hit the node plays the
# variant game <row>_g<chara hex> written by research/scripts/rogue_guests_build.py (rerun it after editing this list:
# `slot` = the roster slot the guest takes; the player there moves to the bench).
# Nakata Hidetoshi (normal card) in Orfeo, 5 % of the time: the «Nakata Ídolo» unlock needs a win with him there.
[[rogue.rivals.guest]]
rival = "Orfeo"
chara = 0xFFF7C4EE
slot = 8
chance = 0.05

# «Sello del Maestro» for the warrior spirits (docs/game/mechanics/unlimited-moves.md §5d, owner 2026-10-13): the aura
# items whose item_config sub-category (ITEM_SPECIAL_SKILL_INFO col 6) is in `subs` follow their own rule: one owned copy
# serves every compatible player only while the save owns the Sello AND every Chronicle is completed (when
# `chronicles_complete`): the VR-Framework's VRFW_Chronicle.Complete(chronicle_difficulty) = every board piece of the
# Chronicle routes cleared at that difficulty (a mod's route node: at its first declared difficulty) and every chain
# board complete. Without both an aura item is used up per player (retail). The retail mode-change auras keep their own
# rule (§5b: one copy, no Sello). The armour (172) is left out: it is never equipped alone (it comes with its keshin).
# Never in INAROGUE (as the Sello).
