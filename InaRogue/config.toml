  "Zeus",                     # evt_rl_f_cro01_120 · Kageyama's FF final team
  "Equipo Ogro",              # evt_rl_f_cro01_130 · the future team, IE1 movie
  "Royal Academy",            # Teikoku, Kageyama era (not in the pool today)
  "Raimon",                   # the protagonists, every era (not in the pool today)
  # IE2 (Aliea Gakuen and its war)
  "Tormenta de Géminis",      # evt_rl_f_cro02_010 · Gemini Storm
  "Épsilon",                  # evt_rl_f_cro02_070 · Epsilon
  "Prominence",               # evt_rl_f_cro02_150
  "Polvo de Diamantes",       # evt_rl_f_cro02_160 · Diamond Dust
  "Caos",                     # evt_rl_f_cro02_180 · Chaos
  "Génesis",                  # evt_rl_f_cro02_190 · The Genesis
  "Emperadores Oscuros",      # evt_rl_f_cro02_200 · Dark Emperors
  "Equipo Zero",              # evt_rl_f_cro04_140 · Zero
  # IE3 (FFI)
  "Dragones de Fuego",        # evt_rl_f_cro03_050 · Fire Dragon, Asia final
  "Unicorn",                  # evt_rl_f_cro03_090 · USA, FFI
  "Orfeo",                    # evt_rl_f_cro03_110 · Italy, FFI
  "Pequeños Gigantes",        # evt_rl_f_cro03_180 · Little Giants, FFI final
  "The Kingdom",              # Brazil, FFI semi (not in the pool today)
  "Neo Japón",                # (not in the pool today)
  "Inazuma Japón",            # (not in the pool today)
  "Inazuma Japón Legendario", # evt_rl_f_cro05_230
  # GO / Chrono Stone / Galaxy
  "Protocolo Omega",          # evt_rl_f_cro05_010 · El Dorado's Protocol Omega
  "Protocolo Omega 3.0",      # evt_rl_f_cro05_080
  "El Dorado",                # (not in the pool today)
  "Ragnah",                   # evt_rl_f_cro05_190 · the Ragnarok final team (Feida)
  "Zan",                      # Ragnarok (not in the pool today)
  "Gar",                      # Ragnarok (not in the pool today)
  "Gir",                      # Ragnarok (not in the pool today)
  "Resistencia Japón",        # (not in the pool today)
  "Dragon Link",              # Fifth Sector / Seitei (not in the pool today)
  "Dinastía Galáctica",       # evt_rl_f_cro06_160 · Galaxy endgame (Big Bang + Supernova)
