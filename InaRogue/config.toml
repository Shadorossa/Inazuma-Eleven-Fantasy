# InaRogue: default configuration shipped with the mod (read by the VR-Framework as the mod's config; the loader's
# config.toml [mods.inarogue] overrides it key by key and survives updates). The scripts read it with
# VRFW.files.config("<section>.<key>"). INAROGUE is always on while the mod is enabled (no switch).

# InaRogue's own save (docs/framework/save-slots.md §5.1): the reserved slot that holds the INAROGUE game. Keep 4: it is
# the slot INAROGUE always used (Inazuma Fantasy reserved it until 2026-10-14; InaRogue takes it over, `takes_over`).
[save_slots]
slot = 4

# INAROGUE (module rogue; scripts\lib\rogue\cfg.lua since 2026-10-10, the native remnant reads session_entry /
# session_debug / grant_without_role / move_rank_by_use: every other key keeps the default there). grant_without_role: every player INAROGUE gives (bank roster, draft, recruits, rewards) arrives «Sin rol»
# (no coach / manager badge, no creation-time staff bit) so he can always be fielded; INAROGUE players already in the
# INAROGUE save are cleaned when its menus open. Only records of the INAROGUE save (slot 4) tagged 0x10000000.
[rogue]
grant_without_role = true
# INAROGUE as an OVERLAY on the player's own slot (docs/game/engine/save-overlay-session.md; Nacho 2026-10-07: «no
# debería pasarse a la 4ª ranura»): entering INAROGUE never switches the save slot. The player's game stays the loaded
# slot (kept as a memory image, its file never written meanwhile); INAROGUE's game and data are swapped in from its own
# storage (slot 4's file + modloader_saves\slot4\inarogue) and every INAROGUE save goes there; leaving restores
# the player's game from memory. false = the old slot-4 switch (black fade + GAME_RESET), same data.
session_entry = true
# Debug (docs/game/modes/inarogue.md §8.10): true = every INAROGUE player card (tier 1-5 of the draw pool, no coach /
# manager cards) is in the INAROGUE bank as if owned, so the «Plantilla de equipo» offers all of them for a run. Kept in
# memory only (the bank file never stores them; false = the normal bank again); no unlock counts and the first-run gift
# waits while it is on. debug_all_players_limit = most bank players created in the INAROGUE save for the dock (the game
# holds 5100 characters; at most 5000).
debug_all_players = false
debug_all_players_limit = 5000
# Special moves do NOT level up by use in INAROGUE: the mod Hissatsu Level Up's rule, InaRogue's data
# content\hissatsu_level_up\inarogue.toml (was [rogue] move_rank_by_use of Inazuma Fantasy until 2026-10-14).

# Rogue points («Puntos de rogue», docs/game/modes/inarogue-avatars.md): the INAROGUE currency (item
# inarogue.puntos_rogue, content\items\rogue_points.toml), earned in the run, spent on the avatars. Tune here.
# win = [5v5 pachanga, 11v11 match, Élite, phase boss, Jefe épico, Jefe de puerta] for a won node (épico / puerta:
# inarogue.md §33; the puerta also adds boss_per_phase x phase); every win gets +1 per phase_step phases
# (phases 1-3 +0, 4-6 +1, ...); the boss adds boss_per_phase x phase (the phase cleared); a run that ends (lost /
# abandoned) gives run_end_per_phase x the phase reached (abandoned: abandon_pct % of it).
# Example, phase 1: pachanga 3, 11v11 5, Élite 8, boss 17; a run lost in phase 5: +10.
[rogue.points]
enabled = true
item = "inarogue.puntos_rogue"
win = [3, 5, 8, 15, 10, 25]
phase_step = 3
boss_per_phase = 2
run_end_per_phase = 2
abandon_pct = 50

# Avatars (tab «Personajes» of the INAROGUE «Tienda»): catalogue content\rogue\avatars.toml (generated by
# research/scripts/rogue_avatars_build.py: prices and unlock phases by tier there). unlock_all = debug (all owned).
[rogue.avatars]
enabled = true
file = "content/rogue/avatars.toml"
unlock_all = false

# INAROGUE unlocks → the office (docs/game/modes/inarogue-unlocks.md): special cards unlocked by playing INAROGUE and
# then signed in the office's «INAROGUE» page. Catalogue + conditions: content/rogue/unlocks.toml (the office page itself:
# research/scripts/rogue_unlocks_office_build.py). Global store (every normal save slot). unlock_all = debug.
[rogue.unlocks]
enabled = true
file = "content/rogue/unlocks.toml"
unlock_all = false

# INAROGUE coaches (docs/game/modes/inarogue.md «Entrenadores»): the coach picked at the start of a new run is the
# run's «class» (effects in content/rogue/coaches.toml). unlock_all = debug (every coach selectable).
[rogue.coaches]
enabled = true
file = "content/rogue/coaches.toml"
unlock_all = false

# INAROGUE album sections «Objetos» and «Equipos» (docs/game/modes/inarogue.md §14.6): an item / rival team shows once
# obtained / met in any run (global store rogue_collections.json). unlock_all = debug (everything shown as found).
[rogue.album]
unlock_all = false

# INAROGUE route map look (docs/game/modes/inarogue.md §27.4): fog of war = only the exits of the current (cleared)
# node and the nodes already walked show their rival; every other match node shows a «?» plate (its kind stays
# visible). reveal_boss = the phase boss shows its rival from the start (épico / puerta stay hidden). fog = false: the
# older column fog (3 columns ahead).
[rogue.board]
fog = true
reveal_boss = true

# INAROGUE boss tiers (docs/game/modes/inarogue.md §33 «Jefes especiales»): «Jefe épico» (optional, easier than the phase
# boss), «Jefe de puerta» (optional, harder, right before the boss) and the special bosses of the 3DS event / crossover
# matches (Héroes de L5, Chrono Crisis…). Everything (weights, level offsets, phases, the bosses) is in content/rogue/bosses.toml.
[rogue.bosses]
enabled = true
file = "content/rogue/bosses.toml"

# Emblematic rivals (docs/game/modes/inarogue.md §31): iconic story / boss teams never drawn on a normal node (5v5
# pachanga, 11v11 match); only the node kinds in emblematic_on may draw them. Entries = the rival name (Spanish
# team_text, case-insensitive) or an evt_rl_* row name. Names not in today's pool are harmless (kept for when the
# pool grows). Saved runs keep their current board; the rule applies from their next phase / new runs.
[rogue.rivals]
emblematic_on = ["elite", "boss"]
emblematic = [
