# The forms of the rule type's files (docs/framework/types/rule.md): rulebooks (`VRFW.rule/1`, one per file) and their
# bindings (`VRFW.rule_binding/1`), in the editor schema format (docs/framework/modmanager-editor-schemas.md).
# ModManager's «Reglas» page edits every mod's rule files with them, in place. `For` names the file kind a root shape
# is the form of. The keys are the match engine's (ruleset.rs, assign.rs, challenge/rules.rs, pitch.rs): every save is
# read back by its strict parser first. A field without a value keeps the match row's rule (the game's), so «—» is a
# value of its own. Read only by ModManager: the game does not read content\editor\.
schema = "VRFW.editor/1"

# ---------------------------------------------------------------------------------------------- rulebook (rule/1)
[[Shape]]
Id = "rulebook"
For = "VRFW.rule/1"
  [[Shape.Field]]
  Key = "id"
  Type = "id"
  Required = true
  Label = { es = "Id", en = "Id" }
  Help = { es = "Único; lo usan los enlaces, los modos y los partidos amistosos.", en = "Unique; bindings, modes and friendlies name it." }
  [[Shape.Field]]
  Key = "name"
  Type = "string"
  Label = { es = "Nombre", en = "Name" }
  Help = { es = "Nombre de reserva; en el juego se usa el texto <mod>.ruleset_<id>.", en = "Fallback name; the game shows the text <mod>.ruleset_<id>." }
  [[Shape.Field]]
  Key = "aliases"
  Type = "list"
  Of = "string"
  Label = { es = "Ids anteriores", en = "Former ids" }
  Help = { es = "Quien nombre uno de estos ids sigue encontrando este reglamento.", en = "Whatever names one of these ids still finds this rulebook." }
  [[Shape.Field]]
  Key = "training"
  Type = "bool"
  Default = false
  Label = { es = "Partido de entrenamiento", en = "Training match" }
  Help = { es = "Sin resultado ni premios: los demás mods saltan sus registros.", en = "No result or rewards: other mods skip their records." }
  [[Shape.Field]]
  Key = "time"
  Type = "table"
  Of = "rule_time"
  Label = { es = "Tiempo", en = "Time" }
  [[Shape.Field]]
  Key = "teams"
  Type = "table"
  Of = "rule_teams"
  Label = { es = "Equipos", en = "Teams" }
  [[Shape.Field]]
  Key = "kickoff"
  Type = "table"
  Of = "rule_kickoff"
  Label = { es = "Saque inicial", en = "Kick-off" }
  [[Shape.Field]]
  Key = "play"
  Type = "table"
  Of = "rule_play"
  Label = { es = "Juego", en = "Play" }
  [[Shape.Field]]
  Key = "end"
  Type = "table"
  Of = "rule_end"
  Label = { es = "Final del partido", en = "End of the match" }
  [[Shape.Field]]
  Key = "pitch"
  Type = "table"
  Of = "rule_pitch"
  Label = { es = "Campo", en = "Pitch" }
  [[Shape.Field]]
  Key = "challenge"
  Type = "table"
  Of = "rule_challenge"
  Label = { es = "Desafío", en = "Challenge" }
  Help = { es = "Opcional: el partido se juega como un desafío.", en = "Optional: the match is played as a challenge." }

[[Shape]]
Id = "rule_time"
  [[Shape.Field]]
  Key = "half_minutes"
  Type = "int"
  Min = 0
  Max = 90
  Label = { es = "Minutos por parte", en = "Minutes per half" }
  Help = { es = "También la prórroga y el gol de oro. 0 = sin límite (solo con 0 partes o sin fin). Vacío = los del partido.", en = "Also extra time and golden goal. 0 = no limit (only with 0 halves or endless). Empty = the match's." }
  [[Shape.Field]]
  Key = "halves"
  Type = "int"
  Min = 0
  Max = 10
  Label = { es = "Partes", en = "Halves" }
  Help = { es = "0 = sin tiempo reglamentario. Vacío = las del partido.", en = "0 = no regular time. Empty = the match's." }
  [[Shape.Field]]
  Key = "endless"
  Type = "bool"
  Default = false
  Label = { es = "Sin fin", en = "Endless" }
  Help = { es = "Una parte con el reloj parado: el partido no acaba solo.", en = "One period with the clock stopped: the match never ends by itself." }

[[Shape]]
Id = "rule_teams"
  [[Shape.Field]]
  Key = "players"
  Type = "int"
  Min = 1
  Max = 11
  Label = { es = "Jugadores por equipo", en = "Players per side" }
  [[Shape.Field]]
  Key = "goalkeeper"
  Type = "bool"
  Label = { es = "Porteros", en = "Goalkeepers" }
  Help = { es = "No = todos de campo (necesita una formación sin portero).", en = "No = all outfield (needs an all-outfield formation)." }
  [[Shape.Field]]
  Key = "fill"
  Type = "bool"
  Label = { es = "Rellenar huecos", en = "Fill holes" }
  Help = { es = "Un puesto vacío de la alineación lo ocupa un suplente (el portero primero).", en = "An empty line-up spot gets a bench player (the keeper's first)." }
