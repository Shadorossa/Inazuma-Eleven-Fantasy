# The forms of the framework's match declarations: [[VRFW.RouteNode]], [[VRFW.MatchChallenge]], [[VRFW.GameDrops]] and
# [[VRFW.LevelMap]] (docs/framework/modmanager-editor-schemas.md). ModManager's match page («Eventos» > a match) edits
# every mod's records of these tables with them, in place. `For` names the table a root shape is the form of.
# The keys are the team type's (team_engine: decl.rs, challenge.rs); a save is read back by its strict parser first.
# Read only by ModManager: the game does not read content\editor\.
schema = "VRFW.editor/1"

# ---------------------------------------------------------------------------------------------- [[VRFW.RouteNode]]
[[Shape]]
Id = "route_node"
For = "VRFW.RouteNode"
  [[Shape.Field]]
  Key = "Team"
  Type = "ref"
  Ref = "team"
  Required = true
  Label = { es = "Rival", en = "Rival" }
  Help = { es = "El equipo rival (clave, id o <mod>.<nombre>).", en = "The rival team (key, id or <mod>.<name>)." }
  [[Shape.Field]]
  Key = "Difficulties"
  Type = "list"
  Of = "int"
  Label = { es = "Dificultades", en = "Difficulties" }
  Help = { es = "Las filas del menú del nodo (1 Crónica, 4 Heroica…). Vacío = [1, 4].", en = "The node's command rows (1 Crónica, 4 Heroica…). Empty = [1, 4]." }
  [[Shape.Field]]
  Key = "Title"
  Type = "text"
  Label = { es = "Título del partido", en = "Match title" }
  [[Shape.Field]]
  Key = "TemplateGame"
  Type = "ref"
  Ref = "match"
  Label = { es = "Partido plantilla", en = "Template match" }
  Help = { es = "El partido que se clona (filas, premios, IA, estadio). Por defecto: el de la pieza de al lado.", en = "The match cloned (rows, prizes, AI, stadium). Default: the piece beside it." }
  [[Shape.Field]]
  Key = "MatchFrom"
  Type = "ref"
  Ref = "match"
  Label = { es = "Reglas del partido de", en = "Match setup from" }
  Help = { es = "Comentarista, reglas especiales, objetivos y guiones de este partido.", en = "Caster, special rules, objectives and scripts of this match." }
  [[Shape.Field]]
  Key = "DropsFrom"
  Type = "ref"
  Ref = "match"
  Label = { es = "Botín de", en = "Drops from" }
  [[Shape.Field]]
  Key = "Map"
  Type = "ref"
  Ref = "stadium"
  Label = { es = "Estadio", en = "Stadium" }
  [[Shape.Field]]
  Key = "GameType"
  Type = "int"
  Min = 1
  Max = 4
  Label = { es = "Tipo de partido", en = "Match type" }
  Help = { es = "1 = 11 contra 11, 2 = 5 contra 5, 3 / 4 = otros formatos pequeños.", en = "1 = 11-a-side, 2 = 5-a-side, 3 / 4 = other small formats." }
  [[Shape.Field]]
  Key = "Challenge"
  Type = "string"
  Label = { es = "Desafío", en = "Challenge" }
  Help = { es = "El [[VRFW.MatchChallenge]] que debe cumplir tu equipo (su Name).", en = "The [[VRFW.MatchChallenge]] your team must meet (its Name)." }
  [[Shape.Field]]
  Key = "Mandatory"
  Type = "bool"
  Default = true
  Label = { es = "Obligatorio (aplica Gates)", en = "Mandatory (applies Gates)" }
  [[Shape.Field]]
  Key = "Cronica"
  Type = "table"
  Of = "node_cronica"
  Label = { es = "Crónica (dificultad 1)", en = "Crónica (difficulty 1)" }
  [[Shape.Field]]
  Key = "Heroica"
  Type = "table"
  Of = "node_heroica"
  Label = { es = "Heroica (dificultad 4)", en = "Heroica (difficulty 4)" }
  [[Shape.Field]]
  Key = "FirstClear"
  Type = "table"
  Of = "first_clear"
  Label = { es = "Premio de primera victoria", en = "First-clear prize" }
  [[Shape.Field]]
  Key = "LockedTitle"
  Type = "text"
  Label = { es = "Texto mientras está cerrado", en = "Text while locked" }

[[Shape]]
Id = "node_cronica"
  [[Shape.Field]]
  Key = "Level"
  Type = "int"
  Min = 1
  Max = 999
  Label = { es = "Nivel del rival", en = "Rival level" }
  [[Shape.Field]]
  Key = "OwnTeam"
  Type = "ref"
  Ref = "team"
  Label = { es = "Tu alineación fija", en = "Your fixed line-up" }
  [[Shape.Field]]
  Key = "OwnLevel"
  Type = "int"
  Min = 1
  Max = 999
  Label = { es = "Su nivel", en = "Its level" }
  [[Shape.Field]]
  Key = "Talk"
  Type = "string"
  Label = { es = "Diálogo antes", en = "Talk before" }
  [[Shape.Field]]
  Key = "TalkAfter"
  Type = "string"
  Label = { es = "Diálogo tras ganar", en = "Talk after a win" }
  [[Shape.Field]]
  Key = "Quest"
  Type = "string"
  Label = { es = "Objetivos (lista game_quest)", en = "Objectives (game_quest list)" }

[[Shape]]
Id = "node_heroica"
  [[Shape.Field]]
  Key = "Level"
  Type = "int"
  Min = 1
  Max = 999
  Label = { es = "Nivel del rival", en = "Rival level" }
  [[Shape.Field]]
  Key = "Quest"
  Type = "string"
  Label = { es = "Objetivos (lista game_quest)", en = "Objectives (game_quest list)" }

[[Shape]]
Id = "first_clear"
  [[Shape.Field]]
  Key = "1"
  Type = "string"
  Label = { es = "Crónica", en = "Crónica" }
  [[Shape.Field]]
  Key = "4"
  Type = "string"
  Label = { es = "Heroica", en = "Heroica" }

# ---------------------------------------------------------------------------------------------- [[VRFW.MatchChallenge]]
[[Shape]]
Id = "challenge"
For = "VRFW.MatchChallenge"
  [[Shape.Field]]
