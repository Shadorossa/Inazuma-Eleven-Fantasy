schema = "VRFW.game/2"

# Shop redirect. Runtime: scripts/shop_redirects.lua reads each mod's content/shop_redirects/*.toml; menu side
# assets/lua/menu/_all/70_shop_redirect.lua (the shop id a menu hands to shop_menu, swapped).

# () -> n, from 1, to 1, … from n, to n: a shop id (number) or a mod's shop key (text) each.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_REDIRECTS"
handler = "ShopRedirects.List"

# () -> n, from 1, set 1, … from n, set n: a shop id (number) or a mod's shop key (text), and the crc32 of a contact
# set key (<mod>.<name>) whose screen (vrfw_contact_map_menu) opens instead of that shop.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_SCREENS"
handler = "ShopRedirects.Screens"
