schema = "VRFW.game/2"

# No Victory Road season: no season runs, ends or is recorded. The tournament team dock icon, the «0/5» seasonal
# player cap plate, the dock's «tournament team» button and the season-end conversion with its «La temporada ha
# finalizado» notice never show (docs/framework/no-season.md).
#
# The calendar answers 0 («no calendar», the game's own state before the clock is known) for the Victory Road season
# and its two seasonal windows. Every caller handles 0: the «== 1» checks find no running season, the season-end
# check neither updates the running byte nor converts. Campaign windows (kinds 3-8) keep the game's answer.
#   v7.1.2: u8 SeasonState(u8 kind, u8 end) 0x1789CF0, kind 0 = the season (asked as (0, 0)), 1 / 2 = its windows;
#   v7.2.1: u8 SeasonState(u8 kind) 0x179BFF0 (kinds 1 / 2; the season itself moved to MainSeasonState below).
[[VRFW.Hook]]
name = "SeasonEndState"
game = "Chronicle.SeasonState"
kind = "function"

[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "mask(args[1], 0xFF)", in = [0, 1, 2] },
  { value = "ret", not = 0 },
]
value = "0"

# v7.2.1: u8 MainSeasonState(?, ?, i32 season) 0x179BF20, the Victory Road season (v7.1.2: SeasonState(0, 0) above).
[[VRFW.Hook]]
name = "NoMainSeason"
game = "Chronicle.MainSeasonState"
kind = "function"

[[VRFW.Hook.answer]]
phase = "post"
when = { value = "ret", not = 0 }
value = "0"

# The «season running» byte of the save (+0xC8C of the save block) is what the menus ask through the Lua command
# 0x801E7801. A save made while a season ran keeps it at 1 (the calendar answer 0 above never clears it), so the
# command's byte read becomes «false»: the dock's tournament icon, the seasonal cap plate and the tournament team
# button stay hidden. The saved byte itself is not written.
[[VRFW.Patch]]
name = "SeasonRunningFlagOff"
edit = "Chronicle.SeasonRunningFlagRead.False"

# v7.2.1: SeasonEndCheck::Update 0x145C8B0 reaches its conversion block (seasonal flags cleared, the seasonal spirit
# stock converted, the notice opened) either through SeasonState(season) = 2 or, on the first season, without asking
# it. The block's entry becomes a jump past it, so neither path runs (v7.1.2 has no such site: the hook above covers it).
[[VRFW.Patch]]
name = "SeasonEndConvertSkip"
edit = "Chronicle.SeasonEndConvert.Skip"

# The season record check (v7.1.2 0x143F4F0, v7.2.1 0x145CD50, run with the season-end check): it collects the seasons
# whose flag changed, records them in the save and sets the notice flag. Its collect call answers «nothing collected»
# (xor eax, eax), so no season is recorded and the notice is never asked for.
[[VRFW.Patch]]
name = "SeasonRecordSkip"
edit = "Chronicle.SeasonRecordCollect.Skip"
