schema = "VRFW.game/2"

# Face icon rules (schema VRFW.game/2). Nothing is installed unless a mod declares a face_icon rule (`apply = "script"`).
# Hook on BuildFaceIconComposite: a type-9 icon (face + kit bust) of a declared rarity or key is drawn as type 10 (face only).
[[VRFW.Hook]]
name = "FaceIcons.Composite"
game = "Image.BuildFaceIconComposite"
apply = "script"

# Handle whose record rarity is declared
[[VRFW.Hook.answer]]
phase = "pre"
table = "VRFW.FaceIcon.Rarity"
key = ["[record([args[2] + 0x28]:u32) + 0x10]:u32"]
when = { value = "[args[2] + 0x5B]:u8", equals = 9 }
write = "[args[2] + 0x5B]:u8"

# Declared character key (icons requested without a handle)
[[VRFW.Hook.answer]]
phase = "pre"
table = "VRFW.FaceIcon.Key"
key = ["[args[2] + 0x30]:u32"]
when = { value = "[args[2] + 0x5B]:u8", equals = 9 }
write = "[args[2] + 0x5B]:u8"

# ------------------------------------------------------------------------------------------------ commands

# (hdl[, key]) -> mode (0 = game icon, 10 = face only): how a card handle's icon (or, with hdl 0, a character key's) is drawn.
[[VRFW.Command]]
name = "CMND_VRFW_FACE_ICON"
handler = "FaceIcons.Cmd"
needs = ["FaceIcons.GetCharaRarity"]

# u32 GetCharaRarity(u32 charaHdl): rarity of a character handle (0 for an unknown handle).
[[VRFW.Function]]
name = "FaceIcons.GetCharaRarity"
game = "Card.GetCharaRarity"
args = ["u32"]
ret = "u32"
