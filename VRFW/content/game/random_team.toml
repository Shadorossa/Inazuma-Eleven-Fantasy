schema = "VRFW.game/2"

# Random team (schema VRFW.random_team/1, content\random_teams\*.toml; run time scripts\random_team.lua).
# Draws a roster from a seed and writes it, before a match, over the member rows of a slot team (an ordinary team with placeholder players), with that team's level, formation, name, emblem and kit.

# FindTeamConfig(&record, &container, teamHash): team_config record of a team (no side effect)
[[VRFW.Function]]
name = "RandomTeamFind"
game = "Team.FindConfig"

# team_config record: +0x28 / +0x2C member slice; script-written fields: +4 default level, +0x14 name text, +0x18 formation, +0x1C kit (uniform id), +0x20 emblem (item id).
[[VRFW.Struct]]
name = "RandomTeamRecord"
game = "TeamRecord"
fields = { Level = { at = 0x4, type = "u16" }, NameText = { at = 0x14, type = "u32" }, Formation = { at = 0x18, type = "u32" }, Uniform = { at = 0x1C, type = "u32" }, Emblem = { at = 0x20, type = "u32" } }

# team_config container: record array +0x48 (stride 0x50), count +0x50.
[[VRFW.Struct]]
name = "RandomTeamConfig"
game = "TeamConfig"
fields = { Records = { at = 0x48, type = "ptr" }, RecordCount = { at = 0x50, type = "i32" } }

# member row (stride 0x54); script-written fields: +0x28 loadout (TEAM_MEMBER_SKILL_CONFIG id; 0 = the card's own learn list), +0x44 level offset (i16), +0x46 AI step (i8, capped at 4).
[[VRFW.Struct]]
name = "RandomTeamMember"
game = "MemberRow"
fields = { Skill = { at = 0x28, type = "u32" }, LevelOffset = { at = 0x44, type = "i16" }, Step = { at = 0x46, type = "i8" } }

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_BUILD"     # (rule, seed, node, stage, slot) -> ok, team, level, members, why
handler = "RandomTeam.Build"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_PREVIEW"   # (rule, seed, node, stage, slot) -> as BUILD, nothing written
handler = "RandomTeam.Preview"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_MEMBER"    # (i) -> card id, roster slot, card position (member i, 1-based, of the last build / preview)
handler = "RandomTeam.Member"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_LOOK"      # () -> name text, emblem, kit, formation, theme element (last build / preview)
handler = "RandomTeam.Look"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_LOOK_OF"   # (rule, seed, node, stage) -> name text, emblem, kit, name text key: what a build will show
handler = "RandomTeam.LookOf"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_INFO"      # (rule) -> ok, version, slot teams, stage rows
handler = "RandomTeam.Info"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_RESTORE"   # (team or 0 = every slot team written) -> ok, rows: placeholders back
handler = "RandomTeam.Restore"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# Team lineup (scripts\team_lineup.lua, docs/framework/team-lineup.md): (team id, card…) -> true, rows moved | false, why:
# those cards take the team's roster slots 0.. for its next matches (in memory, never saved)
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LINEUP"
handler = "TeamLineup.Set"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# (team id) -> the team's kit (uniform id of its record; 0 = none): the pose row screen dresses a row's players in it
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_KIT"
handler = "TeamLineup.Kit"
needs = ["RandomTeamFind", "RandomTeamRecord"]

# (team id, row level, level) -> true, rows: the team plays at that level for its next matches (members' offsets over
# the match row's rival level; in memory, never saved)
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LEVEL"
handler = "TeamLineup.Level"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# (team id, slot, card, slot, card…) -> true, rows written | false, why: the member row in each roster slot plays that
# card for the team's next matches (its own learn list; in memory, never saved); a career mode's squads
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_ROSTER"
handler = "TeamLineup.Roster"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# (team id, 0 = every team) -> true, rows: the data's cards back in the rows CMND_VRFW_TEAM_ROSTER wrote
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_ROSTER_RESTORE"
handler = "TeamLineup.RosterRestore"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# (slot team id, source team id, card...) -> true, players | false, why: the slot team (declared with player rows of its
# own) plays as the source team in its next matches (its look, the cards in roster slots 0.., the member slice cut to
# them and the staff rows; in memory, never saved): a squad larger than the source team's own rows
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN"
handler = "TeamLineup.StandIn"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember", "RandomTeamConfig"]

# (slot team id, 0 = every one) -> true, teams: the slot team's rows, slice and record back
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN_RESTORE"
handler = "TeamLineup.StandInRestore"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# (team id, roster slot) -> true, move1..move6, level1..level6 of that member row's loadout as the match plays it (auras
# included; 0 = empty) | false, why: the player page previewing a team member shows the member's own set
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MEMBER_MOVES"
handler = "TeamLineup.MemberMoves"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]

# Match member (scripts\team_lineup.lua): (chara handle) -> true, team id, roster slot of the member row a match player
# plays from | false, why. The match's teams: the request's +0xA4 (the player's team) and +0xA8 (the rival), written
# by the hook below into the script's block (state vr_framework.team_lineup.match_teams); a player the user owns has
# none. Character Reforged's player page reads it in a match (the team member's set: his aura / mix).
[[VRFW.State]]
key = "vr_framework.team_lineup.match_teams"

# u64 StartMatchRequest(scene, request): the generic «start this match» of every mode (as level_sync.toml).
[[VRFW.Hook]]
name = "TeamLineup.MatchRequest"
kind = "function"
pattern = "48 89 5C 24 18 48 89 74 24 20 55 57 41 56 48 8D 6C 24 90 48 81 EC 70 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 60 8B 42 6C"
rva = 0x17C9400
steal = 14
args = ["ptr", "ptr"]
ret = "u64"

[[VRFW.Hook.answer]]
phase = "pre"
value = "[args[2] + 0xA4]:u32"
write = "[state(vr_framework.team_lineup.match_teams)]:u32"

[[VRFW.Hook.answer]]
phase = "pre"
value = "[args[2] + 0xA8]:u32"
write = "[state(vr_framework.team_lineup.match_teams) + 4]:u32"

[[VRFW.Command]]
name = "CMND_VRFW_MATCH_MEMBER"
handler = "TeamLineup.MatchMember"
needs = ["RandomTeamFind", "RandomTeamRecord", "RandomTeamMember"]
