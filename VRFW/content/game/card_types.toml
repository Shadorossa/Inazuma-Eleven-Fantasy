schema = "VRFW.game/2"

# VR-Framework › card-type registry (service S2 of VRFW 2.3, docs/framework/card-types.md). The run time is
# scripts\card_types.lua: it reads every mod's content\card_types\*.toml (`VRFW.card_type/1`, keys:
# content\types\card_type.toml) and, only when a mod declares card types, writes the sites below. **Nothing here is
# written at start** (`apply = "script"` / script patches): with no declaration the game's code stays as it is.
#
# The «Rareza» tab of the two filter windows («FILTRAR» of the player lists, CMenuListViewCharaFilter, and of the fichas
# list, CMenuListViewSoccerSpiritFilter) is not data: each window builds its items with a loop, twice (the tab builder
# and the full rebuild = 4 lists), then pairs them two per row under «Todos»:
#   +0          mov r9d, <zero reg> + alignment nop    <- Move + First: mov r9d, first (the first rarity listed)
#   +head       xor r8d, r8d; mov edx, r9d; mov rcx, rbx
#   +head+9     call AddTempItem(this, value, option 0, sortKey r9d)   <- Extra: through a stub, the loop's end value
#                                                                         becomes the extra card type's rarity
#   +head+14    inc r9d; cmp r9d, <end>                <- End: one more item while an extra card type is listed
#   +head+21    jb loop
# Item values stay rarity values, so the menu Lua (texture t6[value + 1]), the filter params, the engine filter and the
# filter state in the save (one bit per rarity) keep their meaning; the extra entry is sorted last (its sort key stays
# the loop's end value). Site names and bytes: the game profile (game\<build>\sites.toml / edits.toml, `Card.Rarity*`).

# ------------------------------------------------------------------------------------------------ functions

# u32 GetCharaRarity(u32 charaHdl): the rarity of a character handle (record +0x10; 0 for an unknown handle)
[[VRFW.Function]]
name = "CardTypes.GetCharaRarity"
game = "Card.GetCharaRarity"
args = ["u32"]
ret = "u32"

# ------------------------------------------------------------------------------------------------ the «Rareza» tab

# ---- CMenuListViewCharaFilter, builder of the «Rareza» tab
[[VRFW.Patch]]
name = "CardTypes.CharaTab.Move"
edit = "Card.RarityCharaTab.MoveRewrite"
apply = "script"

# the first rarity listed (u32 immediate of the `mov r9d, imm32`): a script patch, the script gives the value
[[VRFW.Patch]]
name = "CardTypes.CharaTab.First"
game = "Card.RarityCharaTab.First"
needs = ["CardTypes.CharaTab.Move"]

[[VRFW.Patch]]
name = "CardTypes.CharaTab.Skip"
edit = "Card.RarityCharaTab.SkipRewrite"
apply = "script"
needs = ["CardTypes.CharaTab.Move"]

# the loop's call: cmp edx, <end>; jne +5; mov edx, <extra rarity>; jmp AddTempItem (its ret goes back to the loop).
# Both immediates come from the script (the game's loop end, the extra card type's rarity); declared: 9 / 9 = the
# game's own items.
[[VRFW.Patch]]
name = "CardTypes.CharaTab.Extra"
game = "Card.RarityCharaTab.Prime"
kind = "stub"
apply = "script"
entry = "call"
code = "83 FA ?? 75 05 BA ?? ?? ?? ?? E9 ?? ?? ?? ??"
imm = [{ at = 2, width = "u8", value = 9 }, { at = 6, width = "u32", value = 9 }]
refs = [{ at = 11, branch = 21 }]

# the loop end: one more item with an extra card type (the script writes the game's end + 1)
[[VRFW.Patch]]
name = "CardTypes.CharaTab.End"
game = "Card.RarityCharaTab.End"
needs = ["CardTypes.CharaTab.Extra"]

# ---- CMenuListViewCharaFilter, the same loop in the full rebuild switch (case rarity)
[[VRFW.Patch]]
name = "CardTypes.CharaRebuild.Move"
edit = "Card.RarityCharaRebuild.MoveRewrite"
apply = "script"

[[VRFW.Patch]]
name = "CardTypes.CharaRebuild.First"
game = "Card.RarityCharaRebuild.First"
needs = ["CardTypes.CharaRebuild.Move"]

[[VRFW.Patch]]
name = "CardTypes.CharaRebuild.Skip"
edit = "Card.RarityCharaRebuild.SkipRewrite"
apply = "script"
needs = ["CardTypes.CharaRebuild.Move"]

[[VRFW.Patch]]
name = "CardTypes.CharaRebuild.Extra"
game = "Card.RarityCharaRebuild.Prime"
kind = "stub"
apply = "script"
entry = "call"
code = "83 FA ?? 75 05 BA ?? ?? ?? ?? E9 ?? ?? ?? ??"
imm = [{ at = 2, width = "u8", value = 9 }, { at = 6, width = "u32", value = 9 }]
refs = [{ at = 11, branch = 17 }]

[[VRFW.Patch]]
name = "CardTypes.CharaRebuild.End"
game = "Card.RarityCharaRebuild.End"
needs = ["CardTypes.CharaRebuild.Extra"]

# ---- CMenuListViewSoccerSpiritFilter, builder of the «Rareza» tab
[[VRFW.Patch]]
name = "CardTypes.SpiritTab.Move"
edit = "Card.RaritySpiritTab.MoveRewrite"
apply = "script"

[[VRFW.Patch]]
name = "CardTypes.SpiritTab.First"
game = "Card.RaritySpiritTab.First"
needs = ["CardTypes.SpiritTab.Move"]

[[VRFW.Patch]]
name = "CardTypes.SpiritTab.Skip"
edit = "Card.RaritySpiritTab.SkipRewrite"
apply = "script"
needs = ["CardTypes.SpiritTab.Move"]

[[VRFW.Patch]]
name = "CardTypes.SpiritTab.Extra"
game = "Card.RaritySpiritTab.Prime"
kind = "stub"
apply = "script"
entry = "call"
code = "83 FA ?? 75 05 BA ?? ?? ?? ?? E9 ?? ?? ?? ??"
imm = [{ at = 2, width = "u8", value = 9 }, { at = 6, width = "u32", value = 9 }]
refs = [{ at = 11, branch = 23 }]

[[VRFW.Patch]]
name = "CardTypes.SpiritTab.End"
game = "Card.RaritySpiritTab.End"
needs = ["CardTypes.SpiritTab.Extra"]

# ---- CMenuListViewSoccerSpiritFilter, the loop in its full rebuild switch
[[VRFW.Patch]]
name = "CardTypes.SpiritRebuild.Move"
edit = "Card.RaritySpiritRebuild.MoveRewrite"
apply = "script"

[[VRFW.Patch]]
name = "CardTypes.SpiritRebuild.First"
game = "Card.RaritySpiritRebuild.First"
needs = ["CardTypes.SpiritRebuild.Move"]

[[VRFW.Patch]]
name = "CardTypes.SpiritRebuild.Skip"
edit = "Card.RaritySpiritRebuild.SkipRewrite"
apply = "script"
needs = ["CardTypes.SpiritRebuild.Move"]

[[VRFW.Patch]]
name = "CardTypes.SpiritRebuild.Extra"
game = "Card.RaritySpiritRebuild.Prime"
kind = "stub"
apply = "script"
entry = "call"
code = "83 FA ?? 75 05 BA ?? ?? ?? ?? E9 ?? ?? ?? ??"
imm = [{ at = 2, width = "u8", value = 9 }, { at = 6, width = "u32", value = 9 }]
refs = [{ at = 11, branch = 20 }]

[[VRFW.Patch]]
name = "CardTypes.SpiritRebuild.End"
