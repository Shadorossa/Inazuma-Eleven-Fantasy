schema = "VRFW.game/2"

# Paged tabs for the free-match list; installs the SetTab detour only when a mod declares a paged tab (`apply = "script"`).
# While page k of a paged tab is shown, the list builds the page's tab index; the answer table is keyed by the title-return count.

# bool SetTab(this, u8 tab): the list's own function
[[VRFW.Function]]
name = "FreeMatch.ListSetTab"
game = "Menu.VsCpuListSetTab"
args = ["ptr", "u8"]
ret = "bool"

[[VRFW.Hook]]
name = "FreeMatch.SetTab"
game = "Menu.VsCpuSetTab"
expect_fn = "FreeMatch.ListSetTab"
apply = "script"
needs = ["FreeMatch.ListSetTab"]

# tab index built for the bar's tab on the current page
[[VRFW.Hook.answer]]
phase = "pre"
table = "VRFW.FreeMatch.Page"
key = ["state(vrfw.game_resets)", "args[2]"]
write = "args[2]"

# ------------------------------------------------------------------------------------------------ commands

# (tab, delta) -> page (1-based), pages, live; delta 0 = query, +-1 = turn (wraps); a tab without pages answers 1, 1, live.
[[VRFW.Command]]
name = "CMND_VRFW_FM_PAGE"
handler = "FreeMatchPages.Cmd"
