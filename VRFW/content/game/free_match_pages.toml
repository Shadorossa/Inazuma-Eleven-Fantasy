schema = "VRFW.game/2"

# Paged tabs for the free-match list and the slots of the section bar's later pages; installs the SetTab detour only when
# a mod declares a paged tab or a later section page is shown (`apply = "script"`). The list builds the tab index the
# shown bar slot stands for; the answer table is keyed by the title-return count.

# bool SetTab(this, u8 tab): the list's own function
[[VRFW.Function]]
name = "FreeMatch.ListSetTab"
game = "Menu.VsCpuListSetTab"
args = ["ptr", "u8"]
ret = "bool"

[[VRFW.Hook]]
name = "FreeMatch.SetTab"
game = "Menu.VsCpuSetTab"
expect_fn = "FreeMatch.ListSetTab"
apply = "script"
needs = ["FreeMatch.ListSetTab"]

# tab index built for the bar slot (its section on the shown page, then that tab's own page)
[[VRFW.Hook.answer]]
phase = "pre"
table = "VRFW.FreeMatch.Page"
key = ["state(vrfw.game_resets)", "args[2]"]
write = "args[2]"

# ------------------------------------------------------------------------------------------------ commands

# (tab, delta) -> page (1-based), pages, live; delta 0 = query, +-1 = turn (wraps); a tab without pages answers 1, 1, live.
[[VRFW.Command]]
name = "CMND_VRFW_FM_PAGE"
handler = "FreeMatchPages.Cmd"

# (index of slot 0, index of slot 1, ...) -> live: the tab index each section bar slot lists on the shown page; no
# argument = page 1 (every slot lists its own index).
[[VRFW.Command]]
name = "CMND_VRFW_FM_SECTION_SLOTS"
handler = "FreeMatchPages.Sections"
