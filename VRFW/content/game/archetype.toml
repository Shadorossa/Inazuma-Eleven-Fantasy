schema = "VRFW.game/2"

# Team-build archetypes declared by mods (content\archetypes\*.toml, schema VRFW.archetype/1; run time scripts\archetype.lua).
# Hooks the engine's team-build pick so a declared archetype can win (the six retail counts are zeroed, the engine answers 6), and applies archetype passive effects.

# ------------------------------------------------------------------------------------------------ functions
# Passive readers used to evaluate a match player's passives.

# GetTeamPassiveId(out, charaHdl, slot, useCopy)
[[VRFW.Function]]
name = "ArchPassiveId"
game = "Passive.TeamPassiveId"
args = ["ptr", "u32", "u8", "u8"]
ret = "ptr"

# IsTeamPassiveUnlocked(charaHdl, slot, useCopy)
[[VRFW.Function]]
name = "ArchPassiveUnlocked"
game = "Passive.TeamPassiveUnlocked"
args = ["u32", "u8", "u8"]
ret = "u8"

# ResolvePassiveRarity(out, id, rarity)
[[VRFW.Function]]
name = "ArchPassiveRarity"
game = "Passive.RarityVersion"
args = ["ptr", "ptr", "u32"]
ret = "ptr"

# ActorUnit(actor): unit of a match actor
[[VRFW.Function]]
name = "ArchActorUnit"
game = "Match.ActorUnit"
args = ["ptr"]
ret = "ptr"

# ------------------------------------------------------------------------------------------------ globals

# match actor array (0 outside matches)
[[VRFW.Global]]
name = "arch_actors"
game = "Match.SoccerActors.ViaSkillUsed"

# ------------------------------------------------------------------------------------------------ team build pick

# Mid hook before the passive list is built: captures the team selector.
[[VRFW.Hook]]
name = "ArchBuildSelector"
game = "Passive.TeamBuildTypeSelector"
kind = "mid"
wait_ms = 250

# Mid hook after the counts: adds declared archetypes' points and zeroes the six retail counts when one wins.
[[VRFW.Hook]]
name = "ArchBuildCounts"
game = "Passive.TeamBuildTypeCounts"
kind = "mid"
relocs = [{ at = 3, next = 7 }]
wait_ms = 250

# ------------------------------------------------------------------------------------------------ match bonuses
# Battle bonus getters (fractions, 0.1 = +10 %); the post answer adds the actor's archetype effects from script-filled tables.

# ShotAtBonus(hdl): shot AT bonus
[[VRFW.Hook]]
name = "ArchShotAt"
game = "Passive.ShotAtBonus"
kind = "function"
relocs = [{ at = 3, next = 7 }]
args = ["u32"]
ret = "f32"

[[VRFW.Hook.answer]]
value = "ret + lookup(Archetype.ShotAt, args[1])"

# FocusAtBonus(hdl): focus AT bonus
[[VRFW.Hook]]
name = "ArchFocusAt"
game = "Passive.DuelAtBonus"
kind = "function"
relocs = [{ at = 3, next = 7 }]
args = ["u32"]
ret = "f32"

[[VRFW.Hook.answer]]
value = "ret + lookup(Archetype.Focus, args[1])"

# FocusDfBonus(hdl): focus DF bonus
[[VRFW.Hook]]
name = "ArchFocusDf"
game = "Passive.DuelDfBonus"
kind = "function"
# relocs cover the call and the rip-relative load so the entry fits the 5-byte jump
relocs = [{ at = 8, next = 12 }, { at = 15, next = 19 }]
args = ["u32"]
ret = "f32"

[[VRFW.Hook.answer]]
value = "ret + lookup(Archetype.Focus, args[1])"

# ------------------------------------------------------------------------------------------------ exec conditions
# Exec conditions: 910 p = owner's team build is p (0-6 game, 7+ declared); 911 p = owner's team build rank >= p (declared archetypes only, game builds answer 0). False outside a match.

[[VRFW.Hook]]
name = "ArchIsTeamBuild"
kind = "callback"
args = ["ptr"]
ret = "u8"
fallback = 0

[[VRFW.Hook.answer]]
phase = "pre"
when = [{ value = "[[args[1]] + 4]:u8", in = [1, 3] }, { value = "[[args[1]]]:u32", not = 0xC4DC849A }]
value = "if(lookup(Archetype.Team, [actor([args[1] + 8]:u32) + 0xD0]:u8) == if([[args[1]] + 4]:u8 == 3, [[args[1]]]:f32, [[args[1]]]:i32), 1, 0)"

[[VRFW.Hook]]
name = "ArchRankAtLeast"
kind = "callback"
args = ["ptr"]
ret = "u8"
fallback = 0

[[VRFW.Hook.answer]]
phase = "pre"
when = [{ value = "[[args[1]] + 4]:u8", in = [1, 3] }, { value = "[[args[1]]]:u32", not = 0xC4DC849A }]
value = "if(lookup(Archetype.Rank, [actor([args[1] + 8]:u32) + 0xD0]:u8) >= if([[args[1]] + 4]:u8 == 3, [[args[1]]]:f32, [[args[1]]]:i32), 1, 0)"

# ResolveExecCondition(id): shared resolver, called per condition row at table load. Order: unmigrated mods' own detours, then mods' exported Passive.ExecCondition tables
# (last loaded first), then 910 / 911 above, then the game's table (unknown id = false).
[[VRFW.Hook]]
name = "ArchResolveExecCondition"
game = "Passive.ResolveExecCondition"
kind = "function"
args = ["u32"]
ret = "ptr"
needs = ["ArchIsTeamBuild", "ArchRankAtLeast"]

# 1. mods' exported checkers
[[VRFW.Hook.answer]]
phase = "pre"
table = "*/Passive.ExecCondition"
key = ["args[1]"]

# 2. VRFW's own
[[VRFW.Hook.answer]]
phase = "pre"
when = { value = "args[1]", equals = 910 }
value = "int(callback(ArchIsTeamBuild))"

[[VRFW.Hook.answer]]
phase = "pre"
when = { value = "args[1]", equals = 911 }
value = "int(callback(ArchRankAtLeast))"

# ------------------------------------------------------------------------------------------------ passive slots (S6)
# Passive slot readers and the rarity version: one detour each; answers come from tables mods export (`*/<table>`: every mod listing it in [exports] tables, last loaded first). No export = the game's answer.
#   Passive.SlotChoice   (save slot, saved owner of the handle, slot 0-4) -> passive id: a saved player's configured slot
#   Passive.OwnSlot      (chara_param id, slot) -> passive id: a character's own passive (chara_param cols 61-65)
#   Passive.OwnKept      (rarity, slot) present = that slot keeps the game's passive (no own passive there)
#   Passive.SlotUnlock   (save slot, saved owner, slot) -> 0 / 1: a configured slot's unlock state
#   Passive.AllOpen      (save slot) -> 1: every non-empty slot of a saved, configurable player works
#   Passive.OwnOpen      (chara_param id, slot) -> 1: a slot holding an own passive works
#   Passive.RarityTier   (asked rarity) -> the rarity whose version is read (Prime: 10 -> 4)
#   Passive.RarityTwin   (passive id) -> the address of the id to read instead (Prime's doubled twins), only for an
#                        asked rarity listed in Passive.RarityTier
# Record layout used below: +4 chara_param id, +0x10 rarity, +0xEC + slot * 12 passive slots, +0x1BC coach / manager badge (0 = player).

# GetTeamPassiveId: the engine's single reader of a player's passive slots.
[[VRFW.Hook]]
name = "VRFW.PassiveSlotId"
game = "Passive.TeamPassiveId"
kind = "function"
args = ["ptr", "u32", "u8", "u8"]
ret = "ptr"

[[VRFW.Hook.answer]]
table = "*/Passive.SlotChoice"
key = ["slot", "owner(args[2])", "args[3]"]
write = "[args[1]]:u32"

[[VRFW.Hook.answer]]
table = "*/Passive.OwnSlot"
key = ["[record(args[2]) + 4]:u32", "args[3]"]
when = [
  { value = "[record(args[2]) + 0x1BC]:u32", equals = 0 },
  { value = ["[record(args[2]) + 0x10]:u32", "args[3]"], not_in_table = "*/Passive.OwnKept" },
]
write = "[args[1]]:u32"

# IsTeamPassiveUnlocked: unlock state of a passive slot.
[[VRFW.Hook]]
name = "VRFW.PassiveSlotUnlocked"
game = "Passive.TeamPassiveUnlocked"
kind = "function"
args = ["u32", "u8", "u8"]
ret = "bool"

[[VRFW.Hook.answer]]
table = "*/Passive.SlotUnlock"
key = ["slot", "owner(args[1])", "args[2]"]

[[VRFW.Hook.answer]]
table = "*/Passive.AllOpen"
key = ["slot"]
when = [
  { value = "owner(args[1])", not = 0 },
  { value = "[record(owner(args[1])) + 0x1BC]:u32", equals = 0 },
  { value = "[record(args[1]) + 0xEC + args[2] * 12]:u32", not = 0 },
]

[[VRFW.Hook.answer]]
table = "*/Passive.OwnOpen"
key = ["[record(args[1]) + 4]:u32", "args[2]"]
when = [
  { value = "[record(args[1]) + 0x1BC]:u32", equals = 0 },
  { value = ["[record(args[1]) + 0x10]:u32", "args[2]"], not_in_table = "*/Passive.OwnKept" },
]

# Slots off and the signature slot: a save slot where a mode keeps only each player's signature passive (its tables
# keyed by the active save slot). These detours run before the other subscribers of the entry (order 100), so their
# post answers are written last and win; a save slot no mod lists keeps every other answer.
#   Passive.SlotsOff       (save slot) -> 0: the 5 passive slots of every player read empty and locked there
#   Passive.SignatureSlot  (save slot, chara_param id) -> passive id: the player's signature passive (board slot 9)
#   Passive.SignatureOpen  (save slot, chara_param id) -> 1: his custom passive piece counts as open
#   Passive.SignatureOnly  (save slot) -> 0: a player with no signature passive there has an empty, closed slot 9
[[VRFW.Hook]]
name = "VRFW.PassiveSlotsOffId"
game = "Passive.TeamPassiveId"
kind = "function"
order = 100
args = ["ptr", "u32", "u8", "u8"]
ret = "ptr"

[[VRFW.Hook.answer]]
table = "*/Passive.SlotsOff"
key = ["slot"]
write = "[args[1]]:u32"

[[VRFW.Hook]]
name = "VRFW.PassiveSlotsOffUnlocked"
game = "Passive.TeamPassiveUnlocked"
kind = "function"
order = 100
args = ["u32", "u8", "u8"]
ret = "bool"

[[VRFW.Hook.answer]]
table = "*/Passive.SlotsOff"
key = ["slot"]

# The custom passive slot reader (board equip slot 9).
[[VRFW.Hook]]
name = "VRFW.SignatureSlotId"
game = "Passive.SignatureSlotId"
kind = "function"
order = 100
args = ["ptr", "u32"]
ret = "ptr"

[[VRFW.Hook.answer]]
table = "*/Passive.SignatureSlot"
key = ["slot", "[record(args[2]) + 4]:u32"]
write = "[args[1]]:u32"

[[VRFW.Hook.answer]]
table = "*/Passive.SignatureOnly"
key = ["slot"]
when = { value = "args[2]", not = 0 }
write = "[args[1]]:u32"

# The custom passive piece's open state.
[[VRFW.Hook]]
name = "VRFW.SignaturePieceOpen"
game = "Passive.SignaturePieceOpen"
kind = "function"
order = 100
args = ["ptr"]
ret = "u8"

[[VRFW.Hook.answer]]
table = "*/Passive.SignatureOpen"
key = ["slot", "[record([args[1]]:u32) + 4]:u32"]

[[VRFW.Hook.answer]]
table = "*/Passive.SignatureOnly"
key = ["slot"]

# ResolvePassiveRarity: rarity version of a passive; the twin answer runs first (it tests the asked rarity), then the tier.
[[VRFW.Hook]]
name = "VRFW.PassiveRarity"
game = "Passive.RarityVersion"
kind = "function"
args = ["ptr", "ptr", "u32"]
ret = "ptr"

[[VRFW.Hook.answer]]
phase = "pre"
table = "*/Passive.RarityTwin"
key = ["[args[2]]:u32"]
when = { value = "args[3]", in_table = "*/Passive.RarityTier" }
write = "args[2]"

[[VRFW.Hook.answer]]
phase = "pre"
table = "*/Passive.RarityTier"
key = ["args[3]"]
write = "args[3]"

# Archetype data for the menus and the match HUD (Lua patches under assets\lua\archetype\include\).

[[VRFW.Command]]
name = "CMND_VRFW_ARCHETYPE_TEAM"  # (dock, party; no arguments = last menu pick) -> build (0-6 the game's, 7+ declared), points; -1 = not picked yet
handler = "Archetype.CmdTeam"

[[VRFW.Command]]
name = "CMND_VRFW_ARCHETYPE_MATCH"  # (side 0 / 1) -> build, rank, charge, max charge (match side)
handler = "Archetype.CmdMatch"

[[VRFW.Command]]
name = "CMND_VRFW_ARCHETYPE_INFO"   # (build) -> ok, name text id, description text id, icon, large icon, gauge icon
handler = "Archetype.CmdInfo"

# ------------------------------------------------------------------------------------------------ state keys
# A match side's build (0-6 the game's, 7+ declared; nil outside a match) and a declared archetype's rank (0-5).

[[VRFW.State]]
key = "vr_framework.archetype.team0"

[[VRFW.State]]
key = "vr_framework.archetype.team1"

[[VRFW.State]]
key = "vr_framework.archetype.rank0"

[[VRFW.State]]
key = "vr_framework.archetype.rank1"
