schema = "VRFW.game/2"

# Makes a field-map battle (e.g. a 5v5 played on a field map) return to the menus or the title instead of the field.

# Match-end check of the loaded field map; while armed it takes the menu return path once and disarms.
[[VRFW.Hook]]
name = "FieldReturnSite"
game = "Menu.TrialReturn"

# Game reset function (queues the end of the RPG scene and the title).
[[VRFW.Function]]
name = "FieldReturnReset"
game = "Game.Reset"

# Player data block (holds the "save loaded" guard).
[[VRFW.Global]]
name = "field_return_play_data"
base = "game_root"
chain = ["ROOT_PLAY_DATA"]

# RPG root (holds the no-press-start flag).
[[VRFW.Global]]
name = "field_return_rpg"
game = "Route.Rpg"

# CMND_VRFW_BATTLE_RETURN(op) -> live, armed, taken. op: 1 arm + title (memory kept), 3 arm + title (save reloaded), 2 arm menu route only, 0 disarm, -1 query.
[[VRFW.Command]]
name = "CMND_VRFW_BATTLE_RETURN"
aliases = ["CMND_EVT_TRIAL_RETURN"]
handler = "FieldReturn.Command"
