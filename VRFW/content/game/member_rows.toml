schema = "VRFW.game/2"

# Makes team-member readers treat the 16-bit member row as unsigned (movsx -> movzx, sign branch -> nop/jmp), so teams whose members start past row 32767 keep their players.
# `expect` = the game's bytes, `bytes` = same-length replacement. A site not found or with differing bytes keeps the game's code; the log lists each applied patch.

# Team member field handler: row of member i.
[[VRFW.Patch]]
name = "MemberRows.MenuMemberField"
edit = "Squad.MemberRow.LuaMemberFieldUnsigned"

# Team info captain search over the member slice.
[[VRFW.Patch]]
name = "MemberRows.MenuTeamCaptain"
edit = "Squad.MemberRow.LuaTeamCaptainUnsigned"

# Team member handler: row of member i.
[[VRFW.Patch]]
name = "MemberRows.MenuMemberC30410"
edit = "Squad.MemberRow.LuaTeamMemberUnsigned"

# Member level, by row.
[[VRFW.Patch]]
name = "MemberRows.MemberLevel"
edit = "Squad.MemberRow.MemberLevelUnsigned"

# Member rarity / step, by row.
[[VRFW.Patch]]
name = "MemberRows.MemberRarity"
edit = "Squad.MemberRow.MemberRarityUnsigned"

