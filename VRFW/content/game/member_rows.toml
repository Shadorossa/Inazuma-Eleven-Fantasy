schema = "VRFW.game/2"

# The framework > member rows past 32767 in every team reader (docs/framework/bb-pages.md §9).
# The game keeps a team's first member row (team_config SOCCER_TEAM_INFO_REF_MEMBER, runtime record +0x28) as a 32-bit
# number, but every reader of the member table (container +0x68: rows of 0x54 bytes, +0x70: the row count) goes
# through the engine's 16-bit row handle: `test r16, r16; js none; movsx; cmp [+0x70]; jge none; movsx; imul 0x54`.
# The row is read SIGNED, so a team whose members start past row 32767 has no players for that reader (menus: empty
# pitch, «Nv. 0»; matches built through these readers: an empty roster). Each patch below makes one reader read the
# row UNSIGNED: `movsx` -> `movzx` (same length) and the sign branch after a 16-bit test -> a nop of the same length (a
# `jns row` -> `jmp row`). The row count check (`jge none`) stays, so the readers reach 65 535 rows; 0xFFFF (the
# handle's «none») stays out of reach while the table has fewer rows (the team build warns past 65 535).
# The sites: every `imul …, 0x54` of the v7.1.2 code (D:\re export) whose base is the member table, plus the sign
# tests of those rows in the same functions. `expect` = the game's bytes, `bytes` = the same length; the patterns are
# unique in the clean .text. A site whose signature is not found or whose bytes differ keeps the game's code (logged
# off, the rest still apply); the team build's front ordering of the menus' teams (scripts/build/team/lists.lua
# X.front_preview_members) stays as the fallback. The log lists each written patch:
# `vr_framework: patch MemberRows.<site> at RVA 0x… : <old> -> <new>`.
# Not patched: the metamorphose member list (+0x30 slice, container +0x88: 0xE1F1B0, 0x15BEA20), a few rows.

# Lua 0x020C3A31 handler (team member i, field n): the row of member i (0xC2E610): js after `test cx, cx` -> nop; movsx eax, cx -> movzx; movsx rax, cx -> movzx
[[VRFW.Patch]]
name = "MemberRows.MenuMemberField"
edit = "Squad.MemberRow.LuaMemberFieldUnsigned"

