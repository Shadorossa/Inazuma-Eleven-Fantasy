[route_map]
# Main Chronicle board: 6 x 6 painted tiles of 2048 px. Map px = (cx + a * x, cy - b * y) from the grid position (least-squares fit).
# Road width, pad radii, dash and gap (in road widths) and the default side band, in full-resolution px.
map_a = 194.1
map_b = 112.0
map_cx = 6141.0
map_cy = 6139.5
tile = 2048
tiles = 6
road_width = 22.0
pad_rx = 55.0
pad_ry = 30.0
dash = 1.5
gap = 1.0
side_default = 5.5

[route_nodes]
# [[VRFW.RouteNode]]: save status flag size, sanity limit of roads per map tile (extra roads are dropped with a warning), and the box (px) a node's `Icon` is fitted into.
slot_limit = 300
# Extended slots: a node's `Slot` may also be slot_limit .. ext_slot_limit - 1, kept by the framework save service; its piece row uses `proxy_slot` (one free retail byte no node may take).
ext_slot_limit = 1000
proxy_slot = 299
max_nodes_per_tile = 255                  # sanity limit only
crest_box = 104
crest_top = 12
# opponentListTab given to a chain node's piece, a tab the Chronicle chain team list does not have.
chain_list_tab = 9
# The first piece index a node may take: the engine reads the board's first pieces by index (0 the start, 1 the piece a first Chronicle visit opens on).
first_node_index = 2
