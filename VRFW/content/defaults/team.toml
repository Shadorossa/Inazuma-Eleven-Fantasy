[route_map]
# The main Chronicle board (routeMapType 0, docs/game/modes/chronicle-side-branches.md): 6 x 6 painted tiles
# `route_mapRC.g4tx` of 2048 px. Grid position (piecePos) -> map px = (cx + a * x, cy - b * y): a least-squares fit on
# the pads of IE1 / IE2 / IE3 / GO pieces (residual ~10 px; a node's pad is then snapped on the art). Road and pad sizes
# of the retail art (full-resolution px, measured at Inazuma Kids FC's pad): road width, pad radii; a dotted road's dash
# and gap in road widths (Nacho 2026-10-06: dash 1.5x, gap 1x); the side band under the roads / pads when it cannot be
# measured. Read by the team build's road drawing and the Mods panel's route map (team_engine::build::route::RouteMap).
map_a = 194.1
map_b = 112.0
map_cx = 6141.0
map_cy = 6139.5
tile = 2048
tiles = 6
road_width = 22.0
pad_rx = 55.0
pad_ry = 30.0
dash = 1.5
gap = 1.0
side_default = 5.5

[route_nodes]
# [[VRFW.RouteNode]]: the size of the board's save status flags (`m_globalChronicle*StatusFlag`, 300 bytes: a node's
# slot is below it and above every slot the game's own pieces use), a sanity limit of the roads crossing one map tile
# (a road is one overlay sprite drawn at run time, nothing is copied per tile; the roads past it on a tile are left out
# with a WARN, the others are drawn), and the box a node's own `Icon` PNG is fitted into on its 128 x 128 board sprite (the
# retail crests: ~104 px, centred, standing at y 116 = top 12).
slot_limit = 300
# Extended slots (docs/framework/route-board.md §5, 2026-10-11): a node's `Slot` may also be slot_limit ..
# ext_slot_limit - 1. Its clear / lock state is kept by the framework (save service owner vr_framework, key
# `route_slot.<n>`, graft route_nodes' VRFW_RouteSlots) instead of the 300-byte arrays; its piece row's statusFlagIndex
# is proxy_slot, one free retail byte that no node may take (the game's own code only ever reads that byte for them).
ext_slot_limit = 1000
proxy_slot = 299
max_nodes_per_tile = 255                  # sanity limit only (2026-10-12: roads are run-time overlays, linear cost; was 3 / 6 with the tile copies)
crest_box = 104
crest_top = 12
# A chain node's piece (`Chain` / a chain hub: its own game is never played) gets this opponentListTab, a tab the
# «Cadena de Crónica» team list does not have (it has 0-8; docs/game/modes/chronicle-mode.md §12), so the list does not
# show it as a copy of its `Beside` team (2026-10-12: «Cadena del Abuelo» listed as a second Desesperdidos).
chain_list_tab = 9
