# Defaults of the team engine; every mod's defaults/team.toml is merged in load order (a later mod overrides a key).

[free_match]
# Game cloned by a `free_match` appearance that names no `template_game`.
template_game = "fbtl_free_001"

[chain]
# Game cloned by every node game of a [[VRFW.Chain]] that names no `template_game`.
template_game = "fbtl_free_001"

[bb_pages]
# Categories (tabs) of the Battle Bay team grid. A row goes to the category named by its team's `category`, else to the first category whose `rule` it meets.
# Rules: `game` (the game's own BB rows), `chain` (a [[VRFW.Chain]] node team, its BB copy, a based_on team), `mod` (any other mod row).
# `Text` = menu_text row id; `Icon` = "<atlas>:<sprite>"; a mod adds or changes categories with [[VRFW.Category]] (same `Id`).
# `Sort` keys, in order: `season`, `source_order`, `name`.
# `dedupe`: leave out a mod-added row whose team an earlier category already lists (same shown name and season, or at least half the same starters).
dedupe = true
# Lock rows whose team has a Chronicle equivalent until the player wins that match; a mod opts out with [VRFW.BbUnlock] Enabled / Unlocks = false.
chronicle_unlock = true

[[bb_pages.category]]
Id = "main"
Text = "vrfw_bb_cat_main"
Icon = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx:vrfw_bb_cat_main"
Order = 10
Rule = "game"
Sort = ["season", "source_order"]

[[bb_pages.category]]
# Takes the match-chain teams; `chain` is accepted as an alias of the id.
Id = "secondary"
Aliases = ["chain"]
Text = "vrfw_bb_cat_secondary"
Icon = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx:vrfw_bb_cat_secondary"
Order = 20
Rule = "chain"
# Alphabetical inside each season.
Sort = ["season", "name"]

[[bb_pages.category]]
Id = "mods"
Text = "vrfw_bb_cat_mods"
Icon = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx:vrfw_bb_cat_mods"
Order = 30
Rule = "mod"
Sort = ["season", "source_order"]

[bb_pages.seasons]
# Season carousel of the grid (filters the rows by season); `{type}` = two-digit series type from chara_series_config.
# A row's season is its declared `season`, else the highest series with at least 2 starters in its roster. A mod adds series with [[VRFW.Season]].
from_game = true
id = "series_{type}"
text = "vrfw_bb_season_{type}"
icon = "#/menu/200_icon/16_icon_list_tab/icon_list_tab.g4tx:icon_list_tab_series{type}"
all_text = "vrfw_bb_season_all"
# Icon of the carousel's first entry (all seasons).
all_icon = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx:vrfw_bb_season_all"

# --- game-data values read by the team build (scripts/build/team.lua) ---

[team]
# A team without `based_on` is shaped like the first team_config team with this many member rows.
template_rows = 18

[bb_copy]
# Battle Bay copy of a team (`<key>_bb`): member rows up to slot `last_slot` with these cells; metamorphose slice empty.
last_slot = 19
flag = 0
level_offset = 0
rarity_step = 4
c14_19 = -1
rates = 1

[bb_row]
# A new Battle Bay row copies the table's first row with these cells.
c2 = 0
condition = 0
unlock_text = 0
c10 = 0
c11 = -1

[bgm]
# Team match music: the three phase lists, the state slot that plays the track (0 = game_start) and the slots kept from the base set.
phases = ["m_FirstHalfBgmList", "m_AfterSecondHalfLeadBgmList", "m_AfterSecondHalfNotLeadBgmList"]
start_slot = 0
kept_slots = [18, 20]

[free_match_tabs]
# [[VRFW.FreeMatchTab]]: first extra tab index, extra tabs the retail bar already holds, and the maximum tabs a layout may serve.
first_tab = 9
retail_extra = 1
max_tabs = 12
# opponentListTab of the hidden piece of a [[VRFW.GameTab]] / [[VRFW.FreeMatchGame]] game: a tab the Chronicle team list does not have (it has 0-8), so the game is listed in the free match only.
hidden_piece_list_tab = 9

[bb_unlock]
# Battle Bay unlock: Chronicle difficulty ids, starters two teams must share to be the same team / squad, and maximum comparisons per unlock condition.
chronicle_diffs = [1, 2, 3, 4, 10, 11]
min_shared = 6
same_squad = 9
max_terms = 42
# true = a row whose team is a story-mode rival unlocks by beating it in the story (rows from soccer_opponent_info category 0); false = follow the Chronicle rule.
story_unlock = true

# Per category (a [[bb_pages.category]] Id): `difficulties` = required Chronicle difficulties (absent = any), `chains = false` = chain tiles never unlock its rows,
# `own_team = true` = a team that is the player's own side in the Chronicle unlocks with that route's decisive match, `hint` = [bb_unlock.hint] template.
[bb_unlock.category.main]
chains = false
own_team = true

