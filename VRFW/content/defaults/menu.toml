# Framework menu defaults; a mod's defaults/menu.toml overrides keys (load order).

# Minimum rows of the scene archive list (retail 128, maximum 32767); the effective cap is the largest of this, every mod's `[scene_archive] max_rows` and the served config.
[scene_archive]
max_rows = 512

# Layer instances per open menu: the engine supports about 844, past it the menu never opens.
# The build logs a WARN past `warn` and an ERROR past `hard`; it never refuses the build.
[layer_instances]
warn = 800
hard = 844
doc = "docs/game/ui/menu-layer-limits.md §2.3"
