# Defaults for the shot aura drawn on the ball of defence cut-ins; a mod may override keys in its own defaults\cutin_aura.toml.
# Seconds after a shot was last dressed during which it counts as the incoming shot of a cut-in.
max_age = 30.0
# Seconds after which an aura played in a cut-in is removed even without a detach or cut-in end.
max_life = 20.0

# Rule id or id prefix -> aura scale on the cut-in ball (a rule's own `cutin_scale` wins; longest key wins).
[rules]

# Base values for every event entry.
[ball]
# Actor name prefix of the cut-in ball.
actor = "b000001"
# Joint the aura follows.
joint = "c_c_1_0"
# Multiplier of the rule's `cutin_scale` for this event family.
scale = 1.0
# Offset (m, joint space) and rotation (degrees, x y z) on the joint.
offset = [0.0, 0.0, 0.0]
rotation = [0.0, 0.0, 0.0]
# Effect clip for the loop slot (empty = the effect's default).
clip = ""
# Hide the retail colour glow of the ball while the aura plays.
hide_glow = true
# Require the match ball to still be in the shot state when the cut-in attaches.
in_shot = false
# The incoming shot is spent after this cut-in.
ends_shot = false

# Event name prefix -> overrides (longest matching prefix wins; no match leaves the cut-in alone).
[events."ev63_"]
# Keeper techniques.
ends_shot = true

[events."ev71_31"]
# Keeper-gauge scenes of basic catches.
ends_shot = true

[events."ev62_"]
# Block / defence techniques, only while the match ball is still a shot.
in_shot = true

[events."ev63_00120_"]
# Full Power Shield (whk00120).
