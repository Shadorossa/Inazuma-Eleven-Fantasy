# Defaults for duel / field clips (retail clip and row names only); a mod may override keys in its own defaults\duel_clip.toml.

# Retail clip identifying the `chara_motion` bank that receives the built clips.
bank_clip = "戦1フォーカス突破前1入"

# Per playback: retail candidate row (action name or hash, and its clip) whose attribute rows new actions copy.

# One-shot clip (duel clips, field clips without `loop`).
[playback.oneshot]
action = 0x2BA3EFF8
clip = "戦1突破1"

# `loop = "move"`.
[playback.move]
action = "WALK"
clip = "戦1疲れ走り1L"

# `loop = "stand"`.
[playback.stand]
action = "STAND"
clip = "戦1立ち1L"
