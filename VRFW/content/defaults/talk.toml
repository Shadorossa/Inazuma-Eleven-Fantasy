# Talk scene aliases of the team engine ([[VRFW.Talk]], crates/plugins/team_engine/src/talk.rs; vr_framework::defaults,
# `defaults/talk.toml` of every mod, merged in load order: a mod may add aliases or override one).
# A cast member's `motion` / `idle` / `expression` may also be a retail name or a 0x… id; these are the short names.

# Motions: alias = { name = <retail motion name (its crc32 is the id)>, pack = <pose pack suffix the retail talks load
# for it: p020 battle, p250 «B» event stands, p200 «T» event, p060 NPC; empty = always there> }.
[motion]
stand = { name = "立ち1L", pack = "" }
stand_event = { name = "イベント立ち3L", pack = "" }
talk = { name = "NPC立ち男性会話1L", pack = "p250" }
battle_stance = { name = "Bイベ戦闘立ち1L", pack = "p250" }
battle_stance2 = { name = "Bイベ戦闘立ち2L", pack = "p250" }
arms_crossed = { name = "Bイベ腕組み立ち会話控えめ1L", pack = "p250" }
hands_on_hips = { name = "Bイベ腰手当て立ち1L", pack = "p250" }
think = { name = "Bイベ考え中1L", pack = "p250" }
vs_pose = { name = "BイベVS画面ポーズ1L", pack = "p250" }
vs_pose3 = { name = "BイベVS画面ポーズ3L", pack = "p250" }
run = { name = "ダッシュ1L", pack = "p250" }
point = { name = "Tイベ空指差し1L", pack = "p200" }
angry_stance = { name = "Tイベ雲明怒り立ち1L", pack = "p200" }
dash = { name = "戦1ダッシュ1L", pack = "p020" }
block = { name = "戦1ブロック1L", pack = "p020" }
knocked_down = { name = "戦1うつ伏せダウン1L", pack = "p020" }
stun = { name = "戦1スタン3L", pack = "p020" }
fall_back = { name = "NPC腰ぬかし1L", pack = "p060" }
recoil = { name = "NPCのけぞり驚き1L", pack = "p060" }
# military / formal (retail clips of the c000101 body; c000401 has parade_rest(_talk) but no salute / chest_out)
salute = { name = "Bイベ敬礼1L", pack = "p250" }
arms_crossed_still = { name = "Bイベ腕組み立ち1L", pack = "p250" }
parade_rest = { name = "NPC後ろ手組立ち1L", pack = "p060" }
parade_rest_talk = { name = "NPC後ろ手組立ち会話1L", pack = "p060" }
chest_out = { name = "NPC胸張り立ち1L", pack = "p060" }
# hand to the ear: listening on a phone / radio (no prop is attached)
phone_ear = { name = "NPC電話立ち1L", pack = "p060" }
on_call = { name = "Tイベ通話立ち1L", pack = "p200" }

# Expressions: alias = <retail face name> (chr column 25: its crc32).
[face]
normal = "普通1L"
normal2 = "普通2L"
serious = "真剣1L"
serious2 = "真剣2L"
serious3 = "真剣3L"
serious4 = "真剣4L"
surprised = "驚き1L"
shocked = "驚き4L"
angry = "怒1L"
sad = "哀1L"
pain = "苦痛1L"
smile = "笑顔口"
eyes_closed = "目閉1L"
