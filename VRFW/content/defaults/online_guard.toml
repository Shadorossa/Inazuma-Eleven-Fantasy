# Online guard: modes below are hidden from the title row and refused everywhere (schema VRFW.online_guard).
# Every active mod's content\defaults\online_guard.toml is read; lists are a union (a mod can add a blocked mode, never remove one).
# Keys of one [[VRFW.BlockedMode]]:
#   key                name for logs (files sharing a key have their lists joined)
#   label              what the mode is (logs)
#   title_items        title-row request ids of the mode; its button is removed and the request refused
#   menus              menu objects (names or crc32) that ARE the mode; open/reserve commands for them are refused. List only the entry screen
#   title_silence      title_menu_2 global functions that only serve the mode; they do not run
#   title_hide_layers  title_menu_2 layers that only serve the mode; kept hidden
#   title_functions    title_menu_2 OnFunction ids that only serve the mode; swallowed
#   when               "always" (default) or "gameplay_mods": blocked only while a mod with [VRFW.Mod] AffectsMatch (default true) is enabled and no private room session is up. For such a mode, list only `menus` (title_items is refused with this value).

[[VRFW.BlockedMode]]
key = "victory_road"
label = "Victory Road (online ranked tournaments)"
title_items = [127937052]
menus = ["victory_road_top_menu"]
title_silence = [
    "OpenVroadNoticeWindow",                   # update notice at the title
    "OpenTournamentDeliveryUpdate",            # tournament reward / fix notices
    "OpenRematchConfirmGeneralWin_Coroutine",  # resume-interrupted-match prompt
    "SetupVroadTournamentInfoBalloon",         # tournament balloon
]
title_hide_layers = [
    "title00_15_vroad_tournament_info_balloon",
    "vroad01_72_vroad_tournament_notice_button_guide",
]
title_functions = [0x05EB102D]                 # tournament notice

# --- with gameplay mods enabled, retail online rooms are blocked; only private rooms remain

[[VRFW.BlockedMode]]
key = "competition_online"
label = "Competition online rooms and rank match (EOS)"
when = "gameplay_mods"
menus = ["network_top_menu", "network_room_match_top", "network_rank_match_setting_menu"]
title_silence = ["CheckInviteReceive"]         # retail invites open an EOS room

[[VRFW.BlockedMode]]
key = "battle_bay_online"
label = "Battle Bay online rooms (EOS)"
when = "gameplay_mods"
menus = ["network_menu"]

[[VRFW.BlockedMode]]
key = "kizuna_online"
label = "Kizuna Station online sessions (EOS)"
when = "gameplay_mods"
menus = ["kizuna_town_network_menu", "kizuna_town_online_menu"]
