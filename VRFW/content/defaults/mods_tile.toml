# Description of the «Mods» title tile: sprite recipes for the image type and sprite names (by `kind`) for the mods_menu plugin.

# glyph drawn over the background
glyph = "puzzle"
# retail atlas the sprites are added to, and the new texture holding them
atlas = "#/menu/50_title/title00/title00_07/title00_07.g4tx"
texture = "vrfw_mods_tile"
# px between two sprites in the texture
gap = 4

# background scene: generated by `generator`, variant `variant`, written to `png` (392 x 160)
[background]
generator = "research/scripts/mods_tile_bg.py"
variant = "circuito"
png = "research/mods/VRFW/images/menu/50_title/title00/title00_07/title00_07/vrfw_mods_scene.png"

# sprites in texture order: image = base_off | base_on | icon; kind = index requested by the title (1 focused base, 2 unfocused base, 3 icon)
[[sprite]]
name = "vrfw_mods_btn_base_off"
image = "base_off"
kind = 2

[[sprite]]
name = "vrfw_mods_btn_base_on"
image = "base_on"
kind = 1

[[sprite]]
name = "vrfw_mods_icon_btn"
image = "icon"
kind = 3
