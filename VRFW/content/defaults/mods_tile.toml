# The «Mods» title tile of the mods_menu part (docs/framework/mods-panel.md §2): ONE description read by
#   * research/mods/VRFW/images/menu/50_title/title00/title00_07/title00_07.toml: the image type's recipes that
#     make the sprites at the player's first start (our own background scene + the retail tile shape as a mask from
#     his game files), the glyph as our own PNG; research/scripts/mods_tile_sketches.py is the reference (previews);
#   * the mods_menu plugin: CMND_VRFW_MM_STATE 9th value = the sprite names by `kind`, which 200_mods_button.lua
#     hashes and hands to the title (GetTextureNameItemButton).
# No retail pixel is copied or shipped: the background is our own art (research/scripts/mods_tile_bg.py).

# glyph drawn over the background (mods_tile_sketches.GLYPHS)
glyph = "puzzle"
# the retail atlas the sprites are added to, and the new texture holding them
atlas = "#/menu/50_title/title00/title00_07/title00_07.g4tx"
texture = "vrfw_mods_tile"
# px between two sprites of the texture (x = cumulative widths; the texture is as wide as its sprites)
gap = 4

# the scene under the tile: our own art, a variant of research/scripts/mods_tile_bg.py (bloques / puzzle / circuito;
# Nacho picked «circuito» 2026-10-08). To switch: mods_tile_bg.py --export <variant> rewrites `png` (392 x 160).
[background]
generator = "research/scripts/mods_tile_bg.py"
variant = "circuito"
png = "research/mods/VRFW/images/menu/50_title/title00/title00_07/title00_07/vrfw_mods_scene.png"

# the sprites, in texture order. image = base_off (unfocused) / base_on (focused) / icon (the glyph); kind = the index
# the title asks GetTextureNameItemButton for (1 = focused base, 2 = unfocused base, 3 = icon)
[[sprite]]
name = "vrfw_mods_btn_base_off"
image = "base_off"
kind = 2

[[sprite]]
name = "vrfw_mods_btn_base_on"
image = "base_on"
kind = 1

[[sprite]]
name = "vrfw_mods_icon_btn"
image = "icon"
kind = 3
