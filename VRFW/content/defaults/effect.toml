# Defaults for the effect build script; a mod may override keys with its own defaults\effect.toml (tables merge key by key).

[shot_aura]
# Trigger name of the plain shot.
shoot_trigger = "shoot"
# Ball trigger row copied by a pooled effect without one (a rule's `like` wins).
default_like = "ega0075e"
# Prefix of added ball triggers: <prefix><effect game name>; changing it changes every added trigger id.
trigger_prefix = "vrfw_shot_aura."

# Trigger lists of the character-effect controllers (eff_chr_trigger; the ball's list holds one row per own aura).
# Every row of a built list keeps its effect pack loaded for the whole match, so the ball's list only keeps the retail
# rows and the auras of every move the match's players can use (both teams, every keshin / armour / Mix-Max / totem /
# mode change form, the extra-slot plates).
[trigger_lists]
# Most rows one list (a character's or the ball's) keeps when a controller is built. The game reads a list's rows with
# a one-byte counter (255 rows at most); the framework's patch Effect.TriggerRows (content/game/trigger_rows.toml)
# widens it. A list with more rows than this (or than 255 when the patch is not applied) is cut right before the build.
# 201 rows (92 retail ball rows and 109 aura packs) load in a match; 418 rows stop the match load at its start event.
max_rows = 201
# Part of each engine resource registry (effects, objects, packs, textures, meshes, skeletons, particles; capacities read
# from the game at run time) that new ball auras leave free for what the match loads after the ball's list (0 to 1).
pool_reserve = 0.05

# `when.form` words mapped to the form they name (`none` = no active form).
[shot_aura.form_words]
keshin = "keshin"
armour = "armour"
armor = "armour"
armed = "armour"
miximax = "miximax"
aura = "aura"
none = "none"

# Defaults for a [[shot_aura]] `fit`: the aura replay (`replay` frames, 60 fps) is stretched to the remaining flight time.
# mode `rate` = whole replay at one speed; `sustain` = intro and end at their own speed, middle stretched; speed is clamped to [min_rate, max_rate].
# Default `sustain` window: min(intro, replay / 3) to replay - max(outro_min, replay * outro).
[shot_aura.fit]
mode = "sustain"
min_rate = 0.15
max_rate = 2.0
lead = 0.0
intro = 12
outro = 0.25
outro_min = 6

# Event files edited by [[event_effect]] / [[attach]] / [[event_timing]] / [[event_command]] (`%s` = lower-case event name).
[event_lists]
eff = "data/common/event_cfg/eff/%s_eff.cfg.bin"
evt = "data/common/event_cfg/evt/%s.cfg.bin"

# Defaults for a pooled [[event_effect]]: actor motions and locator when `attach.motions` / `attach.locator` are omitted.
[event_effect]
motions = ["in", "loop", "out"]
locator = "NONE"
# Effect object attach point when `attach.point` is omitted.
point = "point_eff"
