schema = "vr_framework.sound/1"
# Silent lip cues of the Estadio BB campaign pre-match talk (docs/framework/bb-prematch.md, «Mouth»). The game moves a
# speaker's mouth only while the line's voice cue plays, and the only bank it loads for these talks is the chapter's
# `ev40` (Japanese; also with English voices). A captain with no retail voice line of its own speaks one of these
# silent cues (the one of the line's length, `[bb_talk] lip` of content/defaults/bb_talk.toml), and its mouth follows
# the cue's viseme track (assets/data/common/sound/<ja|en>/<cue>.p3lip, the [[VRFW.Talk]] lip pattern). One cue per
# length of `[bb_talk] lip.seconds`; the sound files are silence (4 kHz, the engine converts them to the bank format).

[[voice]]
bank = "ev40"
lang = "ja"
cue = "ev40_vrfw_lip_10"
file = "assets/sounds/bb_talk_lip/silence_10.wav"
normalize = "none"

