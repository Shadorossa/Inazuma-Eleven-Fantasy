# VR-Framework: the save slot screen's card atlas (#/menu/220_img/evt_slot/evt_slot_base.g4tx, a NEW atlas;
# docs/framework/save-slots.md «Card art»). Its pixels are made at every first start (and after a game update) from
# the PLAYER'S own game files by the image type's recipes (image_engine::recipe): the release ships this recipe and
# the framework's own drawings (evt_slot_base\*.png: disc, plus, generic emblem), never Level-5 pixels.
# Same art as the 2.0 pack-time generator research/scripts/slot_card_art.py (build_sprites / atlas_layout): v4.2
# bodies 424x624 from the retail save_info_base01 / 02 (save01_04), padlock from mainmenu90_30, row plates from
# save_mode_base01 + retail glyphs. A recipe that cannot be made is an ERROR in the log; its card stays blank.
schema = "vr_framework.image/1"

[[texture]]
atlas = "#/menu/220_img/evt_slot/evt_slot_base.g4tx"
name = "evt_slot_base"
size = [1708, 1252]

