# VR-Framework: the chain board screen's art (#/menu/220_img/vrfw_chain/vrfw_chain.g4tx, a NEW atlas;
# docs/framework/chain-board.md). The framework's own drawings (vrfw_chain\*.png, research/scripts/chain_board_art.py:
# page panel, title tab, cursor brackets, tiles locked / open / done / start / «?», start flag, chests (closed, open,
# padlocked; the IE3 «S» chest too), lock, check, «?», S / A / B badges (the same drawing as the route board's ranks),
# link bar, page arrows; the IE3 chain screen's look, redrawn). No Level-5 pixel. The screen
# (menus\chain_board.toml, script vrfw_chain_board_menu) binds the sprites by crc32 of their names. Generated: rerun the
# script, do not edit by hand.
