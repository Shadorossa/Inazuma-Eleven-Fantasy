# VR-Framework: the art of the Bahía Batalla grid's category tabs (#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx, a
# NEW atlas; docs/framework/bb-pages.md). Made at every first start (and after a game update) from the PLAYER'S own
# game files by the image type's recipes: the tab plates and the line's backgrounds from the retail BB
# hexagon tile (vs01_42 enjoy_list_base01: its slate-blue gradient, rounded corners, translucent; the current tab lit
# with the hexagon cursor's cyan outline, vs01_43 enjoy_list_base01_ol), the «main
# teams» glyph = the title's Estadio BB icon (title00_07 icon_btn09); the «secondary» and «mods» glyphs are the framework's
# own drawings (vrfw_bb_pages\glyph_secondary.png: two shields, glyph_mods.png = the «Mods» title tile's puzzle;
# glyph_all.png = four tiles, the season carousel's «every season»). No Level-5 pixel
# ships. Sprite names: the runtime's (vrfw_bb_cat_plate_on / _off) and the categories' `icon` (defaults\team.toml).
schema = "vr_framework.image/1"

[[texture]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
name = "vrfw_bb_pages"
size = [536, 160]

[[sprite]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
name = "vrfw_bb_cat_plate_off"
texture = "vrfw_bb_pages"
x = 0
y = 0
size = [64, 56]
recipe = "plate_off"

[[sprite]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
name = "vrfw_bb_cat_plate_on"
texture = "vrfw_bb_pages"
x = 68
y = 0
size = [64, 56]
recipe = "plate_on"

[[sprite]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
name = "vrfw_bb_cat_main"
texture = "vrfw_bb_pages"
x = 136
y = 0
size = [96, 96]
recipe = "glyph_main"

[[sprite]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
name = "vrfw_bb_cat_secondary"
texture = "vrfw_bb_pages"
x = 236
y = 0
size = [96, 96]
recipe = "glyph_secondary"

[[sprite]]
atlas = "#/menu/107_vs/vrfw_bb_pages/vrfw_bb_pages.g4tx"
