# VR-Framework: the extra-time pictures of the rule engine's matches (owner request and approval 2026-10-19;
# docs/game/modes/prorroga-penaltis.md §8.10). The game has one period-end telop («FIN DE LA 1.ª PARTE», gtxt_timetelop07
# of soccer05_02) and the half labels «1.ª» / «2.ª» (gtxt_half01 / 02 of soccer00_01). Added here, every language
# («ja» = the atlases' default file):
#   gtxt_timetelop_vrfw_reg_end   end of the regular time before extra time / penalties   (PNG, «FIN DE LA 2.ª PARTE»)
#   gtxt_timetelop_vrfw_et1_end   end of the first extra-time half                       (PNG, «… DE LA PRÓRROGA»)
#   gtxt_timetelop_vrfw_full_end  end of the extra time before the shoot-out: the game's own «FIN DEL PARTIDO»
#                                 (soccer05_05 gtxt_timetelop_l01) made at build from the player's files by a recipe,
#                                 fitted in the 512 x 64 telop frame (no Level-5 pixel ships)
#   gtxt_half_vrfw_et1 / _et2     the scoreboard label of extra-time halves 3 / 4          (PNG, «1.ª Pró.» / «2.ª Pró.»)
# The PNGs are white masks like the retail ones, generated by research/scripts/extra_time_telops_build.py (texts there).
# New sprites without `texture`: packed into a new texture of each atlas. Read by assets\lua\menu\timetelop_menu\
# 300_extra_time_telop.lua and assets\lua\menu\_all\78_extra_time_half.lua.
schema = "VRFW.image/1"

[[sprite]]
atlas = "#/menu/00_soccer/soccer05/soccer05_02/<LG>/soccer05_02.g4tx"
name = "gtxt_timetelop_vrfw_reg_end"
