schema = "VRFW.catalog/1"
# Framework-owned hosts: where mods' menu entries and modes appear. Other hosts are declared by the mod that owns the screen.

[menu]
# Hosts for [[entry]] / [[hide]]; scene_archive_tab adds a tab to the scene archive.
hosts = ["title_menu_2.upper", "title_menu_2.lower", "options", "top_bar", "scene_archive_tab"]
# Hosts that accept [entry.title] and the action `mode`; the first is the mode row.
title_hosts = ["title_menu_2.upper"]

[mode]
# Hosts for [[mode.entry]]: upper title row, lower title row, slot-screen card.
hosts = ["title_row", "title_lower", "slot_screen"]
# Host for modes with their own save slot.
slot_screen = "slot_screen"
