schema = "VRFW.catalog/1"
# Defaults for a [[friendly]] declaration and its before/after steps, applied for keys they leave out.

[friendly]
# Team the player uses: "active_friendly" | "current" (the mode's own VS team).
team = "active_friendly"
# No challenge, no pass condition.
challenge = "none"
pass = "none"
# "sink": the friendly never writes to the player's save.
save = "sink"
# Where the friendly returns to.
return = "title"
# With return = "title": a story field after the match falls back to the title.
field_net = true

[op]
# Per-step defaults, keyed by `op`.
fade_black = { secs = 0.3, frames = 60 }
key = { value = 1 }
wait_gone = { frames = 900 }
wait_settled = { frames = 120 }
top_wait = { secs = 1.5 }
watchdog = { frames = 900 }
