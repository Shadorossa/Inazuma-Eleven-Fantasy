schema = "VRFW.catalog/1"
# The 1.x Lua alias table (M4, docs/framework/catalogs.md; norm §7.2, docs/framework/naming.md): every old command
# name `<old><VERB>` still answers as `<new><VERB>`, with a deprecation WARN once per name. Built into the framework
# (vr_core::lua::alias_table): the installed copy must stay the same data (else it is reported and not read).
#
# [verb_sets]: verb lists shared by several families (`verbs_of = "<name>"`).
# [[family]]: old / new prefix, route, verbs (`""` = the prefix itself is the whole name). route: "same" (the new
# command takes the same arguments), "prepend_type" (the new one is a generic command whose first argument is
# `type`), "report_filter" (a report command filtered by `type`: `<new>(..., mod, "<type>")`).
# [[owner]]: the node (type) that owns an old name, by prefix, first match wins (else "core"): while that node is a
# legacy part the part registers the old name itself and the core does not install the alias.

[verb_sets]
# the verbs of the `friendly` type's commands
friendly = ["ABORT", "ACK", "AUX", "BACK", "MAP", "PASSED", "PASSED_SET", "REPORT", "RULES", "START", "STATE", "STEP", "TITLE_NET", "CALLER", "MENU_BACK"]

# anim / celebration
[[family]]
old = "CMND_EVT_ANIM_CELEBR_VISIBLE"
new = "CMND_VRFW_CELEBRATION_VISIBLE"
route = "same"
verbs = [""]

[[family]]
old = "CMND_EVT_ANIM_CREATED_"
new = "CMND_VRFW_REG_"
route = "prepend_type"
type = "anim"
verbs = ["COUNT", "GET"]

[[family]]
old = "CMND_EVT_ANIM_"
new = "CMND_VRFW_ANIM_"
route = "same"
verbs = ["EVENT", "PRESETS", "PREVIEW"]

[[family]]
old = "CMND_EVT_ANIM_REPORT_"
new = "CMND_VRFW_REPORT_"
route = "report_filter"
type = "anim"
verbs = ["COUNT", "ROW"]

