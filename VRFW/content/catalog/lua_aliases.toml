[[family]]
old = "CMND_EVT_PACHANGA_"
new = "CMND_VRFW_FRIENDLY_"
route = "same"
verbs_of = "friendly"

# Names used by pre-release 2.0 builds, mapped to their VRFW replacements.
[[family]]
old = "CMND_VRFW_PACHANGA_"
new = "CMND_VRFW_FRIENDLY_"
route = "same"
verbs_of = "friendly"

[[family]]
old = "CMND_EVT_TRIAL_JUDGE"
