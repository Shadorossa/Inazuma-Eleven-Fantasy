new = "CMND_VRFW_REG_"
route = "prepend_type"
type = "item"
verbs = ["COUNT", "FIND", "GET", "HIDDEN"]

[[family]]
old = "CMND_EVT_ITEM_CURRENCY_"
new = "CMND_VRFW_ITEM_CURRENCY_"
route = "same"
verbs = ["COUNT", "FIND", "GET"]

[[family]]
old = "CMND_EVT_ITEM_REPORT"
new = "CMND_VRFW_REPORT_COUNT"
route = "report_filter"
type = "item"
verbs = [""]

[[family]]
old = "CMND_EVT_ITEM_REPORT_LINE"
