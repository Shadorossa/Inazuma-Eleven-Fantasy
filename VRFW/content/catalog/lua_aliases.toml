route = "prepend_type"
type = "shop"
verbs = [""]

# rule / friendly
[[family]]
old = "CMND_EVT_CHALLENGE_"
new = "CMND_VRFW_RULE_CHALLENGE_"
route = "same"
verbs = ["ARM", "CLAIM", "DISARM", "OPTIONS", "STATE"]

# VERSION stays a type command: legacy names return a number, CMND_VRFW_VERSION returns the version string
[[family]]
old = "CMND_EVT_MATCH_ENGINE_"
new = "CMND_VRFW_RULE_ENGINE_"
route = "same"
verbs = ["BREAK", "GET", "LIST", "OVERRIDE", "SELECT", "STATE", "VERSION"]

[[family]]
old = "CMND_EVT_MATCH_RULES_"
