schema = "VRFW.catalog/1"
# Legacy 1.x Lua command names mapped to their VRFW replacements; each old name logs a deprecation warning once.
# [verb_sets]: shared verb lists. [[family]]: old/new prefix, route (same | prepend_type | report_filter), verbs ("" = bare prefix).
# [[owner]]: node type that owns an old name by prefix (first match wins, else core).

[verb_sets]
# the verbs of the `friendly` type's commands
friendly = ["ABORT", "ACK", "AUX", "BACK", "MAP", "PASSED", "PASSED_SET", "REPORT", "RULES", "START", "STATE", "STEP", "TITLE_NET", "CALLER", "MENU_BACK"]

# anim / celebration
[[family]]
old = "CMND_EVT_ANIM_CELEBR_VISIBLE"
new = "CMND_VRFW_CELEBRATION_VISIBLE"
route = "same"
verbs = [""]

[[family]]
old = "CMND_EVT_ANIM_CREATED_"
new = "CMND_VRFW_REG_"
route = "prepend_type"
type = "anim"
verbs = ["COUNT", "GET"]

[[family]]
old = "CMND_EVT_ANIM_"
new = "CMND_VRFW_ANIM_"
route = "same"
verbs = ["EVENT", "PRESETS", "PREVIEW"]

[[family]]
old = "CMND_EVT_ANIM_REPORT_"
new = "CMND_VRFW_REPORT_"
route = "report_filter"
type = "anim"
verbs = ["COUNT", "ROW"]

# sound
[[family]]
old = "CMND_EVT_AUDIO_"
new = "CMND_VRFW_SOUND_"
route = "same"
verbs = ["LIBRARY", "LIBRARY_TRACK", "TRACK_BGM"]

[[family]]
old = "CMND_EVT_VOICE_"
new = "CMND_VRFW_SOUND_VOICE_"
route = "same"
verbs = ["GET", "NAME", "SET"]

# changelog: no aliases left
# character
[[family]]
old = "CMND_EVT_CHARA_"
new = "CMND_VRFW_REG_"
route = "prepend_type"
type = "character"
verbs = ["COUNT", "GET", "HIDDEN"]

[[family]]
old = "CMND_EVT_CHARA_REQ_"
new = "CMND_VRFW_CHARACTER_REQ_"
route = "same"
verbs = ["COUNT", "ENTRY", "OF", "ROW"]

# item / shop
