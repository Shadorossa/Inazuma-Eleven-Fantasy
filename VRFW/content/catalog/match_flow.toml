cat = "action"

[[kind]]
kind = "act.wait"
cat = "action"
args = [
    { name = "seconds", type = "num", default = 0.8 },
]

[[kind]]
kind = "act.kickoff_user"
cat = "action"

[[kind]]
kind = "act.hide_team"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "visible", type = "bool", default = false },
]

[[kind]]
kind = "act.camera_fix"
cat = "action"
args = [
    { name = "id", type = "id", default = "0" },
