schema = "VRFW.catalog/1"
# The node kinds of a match flow (M4, docs/framework/catalogs.md; vr_core::types::match_flow, kind
# `VRFW.match_flow/1` of the trigger type): every kind a flow may use, its category, ports and arguments. The
# interpreter (match_flow.lua) implements each kind by its name: a new kind needs its code there. Built into the
# framework: the installed copy must stay the same data (else it is reported and not read).
#
# [category.<cat>]: the input / output ports of a kind of that category unless the kind says (`ins` / `outs`);
# every port is a flow port. Categories: trigger, cond, action, scene, rule, end, note (the editor's header
# colours). The editor labels a kind with the text key `nf_k_<kind with _>`, a port `nf_p_<port>`, an argument
# `nf_a_<arg>`.
# [[kind]]: kind, cat, row (a trigger's game trigger type: one DATA_ITEM row, docs/game/engine/
# match-scripting.md; -1 = the node's own `type` argument), args = [{ name, type, default }] with type int, num,
# bool, team (user / rival), member (a soccer member id), id (number, 0x..., or a text -> its crc32), text,
# enum (+ values).

[category.trigger]
ins = []
outs = ["out"]

[category.cond]
ins = ["in"]
outs = ["yes", "no"]

[category.action]
ins = ["in"]
outs = ["out"]

[category.scene]
ins = ["in"]
outs = ["out"]

[category.rule]
ins = ["in"]
outs = ["out"]

[category.end]
ins = ["in"]
outs = ["out"]

[category.note]
ins = []
outs = []

# ---- triggers: one DATA_ITEM row each (docs/game/engine/match-scripting.md, the trigger table)
[[kind]]
kind = "trigger.match_init"
cat = "trigger"
row = 249

[[kind]]
kind = "trigger.kickoff"
cat = "trigger"
row = 201

[[kind]]
kind = "trigger.time"
cat = "trigger"
row = 227
args = [
    { name = "cond", type = "text", default = "" },
]

[[kind]]
kind = "trigger.phase"
cat = "trigger"
row = 252
args = [
    { name = "cond", type = "text", default = "" },
]

[[kind]]
kind = "trigger.focus_result"
cat = "trigger"
row = 244
args = [
    { name = "team", type = "team", default = "user" },
]

[[kind]]
kind = "trigger.focus_start"
cat = "trigger"
row = 203
args = [
    { name = "member", type = "member", default = "0" },
]

[[kind]]
kind = "trigger.carrier_area"
cat = "trigger"
row = 207
args = [
    { name = "cond", type = "text", default = "" },
]

[[kind]]
kind = "trigger.shot"
cat = "trigger"
row = 211
args = [
    { name = "team", type = "team", default = "user" },
]

[[kind]]
kind = "trigger.goal"
cat = "trigger"
row = 233
args = [
    { name = "team", type = "team", default = "user" },
]

[[kind]]
kind = "trigger.technique"
cat = "trigger"
row = 251
args = [
    { name = "member", type = "member", default = "0" },
]

[[kind]]
kind = "trigger.half_time"
cat = "trigger"
row = 256

[[kind]]
kind = "trigger.period_whistle"
cat = "trigger"
row = 257
args = [
    { name = "cond", type = "text", default = "" },
]

[[kind]]
kind = "trigger.full_time"
cat = "trigger"
row = 248

[[kind]]
kind = "trigger.result"
cat = "trigger"
row = 202
args = [
    { name = "result", type = "enum", default = "user", values = ["user", "rival", "draw"] },
]

[[kind]]
kind = "trigger.row"
cat = "trigger"
row = -1
args = [
    { name = "type", type = "int", default = 201 },
    { name = "target", type = "id", default = "0" },
    { name = "sub", type = "id", default = "0" },
    { name = "cond", type = "text", default = "" },
]

# ---- conditions
[[kind]]
kind = "cond.step"
cat = "cond"
args = [
    { name = "flag", type = "id", default = "0x97FCB2EF" },
    { name = "op", type = "enum", default = "eq", values = ["eq", "ne", "ge", "le", "gt", "lt"] },
    { name = "value", type = "int", default = 1 },
]

[[kind]]
kind = "cond.count"
cat = "cond"
outs = ["each", "reached"]
args = [
    { name = "flag", type = "id", default = "0x0EF5E355" },
    { name = "to", type = "int", default = 2 },
]

[[kind]]
kind = "cond.members"
cat = "cond"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "members", type = "text", default = "" },
]

[[kind]]
kind = "cond.score"
cat = "cond"
args = [
    { name = "op", type = "enum", default = "lead", values = ["lead", "behind", "tie", "not_lead"] },
]

[[kind]]
kind = "cond.once"
cat = "cond"
outs = ["first", "again"]
args = [
    { name = "flag", type = "id", default = "vrfw_flow_once" },
]

# ---- actions
[[kind]]
kind = "act.set_byte"
cat = "action"
args = [
    { name = "flag", type = "id", default = "0x97FCB2EF" },
