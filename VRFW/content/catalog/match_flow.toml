[[kind]]
kind = "act.quest_add"
cat = "action"
args = [
    { name = "line", type = "int", default = 0 },
    { name = "n", type = "int", default = 1 },
    { name = "quest", type = "id", default = "" },
]

[[kind]]
kind = "act.quest_open"
cat = "action"
args = [
    { name = "line", type = "int", default = 0 },
    { name = "quest", type = "id", default = "" },
]

[[kind]]
kind = "act.quest_fill"
cat = "action"
args = [
    { name = "line", type = "int", default = 0 },
    { name = "flag", type = "id", default = "0x0EF5E355" },
    { name = "to", type = "int", default = 2 },
    { name = "quest", type = "id", default = "" },
]

[[kind]]
kind = "act.goal"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "scorer", type = "member", default = "0" },
]

[[kind]]
kind = "act.goal_until_lead"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "scorer", type = "member", default = "0" },
    { name = "max", type = "int", default = 5 },
]

[[kind]]
kind = "act.ball_to"
cat = "action"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
]

[[kind]]
kind = "act.ball_get"
cat = "action"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
]

[[kind]]
kind = "act.focus_interrupt"
cat = "action"

[[kind]]
kind = "act.wait"
cat = "action"
args = [
    { name = "seconds", type = "num", default = 0.8 },
]

[[kind]]
kind = "act.kickoff_user"
cat = "action"

[[kind]]
kind = "act.hide_team"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "visible", type = "bool", default = false },
]

[[kind]]
kind = "act.camera_fix"
cat = "action"
args = [
    { name = "id", type = "id", default = "0" },
]

[[kind]]
kind = "act.enemy_boost"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "on", type = "bool", default = true },
]

# every duel won: the whole team (`member` 0), or only that member (a keeper nobody can beat)
[[kind]]
kind = "act.force_win"
cat = "action"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "on", type = "bool", default = true },
    { name = "member", type = "member", default = "0" },
]

[[kind]]
kind = "act.gather_ball"
cat = "action"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
    { name = "on", type = "bool", default = true },
]

[[kind]]
kind = "act.no_pass"
cat = "action"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
    { name = "on", type = "bool", default = true },
]

# an aura skill (keshin, armour, miximax, mode change: an aura command id) started (`on`) or ended on a player through
# the game's own scripted path (`ExecAuraSkill`, as the story scripts do); `slot` 1-6 first puts the skill in that
# match slot (its variant is prepared there), `event` plays its cut-in, `refill` fills the team's HDP gauge first
[[kind]]
kind = "act.aura"
cat = "action"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
    { name = "skill", type = "id", default = "0" },
    { name = "slot", type = "int", default = 0 },
    { name = "on", type = "bool", default = true },
    { name = "event", type = "bool", default = true },
    { name = "refill", type = "bool", default = false },
]

[[kind]]
kind = "act.command"
cat = "action"
args = [
    { name = "id", type = "id", default = "0" },
    { name = "args", type = "text", default = "" },
]

[[kind]]
kind = "act.log"
cat = "action"
args = [
    { name = "text", type = "text", default = "" },
]

# ---- rules: lasting match states (run like actions, usually from the match init / kick-off)
[[kind]]
kind = "rule.add_status"
cat = "rule"
args = [
    { name = "member", type = "member", default = "0" },
    { name = "team", type = "team", default = "user" },
    { name = "status", type = "id", default = "0x2519EF4A" },
    { name = "on", type = "bool", default = true },
    { name = "reset", type = "bool", default = true },
]

[[kind]]
kind = "rule.no_shoot"
cat = "rule"
args = [
    { name = "team", type = "team", default = "user" },
    { name = "on", type = "bool", default = true },
]

[[kind]]
kind = "rule.period_time"
cat = "rule"
args = [
    { name = "minutes", type = "int", default = 45 },
]

# ---- scenes
[[kind]]
