# The VR-Framework's chain board screen vrfw_chain_board_menu (docs/framework/chain-board.md): the 3DS «Cadenas» board
# of a [[VRFW.Chain]] with [[VRFW.Chain.Tile]]s (team type), opened by a mod's board (Inazuma Fantasy: the Chronicle board's «C»
# pieces, graft route_chains). Written from Inazuma Fantasy's INAROGUE coach selector (menus\rogue_coaches.toml): base
# savedata_management_menu (background, header, guide line, cursor, button guides, the off-screen input anchor) + quad
# pools of the framework's own objects (below), by draw priority: vrfw_chain_bg (451: the page panels), vrfw_chain_line
# (453: the links), vrfw_chain_tile (455: tile plates, the mouse's hit areas), vrfw_chain_emb (457: crest / icon on the
# tile), vrfw_chain_tag (458: rank badge / check), vrfw_chain_ui (459: cursor ring, page title plates, page arrows), and
# vrfw_chain_title (the retail list item, 551: the help window's lines and a chain hub's list rows, its plate meshes hidden), vrfw_chain_card (459)
# + vrfw_chain_cardtxt (551): the team card above the board (2.0.49), vrfw_chain_icon (461, 2026-10-11): the card's crest
# and the help window's badges / separators above their panels. Board pool counts = two pages
# of at most 6 x 5 tiles (team type MAX_BOARD_COLS / ROWS). Art: images\menu\220_img\vrfw_chain.toml (the framework's
# own drawings, research/scripts/chain_board_art.py). The script is the Lua build's full file (graft chain_board,
# `menu_assemble.py build --mod vr_framework`), packed by framework_pack.py as menus\scripts\vrfw_chain_board_menu.lua.
# Harmless when no mod declares a chain board: nothing opens the screen.
schema = "VRFW.menu/2"

# the anchor's layout (.g4pkm): a copy of the retail save01_01 with the system line / time text moved off screen
layout = [
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", from = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_system_line01", translate = [97.0, 2803.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_text_time01", translate = [116.0, 2812.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_pos_time01", translate = [377.0, 2822.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_pos_top_list_atc01", translate = [0.0, 2696.0, 0.0] },
]

# ---- objects ----------------------------------------------------------------------------------------------------------
# the input anchor's attach base: save01_01_list_attach_base with only instance 0's attach row (as IF's
# evt_rogue_bank_rows) and the system line / time text moved off screen (layout below)
[[object]]
name = "vrfw_chain_rows"
from = "save01_01_list_attach_base"
remove = [
    { param = "NullLayerName", match = { 1 = 0x6735D333, 2 = 0x9E0634B0, 3 = 0xCDF9A8B9, 4 = 1 } },
    { param = "NullLayerName", match = { 1 = 0x1032E3A5, 2 = 0xE9010426, 3 = 0xCDF9A8B9, 4 = 2 } },
    { param = "NullLayerName", match = { 1 = 0x8E567606, 2 = 0x77659185, 3 = 0xCDF9A8B9, 4 = 3 } },
    { param = "NullLayerName", match = { 1 = 0xF9514690, 2 = 0x0062A113, 3 = 0xCDF9A8B9, 4 = 4 } },
    { param = "NullLayerName", match = { 1 = 0x6058172A, 2 = 0x996BF0A9, 3 = 0x1FA09B6B, 4 = 0 } },
]
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" }, values = { 1 = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm" } },
]

# the IE3 chain screen's background (2.0.37): a full-screen quad at the retail background's priority (450, under the
# header 452); the script hides mainmenu90_00_background
[[object]]
name = "vrfw_chain_back"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 450 } }]

# the help window (Tab «Ayuda», 2.0.45): a panel + one badge per declared match rank above the board (460, 2.0.49: up to 6
# ranks, defaults\match_rank.toml), its lines in vrfw_chain_title
[[object]]
name = "vrfw_chain_helpwin"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 460 } }]

# the team card above the board (2.0.49): its panel and the crest / icon (459); its lines in vrfw_chain_cardtxt
[[object]]
name = "vrfw_chain_card"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]

# what sits ON the card / the help window (2026-10-11): the card's crest, the help window's rank badges and row
# separators, in their own layer above both panels (461; drawn in the panel's own layer they came out faded)
[[object]]
name = "vrfw_chain_icon"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 461 } }]

[[object]]
name = "vrfw_chain_bg"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 451 } }]

[[object]]
name = "vrfw_chain_line"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 453 } }]

# the tile plates are the mouse's hit areas (docs/game/ui/mouse-support.md): a MenuCollisionSetting on the quad node
[[object]]
name = "vrfw_chain_tile"
from = "cmn01_10_new_icon"
add_block = [{ block = "MenuCollisionSetting", values = [0], after = "CMenuAnimation" }]
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 455 } }]
add = [{ block = "MenuCollisionSetting", param = "_icon_new01", values = [0, 1, 1] }]

[[object]]
name = "vrfw_chain_emb"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 457 } }]

[[object]]
name = "vrfw_chain_tag"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 458 } }]

[[object]]
name = "vrfw_chain_ui"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]


