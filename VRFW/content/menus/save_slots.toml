# ---- the screen's own menu objects (each a retail object, `from`, with its rows changed) --------------------------

[[object]]
name = "evt_save01_01_slot_base"
from = "save01_01_list_attach_base"
keep_name = true
remove = [
    { param = "NullLayerName", match = { 1 = 0xF9514690, 2 = 0x0062A113, 3 = 0xCDF9A8B9, 4 = 4 } },
    { param = "NullLayerName", match = { 1 = 0x6058172A, 2 = 0x996BF0A9, 3 = 0x1FA09B6B, 4 = 0 } },
]
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" }, values = { 1 = "common/menu/51_save/save01/evt_save01_01_slot/evt_save01_01_slot.g4pkm" } },
]

