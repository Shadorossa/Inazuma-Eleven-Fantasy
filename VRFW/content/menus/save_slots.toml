# The VR-Framework's save slot screen (graft save_slots, docs/game/mechanics/save-slots.md): the screen opened by
# EMPEZAR on the title screen (title_menu_inc patch of the framework's save\lua root). Moved from Inazuma Fantasy's
# menus\ (screens.toml / screen_objects.toml / screen_layouts.toml, made by if_screens_to_toml.py from slot_build.py's
# files) on 2026-10-07, rows unchanged. The script is the Lua build's full file (menu_assemble.py build --mod
# vr_framework), packed by framework_pack.py as menus\scripts\evt_save_slot_menu.lua; its art is
# save\files\data\dx11\menu\220_img\evt_slot\evt_slot_base.g4tx (player-slot sprites only; Level-5-derived, generated at
# pack time by framework_pack.py with slot_card_art.write_atlas from the retail dump, never committed).
# The layout keeps 4 cards: the 4th is the card of a slot a mod reserved (its content from the owner's
# VRFW_SS_RESERVED provider); the script hides it while no reserved slot is enterable.
schema = "vr_framework.menu/2"

