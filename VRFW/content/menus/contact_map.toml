# The VR-Framework's contact map screen vrfw_contact_map_menu (docs/framework/contact-map.md, VRFW 2.1): the IE-style
# «contactos» / scout map of a [[VRFW.ContactSet]] declared by a mod (content\contact_maps\*.toml): the set's maps, a
# map's zones (pins on its drawn background) / sections, a zone's players (a grid of faces), a Connection Map
# (network: tiles, links, strict order) and the items for sale. Recruiting goes through VRFW_Recruit (the game's own
# add-character path). Opened by a mod's entry (e.g. a market banner, graft
# contact_map_banner) with parameter crc32("vrfw_contact_set") = the set; nothing opens it when no mod declares a set.
# Written from the chain board screen (menus\chain_board.toml): base savedata_management_menu (background, header,
# guide line, cursor, button guides, the off-screen input anchor) + quad pools of the framework's own objects, by draw
# priority: vrfw_cm_back (450: the map's background), vrfw_cm_zoneart (451: a zone's own map), vrfw_cm_line (453: links), vrfw_cm_tile (455: plates / pins,
# the mouse's hit areas), vrfw_cm_face (457: faces), vrfw_cm_tag (458: check / padlock badges), vrfw_cm_ui (459: the
# cursor ring, page arrows), vrfw_cm_card (459: the info card), vrfw_cm_icon (461: the card's face), vrfw_cm_title +
# vrfw_cm_cardtxt (the retail list item, 551: list rows and the card's lines). Art: the framework ships no mod's pictures; it is
# drawn by ROLE: the sprites a mod declares in its
# content\screen_art\*.toml (Screen = "contact_map"; e.g. a mod's contact map atlases), loaded on
# demand by the script; a role nobody declares is a tinted shape of the framework's neutral atlas vrfw_plain (the only
# art atlas in `res`: a mod's atlas never goes here, it may not be installed). A map's own background comes from its
# declaration (loaded on demand). The script: graft contact_map (`menu_assemble.py build --mod vr_framework`),
# packed by framework_pack.py as assets\lua\screens\vrfw_contact_map_menu.lua.
schema = "VRFW.menu/2"

# the anchor's layout (.g4pkm): a copy of the retail save01_01 with the system line / time text moved off screen
layout = [
    { file = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm", from = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" },
    { file = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm", joint = "_system_line01", translate = [97.0, 2803.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm", joint = "_text_time01", translate = [116.0, 2812.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm", joint = "_pos_time01", translate = [377.0, 2822.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm", joint = "_pos_top_list_atc01", translate = [0.0, 2696.0, 0.0] },
]

# ---- objects ----------------------------------------------------------------------------------------------------------
[[object]]
name = "vrfw_cm_rows"
from = "save01_01_list_attach_base"
remove = [
    { param = "NullLayerName", match = { 1 = 0x6735D333, 2 = 0x9E0634B0, 3 = 0xCDF9A8B9, 4 = 1 } },
    { param = "NullLayerName", match = { 1 = 0x1032E3A5, 2 = 0xE9010426, 3 = 0xCDF9A8B9, 4 = 2 } },
    { param = "NullLayerName", match = { 1 = 0x8E567606, 2 = 0x77659185, 3 = 0xCDF9A8B9, 4 = 3 } },
    { param = "NullLayerName", match = { 1 = 0xF9514690, 2 = 0x0062A113, 3 = 0xCDF9A8B9, 4 = 4 } },
    { param = "NullLayerName", match = { 1 = 0x6058172A, 2 = 0x996BF0A9, 3 = 0x1FA09B6B, 4 = 0 } },
]
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" }, values = { 1 = "common/menu/51_save/save01/vrfw_cm_rows/vrfw_cm_rows.g4pkm" } },
]

# the backgrounds are drawn in the BACKGROUND pass (m_drawType 1, as the retail shop01_00_background): under the 3D
# player model of the panel; every other layer of the screen is drawn over the model
# 454-456: above the hub's own background-pass layers (market_menu shop01_00_background 451, its market background
# 453), which would cover them
[[object]]
name = "vrfw_cm_back"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 454 } }]
add = [{ block = "CMenuRenderComponent", param = "m_drawType", values = [1] }]

# a zone's own map (GO / CS / Galaxy: the free walk's 3DS area map page) over the background, under everything else
[[object]]
name = "vrfw_cm_zoneart"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 455 } }]
add = [{ block = "CMenuRenderComponent", param = "m_drawType", values = [1] }]

# the player panel on the right: 0 its ground (art role panel_ground), 1 its old fade into the
# map (hidden); background pass, over the map art, under the 3D model
[[object]]
name = "vrfw_cm_panel"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 456 } }]
add = [{ block = "CMenuRenderComponent", param = "m_drawType", values = [1] }]

# the panel's 3D player model: the retail shop list base (its CMenuCharaModelComponent, the shop's model camera), the
# list / sound / collision / analog parts removed; driven by the shared EVT_CharaModelNew (evt_menu_kit.lua#CharaModel)
[[object]]
name = "vrfw_cm_model"
from = "shop01_01_list_base"
remove_block = ["CMenuListViewShop", "CMenuSoundCmdProperty", "MenuCollisionSetting", "CAnalogInputComponent"]

[[object]]
name = "vrfw_cm_line"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 453 } }]

# the plates / pins are the mouse's hit areas (docs/game/ui/mouse-support.md): a MenuCollisionSetting on the quad node
[[object]]
name = "vrfw_cm_tile"
from = "cmn01_10_new_icon"
add_block = [{ block = "MenuCollisionSetting", values = [0], after = "CMenuAnimation" }]
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 455 } }]
add = [{ block = "MenuCollisionSetting", param = "_icon_new01", values = [0, 1, 1] }]

[[object]]
name = "vrfw_cm_face"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 457 } }]

[[object]]
name = "vrfw_cm_tag"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 458 } }]

[[object]]
name = "vrfw_cm_ui"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]

[[object]]
name = "vrfw_cm_card"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]

# the card's requirement icons (462) and their met / unmet badges (463)
[[object]]
name = "vrfw_cm_req"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 462 } }]

[[object]]
name = "vrfw_cm_reqok"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 463 } }]

[[object]]
name = "vrfw_cm_icon"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 461 } }]


# a player's bust: the retail character
# card's face icon, the game's miniface + kit of his chara_param (native composite, icon type 9); the screen hides
# every other part of the card. Faces of the grid / pins / network (457, over the plates) and the info card's (461).
[[object]]
name = "vrfw_cm_bust"
from = "team00_01_chara_card_for_list"
priority = 457

[[object]]
name = "vrfw_cm_busticon"
from = "team00_01_chara_card_for_list"
priority = 461

# the header row's band: a copy of the
# office's status plate object (soccer11_04 layout, position-coloured plate sprites) the screen squashes to the row and
# shows only its two plate sprites (evt_menu_kit.lua#StatusPlateKeep), as the player page's evt_pp_slant; under the row (the header plate soccer11_04_formation_chara_status, retail priority 303)
[[object]]
name = "vrfw_cm_slant"
from = "soccer11_04_universe_chara_stasus"
priority = 301
remove = [
    { param = "NullLayerName" },
    { param = "NullLayerIndexName" },
]

# ---- the screen -------------------------------------------------------------------------------------------------------
[[screen]]
name = "vrfw_contact_map_menu"
like = "language_option_menu"
# input priority (registry column 3) above its hub: the engine's menu controller gives the pad only to the menus of the
# highest priority in its input list; language_option_menu's 220 left the pad with the Mercado (market_menu, 230) under
# the screen (logged as «VRFW input owners 3209C323 p230 top; 50C81DA7 p220»): no D-pad / stick / A reached it.
# 240 (as 3 retail screens): still under the question / message windows it opens (general_window 999, sub_window 500).
set = { priority = 240 }
base = "savedata_management_menu"
script = "assets/lua/screens/vrfw_contact_map_menu.lua"

