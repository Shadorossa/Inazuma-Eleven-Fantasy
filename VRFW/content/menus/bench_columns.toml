# The second bench column of the team screens (docs/framework/team-editor.md «Two bench columns»; Lua
# assets/lua/menu/_all/81_team_editor_bench_columns.lua). The team's reserve positions 20-24 get cards: the pitch frame's bench
# rows (card and empty slot, instances 11-15 on _pos_sub_atc01..05) copied for instances 20-24 on five new joints
# _pos_sub2_atc01..05, one column right of the bench; the dock and the lineup screen create 25 cards (0-18 as retail,
# 19 unused, 20-24 the second column). A screen whose caller asks for no second column hides instances 19-24.
