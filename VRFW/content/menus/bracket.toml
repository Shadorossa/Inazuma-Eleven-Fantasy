# ---- the screen --------------------------------------------------------------------------------------------------
# * Pools (the script's N: change both together): line 330 (a 64-team tree: 251 pieces + 62 pairs + the final's 2
#   digits + up to 15 shoot-out digits), row_l 33 (32 plates + the champion's), row_r 32, box 36 (the player's frame, at
#   most 32 stars, the stadium's picture), crest 32, icon 1 (the crown), the stadium panel 1.
# * The retail art with its retail layer names (the tree base attaches the strips, the trophy, the scores and the panel
#   to its nodes by layer name; each strip attaches the star instance of its slot): base 1, strips 16, stars 16, trophy
#   1, scores 8 + 4 + 2 + 1, the schedule panel 1 = 50. Its draw priorities are the retail ones (197-203); a host
#   whose background draws above them asks a lift (parameter vrfw_bracket_lift; the script raises each layer).
# * Total 465 + 50 = 515 instances, opened with the menu's group; the script hides each as the engine sets it up and
#   draws once all are.
[[screen]]
name = "vrfw_bracket_menu"
like = "language_option_menu"
set = { priority = 0 }
base = "chara_model_only_view_menu"
script = "assets/lua/screens/vrfw_bracket_menu.lua"

[screen.rows]
layer = [
    { layer = "vroad04_01_tournament_base", object = "vroad04_01_tournament_base", count = 1, align = [1, 8], scale = 0.20000000298023224 },
