# VR-Framework: the knockout bracket screen vrfw_bracket_menu (script assets\lua\screens\vrfw_bracket_menu.lua), a
# draw-only child menu (registry priority 0: its host keeps the pad; no input layer, no focus group, no command row)
# opened over any host menu by VRFW_Bracket (assets\lua\menu\_all\90_bracket.lua). It draws the view of its host's
# view command (kind "tree", scripts\lib\competition.lua bracket_view): the generic lines of any size, the Victory
# Road 16-team art, the advance, the final stadium's panel. The host keeps its keys, header and background.
# Every layer is in the screen's group with the «not opened with the group» flags; the script places each instance in
# screen px from the top left (align [1, 8] + scale 0.2: CMND_SET_LAYER_LOCAL_POS x, -y) and sizes it.
schema = "VRFW.menu/2"

# ---- objects -----------------------------------------------------------------------------------------------------
# a team's plate, left side: the emblem list's row (team06_02_emblem_list_item) on a narrower copy of its layout
# (520 px: plate, crest slot 22 px from the left edge, the name after it); no hit zone, no attach to the emblem list's
# locators; its atlas named (a renamed layout takes the atlas of its own name else)
[[object]]
name = "vrfw_bracket_row_l"
from = "team06_02_emblem_list_item"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
set = [{ param = "SkeletonAnime", match = { 1 = "common/menu/102_team/team06/team06_02/team06_02.g4pkm" }, values = { 1 = "common/menu/102_team/team06/vrfw_bracket_row_l/vrfw_bracket_row_l.g4pkm" } }]
add = [{ block = "gmdMenuObj", param = "Texture", values = ["#/menu/102_team/team06/team06_02/team06_02.g4tx"] }]

# the right side's plate: the same row mirrored: the crest on the outer (right) edge, the name right-aligned
# (the retail styles' right-aligned twins: fs_32_w_rc_2d0_001_at2 / fs_32_b_rc_2d0_001_at2)
[[object]]
name = "vrfw_bracket_row_r"
from = "team06_02_emblem_list_item"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/102_team/team06/team06_02/team06_02.g4pkm" }, values = { 1 = "common/menu/102_team/team06/vrfw_bracket_row_r/vrfw_bracket_row_r.g4pkm" } },
    { param = "_text_list01_on", values = { 1 = 1670131169 } },
    { param = "_text_list01_off", values = { 1 = -864663 } },
]
add = [{ block = "gmdMenuObj", param = "Texture", values = ["#/menu/102_team/team06/team06_02/team06_02.g4tx"] }]

# the connectors and score digits (quads of vrfw_bracket.g4tx / vrfw_bracket_num.g4tx): under the plates
[[object]]
name = "vrfw_bracket_line"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 549 } }]

# the player's frame, the stars at the joints, the final stadium's picture: over the plates (551)
[[object]]
name = "vrfw_bracket_box"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 552 } }]

# the champion's crown: above the plates
[[object]]
name = "vrfw_bracket_icon"
from = "cmn01_10_new_icon"
set = [{ param = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 554 } }]

# the round panel: the retail vroad04_09 (the same rounded navy plate and text styles) with its three lines one under
# the other (the round in the title style, the matches played, the next match) and its two clocks hidden; only its
# layout's translate / scale changed
[[object]]
name = "vrfw_bracket_sched"
from = "vroad04_09_schedule_for_spectator"
set = [{ param = "SkeletonAnime", match = { 1 = "common/menu/75_vroad/vroad04/vroad04_09/vroad04_09.g4pkm" }, values = { 1 = "common/menu/75_vroad/vroad04/vrfw_bracket_sched/vrfw_bracket_sched.g4pkm" } }]
add = [{ block = "gmdMenuObj", param = "Texture", values = ["#/menu/75_vroad/vroad04/vroad04_09/vroad04_09.g4tx"] }]

# the final stadium's box: the same panel with two lines (the label in the round title's style, the stadium in the next
# match line's), centred on the layer's origin (the script places it at the bottom centre)
[[object]]
name = "vrfw_bracket_stadium"
from = "vroad04_09_schedule_for_spectator"
set = [{ param = "SkeletonAnime", match = { 1 = "common/menu/75_vroad/vroad04/vroad04_09/vroad04_09.g4pkm" }, values = { 1 = "common/menu/75_vroad/vroad04/vrfw_bracket_stadium/vrfw_bracket_stadium.g4pkm" } }]
add = [{ block = "gmdMenuObj", param = "Texture", values = ["#/menu/75_vroad/vroad04/vroad04_09/vroad04_09.g4tx"] }]

