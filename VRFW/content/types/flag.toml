# Maps the `flag` type (flags/**/*.toml) to rows of the game's flag_config; global bit flags must be listed there or the game ignores them.
schema = "VRFW.table_map/1"

# [[flag]]: appended to its bank's list in declaration order; the bank count is raised.
#   name   flag name; its id is crc32(name)
#   id     id when the name is unknown (0x…, number); with `name` too, both must agree
#   bank   FLAG_INFO bank (0 = story / global bank)
#   bit    bit in the bank (fixed: where saves keep it)
# A flag already in the bank at the same bit is kept once; a bit used by another flag, or the same flag at another bit, is left out with a warning.
[[map]]
entry = "flag"
table = "system/flag"
mode = "append"
key = "name"                                   # label in messages (a flag with only `id`: its position)
row_key = { lua = "flag.lua:id" }              # crc32(name), or id
within = { table = "system/flag_bank", column = "bank", key = "{bank}" }
keep_existing = true                           # never replace a flag the bank already has
unique_columns = ["index"]                     # one flag per bit
count = "flags"
[map.fields]
name = { type = "string" }
id = { type = "id" }
bank = { type = "int", required = true }
bit = { column = "index", type = "int", required = true }
