# Declaration schema for [[VRFW.LevelSync]] (content\level_sync\*.toml); an unknown key, wrong type or out-of-range value drops that declaration with a warning.
schema = "VRFW.decl_schema/1"
kind = "VRFW.level_sync/1"
folder = "content/level_sync"

[entry.LevelSync]
doc = "the user's team plays the matches of the given games and / or difficulty rows at one level: each player's match stats are the stats of that level (the saved players keep their level, EXP, boards and moves: every move he has stays usable); the first declaration of a game / row pair is used, a later one of the same pair is left out"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
games = { type = "ids", doc = "game names (SOCCER_GAME_INFO col 1, e.g. fbtl_bb_stadium_00 = every Battle Bay match) or ids (0x…); empty = every game (then difficulties is required)" }
difficulties = { type = "ints", min = 1, max = 255, doc = "difficulty rows (SOCCER_GAME_DIFFICULTY col 0, e.g. 6 = the free match's first class); empty = every row of the games" }
level = { type = "int", min = 1, max = 999, required = true, doc = "the level the user's players play at" }
raise = { type = "bool", default = true, doc = "a player below the level plays at it too (false: only the players above it are brought down, as the game's own level sync)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
