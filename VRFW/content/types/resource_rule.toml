# Declaration schema for match resource rules (content\resource_rules\*.toml); an unknown key, wrong type or out-of-range value drops that declaration with a warning.
schema = "VRFW.decl_schema/1"
kind = "VRFW.resource_rule/1"
folder = "content/resource_rules"

[entry.ShotSpend]
doc = "what a shot does with one of the engine's team gauges (the retail shot spends the whole gauge and gives back the archetype's return rate of it)"
# later mod in load order wins per key
gauge = { type = "name", required = true, doc = "the engine's gauge: kizuna (the team's kizuna power, ShootStart's spend at Kizuna.SpendOnShot)" }
spend_on_shot = { type = "bool", default = true, doc = "false = a shot does not set the gauge to 0 (its bonus is passive, at the gauge's current value, on every shot)" }
return_on_shot = { type = "bool", default = true, doc = "false = no return after a shot (the return rate of the «Vínculo» (bond) archetype, 0 to 50 %, is not added back): return rate 0" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }

[entry.OffPitch]
doc = "the mod takes players off the pitch without a red card (an exhausted player kneels until the end of the match): the engine sees them sent off, the red-card questions answer no, substitutions see them"
# The mod's exported native table Resource.OffPitch (key: soccer actor handle, value 0) lists those players; the framework answers IsSentOff / IsSentOffById from it
# and signals vrfw.off_pitch.layout / vrfw.off_pitch.layout_done around substitutions.
name = { type = "name", required = true, doc = "the rule's name (log, report)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
