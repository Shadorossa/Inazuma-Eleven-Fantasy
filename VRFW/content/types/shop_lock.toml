# Declaration schema for [[VRFW.ShopLock]] and [[VRFW.ShopLockText]] (content\shop_locks\*.toml); an unknown key, wrong type or out-of-range value drops that declaration with a warning.
schema = "VRFW.decl_schema/1"
kind = "VRFW.shop_lock/1"
folder = "content/shop_locks"

[entry.ShopLock]
doc = "shops whose rows hidden by an unmet progress condition are listed as locked (padlock, greyed, not buyable, what unlocks them as their name) instead of left out"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
shops = { type = "ids", doc = "the shops: SHOP_INFO ids (0x…) or their key names (crc32); needed unless all_shops = true" }
all_shops = { type = "bool", default = false, doc = "every shop of the game and of the mods" }
items = { type = "ids", doc = "only the rows selling these items (names or ids); none = every row of the shops" }
keep_hidden = { type = "ids", doc = "flags (names or ids) whose mention in a row's condition keeps the row hidden: a hide or a page selector, not a progress gate" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }

[entry.ShopLockText]
doc = "what a locked row waiting for one of these global bit flags shows (the framework names story chapters, matches and Chronicle pieces by itself)"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
flags = { type = "ids", required = true, doc = "global bit flags (names or ids)" }
text = { type = "string", required = true, doc = "text key of the sentence (a [[row]] of the mod's text, any table searched by CMND_TEXT_GET)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
