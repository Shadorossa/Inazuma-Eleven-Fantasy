# How the type `formation` (formations\**\*.toml, kind vr_framework.formation/1) becomes rows of the game's
# formation_config. Read by the framework at every start that is not served from the cache: changing this file needs
# no compile. Format: docs/framework/table-map.md. Columns are schema names (schemas/formation/formation.toml).
schema = "VRFW.table_map/1"

# [[formation]]: a NEW formation row.
#   name      own name (a-z 0-9 _); its row key is the number of `<mod>.<name>` in id space `formation`
#             (crc32("<mod>.<name>"), `#1`… on a clash with the game's formations; pinned in ids\formation.json)
#   id        a fixed row key, kept as written (number, 0x…, or a name hashed with crc32) and pinned
#   based_on  the formation it clones (powers, name, description, the placements `places` does not replace)
#   after     insert the row after this formation (default: at the end)
#   places    the placement rows (slice placement_info, replaced): position_no, position_id, pass_no, b_kickoff,
#             b_follow, defense_pos … bustup_pos
#   cells     other cells of the row, by column name (power_offense, power_defense, noun_id …)
# A reference (based_on, after, an [[edit]] / [[remove]] target) is a game id (number / 0x…), a name (crc32), or
# `<mod>.<name>` / an own `<name>` of a formation of this start.
[[map]]
entry = "formation"
table = "formation/formation"
mode = "append"
key = "name"
id_space = "formation"
pin = "id"
from = "based_on"
after = "after"
cells = "cells"
count = "new"
[map.fields]
places = { column = "placement_info", type = "list", slice = true }
[map.refs]
based_on = "formation"
after = "formation"

# [[edit]]: cells of an existing formation (`target`), `places` = all its placement rows.
[[map]]
entry = "edit"
table = "formation/formation"
mode = "edit"
key = "target"
cells = "cells"
count = "edited"
[map.fields]
places = { column = "placement_info", type = "list", slice = true }
[map.refs]
target = "formation"

# [[remove]]: delete a formation (`target`) and its placement rows nobody else points at.
[[map]]
entry = "remove"
table = "formation/formation"
mode = "remove"
key = "target"
count = "removed"
[map.refs]
target = "formation"
