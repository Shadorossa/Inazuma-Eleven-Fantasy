# The declaration `[[VRFW.Flow]]` of the flow toggles (service S8 of VRFW 2.3, docs/framework/flow.md): what a mod's
# content\flows\*.toml may say. Read by scripts\flow.lua at start (every key is checked against this file: an unknown
# key, a wrong type or a value out of range leaves that declaration out with a warning). Not a table map.
schema = "VRFW.decl_schema/1"
kind = "VRFW.flow/1"
folder = "content/flows"

[entry.Flow]
doc = "a screen / flow toggle of the game: which way one of its fixed decisions goes"
# the toggles and their values are the framework's (scripts\flow.lua TOGGLES); several mods: the later mod (load order) wins
name = { type = "name", required = true, doc = "the toggle: prematch_editor" }
value = { type = "string", required = true, doc = "prematch_editor: \"game\" (the game's rule) or \"skip_offline\" (no team editor before the walk-in of an offline match)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
