# ------------------------------------------------------------------------------------------------ shared data

# the move kinds of TechniquePower: skill table `category` (1 shoot, 2 dribble, 3 block, 4 keeper) and the
# `skill_effect_bit_flag` bits (shoot: 4 long shot, 8 chain; block: 16 shot block; keeper: 1 catch, 2 punch)
[move_kinds]
shoot = { category = 1 }
long_shoot = { category = 1, flag = 4 }
chain_shoot = { category = 1, flag = 8 }
dribble = { category = 2 }
block = { category = 3 }
shoot_block = { category = 3, flag = 16 }
catch = { category = 4, flag = 1 }
punch = { category = 4, flag = 2 }

# how an Outcome reads the argument of its event
[outcomes]
succeeds = ["won", "saved"]
fails = ["lost", "beaten"]

# the passive level of a player (value_by_level): the first level whose player level he has reached. The game has no
# level for the special passives: this table is the mod's choice (14 levels over the game's 99).
[levels]
from_player_level = [1, 8, 15, 22, 29, 36, 43, 50, 57, 64, 71, 78, 85, 92]

# the card's main_position numbers (chara_position)
[positions]
gk = 1
fw = 2
mf = 3
df = 4

# KeeperShotPower side shooter: the battle's shot is the last shoot move of the other team within this many seconds
[keeper_duel]
shot_window_s = 8

# the spirit pools (Aura Points' match resources, per aura) PoolRestore / PoolCost use, and the rule flag
# <cost_flag>.<actor handle> = the percent of that player's pool costs
[points]
pool_resources = ["aura_points.peg", "aura_points.sp"]
cost_flag = "aura_points.cost_pct"

# the match unit's move slots (Trait `moves` / `families`): `count` entries from `first`, `stride` bytes apart; the
# move id is at +0, or at +`id_kind3` when the entry's kind byte (at +`kind`) is 3
[unit_moves]
first = 0x30
stride = 0x1C
count = 6
kind = 8
id_kind3 = 4

# when the on-pitch player list is read again (no timer): at a match start, at a soccer state change that is not
# between two of these live play states (a restart, a half, a substitution happen out of them), after a
# metamorphosis / summon command (command type `aura_command` of event_build), a declared form's start / end
# (transform), a match resource event (a spirit pool emptied) and the signal `vrfw.passives.refresh` (a mod that
# grants passives or changes a lineup may send it). Spirits and granted passives are checked again on every answered
# event.
[refresh]
live_states = [9, 14, 15, 16]
aura_command = 22

# the character's gender numbers (chara_base) of the Trait key `gender`
[genders]
male = 1
female = 2
