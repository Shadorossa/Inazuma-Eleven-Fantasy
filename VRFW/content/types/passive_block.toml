text = "obj_power"
apply = "power"
hooks = "move_power"
amount_key = "value"
doc = "the power of the targets' special moves of these kinds (move_power), × the stacks"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
kinds = { type = "strings", default = [], values = ["shoot", "long_shoot", "chain_shoot", "dribble", "block", "shoot_block", "catch", "punch"], words = "move_kind", doc = "the move kinds (empty = every move); see [move_kinds]" }
mode = { type = "string", default = "percent", values = ["percent", "flat"], words = "mode", doc = "percent of the power, or power points" }
value = { type = "number", required = true, min = -1000, max = 1000, doc = "per stack" }
value_by_level = { type = "numbers", default = [], doc = "per passive level (1, 2…: [levels]); empty = the one value" }
target = { type = "string", default = "self", values = ["self", "teammates", "team", "opponents", "all"], words = "target", doc = "whose moves" }
positions = { type = "strings", default = [], values = ["gk", "fw", "mf", "df"], words = "position", doc = "only targets of these positions (empty = any)" }
elements = { type = "strings", default = [], values = ["wind", "forest", "fire", "mountain", "void"], words = "element", doc = "only targets of these elements (empty = any)" }
trait = { type = "string", default = "", ref = "block", doc = "only targets of this Trait block (empty = any)" }

