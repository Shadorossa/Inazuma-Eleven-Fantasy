schema = "VRFW.option/2"
# Rows of the audio_engine mod in the Mods options (schema VRFW.option/2).

[[option]]
id = "voice_pack"
# Values: "None" plus the installed voice packs; custom row driven by lua/setting_menu/110_voice_pack.lua.
type = "lua"
label = "voice_pack"
help = "voice_pack_help"
# Disabled at "None" unless an enabled mod declares a voice pack in its mod.toml.
enabled_if = "languages:voices"
# Child of "Game settings"; when off, the game's own voices play.
parent = "mod_options.game_settings"
# Names the Lua shows (value 0, loader off).
texts = ["voice_pack_none", "voice_pack_off"]
# Setting id of an older equivalent row, adopted instead of duplicated.
row_key = "evt_set_voice_lang"
# First child of "Game settings".
order = 101

# Menu music: BGM played by the menus (framework mechanism, hook menu_music). Only the retail value is declared here;
# the other values are published at boot from the enabled mods' [[VRFW.MenuMusic]] themes. Hidden when none is declared.
[[option]]
id = "menu_music"
type = "list"
hook = "menu_music"
label = "menu_music"
help = "menu_music_help"
values = [
    { value = 0, name = "menu_music_retail", text = "Original" },
]
default = 0
hide_if_unpublished = true
# Child of "Custom style", after the custom opening row.
parent = "mod_options.custom_style"
order = 122
