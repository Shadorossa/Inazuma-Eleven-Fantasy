# The game modes of the retail game, for the current-mode service (docs/framework/services.md §2). The engine has no
# names for its modes: these rules say which of its own values mean what. Any mod may ship a game_modes.toml with more
# rules (a mode its plugin publishes as a game_state key) or contexts; the code knows none of these keys.
#
# [[rule]]: `key` holds while every condition given holds. Conditions:
#   play_mode = [..]   the engine's play-mode byte ([[g_gameRoot]+0x69C8]+0x2CAC6F; unreadable = 0, no save loaded)
#   scene = "Name"     a scene with this class name runs (the scene manager's slots)
#   state = "key"      game_state(key) == state_is (default 1): a ModLoader key or any plugin's
# The rules are checked by `order` (lower first, default 100); the first that holds is the game-detected key, and every
# rule that holds answers `is(key)` (a story match: `story`, and `match` too).
# [[context]]: a key the game has no value for; the screens that run it enter / leave it
# (CMND_VRFW_MODE_CURRENT_ENTER / _LEAVE).
# Play-mode values: docs/game/mechanics/outfit-slot.md §2 (1 VS / free / menus, 2 and 6 story, 3 Kizuna town, 4
# Chronicle, 5 Victory Road).
schema = "vr_framework.game_modes/1"

[[rule]]
key = "title"
order = 10
scene = "SceneTitle"

[[rule]]
key = "boot"
order = 20
play_mode = [0]

# a framework pachanga (match_engine), wherever it is played
[[rule]]
key = "pachanga"
order = 30
state = "match.friendly.running"

[[rule]]
key = "story"
order = 50
play_mode = [2, 6]

# Kizuna town: the retail free walk
[[rule]]
key = "free_walk"
order = 50
play_mode = [3]

[[rule]]
key = "chronicle"
order = 50
play_mode = [4]

[[rule]]
key = "victory_road"
order = 50
play_mode = [5]

# Battle Bay (menus and matches): play mode 1 like every free match, so no game value tells it; the menus of Utilities
# (lua/_all/utilities_friends.lua, by [friends.status_menus]) enter / leave this context. Mods hide features in it with
# is("battle_bay") (e.g. the player page Utilities.Career).
[[context]]
key = "battle_bay"

[[rule]]
key = "match"
order = 80
state = "match.in_match"

[[rule]]
key = "menus"
order = 90
play_mode = [1]
