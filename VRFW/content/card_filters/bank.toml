# Character bank filter header («Q ‹ value › E» above the bank lists); values come from the rarities and series declared by the game and mods.
schema = "VRFW.card_filter/1"

# Per screen: function/args = prev/next key events (L2/R2, Q/E); offset = layout px from the retail filter plate (y up).
# idle_local = screen local that must be 0 for the header to take the keys (0 = browsing).
[[screen]]
stem = "chara_bank_menu"
offset = [0.0, -52.0]
function = 3959000859
args = [3168962645, 70193212]
idle_local = "n18"

# Bank opened from searches, shops and team pickers.
[[screen]]
stem = "chara_bank_menu_for_search"
offset = [0.0, -52.0]
function = 3959000859
args = [3168962645, 70193212]

# Tab bar layout for 12 bank tabs (retail 11 + one mod tab); a mod with 13 tabs declares its own [[bank_tab_bar]].
[[bank_tab_bar]]
tabs = 12
attach = "vrfw_bank_tab12_{nn}"
