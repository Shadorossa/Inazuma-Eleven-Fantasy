schema = "VRFW.rule/1"
# Reglamento BASE: el modo Victory Road.
# Todas las reglas se dejan como las pone la fila del partido ("row"): el juego original tal cual. Un mod puede
# sustituir este reglamento (mismo id, carga después) o asignar otro a estos partidos en su rules\matches.toml.
id = "victory_road"
name = "Victory Road (original)"   # fallback; shown in the game language from the text key ruleset_victory_road
version = 1

[time]
half_minutes = "row"
halves = "row"

[teams]
players = "row"

[end]
extra_time = false
golden_goal = false
penalties = false
extended_vgoal = "row"
