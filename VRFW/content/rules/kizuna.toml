schema = "vr_framework.rule/1"
# Reglamento BASE: los partidos de la Ciudad vínculo.
# Todas las reglas se dejan como las pone la fila del partido ("row"): el juego original tal cual. Un mod puede
# sustituir este reglamento (mismo id, carga después) o asignar otro a estos partidos en su rules\matches.toml.
id = "kizuna"
name = "Bond Town (original)"   # fallback; shown in the game language from the text key ruleset_kizuna
version = 1

[time]
half_minutes = "row"
halves = "row"

[teams]
players = "row"

[end]
extra_time = false
golden_goal = false
penalties = false
extended_vgoal = "row"
