schema = "vr_framework.rule/1"
# Reglamento BASE: la historia: cada partido trae su duración, sus partes y su V-goal (9 partidos a gol de oro tras empate) en su fila y en sus guiones.
# Todas las reglas se dejan como las pone la fila del partido ("row"): el juego original tal cual. Un mod puede
# sustituir este reglamento (mismo id, carga después) o asignar otro a estos partidos en su rules\matches.toml.
id = "story"
name = "Story (original)"   # fallback; shown in the game language from the text key ruleset_story
version = 1

[time]
half_minutes = "row"
halves = "row"

[teams]
players = "row"

[end]
extra_time = false
golden_goal = false
penalties = false
extended_vgoal = "row"
