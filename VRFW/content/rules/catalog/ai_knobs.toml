# (chara_param main_position, VRFW.chara.card(id).position) the role chooser filters by, and the match's position
# group byte (the CharaAI role byte, the group Ai.PositionOffset 0x1656060 gets).

[[position]]
name = "goalkeeper"
card_position = 1
group = 0x10

[[position]]
name = "forward"
card_position = 2
group = 0x80

[[position]]
name = "midfielder"
card_position = 3
group = 0x40

[[position]]
name = "defender"
card_position = 4
group = 0x20

# ------------------------------------------------------------------------------------------------ per-team behaviours

[[team]]
name = "StatPercent"
kind = "number"
min = -50.0
max = 200.0
hook = "stats"
summary = "percent added to every stat of the side's players on the pitch (match stats, from their base)"

[[team]]
name = "TensionPerSecond"
kind = "number"
min = 0.0
max = 50.0
hook = "tension"
summary = "tension points (HUD units) the side gains every second of play"

[[team]]
name = "KeeperTpReserve"
kind = "number"
min = 0.0
max = 300.0
hook = "keeper_reserve"
summary = "tension kept for the side's keeper (the game keeps 20 for one side only)"

[[team]]
name = "StrategyLevel"
kind = "number"
min = 1.0
max = 9.0
hook = "strategy_level"
summary = "the AI level the side's strategy and player tactic gates read (enableLv of strategy_ai_config / tactics_ai_config, 1-4 in retail): the side plays every strategy up to that level; its class loads keep the match row's level"

[[team]]
name = "ZoneShootNow"
kind = "table"
keys = ["replan_s", "elapsed_s", "direct"]
min = 0.0
max = 30.0
hook = "zone"
summary = "in the side's own shoot zone: the shot lock is lifted every frame, the team re-plans every `replan_s` seconds, its strategy conditions read the zone as at least `elapsed_s` seconds old (the shot / chain strategies gated by the zone's age hold at once) and, with `direct` = 1, a direct shot as needed"

[[team]]
name = "FocusHurry"
kind = "table"
keys = ["scale", "force_at"]
min = 0.0
max = 10.0
hook = "conditions"
summary = "as the duel's attacker the side's strategy conditions read the duel's elapsed time rate x `scale`, and 1 (the time is up) from `force_at`: it breaks through or passes out before the time runs out"

[[team]]
name = "StaminaResource"
kind = "text"
hook = "stamina"
summary = "the match resource that is a player's stamina (a `<mod>.<key>` of a mod's match_resources, e.g. Stamina Points' PE)"

[[team]]
name = "SprintByStamina"
kind = "table"
keys = ["above", "below", "rate", "attack_rate"]
min = 0.0
max = 1.0
hook = "stamina"
summary = "per player: sprint rate `rate` (dash attack `attack_rate`) while his stamina ratio is above `above`, 0 below `below`, in between linear"

[[team]]
name = "SubstituteAtStamina"
kind = "number"
min = 0.0
max = 1.0
hook = "substitution"
summary = "at a dead ball the side substitutes its outfield player whose stamina ratio is below this (the most tired one)"

[[team]]
name = "BestMoveChance"
kind = "number"
min = 0.0
max = 1.0
hook = "move_choice"
summary = "chance that a move choice takes the best move of the slots (power, element, tension) instead of the game's pick"

[[team]]
name = "ElementCounter"
kind = "bool"
hook = "move_choice"
summary = "a move choice always takes a move whose element beats the other side's (its committed move, else the one it is expected to use) when one is usable"

[[team]]
name = "MoveCostWeight"
kind = "number"
min = 0.0
max = 2.0
hook = "move_choice"
summary = "best move = power / cost ^ weight (0 = the strongest, 1 = the most power per tension point)"

[[team]]
name = "PowerAware"
kind = "table"
keys = ["margin", "save_tension", "force", "keeper_free_save", "keeper", "blocks", "shots", "duels"]
min = 0.0
max = 10.0
hook = "move_choice"
summary = "the side computes the power of every option of both players (stats, move power with the mod rules, element wheel, the shot's power in flight, [power]) and picks the cheapest one that wins: its power >= the other side's x `margin`; in a duel the best chance of the [power] duel table. Keeper (`keeper` = 1): against the shot in flight. Shot block (`blocks` = 1): a counter shot that returns the shot, else a block move that stops it or weakens it enough for its keeper. Shot (`shots` = 1): a shot the other keeper cannot stop with his best affordable option. Duel (`duels` = 1): against the other side's committed move, else his strongest affordable one. `save_tension` = 1: no move when no option wins. `force` = 1: a picked keeper / block / shot move skips the game's use-rate roll. `keeper_free_save` = 1: the keeper reads the rolls made at the kick: a «parada» (critical catch) saves without a move, a «brecha» (force-win shot) cannot be stopped: no move in both"

[[team]]
name = "LearnUserMoves"
kind = "bool"
hook = "learning"
summary = "the side remembers the elements of the moves the other side used this match, per category, and expects the most used one"

[[team]]
name = "AuraElementCounter"
kind = "bool"
hook = "aura_choice"
summary = "an aura choice takes the aura whose element beats most of the other side's players on the pitch"

[[team]]
name = "KeeperBarSource"
kind = "text"
hook = "conditions"
summary = "what the condition opponent_keeper_bar_above reads: keeper_hp (the scoreboard keeper bar) or a match resource key"

[[team]]
name = "PassLaneCut"
kind = "table"
keys = ["receivers", "at", "seconds", "range_m"]
min = 0.0
max = 60.0
hook = "pass_lane_cut"
summary = "when the other side presses a pass command, its `receivers` teammates nearest to the passer (within `range_m`) are the likely receivers: for each lane the nearest free player of this side moves to the point `at` (0-1) along it for `seconds`"

[[team]]
name = "SubstituteForElement"
kind = "table"
keys = ["after_s", "max"]
min = 0.0
max = 10000.0
hook = "substitution"
summary = "at a dead ball (and at half-time) without a tired change, a bench forward whose element beats the other side's keeper comes on for the side's forward on the pitch without that advantage (the most tired, else the weakest shooter); never before `after_s` game seconds of the first half (default 600), at most `max` such changes per match (default 2); the game's own limits stand (bench players not subbed off before, the change list)"

[[team]]
name = "PressCarrier"
kind = "table"
keys = ["forwards", "midfielders", "defenders", "range_m", "max", "speed_mult"]
min = 0.0
max = 100.0
hook = "press_carrier"
summary = "in play, while the other side holds the ball, the side's players of the chosen roles (`forwards` default 1, `midfielders` / `defenders` default 0; 1 = on) nearest to the ball carrier, within `range_m` (default 30) and at most `max` (default 3), take the carrier as the target of their move action (the catalogue's [passing] move_actions) and run at `speed_mult` (default 1; a move_speed match modifier of the rule engine) while they chase him"

[[team]]
name = "PassBeforeShot"
kind = "table"
keys = ["margin", "max_passes", "max_hold_s", "free_m", "range_m", "goal_half_m"]
min = 0.0
max = 100.0
hook = "pass_before_shot"
summary = "carrying the ball in its own zone, the side scores the shot of the carrier and of each teammate on the pitch within `range_m` (default 30): the goal's opening angle from him (`goal_half_m` = half the goal width, default 3.75) x the element against the other keeper (the [elements] advantage, or its inverse) x his best shot power against the keeper's best answer (the PowerAware computation) x how free he is (nearest rival / `free_m`, default 3, at least 0.3). While a teammate's score is at least the carrier's x `margin` (default 1.25), the carrier holds the shot (the zone shot lock) and its pass rates are 1, at most `max_hold_s` (default 1.5) per carrier; at most `max_passes` (default 1) passes per zone; else it shoots. The receiver is the game's pass choice"

[[team]]
name = "ZoneWallGuards"
kind = "table"
keys = ["extra", "from_m", "spacing_m", "range_m"]
min = 0.0
max = 50.0
hook = "zone_wall_guards"
summary = "in the other side's shoot zone, besides the game's two walls (a fixed 2-slot array), `extra` (default 2, at most 8) outfield players of the side that are not standing as walls take points on the line from the shooter to the goal, from `from_m` (default 3) every `spacing_m` (default 2.5), the nearest free player within `range_m` (default 25) per point, as the target of their move action ([passing] move_actions): blockers in the shot's path. Positioning only: a player on the path gets the game's own shot block"

[[team]]
name = "FocusRetreat"
kind = "table"
keys = ["back", "lateral"]
min = 0.0
max = 5.0
hook = "focus_retreat"
summary = "the side's ball carrier in a duel never moves toward the defender: the part of each duel move (RequestFocusAction kind 3) toward the nearest rival is turned backward x `back` (default 1), the sideways part kept x `lateral` (default 1); side steps, breakthroughs and pass-outs are left to the game (that is how it breaks out by a side)"

[[team]]
name = "PassSpeed"
kind = "number"
min = 0.5
max = 3.0
hook = "pass_speed"
summary = "the side's passes (a kick whose receiver is a teammate) reach the receiver this x sooner: the kick's arrival time / PassSpeed, its ground speed covers the distance in that time and its vertical speed / PassSpeed (a flatter lob that lands in that time); the target moves along the receiver's run (the part of the way he covers in the new time), so the ball never gets there before him. Shots, clearances and dribbles are not passes; 1 = the game's passes"

# ------------------------------------------------------------------------------------------------ situations

[[condition]]
name = "opponent_keeper_bar_above"
min = 0.0
max = 1.0
summary = "the other side's keeper bar (KeeperBarSource) is above Value (a ratio)"

[[condition]]
name = "opponent_ball_owner_stamina_below"
min = 0.0
max = 1.0
summary = "the other side holds the ball and its owner's stamina ratio (StaminaResource) is below Value"

[[condition]]
name = "opponent_received_pass_within"
min = 0.0
max = 30.0
summary = "a player of the other side received a pass from a teammate less than Value seconds ago (he still holds the ball)"

[[condition]]
name = "own_zone"
summary = "the side's own shoot zone is running"

# ------------------------------------------------------------------------------------------------ passing

# PassLaneCut: the pass commands watched (input_ctrl names) and the AI actions that move a player to his target
# (executor 0 = move to the record's target position: `0x14664F0`, docs/game/engine/match-ai.md §9.5).
[passing]
commands = ["CMD_PASS_01"]
move_actions = [0]

# The AI move override of the mods' scripts (VRFW.ai.move, docs/framework/ai-move.md): a player with an order gets his
# target in the executor output (whatever action the game chose), run as chase_action when he chases a player (15 =
# the game's press: he keeps running into the target) or move_action when he goes to a point (0 = move to the target),
# and the dash type whose engine status is his sprint (TeamDashStart's status table: 1 = dash, 2 = dash attack).
[ai_move]
chase_action = 15
move_action = 0
sprint_dash_type = 1

[[condition]]
name = "opponent_duel_side_bias_above"
min = 0.5
max = 1.0
summary = "the other side's duel side steps / angled breakthroughs go to one side (of its attack) more than Value of the time (LearnUserMoves)"

[[condition]]
name = "opponent_duel_pass_out_above"
min = 0.0
max = 1.0
summary = "the other side passes out of a duel more than Value of its duel actions (LearnUserMoves)"

[[condition]]
name = "opponent_passes_often"
min = 0.0
max = 1.0
summary = "more than Value of the other side's possessions end in a pass to a teammate (LearnUserMoves)"

[[condition]]
name = "opponent_dribbles_often"
min = 0.0
max = 1.0
summary = "more than Value of the other side's possessions end otherwise (carried on, lost, shot) (LearnUserMoves)"

# LearnUserMoves: samples a tendency needs before its situation can hold
[learning]
min_samples = 4

# ------------------------------------------------------------------------------------------------ power

# PowerAware: the battle values besides the stat and move parts (game_param, retail values; a mod that changes these
# game_param members changes them here too). Formula: docs/framework/match-ai.md §4b.
[power]
counter_shot_power_rate = 0.5
counter_shot_tension_rate = 2.0
shot_block_basic_rate = 0.1
keeper_level_rate = 0.01
# skillBattleWinPercent: [stronger / weaker <= ratio, the stronger side's chance]; beyond the last row it always wins
duel_win_table = [[1.2, 0.5], [1.5, 0.6]]

# ------------------------------------------------------------------------------------------------ the element wheel

# Elements of the game (ids of the unit and move records); a beats b. Factors of the battle code
# (Technique.ElementAdvantage 0x1671320: 1.2 at 0x1E62F5C; own element 1.2 at 0x1E62F60).
[elements]
advantage = 1.2
own_element = 1.2
# [own move category, the category the other side answers with]: 1 shot, 2 dribble, 3 block, 4 keeper
answers = [[1, 4], [2, 3], [3, 2], [4, 1]]

[[element]]
id = 1
name = "wind"
beats = 4

[[element]]
id = 2
name = "forest"
beats = 1

[[element]]
id = 3
name = "fire"
beats = 2

[[element]]
id = 4
name = "mountain"
beats = 3

[[element]]
id = 5
name = "void"

