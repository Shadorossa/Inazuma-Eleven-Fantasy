schema = "VRFW.rule_catalog/1"
# The match AI knob catalogue (docs/framework/match-ai.md): every value a `VRFW.match_ai/1` profile (content\rules\ai\*.toml),
# the behaviour sink `ai_rate` and a challenge's `keepaway_ai` may name. Built into the framework
# (match_engine::match_ai::KNOBS_TOML); a new lever = a new entry here (+ its code for `[[team]]` keys).
#
# [[knob]]: a game value.
#   name      the member name (game_param / soccer_ai_property spelling)
#   where     property        = a member of every player's AI property object ([0x21F6908] + 0x1D28 + index x 0x200),
#                               one value per player (written for one side only)
#             ai_global       = CSoccerAIGlobalParam (.data), one value for both teams
#             strategy_global = SoccerStrategyGlobalParam (.data), one value for both teams
#             team_ai         = a field of the team's TeamAI block, written before that team's AI pass
#             shared          = a game value the scene code reads for both teams: one value for the match
#             Global values are written per team: the side's value while that team's AI runs (AIManager_Update's
#             TeamAIUpdate call), the game's value outside the AI pass (or the common value when both sides agree).
#   offset    property: the member's offset in the object; team_ai: the field's offset in the TeamAI block
#   rva       globals: the member's RVA (reference build v7.1.2); written only while memory holds `retail`
#   type      f32 | u32 (globals: the encoding is taken from memory when it holds the retail value)
#   retail    globals: the game's value (checked before every first write)
#   min, max  the range a profile value is clamped to
#   rate_kinds  property: the GetAIRate kinds that read this member (Ai.GetRate 0x1485B30, the per-player rate the
#             positioning and target code asks); a match role (VRFW.match_role/1) changes the member where they read it
#   verified  true = offset read in the game's code (the property class registration 0xA1260, command handlers,
#             readers); false = inferred (docs/game/engine/match-ai.md §3.6)
#
# [[team]]: a per-team behaviour of the run time (`[VRFW.MatchAI.Team]`); `kind` number | bool | range | table,
#   `keys` the table's keys, `hook` the mechanism that applies it (documentation and the boot log).
#
# [[class]]: the game's property classes a profile may load (`Level` / `Personality` / `Class.Inherit`).
# [[condition]]: the situations of `[[VRFW.MatchAI.If]]`; [elements] / [[element]]: the element wheel of the move choice.

