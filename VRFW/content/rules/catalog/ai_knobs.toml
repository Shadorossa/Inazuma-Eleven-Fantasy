# The strategy / team tactics re-plan intervals: the per-team AI tick copies fStrategyUpdateIntervalTime /
# fTeamTacticsUpdateIntervalTime here every frame; StrategyUpdate compares its timers with these copies.

[[knob]]
name = "teamStrategyUpdateInterval"
where = "team_ai"
offset = 0x123F0
type = "f32"
retail = 2.0
min = 0.0
max = 10.0
verified = true
summary = "seconds between two strategy choices of the team"

[[knob]]
name = "teamTacticsUpdateInterval"
where = "team_ai"
offset = 0x123F4
type = "f32"
retail = 5.0
min = 0.0
max = 30.0
verified = true
summary = "seconds between two team tactic choices"

# ------------------------------------------------------------------------------------------------ shared (both teams)

# GameScaleGlobalParam: read by the scene code for both teams (never per team).

[[knob]]
name = "canDefenseActionLen2"
where = "shared"
rva = 0x22AFDC0
type = "f32"
retail = 25.0
min = 0.0
max = 400.0
verified = false
summary = "squared distance (m2) from the ball owner at which a defender's action is possible (25 = 5 m)"

