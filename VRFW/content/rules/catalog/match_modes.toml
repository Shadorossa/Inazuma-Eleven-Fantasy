schema = "VRFW.rule_catalog/1"
# Maps a match's engine fields to the mode key used by `[modes]` in a mod's rules/bindings.toml.
# `type` = match info type (1 full, 2 small, 3 training, 4 dribble); `play_mode` = game play mode (1 VS / friendlies, 2 and 6 story, 3 Kizuna town, 4 Chronicle, 5 Victory Road).
# Key list: default, default + small_suffix, each [[match_mode]] (and its small variant) in file order, then training.

[match_modes]
# Mode for a play mode not listed below (or unreadable): VS CPU, friendlies, free matches
default = "free"
# Match types that get `<key><small_suffix>` (small friendlies and story matches)
small_types = [2]
small_suffix = "_small"
# Match types treated as training whatever the play mode
training = "training"
training_types = [3, 4]

[[match_mode]]
key = "story"
play_mode = [2, 6]

[[match_mode]]
key = "chronicle"
play_mode = [4]

[[match_mode]]
key = "kizuna"
play_mode = [3]

[[match_mode]]
key = "victory_road"
play_mode = [5]
