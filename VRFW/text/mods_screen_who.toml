schema = "vr_framework.text_key/1"
# Texts of «¿Quién lo toca?», the conflict explorer of a mod page's «Conflictos» view (Phase H,
# docs/framework/troubleshooting.md): the same explorer as `vrfw who` (vr_core::diagnose::who_in, CMND_VRFW_REPORT_WHO).
# Format of text.toml; the plugin merges every text_*.toml after text.toml (mods_menu::load_texts).
# who_hint follows the R3 glyph. Placeholders: {n} load position, {w} mod, {i} id.

[en.new]
who_hint = "Who touches its id (or click a conflict)"
who_title = "Who touches it?"
who_help = "Every mod that touches this id, in load order. The last one that defines or edits it wins. Type another id in the search box."
who_order = "load order {n}"
who_not_loaded = "not loaded"
who_report = "This start's report"
who_winner = "Wins: {w} (it loads last among the mods that define or edit it)."
who_no_winner = "Only references: no mod defines or edits it."
who_nobody = "No mod touches {i}."
who_empty = "Type an id (character, technique, telop, file...) in the search box."
who_kind_defines = "Defines or edits it"
who_kind_refers = "Only refers to it"
who_kind_report = "Entry of the report"

[es.new]
who_hint = "Quién toca su id (o haz clic en un conflicto)"
who_title = "¿Quién lo toca?"
who_help = "Cada mod que toca este id, en orden de carga. Gana el último que lo define o edita. Escribe otro id en el buscador."
who_order = "orden de carga {n}"
who_not_loaded = "no cargado"
who_report = "Informe de este arranque"
who_winner = "Gana: {w} (carga el último de los mods que lo definen o editan)."
who_no_winner = "Solo referencias: ningún mod lo define ni lo edita."
who_nobody = "Ningún mod toca {i}."
who_empty = "Escribe un id (personaje, técnica, rótulo, archivo...) en el buscador."
who_kind_defines = "Lo define o lo edita"
who_kind_refers = "Solo lo menciona"
who_kind_report = "Entrada del informe"

[fr.new]
who_hint = "Qui touche son id (ou clique sur un conflit)"
who_title = "Qui le touche ?"
who_help = "Chaque mod qui touche cet id, dans l'ordre de chargement. Le dernier qui le définit ou le modifie l'emporte. Tape un autre id dans la recherche."
who_order = "ordre de chargement {n}"
who_not_loaded = "non chargé"
who_report = "Rapport de ce démarrage"
