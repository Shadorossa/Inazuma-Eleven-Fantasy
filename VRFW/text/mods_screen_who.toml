who_no_winner = "Seulement des références : aucun mod ne le définit ni le modifie."
who_nobody = "Aucun mod ne touche {i}."
who_empty = "Tape un id (personnage, technique, bandeau, fichier...) dans la recherche."
who_kind_defines = "Le définit ou le modifie"
who_kind_refers = "Le mentionne seulement"
who_kind_report = "Entrée du rapport"

[de.new]
who_hint = "Wer ihre ID ändert (oder Klick auf einen Konflikt)"
who_title = "Wer ändert es?"
who_help = "Jeder Mod, der diese ID berührt, in Ladereihenfolge. Es gewinnt der letzte, der sie definiert oder bearbeitet. Gib im Suchfeld eine andere ID ein."
