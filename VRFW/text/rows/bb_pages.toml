# Texts of the VR-Framework's Bahía Batalla pages (graft vrfw_bb_pages, docs/framework/bb-pages.md): the page
# label, the names of the framework's categories (defaults\team.toml [bb_pages] category) and of the seasons it
# derives from the game's series ([bb_pages.seasons], vrfw_bb_season_<type>). menu_text rows in the framework's 9
# languages; the Lua reads them with CMND_TEXT_GET by id = crc32(row id) and shows nothing for a missing row. A mod
# that adds a series / category ships the rows its declaration names.

schema = "vr_framework.text/2"
table = "menu_text"

# the page label of the page plate «<L1> Pág. 1/3 <R1>»: the abbreviated word «page»; crc32("vrfw_bb_page") = 80343219
[[row]]
id = "vrfw_bb_page"
es = "Pág."
en = "Pg."
fr = "P."
de = "S."
it = "Pag."
pt = "Pág."
ja = "P."
zh_hans = "页"
zh_hant = "頁"

# category «main teams» (rule game: the game's own BB teams); crc32("vrfw_bb_cat_main") = 2224623876
[[row]]
id = "vrfw_bb_cat_main"
es = "Equipos principales"
en = "Main Teams"
fr = "Équipes principales"
de = "Hauptteams"
it = "Squadre principali"
pt = "Equipes principais"
ja = "メインチーム"
zh_hans = "主要球队"
zh_hant = "主要球隊"

# category «secondary teams» (id secondary, alias chain; rule chain: teams of a match chain, their BB copies, the teams based on one, and the teams that name it); crc32("vrfw_bb_cat_secondary") = 382565990
