# Match challenge texts (`[[VRFW.MatchChallenge]]`): menu_text rows in the 9 framework languages, read by the match challenge menu part via CMND_TEXT_GET (id = crc32(row id)).
# The challenge's own title / description are the declaring mod's rows; %s / %d are filled by string.format. A refusal message is: head, mod description, 'refused', one line per failed condition, 'offenders'.

schema = "VRFW.text/2"
table = "menu_text"

# the message's first line and the guide line of a match with a challenge (the mod's title)
[[row]]
id = "vrfw_mc_head"
es = "Desafío: %s"
en = "Challenge: %s"
fr = "Défi : %s"
de = "Herausforderung: %s"
it = "Sfida: %s"
pt = "Desafio: %s"
ja = "チャレンジ：%s"
zh_hans = "挑战：%s"
zh_hant = "挑戰：%s"

[[row]]
id = "vrfw_mc_refused"
es = "Tu equipo no cumple el desafío:"
en = "Your team does not meet the challenge:"
fr = "Ton équipe ne remplit pas le défi :"
de = "Dein Team erfüllt die Herausforderung nicht:"
it = "La tua squadra non rispetta la sfida:"
pt = "A tua equipa não cumpre o desafio:"
ja = "チームがチャレンジの条件を満たしていません："
zh_hans = "你的队伍不符合挑战条件："
zh_hant = "你的隊伍不符合挑戰條件："

# after 'refused' when only the starters count
