# Texts of the VR-Framework's contact map screen (vrfw_contact_map_menu, docs/framework/contact-map.md): rows of
# menu_text in the framework's 9 languages, read by the screen with CMND_TEXT_GET by id = crc32(row id). Map / zone
# titles, item names and character names come from the mods' declarations and the game's tables, not from here.
# %s / %d are filled by the script (string.format).

schema = "VRFW.text/2"
table = "menu_text"

# the button guide of the item shelf (pad X / keyboard FUNC2)
[[row]]
id = "vrfw_cm_shop_btn"
es = "Objetos"
en = "Items"
fr = "Objets"
de = "Gegenstände"
it = "Oggetti"
pt = "Objetos"
ja = "アイテム"
zh_hans = "道具"
zh_hant = "道具"

