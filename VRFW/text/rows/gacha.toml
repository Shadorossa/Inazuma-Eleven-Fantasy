en = "Spin the gacha"
fr = "Lancer le gacha"
de = "Gacha drehen"
it = "Gira il gacha"
pt = "Girar o gacha"
ja = "ガチャを回す"
zh_hans = "转扭蛋"
zh_hant = "轉扭蛋"

