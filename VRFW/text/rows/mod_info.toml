# The VR-Framework's own name and description on the «Mods» screen, in the game's language: rows of menu_text
# with id = crc32("vr_framework.mod_name") / crc32("vr_framework.mod_description") (the keys the screen asks for:
# docs/framework/mods-panel.md §3.2). The framework's root text.toml is not read (its parts own their namespaces),
# so its keys live here as rows.

schema = "vr_framework.text/2"
table = "menu_text"

[[row]]
id = "vr_framework.mod_name"
en = "VRFW"
es = "VRFW"
fr = "VRFW"
de = "VRFW"
