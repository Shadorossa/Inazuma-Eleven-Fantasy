[[row]]
id = "vr_framework.mod_description"
en = "The base of the VR ModLoader's mods, in one mod: characters and teams declared by mods and their rarity (chara), mod texts in 9 languages (text), the save slots (the slot screen before the game starts), per-mod save data tied to the slot and the mods' save flags (save), global game rules declared by mods: parameters (game_param and the other property tables), controls and buttons (system), mod audio and voice packs (audio), match rulesets (match), special move animations (anim), row changes in any game table (tables), game modes declared by mods (modes), special move name banners, the «Mod options» tab and the title menu's «Mods» screen (graphics). One plugin (vr_framework.dll); each part can be switched off in config.toml. Needed by the mods that use any of its parts."
es = "La base de los mods del VR ModLoader, en un solo mod: personajes y equipos declarados por los mods y su rareza (chara), textos de los mods en 9 idiomas (text), las ranuras de guardado (la pantalla de ranuras antes de empezar la partida), datos guardados por mod ligados a la ranura y las banderas de guardado de los mods (save), reglas globales del juego declaradas por los mods: parámetros (game_param y demás tablas property), controles y botones (system), audio de los mods y packs de voces (audio), reglamentos de partido (match), animaciones de supertécnicas (anim), cambios por filas en cualquier tabla del juego (tables), modos de juego declarados por los mods (modes), rótulos de supertécnicas, la pestaña «Opciones de mods» y la pantalla «Mods» del menú de título (graphics). Un solo plugin (vr_framework.dll); cada parte se puede apagar en config.toml. Lo necesitan los mods que usan cualquiera de sus partes."
fr = "La base des mods du VR ModLoader, en un seul mod : personnages et équipes déclarés par les mods et leur rareté (chara), textes des mods en 9 langues (text), les emplacements de sauvegarde (l'écran des emplacements avant de commencer la partie), données sauvegardées par mod liées à l'emplacement et les drapeaux de sauvegarde des mods (save), règles globales du jeu déclarées par les mods : paramètres (game_param et les autres tables property), commandes et boutons (system), audio des mods et packs de voix (audio), règlements de match (match), animations de techniques spéciales (anim), changements par lignes dans n'importe quelle table du jeu (tables), modes de jeu déclarés par les mods (modes), bandeaux de noms de techniques spéciales, l'onglet « Options des mods » et l'écran « Mods » du menu titre (graphics). Un seul plugin (vr_framework.dll) ; chaque partie peut être désactivée dans config.toml. Nécessaire aux mods qui utilisent l'une de ses parties."
de = "Die Grundlage der Mods des VR ModLoader, in einem einzigen Mod: von Mods deklarierte Figuren und Teams und ihre Seltenheit (chara), Mod-Texte in 9 Sprachen (text), die Speicherplätze (der Bildschirm der Speicherplätze vor dem Spielstart), pro Mod gespeicherte Daten, an den Speicherplatz gebunden, und die Speicher-Flags der Mods (save), von Mods deklarierte globale Spielregeln: Parameter (game_param und die übrigen property-Tabellen), Steuerung und Tasten (system), Audio der Mods und Sprachpakete (audio), Spielregelwerke (match), Animationen von Spezialtechniken (anim), zeilenweise Änderungen in jeder Spieltabelle (tables), von Mods deklarierte Spielmodi (modes), Namensbanner von Spezialtechniken, der Reiter „Mod-Optionen“ und der „Mods“-Bildschirm des Titelmenüs (graphics). Ein einziges Plugin (vr_framework.dll); jeder Teil lässt sich in config.toml abschalten. Benötigt von den Mods, die einen seiner Teile nutzen."
it = "La base delle mod del VR ModLoader, in una sola mod: personaggi e squadre dichiarati dalle mod e la loro rarità (chara), testi delle mod in 9 lingue (text), gli slot di salvataggio (la schermata degli slot prima di iniziare la partita), dati salvati per mod legati allo slot e i flag di salvataggio delle mod (save), regole globali del gioco dichiarate dalle mod: parametri (game_param e le altre tabelle property), controlli e pulsanti (system), audio delle mod e pacchetti di voci (audio), regolamenti delle partite (match), animazioni delle tecniche speciali (anim), modifiche per righe in qualsiasi tabella del gioco (tables), modalità di gioco dichiarate dalle mod (modes), scritte dei nomi delle tecniche speciali, la scheda «Opzioni delle mod» e la schermata «Mods» del menu del titolo (graphics). Un solo plugin (vr_framework.dll); ogni parte si può disattivare in config.toml. Serve alle mod che usano una qualsiasi delle sue parti."
pt = "A base dos mods do VR ModLoader, num único mod: personagens e times declarados pelos mods e a sua raridade (chara), textos dos mods em 9 idiomas (text), os espaços de salvamento (a tela de espaços antes de começar o jogo), dados salvos por mod ligados ao espaço e as marcações de salvamento dos mods (save), regras globais do jogo declaradas pelos mods: parâmetros (game_param e as demais tabelas property), controles e botões (system), áudio dos mods e pacotes de vozes (audio), regulamentos de partida (match), animações de técnicas especiais (anim), mudanças por linhas em qualquer tabela do jogo (tables), modos de jogo declarados pelos mods (modes), letreiros de nomes de técnicas especiais, a aba «Opções de mods» e a tela «Mods» do menu de título (graphics). Um único plugin (vr_framework.dll); cada parte pode ser desligada em config.toml. Necessário para os mods que usam qualquer uma das suas partes."
ja = "VR ModLoader のMODの土台を1つのMODにまとめたもの：MODが定義するキャラクターとチーム、そのレアリティ（chara）、9言語のMODテキスト（text）、セーブスロット（ゲーム開始前のスロット画面）、スロットに結びついたMODごとのセーブデータとMODのセーブフラグ（save）、MODが定義するゲーム全体のルール：パラメータ（game_param などの property テーブル）、操作とボタン（system）、MODの音声とボイスパック（audio）、試合のレギュレーション（match）、必殺技のアニメーション（anim）、ゲームの任意のテーブルの行単位の変更（tables）、MODが定義するゲームモード（modes）、必殺技名のテロップ、「MODオプション」タブとタイトルメニューの「Mods」画面（graphics）。プラグインは1つ（vr_framework.dll）で、各パートは config.toml でオフにできます。いずれかのパートを使うMODに必要です。"
zh_hans = "VR ModLoader 模组的基础，合为一个模组：模组声明的角色和队伍及其稀有度（chara），9种语言的模组文本（text），存档栏位（开始游戏前的栏位画面）、与栏位绑定的各模组存档数据和模组的存档标记（save），模组声明的全局游戏规则：参数（game_param 及其他 property 表）、操作和按键（system），模组音频和语音包（audio），比赛规则（match），必杀技动画（anim），对游戏任意表格的逐行修改（tables），模组声明的游戏模式（modes），必杀技名称字幕、“模组选项”标签页以及标题菜单的“Mods”画面（graphics）。只有一个插件（vr_framework.dll）；每个部分都可以在 config.toml 中关闭。使用其任一部分的模组都需要它。"
zh_hant = "VR ModLoader 模組的基礎，合為一個模組：模組宣告的角色和隊伍及其稀有度（chara），9種語言的模組文字（text），存檔欄位（開始遊戲前的欄位畫面）、與欄位綁定的各模組存檔資料和模組的存檔標記（save），模組宣告的全域遊戲規則：參數（game_param 及其他 property 表）、操作和按鍵（system），模組音訊和語音包（audio），比賽規則（match），必殺技動畫（anim），對遊戲任何表格的逐行修改（tables），模組宣告的遊戲模式（modes），必殺技名稱字幕、「模組選項」分頁以及標題選單的「Mods」畫面（graphics）。只有一個外掛（vr_framework.dll）；每個部分都可以在 config.toml 中關閉。使用其任一部分的模組都需要它。"
