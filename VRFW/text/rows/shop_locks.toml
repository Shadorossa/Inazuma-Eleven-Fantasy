# Locked shop rows (scripts\shop_rows.lua, assets\lua\menu\shop_menu_buy\130_shop_locks.lua): what a locked row waits for, read with CMND_TEXT_GET by id = crc32(row id).
# <NUM> = a chapter, <NAME> = a title or a team named from the game's own texts, <TEXT> = the row's sentence.

schema = "VRFW.text/2"
table = "menu_text"

# a story chapter with its title: <NUM> = the chapter, <NAME> = its title
[[row]]
id = "vrfw_shop_lock_chapter_title"
es = "Se desbloquea en el capítulo <NUM>: «<NAME>»"
en = "Unlocks in Chapter <NUM>: “<NAME>”"
fr = "Se débloque au chapitre <NUM> : « <NAME> »"
de = "Wird in Kapitel <NUM> („<NAME>“) freigeschaltet"
it = "Si sblocca nel capitolo <NUM>: “<NAME>”"
pt = "Desbloqueia no capítulo <NUM>: “<NAME>”"
ja = "第<NUM>章「<NAME>」で解放"
zh_hans = "第<NUM>章“<NAME>”中解锁"
zh_hant = "第<NUM>章「<NAME>」中解鎖"

