# Texts of the VR-Framework's chain board screen (vrfw_chain_board_menu, docs/framework/chain-board.md): rows of
# menu_text in the framework's 9 languages, read by the screen's script with CMND_TEXT_GET by id = crc32(row id).
# The chain's / pages' titles, the rival names and levels come from the declarations (team type), not from here.
# %s / %d are filled by the script (string.format).

schema = "vr_framework.text/2"
table = "menu_text"

