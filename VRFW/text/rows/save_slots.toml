# the story-complete start's question after «Nueva partida» on an empty slot (yes = the slot starts with the Victory
# Road story completed, docs/game/modes/story-complete-start.md; one short line per item: the popup does not wrap);
# crc32("evt_slot_story_ask") = 40002370
[[row]]
id = "evt_slot_story_ask"
es = "¿Te has pasado la historia de Victory Road?\n・Historia completada (Nv. 50).\n・Logros de historia completados.\n・Los 15 jugadores opcionales de la selección.\nTodo lo demás empieza de cero."
en = "Have you already finished the Victory Road story?\n・Story completed (Lv. 50).\n・Story achievements completed.\n・The 15 optional national team players.\nEverything else starts from zero."
fr = "As-tu déjà terminé l'histoire de Victory Road ?\n・Histoire terminée (Nv 50).\n・Succès de l'histoire obtenus.\n・Les 15 joueurs optionnels de la sélection.\nTout le reste repart de zéro."
de = "Hast du die Geschichte von Victory Road schon abgeschlossen?\n・Geschichte abgeschlossen (Lv. 50).\n・Story-Erfolge freigeschaltet.\n・Die 15 optionalen Spieler der Auswahl.\nAlles andere beginnt bei null."
it = "Hai già completato la storia di Victory Road?\n・Storia completata (Lv. 50).\n・Obiettivi della storia completati.\n・I 15 giocatori opzionali della selezione.\nTutto il resto parte da zero."
pt = "Já terminaste a história de Victory Road?\n・História concluída (Nv. 50).\n・Conquistas da história concluídas.\n・Os 15 jogadores opcionais da seleção.\nTudo o resto começa do zero."
ja = "『ビクトリーロード』のストーリーはクリア済みですか？\n・ストーリークリア（Lv.50）\n・ストーリーのアチーブメント達成\n・代表チームの任意加入選手15人\nそれ以外はゼロからのスタートです。"
zh_hans = "你已经通关《Victory Road》的故事了吗？\n・故事已通关（Lv.50）\n・故事成就已达成\n・国家队的15名可选球员\n其他内容都从零开始。"
zh_hant = "你已經通關《Victory Road》的故事了嗎？\n・故事已通關（Lv.50）\n・故事成就已達成\n・國家隊的15名可選球員\n其他內容都從零開始。"
