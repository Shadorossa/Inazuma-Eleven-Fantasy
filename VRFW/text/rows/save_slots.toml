# Texts of the VR-Framework's save slot screen (evt_save_slot_menu, graft save_slots, mod vr_framework) and of the
# slot switch on the title screen (save_slots_inc): rows of menu_text in the framework's 9 languages. The scripts
# read them with CMND_TEXT_GET by id = crc32(row id) (the ids are written next to each row and in the scripts'
# TXT_ID tables); a missing row falls back to the English literal in the script. Placeholders are Lua
# string.format ones (%d, %s), in the same order in every language.

schema = "VRFW.text/2"
table = "menu_text"

