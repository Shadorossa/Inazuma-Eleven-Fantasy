schema = "vr_framework.text_key/1"
# Texts of the match part (format of the text engine: research/mods/text_engine/README.md); new texts get the id
# crc32("match_engine.<name>"): the part's name and description for the «Mods» screen, in the game's language.
# A language missing here falls back to English.
default_lang = "en"

[en.new]
# ruleset_<id>: the name of the ruleset <id> on the Mods screen (rules editor), in the game language
ruleset_chronicle = "Chronicle (original)"
ruleset_free_match = "Free match (original)"
ruleset_friendly_5v5 = "5-a-side friendly (original)"
ruleset_kizuna = "Bond Town (original)"
ruleset_story = "Story (original)"
ruleset_test_cup = "Test: cup (extra time, golden goal and penalties)"
ruleset_test_et_pens = "Test: extra time + penalties"
ruleset_test_first_goal = "Test: the first goal wins"
ruleset_test_golden = "Test: golden goal after a draw"
ruleset_test_pens = "Test: straight to penalties"
ruleset_test_shootout_only = "Test: penalties only"
ruleset_training = "Training (original)"
ruleset_victory_road = "Victory Road (original)"
mod_name = "Match engine"
mod_description = "Match engine: the rules of every offline match (length, halves, players on the pitch, ExRule, extra time, golden goal, penalty shoot-out) come from a ruleset. The base rulesets reproduce the original game; other mods add rulesets in their rules/ folder and assign them by mode, match or rival team. Each half lasts 30' (the «Half length» option was removed in 1.2.1). A part of VR-Framework."
# break_*: the half-time screen before a period of the ruleset's end phases (soccer_half_time_menu, VRFW
# assets/lua/menu/soccer_half_time_menu/300_match_break.lua via CMND_VRFW_RULE_ENGINE_BREAK): its title and its
# kick-off button; the game only has «HALF TIME» / «2ND HALF KICK-OFF»
break_title_extra_time = "EXTRA TIME"
break_title_extra_time_half = "EXTRA TIME - HALF TIME"
break_title_golden_goal = "GOLDEN GOAL"
break_title_penalties = "PENALTY SHOOT-OUT"
break_btn_extra_time_1 = "<CMD_ENTER> EXTRA TIME KICK-OFF"
break_btn_extra_time_2 = "<CMD_ENTER> 2ND HALF OF EXTRA TIME KICK-OFF"
break_btn_golden_goal = "<CMD_ENTER> GOLDEN GOAL KICK-OFF"
break_btn_penalties = "<CMD_ENTER> START THE SHOOT-OUT"

