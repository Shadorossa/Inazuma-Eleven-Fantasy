schema = "vr_framework.text_key/1"
# Texts of the «Mods» screen and its title button (text_engine format). The mods_menu plugin hands them to the Lua
# (CMND_VRFW_MM_TEXT, English when a language lacks one). The three button-guide labels (g_*) are also merged into
# menu_text by text_engine when it is installed (ids crc32("mods_menu.<name>")); without it the guide falls back to the
# game's «Aceptar». Placeholders: {a} author, {r} list / reason, {c} list / version rule, {n} number, {t} total,
# {o} other mod, {v} version, {p} profile.

