# Item transformations, UI side. Always on: it acts only on the items a mod declares with
# [[VRFW.ItemTransform]] (the framework answers "not ours" for every other item, and nothing changes).
# * equip_menu_list: a transformation item chosen for a player it cannot transform is refused with the error sound
#   and the declaring mod's reason text (CMND_VRFW_ITEM_XFORM_CAN: 1 incompatible, 2 locked by its unlock flag; the
#   text id comes with the answer, {item} = the item's name; no text declared = the sound only). Taking the item off is
#   never refused. The item's native equip condition (built by the item type) already limits it to compatible players.
# * equip_menu_select: after an equip / remove / swap the 3D preview and the chara card miniface are rebuilt at
#   once when the transformation target of the shown player changed (CMND_VRFW_ITEM_XFORM_STATE).
# Lua globals VRFW_ItemXform.
name = "vrfw_item_xform"
mod = "VRFW"
order = 300
module = ""
requires = []
conflicts = []
wraps = ["SetStartMenu", "UpdateItemEquipMenu", "OnFunction", "SetupCharaModel", "UpdateCharaCard", "OnChangeLayerGroup", "UpdateEquipCondition"]
description = "item transformations: refusal reason in the equipment list; instant model / miniface refresh on equip, remove, swap"

[[files]]
stem = "equip_menu_list"

  [[files.ops]]
  type = "append_block"
  src = "vrfw_item_xform_equip.lua"
  marker = "vrfw_item_xform"

[[files]]
stem = "equip_menu_select"

  [[files.ops]]
  type = "append_block"
  src = "vrfw_item_xform_select.lua"
  marker = "vrfw_item_xform_select"
