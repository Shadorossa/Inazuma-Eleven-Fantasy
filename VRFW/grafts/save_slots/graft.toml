# Save slots (research/scripts/slot_build.py): the slot screen before EMPEZAR
# (include/menu/title_menu_inc: one patch in StartItemSelectMenuCoroutine + evt_title_slot_block) and the new menu
# evt_save_slot_menu (src/evt_save_slot_menu.lua; the legacy build padded it to the installed size, not needed here).
# A VR-Framework base service: built into mod vr_framework (`menu_assemble.py build --mod
# vr_framework`, packed by framework_pack.py under save\lua\ + the screen script menus\scripts\); the slot commands
# (CMND_VRFW_SLOT_*; 1.x CMND_EVT_SLOT_* / GET_SLOT / SET_SLOT as aliases) are answered by vr_framework.dll's save part (save_engine 1.3.0),
# so no ModLoader module is named here. Generic: the reserved 4th card shows a slot a mod reserved (its content from
# the owner's VRFW_SS_RESERVED provider); other mods extend the screen through VRFW_SS_HOOKS / VRFW_SS_API (a Lua patch of the
# stem evt_save_slot_menu, e.g. a mod's reserved-slot card). The player slots and their pages come from the layout
# ([save.slots] count); the story-complete start's question is the screen's own (graft story_start applies it).
name = "save_slots"
order = 100
mod = "vr_framework"
requires = []
conflicts = []
wraps = []
description = "Save slots: slot screen before EMPEZAR"

[[files]]
stem = "title_menu_inc"

  [[files.ops]]
  type = "insert_before"
  point = "title_menu_inc.StartItemSelectMenuCoroutine.SaveSlots"
  text = '''
  if not VRFW_SS_BeforeGameStart(n6) then -- EVT save slots: slot screen; false = cancelled, stay on EMPEZAR
    l2 = nil
    return
  end
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  src = "save_slots_inc_1.lua"
  crc = "none"

[[files]]
path = "common/script/lua/menu/evt_save_slot_menu.lua.bin"

  [[files.ops]]
  type = "new_file"
  src = "evt_save_slot_menu.lua"
  crc = "none"
  vars = { "@MENU_FILE@" = "evt_save_slot_menu" }   # --@lib evt_menu_kit.lua#StartCo

# title_menu_2 ships as lua_patches; mm_entry's patch redefines OnInit after the chunk, which drops the include's
# __newindex OnInit wrapper (no COMMIT: the switch fence stayed on, "Guardando..." forever). The commit is a handler of the framework's title_menu_2 host: a `before`
# handler of OnInit with priority -1000, so COMMIT runs before every other handler and before the OnInit of the
# merge-path patches under the host.
[[hooks]]
stem = "title_menu_2"
src = "save_slots_title2.lua"
