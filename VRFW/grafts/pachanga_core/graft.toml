# The ONE pachanga function of the VR-Framework match engine (docs/game/modes/pachangas-sistema.md §4): the generic
# executor VRFW_PACHANGA (pachanga_core.lua) in every menu a pachanga starts from or comes back to, the title end of
# the way back (pachanga_title.lua) and the story-field fallback (pachanga_field.lua, VRFW_PACHANGA_FieldTick).
# Callers (Inazuma Fantasy: rogue_dock = INAROGUE, office_requires = the office trials, fw_pachangas / fw_chains =
# Ciudad Inazuma) only pick a rules id declared by their mod and call VRFW_PACHANGA.start / back / set_passed.
# A VR-Framework graft since 2026-10-09 (was Inazuma Fantasy's, module match_engine; 1.x global EVT_PACHANGA, no
# alias): built by `menu_assemble.py build --mod vr_framework` into the save part's Lua root (framework_pack.py).
# Order: that root runs after IF's lua_early root in every menu, so the callers (other mod: no build `requires`) find
# VRFW_PACHANGA defined before any callback, and on title_menu_2 pachanga_title.lua wraps OnInit OUTSIDE modes_hub's
# wrapper (before: inside). Same effect: modes_hub takes its keys before it calls the retail OnInit and does nothing
# after it, so the order stays modes_hub's keys -> retail OnInit -> back(1) -> EVT_MH_T.pending = the origin.
name = "pachanga_core"
mod = "vr_framework"
order = 200
module = ""
requires = []
conflicts = []
wraps = ["OnInit", "Step"]
description = "Pachangas: the one launch / way back of every mode's friendly matches (VR-Framework match engine)"

[[files]]
stem = "soccer_team_dock_menu"

  [[files.ops]]
  type = "append_block"
  src = "pachanga_core.lua"
  marker = "pachanga core"
  crc = "none"

