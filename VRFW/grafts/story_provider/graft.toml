# The story-cleared provider of the VR-Framework mode engine: the global VRFW_STORY_PROVIDER (sp_provider.lua) in the VMs of the mode
# hosts, so `[mode.unlock] story_cleared` asks CMND_VRFW_STORY_START_GET (the VR-Framework's save part):
#   title_menu_2          title rows / lower buttons
#   soccer_top_menu       "Game Modes"
#   evt_save_slot_menu    the slot screen (the framework's own script: graft save_slots, new_file; order after it)
# A VR-Framework graft: the clause works with no other mod installed.
# Built by `menu_assemble.py build --mod vr_framework` (framework_pack.py: the save part's Lua root). Only a definition:
# nothing runs at chunk load.
name = "story_provider"
mod = "vr_framework"
order = 140
module = ""
requires = ["save_slots"]
conflicts = []
wraps = []
description = "Answers the mode engine's «story cleared» unlock clause from the saved story (CMND_VRFW_STORY_START_GET)"

[[files]]
path = "common/script/lua/menu/evt_save_slot_menu.lua.bin"

  [[files.ops]]
  type = "append_block"
  src = "sp_provider.lua"
  marker = "story_provider slot screen"
  crc = "none"

[[files]]
stem = "title_menu_2"

  [[files.ops]]
  type = "append_block"
  src = "sp_provider.lua"
  marker = "story_provider title"
  crc = "none"

[[files]]
stem = "soccer_top_menu"

  [[files.ops]]
  type = "append_block"
  src = "sp_provider.lua"
  marker = "story_provider modes hub"
  crc = "none"
