# VR-Framework free-match classes: the class menu of "Competir contra bots"
# (soccer_vs_cpu_class_select_menu) lists the classes the opponent offers ([VRFW.FreeMatch] Difficulties of the mods
# that the game has a row for: CMND_VRFW_FM_DIFFICULTIES of vr_framework.dll), with the retail clear / advantage-win
# marks and their box only while ClearTicks holds and the retail per-class lock unless Unlock = "together"; each card's
# title is the class's declared Banner (CMND_VRFW_FM_CLASS) or its retail one, its level ball the class's Ball
# (the colour of its title) or its retail one, and its "Lv." is the level of the team of the game's row of THAT
# class (the retail menu used the game's first row's team): the real level (a mod gives the number 3 digits). With no mod rule the menu
# is the retail one (4 classes, marks, locks).
# The list half is the menu part's host handler
# research/mods/VRFW/assets/lua/menu/soccer_vs_cpu_list_menu/110_free_match_difficulty.lua (VRFW_FM).
# Built by `menu_assemble.py build --mod vr_framework` into the save part's Lua root (framework_pack.py). Nothing else
# patches this script.
name = "vrfw_free_match"
mod = "VRFW"
order = 130
module = ""
requires = []
conflicts = []
wraps = []
description = "Free match: the class menu lists the opponent's offered classes ([VRFW.FreeMatch])"

[[files]]
stem = "soccer_vs_cpu_class_select_menu"

  [[files.ops]]
  type = "insert_before"
  point = "soccer_vs_cpu_class_select_menu.OnInit.VrfwFreeMatch"
  src = "vfm_class.lua"
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_vs_cpu_class_select_menu.OnInit.VrfwFreeMatchAfter"
  text = '''
    VRFW_FMC.cache = nil -- VRFW the opponent's classes, read again for this opponent
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnSetupLayer.VrfwFreeMatch"
  text = '''
    if VRFW_FMC.Hidden(n2, a2) then                                          -- VRFW row past the offered classes
      funcLuaMenuCommand(711242136 --[[CMND_SET_LAYER_VISIBLE]], a1, a2, false)
      funcLuaMenuCommand(711242136 --[[CMND_SET_LAYER_VISIBLE]], 892105257 --[[mainmenu90_30_lock_icon]], a2, false)
      return
'''
  crc = "none"

  [[files.ops]]
  type = "insert_before"
  point = "soccer_vs_cpu_class_select_menu.OnSetupLayer.VrfwFreeMatchBefore"
  text = '''
    local c = VRFW_FMC.Cls(n2, a2)                                           -- VRFW class shown on this row
    local ball_atlas, ball = VRFW_FMC.Ball(c, t4[c])                         -- VRFW the class's ball (its title's colour)
    funcLuaMenuCommand(558735651, a1, ball_atlas, ball, 3432748829 --[[lv_base00]], 0, a2)
    local atlas, sprite = VRFW_FMC.Banner(c, t[c])                           -- VRFW the class's banner (declared or retail)
    funcLuaMenuCommand(558735651, a1, atlas, sprite, 1361148396 --[[dmy_icon_class01]], 0, a2)
    VRFW_FMC.Box(a1, a2)                                                     -- VRFW no mark box without ClearTicks
    local l1 = c + 6
    local flag = VRFW_FMC.Locked(n2, n, c)                                   -- VRFW retail rule, or open (together)
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnSetupLayer.VrfwFreeMatchReplace"
  text = '''
    local ret3 = false
    flag2, ret3 = VRFW_FMC.Marks(n2, c)                                      -- VRFW clear / advantage marks (ClearTicks)
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_vs_cpu_class_select_menu.OnSetupLayer.VrfwFreeMatchAfter"
  text = '''
    if VRFW_FMC.Hidden(n2, a2) then                                          -- VRFW
      funcLuaMenuCommand(711242136 --[[CMND_SET_LAYER_VISIBLE]], a1, a2, false)
    end
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnOpenLayer.VrfwFreeMatch"
  text = '''
    funcLuaMenuCommand(3252599449, a1, #VRFW_FMC.List(n2))                   -- VRFW one item per offered class
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnChangeFocus.VrfwFreeMatch"
  text = '''
    funcLuaMenuCommand(1223842288, 6 + VRFW_FMC.Cls(n2, ret))                -- VRFW
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnSetupLayer.VrfwFreeMatch2"
  text = '''
      local main_member_level_average = CalcMainMemberLevelAverage(VRFW_FMC.Team(n2, l1, n6), n2, l1)   -- VRFW this class's team
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "soccer_vs_cpu_class_select_menu.OnDecideFocus.VrfwFreeMatch"
  text = '''
    n4 = 6 + VRFW_FMC.Cls(n2, a2)                                            -- VRFW
'''
  crc = "none"
