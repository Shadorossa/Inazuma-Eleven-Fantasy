# Story-complete start (docs/framework/save-slots.md §7, docs/game/modes/story-complete-start.md §10; data:
# research/scripts/story_start_build.py). A VR-Framework feature since 2026-10-08 (was Inazuma Fantasy's): built into
# mod vr_framework (`menu_assemble.py build --mod vr_framework`, packed by framework_pack.py), the commands
# (CMND_VRFW_STORY_START_*, CMND_VRFW_STORY_SET_PHASE; the 1.x CMND_EVT_STORY_* aliases are gone) are answered by
# vr_framework.dll's save part (save_engine story_start), so no ModLoader module is named here. Always on with the slot
# service.
#   evt_save_slot_menu   the question after «Nueva partida» on an empty slot is part of the slot screen itself
#                        (graft save_slots, StoryAsk in evt_save_slot_menu.lua, text row evt_slot_story_ask)
#   title_menu_inc       title_menu_2 OnInit of that slot applies the post-story state once (ss_title_apply.lua +
#                        the generated table ss_data.lua), then autosaves
#   title_menu_2         host handler (ss_title2.lua): runs the apply from OnInit after the slot service's COMMIT
name = "story_start"
mod = "vr_framework"
order = 150
requires = ["save_slots"]
conflicts = []
wraps = []
description = "New game with the Victory Road story already completed (one-time apply on the title)"

[[files]]
stem = "title_menu_inc"

  [[files.ops]]
  type = "append_block"
  src = "ss_title_apply.lua"
  include = { "@DATA@" = "ss_data.lua" }
  marker = "story_start apply"
  crc = "none"

# title_menu_2 ships as lua_patches: mm_entry redefines OnInit after the chunk, which drops the include's __newindex
# wrapper above; the framework's title_menu_2 host runs the apply from a `before` OnInit handler (priority -900).
[[hooks]]
stem = "title_menu_2"
src = "ss_title2.lua"
