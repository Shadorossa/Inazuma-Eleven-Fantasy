schema = "VRFW.character/2"
# The models the IECross special moves load as actors (LOAD_ACTOR_RESOURCE '<name>'): the game finds a `_waza` model
# through its chara_base row (id = crc32(name)) and that row's chara_model row (the objbin path); every retail ev6x
# `_waza` model has both (213 / 213 in v7.1.2). Without them the actor is not drawn. One [[character]] per model in
# content\models\props; ids fixed (chara_base = crc32(name); chara_model = crc32(name) ^ 0x0A0B78D5, as before).
default_lang = "en"

[[character]]
name = "move_model_inferno_penguin"                       # Inferno Penguin's red penguins
based_on = "ev60_00400"                                   # template: Emperor Penguin No. 2's penguins
order = 68
battle = false

  [character.base]
  id = 0xF7D4693C
  name = "ev60_95000"

  [character.new_model]
  id = 0xFDDF11E9
  from = 0xCB5105C3                                       # model of ev60_00400
  order = 11
  [character.new_model.cells]
  skeleton_path = "_waza/ev60_95000/ev60_95000.objbin"

