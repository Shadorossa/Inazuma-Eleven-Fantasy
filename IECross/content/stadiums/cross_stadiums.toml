schema = "VRFW.stadium/1"
# The eight Inazuma Eleven Cross stadiums in every stadium picker of the game (free match, Battle Bay / VS rooms,
# ranked match settings), each listed once its ticket was obtained (content\items\cross_stadiums.toml: the ticket's
# item id, kept from Inazuma Fantasy by its [[alias]]). Their names are text\rows\map_text.toml, their list
# pictures content\images\menu\220_img\stadium\img_room_<map>.toml (the default picture name), their maps
# assets\map\s\<map>\ + content\tables\common\map\map_data.toml. Positions 95-102 keep them after the game's stadiums
# in the order they had.

[[stadium]]
map = "s91g001"          # Inazuma Big Ferry
order = 95
unlock_item = "0x1E4F5D8E"    # ticket stadium_s91g001

[[stadium]]
map = "s91g001b"         # Inazuma Big Ferry (verano)
order = 96
unlock_item = "0x7BA00E83"    # ticket stadium_s91g001b

[[stadium]]
