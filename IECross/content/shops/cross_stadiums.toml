# Moved from Inazuma Fantasy (2026-10-08). A shop row's purchase counter / «new» bit index is numbered from
# "<mod adding the row>.row:<shop>/<item id hex>" (docs/framework/ids-and-numbers.md §3): these aliases keep each
# row's counter, so a bought ticket stays bought (the row ids, "row:<shop>/<item>", never had the mod in them).
[[alias]]
