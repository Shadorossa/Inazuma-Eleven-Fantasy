schema = "vr_framework.item/2"
# Hand-written: the stadium items («key» items, like retail gd1200NN) of the Inazuma Eleven Cross stadiums IF ports
# (research/scripts/cross_stadium_build.py, docs/game/media/cross-stadium-port.md §11). Owning one unlocks its row in
# the free-match stadium list (soccer_game_option c2 = GetGlobalItemGetBitFlag(item) == 1, as every retail stadium);
# they are sold in the Tienda general (content\shops\cross_stadiums.toml) like the retail stadium tickets.
# Moved from Inazuma Fantasy with the stadiums' list rows on 2026-10-08: the [[alias]]es at the end keep each
# ticket's item id (0x1E4F5D8E... = crc32("inazuma_fantasy.<name>"), what the list rows' unlock conditions encode),
# its catalog bit (bought / owned in the saves), its name text ids and old-save slots.
default_lang = "es"

[[item]]
name = "stadium_s91g001"                      # 0x1E4F5D8E: Inazuma Big Ferry (map s91g001)
base = "gd120030"
category = "key"
  [item.text.es]
  name = "Inazuma Big Ferry"
  [item.text.en]
  name = "Inazuma Big Ferry"
  [item.text.it]
  name = "Inazuma Big Ferry"

