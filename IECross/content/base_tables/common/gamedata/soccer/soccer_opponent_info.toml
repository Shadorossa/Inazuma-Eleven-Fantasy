schema = "vr_framework.base_table/1"
# The free-match rows of the Cross games (category 1, under the Cross tab; their conditions: listed while the office
# is off; three rows also listed again after a previous game is won). Key = [battleId, sortOrder] (two rows share a
# game). The team type orders them and writes the unlock chain (content/teams/cross_tab.toml: order, unlock = "chain").
# Moved from Inazuma Fantasy's whole soccer_opponent_info on 2026-10-08 (docs/release/iecross.md §6).

[[keyed]]
table = "soccer/soccer_opponent_info"
key_columns = ["battleId", "sortOrder"]
