schema = "VRFW.base_table/1"
# The hidden piece evt_cross_piece of the Chronicle route table: routeType 9 = the 10th tab of «Competir contra
# bots» (the Cross tab: content/teams/free_match_tab.toml declares it, the VR-Framework draws it and writes this routeType
# from the tab's place; X icon), its event list = the 11 Cross games
# (the team type appends Royal Academy (Cross)'s game to it). By key, its events as the eventInfoRef slice. Moved from
# Inazuma Fantasy's chronicle_vs_route_config on 2026-10-08 (docs/release/iecross.md §6).

[[keyed]]                                 # the hidden piece evt_cross_piece (routeType 9 = the Cross tab) and its games
