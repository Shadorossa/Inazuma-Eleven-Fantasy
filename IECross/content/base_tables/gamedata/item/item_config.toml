schema = "VRFW.base_table/1"
# The items of Inazuma Eleven Cross's content, added BY KEY at the end of their game lists
# (docs/framework/types/base_table.md §3), so they stand on any game version and on top of any mod's edition of
# item_config. Same ids, catalog numbers and texts as since 2026-10-08:
#   ITEM_SPECIAL_SKILL_INFO  the manuals of the 12 Cross moves (key = the move's key; their catalog 13002-13013 is past the 8192-bit flag array: the technique engine gives each a free number, VRFW 2.2.70)
#   ITEM_EMBLEM_INFO         the six Cross crests (Shin Zeus, Shin Brain, KFC Pierrot, Chaos Circus, Pirates, Ramen)
#   ITEM_FASHION_INFO        the six Cross kits (clown, inverted clown, Samurai Blue, Shin Zeus, pirate, Ramen)
# Crests and kits clone a retail row of the same series (`from`): the clone brings the row's SERIES flags and the
# columns a game version adds (v7.2.1 added a trailing -1 to every crest row).

