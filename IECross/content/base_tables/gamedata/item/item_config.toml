schema = "VRFW.base_table/1"
# The items of Inazuma Eleven Cross's content, appended at the end of their game lists (positions = the retail
# file's: this mod loads before Inazuma Fantasy, whose edits of the same lists come after these rows). Moved from
# Inazuma Fantasy's base table on 2026-10-08 (same ids, catalog numbers and texts):
#   ITEM_SPECIAL_SKILL_INFO  the manuals of the 12 Cross moves (key = the move's key; their catalog 13002-13013 is past the 8192-bit flag array: the technique engine gives each a free number, VRFW 2.2.70)
#   ITEM_EMBLEM_INFO         the six Cross crests (Shin Zeus, Shin Brain, KFC Pierrot, Chaos Circus, Pirates, Ramen)
#   ITEM_FASHION_INFO        the six Cross kits (clown, inverted clown, Samurai Blue, Shin Zeus, pirate, Ramen);
#                            Inazuma Fantasy had them among the retail kits, they are the last rows of the list now

