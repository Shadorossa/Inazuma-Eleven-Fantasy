schema = "VRFW.base_table/1"
# The 11 games of the «Inazuma Eleven Cross» tab of «Competir contra bots» (moved from Inazuma Fantasy's whole
# soccer_game_config on 2026-10-08, docs/release/iecross.md §6): row deltas BY KEY ([[keyed]], applied after every mod's
# edition of the file, so they sit on top of IF's whole lists). Each game's difficulty row is written as its
# REF_DIFFICULTY slice: the framework appends it to SOCCER_GAME_DIFFICULTY and points the game at it (no row positions).
# Keys / numbers unchanged: game id = crc32(name), clear bit = sort_no 2548-2558 (the saves' «beaten» orbs), prizes =
# reward_table (soccer_prize_config.toml here), own stadium / AI / drops as before. The 12th game, Royal Academy (Cross),
# is made by the team type (content/teams/02_royal_academy_cross.toml, list cross_tab in content/teams/cross_tab.toml).

[[keyed]]
table = "soccer/soccer_game_info"
key_columns = ["id"]                    # the game id (crc32 of its name); 1.1.2: the schema had no key column, so VR-Framework <= 2.0.2 skipped these rows
