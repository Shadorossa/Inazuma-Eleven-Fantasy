id = "iecross"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
# «IECross» since 1.3.0 (2026-10-10; «Inazuma Eleven Cross» before): the same name in every language; the id stays.
name = "IECross"
version = "1.3.18"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Inazuma Eleven Cross in Victory Road. Teams: the 11 Cross teams (Shin Zeus, Shin Brain, KFC Pierrot, Chaos Circus, the Inazuma Japan, Wild and Occult pirates, the Kirkwood, Otaku and Raimon Veterans Ramen teams, Japan 2026) with their crests and kits, and their CPU movesets. Characters: the Cross cards (Byron Love (Cross), Axel Blaze of Royal Academy, pirate Shawn Froste and Xavier Foster, Celia Hills with Jude's cape, clown Gazelle and Torch) with their Cross heads and outfits. Special moves: the 12 Cross moves (Inferno Penguin, Ocean Birth, God Knows Machina, Chaos Illusion and eight Cross versions of Victory Road moves) with their scenes, effects and manuals. Stadiums: the eight Cross stadiums (Inazuma Big Ferry and its summer and festival skins, the seaside deck, the ghost pirate ship, the ramen ship, the cyber field, the ferry's bow deck) as match maps, listed in every stadium picker of the game (free match, Battle Bay and VS rooms) once their ticket from the general shop is owned. «Competir contra bots»: the «Inazuma Eleven Cross» tab's matches with their prizes, Royal Academy (Cross) and the unlock chain, in its own «Inazuma Eleven Cross» tab (the X icon, after Victory Road). Bahía Batalla: the Cross teams of the grid under their own Cross season (the X icon). Player bank: an «Inazuma Eleven Cross» tab (the X icon) listing the Cross cards (only there and in «TODO», never under a retail series tab), and the Cross series in the bank filter. The Cross goal celebrations of these characters come from New Animations. Always on: the mod has no options."
priority = 0
tags = ["Teams", "Characters", "Techniques"]
updated = "2026-10-16"
# This mod's own names (TOML keys [[IECross.X]], Lua IECross.X, any later text, command or key; older texts keep
# their iecross_ ids); never VRFW.
prefix = "IECross"
folder = "IECross"
# The «Inazuma Eleven Cross» content of Inazuma Fantasy (the 19_iecross season), moved out of IF on 2026-10-08 (IF
# split, docs/refactor/if-mod-split-map.md rows if_roster / if_techniques; docs/release/iecross.md). Data only: no
# plugin, no Lua, no options. Standard mod layout (docs/framework/mod-layout.md, 1.3.0-1.3.1): declarations in
# content\<type>\, texts in text\, game-shaped files in assets\data\, binaries in assets\ (the image PNGs in
# assets\images\…, the .glb / textures in assets\models\…: same sub-path as their declaration, found through the
# image / model types' assets\ fallback):
#   content\teams\0001-0011_*.toml   the 11 Cross teams (team type; keys evt_ct_cx_*: ids = crc32(key), as before)
#   content\teams\00_loadouts.toml   their CPU loadouts (169, only they use them)
#   content\teams\90_estadio_bb.toml four of them in the Estadio BB (level-40 copies, keys <key>_bb)
#   content\characters\<season>\<team>.toml
#                                    the 7 Cross characters (fixed ids: chara_base / card / model ids unchanged)
#   content\characters\celebrations.toml
#                                    their claims on new_animations' Cross goal celebrations
#   content\looks\                   the 14 Cross kits, the Cross characters' own kits, outfits, shoes, items
#   content\models\                  every model, one address each (docs/framework/mod-layout.md «Models»): 3 .glb
#                                    (pirate Xavier's head and shoes, the Inferno Penguin move model: if_models_to_glb.py)
#                                    and 25 native ones (format = "native", game_path: the Cross heads, items, own
#                                    outfits / shoes, kit textures, two move models); files in assets\models\<kind>\<id>\
    #   assets\data\…                     events, effect objects, crests,
#   content\techniques\new.toml      the 12 Cross moves (keys whs95000…whd95110: skill ids = crc32(key), as before)
#   content\base_tables\event\…, event_cfg\…
#                                    the moves' light / event / effect / sound lists
#   content\base_tables\gamedata\item\item_config.toml
#                                    manuals, crest items, kit items (same ids / catalog numbers)
#   content\base_tables\gamedata\character\…
#                                    the Cross belong team and series, chara scale rows
#   text\rows\                       team / crest / kit / series names (9 languages)
#   content\images\menu\200_icon\02_icon_item\icon_item07
#                                    the six Cross kit item icons
#   assets\data\…                     events, effect objects, move models, Cross heads, outfits, kit textures, crests,
#                                    face icons, kit mini-faces (Level-5 / Cross derived, tracked as they were in IF)
#   assets\data\{common,dx11}\map\s\s9{1,1b,1c,2,3,4,8,9}g001 + content\base_tables\map\s\…
#   + content\base_tables\map\map_minimap.toml + content\tables\common\map\map_data.toml
#   + images\menu\220_img\stadium\img_room_* + text\rows\map_text.toml
#                                    the eight Cross stadium ports (maps, env / effect tables, minimap and map-list rows,
#                                    list pictures, names)
#   content\teams\cross_tab.toml + content\teams\0012_royal_academy_cross.toml
#   + content\base_tables\gamedata\soccer\{soccer_game_config,soccer_prize_config,soccer_opponent_info}.toml
#   + content\base_tables\gamedata\vsroute\…
#                                    (1.1.0) the «Inazuma Eleven Cross» tab of «Competir contra bots»: its 11 games,
#                                    prizes, hidden piece evt_cross_piece ([[keyed]] rows by key on top
#                                    of Inazuma Fantasy's whole tables), the cross_tab list and Royal Academy (Cross);
#   content\items\ + content\shops\cross_stadiums.toml
#                                    the eight stadium tickets and their Tienda general rows
#   content\stadiums\cross_stadiums.toml
#                                    (1.3.17) the eight stadiums in every stadium picker ([[stadium]], VR-Framework
#                                    2.4.135), each listed once its ticket is owned (1.3.18)
#                                    Moved from Inazuma Fantasy with [[alias]]es (VR-Framework 2.0.1): game
#                                    evt_cm_te_322299, ticket item ids / catalog bits / purchase counters unchanged.
#   content\teams\free_match_tab.toml + text\rows\menu_text.toml + images\menu\200_icon\16_icon_list_tab\
#                                    (1.1.1) the Cross tab of «Competir contra bots» ([[VRFW.FreeMatchTab]]: the
#                                    VR-Framework 2.0.1 draws it, with or without Inazuma Fantasy) and the Cross season of
#                                    the Bahía Batalla grid ([[VRFW.Season]] series_10, its 5 Cross teams), the X icon
#                                    (moved from IF)
#   content\card_filters\cross.toml  (1.2.0) the player bank's «Inazuma Eleven Cross» tab ([[bank_tab]], VR-Framework
#                                    2.0.3: the Cross belong team's characters) and the Cross series value of the bank
#                                    filter ([[series]], exclusive); both moved from Inazuma Fantasy
# README.md, _deploy.toml and _split.toml are developer files, never installed.
# NOT here (Inazuma Fantasy keeps them, it requires this mod): the Office scouts / shop rows that sell Cross cards, manuals and the Japan 2026 kit, the
# spirit list's Cross tab (graft series_tabs; the bank's Cross tab is this mod's since 1.2.0), INAROGUE's use of the Cross teams, the Lv200 stats / growth / INAROGUE
# rarity of the Cross cards (IF's EVT layout: IF's characters\iecross_cards.toml).
# Celebrations: the Cross characters claim new_animations' Cross intros (new_animations.cross_*).
requires = ["vr_framework>=2.4.135", "new_animations>=1.1.0"]
conflicts = []

# What other mods may use under the prefix (docs/framework/native.md §5): nothing yet (no Lua functions, no
# [[IECross.X]] keys). What other mods use today are content ids, public by id with requires = ["iecross"], unchanged
# by the rename / layout: the free-match tab `cross` ([[VRFW.FreeMatchTab]], content\teams\free_match_tab.toml), the
# Bahía Batalla season `series_10` ([[VRFW.Season]], same file), the player bank tab `cross` and the bank filter value
# `cross` (content\card_filters\cross.toml), the list `iecross.cross_tab`, the teams `iecross.ct_cx_*`, the characters
# `iecross.*`, the series / belong team rows (crc32 evt_chara_series_cross / evt_belong_team_cross) and the text row
# iecross_series_cross.
[exports]
functions = []
keys = []
