# Texts of IECross (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("iecross.<name>"): the mod's name and description on the «Mods» screen, in the game's language.
# A language missing here falls back to English. (The names of its teams, crests, kits, series and moves are game
# text rows / technique texts: text\rows\, content\techniques\new.toml.)
schema = "vr_framework.text_key/1"
default_lang = "en"

[en.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross in Victory Road. Teams: the 11 Cross teams (Shin Zeus, Shin Brain, KFC Pierrot, Chaos Circus, the Inazuma Japan, Wild and Occult pirates, the Kirkwood, Otaku and Raimon Veterans Ramen teams, Japan 2026) with their crests and kits, and their CPU movesets. Characters: the Cross cards (Byron Love (Cross), Axel Blaze of Royal Academy, pirate Shawn Froste and Xavier Foster, Celia Hills with Jude's cape, clown Gazelle and Torch) with their Cross heads and outfits. Special moves: the 12 Cross moves (Inferno Penguin, Ocean Birth, God Knows Machina, Chaos Illusion and eight Cross versions of Victory Road moves) with their scenes, effects and manuals. Stadiums: the eight Cross stadiums (Inazuma Big Ferry and its summer and festival skins, the seaside deck, the ghost pirate ship, the ramen ship, the cyber field, the ferry's bow deck) as match maps. The Cross goal celebrations of these characters come from New Animations. Always on: the mod has no options."

[es.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross en Victory Road. Equipos: los 11 equipos de Cross (Shin Zeus, Shin Brain, KFC Pierrot, Circo Caos, los piratas de Inazuma Japón, Wild y Occult, los equipos Ramen de Kirkwood, Otaku y Veteranos Inazuma, Japón 2026) con sus emblemas y equipaciones, y sus técnicas de la CPU. Personajes: las cartas de Cross (Byron Love (Cross), Axel Blaze de la Royal Academy, Shawn Froste y Xavier Foster piratas, Celia Hills con la capa de Jude, Gazel y Torch payasos) con sus cabezas y trajes de Cross. Supertécnicas: las 12 técnicas de Cross (Pingüino Infernal, Nacimiento oceánico, Sabiduría divina Machina, Ilusión caótica y ocho versiones de Cross de técnicas de Victory Road) con sus escenas, efectos y manuales. Estadios: los ocho estadios de Cross (Inazuma Big Ferry con sus versiones de verano y de festival, la cubierta junto al mar, el barco pirata fantasma, el barco-restaurante de ramen, el campo cibernético, la proa del ferry) como mapas de partido. Las celebraciones de gol de Cross de estos personajes vienen de Nuevas animaciones. Todo está siempre activo: el mod no tiene opciones."

[fr.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross dans Victory Road. Équipes : les 11 équipes de Cross (Shin Zeus, Shin Cybertech, KFC Pierrot, Cirque Chaos, les pirates d'Inazuma Japon, de Wild et d'Occult, les équipes Ramen de Kirkwood, d'Otaku et des Vétérans Inazuma, Japon 2026) avec leurs emblèmes et leurs maillots, et leurs techniques de l'IA. Personnages : les cartes de Cross (Byron Love (Cross), Axel Blaze de la Royal Academy, Shawn Froste et Xavier Foster en pirates, Célia Hills avec la cape de Jude, Gazelle et Torch en clowns) avec leurs têtes et tenues de Cross. Supertechniques : les 12 techniques de Cross (Pingouin Infernal, Naissance océane, God Knows Machina, Illusion chaotique et huit versions Cross de techniques de Victory Road) avec leurs scènes, effets et manuels. Stades : les huit stades de Cross (Inazuma Big Ferry et ses versions été et festival, le pont au bord de la mer, le bateau pirate fantôme, le bateau-restaurant de ramen, le terrain cybernétique, la proue du ferry) comme terrains de match. Les célébrations de but Cross de ces personnages viennent de Nouvelles animations. Toujours actif : le mod n'a pas d'options."

[de.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross in Victory Road. Teams: die 11 Cross-Teams (Shin Zeus, Shin Brainwashing, KFC Pierrot, Chaos-Zirkus, die Piraten von Inazuma Japan, Wild und Occult, die Ramen-Teams von Kirkwood, Otaku und den Inazuma-Veteranen, Japan 2026) mit ihren Wappen und Trikots und ihren KI-Techniken. Figuren: die Cross-Karten (Byron Love (Cross), Axel Blaze von der Royal Academy, Piraten Shawn Froste und Xavier Foster, Celia Hills mit Judes Umhang, Clowns Gazelle und Torch) mit ihren Cross-Köpfen und -Outfits. Spezialtechniken: die 12 Cross-Techniken (Inferno-Pinguin, Ozeangeburt, God Knows Machina, Chaos-Illusion und acht Cross-Versionen von Victory-Road-Techniken) mit ihren Szenen, Effekten und Handbüchern. Stadien: die acht Cross-Stadien (Inazuma Big Ferry mit Sommer- und Festivalversion, das Deck am Meer, das Geisterpiratenschiff, das Ramen-Restaurantschiff, das Cyberfeld, der Bug der Fähre) als Spielorte. Die Cross-Torjubel dieser Figuren kommen aus Neue Animationen. Immer aktiv: Der Mod hat keine Optionen."

[it.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross in Victory Road. Squadre: le 11 squadre di Cross (Shin Zeus, Shin Brainwashing, KFC Pierrot, Circo Caos, i pirati dell'Inazuma Japan, della Wild e dell'Occult, le squadre Ramen di Kirkwood, Otaku e Veterani Inazuma, Giappone 2026) con i loro stemmi e le loro divise, e le loro tecniche della CPU. Personaggi: le carte di Cross (Byron Love (Cross), Axel Blaze della Royal Academy, Shawn Froste e Xavier Foster pirati, Celia Hills con il mantello di Jude, Gazelle e Torch pagliacci) con le loro teste e i loro costumi di Cross. Supertecniche: le 12 tecniche di Cross (Pinguino Infernale, Nascita oceanica, God Knows Machina, Illusione caotica e otto versioni Cross di tecniche di Victory Road) con le loro scene, i loro effetti e i loro manuali. Stadi: gli otto stadi di Cross (Inazuma Big Ferry con le versioni estate e festa, il ponte sul mare, la nave pirata fantasma, la nave-ristorante di ramen, il campo cibernetico, la prua del traghetto) come campi di gioco. Le esultanze Cross di questi personaggi vengono da Nuove animazioni. Sempre attivo: la mod non ha opzioni."

[pt.new]
mod_name = "IECross"
mod_description = "Inazuma Eleven Cross no Victory Road. Equipas: as 11 equipas de Cross (Shin Zeus, Shin Colégio Cinza, KFC Pierrot, Circo Caos, os piratas do Inazuma Japão, do Wild e do Occult, as equipas Ramen do Kirkwood, do Otaku e dos Veteranos Inazuma, Japão 2026) com os seus emblemas e equipamentos, e as suas técnicas do CPU. Personagens: as cartas de Cross (Byron Love (Cross), Axel Blaze da Royal Academy, Shawn Froste e Xavier Foster piratas, Celia Hills com a capa do Jude, Gazelle e Torch palhaços) com as suas cabeças e roupas de Cross. Supertécnicas: as 12 técnicas de Cross (Pinguim Infernal, Nascimento oceânico, God Knows Machina, Ilusão caótica e oito versões Cross de técnicas do Victory Road) com as suas cenas, efeitos e manuais. Estádios: os oito estádios de Cross (Inazuma Big Ferry com as versões de verão e de festival, o convés junto ao mar, o navio pirata fantasma, o navio-restaurante de ramen, o campo cibernético, a proa do ferry) como campos de jogo. As comemorações de golo Cross destas personagens vêm de Novas animações. Sempre ativo: o mod não tem opções."

[ja.new]
mod_name = "IECross"
mod_description = "ヴィクトリーロードにイナズマイレブンCROSSを追加します。チーム：CROSSの11チーム（シン・ゼウス、シン・御影専農、ピエロKFC、カオスサーカス、イナズマジャパン・野生・尾刈斗の海賊チーム、木戸川・秋葉名戸・雷門OBのラーメンチーム、日本代表2026）とそのエンブレム・ユニフォーム、CPUの必殺技構成。キャラクター：CROSSのカード（アフロディ（CROSS）、帝国学園の豪炎寺修也、海賊の吹雪士郎と基山ヒロト、鬼道のマントの音無春奈、ピエロのガゼルとバーン）とCROSSの頭部・衣装。必殺技：CROSSの12の技（インフェルノペンギン、オーシャン・バース、ゴッドノウズ・マキナ、カオスイリュージョン、ヴィクトリーロードの技のCROSS版８つ）と演出・エフェクト・技の書。スタジアム：CROSSの８つのスタジアム（イナズマビッグフェリーと夏・祭りの版、海辺の甲板、幽霊海賊船、ラーメン船、サイバーフィールド、フェリーの船首）を試合会場に。これらのキャラクターのCROSSのゴールパフォーマンスは「新アニメーション」から。常に有効：このMODに設定はありません。"

[zh_hans.new]
mod_name = "IECross"
mod_description = "将闪电十一人 CROSS 加入胜利之路。球队：CROSS 的 11 支球队（真·世宇子、真·御影专农、小丑KFC、混沌马戏团、闪电日本 / 野生 / 尾刈斗海盗队、木户川 / 秋叶名户 / 雷门OB 拉面队、日本代表2026）及其队徽、队服和电脑招式配置。角色：CROSS 的卡牌（亚风炉照美（CROSS）、帝国学园的豪炎寺修也、海盗版吹雪士郎和基山广人、披着鬼道披风的音无春奈、小丑版凉野风介和南云晴矢）及其 CROSS 头部和服装。必杀技：CROSS 的 12 个必杀技（地狱企鹅、海洋诞生、神之知晓·机械、混沌幻象，以及胜利之路必杀技的 8 个 CROSS 版本）及其演出、特效和秘籍。球场：CROSS 的 8 座球场（闪电大渡轮及其夏日、祭典版本、海边甲板、幽灵海盗船、拉面船、电子球场、渡轮船头）作为比赛场地。这些角色的 CROSS 进球庆祝来自「新动画」。始终开启：本模组没有选项。"

[zh_hant.new]
mod_name = "IECross"
mod_description = "將閃電十一人 CROSS 加入勝利之路。球隊：CROSS 的 11 支球隊（真·世宇子、真·御影專農、小丑KFC、混沌馬戲團、閃電日本 / 野生 / 尾刈斗海盜隊、木戶川 / 秋葉名戶 / 雷門OB 拉麵隊、日本代表2026）及其隊徽、隊服和電腦招式配置。角色：CROSS 的卡牌（亞風爐照美（CROSS）、帝國學園的豪炎寺修也、海盜版吹雪士郎和基山廣人、披著鬼道披風的音無春奈、小丑版涼野風介和南雲晴矢）及其 CROSS 頭部和服裝。必殺技：CROSS 的 12 個必殺技（地獄企鵝、海洋誕生、神之知曉·機械、混沌幻象，以及勝利之路必殺技的 8 個 CROSS 版本）及其演出、特效和秘笈。球場：CROSS 的 8 座球場（閃電大渡輪及其夏日、祭典版本、海邊甲板、幽靈海盜船、拉麵船、電子球場、渡輪船頭）作為比賽場地。這些角色的 CROSS 進球慶祝來自「新動畫」。始終開啟：本模組沒有選項。"
