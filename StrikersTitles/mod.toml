id = "StrikersTitles"
former_ids = ["strikers_telops"]
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
# «Strikers Titles» since 1.2.0 (2026-10-10; «Telops» 1.1.0, «Rótulos de Strikers» / "Strikers Telops" before): the
# same name in every language; the id stays strikers_telops (installs, load order, saves).
name = "Strikers Titles"
version = "1.3.0"
author = "Shadorossa"
author_steam = "76561199013321372"
# (mod.toml has no credits key: the credit goes in the description)
description = "Special-move name banners: the Spanish ones of the Inazuma Eleven GO Strikers 2013 fan translation on the game's own techniques and keshin, plus Inazuma Fantasy's banners (Spanish, Japanese and English). Strikers titles by @IEGOStrikersESP (https://x.com/IEGOStrikersESP). Personal use only: never released."
priority = 0
tags = ["Visual"]
updated = "2026-10-22"
# This mod's own names (TOML keys [[StrikersTitles.X]], Lua StrikersTitles.X, any later text, command or key); never VRFW.
prefix = "StrikersTitles"
folder = "StrikersTitles"
# PERSONAL USE ONLY: never published. The whole mod stays out of every public release pack
# (research/scripts/release_exclude.py PERSONAL_MODS + L5_DERIVED["strikers_telops"]).
# Data only, standard mod layout (docs/framework/mod-layout.md, 1.2.0): content\telops\es\<id>.png + ONE list
# content\telops\es\strikers_telops.toml (telop type, schema vr_framework.telop_list/2: [defaults] = the layout they
# share, one [[telop]] per telop), all GENERATED by research/scripts/strikers_telops_to_mod.py on the author's PC, never
# committed (README.md); and content\telops\<lang>\inazuma_fantasy\<id>.png + .toml (es / ja / en, vr_framework.telop/2,
# the game's layout), Inazuma Fantasy's own banners, tracked by git, moved here 2026-10-09. text\keys.toml: the mod's
# name and description. Works on the retail moves, without Inazuma Fantasy. `requires` also makes it load after the
# framework.
requires = ["VRFW>=2.0.0"]
conflicts = []

# «Rótulos personalizados» (Opciones de mods) offers these languages while this mod is on (docs/framework/content-languages.md)
[content.languages]
telops = ["es", "ja", "en"]

# UI only: left out of the mod set two players must share in a private online room, and of «gameplay mods enabled»
# (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §5)
[VRFW.Mod]
AffectsMatch = false
