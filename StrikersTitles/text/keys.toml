mod_name = "Strikers Titles"
mod_description = "Rótulos de supertécnicas: los españoles de la traducción de fans de Inazuma Eleven GO Strikers 2013 (supertécnicas y espíritus guerreros del propio juego) y los de Inazuma Fantasy (español, japonés e inglés). Títulos de Strikers de @IEGOStrikersESP (https://x.com/IEGOStrikersESP). Uso personal: nunca se publica."

