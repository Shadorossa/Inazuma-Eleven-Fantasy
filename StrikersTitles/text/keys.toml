# Texts of Strikers Titles (mod id strikers_telops; «Strikers Titles» is not translated) (format of the text engine:
# docs/framework/types/text.md); new texts get the id crc32("strikers_telops.<name>"): the mod's name and
# description on the «Mods» screen, in the game's language. A language missing here falls back to English.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Strikers Titles"
mod_description = "Special-move name banners: the Spanish ones of the Inazuma Eleven GO Strikers 2013 fan translation on the game's own techniques and keshin, plus Inazuma Fantasy's banners (Spanish, Japanese and English). Strikers titles by @IEGOStrikersESP (https://x.com/IEGOStrikersESP). Personal use only: never released."

