# «Missing Voice»: the Japanese call-out of special moves whose user has no voice line for them in the game, from the
# player's own take in Inazuma Eleven GO Strikers 2013 (docs/game/mods/missing-voice.md). Each entry adds the cue
# `<bank>_<key>` (every skill_config key of the technique) to the ja voice bank of the player's cards: the only bank of
# that character's age group; a cue the bank has is never replaced. The WAVs are made on the owner's PC by
# research/scripts/missing_voice_build.py (_build.toml) and never committed; the sound type encodes them to the bank's
# format and sets the cue length from the audio. normalize = "none": the build already matched the bank's loudness.
schema = "VRFW.sound/1"

[[voice]]
bank = "c01001440"            # Makiya
cue = "whd00040"
lang = "ja"
file = "assets/sounds/voice/ja/c01001440_whd00040.wav"
normalize = "none"

