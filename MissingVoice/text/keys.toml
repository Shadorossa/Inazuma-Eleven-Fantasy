# Texts of Missing Voice (mod id missing_voice) (format of the text engine: docs/framework/types/text.md); new texts get
# the id crc32("missing_voice.<name>"): the mod's name and description on the «Mods» screen, in the game's language.
# A language missing here falls back to English.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Missing Voice"
mod_description = "Japanese voice lines for special moves whose user is silent in the game, taken from that same player in Inazuma Eleven GO Strikers 2013. Personal use only: never released."

[es.new]
mod_name = "Missing Voice"
mod_description = "Voces japonesas para supertécnicas cuyo usuario está mudo en el juego, sacadas de ese mismo jugador en Inazuma Eleven GO Strikers 2013. Uso personal: nunca se publica."

[fr.new]
mod_name = "Missing Voice"
mod_description = "Voix japonaises pour les techniques dont l'utilisateur est muet dans le jeu, tirées du même joueur dans Inazuma Eleven GO Strikers 2013. Usage personnel : jamais publié."

[de.new]
mod_name = "Missing Voice"
mod_description = "Japanische Sprachaufnahmen für Spezialtechniken, deren Anwender im Spiel stumm ist, vom selben Spieler aus Inazuma Eleven GO Strikers 2013. Nur für den persönlichen Gebrauch: nie veröffentlicht."

[it.new]
mod_name = "Missing Voice"
mod_description = "Voci giapponesi per le tecniche il cui utilizzatore è muto nel gioco, prese dallo stesso giocatore in Inazuma Eleven GO Strikers 2013. Uso personale: mai pubblicata."

[pt.new]
mod_name = "Missing Voice"
mod_description = "Vozes japonesas para técnicas cujo usuário fica mudo no jogo, tiradas do mesmo jogador em Inazuma Eleven GO Strikers 2013. Uso pessoal: nunca publicado."

[ja.new]
