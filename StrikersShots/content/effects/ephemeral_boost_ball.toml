# «Impulso efímero» (Ephemeral Boost, whs02040 and whs02040_mm, same cut-in; forest; cut-in ev60_02040): while the
# ball flies to the goal it keeps the look of the cut-in's last shot (c0500, the ball as a white / cyan comet), held at
# its final state from the first frame: the spiky comet heads round the ball turning about the flight, the ball glows
# and the glowing ball, the tails and wind streaks behind it laid from the kick point at the cut-in's own length,
# revealed by the ball as it passes and never stretched, their far end fading out; instead of the plain forest
# special-shot aura (ega0075d).
# The object is ev6204eb00 (effect/event/ev60/ev6204eb00/), built by research/scripts/ephemeral_boost_ball_fx.py from
# the cut-in's effect object ev60020400 (docs/game/media/ephemeral-boost-ball-fx.md).
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the forest special-shot aura's row (like = "ega0075d"). Flight:
# content\techniques\ephemeral_boost_trajectory.toml.
schema = "VRFW.effect/1"

[[effect]]
name = "ephemeral_boost"
from = "ega0075d"
object = "effect/event/ev60/ev6204eb00/ev6204eb00.objbin"

[[shot_aura]]
name = "ephemeral_boost"
when = { techniques = ["whs02040", "whs02040_mm"] }
aura = "ephemeral_boost"
like = "ega0075d"
anchor = "kick"
drift = 0.75
