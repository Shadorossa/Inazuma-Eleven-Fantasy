# «Atomic Flare» («Llamarada atómica», whs00790 and its _mm copy whs00790_mm; fire shot, cut-in ev60_00790): while the
# ball flies to the goal it wears the cut-in's last shot (c0030, held at frame 330, the ball running low into the goal):
# the small sun round the ball (its swirl disc, red rim, centre, flame wreath and fire ring, across the flight like a
# shield in front of the ball and turning about it as in the cut-in) and its fire tail (the red / orange / yellow flame ribbons and the thin fire streaks) laid
# straight behind it, coming out of the kick point and fading at its far end (~8 m), the cut-in's flame puffs left
# behind in chunks; x2.5 (the sun ~1.3 m, the flame wreath ~2.5 m across). The 40 m sun the ball is struck from, its
# prominences, the backdrops, fire walls, foot flames and impact flash stay out.
# The object is ev6079af00 (effect/event/ev60/ev6079af00/), built by research/scripts/atomic_flare_ball_fx.py from
# ev60007900.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the fire special-shot aura's row (like = "ega0075c"); the distance clock reveals the tail from
# the kick point. Flight: content\techniques\atomic_flare_trajectory.toml.
schema = "VRFW.effect/1"

[[effect]]
name = "atomic_flare"
from = "ega0075c"
object = "effect/event/ev60/ev6079af00/ev6079af00.objbin"

[[shot_aura]]
name = "atomic_flare"
when = { techniques = ["whs00790", "whs00790_mm"] }
aura = "atomic_flare"
like = "ega0075c"
# the tail comes out of the kick point: the clip runs on the ball's distance from it (docs/framework/types/effect.md «Distance clock»)
anchor = "kick"
drift = 0.75
