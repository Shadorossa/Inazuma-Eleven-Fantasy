# «Prime Legend» («Cometa legendario», whs01380, wind shot of two players, a chain shot, cut-in ev60_01380): while
# the ball flies to the goal it is the cut-in's OWN comet (the cut c0500, the two kickers' strike sending the ball off
# as a comet, held at frame 370, the flame's texture flow running on): the white head round the ball, the cyan flame
# trailing ~1.6 m behind it and the sparkles round the head, instead of the plain wind special-shot aura (ega0075b).
# The comet is a flat card standing upright along the flight (seen face on from the touchline). The speed-line tunnel
# and particle streaks round the camera, the kick waves, the camera blur, the charge-up of c0100-c0400, the c0600 light
# belts (36-268 m) and its end star (9-31 m flat crosses and rings) are dropped; x1.0 (the cut-in's own size: head
# ~0.55 m wide round the ball).
# The object is ev6138pl00 (assets\data\{common,dx11}\effect\event\ev60\ev6138pl00\), built by
# research/scripts/prime_legend_ball_fx.py from ev60013800; docs/game/media/prime-legend-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"; skillEffectBitFlag 8: a chain shot, not a
# long shot): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). No other
# technique key uses ev60_01380. No trajectory file: in the cut-in the ball flies level (0.78 m) to the goal.
# Mod «Strikers Shots»: visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "prime_legend_comet"
from = "ega0075b"
object = "effect/event/ev60/ev6138pl00/ev6138pl00.objbin"

[[shot_aura]]
name = "prime_legend_comet"
when = { techniques = ["whs01380"] }
aura = "prime_legend_comet"
like = "ega0075b"
