# «Bomba acrobática» (Acrobat Bomber, whs00520; forest shot, cut-in ev60_00520): while the ball flies to the goal it is
# inside the end of the cut-in's shot cut (c0500, frames 290-328, held at 328): its three ball aura shells on the event
# ball, x1, instead of the plain forest special-shot aura (ega0075d). The object is ev6052ab00
# (effect/event/ev60/ev6052ab00/), built by research/scripts/acrobat_bomber_ball_fx.py from the cut-in's effect object
# ev60005200 with the settings the automatic pipeline (ls_auto_aura.py) derived for it (the same object data as Living
# Shots' automatic aura ev600520au). The trigger copies the forest special-shot aura's row (like = "ega0075d"):
# CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b).
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "acrobat_bomber"
from = "ega0075d"
object = "effect/event/ev60/ev6052ab00/ev6052ab00.objbin"

[[shot_aura]]
name = "acrobat_bomber"
when = { techniques = ["whs00520"] }
aura = "acrobat_bomber"
like = "ega0075d"
