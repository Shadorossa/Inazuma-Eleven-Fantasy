# «Puerta astral» (Astro Gate, whs01260; forest shot, cut-in ev60_01260): while the ball flies to the goal it wears the
# cut-in's last shot (c0300, out of the star gate the ball skims the pitch), held from the aura's first frame: the
# purple orb round the ball with its rings, sparkle cross and light lines, and the dust wake it drags low over the
# pitch, coming out of the kick point as the ball moves away (revealed by distance, never stretched), its rear end one
# smooth ramp from the kick point and its far end fading out; the furrow the ball digs, laid fixed on the pitch from
# the kick point (faded in there) and shown as the ball passes, one seamless groove to the goal. Texture flow in whole periods over the loop. x1.
# The object is ev6126ag00 (effect/event/ev60/ev6126ag00/), built by research/scripts/astro_gate_ball_fx.py from
# ev60012600 (docs/game/media/astro-gate-ball-fx.md).
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the forest special-shot aura's row (like = "ega0075d"). Flight:
# content\techniques\astro_gate_trajectory.toml.
schema = "VRFW.effect/1"

[[effect]]
name = "astro_gate"
from = "ega0075d"
object = "effect/event/ev60/ev6126ag00/ev6126ag00.objbin"

[[shot_aura]]
name = "astro_gate"
when = { techniques = ["whs01260"] }
aura = "astro_gate"
like = "ega0075d"
anchor = "kick"
drift = 0.75
