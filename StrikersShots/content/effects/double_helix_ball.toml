# «Doble hélice» (Double Helix, whs02330; forest shot, cut-in ev60_02330): while the ball flies to the goal it wears the
# cut-in's last shot (c0400, held at frame 446): the white / yellow aura shells round the ball (their throb running on),
# and behind it the double helix, two white / cyan springs wound round the flight inside a green glow tube, spinning about
# the flight (whole turns per loop). The helix and its glow come out of the kick point, revealed by the distance the ball
# has flown (never stretched), the far end fading out; the helix axis is the flight, x1. The kick's impact rings stay out.
# The object is ev6233dh00 (effect/event/ev60/ev6233dh00/), built by research/scripts/double_helix_ball_fx.py from
# ev60023300.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the forest special-shot aura's row (like = "ega0075d"); the distance clock (anchor = "kick",
# drift) reveals the trail from the kick point. Flight: content\techniques\double_helix_trajectory.toml.
schema = "VRFW.effect/1"

[[effect]]
name = "double_helix"
from = "ega0075d"
object = "effect/event/ev60/ev6233dh00/ev6233dh00.objbin"

[[shot_aura]]
name = "double_helix"
when = { techniques = ["whs02330"] }
aura = "double_helix"
like = "ega0075d"
anchor = "kick"
drift = 0.75
