# «Técnica kung-fu» (Kung Fu Fighting, whs00530; mountain shot, cut-in ev60_00530): while the ball flies to the goal it
# wears the cut-in's last shot (c0500, held at frame 366 from the aura's first frame): the fire comet, the ball inside
# the white core of two nested flame teardrops (the orange spiky outer flame round them) and the long red and yellow
# flame streaks trailing behind it, their fire textures flowing all the way, x0.557. The trail comes out of the kick
# point as the ball flies (distance clock, never stretched) and fades out at its far end.
# The object is ev6053kf00 (effect/event/ev60/ev6053kf00/), built by research/scripts/kung_fu_fighting_ball_fx.py from
