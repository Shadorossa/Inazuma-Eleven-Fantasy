# «Stargazer» («Tormenta estelar», whs02590, wind shot, a chain shot: skillEffectBitFlag 8, cut-in ev60_02590): the
# shot is MANY stars (Nacho 2026-10-08): while the ball flies to the goal it travels among the cut-in's 48 stars (one
# per stroke of its c0200 meteor rain and its c0300 shooting stars), each with its own look (its soft rounded head and
# streak, its own width and material, a 3-card cross section for volume), each on its own radius round the flight
# (the cut-in's arrangement scaled into ~9 x 5 m round the ball); the whole set turns round the flight path (a turn
# every 1.5 s) while it travels with the ball, and each star's streak is the trace its head leaves: a helix growing
# from the kick point (0.75 m a frame, the match ball's speed, up to 40 m), its end fading; instead of the plain wind
# special-shot aura (ega0075b). The comet the ball turns into in c0200, the kick, the burst flash, the starry sky, the
# Earth and the white-out are not kept.
# The object is ev6259sg00 (assets\data\{common,dx11}\effect\event\ev60\ev6259sg00\), built by
# research/scripts/stargazer_ball_fx.py from ev60025900; docs/game/media/stargazer-ball-fx.md.
# The trigger copies the wind special-shot aura's row (like = "ega0075b"; skillEffectBitFlag 8: a chain shot, not a
# separate aura row): CB_SkillShootBallAura turns +Z along the ball's velocity every frame (aura-balon-tiro.md §2b).
# No other technique key (no _or / _mm / _cro) uses ev60_02590. No trajectory file: the game's own flight (Nacho
# 2026-10-08: no joint fall; the angled dive of earlier passes removed).
# Mod «Strikers Shots»: visuals only. The objects under assets\data are generated on the author's PC from
