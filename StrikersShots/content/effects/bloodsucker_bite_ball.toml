# the red blood streaks of its way laid straight behind the ball (each with a crossed copy, readable from the touchline)
# with the blood flowing along them, and the blood drops left over them, coming out of the kick point as the ball flies
# (never stretched) and fading out at the far end, x0.4. The sky, the moon, the black front plate and the charge parts
# stay out.
