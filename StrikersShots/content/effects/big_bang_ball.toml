# «Big Bang» (whs01110, fire shot, three-player combo, cut-in ev60_01110): while the ball flies to the goal it is
# inside the nose of the cut-in's OWN giant blazing meteor, as its last shot (c0700, held at frame 600, its fire's
# texture flow running on) shows it: the burning dome, its fire wave, flame sides and front glow round the ball, and
# its fire streaks running straight back along the flight (the cut-in's crescent card unrolled onto the flight, born
# at the kick point, its tail fading), instead of the plain fire special-shot aura (ega0075c). The streak fan, the
# shock ring at the nose, the dark backdrop, the camera-front flashes, the screen blur and the c0500 / c0600 space /
# galaxy / light-disc parts are dropped; x0.06 of the cut-in size (meteor ~3 m across, the ball 0.35 m inside its
# nose). Flight: content\techniques\big_bang_trajectory.toml (level at 2.0 m).
# The object is ev6111bb00 (assets\data\{common,dx11}\effect\event\ev60\ev6111bb00\), built by
# research/scripts/big_bang_ball_fx.py from ev60011100; docs/game/media/big-bang-ball-fx.md.
# The trigger copies the fire special-shot aura's row (like = "ega0075c"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b).
# Mod «Strikers Shots»: visuals only. The objects under assets\data are generated on the author's PC from
# the game's own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "big_bang_meteor"
from = "ega0075c"
object = "effect/event/ev60/ev6111bb00/ev6111bb00.objbin"

[[shot_aura]]
name = "big_bang_meteor"
when = { techniques = ["whs01110"] }
aura = "big_bang_meteor"
like = "ega0075c"
