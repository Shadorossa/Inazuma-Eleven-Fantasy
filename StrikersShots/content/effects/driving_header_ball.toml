# «Cabezazo catapulta» (Driving Header, whs02460; mountain shot, cut-in ev60_02460): while the ball flies to the goal
# after the cut-in it keeps the look of the cut-in's last shot, after the header (c0300): the white comet head wrapping
# the ball, its red flames, the red streaks and the faint red trails behind it, instead of the plain mountain
# special-shot aura (ega0075a).
# The object is ev6046dh00 (effect/event/ev60/ev6046dh00/), built by research/scripts/driving_header_ball_fx.py from the
# cut-in's effect object ev60024600: c0300 held at frame 304 (the ball at full speed, every part on it at its full
# length) from the aura's first frame, ball at the origin flying +Z, x1; the streaks and trails come out of the kick
# point as the ball moves away (never stretched), their far end fading out. Left out: the burst at the kick point and
# the cracked ground, dust and smoke under the header, which stay where the ball was headed.
# The trigger copies the mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns +Z along the
# ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\driving_header_trajectory.toml.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's
# own cut-in effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "driving_header"
from = "ega0075a"
object = "effect/event/ev60/ev6046dh00/ev6046dh00.objbin"

[[shot_aura]]
name = "driving_header"
when = { techniques = ["whs02460"] }
aura = "driving_header"
like = "ega0075a"
