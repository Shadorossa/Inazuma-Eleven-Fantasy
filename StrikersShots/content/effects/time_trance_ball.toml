# «Trance temporal» (Time Trance, whs03130; mountain shot, cut-in ev60_03130): while the ball runs to the goal it keeps
# the look of the cut-in's last shot (c0300, frame 456), where it comes head-on at the camera: its glowing ghost flame
# (the blue rim, the white core and the soft glow) as one round head of light round the event ball, the same from every
# side (camera-facing), x1, instead of the plain mountain special-shot aura (ega0075a). The object is ev6313tt00
# (effect/event/ev60/ev6313tt00/), built by research/scripts/time_trance_ball_fx.py from the cut-in's effect object
# ev60031300. The trigger copies the mountain special-shot aura's row (like = "ega0075a"): CB_SkillShootBallAura turns
# +Z along the ball's velocity every frame (aura-balon-tiro.md §2b). Its flight: content\techniques\
# time_trance_trajectory.toml.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "time_trance"
from = "ega0075a"
object = "effect/event/ev60/ev6313tt00/ev6313tt00.objbin"

[[shot_aura]]
name = "time_trance"
when = { techniques = ["whs03130"] }
aura = "time_trance"
like = "ega0075a"
