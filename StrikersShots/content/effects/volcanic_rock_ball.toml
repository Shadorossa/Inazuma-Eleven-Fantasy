# «Roca volcánica» (Volcanic Rock, whs02540; fire shot, cut-in ev60_02540): while the ball flies to the goal it is
# inside the cut-in's last shot (c0300, frame 300 held from the first frame): the cracked lava rock round the ball
# (its three shells spinning as in the cut-in, the outer glow pulsing in whole periods, back light and glow card) with
# the dark smoke trail laid straight behind it, flowing, coming out of the kick point on the distance clock and fading at its
# far end, instead of the plain fire special-shot aura (ega0085c). The object is ev6025vr00
# (effect/event/ev60/ev6025vr00/), built by research/scripts/volcanic_rock_ball_fx.py from the cut-in's effect object
# ev60025400. The trigger copies the fire special-shot aura's row (like = "ega0085c"): CB_SkillShootBallAura turns +Z
# along the ball's velocity every frame (aura-balon-tiro.md §2b).
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
schema = "VRFW.effect/1"

[[effect]]
name = "volcanic_rock"
from = "ega0085c"
object = "effect/event/ev60/ev6025vr00/ev6025vr00.objbin"

[[shot_aura]]
name = "volcanic_rock"
when = { techniques = ["whs02540"] }
aura = "volcanic_rock"
like = "ega0085c"
anchor = "kick"
drift = 0.75
