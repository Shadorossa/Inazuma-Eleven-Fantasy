# «Triángulo letal triturador» (Beyond the Death Zone, whs03180 and whs03180_or, same cut-in; forest shot of four
# players, cut-in ev60_03185): while the ball flies to the goal it keeps the end look of the cut-in's last cut with the
# ball (c0500 frame 410): the purple energy beam it draws (core, spirals, glows) with the ball inside its wide front,
# streaming back from it along the flight, drawn five times turned about the flight (the same look from the touchline
# and from behind); its pointed tip ahead of the ball as in the cut-in, fading out to its point; born at the kick
# point and revealed by distance, its far end faded; x0.32.
# The object is ev6318bz00 (effect/event/ev60/ev6318bz00/), built by research/scripts/beyond_the_death_zone_ball_fx.py
# from the cut-in's effect object ev60031800. Left out: the triangles (the fifth one with the energy sphere and light
# flares at the kick point, the players' triangles, the far ones), the black backdrop, the fake-particle cards; c0600
# (the beam re-staged through the triangles, no ball). docs/game/media/beyond-the-death-zone-ball-fx.md.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the forest special-shot aura's row (like = "ega0075d"). Flight:
# content\techniques\beyond_the_death_zone_trajectory.toml.
schema = "VRFW.effect/1"

[[effect]]
name = "beyond_the_death_zone"
from = "ega0075d"
object = "effect/event/ev60/ev6318bz00/ev6318bz00.objbin"

[[shot_aura]]
name = "beyond_the_death_zone"
when = { techniques = ["whs03180", "whs03180_or"] }
aura = "beyond_the_death_zone"
like = "ega0075d"
anchor = "kick"
drift = 0.75
