schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Aullido de lobo (Legendary Wolf, whs00600 / whs00600_mm, cut-in ev60_00600): one
# straight level line at 2.7 m from the kick point into the goal point, whatever the shot's length (the two side comets
# braid round the ball's comet 1.6 m off the flight: the turning braid stays clear of the grass).
# unblockable = false: the game's block rules (this mod changes no block rule).
# Heights are the ball centre over the pitch (m); the height is held.

# Aullido de lobo (whs00600).
[[edit]]
target = "whs00600"
trajectory = { points = [[0.0, 2.7]], straight = true, unblockable = false }

# Aullido de lobo, miximax version (whs00600_mm).
[[edit]]
target = "whs00600_mm"
trajectory = { points = [[0.0, 2.7]], straight = true, unblockable = false }
