schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Tiro supermasivo (Supermassive Shot, whs02100 and whs02100_mm, same cut-in
# ev60_02100; whs02100_mm covered by the base move's rule).
#
# In the cut-in's last shot (c0400) the ball (the effect's ball group: no event ball in c0200-c0400) ploughs dead level
# along the pitch, its centre 2.50 m up. Flight (owner's rule 2026-10-24: every aura shot a straight level line): one
# straight level line from the kick point to the goal at 2.0 m (a level 2.5 m run would clear the bar); the aura's
# ground parts are raised by the 0.5 m difference so they lie on the grass (research/scripts/supermassive_shot_ball_fx.py
# FLIGHT_HEIGHT: keep the two equal). unblockable = false: the game's block rules (this mod changes no block rule).
# Heights are the ball centre over the pitch (m); the height is held.

# Tiro supermasivo (whs02100).
[[edit]]
target = "whs02100"
trajectory = { points = [[0.0, 2.0]], straight = true, unblockable = false }
