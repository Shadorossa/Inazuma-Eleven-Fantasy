# «Strikers Shots»: the flight of Alba oscura (Black Dawn, whs02670, cut-in ev60_02670) (docs/framework/types/technique.md
# `trajectory`): one level line at 1.0 m from the kick point into the goal point (owner 2026-10-24: horizontal,
# never rising or falling; never the game's own curved / arched path), whatever the shot's length.
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m): points from the kick, goal_points counted back from the goal point; the first / last height is held.

# Alba oscura (whs02670).
[[edit]]
target = "whs02670"
trajectory = { points = [[0.0, 1.0]], goal_points = [[0.0, 1.0]], unblockable = false }
