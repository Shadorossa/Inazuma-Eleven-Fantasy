schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Cabezazo gigatón (Gigaton Head, whs02070 and whs02070_mm, cut-in ev60_02070).
#
# Measured: the event ball (b000001 slot s01) of ev60_02070 c0200 is headed at effect frame 340 at 1.70 m over the
# pitch (frames 332-340: 1.62 -> 1.70 m); the cut-in then lifts it toward its camera.
# Flight (owner's rule 2026-10-24: every aura shot a straight level line): one straight level line from the kick point
# to the goal, the ball centre at 1.70 m the whole way (the cut-in's header height). unblockable = false: the game's
# block rules (this mod changes no block rule). Heights are the ball centre over the pitch (m); the height is held.

# Cabezazo gigatón (whs02070).
[[edit]]
target = "whs02070"
trajectory = { points = [[0.0, 1.70]], straight = true, unblockable = false }

# Cabezazo gigatón, mixi-max (whs02070_mm).
[[edit]]
target = "whs02070_mm"
trajectory = { points = [[0.0, 1.70]], straight = true, unblockable = false }
