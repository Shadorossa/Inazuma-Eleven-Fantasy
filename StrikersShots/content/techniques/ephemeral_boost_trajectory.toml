schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Impulso efímero (Ephemeral Boost, whs02040 and whs02040_mm, same cut-in ev60_02040;
# whs02040_mm covered by the base move's rule).
#
# In the cut-in's last shot (c0500) the ball runs dead level 0.62 m up along +Z (research/scripts/ephemeral_boost_ball_fx.py).
# Flight: straight and level at 1.0 m into the goal (the ball glows' ring clear of the pitch). unblockable = false: the
# game's block rules (this mod changes no block rule). Heights are the ball centre over the pitch (m); points count
# from the kick; one point = a level flight; straight = true: one straight line from the kick to the goal at that
# height.

# Impulso efímero (whs02040).
[[edit]]
target = "whs02040"
trajectory = { points = [[0.0, 1.0]], straight = true, unblockable = false }
