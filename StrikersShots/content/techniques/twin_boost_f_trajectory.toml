schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Remate combinado F (Twin Boost F, whs00770 and whs00770_or, same cut-in ev60_00770;
# whs00770_or covered by the base move's rule).
#
# The comet reaches 1.7 m round the ball (research/scripts/twin_boost_f_ball_fx.py), so the ball flies one straight
# level line from the kick point to the goal at 1.8 m: the comet skims the grass and never cuts into it.
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); the height is held.

# Remate combinado F (whs00770).
[[edit]]
target = "whs00770"
trajectory = { points = [[0.0, 1.8]], straight = true, unblockable = false }
