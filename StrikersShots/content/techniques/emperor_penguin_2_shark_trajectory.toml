# «Strikers Shots»: the flight of Pingüino emperador n.º 2 + Tiburón (Emperor Penguin No. 2 feat. Shark, whs03330 and
# whs03330_or, same cut-in ev60_03330).
#
# Flight (owner's rule 2026-10-24: every aura shot a straight level line): one straight level line from the kick point
