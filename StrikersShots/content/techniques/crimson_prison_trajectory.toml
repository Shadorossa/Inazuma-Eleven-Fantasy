# (research/scripts/crimson_prison_ball_fx.py FLIGHT_H: keep the two equal). unblockable = false: the game's block
# rules (this mod changes no block rule). Heights are the ball centre over the pitch (m); points count from the kick;
# one point = a level flight; straight = true: one straight line from the kick to the goal at that height.

# Prisión escarlata (whs02380).
[[edit]]
target = "whs02380"
trajectory = { points = [[0.0, 3.0]], straight = true, unblockable = false }
