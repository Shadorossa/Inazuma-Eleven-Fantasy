schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Ataque Omega (Omega Assault, whs02280, cut-in ev60_02280).
#
# In the cut-in's last shot (c0030) the ball is fired out of the prism and flies one straight line along the
# rainbow. Flight: straight and level at 2.5 m into the goal, so the rainbow's lowest beams clear the pitch
# (research/scripts/omega_assault_ball_fx.py FLIGHT_H: keep the two equal). unblockable = false: the game's block
# rules (this mod changes no block rule). Heights are the ball centre over the pitch (m); points count from the kick;
# one point = a level flight; straight = true: one straight line from the kick to the goal at that height.

# Ataque Omega (whs02280).
[[edit]]
target = "whs02280"
trajectory = { points = [[0.0, 2.5]], straight = true, unblockable = false }
