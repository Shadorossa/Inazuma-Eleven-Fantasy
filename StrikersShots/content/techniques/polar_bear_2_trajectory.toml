schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Oso polar n.º 2 (Polar Bear No. 2, whs02770 and whs02770_or, same cut-in ev60_02770).
#
# In the cut-in's last shot (c0500) the bear's ice beam shoots the ball off its 8.3 m perch down a ~20 deg line; the
# aura lays that line along the flight. Flight: straight and level at 2.5 m into the goal (the aura's beam and glows
# clear the pitch). unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball
# centre over the pitch (m); points count from the kick; one point = a level flight; straight = true: one straight line
# from the kick to the goal at that height.

# Oso polar n.º 2 (whs02770).
[[edit]]
target = "whs02770"
trajectory = { points = [[0.0, 2.5]], straight = true, unblockable = false }

# Oso polar n.º 2 (whs02770_or).
[[edit]]
target = "whs02770_or"
trajectory = { points = [[0.0, 2.5]], straight = true, unblockable = false }
