# «Strikers Shots»: the flight of Fénix (The Phoenix, whs00410, cut-in ev60_00410): its own flight, as heights over
# distances (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7).
# One level line at 1.0 m from the kick point into the goal point (horizontal, never rising or falling), whatever the
# shot's length. unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball
# centre over the pitch (m); goal_points count back from the goal point, points from the kick; the first / last height
# is held.

# Fénix (whs00410).
[[edit]]
target = "whs00410"
trajectory = { points = [[0.0, 1.0]], goal_points = [[0.0, 1.0]], unblockable = false }
