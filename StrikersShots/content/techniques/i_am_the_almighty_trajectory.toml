schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Soy todopoderoso (I Am the Almighty, whs02340, and whs02340_mm), cut-in ev60_02340.
#
# In the cut-in's last shot (c0040) the drill dives from the vortex in the sky onto the goal mouth; the aura is turned
# onto the match flight. Flight: straight and level at 2.4 m into the goal (the drill, ~1.5 m round at its back, clears
# the grass). unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre
# over the pitch (m); points count from the kick; one point = a level flight; straight = true: one straight line from
# the kick to the goal at that height.

# Soy todopoderoso (whs02340).
[[edit]]
target = "whs02340"
trajectory = { points = [[0.0, 2.4]], straight = true, unblockable = false }

# Soy todopoderoso, miximax version (whs02340_mm).
[[edit]]
target = "whs02340_mm"
trajectory = { points = [[0.0, 2.4]], straight = true, unblockable = false }
