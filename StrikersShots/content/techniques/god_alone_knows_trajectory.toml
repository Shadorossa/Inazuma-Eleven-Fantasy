# (content\effects\god_alone_knows_ball.toml, ev6290ga00) lays its furrow and dust on the pitch under the ball at this
# height. No power, cost or block key. Inazuma Fantasy declares no trajectory for this move (no conflict).
#
# Background: in the cut-in's shot cut (c0500) the event ball (b000001 c_add_1_0) is struck down out of the sky,
