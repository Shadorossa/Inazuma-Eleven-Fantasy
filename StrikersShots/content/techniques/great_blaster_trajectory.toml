schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Gran explosión (Great Blaster, whs02180 and whs02180_mm, same cut-in ev60_02180;
# whs02180_mm covered by the base move's rule).
#
# In the cut-in's last shot (c0300) the ball flies one straight gentle line away from the camera left at the kick point
# (research/scripts/great_blaster_ball_fx.py). Flight: straight and level at 2.2 m into the goal (the beam's wide end
# clear of the pitch). unblockable = false: the game's block rules (this mod changes no block rule). Heights are the
# ball centre over the pitch (m); points count from the kick; one point = a level flight; straight = true: one straight
# line from the kick to the goal at that height.

# Gran explosión (whs02180).
[[edit]]
target = "whs02180"
trajectory = { points = [[0.0, 2.2]], straight = true, unblockable = false }
