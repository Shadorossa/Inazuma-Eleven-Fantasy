# «Strikers Shots»: the flight of Golpe justiciero (Pegasus Punch, whs01820, cut-in ev60_01820): its own flight, as heights over distances (docs/framework/technique.md §4e,
# docs/game/mechanics/move-mini-effects.md §7).
# In the cut-in (c0400) the ball dives from 20.17 m in a straight ~26 deg line to 1.13 m 38.45 m on; in the match it
# comes down that line into the goal at its own 1.13 m, counted back from the goal (a shorter shot starts at the line's
# height at the kick).
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move pegasus_punch):
# the event ball (s00) of ev60_01820 c0400, event frames 1406-1464: [[0.00, 20.17], [38.45, 1.13]] (largest
# height error 0.23 m).
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

# Golpe justiciero (whs01820).
[[edit]]
target = "whs01820"
# measured flight (lowered by _flight_height.toml): trajectory = { goal_points = [[38.45, 20.17], [0.0, 1.13]], unblockable = false }
trajectory = { goal_points = [[38.45, 4.5], [0.0, 1.13]], unblockable = false }
