# «Strikers Shots»: the flight of Zapatazo dual (Dual Strike, whs00590, cut-in ev60_00590): its own flight,
# as heights over distances (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7).
# One level line at 1.0 m from the kick point into the goal point (owner 2026-10-24: horizontal, never rising or
# falling; never the game's own curved / arched path), whatever the shot's length.
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

# Zapatazo dual (whs00590).
[[edit]]
target = "whs00590"
trajectory = { points = [[0.0, 1.0]], goal_points = [[0.0, 1.0]], unblockable = false }
