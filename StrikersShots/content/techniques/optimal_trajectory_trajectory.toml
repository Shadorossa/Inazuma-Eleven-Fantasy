schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Trayectoria perfecta (Optimal Trajectory, whs01560), cut-in ev60_01560.
#
# In the cut-in (c0200) the ball is kicked out of the target ring at ~0.1 m (frame 366) and climbs on a curve to ~4.9 m.
# Flight (owner's rule 2026-10-24: every aura shot a straight level line): one straight level line from the kick point
# to the goal, the ball centre at 1.50 m the whole way, so its glow (~0.5 m in radius) stays clear of the grass and the
# straight trail behind it runs level. unblockable = false: the game's block rules (this mod changes no block rule).
# Heights are the ball centre over the pitch (m); one point = a level flight; straight = true: one straight line from
# the kick to the goal at that height.

# Trayectoria perfecta (whs01560).
[[edit]]
target = "whs01560"
trajectory = { points = [[0.0, 1.50]], straight = true, unblockable = false }
