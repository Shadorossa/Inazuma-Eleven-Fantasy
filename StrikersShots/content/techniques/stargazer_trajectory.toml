# «Strikers Shots»: the flight of Tormenta estelar (Stargazer, whs02590). Nacho 2026-10-10: every aura move
# its own flight, heights over distances (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md
# §7).
# In the cut-in (c0200) the comet (the ball as a blue star) rises from 6.4 m to burst at 10.4 m; the shot itself is
# the meteor shower coming down at ~32 deg. In the match the ball starts at the burst's height and comes down the
# shower's line into the goal.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move stargazer):
# the comet's head (b_rot_02) of ev60_02590 c0200, effect frames 90-116: 6.38 m -> 10.42 m over 5.16 m (rising);
# the shower's streaks: 32 deg down on average (stargazer_ball_fx.py --trajectory). The 32 deg line from 10.42 m
# into 2.0 m = 13.47 m long.
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

# Tormenta estelar (whs02590).
