# «Strikers Shots»: the flight of Aguijones escarlata (Entropic Arrows, whs01620, cut-in ev60_01620).
# Owner 2026-10-25: a parabola. One smooth arc from 1.8 m at the kick point up to 4.0 m 12 m out and down to 1.8 m at
# the goal point (1.8 m: the lowest height where the arrow volley, ~3 m across at its widest, clears the grass; the
# aura turns along the ball's velocity, so the volley follows the arc). Declared at its height: _flight_height.toml
# keep_declared.
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick.
# hide_ball: the real match ball is not drawn while the shot flies (in the cut-in's last cut the ball has become the
# volley of scarlet arrows: its aura, effects\entropic_arrows_ball.toml); drawn again when the shot is over.

# Aguijones escarlata (whs01620).
[[edit]]
target = "whs01620"
trajectory = { points = [[0.0, 1.8], [12.0, 4.0]], goal_points = [[0.0, 1.8]], smooth = true, unblockable = false }
hide_ball = true
