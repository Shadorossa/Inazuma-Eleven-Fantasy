schema = "VRFW.technique/3"
# «Strikers Shots»: the flight of Vuelo de halcón (Falcon Glide, whs02690) and of the move with the same
# cut-in, Vuelo de águila calva (Bald Eagle Glide, whs02691), cut-in ev60_02690. Nacho 2026-10-10: every aura move its
# own flight, heights over distances (docs/framework/technique.md §4e, docs/game/mechanics/move-mini-effects.md §7).
# In the cut-in (c0400) the ball drops from 3.23 m to ~1 m within 3 m and glides low with the falcon, sinking to 0.28 m
# 23.1 m on. In the match (owner 2026-10-24, the shot auras' straight-flight rule): one straight level line from the
# kick point to the goal at the cut-in's glide height, 0.30 m, so the falcon aura is never tipped by a dive.
#
# Measured (research/scripts/shot_trajectory_from_cutin.py --points --move falcon_glide): the event ball (s01) of
# ev60_02690 c0400, event frames 1350-1458: [[0.00, 3.23], [0.48, 1.81], [2.79, 1.00], [23.11, 0.28]] (largest height
# error 0.24 m).
# unblockable = false: the game's block rules (this mod changes no block rule). Heights are the ball centre over the
# pitch (m); goal_points count back from the goal point, points from the kick; the first / last height is held.

# Vuelo de halcón (whs02690).
[[edit]]
target = "whs02690"
trajectory = { points = [[0.0, 0.30]], straight = true, unblockable = false }

