schema = "VRFW.camera_drive/1"
# «Strikers Shots»' shot camera: while a shot at goal is shown the match camera is the touchline view (the preset
# cameras\shot.toml, StrikersShots.shot), turned toward the goal while a shot can be chained (cameras\chain.toml,
# StrikersShots.chain), then the player's camera comes back. Every shot at goal of your team, always (no option row).
# The framework runs it every frame (docs/framework/camera-drive.md). Restart the game after a change.

[[VRFW.CameraDrive]]
name = "shot_view"
window = "shot"            # from the shooter's cut-in (or the kick) to the end of the shot, through chained shots
shots = "all"              # every shot at goal, basic or special, long or not
preset = "shot"            # the touchline view while the shot flies
chain_preset = "chain"     # while a shot can be chained («Oportunidad de cadena de tiros»): turned toward the goal
# Priority of the match camera request: BetterQoL's «Cámara del partido: Lateral» requests 0, so shots get this view with
# «Lateral» on too. A mod that requests a higher priority keeps its camera during shots.
priority = 10
# true = the camera switches at once; false = the game's next camera change uses the view.
rebuild = true
# Seconds the camera takes to swing round the play into the view at the kick, and back to your camera after the shot
# (0 = cut). The pitch always stays inside the side range: never up into the sky, never under the pitch.
turn_in_s = 0.0            # no swing to the touchline: the field camera is already there when the cut-in ends
turn_out_s = 0.8
# A shot that starts at most this many seconds after a special move's cut-in ended gets the view at once (no swing).
cut_in_window_s = 2.0
# Event groups of the shooter's cut-ins (VR-Framework match events, defaults\match_events.toml: shot = the game's ev60
# events). One of them starting sets the view at once, behind the cut-in.
shooter_groups = ["shot"]
# Whose shots get the view: "own" = only your team's shots; a rival's shot (your keeper / defenders receive it) keeps the
# game's own camera, its auras and effects unchanged. "all" = every shot, "rival" = the rival's only.
side = "own"
