icon = "general"
notes = [
    "Cámara de banda que sigue el tiro como en la tele.",
    "Siete auras de tiro terminadas, como en su escena.",
    "Tiros con aura en línea recta a la portería.",
    "Goles especiales que rompen la portería (opción).",
    "Solo visual: no cambia potencia ni bloqueos.",
]

