id = "all_changed"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "All Changed"
version = "1.1.4"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Custom mode changes: any player can get his own «Modo cambio» into any other character you own. In a match he swaps into that player (look, stats and moves) and back again with RB+B, as often as you like, with 25 seconds between two swaps; no cost and no time limit, and a green aura while the change runs. The retail mode changes stay as they are. Works with the VR-Framework alone; Inazuma Fantasy puts the change on its Hiper and adds its own rules."
priority = 0
tags = ["Gameplay", "Characters"]
updated = "2026-10-14"
# This mod's own names (TOML keys [AllChanged.X], Lua AllChanged.X, commands CMND_ALLCHANGED_*); never VRFW.
prefix = "AllChanged"
folder = "AllChanged"
# Split out of Inazuma Fantasy on 2026-10-14 (docs/game/mods/all-changed.md, docs/refactor/aura-mods-split.md): IF
# requires it and keeps only its rules (its Hiper slot, its skill table, its partner rules). Standard mod layout
# (docs/framework/mod-layout.md):
#   content\techniques\auras\mode_change.toml   the «Modo cambio» commands wmc_evt_create / wmc_evt0..7 + their texts
#   content\base_tables\...\item_config.toml    their items, by key (same ids / catalog numbers as IF's saves)
#   content\transforms\mode_change.toml         the carriers hidden from the ability lists ([ability_list])
#   content\extra_slots\change.toml             the swap in a match (fallback plates slot, mix slot only)
#   content\effects\mode_change_aura.toml       the green aura of a created change
#   content\game\mode_change.toml               the commands CMND_ALLCHANGED_MC_* + the save import of IF's blob
#   scripts\all_changed.lua (+ lib\cards.lua)   the store (blob mode_change.json), the commands, the exports, the aura
#   content\skill_tabs\mode_change_tab.toml  the «Modo cambio» tab of the «Habilidades» list (category 106, its icon,
#                                               title text key skill_tab_mode_change, filter; the VR-Framework's skill tab
#                                               registry, docs/framework/card-types.md §3; moved from Inazuma Fantasy)
#   content\pairing\change.toml              its «Crear nuevo cambio» row of Character Reforged's create entry (skill board)
# vr_framework 2.2.220: the plates slot's `fallback` / `[source] mix_only`. character_reforged 1.1.0: the shared base of
# the aura mods (its create entry on the skill board is the base game's creation screen of a change).
requires = ["vr_framework>=2.4.39", "character_reforged>=1.3.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["command", "hook"]

# What other mods call: a mod that requires all_changed sees AllChanged.<name> (scripts\all_changed.lua §exports).
[exports]
functions = ["On", "Items", "Add", "List", "Item", "Equip", "Delete", "Get", "Reservation", "PartnerOk", "CandidateRows", "ReservedBy", "IsBase", "Pairs", "Carrier"]
keys = []

# its own content/ folder read only by scripts (Character Reforged's create entry): vrfw check's layout lint accepts it
[layout]
script_folders = ["pairing"]

# A MODULE of Character Reforged (owner request 2026-10-14, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 30
