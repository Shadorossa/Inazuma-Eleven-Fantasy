id = "new_techniques"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml). «New Techniques» in every language for now (the owner may rename it).
name = "New Techniques"
version = "1.0.5"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Five new special moves, each with its own scene, effects, name banner and manual: Golpe del abismo (void shot), Vuelo angelical (wind shot), Campo nuclear (void block), Zona oscura (forest block) and Dispersión (void catch). With Inazuma Fantasy their manuals are sold in its training shop. Names in Spanish for now. Always on: the mod has no options."
priority = 0
tags = ["Techniques"]
updated = "2026-10-16"
# This mod's own names (TOML keys [[NewTechniques.X]], Lua NewTechniques.X, any later text, command or key); never VRFW.
prefix = "NewTechniques"
folder = "NewTechniques"
# PERSONAL until the owner confirms where the downloaded files come from (docs/release/new_techniques.md §1): the
# whole mod stays out of every release pack (research/scripts/release_exclude.py PERSONAL_MODS).
# Data only, standard mod layout (docs/framework/mod-layout.md):
#   content\techniques\new_techniques.toml      the five moves (fixed keys whs90208, whs90236, whd92114, whd92149,
#                                               whk93113), each a clone of a retail move
#   text\rows\skill_text.toml                   their names / descriptions (Spanish; other languages TODO)
#   content\telops\any\                         their name banners (PNG + list, cloned from the base's banner)
#   content\base_tables\event\…, event_cfg\…
#                                               their events' light lists and command lists (deltas on the base events)
#   assets\data\common\event\ev6x\…             their events' animation packs and cameras (native)
#   content\models\effects\ + assets\models\effects\
#                                               the recoloured effect objects (native models)
#   content\base_tables\effect\, gamedata\skill\skill_config.toml
#                                               Golpe del abismo's ball auras (effect rows, triggers, colour row 10)
#   content\shops\training_shop.toml            the manuals in Inazuma Fantasy's move shops
# README.md is a developer file, never installed. Generated parts: research/scripts/new_techniques_build.py.
requires = ["vr_framework>=2.0.88"]
conflicts = []

# Nothing for other mods yet: no Lua functions, no [[NewTechniques.X]] keys. Content ids (public by id):
# the moves new_techniques.abyss_strike, .angel_flight, .nuclear_field, .dark_zone, .dispersion.
[exports]
functions = []
keys = []
