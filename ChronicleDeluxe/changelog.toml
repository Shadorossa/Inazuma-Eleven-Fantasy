# Chronicle Deluxe: ONE general summary of what the mod offers, shown on «Novedades de mods» (docs/framework/types/changelog.md).
# Rules (the parser refuses the rest): a single [[release]], NO version / date keys, ONE page in every language
# (at most 7 rows under the mod's name: 56 letters per row, 28 CJK characters; a longer note takes 2 rows).
# Do not touch it on a version bump. Rewrite it only when what the mod offers changes.
# 1.0.0 (2026-10-14): new mod (the Umbrella / Sally's nodes and the drop lists' AURAS section, from Inazuma Fantasy).
# 1.1.0 (2026-10-14): rewritten with the chain «Ruta prémium de Sonny».
