schema = "VRFW.menu/2"
# Chronicle Deluxe: the free-match class card's level ball shows the class level with 3 digits (Lv 200 of BATALLA
# LEGENDARIA; docs/game/mods/chronicle-deluxe-free-match.md). The card's number 0xAA5F9EE0 (num_menu01b_02_ of
# vsroute01_21_sub_list) is drawn at most 99 by retail (DispMaxValue 99, 2 digit slots: the slots are the base table
# content/base_tables/menu/config/menu_graphic_number_config.toml). At the retail 17 x 23 digit slot «200» is
# 53 px on the ball's 44 px disc, so the digit slot _num_enemy_lv_dmy01 of vsroute01_21.g4pkm takes the size of the
# retail condensed slot _num_enemy_lv_dmy02 of the Chronicle difficulty list (vsroute01_16: 13 x 23 at -6.5, the same
# ball and digits): 3 digits = 41 px, 2 digits = 27 px, centred. Values from the v7.1.2 layouts (as the old Inazuma
# Fantasy's free-match class cards).

[[object_set]]
object = "vsroute01_21_sub_list"
set = [
    { param = "DispMaxValue", match = { 1 = 0xAA5F9EE0 }, values = { 2 = 999 } },
]

[[layout]]
file = "common/menu/30_vsroute/vsroute01/vsroute01_21/vsroute01_21.g4pkm"
joint = "_num_enemy_lv_dmy01"
translate = [-6.5, 0.0, 0.0]
scale = [13.0, 23.0, 1.0]
