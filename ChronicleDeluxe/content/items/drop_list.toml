schema = "VRFW.item/2"
# Chronicle Deluxe: the «AURAS» section of the match drop lists (moved from Inazuma Fantasy on 2026-10-14, owner).
# The drop-rate list («Tasa de aparición» of the Chronicle board) and the «Cadena de Crónica» panel's mini drop list show
# the aura items a match drops in their own «AURAS» section at the end of the list, under its own header, each row drawn
# as its aura's banner (band by aura type and element, the aura's art, the item icon, the rate).
# The mechanism is the VR-Framework's (item type [VRFW.DropList.Auras], item_engine drop_list_rt, graft vrfw_drop_list,
# docs/framework/drops.md §5); this mod only declares which items form the section. Since VRFW 2.4.17 each part of
# [VRFW.DropList] comes from the mod that declares it, so another mod's list order (Inazuma Fantasy's) still applies.
# Works on the base game: every sub-category below is an item_config sub-category of the game.

# The section, in this order: keshin (ITEM_SPECIAL_SKILL_INFO sub-category 171), totems (174), Mix-Max (173), mode
# changes (178).
[VRFW.DropList.Auras]
Subs = [171, 174, 173, 178]

# The player-spirit rows («ESPÍRITUS») go forwards, midfielders, defenders, goalkeepers, then by name: the VRFW's
# default order of the drop-rate list ([VRFW.DropList.SpiritOrder], docs/framework/drops.md §5c), from the game's
# character data; nothing to declare here.

# The drop-rate list's items in three sections (owner 2026-10-21; docs/game/mods/chronicle-deluxe.md §18): «OBJETOS»
# (the game's own header: books, points, tokens and every other plain item), then «SUPERTÉCNICAS» (the technique
# manuals: shots, dribbles, blocks, saves, each run in the list's order), then «EQUIPACIÓN» (boots, bracelets,
# accessories, special gear, kits, crests); the «AURAS» section above stays last. The mechanism is the framework's
# ([[VRFW.DropList.Sections]], docs/framework/drops.md §5d); the header pictures are this mod's
# (content\images\menu\10_win\win05\win05_38_sections.toml, from text\rows\drop_list_sections.toml).
[[VRFW.DropList.Sections]]
Header = "chronicle_deluxe_gtxt_techniques01"
Subs = [161, 162, 163, 164]                  # the technique manuals
Techniques = ["shoot", "dribble", "block", "catch"]

[[VRFW.DropList.Sections]]
Header = "chronicle_deluxe_gtxt_gear01"
Categories = [30, 40, 50, 60, 80, 90]        # boots, bracelets, accessories, special gear, kits, crests
