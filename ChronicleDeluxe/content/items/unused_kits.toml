schema = "VRFW.item/2"
# Kit items of uniforms that are in the game with no item and no team wearing them (docs/game/kits-unused.md A1 / A4).
# Hand-made (not generated). The first heroic win of the kit's team gives it (config.toml [heroic] extra_kits ->
# research/scripts/chronicle_deluxe_heroic_build.py -> content/base_tables/gamedata/soccer/soccer_prize_config.toml).
# The Victory Road «(V)» kits use the item sheets' own icon (key_id: the id is the CRC of icon_key) and are cloned from
# «Equipación Alpino (V)»; the second kits of Sílice, Naiadi and G. de la Reina have no icon in the game and show the
# icon of the team's normal kit (their id is the CRC of chronicle_deluxe.<name>).
default_lang = "es"

