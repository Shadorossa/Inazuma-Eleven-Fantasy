schema = "VRFW.item/2"
# Chronicle Deluxe: the key item «Sello del Maestro» (Master's Seal), docs/game/mods/chronicle-deluxe.md §10. Owned once
# the save has won the gate battle (difficulty 2) of the Chronicle gate piece Destructores (fbtl_cro12_080_010, piece
# 0x90185427), the gate battle Chronicle Deluxe keeps on gate pieces; a save that won it before owns it at once. What it
# does is content\unlimited_copies\master_seal.toml (the VR-Framework's unlimited copies). Its icon: the texture ke000900
# of the key-item sheet (content\images\menu\200_icon\02_icon_item\icon_item02.toml).
default_lang = "es"

