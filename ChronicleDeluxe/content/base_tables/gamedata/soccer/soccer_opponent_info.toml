schema = "VRFW.base_table/1"
# Chronicle Deluxe: the IE1 tab of «Competir contra bots» (owner 2026-10-19; docs/game/mods/chronicle-deluxe-free-match.md
# §8). The list shows the rows of this table in table order, each under the tab of the first board piece that holds its
# game (docs/framework/free-match-tabs.md §1); a row is listed once that piece's Chronicle battle is won.
#   * the first Royal Academy game (the opening match, before Inazuma Kids FC) leaves the list;
#   * the board side nodes Umbrella and Street Sally's (content/teams/70_route_nodes/side_nodes.toml) are listed in the
#     IE1 tab, right after Inazuma Kids FC and Brain, the games they follow on the board. Their node games already have
#     the free-match class rows (their template's, rival = the node's team), so they offer the same three classes; they
#     open with the node's Crónica win (the node's piece); the clear bits of their class rows are the framework's
#     (free-match-tabs.md §8). Each new row is a copy of the row it follows (category 1, no condition: as every IE1 row).
# Keyed by game name (battleId): no row position, no number.

[[keyed]]
table = "soccer/soccer_opponent_info"
key_columns = ["battleId"]

  [[keyed.add]]                         # Umbrella, after Inazuma Kids FC
  key = "evt_rn_ie1_umbrella"
  from = "fbtl_cro01_020_010"
  after = "fbtl_cro01_020_010"

  [[keyed.add]]                         # Street Sally's, after Brain
  key = "evt_rn_ie1_sallys"
  from = "fbtl_cro01_050_010"
  after = "fbtl_cro01_050_010"

  # 1.11.10 (owner 2026-10-19): Mar de Árboles (the IE2 side node), in the IE2 tab after Emperadores Oscuros (moved
  # right after Jóvenes Inazuma by teams/90_rules/free_match.toml [[VRFW.FreeMatchPlace]])
  [[keyed.add]]                         # Mar de Árboles, a copy of Emperadores Oscuros's row
  key = "evt_rn_ie2_forest"
  from = "fbtl_cro02_200_010"
  after = "fbtl_cro02_200_010"

