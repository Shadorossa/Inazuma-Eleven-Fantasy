schema = "VRFW.base_table/1"
# Chronicle Deluxe: the free-match class card's level number 0xAA5F9EE0 ("num_menu01b_02_", vsroute01_21_sub_list) gets
# 3 digit slots like its retail twin 0x32C4EC17 (the same digits, centred, spacing 1, in the same ball of the Chronicle
# difficulty list), so the card's ball shows 200 (content/menus/free_match_class_level.toml;
# docs/game/mods/chronicle-deluxe-free-match.md). Keyed by the number's id (column #0): its row position differs per
# game build (v7.1.2 row 353, v7.2.1 row 358).

[[keyed]]
list = "MENU_GRAPHIC_NUMBER"
key_columns = ["#0"]

  [[keyed.set]]
  key = 0xAA5F9EE0                      # "num_menu01b_02_": max digits 2 -> 3
  cells = { "#5" = 3 }
