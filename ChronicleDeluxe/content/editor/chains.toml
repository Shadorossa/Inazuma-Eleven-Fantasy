schema = "VRFW.editor/1"
# Chronicle Deluxe: the ModManager editor of its Chronicle CHAIN boards (docs/framework/modmanager-editor-schemas.md).
# ModManager reads this file and builds the editor from it: the chains listed in «Eventos», «Nuevo» (a new chain and
# its node on the Chronicle board), the board's tiles on a grid (move, add, link), each tile's team / level / rewards /
# chest contents / conditions, and the chain node's place on the Chronicle board (the board editor and its line
# simulator). It edits the files below IN PLACE. Read only by ModManager: the game does not read content\editor\.
#
# The chains themselves are the framework's [[VRFW.Chain]] boards (docs/framework/chain-board.md) and their
# [[VRFW.RouteNode]] Chain = … nodes. chain_ie1_sonny.toml is generated by research/scripts/chronicle_deluxe_chains_build.py
# from _chains.toml: edits made here to that file are lost when it is generated again (bring them into _chains.toml or
# stop generating that chain). New chains go to chains_added.toml, which no builder writes.

[[Editor]]
Id = "chains"
Title = { es = "Cadenas de Crónica", en = "Chronicle chains" }
Help = { es = "Las cadenas del tablero de Crónica de este mod: sus casillas, rivales, premios, cofres y condiciones.", en = "This mod's Chronicle board chains: their tiles, rivals, rewards, chests and conditions." }
Section = "events"
Files = ["content/teams/70_route_nodes/chain*.toml"]
Table = "VRFW.Chain"
Key = "Name"
Label = "Title"
Shape = "chain"
New = "content/teams/70_route_nodes/chains_added.toml"
  # a new chain: Zeus's match rows at Heroica, a 5 x 3 board with its start tile
  [Editor.Template]
  TemplateGame = "fbtl_cro01_120_010"
  Difficulty = 4
  Board = { Cols = 5, Rows = 3 }
  Tile = [{ Id = "start", Kind = "start", Pos = [1, 2] }]
  # its node on the Chronicle board (placed afterwards with the board editor)
  [Editor.Companion]
  Table = "VRFW.RouteNode"
  Field = "Chain"
  View = "chronicle_node"
    [Editor.Companion.Template]
    Name = "chain_{key}"
    Slot = "{slot}"
    After = "fbtl_cro01_120_010"
    Dir = "RU"
    Team = "tm_cro_legend_ie1_11"        # only gives the piece a game (never played)
    TemplateGame = "fbtl_cro01_120_010"
    Difficulties = [4]

# ---------------------------------------------------------------------------------------------------- shapes

[[Shape]]
Id = "chain"
  [[Shape.Field]]
  Key = "Name"
  Type = "id"
  Required = true
  Label = { es = "Clave", en = "Key" }
  Help = { es = "La clave de la cadena (chronicle_deluxe.<clave>): su progreso se guarda con ella; no la cambies si ya está publicada.", en = "The chain's key (chronicle_deluxe.<key>): its progress is saved under it; do not change it once released." }
  [[Shape.Field]]
  Key = "Title"
  Type = "text"
  Label = { es = "Título", en = "Title" }
  [[Shape.Field]]
  Key = "TemplateGame"
  Type = "ref"
  Ref = "match"
  Required = true
  Label = { es = "Partido base", en = "Template match" }
  Help = { es = "Cada partido de la cadena copia las filas de este partido (IA, recompensas, estadio).", en = "Every match of the chain copies this match's rows (AI, rewards, stadium)." }
  [[Shape.Field]]
  Key = "Difficulty"
  Type = "int"
  Min = 1
  Max = 4
  Label = { es = "Dificultad", en = "Difficulty" }
  [[Shape.Field]]
  Key = "Stadium"
  Type = "ref"
  Ref = "map"
  Label = { es = "Estadio", en = "Stadium" }
  [[Shape.Field]]
  Key = "Board"
  Type = "table"
  Of = "board"
  Label = { es = "Tablero", en = "Board" }
  [[Shape.Field]]
  Key = "Page"
  Type = "list"
  Of = "page"
  Label = { es = "Páginas", en = "Pages" }
  [[Shape.Field]]
  Key = "Tile"
  Type = "list"
  Of = "tile"
  Label = { es = "Casillas", en = "Tiles" }
  [[Shape.View]]
  Kind = "node_map"
  List = "Tile"
  Id = "Id"
  Pos = "Pos"
  Links = "Links"
  Page = "Page"
  Style = "Kind"
  Cols = "Board.Cols"
  Rows = "Board.Rows"
  Layout = "Board.Layout"
  Colours = { start = "#d83a3a", match = "#7fb2e0", chest = "#a99ad8", dchest = "#c08ad8", schest = "#d8b04a", slot = "#e08a3a", blocked = "#9a3a3a" }

