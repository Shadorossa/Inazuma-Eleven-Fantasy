schema = "VRFW.team/2"
# Chronicle Deluxe (docs/game/mods/chronicle-deluxe.md §8.3): «Competir contra bots» opens every class of an opponent
# together. Retail locks class k of a Chronicle opponent (rows 6-9) until its Chronicle difficulty k is won (Crónica,
# route unlock, unusual items, Heroica): with the unusual-items battle gone, class 8 would never open, and the owner's
# rule is that the Batalla heroica unlocks nothing. With "together" an opponent opens with its lowest class, i.e. with
# the Crónica win (the framework's rule, docs/framework/free-match-tabs.md §8; per key: another mod's other keys stay).
[VRFW.FreeMatch]
Unlock = "together"
# The single «best» orb (docs/game/mods/chronicle-deluxe-free-match.md §7): each opponent row shows one pill with the
# orb of the highest class won (INAZUMA / ZONA LETAL / BATALLA LEGENDARIA), nothing lit when none is won; the same
# gauge goes under the selected crest of BetterMenu's Competition strip.
Orb = "best"
# The class menu has no clear / advantage-win marks nor their box (owner 2026-10-21: «quita los ticks»): each class card
# shows its class's orb instead, as a colour legend only (assets\lua\soccer_vs_cpu_class_select_menu\
# 280_free_match_class_orbs.lua; docs/game/mods/chronicle-deluxe-free-match.md §17).
ClearTicks = false

# Equipo Ogro in the IE3 tab (owner 2026-10-19; docs/game/mods/chronicle-deluxe-free-match.md §9): its game (the last
# IE1 board battle) is listed under the IE3 tab, right after Pequeños Gigantes (owner 2026-10-22: with Sky Team and
# Dark Team before it, below); the board keeps its piece. The framework lists a copy of the game
# in a hidden piece of that tab with the same unlock (the Ogre Crónica win) and the same clear bits (an old save keeps
# its won classes) (docs/framework/free-match-tabs.md §9).
[[VRFW.GameTab]]
Game = "fbtl_cro01_130_010"        # Equipo Ogro
Tab = 2                            # IE3
After = "fbtl_cro03_180_010"       # Pequeños Gigantes

