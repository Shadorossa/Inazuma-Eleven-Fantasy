schema = "VRFW.team/2"
# Chronicle Deluxe (owner 2026-10-22; docs/game/mods/chronicle-deluxe-free-match.md §18): the two Raimon of the Ares tab of
# the free match, two different teams with their own names (the game's Chronicle line-ups are both named «Raimon»):
#   fm_raimon_ares      the line-up that faces Barcelona Orb (pltm_cro_ie7_01): «Raimon (Ares)», this mod's text
#   fm_raimon_island    the line-up of the Ares final (pltm_cro_ie7_13): the game's team name «Raimon Isla Remota»
