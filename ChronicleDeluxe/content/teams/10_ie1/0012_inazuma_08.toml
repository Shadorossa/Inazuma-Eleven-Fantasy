  { card = 0xE80811F1, slot = 2, number = 3, rarity_step = 1 },   # Ricky Clover (DF)
  { card = 0xB678FCB6, slot = 3, number = 4, rarity_step = 1 },   # Tammy Fielding (DF)
  { card = 0xBADFCAC5, slot = 4, number = 5, rarity_step = 1 },   # Light Nobel (MF)
  { card = 0x62821416, slot = 5, number = 6, rarity_step = 1 },   # Steve Eagle (MF)
  { card = 0xD0A05E79, slot = 6, number = 7, rarity_step = 1 },   # Arion Matlock (MF)
