schema = "VRFW.team/2"
# Chronicle Deluxe (2026-10-14): «Ases de Inazuma» (Inazuma '08, イナズマ'08) of IE1, the last rival of the lower branch of
# the chain «Ruta prémium de Sonny» (content/teams/70_route_nodes/chain_sonny.toml). The same team key as the set-aside
# Chronicles Deluxe's «Inazuma '08» (ct_iy_08, the same team id and the same 11 players). Here: the wiki lineup
# (docs/game/data/wiki-missing-teams.csv, https://inazuma-eleven.fandom.com/wiki/Inazuma_'08) with each card's own
# moves, the formation / tactics of the retail «FF National Pick A» legend team (as Chronicles Deluxe's), the wiki crest
# (WebP -> PNG, no resize).
default_lang = "en"

[[team]]
name = "ct_iy_08"
key = "evt_ct_iy_08"
