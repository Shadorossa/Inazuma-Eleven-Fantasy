schema = "VRFW.team/2"
# Chronicle Deluxe (2026-10-14): Strange Guys («Sospechosos», あやしいやつら) of IE1, a rival of the chain «Ruta prémium de
# Sonny» (content/teams/70_route_nodes/chain_sonny.toml, upper branch #8). VR has no such team (Chronicles Deluxe's
# «Sospechosos A / B» are the IE2 rosters). Roster: the wiki lineup (docs/game/data/wiki-missing-teams.csv, «IE2 | Game
# opponent», https://inazuma-eleven.fandom.com/wiki/Ayashii_Yatsura): its 11 players resolved to their retail cards,
# keeper first, then defenders, midfielders, forwards (chara_param position). Formation / kit / tactics: Team Ogre's,
# as the other wiki route teams (the wiki formation is not mapped). Crest: the remastered wiki crest (Chronicles
# Deluxe's ie1_ayashii_yatsura.png, the same art as the IE2 A / B teams).
default_lang = "en"

