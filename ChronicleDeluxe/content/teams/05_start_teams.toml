schema = "VRFW.team/2"
# Chronicle Deluxe (chronicle_deluxe, 1.2.1, 2026-10-14): the three starting teams of a NEW save (the
# `select_first_team_menu` choice, docs/game/mods/chronicle-deluxe.md §8.8). Owner: the three teams keep their game
# names, crests, kits, team level (2) and coach (Clark von Wunderbar, slot 19); only the eleven players and the
# formation change, to the owner's three line-ups: IE1 players + Victorio Cryptix in his normal form (card 0x2AA62CA1,
# the card the game's shops sell; not the possessed c11600090 nor the young c11600110).
# Captain: Victorio Cryptix, the centre forward, in all three (the game's captains sat on slots of formations that
# change here: team 1 slot 8, team 2 slot 2, team 3 slot 8).
# Per team two edits: (1) the line-up, the eleven cards in formation order (new rows: the old captain flag is cleared);
# (2) `patch` rows that put back the cells of the game's rows a new row resets: every starter's boots (0x6D5D11A0, the
# game's start-team boots) and the game's per-slot level offset (+1 on three slots per team).
# Slots = the formation's places (formation_config startPos; x < 0 = left on the formation screen).
default_lang = "en"

