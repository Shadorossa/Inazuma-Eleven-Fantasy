# 70_route_nodes/chain_ie2_marytimes.toml). The same team as the set-aside Chronicles Deluxe's (generated there by
# research/scripts/wiki_teams_build.py from the wiki lineup; same key, so the same team id). Not in the Battle Bay grid
# here (no `appears`).
default_lang = "en"
# Source: research/scripts/wiki_teams_build.py (Chronicles Deluxe), docs/game/data/wiki-missing-teams.csv.
# Little Team (IE2, «Oumihara's Coach's route» #3; report status: missing).
