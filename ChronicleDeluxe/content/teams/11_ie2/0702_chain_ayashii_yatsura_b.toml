# The same team as the set-aside Chronicles Deluxe's (generated there by research/scripts/wiki_teams_build.py from
# the wiki lineup; same key, so the same team id): while chronicles_deluxe is active this file is left out and that
# mod's identical team is used. Not in the Battle Bay grid here (no `appears`).
