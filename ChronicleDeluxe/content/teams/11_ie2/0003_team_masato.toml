schema = "VRFW.team/2"
# Chronicle Deluxe (2026-10-21): a rival of the chain «Ruta del entrenador del Mary Times» (content/teams/
# 70_route_nodes/chain_ie2_marytimes.toml). The same team as the set-aside Chronicles Deluxe's (generated there
# by research/scripts/wiki_teams_build.py from the wiki lineup; same key, so the same team id): while chronicles_deluxe
# is active this file is left out and that mod's identical team is used. Not in the Battle Bay grid here (no `appears`).
if_not_mod = "chronicles_deluxe"
default_lang = "en"
# Source: research/scripts/wiki_teams_build.py (Chronicles Deluxe), docs/game/data/wiki-missing-teams.csv.
# Team Masato (IE2, «Oumihara's Coach's route» #3; report status: missing).
# Roster: wiki lineup «IE2 |  | Game opponent», https://inazuma-eleven.fandom.com/wiki/Team_Masato
[[team]]
name = "ct_wk_team_masato"
key = "evt_ct_wk_team_masato"
based_on = "tm_cro_ie2_2020" # Dark Emperors: formation, kit, tactics (the wiki formation is not mapped)
kit = 0xC1F231A9                          # the neutral kit of the wiki route teams (wiki: Future Wear away, not a VR kit)
level = 55
series = "IE2"
roster = "exact"
member = [
  { card = 0x502F6ED3, slot = 0, number = 1, rarity_step = 1 }, # Yellow S = Eddy Pentaris (GK)
  { card = 0x7AC05727, slot = 1, number = 2, rarity_step = 1 }, # Platina = Tim Platton (DF)
  { card = 0x6B8669CB, slot = 2, number = 3, rarity_step = 1 }, # Yokochi = Dave Lung (GK)
  { card = 0xA29D89F4, slot = 3, number = 4, rarity_step = 1 }, # Green = Truman Verdy (DF)
  { card = 0x62190C51, slot = 4, number = 5, rarity_step = 1 }, # Blue S = Stan Treece (MF)
  { card = 0xDA7D54CE, slot = 5, number = 6, rarity_step = 1 }, # Hijikata Raiden = Thor Stoutberg ({'IE2': 'FW', 'IE3': 'MF'})
  { card = 0xBB86B8B5, slot = 6, number = 7, rarity_step = 1 }, # Blue = Chance Cerulean (MF)
  { card = 0x7B023D10, slot = 7, number = 8, rarity_step = 1 }, # Green S = Bobby Duo (DF)
  { card = 0xF150070D, slot = 8, number = 9, rarity_step = 1, captain = true }, # Gouenji Masato = Syon Blaze (FW)
  { card = 0x3443ABD7, slot = 9, number = 10, rarity_step = 1 }, # Red S = Gary Primo (FW)
  { card = 0x49345F92, slot = 10, number = 11, rarity_step = 1 }, # Pink S = Lillie Quattro (MF)
