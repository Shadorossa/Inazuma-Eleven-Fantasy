schema = "VRFW.team/2"
# Chronicle Deluxe: the rival of the Chronicle side node `galaxy_raimon` (content/teams/70_route_nodes/side_nodes.toml):
# Galaxy 3DS chapter 3, Raimon (btl0004, 3DS Lv 9), which has no VR Chronicle team. Roster = the 13 players of the 3DS
# match (research/data/galaxy3ds/story_matches.json), in its order (3DS slots 1-11 starters, 12-13 bench) with its kit
# numbers; each card is the one VR's GO Raimon team bb_08_team_raimon_go plays for that character (all 13 are in it;
# its other members, Arion, Riccardo, Victor and coach Mark Evans, play for Earth Eleven in this match and are left
# out). Formation, kit and crest through based_on. Levels and moves come from
# research/scripts/chronicle_deluxe_story_teams_build.py (15_galaxy/0310_galaxy_story_teams.toml, the node's `Story`).
if_not_mod = "chronicles_deluxe"
default_lang = "en"

