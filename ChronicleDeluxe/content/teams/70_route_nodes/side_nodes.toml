# Player spirits (owner 2026-10-14: «Umbrella y Sally's deben poder dropear espíritus como el resto de partidos de
# Crónica»). The rule of every retail Chronicle board row (v7.1.2 soccer_game_config, all IE1 pieces): col 29
# spirit_chara_table = 0 and cols 31 / 33 spirit_drop_table(_2) = 0. With 0 the engine (nie.exe 0x15C7850 /
# 0x15CC810, docs/framework/drops.md §1b) offers the players of the row's own rival team (team_config: the node's
# Umbrella / Sally's roster) with the default odds of the difficulty: Heroica 0x569BC5E0 + 0xA3C5921B, the higher classes 0x219CF576 / 0xD4C2A28D.
# The candidates are declared here (the rival roster only, whatever template or `DropsFrom` game the build meets); the
# odds are left to the mod's Chronicle rules like every other piece: the Crónica gets the spirit tables of
# 90_rules/chronicle_spirits.toml (since 1.6.0), the Ídolo entries leave every row (no_idol_spirits.toml). No ids of
# players or tables: the roster is the team's own.
[[VRFW.GameDrops]]
Game = "evt_rn_ie1_umbrella"
SpiritChara = "0"                      # the rival roster only (no extra players)

[[VRFW.GameDrops]]
Game = "evt_rn_ie1_sallys"
SpiritChara = "0"

[[VRFW.GameDrops]]
Game = "evt_rn_ie2_forest"
SpiritChara = "0"

[[VRFW.GameDrops]]
Game = "evt_rn_go_royal_practice"
SpiritChara = "0"

[[VRFW.GameDrops]]
Game = "evt_rn_cs_omega3_side"
SpiritChara = "0"

[[VRFW.GameDrops]]
Game = "evt_rn_galaxy_raimon"
SpiritChara = "0"

[[VRFW.GameDrops]]
Game = "evt_rn_galaxy_naiadi_side"
SpiritChara = "0"
