schema = "VRFW.team/2"
# HAND-MAINTAINED (the owner's, ModManager-editable; _chains.toml [[hand_chain]] ie2_rika: only rivals_ie2_rika.toml is
# generated, by research/scripts/chronicle_deluxe_chains_build.py). The IE2 post-game routes of Suzette's (Rika's)
# mother (wiki «Rika's Mother's route», DS PracticeGame2B) and of the secret warehouse (wiki «Maniya Saito's route», DS
# PracticeGame4B) on ONE board (owner 2026-10-22). Rivals at the DS record's level + 40 (the saga shift of this game's
# Chronicle teams, chronicle-deluxe.md §16.1); no rival that is a team the Chronicle mode or another chain board plays
# (research/scripts/chronicle_deluxe_chain_dedupe.py: replaced by an unused rival of the IE2 DS routes, else left out).
# Save: chain.chronicle_deluxe.ie2_rika of owner vr_framework = one character per tile in the declaration order below;
# never reorder released tiles, only append.
# Left out (Rika): FF Regional Pick A, FF National Pick A (Sonny's chain); NEW Genesis (the Crónica's Génesis; no
# unused IE2 rival left)
# Left out (warehouse): Raimon OB, Young Inazuma (the Mary Times chain's Jóvenes Inazuma); Cutesy B (no card for Mai
# Mai); Super Otaku, NEW Otaku, NEW Wild, NEW Brain, NEW Royal Academy, NEW Shuriken, NEW Farm (the Crónica's teams);
# NEW Kirkwood, NEW Zeus (the Crónica's Kirkwood / Zeus)
default_lang = "es"

# the Chronicle board node: opens with the fbtl_cro02_200_010 win, its board opens the chain
[[VRFW.RouteNode]]
Name = "ie2_chain_rika"
Slot = 310
After = "fbtl_cro02_200_010"
Beside = "fbtl_cro02_090_010"
Dir = "LU"
Pos = [11.0, -17.0]
Team = "chronicle_deluxe.ct_wk_mask_man_a"                # only gives the piece a game (never played)
TemplateGame = "fbtl_cro02_090_010"
Difficulties = [4]                     # cleared when every match of the chain is won
Icon = "assets/images/teams/70_route_nodes/chain_ie2_rika.png"   # Nerina Hartland's (Suzette's mother, c11802060) face bust (chain_icon_build.py --vr-bust)
Chain = "ie2_rika"
  [VRFW.RouteNode.Title]
  es = "Ruta de la madre de Suzette"
  en = "Suzette's Mother's Route"
  fr = "Route de la mère de Suzette"
  de = "Route von Suzettes Mutter"
  it = "Percorso della madre di Suzette"
  pt = "Rota da mãe da Suzette"
  ja = "リカの母の対戦ルート"
  zh_hans = "莉香妈妈的对战路线"
  zh_hant = "莉香媽媽的對戰路線"

