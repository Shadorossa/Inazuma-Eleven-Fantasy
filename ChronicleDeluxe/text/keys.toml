# Texts of Chronicle Deluxe (mod chronicle_deluxe, 2026-10-14; format: docs/framework/types/text.md): the «Mods»
# screen's name and description in the game's language. A language missing here falls back to English. New texts get
# the id crc32("chronicle_deluxe.<name>"). The nodes' match titles are their [VRFW.RouteNode.Title] (9 languages); the
# chain's challenge titles are menu_text rows (text\rows\chain_challenges.toml).
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Chronicle Deluxe"
mod_description = "More Chronicle mode: two extra matches on the Chronicle board in IE1 (Umbrella, across the bridge after Inazuma Kids FC, and Street Sally's, between Brain and Otaku), each a Crónica battle that opens its Heroica; the chain «Sonny's Premium Route» of the original IE1, on the pitch in front of Raimon once Zeus is beaten: 18 matches in two branches, the four elemental teams only accept a squad of the element weak against theirs, each win gives the rival's special moves at the end of the match and a double chest ends each branch (its special reward needs rank S on the whole branch); and the aura items a match drops (keshin, totems, Mix-Max, mode changes) in their own «AURAS» section of the drop lists, each drawn as its aura's banner. Always on: the mod has no options."

[es.new]
mod_name = "Chronicle Deluxe"
mod_description = "Más modo Crónica: dos partidos nuevos en el tablero de Crónica de IE1 (el Umbrella, al otro lado del puente tras el Inazuma Kids FC, y las Street Sally's, entre Brain y Otaku), cada uno una batalla de Crónica que abre su Heroica; la cadena «Ruta prémium de Sonny» del IE1 original, en el campo frente al Raimon tras vencer al Zeus: 18 partidos en dos ramas, los cuatro equipos elementales solo aceptan un equipo del elemento débil ante el suyo, cada victoria da las supertécnicas del rival al final del partido y un cofre doble cierra cada rama (su premio especial pide rango S en toda la rama); y los objetos de aura que suelta un partido (keshin, tótems, Mix-Max, cambios de modo) en su propia sección «AURAS» de las listas de botín, cada uno dibujado como el estandarte de su aura. Siempre activo: el mod no tiene opciones."

[fr.new]
mod_name = "Chronicle Deluxe"
mod_description = "Plus de mode Chronique : deux nouveaux matchs sur le plateau de Chronique d'IE1 (Umbrella, de l'autre côté du pont après l'Inazuma Kids FC, et les Street Sally's, entre Brain et Otaku), chacun une bataille de Chronique qui ouvre son Héroïque ; la chaîne «Route premium de Sonny» de l'IE1 original, sur le terrain devant Raimon une fois Zeus battu : 18 matchs en deux branches, les quatre équipes élémentaires n'acceptent qu'une équipe de l'élément faible face au leur, chaque victoire donne les supertechniques de l'adversaire en fin de match et un coffre double clôt chaque branche (sa récompense spéciale demande le rang S sur toute la branche) ; et les objets d'aura qu'un match fait tomber (keshin, totems, Mix-Max, changements de mode) dans leur propre section «AURAS» des listes de butin, chacun dessiné comme la bannière de son aura. Toujours actif : le mod n'a pas d'options."

[de.new]
mod_name = "Chronicle Deluxe"
mod_description = "Mehr Chronik-Modus: zwei neue Spiele auf dem Chronik-Brett von IE1 (Umbrella, jenseits der Brücke nach dem Inazuma Kids FC, und die Street Sally's, zwischen Brain und Otaku), jedes ein Chronik-Kampf, der seinen Heldenmodus öffnet; die Kette «Sonnys Premium-Route» aus dem originalen IE1, auf dem Platz vor Raimon nach dem Sieg gegen Zeus: 18 Spiele in zwei Zweigen, die vier Element-Teams akzeptieren nur ein Team des Elements, das ihrem unterlegen ist, jeder Sieg gibt am Spielende die Spezialtechniken des Gegners und eine doppelte Truhe schließt jeden Zweig ab (ihr Spezialpreis verlangt Rang S im ganzen Zweig); und die Aura-Gegenstände, die ein Spiel fallen lässt (Keshin, Totems, Mix-Max, Moduswechsel), in einem eigenen Abschnitt «AURAS» der Beutelisten, jeder als Banner seiner Aura gezeichnet. Immer aktiv: der Mod hat keine Optionen."

[it.new]
mod_name = "Chronicle Deluxe"
mod_description = "Più modalità Cronaca: due nuove partite sul tabellone della Cronaca di IE1 (l'Umbrella, oltre il ponte dopo l'Inazuma Kids FC, e le Street Sally's, tra Brain e Otaku), ognuna una battaglia di Cronaca che apre la sua Eroica; la catena «Percorso premium di Sonny» dell'IE1 originale, sul campo davanti alla Raimon dopo aver battuto lo Zeus: 18 partite in due rami, le quattro squadre elementali accettano solo una squadra dell'elemento debole contro il loro, ogni vittoria dà le supertecniche dell'avversario a fine partita e un forziere doppio chiude ogni ramo (il suo premio speciale chiede il rango S in tutto il ramo); e gli oggetti aura che una partita fa cadere (keshin, totem, Mix-Max, cambi di modalità) in una propria sezione «AURAS» delle liste dei premi, ognuno disegnato come lo stendardo della sua aura. Sempre attivo: il mod non ha opzioni."

[pt.new]
mod_name = "Chronicle Deluxe"
mod_description = "Mais modo Crónica: dois jogos novos no tabuleiro da Crónica do IE1 (o Umbrella, do outro lado da ponte depois do Inazuma Kids FC, e as Street Sally's, entre Brain e Otaku), cada um uma batalha de Crónica que abre a sua Heroica; a cadeia «Rota premium de Sonny» do IE1 original, no campo em frente à Raimon depois de vencer o Zeus: 18 jogos em dois ramos, as quatro equipas elementais só aceitam uma equipa do elemento fraco contra o seu, cada vitória dá as supertécnicas do rival no fim do jogo e um baú duplo fecha cada ramo (o seu prémio especial pede o rank S em todo o ramo); e os objetos de aura que um jogo deixa cair (keshin, totens, Mix-Max, mudanças de modo) numa secção «AURAS» própria das listas de prémios, cada um desenhado como o estandarte da sua aura. Sempre ativo: o mod não tem opções."

[ja.new]
mod_name = "Chronicle Deluxe"
mod_description = "クロニクルモードをもっと：IE1のクロニクル盤に新しい試合が2つ（稲妻KFCの後、橋の向こうの傘美野、そしてブレインとオタクの間のストリートサリーズ）。どちらもクロニクルバトルで、勝つとヒロイックが開く。ゼウスに勝つと雷門の前のグラウンドに初代IE1の「大介のプレミアム対戦ルート」が登場：2本の枝に18試合、4つの属性チームは相性で負ける属性の選手だけのチームでしか戦えない。勝つたびに試合後に相手の必殺技が手に入り、各枝の最後にはダブル宝箱（特別な報酬は枝の全試合でランクSが必要）。試合でドロップするオーラアイテム（化身、トーテム、ミキシマックス、モードチェンジ）はドロップ一覧の専用セクション「AURAS」に、オーラのバナーとして表示される。常に有効：オプションはない。"

[zh_hans.new]
mod_name = "Chronicle Deluxe"
mod_description = "更多编年史模式：IE1 编年史棋盘上的两场新比赛（稻妻KFC之后、桥对面的伞美野，以及 Brain 与 Otaku 之间的街头莎莉斯），每场都是一场编年史对战，获胜后开启其英雄难度；击败宙斯后，雷门前的球场上出现初代IE1的「大介的高级对战路线」：两条分支共18场比赛，四支属性队伍只接受由克制关系中较弱属性球员组成的队伍，每场胜利在赛后获得对手的必杀技，每条分支尽头有一个双重宝箱（特别奖励需要整条分支取得S评价）；比赛掉落的灵气道具（化身、图腾、混合最大化、模式转换）在掉落列表中拥有专属的「AURAS」分区，每个都以其灵气的横幅显示。始终启用：本模组没有选项。"

[zh_hant.new]
mod_name = "Chronicle Deluxe"
mod_description = "更多編年史模式：IE1 編年史棋盤上的兩場新比賽（稻妻KFC之後、橋對面的傘美野，以及 Brain 與 Otaku 之間的街頭莎莉斯），每場都是一場編年史對戰，獲勝後開啟其英雄難度；擊敗宙斯後，雷門前的球場上出現初代IE1的「大介的高級對戰路線」：兩條分支共18場比賽，四支屬性隊伍只接受由克制關係中較弱屬性球員組成的隊伍，每場勝利在賽後獲得對手的必殺技，每條分支盡頭有一個雙重寶箱（特別獎勵需要整條分支取得S評價）；比賽掉落的靈氣道具（化身、圖騰、混合最大化、模式轉換）在掉落列表中擁有專屬的「AURAS」分區，每個都以其靈氣的橫幅顯示。始終啟用：本模組沒有選項。"
