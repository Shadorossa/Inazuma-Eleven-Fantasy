# Chronicle Deluxe: the texts of the Chronicle board's gacha node (content/gacha/kizuna_coin_gacha.toml; VRFW
# docs/framework/gacha.md).
schema = "VRFW.text/2"
table = "menu_text"

# the node panel's one command row (the battle rows' place): runs the draw
[[row]]
id = "chronicle_deluxe_gacha_command"
es = "Insertar moneda"
en = "Insert a coin"
fr = "Insérer une pièce"
de = "Münze einwerfen"
it = "Inserisci una moneta"
pt = "Inserir moeda"
ja = "コインを入れる"
zh_hans = "投入硬币"
zh_hant = "投入硬幣"

# «Insertar moneda» without a golden coin: nothing is drawn
[[row]]
id = "chronicle_deluxe_gacha_no_coin"
es = "No tienes monedas doradas."
en = "You have no Golden Coins."
fr = "Tu n'as pas de pièces dorées."
de = "Du hast keine Goldmünzen."
it = "Non hai monete d'oro."
pt = "Não tens moedas douradas."
ja = "ゴールドコインを持っていません。"
zh_hans = "你没有金币。"
zh_hant = "你沒有金幣。"

# the command row's second line: how many golden coins the player has (%d)
[[row]]
id = "chronicle_deluxe_gacha_coins"
es = "Monedas doradas: %d"
en = "Golden Coins: %d"
fr = "Pièces dorées : %d"
de = "Goldmünzen: %d"
it = "Monete d'oro: %d"
pt = "Moedas douradas: %d"
ja = "ゴールドコイン：%d"
zh_hans = "金币：%d"
zh_hant = "金幣：%d"
