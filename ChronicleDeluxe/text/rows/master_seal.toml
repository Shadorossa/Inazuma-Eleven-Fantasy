id = "chronicle_deluxe_master_seal_obtained"
es = "¡Has obtenido el Sello del Maestro!\\nUna sola copia de una supertécnica sirve para todos\\ntus jugadores. Con todas las Crónicas completadas,\\ntambién las auras."
en = "You obtained the Master's Seal!\\nOne copy of a special move now serves all your\\nplayers. With every Chronicle completed,\\nauras too."
fr = "Tu as obtenu le Sceau du maître !\\nUn seul exemplaire d'une supertechnique sert à\\ntous tes joueurs. Avec toutes les Chroniques\\nterminées, les auras aussi."
de = "Du hast das Siegel des Meisters erhalten!\\nEin Exemplar einer Spezialtechnik reicht jetzt für\\nalle deine Spieler. Mit allen Chroniken\\nabgeschlossen auch die Auren."
it = "Hai ottenuto il Sigillo del Maestro!\\nUna sola copia di una supertecnica ora basta per\\ntutti i tuoi giocatori. Con tutte le Cronache\\ncompletate, anche le aure."
pt = "Obtiveste o Selo do Mestre!\\nUma só cópia de uma supertécnica serve agora para\\ntodos os teus jogadores. Com todas as Crónicas\\nconcluídas, também as auras."
ja = "「マスターの証」を手に入れた！\\n必殺技は1つ持っているだけで\\n何人の選手にでも装備できる。\\nクロニクル全制覇でオーラも同様。"
zh_hans = "获得了「大师之印」！\\n必杀技只需拥有一份，\\n即可装备给所有球员。\\n完成全部编年史后，灵气也一样。"
zh_hant = "獲得了「大師之印」！\\n必殺技只需擁有一份，\\n即可裝備給所有球員。\\n完成全部編年史後，靈氣也一樣。"
