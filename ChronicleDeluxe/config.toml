# Chronicle Deluxe's settings (docs/game/mods/chronicle-deluxe.md §8). Read by the generator
# research/scripts/chronicle_deluxe_heroic_build.py, which writes the mod's data from them (content\teams\90_rules\
# heroic.toml, content\base_tables\gamedata\soccer\soccer_prize_config.toml, text\rows\heroic_challenges.toml): change a
# value here, re-run the generator (`--check` = exit 1 when the data is stale). Nothing here is read in game.

# The Batalla heroica's rival level along the Chronicle (owner 2026-10-14: «starts at the Royal Academy node at level 4
# and scales up to level 200 at the last stage of Victory Road's heroic battles»). The heroic battles in the game's own
# Chronicle order (the routes of chronicle_vs_route_config, their match pieces in table order; this mod's side nodes right
# after the piece they follow) get level = first + (last - first) × t ^ curve_exponent, t = 0 at the first battle and 1 at
# the last, rounded half up. curve_exponent = 1 is a straight line; above 1 the climb is slower first, faster at the end.
[heroic]
first_level = 4
last_level = 200
curve_exponent = 1.0

# The player's team in a Batalla heroica is synced (the row's level sync: players above it play at it) to a level
# `level_sync_below_percent` % below the rival's: sync = rival × (100 − percent) / 100, rounded DOWN, at least 1.
level_sync_below_percent = 7

# The heroic player rules (owner 2026-10-14, simplified 2026-10-16). The «first game» of a player is his character's
# source series in the game's data (chara_base series → chara_series_config type: Inazuma Eleven, 2, 3, GO, GO 2, GO
# Galaxy, Ares, Orion, Victory Road); a Chronicle route's game is the series most of its Crónica rivals' players belong to.
#   first game: every player of the squad (starters and bench; the coach and the reserves never count) is from that game
#         (its text says so: «Solo jugadores de …»)
#   ramp: from the second game on, at least N players of the squad are from the node's game, and nothing else is asked;
#         N climbs over that game's heroic battles in Chronicle order: N = ramp_start + (ramp_end − ramp_start) ×
#         t ^ ramp_exponent, rounded UP (t = 0 at the game's first heroic battle, 1 at its last, which asks ramp_end)
#   cap_after_first_game: true = from the second game on the squad may also only hold players of the node's game or
#         earlier ones (owner 2026-10-16: false)
#   max_per_series: from the second game on, at most this many players of the squad from any one game (season). 0 = no
#         maximum (owner 2026-10-16: 0)
[heroic.players]
ramp_start = 1
ramp_end = 7
ramp_exponent = 1.0
cap_after_first_game = false
max_per_series = 0

# The required starter of every Batalla heroica (owner 2026-10-14), from the first one (Royal Academy) to Victory
# Road's last: the player's starting line-up must have this character (any card of his: the normal cards and the
# Hero / Idol ones of the same character; NOT the possessed form c11600090 nor the young one c11600110, other
# characters) in a formation place of one of `positions` (the place in the dock's formation: fw = DL, mf = MC), only
# until that heroic battle's first win (`until_first_clear`). He is exempt from the cap, and counts toward the ramp
# and the per-season maximum only where his own series (chara_base: Victory Road) is allowed, i.e. in Victory Road's
# heroic battles. The Crónica has no rule.
[heroic.required]
character = "c11600010"   # Victorio Cryptix, normal form (the one of the starting teams, content/teams/05_start_teams.toml)
positions = ["fw", "mf"]
until_first_clear = true

# The auras BOTH teams may start in a Batalla heroica, per the battle's game (owner 2026-10-16): each game lists its
# allowed kinds (the games' keys of [heroic.players.short_names]); every kind not listed is refused (the plates, the
# duel aura picks, the game's aura rows and the CPU: the framework's match aura rule, [VRFW.MatchChallenge.Auras]). A
# game not listed here allows everything (no rule). The Crónica and every other match are not ruled.
#   keshin = fighting spirits; armour = keshin armed; bond = bond transformations; awakening = awakening powers and
#   changes; own_mode_change = a mode change of the card's own kit (the game's own, e.g. Shawn Froste's);
#   created_mode_change = a mode change a player created (All Changed's «Modo cambio»)
# Owner: no aura in IE1-IE3, Ares and Orion except the cards' own mode changes; fighting spirits in GO; + armours and
# miximax in Chrono Stone; + totems in Galaxy; Victory Road allows everything (bond, awakening, created mode changes).
[heroic.auras]
ie1 = ["own_mode_change"]
ie2 = ["own_mode_change"]
ie3 = ["own_mode_change"]
go1 = ["keshin", "own_mode_change"]
go2 = ["keshin", "armour", "miximax", "own_mode_change"]
go3 = ["keshin", "armour", "miximax", "totem", "own_mode_change"]
ares = ["own_mode_change"]
orion = ["own_mode_change"]

# The short names the match info uses for the games (series names of chara_base's in_<name> columns). A game missing
# here is written with the game's own full name (chara_series_config's name text, every language).
[heroic.players.short_names]
ie1 = "IE1"
ie2 = "IE2"
ie3 = "IE3"
go1 = "GO"
go2 = "CS"
go3 = "Galaxy"
ares = "Ares"
orion = "Orion"
victory_road = "VR"

# Free-match teams whose players play their base form (owner 2026-10-19; docs/game/mods/chronicle-deluxe-free-match.md
# §14): research/scripts/chronicle_deluxe_base_form_build.py writes content/teams/90_rules/free_match_base_forms.toml,
# a team `chronicle_deluxe.<name>` based on `team` with each player's base-form card (the same-named character's other
# card in the game's teams), used per class by [[VRFW.FreeMatchRival]] (content/teams/90_rules/free_match.toml).
[[free_match_base_form]]
team = "tm_cro_go2_0800"     # Protocolo Omega 3.0 (its players miximaxed with Zanark)
name = "fm_protocol_omega_3_base"
