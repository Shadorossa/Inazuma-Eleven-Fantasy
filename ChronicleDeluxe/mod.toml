id = "chronicle_deluxe"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Chronicle Deluxe"
version = "1.38.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "More Chronicle mode: two extra matches on the Chronicle board in IE1 (Umbrella, across the bridge after Inazuma Kids FC, and Street Sally's, between Brain and Otaku), each a Crónica battle that opens its Heroica; the chain «Sonny's Premium Route» of the original IE1 (18 matches in two branches, on the pitch in front of Raimon after Zeus: the four elemental teams only accept a squad of the element weak against theirs, each win gives the rival's special moves at the end of the match, a double chest ends each branch); the chain «Mary Times Coach's Route» of the original IE2 (its board as on the DS: three branches from the start, the upper and lower ones going on to a second page, the original rivals (Victory Road's own legend teams where it has them; an unused team of the same kind where the original is missing or already in Chronicle mode or Sonny's chain) and three chests; on the Mary Times sea pitch, after the IE2 board's last match); the chain «Suzette's Mother's Route» of the original IE2 (Rika's mother's and the secret warehouse's routes on one board: 17 matches in two rows, without any team of another chain or of Chronicle mode; next to Triple C, after the IE2 final); and the aura items a match drops (keshin, totems, Mix-Max, mode changes) in their own «AURAS» section of the drop lists, each drawn as its aura's banner, and the other items in three sections «OBJETOS», «SUPERTÉCNICAS» (shots, dribbles, blocks, saves) and «EQUIPACIÓN» (boots, gear, kits, crests); the Crónica battle drops the rival's player spirits too (at the rates of the old route-unlock battle, below the Heroica's); every Chronicle board match also drops the manuals of the special moves its rival's players have learned at that match's level, the rival team's own boots, its players' auras of the battle's era and, with True Hissatsu, a book to raise a special move's grade (Crónica: manuals 4 %, boots 1 %, book 1 % per roll; Heroica: 10 %, 2.5 %, 2 % + the last grade's book 0.5 %); and the match ranks S / A / B of a won board or chain match, with their badges on the board pieces, the chain tiles and the chain board's help; and the chain board's IE3 look (its background, plates, chests and icons). Every Chronicle team keeps only two battles: the Crónica, whose win opens the route as the route-unlock battle did, and the Batalla heroica, from Lv 4 to Lv 200 (Victory Road's last match; the IE1, IE2 and IE3 teams play both battles as the rival of their DS story match, every player at his DS level (IE2 and IE3 shifted to follow the game before) with his DS moves; Orion's battles continue Ares' levels, every move as in VR, the ones not yet learned locked; in the Crónica the fixed Raimon / Inazuma Japan keeps the retail Crónica's level gap to the rival, with its DS moves of that point of the story), your team synced 7 % below the rival, only players of that game or earlier ones (from IE2 on, a growing number of that game's own players), only the auras of that game for both teams (none in IE1-IE3, Ares and Orion but a card's own mode change, fighting spirits in GO, plus armours and Mix-Max in Chrono Stone, plus totems in Galaxy, everything in Victory Road), and its first win gives the rival's crest, its kit and the stadium of the match (the first Heroica win against Mary Times, Cala Pirata and the IE3 Inazuma Japón also gives the game's unused Victory Road kit of that team, and against Sílice, the Naiadi rematch and Guardianes de la Reina the team's unused second kit). Winning the Destructores gate battle gives the key item «Master's Seal»: one copy of a special move serves all your players (auras too; in Character Reforged's skill table). Works on the base game with the VRFW. Always on: the mod has no options. In the free match every opponent offers three difficulties, the whole rival team at that level: Lv 50, Lv 99 and Lv 200 (legendary battle); in the Lv 50 one your team plays at Lv 50 too (level sync: every player with his Lv 50 stats, his saved level and moves unchanged)."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-10-22"
# NOT the older mod «Chronicles Deluxe» (id chronicles_deluxe, folder ChroniclesDeluxe, with an «s»): that mod is set aside
# (owner 2026-10-14) and is neither edited nor needed by this one. Where both declare the same thing (the Umbrella /
# Sally's nodes and teams), this mod's files carry `if_not_mod = "chronicles_deluxe"`: with the old mod active, its
# identical declarations are used and nothing is declared twice.
# Own names: prefix ChronicleDeluxe (ChronicleDeluxe.X for any TOML key or Lua function of its own); content ids
# chronicle_deluxe.<name>. Exported: the gacha pool kizuna_coin_gacha ([exports] keys; other mods add cards to it).
prefix = "ChronicleDeluxe"
folder = "ChronicleDeluxe"
