id = "chronicle_deluxe"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Chronicle Deluxe"
version = "1.2.3"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "More Chronicle mode: two extra matches on the Chronicle board in IE1 (Umbrella, across the bridge after Inazuma Kids FC, and Street Sally's, between Brain and Otaku), each a Crónica battle that opens its Heroica; the chain «Sonny's Premium Route» of the original IE1 (18 matches in two branches, on the pitch in front of Raimon after Zeus: the four elemental teams only accept a squad of the element weak against theirs, each win gives the rival's special moves at the end of the match, a double chest ends each branch); and the aura items a match drops (keshin, totems, Mix-Max, mode changes) in their own «AURAS» section of the drop lists, each drawn as its aura's banner. Every Chronicle team keeps only two battles: the Crónica, whose win opens the route as the route-unlock battle did, and the Batalla heroica, from Lv 4 (Royal Academy) to Lv 200 (Victory Road's last match), your team synced 7 % below the rival, only players of that game or earlier ones (from IE2 on, a growing number of that game's own players), and its first win gives the rival's crest, its kit and the stadium of the match. Works on the base game with the VRFW. Always on: the mod has no options."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-10-14"
# NOT the older mod «Chronicles Deluxe» (id chronicles_deluxe, folder ChroniclesDeluxe, with an «s»): that mod is set aside
# (owner 2026-10-14) and is neither edited nor needed by this one. Where both declare the same thing (the Umbrella /
# Sally's nodes and teams), this mod's files carry `if_not_mod = "chronicles_deluxe"`: with the old mod active, its
# identical declarations are used and nothing is declared twice.
# Own names: prefix ChronicleDeluxe (ChronicleDeluxe.X for any TOML key or Lua function of its own); content ids
# chronicle_deluxe.<name>. Nothing is exported.
prefix = "ChronicleDeluxe"
folder = "ChronicleDeluxe"
# Made on 2026-10-14 (owner: «quiero crear un ChronicleDeluxe… transfiere lo que tiene IF de la visualización de las auras
# en los drops de partidos, el nodo del Umbrella y el nodo del Sally's»; docs/game/mods/chronicle-deluxe.md). Data only:
# no plugin, no Lua, no grafts (1.2.0: one hook graft, chronicle_deluxe_board). Layout (docs/framework/mod-layout.md):
#   content\teams\70_route_nodes\side_nodes.toml   the Chronicle side nodes Umbrella (slot 271) and Sally's (slot 274),
#                                                  [[VRFW.RouteNode]]: names and slots as before, so saves keep them
#   content\teams\10_ie1\                          their rival teams (same keys evt_cro_ie1_umbrella / _sallys)
#   content\items\drop_list.toml                   [VRFW.DropList.Auras]: the «AURAS» section of the drop lists (was
#                                                  Inazuma Fantasy's)
#   text\keys.toml                                 the «Mods» screen's name and description (9 languages)
# 1.1.0 (2026-10-14, owner): the chain «Ruta prémium de Sonny» (docs/game/mods/chronicle-deluxe.md §7), GENERATED by
# research/scripts/chronicle_deluxe_chains_build.py from _chains.toml (the choices), the wiki's IE1 taisen route and the
# game's tables:
#   content\teams\70_route_nodes\chain_ie1_sonny.toml   the node (slot 283, after Zeus), the chain board (2 branches of 9
#                                                  matches + a double chest), the 4 elemental challenges, no drops
#   content\teams\10_ie1\00NN_*.toml                     its rivals VR lacks (the wiki route teams, same keys as
#                                                  Chronicles Deluxe's, gated if_not_mod; Strange Guys new)
#   content\base_tables\gamedata\soccer\soccer_drop_config.toml   the empty item-drop table of its games
#   text\rows\chain_challenges.toml                   the challenges' titles
#   assets\images\teams\                              the rivals' crests, the node's icon (Sonny Raimon)
# vr_framework 2.4.21: double chests (Kind = "dchest") and match tile rewards (end-of-match win prizes) of chain boards.
# vr_framework 2.4.17: each part of [VRFW.DropList] is taken from the mod that declares it (this mod's AURAS section next
# to another mod's list order).
# 1.2.0 (2026-10-14, owner: «each team keeps only the chronicle battle … the heroic battle from Lv 4 to Lv 200, synced
# 7 % below, players of that game, emblem + kit + stadium»; docs/game/mods/chronicle-deluxe.md §8):
#   content\defaults\match_difficulty.toml          the board's difficulties: Crónica + Heroica (gate pieces: the gate
#                                                  battle); route unlock / unusual items / Heroica+ / Legendaria gone
#   research/grafts/chronicle_deluxe_board          hook files of the VRFW board scripts: a Crónica win counts as the
#                                                  route-unlock clear (trigger 506, neighbours, gate keys, 507), opens
#                                                  the Heroica; old saves get the Heroica of every won Crónica
#   content\teams\90_rules\heroic.toml              GENERATED by research/scripts/chronicle_deluxe_heroic_build.py from
#                                                  config.toml [heroic] and the game's tables: the Heroica levels
#                                                  ([[VRFW.LevelMap]]), its level sync, the player rules
#                                                  ([[VRFW.MatchChallenge]] Difficulties = [4]) and the first-clear
#                                                  tables ([[VRFW.GameDrops]] FirstClear)
#   content\teams\90_rules\free_match.toml          [VRFW.FreeMatch] Unlock = "together" (no class waits for a battle
#                                                  that is gone or for the Heroica)
#   content\base_tables\gamedata\soccer\soccer_prize_config.toml   the heroic first-clear tables (generated)
#   text\rows\heroic_challenges.toml                 the rules' texts (generated, 9 languages)
#   config.toml [heroic]                           the curve, the sync, the ramp, the games' short names
# vr_framework 2.4.31: [[VRFW.MatchChallenge]] Difficulties + the rule's title in the board's command menu,
# [[VRFW.GameDrops]] FirstClear.
# 1.2.1 (2026-10-14, owner: the three starting teams of a new save with his line-ups, original names / crests / kits):
#   content\teams\05_start_teams.toml             [[edit]] start_team_01..03: players (IE1 + Victorio Cryptix, normal
#                                                  form) and 4-3-3 Delta / Delta / Triangle; names, crests, kits,
#                                                  level, coach and the game's boots / level offsets kept (§8.8)
# 1.2.2 (2026-10-14, owner): every Batalla heroica asks for Victorio Cryptix (normal form, config.toml
# [heroic.required]) as a starting forward / midfielder until its first win ([[VRFW.MatchChallenge.Required]], VRFW
# 2.4.35); he is exempt from the cap and counts toward the ramp only in Victory Road heroics (his series).
requires = ["vr_framework>=2.4.35"]
