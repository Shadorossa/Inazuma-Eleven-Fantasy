id = "chronicle_deluxe"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Chronicle Deluxe"
version = "1.8.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "More Chronicle mode: two extra matches on the Chronicle board in IE1 (Umbrella, across the bridge after Inazuma Kids FC, and Street Sally's, between Brain and Otaku), each a Crónica battle that opens its Heroica; the chain «Sonny's Premium Route» of the original IE1 (18 matches in two branches, on the pitch in front of Raimon after Zeus: the four elemental teams only accept a squad of the element weak against theirs, each win gives the rival's special moves at the end of the match, a double chest ends each branch); and the aura items a match drops (keshin, totems, Mix-Max, mode changes) in their own «AURAS» section of the drop lists, each drawn as its aura's banner; the Crónica battle drops the rival's player spirits too (at the rates of the old route-unlock battle, below the Heroica's); and the match ranks S / A / B of a won board or chain match, with their badges on the board pieces, the chain tiles and the chain board's help; and the chain board's IE3 look (its background, plates, chests and icons). Every Chronicle team keeps only two battles: the Crónica, whose win opens the route as the route-unlock battle did, and the Batalla heroica, from Lv 4 (Royal Academy) to Lv 200 (Victory Road's last match), your team synced 7 % below the rival, only players of that game or earlier ones (from IE2 on, a growing number of that game's own players), and its first win gives the rival's crest, its kit and the stadium of the match. Winning the Destructores gate battle gives the key item «Master's Seal»: one copy of a special move serves all your players (with every Chronicle completed, auras too; in Character Reforged's skill table). Works on the base game with the VRFW. Always on: the mod has no options."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-10-15"
# NOT the older mod «Chronicles Deluxe» (id chronicles_deluxe, folder ChroniclesDeluxe, with an «s»): that mod is set aside
# (owner 2026-10-14) and is neither edited nor needed by this one. Where both declare the same thing (the Umbrella /
# Sally's nodes and teams), this mod's files carry `if_not_mod = "chronicles_deluxe"`: with the old mod active, its
# identical declarations are used and nothing is declared twice.
# Own names: prefix ChronicleDeluxe (ChronicleDeluxe.X for any TOML key or Lua function of its own); content ids
# chronicle_deluxe.<name>. Nothing is exported.
prefix = "ChronicleDeluxe"
folder = "ChronicleDeluxe"
