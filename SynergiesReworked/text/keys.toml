schema = "VRFW.text_key/1"
# Texts of «Synergies Reworked» (mod synergies_reworked, 2026-10-14) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. The hints of the synergy panel are the menu_text rows of text\rows\synergy_hints.toml.
# A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Synergies Reworked"
mod_description = "Some of the game's team synergies ask for players of a team or a group instead of a few named characters. El linaje oscuro: Ray Dark plus two players of Royal Academy, Zeus, Orpheus, Eclipse or Team D. Las gerentes más allegadas and Las gerentes de GO: any three female managers of their series. Los maestros de Alius: one Alius captain plus a player of each of the other two Alius teams. Los guerreros de Santuario: one player of Oscuridad Ancestral plus one of Luz Eterna. Names, icons and effects stay the game's; the synergy panel shows the nexus, the teams' crests and who is still missing."

[es.new]
mod_name = "Synergies Reworked"
mod_description = "Algunas sinergias de equipo del juego piden jugadores de un equipo o un grupo en vez de unos personajes concretos. El linaje oscuro: Ray Dark y dos jugadores de la Royal Academy, Zeus, Orfeo, Eclipse o el Equipo D. Las gerentes más allegadas y Las gerentes de GO: tres gerentes cualesquiera de su serie. Los maestros de Alius: un capitán de Alius y un jugador de cada uno de los otros dos equipos de Alius. Los guerreros de Santuario: un jugador de Oscuridad Ancestral y uno de Luz Eterna. Los nombres, iconos y efectos son los del juego; el panel de sinergias muestra el nexo, los emblemas de los equipos y quién falta."

[fr.new]
mod_name = "Synergies Reworked"
mod_description = "Certaines synergies d'équipe du jeu demandent des joueurs d'une équipe ou d'un groupe au lieu de quelques personnages précis. El linaje oscuro : Ray Dark et deux joueurs de Royal Academy, Zeus, Orphée, Éclipse ou l'Équipe D. Les deux synergies de managers : trois manageuses quelconques de leur série. Los maestros de Alius : un capitaine d'Alius et un joueur de chacune des deux autres équipes d'Alius. Los guerreros de Santuario : un joueur d'Oscuridad Ancestral et un de Luz Eterna. Les noms, icônes et effets restent ceux du jeu ; le panneau des synergies montre le lien, les blasons des équipes et qui manque encore."

[de.new]
mod_name = "Synergies Reworked"
mod_description = "Einige Team-Synergien des Spiels verlangen Spieler eines Teams oder einer Gruppe statt einiger bestimmter Figuren. El linaje oscuro: Ray Dark und zwei Spieler von Royal Academy, Zeus, Orpheus, Eclipse oder Team D. Die zwei Managerinnen-Synergien: drei beliebige Managerinnen ihrer Serie. Los maestros de Alius: ein Alius-Kapitän und je ein Spieler der zwei anderen Alius-Teams. Los guerreros de Santuario: ein Spieler von Oscuridad Ancestral und einer von Luz Eterna. Namen, Symbole und Effekte bleiben die des Spiels; das Synergie-Fenster zeigt den Kern, die Wappen der Teams und wer noch fehlt."

[it.new]
mod_name = "Synergies Reworked"
mod_description = "Alcune sinergie di squadra del gioco chiedono giocatori di una squadra o di un gruppo invece di alcuni personaggi precisi. El linaje oscuro: Ray Dark e due giocatori di Royal Academy, Zeus, Orfeo, Eclipse o Squadra D. Le due sinergie delle manager: tre manager qualsiasi della loro serie. Los maestros de Alius: un capitano di Alius e un giocatore di ciascuna delle altre due squadre di Alius. Los guerreros de Santuario: un giocatore di Oscuridad Ancestral e uno di Luz Eterna. Nomi, icone ed effetti restano quelli del gioco; il pannello delle sinergie mostra il nesso, gli stemmi delle squadre e chi manca ancora."

[pt.new]
mod_name = "Synergies Reworked"
mod_description = "Algumas sinergias de equipe do jogo pedem jogadores de uma equipe ou de um grupo em vez de alguns personagens concretos. El linaje oscuro: Ray Dark e dois jogadores do Royal Academy, Zeus, Orfeu, Eclipse ou Time D. As duas sinergias de gerentes: três gerentes quaisquer da sua série. Los maestros de Alius: um capitão de Alius e um jogador de cada uma das outras duas equipes de Alius. Los guerreros de Santuario: um jogador de Oscuridad Ancestral e um de Luz Eterna. Nomes, ícones e efeitos continuam os do jogo; o painel de sinergias mostra o nexo, os emblemas das equipes e quem ainda falta."

[ja.new]
mod_name = "Synergies Reworked"
mod_description = "ゲームのチームシナジーの一部が、決まったキャラクターではなくチームやグループの選手を条件にする。影山零治のシナジーは影山＋帝国・世宇子・オルフェウス・シャドウ・チームＫの選手2人、2つのマネージャーシナジーはそのシリーズの女子マネージャー3人、エイリアのシナジーはキャプテン1人＋他の2チームの選手1人ずつ、2チームのシナジーは各チームの選手1人ずつ。名前・アイコン・効果はゲームのまま。シナジー画面には中心の選手、チームのエンブレム、足りない選手が表示される。"

[zh_hans.new]
mod_name = "Synergies Reworked"
mod_description = "游戏中部分球队协同效果改为要求某支球队或某个群体的球员，而不是几名指定角色。影山零治的协同：影山加上帝国、世宇子、奥尔菲斯、猎户座之影或K队的两名球员；两个经理协同：该系列任意三名女经理；艾利亚的协同：一名队长加上另外两支球队各一名球员；两队协同：每队各一名球员。名称、图标和效果保持游戏原样；协同面板显示核心、球队队徽以及还缺谁。"

[zh_hant.new]
mod_name = "Synergies Reworked"
mod_description = "遊戲中部分球隊協同效果改為要求某支球隊或某個群體的球員，而不是幾名指定角色。影山零治的協同：影山加上帝國、世宇子、奧爾菲斯、獵戶座之影或K隊的兩名球員；兩個經理協同：該系列任意三名女經理；艾利亞的協同：一名隊長加上另外兩支球隊各一名球員；兩隊協同：每隊各一名球員。名稱、圖示和效果保持遊戲原樣；協同面板顯示核心、球隊隊徽以及還缺誰。"
