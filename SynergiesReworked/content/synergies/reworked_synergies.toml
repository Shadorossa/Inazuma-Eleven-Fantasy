    { team = "0xF01BB293", era = "ie" },     # Raimon (IE1)
    { team = "0x4B51EDE4", era = "go" },     # Raimon revolucionario (GO)
    { game_team = "bb_17_team_inakuniraimon" },   # Raimon Isla Remota (Ares): the emblem its team screens show (the belong team's own Ares emblem 0x86D317FE is not an item)
    { team = "0xF01BB293", era = "vr" },     # Raimon (Victory Road)
]

