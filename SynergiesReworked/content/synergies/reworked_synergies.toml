# ------------------------------------------------------------------------------------------------ El alma de los Campeones Raimon

# Owner 2026-10-28: NEXUS = the captain of one of the four Raimons (IE1, GO «Revolución», Ares Isla Remota, Victory
# Road), read from team_config (captain column) of the game's team records below; slots 2 and 3 = two other players of
# those Raimon rosters (crests of the four clubs in the empty rows), distinct from the nexus and from each other.
# Rosters from the team data: Raimon F01BB293 (IE / GO / Ares / VR), Primer equipo del Raimon 4B51EDE4 (GO «Revolución»),
# Isla Remota 1FBFA767 (Ares). Percival Travis (a coach card of the Raimon rosters) never counts.
[[VRFW.SynergyPool]]
name = "raimon_captains"
captains_of_teams = [
    "bb_01_team_raimon",          # Raimon (IE1)
    "bb_08_team_raimon_go",       # Raimon revolucionario (GO)
    "bb_17_team_inakuniraimon",   # Raimon Isla Remota A (Ares)
    "bb_18_team_inakuniraimon",   # Raimon Isla Remota B (Ares)
    "tm_cro_victory_0600",        # Raimon (Victory Road)
]
exclude = ["c05026550", "c03039500", "c11807140"]   # Percival Travis

[[VRFW.SynergyPool]]
name = "raimon_rosters"
teams = ["0xF01BB293", "0x4B51EDE4", "0x1FBFA767"]   # Raimon, Primer equipo del Raimon, Isla Remota
exclude = ["c05026550", "c03039500", "c11807140"]    # Percival Travis
hint = "SynergiesReworked.HintPlayerOfTeam"          # an empty slot's label: «Un jugador de Raimon» (the first team), left of the crests
# exactly four crests: the Ares Raimon IS the Isla Remota team (its crest stands for the Ares-series Raimon records too)
