schema = "VRFW.synergy/1"

# Synergies Reworked › the reworked team synergies (owner request 2026-10-13; design: docs/game/mechanics/synergy-rework.md
# §8; split out of Inazuma Fantasy 2026-10-14, docs/game/mods/synergies-reworked.md). The mechanism is the framework's
# (docs/framework/synergy.md): a synergy declared here replaces the game's condition rows of that game synergy (named
# characters) by a NEXUS + players of a POOL; its name, slot, icon and effects stay the game's. Who counts is the game's:
# the starters and the staff slots (3 managers, the coach).
# Pools are criteria over the game's data (belong teams, series, staff role, gender): never member lists.

# ------------------------------------------------------------------------------------------------ El linaje oscuro

# Every player of Royal Academy (every era: IE1, GO, Ares «Royal Academy» and VR share this belong team), Zeus, Royal
# Academy Redux, «Equipo D» (Team K), Orfeo (Orpheus) and Eclipse de Orión: 164 characters with a card (v7.1.2 data).
# The order is the panel's crest order (owner 2026-10-14: Royal Academy (IE1) > Zeus (IE1) > Royal Redux > Team K >
# Orfeo > the Orión team); belong team keys and names checked in belong_team_config + team_text (v7.1.2).
[[VRFW.SynergyPool]]
name = "dark_lineage"
teams = [
    "0x699E68EC",   # Royal Academy (crest: the IE emblem)
    "0x9BAD3311",   # Zeus (crest: the IE emblem)
    "0xF1E3E365",   # Royal Academy Redux
    "0xB95A1DDD",   # «Equipo D» (Team K, IE3; Spanish name of チームＫ, confirmed by the owner 2026-10-13)
    "0x0F3CD0F1",   # Orfeo
    "0x9E96B18A",   # Eclipse de Orión (Orion Eclipse: the only Orión team of this pool; the owner's «Sombra de Orión»)
]

[[VRFW.Synergy]]
key = "sp04003"                                  # El linaje oscuro (retail: Ray Dark + Lucian Dark)
nexus = ["c11801020", "c11807230", "c11803050"]   # Ray Dark (IE1, Ares) or «Mr. D» (his IE3 coach alias): counts as coach too
pool = "dark_lineage"
count = 2
rule = "min"
hint = "SynergiesReworked.HintDarkLineage"

# ------------------------------------------------------------------------------------------------ Líderes del Protocolo Omega

