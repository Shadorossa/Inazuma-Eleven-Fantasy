# players of the rosters of Protocolo Omega 1.0, 2.0 and 3.0 (the leaders count there too when they are not the nexus),
# distinct from the nexus and from each other. Leaders (chara_base v7.2.1): Alfa c05020500 + c05020500_5000; Beta c05020700
# + c05020700_5000 + c11905050; Gamma c05020800 + c05020800_5000. c05028300 is left out: it is another character named
# Gamma (own name and description text), a roster player of Protocolo Omega 3.0 only.
[[VRFW.SynergyPool]]
