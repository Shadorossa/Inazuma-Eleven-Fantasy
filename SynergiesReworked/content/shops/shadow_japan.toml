schema = "VRFW.shop/2"

# Synergies Reworked › «Japón en la sombra» in the retail synergy shop (0x5B032CEA, the Mercado de fichas that sells the
# synergies for the cards of their members: here 10 cards of Dave Quagmire and 10 of Caleb Stonewall, rarity 4).
[[edit]]
target = "0x5B032CEA"
  [[edit.entry]]
  item = "shadow_japan"
  stock = 1
  costs = [
    { currency = "neo_japan_captain_card", count = 10 },
    { currency = "japan_resistance_card", count = 10 },
  ]

# Inazuma Fantasy's training shop also sells it, at the price of every other synergy there (1 Punto de pasión, stock 1);
# only while Inazuma Fantasy is active.
[[edit]]
target = "inazuma_fantasy_2.training_shop"
if_mod = "inazuma_fantasy_2"
  [[edit.entry]]
  item = "shadow_japan"
  price = 1
  currency = "tk_bb000001"
  stock = 1
