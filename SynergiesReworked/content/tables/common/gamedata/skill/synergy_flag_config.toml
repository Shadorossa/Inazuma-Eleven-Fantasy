# (the genetic super-abilities), Velocidad de movimiento +3 % (the improved body) and, as the secondary effect, AT y DF del
# equipo durante la segunda mitad +2 % (the «second stage»). Conditions: Fei and Zanark (chara_base ids of c05020110 and
# c05021500); who counts is decided by the pool of content/synergies/reworked_synergies.toml.
[[add]]
key = "sf11003"
