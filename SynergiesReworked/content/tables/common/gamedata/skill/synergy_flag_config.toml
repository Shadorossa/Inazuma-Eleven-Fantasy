cells = { REF_EFFECT = { set = [
  { effect = -2121384353, value = 4, flag_9 = 1 },
  { effect = 411529189, value = 3, flag_9 = 1 },
  { effect = -1611085049, value = 2, flag_9 = 0 },
] }, REF_EXEC_COND = { set = [
  { chara = 384621588 },    # Fei c05020110
  { chara = -1337842964 },  # Zanark c05021500
] } }

