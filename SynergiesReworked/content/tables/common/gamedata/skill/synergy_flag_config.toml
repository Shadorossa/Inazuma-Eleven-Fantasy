schema = "VRFW.table/1"
table = "skill/synergy_flag"

# Synergies Reworked › the synergy_flag_config row of «Los cuatro magníficos» (key sf11001 = the item's id, cloned from the
# offensive retail row sf10001, whose two effect / condition children are replaced). Effects (retail effect kinds, values in %):
# AT del equipo +3 %, Valor de foco en AT +4 %, and as the secondary effect AT y DF del equipo durante la segunda mitad +2 %.
# Conditions: the four seasons players (chara_base ids of Ted Autumn, Alan Sumner, Verne Spring, George Winters): all four.

[[add]]
key = "sf11001"
from = "sf10001"
cells = { REF_EFFECT = { set = [
  { effect = -1473100456, value = 3, flag_9 = 1 },
  { effect = 911659259, value = 4, flag_9 = 1 },
  { effect = -1611085049, value = 2, flag_9 = 0 },
] }, REF_EXEC_COND = { set = [
  { chara = 301359785 },   # Ted Autumn
  { chara = 801048994 },   # Alan Sumner
  { chara = 1320565835 },   # Verne Spring
  { chara = -277304390 },   # George Winters
] } }

# Estrellas asiáticas (sf08001, retail «Las estrellas de China»): the pool is wide (any 3 of 14 national teams instead of
# 2 named players), so its values are lower (docs/game/mechanics/synergy-rework.md §4.2: an easier requirement, smaller
# lines). Valor de foco en AT en campo contrario 8 -> 6 %, Velocidad de movimiento 5 -> 3 %; the effect kinds stay.
[[set]]
key = "sf08001"
cells = { REF_EFFECT = { set = [
  { effect = 1071684816, value = 6, flag_9 = 1 },
  { effect = 411529189, value = 3, flag_9 = 0 },
] } }

# Japón en la sombra (sf11002, a NEW synergy cloned from the offensive retail row sf10001): a two-team pair, one player of
# each team, so small pair values (retail pairs: 2 lines of +2-5 %): AT del equipo +2 %, and as the secondary effect
# Valor de foco en AT +3 %. Conditions: Neo Japón's captain Dave Quagmire and Caleb Stonewall (Resistencia Japón); who
# counts is decided by the pools of content/synergies/reworked_synergies.toml.
[[add]]
key = "sf11002"
from = "sf10001"
cells = { REF_EFFECT = { set = [
  { effect = -1473100456, value = 2, flag_9 = 1 },
  { effect = 911659259, value = 3, flag_9 = 0 },
] }, REF_EXEC_COND = { set = [
  { chara = 532942127 },    # Dave Quagmire c03030070
  { chara = 1461484648 },   # Caleb Stonewall c06039230
] } }

# Los chicos de la Segunda Fase (sf11003, a NEW synergy cloned from the offensive retail row sf10001): a wide pool (any 3 of
