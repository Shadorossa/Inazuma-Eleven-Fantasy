schema = "VRFW.technique/3"
# All Miximaxed › the two miximax carriers (docs/game/mods/all-miximaxed.md §1; docs/game/miximax/miximax-chrono-stone.md
# §12.5). Moved from Inazuma Fantasy's techniques/auras/auras.toml and techniques/texts/texts.toml on 2026-10-14: the
# same keys, ids (crc32 of the key) and text ids, so saves keep their items.
# "none": a text written in some languages replaces only those (no default-language fallback)
default_lang = "none"

# «Crear miximax»: a clone of the retail «Miximax Trans» row wmm00220 with no owner list (any player may equip it),
# listed first among the miximax items; only a list entry (the skill board's aura list while it asks for it), never
# fired: the creation flow replaces it by the carrier.
[[aura_command]]
key = "wmm_evt_create"
from = "wmm00220"
cells = { name_text = 0x38C33D9C, desc_text = 0x6D55EFCE, order = 1 }
charas = []

# The carrier of every created miximax: a clone of the retail Mix-Max row wmm00210 (its HDP cost, time, buffs and the
# «Miximax Trans» cut-in ev82_00010) whose variant card is the carrier character's (characters/carrier.toml,
# 0x8493F412: only used without a fusion; with one, the framework builds the base himself in the partner's colours).
# Hidden in the ability lists (each board slot gets its own copy).
[[aura_command]]
key = "wmm_evt"
from = "wmm00210"
cells = { name_text = 0x7B918955, desc_text = 0x2E075B07, chara_param = 0x8493F412, order = 0x0001869F }
charas = []

# their names and descriptions (skill_text). The descriptions say what the miximax gives on its own (the partner's
# colours, as a retail Mix-Max); a game mode with more miximax rules may edit them.

[[text]]
id = 0x2E075B07
kind = "text"
add = true
ja = "Miximax with the chosen partner.\nWhile active: his hair, skin and eye colours\nand the Mix-Max boosts."
en = "Miximax with the chosen partner.\nWhile active: his hair, skin and eye colours\nand the Mix-Max boosts."
es = "Miximax con el compañero elegido.\nMientras dura: su pelo, su piel y sus ojos,\ny las mejoras del Mix-Max."
fr = "Miximax with the chosen partner.\nWhile active: his hair, skin and eye colours\nand the Mix-Max boosts."
