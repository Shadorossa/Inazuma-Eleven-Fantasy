# True Hissatsu › the move-rank items on Character Reforged's «Fantasy» skill table (docs/game/mechanics/
# move-rank-items.md; docs/framework/skill-table-host.md): a ROW ACTION of that screen's host. CMD_FUNC1 on a move row
# uses the Libro de mejora de supertécnica or the Cuaderno de evolución definitiva on the row's move; the guide entry
# «Subir nivel» shows while the player holds one. The function is this mod's hook file of the screen (graft
# move_rank_items, rank_items_skill_table.lua). The [[host]] is Character Reforged's (content\menus\
# skill_table_host.toml); it is declared here too (same id, same list) so the entry is valid while Character Reforged
# is off (True Hissatsu does not require it: nothing reads the entry then).
schema = "VRFW.menu/2"

[[host]]
id = "character_reforged.skill_table.row_action"
label = { es = "Tabla de habilidades: acción de fila", en = "Skill table: row action", fr = "Table des techniques : action de ligne", de = "Fähigkeitentabelle: Zeilenaktion", it = "Tabella abilità: azione di riga", pt = "Tabela de habilidades: ação de linha", ja = "スキル表：行のアクション", zh_hans = "技能表：行操作", zh_hant = "技能表：行操作" }

[[entry]]
host = "character_reforged.skill_table.row_action"
id = "rank_items"
text = "TrueHissatsu.RankItemGuide"
order = 100
action = { lua = "TrueHissatsu.SkillTableRankItem" }
