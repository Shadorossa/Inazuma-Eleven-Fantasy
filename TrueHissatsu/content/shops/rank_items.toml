schema = "VRFW.shop/2"
# True Hissatsu › the move-rank items in the Tienda general (0xF24DB4CD, «Consumibles» tab;
# docs/game/mechanics/move-rank-items.md §2). A price without `currency` is in the shop's first currency: Puntos de
# amistad. Moved from Inazuma Fantasy's shops\move_rank_items.toml on 2026-10-14.
# * Libro de mejora de supertécnica (technique_upgrade_book, its own item since 2026-10-14): 15 Puntos de amistad, the
#   price the retail «Nueva posibilidad» row (abl_000001) had when this mod renamed it; that row stays retail.
# * Cuaderno de evolución definitiva (ultimate_evolution_manual): the only way to a move's last level, so the rare one:
#   200 Puntos de amistad (the large EXP orb costs 81).

[[edit]]
target = "0xF24DB4CD"           # Tienda general

  [[edit.entry]]
  item = "technique_upgrade_book"
  price = 15

  [[edit.entry]]
  item = "ultimate_evolution_manual"
  price = 200
