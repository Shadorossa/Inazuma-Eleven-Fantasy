# True Hissatsu › the key that uses a move-rank item on Victory Road's own skill board (ability_learning_board_menu;
# docs/game/mechanics/move-rank-items.md «Victory Road's board»; graft move_rank_items, rank_items_board.lua). The
# board is native and its keys are taken (A the piece, X the «editable» toggle / Utilities' combo partners, Y the quick
# bean equip, L3 the bean trade, RT the fast cursor, L / R the player), so the use has its own rebindable action: a row
# «Usar libro de supertécnica» in «Configuración de controles», tab «Controles básicos». Default: pad LT (no row of
# the board's menu setting), keyboard U. The bottom guide's glyph is the markup <CMD_TRUEHISSATSU_RANK_ITEM_USE> (text
# row TrueHissatsu.RankItemUseKey), so it follows the binding and the device. Character Reforged's «Fantasy» skill table
# uses its own row key (CMD_FUNC1), not this one.
schema = "VRFW.input/1"

[[action]]
id = "TrueHissatsu.RankItems.Use"
command = "CMD_TRUEHISSATSU_RANK_ITEM_USE"
ctrl = ["MENU_CTRL", "MENU_CTRL_WITH_ANALOG_MOVE_FOCUS"]
category = "basic"
label = "TrueHissatsu.RankItemUseAction"
pad = "LT"
keyboard = "U"
