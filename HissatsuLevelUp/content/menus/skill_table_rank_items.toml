# Hissatsu Level Up › the move-rank items on Character Reforged's «Fantasy» skill table (docs/game/mechanics/
# move-rank-items.md; docs/framework/skill-table-host.md): a ROW ACTION of that screen's host. CMD_FUNC1 (Start) on a
# move row uses the Libro de mejora de supertécnica or the Cuaderno de evolución definitiva on the row's move; the
# guide entry «<Start> Subir nivel» shows on every move row (without an item the press says why). The function is this mod's hook file of the screen (graft
# move_rank_items, rank_items_skill_table.lua). The [[host]] is Character Reforged's (content\menus\
# skill_table_host.toml); the entry is left out while Character Reforged is off (`if_mod`: Hissatsu Level Up does not
# require it, and nothing reads the entry then).
schema = "VRFW.menu/2"

[[entry]]
host = "character_reforged.skill_table.row_action"
id = "rank_items"
text = "HissatsuLevelUp.RankItemGuide"
order = 100
action = { lua = "HissatsuLevelUp.SkillTableRankItem" }
if_mod = "character_reforged"
