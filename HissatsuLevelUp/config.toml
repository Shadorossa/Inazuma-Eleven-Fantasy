# Hissatsu Level Up: the rules of the special-move levels (read by scripts\hissatsu_level_up.lua at the start; restart the game
# after a change). Mechanism: docs/game/mechanics/skill-rank-usage.md §7, items: docs/game/mechanics/move-rank-items.md.
# Split out of Inazuma Fantasy's [skill_rank] on 2026-10-14 (docs/refactor/aura-mods-split.md «True Hissatsu»).
# A user layer: [mods.HissatsuLevelUp.ranks] in the loader's config.toml, key by key (survives mod updates).

[ranks]
# THE use curve of every special move: the TOTAL uses (per player and move, all offline matches) to reach grade 1, 2,
# 3, 4 = Nv.2, Nv.3, Nv.4, Nv.5 (G2…G5 / 改 真 爆 超… / V2…; grade 0 = Nv.1 = no uses). 1 to 5 strictly increasing
# values (fewer values = a lower top grade); invalid values switch the levels off (logged). A 5th value only matters
# with last_grade_item_only = false. Grades already earned are never lowered by a new curve.
thresholds = [10, 25, 50, 120]
# "uses": a move's level = the grade earned by use (copies on the board give nothing); "max": the higher of the board
# copies (retail rule) and the grade earned by use
mode = "uses"
# the move's recast grows with its level: × (1 + recast_per_grade × grade), 0..1 (power: the retail +10 % per grade, game_param addRatePerSkillRank_SkillPower; this mod does not change it)
recast_per_grade = 0.025
# the «<move> sube a Nv.N» banner in the match when a move levels up (text HissatsuLevelUp.RankUpSuffix)
popup = true
# one log line per counted use (loader.log)
log_uses = true
# The move-rank items (item keys = the item's key string, crc32 = its id; "" = none). raise_item: +1 level, up to the
# second-to-last: the «Libro de mejora de supertécnica» (HissatsuLevelUp.technique_upgrade_book, key abl_ub000001; its own
# item since 2026-10-14, the retail abl_000001 «Nueva posibilidad» is no longer a book); last_grade_item: second-to-last
# -> last level (G5 -> GO, 超 -> 神, Z -> ∞), the «Cuaderno de evolución definitiva» (Galaxy's 究極進化の書). Both in
# content\items\rank_items.toml.
raise_item = "abl_ub000001"
last_grade_item = "abl_ue000001"
# true: use stops at the second-to-last level, only last_grade_item reaches the last one (moves already at the last
# level keep it); false: use reaches the last level too
last_grade_item_only = true

[duplicates]
# a player's set never holds the same special move twice, whatever board / screen places it (the game's board, the
# Character Reforged skill table): the placement is refused. false = the game's own rule (board copies allowed)
block = true
