# Football Reforged: the settings of its modules (read by each module's script at the start; restart the game after a
# change). The modules' ON / OFF switches are not here: they are rows of «Opciones de mods» (options.toml, group
# «Football Reforged»), changed in game. docs/game/mods/football-reforged.md

# Module goalkeeper_barrier, the GOALKEEPER'S BARRIER (scripts\goalkeeper_barrier.lua, docs/game/mechanics/gk-barrier.md;
# was Inazuma Fantasy's [gk_barrier] until 2026-10-14): every team's keeper has a barrier (a 0-100 % gauge, drawn ORANGE
# inside his fatigue bar of the scoreboard, at its goal side: own team left end, rival right end). While it is > 0
# every shot that reaches him has its power divided by `mitigation` for his save (catch, punch or keeper move); at 0 he
# saves with the shot's full power. It wears down with his fatigue (the match resource `fatigue_resource`):
#   barrier = start_percent x clamp(1 - fatigue_rate x (1 - stamina / stamina max), 0, 1)
# (fatigue_rate 1: proportional; 2: empty at half stamina). `fatigue_resource` = stamina_points.pe: the PE of the mod
# Stamina Points (optional: without it the barrier stays at start_percent).
# BLOCK -> KEEPER TENSION: a block move of a team (its tension paid) makes that team keeper's NEXT keeper move cost
# (1 - tension_discount) x its tension (and usable from that tension on); used up by that move, blocks do not stack;
# discount_expire_seconds > 0 also ends it after that many match seconds (0 = until he uses a keeper move).
# block_category / keeper_category: the move slot categories of the game (unit slot byte +0x42: 3 block, 4 keeper);
# keeper_position: the formation position of the keeper (0); rescan_ms: how often the keepers are looked up.
[goalkeeper_barrier]
start_percent = 25.0
mitigation = 1.75
fatigue_rate = 1.0
fatigue_resource = "stamina_points.pe"
tension_discount = 0.30
discount_expire_seconds = 0
block_category = 3
keeper_category = 4
keeper_position = 0
rescan_ms = 1000
