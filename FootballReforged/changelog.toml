schema = "VRFW.changelog/1"
# Football Reforged: ONE general summary of what the mod offers, shown on «Novedades de mods» (docs/framework/types/changelog.md).
# Rules (the parser refuses the rest): a single [[release]], NO version / date keys, ONE page in every language
# (at most 7 rows under the mod's name: 56 letters per row, 28 CJK characters; a longer note takes 2 rows).
# Do not touch it on a version bump. Rewrite it only when what the mod offers changes.
# 1.2.0 (2026-10-15): the modules are module mods in modules\<Module>\ (Character Reforged's layout).
# 1.2.17 (2026-10-19): the module Home Stadium (modules\HomeStadium\).
# 1.2.18 (2026-10-21): the module Pressing (modules\Pressing\).
# 1.3.0 (2026-10-21): the module Duel Auras (modules\DuelAuras\).
# 1.5.0 (2026-10-21): the match formats are part of the base (no longer a module).
# 1.12.0 (2026-10-28): the module Stoppage Time (modules\StoppageTime\).
# 1.13.0 (2026-10-29): the module Skill Duel (modules\SkillDuel\).
