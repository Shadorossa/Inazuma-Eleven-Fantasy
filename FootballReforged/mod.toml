name = "Football Reforged"
version = "1.23.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "A base of match mechanics in modules: each module is a card on this mod's page in Mods (on / off, applies after a restart). Goalkeeper barrier: keepers resist shots while an orange part of their fatigue bar lasts. Furor: the GO Strikers tension gauge, a fire bar by each crest; full, L3 / R starts the furor phase. Both on by default. Match formats in the base: Football 7 (7 vs 7), Inazuma Street (3 vs 3, no keepers or referee) and the 5-a-side friendly without tactics or referee, rulebooks other mods and modes can pick."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-31"
# This mod's own names (TOML keys [FootballReforged.X], Lua FootballReforged.X, commands CMND_FOOTBALLREFORGED_*, tables
# FootballReforged.*); never VRFW.
prefix = "FootballReforged"
folder = "FootballReforged"
# Created on 2026-10-14 (owner request: «uno que se llame "FootballReforged" y sea como una base con módulos para
# seleccionar»; docs/game/mods/football-reforged.md). Since 1.2.0 (2026-10-15, owner: «unify Football Reforged modules
# in Character Reforged style») its modules are embedded module mods (docs/framework/mod-families.md §1.3), each a card on
# this mod's page in Mods (on / off in enabled.toml, applies after a restart; on by default as every new mod):
#   modules\GoalkeeperBarrier\   goalkeeper_barrier (GoalkeeperBarrier.X): the goalkeeper's barrier (docs/game/mechanics/gk-barrier.md)
#   modules\Furor\               furor (Furor.X): GO Strikers' furor gauge (docs/game/mechanics/furor.md)
#   modules\LegendaryMatch\      legendary_match (LegendaryMatch.X): the «Legendary» rival AI of every offline match
#                                (data on VRFW.MatchAI; docs/game/mods/legendary-match.md)
#   modules\Pachangas\           pachangas (Pachangas.X): the type row of «Plantilla de equipo» and every dock's 5v5
#                                team (the mirror of its 11v11 team), the active pachanga team (was Inazuma Fantasy's)
#   modules\Challenges\          challenges (Challenges.X): the match challenge rulesets, their defaults and formation,
#                                the office trial friendlies, triggers and rivals (were Inazuma Fantasy's)
#   modules\HomeStadium\         home_stadium (HomeStadium.X): each player team's home stadium, picked in «Plantilla de
#                                equipo» among the owned stadiums, for its home matches (docs/game/mods/home-stadium.md)
#   modules\Pressing\             pressing (Pressing.X): without the ball L2 is a press button (2-4 AI teammates sprint
#                                at the carrier) instead of the focus field, for the user and the CPU (docs/game/mods/pressing.md)
#   modules\DuelAuras\           duel_auras (DuelAuras.X): in a duel an aura (keshin, totem, armour, Mix-Max, mode change)
#                                is never the answer to a special move: it activates and the choice stays open, both
#                                sides (the VR-Framework's [VRFW.DuelAura]; was Character Reforged's, gated by its option)
#   modules\GoGameplay\          go_gameplay (GoGameplay.X): Inazuma Eleven GO style duels (side run back, no focus
#                                countdown, no sliding tackles); off by default (docs/game/mods/go-gameplay.md)
#   modules\StoppageTime\        StoppageTime (StoppageTime.X): added time at the end of every half from its events
#                                and play-on while a team attacks when it runs out (docs/game/mods/stoppage-time.md)
#   modules\SkillDuel\           SkillDuel (SkillDuel.X): a plain focus duel is won by reading the side: a contact on the
#                                defender wins for him, the stats only nudge his reach (docs/game/mods/skill-duel.md)
#   modules\AIRoles\             AIRoles (AIRoles.X): per-player AI roles by position that move a player without the
#                                ball, Manual and Commander (VRFW match roles; docs/game/mods/ai-roles.md). 1.18.0
# Until 1.1.0 they were internal modules (option rows of «Opciones de mods»); those rows are gone.
# 1.4.0 (owner 2026-10-21): the own keeper's fatigue bar on the scoreboard empties left to right (anchored at its
# inner, crest, end), mirroring the rival's bar (retail, empties right to left): assets\menu\00_soccer\soccer00\soccer00_01_kp\
# soccer00_01_kp.g4mg, the retail mesh file with the mask UVs (set 1) of _keeper_hp_gauge01_s turned 180 degrees (same
# size as retail, 448 bytes; docs/game/mechanics/gk-barrier.md §4).
# 1.8.0 (owner 2026-10-21): GO Gameplay 1.1.0, the GO choice duel (VRFW duel choice service).
# 1.6.0 (owner 2026-10-21): the module GO Gameplay (modules\GoGameplay\, off by default).
# 1.5.0 (owner 2026-10-21): the match formats are part of the base, no longer the module match_formats (MatchFormats\).
#   content\rules\football_7.toml, inazuma_street.toml, if_pachanga_5v5.toml   the rulebooks Football 7, Inazuma Street and
#                                the 5v5 friendly without tactics or referee (were Inazuma Fantasy's; ids unchanged)
#   content\formations\formation_config.toml   if_form_street_3 / if_form_7_1231; GENERATED by
#                                research/scripts/if_match_formations_build.py
#   Their names: text keys football_reforged.ruleset_<id> (text\keys.toml). The [[merged]] entry below keeps every
#   `requires` / enabled.toml entry of the old id match_formats working.
requires = ["VRFW>=2.4.75"]
