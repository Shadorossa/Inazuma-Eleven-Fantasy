# Football Reforged's goalkeeper barrier on the match HUD (module goalkeeper_barrier, docs/game/mechanics/gk-barrier.md
# §4): the barrier is drawn INSIDE each keeper's fatigue bar of the scoreboard (layer soccer00_01_kp_scoreboard_kp:
# own team's bar on the left, rival's on the right, under the team names) as an ORANGE segment at the bar's goal side:
# the LEFT end of the own team's bar, the RIGHT end of the rival's; its length = the barrier % of the bar (25 % fresh,
# shorter as the keeper tires, gone at 0). The layer football_reforged_barrier (the mod's
# content\menus\goalkeeper_barrier_hud.toml: the retail btl06_13 gauge, only its fill shown, swapped for the orange
# football_reforged_barrier_fill01; 2 instances hung on the keeper bar layer's locators _pos_hp01 / _pos_hp02). Value:
# CMND_FOOTBALLREFORGED_GOALKEEPER_BARRIER(-1 own / -2 rival) of the mod's scripts\goalkeeper_barrier.lua; no answer
# (module off in «Opciones de mods», no match) = hidden. Replaces Inazuma Fantasy's graft gk_barrier_hud (a separate
# orange bar under the hyper gauges) since 2026-10-14. Wrapper only (UpdateScoreboardKeeperHp, every frame from
# StepSoccerConstantMenu); nothing at chunk load but globals.
name = "football_reforged_barrier_hud"
mod = "football_reforged"
order = 320
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["UpdateScoreboardKeeperHp"]
description = "Football Reforged: the goalkeeper barrier as an orange segment inside each keeper's fatigue bar"

[[files]]
stem = "soccer_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "football_reforged_barrier_hud.lua"
  marker = "FootballReforged barrier hud"

# 5v5 / pachanga / battle matches: their HUD is soccer_battle_constant_menu (own script, same include, the keeper bar
# layer in its group of soccer_constant_menu_setting.cfg)
[[files]]
stem = "soccer_battle_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "football_reforged_barrier_hud.lua"
  marker = "FootballReforged barrier hud"
