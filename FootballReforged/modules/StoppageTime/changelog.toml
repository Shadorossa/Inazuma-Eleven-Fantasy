[[release]]
icon = "general"
notes = [
    "Cada parte tiene tiempo añadido, como en el fútbol.",
    "Faltas, técnicas, paradas, goles y cambios suman.",
    "Al final sale «+N» y el reloj sigue corriendo.",
    "Si atacas en campo rival al acabar, la jugada sigue.",
    "Módulo de Football Reforged.",
]

[release.en]
notes = [
    "Every half gets added time, as in football.",
