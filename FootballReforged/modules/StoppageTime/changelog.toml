schema = "VRFW.changelog/1"
# Stoppage Time: ONE general summary of what the mod offers, shown on «Novedades de mods» (docs/framework/types/changelog.md).
# Rules (the parser refuses the rest): a single [[release]], NO version / date keys, ONE page in every language
# (at most 7 rows under the mod's name: 56 letters per row, 28 CJK characters; a longer note takes 2 rows).
# Do not touch it on a version bump. Rewrite it only when what the mod offers changes.
# 1.0.0 (2026-10-28): created (a module of Football Reforged).
lang = "es"
name = "Tiempo añadido"

