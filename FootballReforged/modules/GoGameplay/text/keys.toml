# Texts of GO Gameplay, a module of Football Reforged (docs/framework/types/text.md): the name and description of its
# card on Football Reforged's page in Mods.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "GO-style duels"
mod_description = "Inazuma Eleven GO style duels. In a focus battle nobody moves and there is no countdown: pick a special move or a side (left / right). Same side, the defender wins; opposite sides, the attacker. A rival special move beats your side unless your power is far higher. No sliding tackles, for you and the CPU."

[es.new]
mod_name = "Duelos estilo GO"
mod_description = "Duelos al estilo de Inazuma Eleven GO. En una batalla de foco nadie se mueve y no hay cuenta atrás: eliges una supertécnica o un lado (izquierda / derecha). Mismo lado, gana el defensor; lados opuestos, el atacante. La supertécnica del rival vence a tu lado salvo que tu poder sea muy superior. Sin entradas deslizantes, para ti y para la CPU."

[fr.new]
mod_name = "Duels style GO"
mod_description = "Duels façon Inazuma Eleven GO. Dans une bataille de focus, personne ne bouge et il n'y a pas de compte à rebours : tu choisis une supertechnique ou un côté (gauche / droite). Même côté, le défenseur gagne ; côtés opposés, l'attaquant. La supertechnique adverse bat ton côté sauf si ta puissance est bien plus élevée. Pas de tacles glissés, ni pour toi ni pour le CPU."

[de.new]
mod_name = "Duelle im GO-Stil"
mod_description = "Duelle wie in Inazuma Eleven GO. Im Fokus-Kampf bewegt sich niemand und es gibt keinen Countdown: Wähle eine Spezialtechnik oder eine Seite (links / rechts). Gleiche Seite, der Verteidiger gewinnt; gegenüberliegende Seiten, der Angreifer. Die Spezialtechnik des Gegners schlägt deine Seite, außer deine Stärke ist viel höher. Keine Grätschen, weder für dich noch für die CPU."

[it.new]
mod_name = "Duelli in stile GO"
mod_description = "Duelli come in Inazuma Eleven GO. In una battaglia focus nessuno si muove e non c'è conto alla rovescia: scegli una supertecnica o un lato (sinistra / destra). Stesso lato, vince il difensore; lati opposti, l'attaccante. La supertecnica avversaria batte il tuo lato a meno che la tua potenza sia molto più alta. Niente scivolate, né per te né per la CPU."

[pt.new]
mod_name = "Duelos ao estilo GO"
mod_description = "Duelos ao estilo de Inazuma Eleven GO. Numa batalha de foco ninguém se mexe e não há contagem decrescente: escolhes uma supertécnica ou um lado (esquerda / direita). Mesmo lado, ganha o defensor; lados opostos, o atacante. A supertécnica do rival vence o teu lado a menos que o teu poder seja muito maior. Sem carrinhos, nem para ti nem para o CPU."

[ja.new]
mod_name = "GO式デュエル"
mod_description = "イナズマイレブンGO風のデュエル。フォーカスバトルでは誰も動かず、カウントダウンもない：必殺技か左右のどちらかを選ぶ。同じ側なら守備側の勝ち、逆なら攻撃側の勝ち。相手の必殺技は、あなたのパワーが大きく上回らない限りあなたの選んだ側に勝つ。スライディングはなし（あなたもCPUも）。"

[zh_hans.new]
mod_name = "GO式对决"
mod_description = "《闪电十一人GO》风格的对决。焦点对决中谁都不动，也没有倒计时：选择必杀技或一侧（左／右）。同侧则防守方获胜，异侧则进攻方获胜。除非你的力量远远更高，否则对手的必杀技会胜过你选的一侧。没有铲球，你和电脑都一样。"

[zh_hant.new]
mod_name = "GO式對決"
mod_description = "《閃電十一人GO》風格的對決。焦點對決中誰都不動，也沒有倒數計時：選擇必殺技或一側（左／右）。同側則防守方獲勝，異側則進攻方獲勝。除非你的力量遠遠更高，否則對手的必殺技會勝過你選的一側。沒有鏟球，你和電腦都一樣。"
