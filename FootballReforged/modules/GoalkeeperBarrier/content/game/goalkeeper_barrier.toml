# Goalkeeper Barrier › what scripts\goalkeeper_barrier.lua touches of the game: the match, the soccer actors and units it
# reads, the cost point it answers on, the HUD command.
#
# Module goalkeeper_barrier (scripts\goalkeeper_barrier.lua, docs/game/mechanics/gk-barrier.md; was Inazuma Fantasy's
# content\game\gk_barrier.toml + answer 6b of its St_AuraCostCheck until 2026-10-14).
schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ globals / structs

# CSceneSoccer* [0x21F6350] (a new scene object = a new match), from the scene driver's update call 0x1423EA5
[[VRFW.Global]]
name = "football_scene"
rip = { pattern = "48 8B 0D ?? ?? ?? ?? 48 85 C9 74 09 41 0F 28 C8 E8 ?? ?? ?? ?? 4C 8D 9C 24 A0 00 00 00", disp_off = 3, next_ip_off = 7, rva = 0x1423EA5, target_rva = 0x21F6350 }

# The match info block [[g_gameRoot]+0x6A58] (+0x60 + team x 0x1130 the team blocks: +0x1058 tension, +0x1068 / +0x106C
# the scoreboard's keeper bar f32 current / max; +0x2C29 the user's team)
[[VRFW.Global]]
name = "football_match"
base = "game_root"
chain = ["ROOT_MATCH"]

# The fields of the match info block (football_match) the script reads: each team's tension (x 10000; team block
# 0x60 + team x 0x1130, +0x1058) and the user's team.
[[VRFW.Struct]]
name = "FootballMatchInfo"
size = 0x2C2A
fields = { tension0 = { at = 0x10B8, type = "i32" }, tension1 = { at = 0x21E8, type = "i32" }, user_team = { at = 0x2C29, type = "u8" } }

# A team member (FootballUnit.member): his formation position.
[[VRFW.Struct]]
name = "FootballMember"
size = 0x72
fields = { position = { at = 0x71, type = "u8" } }

# A soccer actor ([g_soccerActors] + index x 0x570): its handle, team, the in-play byte.
[[VRFW.Struct]]
name = "FootballActor"
size = 0x570
fields = { handle = { at = 0x94, type = "u32" }, team = { at = 0xD0, type = "u8" }, in_play = { at = 0x497, type = "u8" } }

# A match unit (FootballActorUnit(actor)): the member link (+0x71 his formation position), the 6 move slots (move id,
# slot category: 1 shot, 2 dribble, 3 block, 4 keeper, 8 aura) and the recast records' tension costs.
[[VRFW.Struct]]
name = "FootballUnit"
size = 0x380
fields = { member = { at = 0x28, type = "ptr" }, move0 = { at = 0x30, type = "u32" }, category0 = { at = 0x42, type = "u8" }, move1 = { at = 0x4C, type = "u32" }, category1 = { at = 0x5E, type = "u8" }, move2 = { at = 0x68, type = "u32" }, category2 = { at = 0x7A, type = "u8" }, move3 = { at = 0x84, type = "u32" }, category3 = { at = 0x96, type = "u8" }, move4 = { at = 0xA0, type = "u32" }, category4 = { at = 0xB2, type = "u8" }, move5 = { at = 0xBC, type = "u32" }, category5 = { at = 0xCE, type = "u8" }, cost0 = { at = 0x2E0, type = "u32" }, cost1 = { at = 0x2F8, type = "u32" }, cost2 = { at = 0x310, type = "u32" }, cost3 = { at = 0x328, type = "u32" }, cost4 = { at = 0x340, type = "u32" }, cost5 = { at = 0x358, type = "u32" } }

# ------------------------------------------------------------------------------------------------ the cost check

# bool AuraCostCheck(req{u32 hdl, u8 slot, u8 flag}) 0x16710F0: the engine's «the gauge / the tension covers this
# slot» (HUD state, input, the AI, the menus). Provider of the framework's one detour of that entry (hook bus,
# docs/framework/match-resource.md §10), order 6: outside the PE / pool mods' providers (Stamina Points 4, Aura Points
# 5), inside Inazuma Fantasy's (10, whose refusals still win). Post answer, native (no Lua per call):
#   module goalkeeper_barrier: after a block move of his team, the keeper's keeper moves are available from
#   (1 - [goalkeeper_barrier] tension_discount) x their tension: table GoalkeeperBarrier.KeeperTension (handle, move) ->
#   ok 0 / 1, filled every match frame by scripts\goalkeeper_barrier.lua while the discount is armed (no record = this
#   answer does not apply; module off = the table is empty). A move Aura Points decides (a key of its exported table
#   AuraPoints.Pair: the running spirit's own move, a fusion partner's move) is left alone.
[[VRFW.Hook]]
name = "GoalkeeperBarrier_AuraCostCheck"
game = "Stamina.AuraCostCheck"
kind = "function"
order = 6

[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }, { value = "[unit([args[1]]:u32) + 0x42 + [args[1] + 4]:u8 * 0x1C]:u8", not = 8 }, { value = ["[args[1]]:u32", "[unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32"], not_in_table = "aura_points/AuraPoints.Pair" }]
value = "if(ret > 0, 1, lookup(GoalkeeperBarrier.KeeperTension:ok, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32))"

# ------------------------------------------------------------------------------------------------ HUD commands

# CMND_GOALKEEPERBARRIER_GET(side, bar_rate) -> ok, percent (0..100), discount (0/1), team, user (0/1), barrier share
# (% of the bar), hud_debug (0/1); bar_rate = the keeper bar's fill 0..1 as the scoreboard draws it (the barrier's source).
# side 0 / 1 = that team, -1 = the user's team, -2 = the rival's (graft goalkeeper_barrier_hud: the bronze
# segment inside each keeper's bar, from the barrier line). false = module off / no match / no keeper.
[[VRFW.Command]]
name = "CMND_GOALKEEPERBARRIER_GET"
handler = "GoalkeeperBarrier.Get"

# the name it had as Football Reforged's internal module (until FR 1.1.0)
[[VRFW.Command]]
name = "CMND_FOOTBALLREFORGED_GOALKEEPER_BARRIER"
handler = "GoalkeeperBarrier.Get"
