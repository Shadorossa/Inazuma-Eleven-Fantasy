# Texts of Goalkeeper Barrier, a module of Football Reforged (docs/framework/types/text.md): the name and description of
# its card on Football Reforged's page in Mods.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Goalkeeper barrier"
mod_description = "Every keeper's barrier is the top 25 % of his bar on the scoreboard, drawn bronze: while his bar is above 75 % the shots he faces lose power (÷ 1.75); below that they keep their full power. A block move of his team makes his next keeper move 30 % cheaper in tension."

[es.new]
mod_name = "Barrera del portero"
mod_description = "La barrera de cada portero es el 25 % superior de su barra del marcador, pintado de bronce: mientras su barra está por encima del 75 %, los tiros que recibe pierden potencia (÷ 1,75); por debajo, llegan con toda su potencia. Una técnica de bloqueo de su equipo abarata un 30 % la tensión de su siguiente técnica de portero."

[fr.new]
mod_name = "Barrière du gardien"
mod_description = "La barrière de chaque gardien est le haut de sa barre du tableau d'affichage (25 %), en bronze : tant que sa barre dépasse 75 %, les tirs qu'il reçoit perdent de la puissance (÷ 1,75) ; en dessous, ils gardent toute leur puissance. Une technique de blocage de son équipe rend sa prochaine technique de gardien 30 % moins chère en tension."

[de.new]
mod_name = "Torwart-Barriere"
mod_description = "Die Barriere jedes Torwarts sind die oberen 25 % seines Balkens auf der Anzeigetafel, bronzefarben: solange sein Balken über 75 % liegt, verlieren Schüsse auf ihn an Kraft (÷ 1,75); darunter behalten sie ihre volle Kraft. Eine Blocktechnik seines Teams macht seine nächste Torwarttechnik 30 % billiger in Spannung."

[it.new]
mod_name = "Barriera del portiere"
mod_description = "La barriera di ogni portiere è il 25 % superiore della sua barra sul tabellone, in bronzo: finché la barra è sopra il 75 %, i tiri che riceve perdono potenza (÷ 1,75); sotto, arrivano con tutta la potenza. Una tecnica di blocco della sua squadra rende la sua prossima tecnica da portiere più economica del 30 % in tensione."

[pt.new]
mod_name = "Barreira do guarda-redes"
mod_description = "A barreira de cada guarda-redes são os 25 % de cima da sua barra no marcador, a bronze: enquanto a barra está acima de 75 %, os remates que recebe perdem potência (÷ 1,75); abaixo, chegam com toda a potência. Uma técnica de bloqueio da sua equipa torna a sua próxima técnica de guarda-redes 30 % mais barata em tensão."

[ja.new]
mod_name = "キーパーバリア"
mod_description = "各キーパーのバリアはスコアボードのゲージの上部25％（ブロンズ色）。ゲージが75％より上の間は受けるシュートの威力が1.75分の1になり、それ以下では威力はそのまま。チームのブロック技を使うと次のキーパー技のテンションが30％安くなる。"

[zh_hans.new]
mod_name = "门将屏障"
mod_description = "每名门将的屏障是记分板上他的槽的上部25％（青铜色）：槽高于75％时，他面对的射门威力除以1.75；低于此值则保持全部威力。本队使用拦截技后，门将的下一个守门技所需气势便宜30％。"

[zh_hant.new]
mod_name = "門將屏障"
mod_description = "每名門將的屏障是記分板上他的槽的上部25％（青銅色）：槽高於75％時，他面對的射門威力除以1.75；低於此值則保持全部威力。本隊使用攔截技後，門將的下一個守門技所需氣勢便宜30％。"
