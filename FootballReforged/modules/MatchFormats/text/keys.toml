schema = "VRFW.text_key/1"
# Texts of «Match Formats» (mod match_formats, a module of Football Reforged) (format: docs/framework/types/text.md):
# the «Mods» screen's name and description, and ruleset_<id> = the name of the ruleset <id> in the rules editor
# (ids crc32("match_formats.<key>")). A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Match Formats"
mod_description = "Match rulebooks other mods and modes can pick: Football 7 (7 vs 7 on a 1-2-3-1), Inazuma Street (3 vs 3, no keepers or referee) and the 5-a-side friendly without special tactics or referee, with the 3v3 and 7v7 formations they use."
ruleset_football_7 = "7-a-side football (7 vs 7)"
ruleset_if_pachanga_5v5 = "5-a-side friendly (no tactics or referee)"
ruleset_inazuma_street = "Inazuma Street (3 vs 3, no keepers or referee)"

