id = "match_formats"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Match Formats"
version = "1.0.1"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Match rulebooks other mods and modes can pick: Football 7 (7 vs 7 on a 1-2-3-1), Inazuma Street (3 vs 3, no keepers or referee) and the 5-a-side friendly without special tactics or referee, with the 3v3 and 7v7 formations they use."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-15"
# This mod's own names: TOML keys MatchFormats.X, text keys match_formats.<key>; never VRFW. The ruleset and formation
# ids are global and kept as they were in Inazuma Fantasy.
prefix = "MatchFormats"
folder = "MatchFormats"
# Moved out of Inazuma Fantasy (id inazuma_fantasy, research/mods/_aside, its part match_formats and the 5v5 ruleset of
# its part office) on 2026-10-15 (owner request: the match formats live in Football Reforged). Ids unchanged, so every
# friendly, binding or team that names them keeps working. Standard mod layout (docs/framework/mod-layout.md):
#   content\rules\football_7.toml          ruleset football_7 (alias futbol_7): 7 vs 7, formation if_form_7_1231
#   content\rules\inazuma_street.toml      ruleset inazuma_street: 3 vs 3, no keepers, no referee, formation if_form_street_3
#   content\rules\if_pachanga_5v5.toml     ruleset if_pachanga_5v5: the retail 5v5 friendly without special tactics or referee
#   content\formations\formation_config.toml  if_form_street_3 (0x3285EB55) and if_form_7_1231 (0xA293A98E); GENERATED by
#                                          research/scripts/if_match_formations_build.py
#   text\keys.toml                         the mod's name / description and the rulesets' names, 9 languages
# Only declarations: the match engine of the framework applies the rulesets (docs/game/modes/formatos-3v3-7v7.md).
requires = ["vr_framework>=2.4.75", "football_reforged>=1.2.0"]
conflicts = []
loader_modules = []
permissions = []

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged (docs/framework/mod-families.md): shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "football_reforged"
order = 60
