schema = "VRFW.text_key/1"
# Texts of «Legendary Match» (mod legendary_match, 2026-10-15) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Legendary Match"
mod_description = "Every offline match is played against a «Legendary» CPU. Only the rival team (never your AI teammates): reacts at once in duels, always picks the move whose element beats yours, remembers the moves you use and counters them, keeps tension for its keeper and gains 0.5 tension per second, passes and decides without waits, shoots or chains as soon as it starts a shoot zone, presses the player who just received a pass and your tired players, tries long shots when your keeper's bar is above half, sprints while it has stamina and substitutes tired players (with Aura Points). Both teams: the defensive action range is halved."

[es.new]
mod_name = "Legendary Match"
mod_description = "Todos los partidos sin conexión se juegan contra una CPU «Legendaria». Solo el equipo rival (nunca tus compañeros controlados por la IA): reacciona al instante en los duelos, siempre elige la técnica cuyo elemento vence al tuyo, recuerda las técnicas que usas y las contrarresta, guarda tensión para su portero y gana 0,5 de tensión por segundo, pasa y decide sin esperas, tira o encadena en cuanto abre una zona de tiro, presiona al jugador que acaba de recibir un pase y a tus jugadores cansados, prueba tiros lejanos cuando la barra de tu portero pasa de la mitad, esprinta mientras tiene aguante y cambia a los jugadores cansados (con Aura Points). Ambos equipos: el alcance de las acciones defensivas se reduce a la mitad."

[fr.new]
mod_name = "Legendary Match"
mod_description = "Tous les matchs hors ligne se jouent contre un CPU « Légendaire ». Seule l'équipe adverse (jamais vos coéquipiers contrôlés par l'IA) : réagit aussitôt dans les duels, choisit toujours la technique dont l'élément bat le vôtre, retient les techniques que vous utilisez et les contre, garde de la tension pour son gardien et gagne 0,5 de tension par seconde, passe et décide sans attendre, tire ou enchaîne dès qu'elle ouvre une zone de tir, presse le joueur qui vient de recevoir une passe et vos joueurs fatigués, tente des tirs de loin quand la barre de votre gardien dépasse la moitié, sprinte tant qu'elle a de l'endurance et remplace les joueurs fatigués (avec Aura Points). Les deux équipes : la portée des actions défensives est réduite de moitié."

[de.new]
mod_name = "Legendary Match"
mod_description = "Jedes Offline-Spiel wird gegen eine «legendäre» CPU gespielt. Nur das gegnerische Team (nie deine KI-Mitspieler): reagiert in Duellen sofort, wählt immer die Technik, deren Element deines schlägt, merkt sich deine Techniken und kontert sie, spart Spannung für seinen Torwart und gewinnt 0,5 Spannung pro Sekunde, passt und entscheidet ohne Wartezeiten, schießt oder kombiniert, sobald es eine Schusszone startet, presst den Spieler, der gerade einen Pass bekommen hat, und deine müden Spieler, versucht Fernschüsse, wenn die Leiste deines Torwarts über der Hälfte ist, sprintet, solange es Ausdauer hat, und wechselt müde Spieler aus (mit Aura Points). Beide Teams: die Reichweite der Abwehraktionen wird halbiert."

[it.new]
mod_name = "Legendary Match"
mod_description = "Tutte le partite offline si giocano contro una CPU «Leggendaria». Solo la squadra avversaria (mai i tuoi compagni guidati dall'IA): reagisce subito nei duelli, sceglie sempre la tecnica il cui elemento batte il tuo, ricorda le tecniche che usi e le contrasta, tiene tensione per il portiere e guadagna 0,5 di tensione al secondo, passa e decide senza attese, tira o concatena appena apre una zona di tiro, pressa il giocatore che ha appena ricevuto un passaggio e i tuoi giocatori stanchi, prova tiri da lontano quando la barra del tuo portiere supera la metà, scatta finché ha resistenza e sostituisce i giocatori stanchi (con Aura Points). Entrambe le squadre: la portata delle azioni difensive è dimezzata."

[pt.new]
mod_name = "Legendary Match"
mod_description = "Todas as partidas offline são jogadas contra um CPU «Lendário». Só a equipa rival (nunca os teus colegas controlados pela IA): reage logo nos duelos, escolhe sempre a técnica cujo elemento vence o teu, lembra-se das técnicas que usas e contraria-as, guarda tensão para o guarda-redes e ganha 0,5 de tensão por segundo, passa e decide sem esperas, remata ou encadeia assim que abre uma zona de remate, pressiona o jogador que acabou de receber um passe e os teus jogadores cansados, tenta remates de longe quando a barra do teu guarda-redes passa da metade, faz sprints enquanto tem resistência e substitui os jogadores cansados (com Aura Points). Ambas as equipas: o alcance das ações defensivas é reduzido a metade."

[ja.new]
mod_name = "Legendary Match"
mod_description = "オフラインの全試合で「レジェンド」CPUと対戦する。相手チームのみ（味方のAI選手には影響しない）：デュエルで即座に反応し、常にあなたの属性に勝つ技を選び、あなたが使った技を覚えて対策し、キーパー用にテンションを残し毎秒テンションが0.5増え、待ち時間なしでパスと判断を行い、シュートゾーンを開くとすぐにシュートかチェインを打ち、パスを受けた選手や疲れた選手にプレスをかけ、キーパーのゲージが半分を超えるとロングシュートを狙い、スタミナがある間はダッシュし、疲れた選手を交代させ（Aura Points使用時）。両チーム：守備アクションの範囲が半分になる。"

[zh_hans.new]
mod_name = "Legendary Match"
mod_description = "所有离线比赛都与「传说」级CPU对战。仅限对手球队（不影响你的AI队友）：在对决中立即反应，总是选择属性克制你的必杀技，记住你使用的必杀技并加以克制，为门将保留气势并每秒获得0.5点气势，传球和决策毫不等待，一开启射门区域就立即射门或连锁，紧逼刚接到传球的球员和你疲劳的球员，你的门将槽超过一半时尝试远射，有体力时冲刺并换下疲劳球员（需Aura Points）。双方球队：防守动作范围减半。"

[zh_hant.new]
mod_name = "Legendary Match"
mod_description = "所有離線比賽都與「傳說」級CPU對戰。僅限對手球隊（不影響你的AI隊友）：在對決中立即反應，總是選擇屬性克制你的必殺技，記住你使用的必殺技並加以克制，為門將保留氣勢並每秒獲得0.5點氣勢，傳球和決策毫不等待，一開啟射門區域就立即射門或連鎖，緊逼剛接到傳球的球員和你疲勞的球員，你的門將槽超過一半時嘗試遠射，有體力時衝刺並換下疲勞球員（需Aura Points）。雙方球隊：防守動作範圍減半。"
