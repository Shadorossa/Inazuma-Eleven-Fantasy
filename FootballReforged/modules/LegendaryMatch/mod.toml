id = "LegendaryMatch"
former_ids = ["legendary_match"]
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Legendary Match"
version = "1.2.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Every offline match is played against a «Legendary» CPU (the game's «Batalla legendaria» AI as the base). The rival team only (never your AI teammates): dodges every sliding tackle, plays every strategy of the game's top AI level, reacts at once in duels, computes the power of every move of both players and plays the cheapest one that wins (no move against a shot it cannot stop or that a «parada» will save, a counter shot when it returns yours), always picks the move whose element beats yours, remembers the moves you use and counters them, keeps tension for its keeper and gains 0.5 tension per second, passes and decides without waits, shoots or chains as soon as it starts a shoot zone, presses the player who just received a pass and your tired players, tries long shots when your keeper's bar is above half, sprints while it has stamina and substitutes players at 15 % (with Aura Points) and for elemental advantage, never the captain, and its power charges / power blocks are a foul 5 % of the time (the game: 15 %). Both teams: the defensive action range is halved. Every value is data (content\\rules\\ai\\legendary.toml)."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-22"
# This mod's own names: TOML keys LegendaryMatch.X (profile and class names); never VRFW.
prefix = "LegendaryMatch"
folder = "LegendaryMatch"
# Created on 2026-10-15 (owner request: a «Legendaria» AI level for every match, as a module of Football Reforged;
# docs/game/mods/legendary-match.md). Standard mod layout (docs/framework/mod-layout.md):
#   content\rules\ai\legendary.toml   the match AI profiles (kind VRFW.match_ai/1, docs/framework/match-ai.md): the rival's
#                             class, rates, timers, per-team behaviours and situations; the field range of both teams
#   content\game\legendary_match.toml   the foul-chance hook (GetFoulRate) and the globals the script reads
#   scripts\legendary_match.lua          the rival's power charge / power block foul chance
#   config.toml               [legendary_match] rival_power_action_foul_rate
#   text\keys.toml            the mod's name / description, 9 languages
# The framework provides the mechanisms (VRFW.MatchAI); this module only declares the values. Switching the module off
# (its card on Football Reforged's Mods page) leaves every match to the game's AI.
# vr_framework 2.4.100: the match AI profiles (match_ai/1), the per-team knobs, the move choice, the situations, the pass lane cut, the learned tendencies, the zone / duel conditions, the strategy level, the power-aware move choice.
requires = ["VRFW>=2.87.0", "FootballReforged>=1.2.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "hook"]

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged (owner request 2026-10-15, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Football Reforged's entry; switching Football Reforged off switches it off too.
[module]
of = "FootballReforged"
order = 30
# starts switched OFF (owner 2026-10-15: the player opts in on its card); docs/framework/mod-families.md §1.4
default_enabled = false
