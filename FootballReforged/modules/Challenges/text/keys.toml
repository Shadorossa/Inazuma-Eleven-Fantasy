schema = "VRFW.text_key/1"
# Texts of «Challenges» (mod challenges, a module of Football Reforged) (format: docs/framework/types/text.md): the
# «Mods» screen's name and description, and ruleset_<id> = the name of the ruleset <id> in the rules editor
# (ids crc32("challenges.<key>")). A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Match challenges"
mod_description = "Match challenges other mods can arm: score 3 goals in 45 s, keep the ball for 15 s, steal the ball. With the all-outfield 5v5 formation of the possession challenges and the office trial friendlies (5v5, 7v7, 3v3) Inazuma Fantasy's office launches."
ruleset_challenge_goals = "Challenge: 3 goals in 45 s"
ruleset_challenge_hold = "Challenge: keep the ball for 15 s"
ruleset_challenge_steal = "Challenge: steal the ball"

[es.new]
mod_name = "Desafíos de partido"
mod_description = "Desafíos de partido que otros mods pueden activar: marcar 3 goles en 45 s, conservar el balón 15 s, robar el balón. Con la formación 5v5 sin portero de los desafíos de posesión y las pachangas de prueba (5v5, 7v7, 3v3) que lanza la oficina de Inazuma Fantasy."
ruleset_challenge_goals = "Desafío: 3 goles en 45 s"
ruleset_challenge_hold = "Desafío: conserva el balón 15 s"
ruleset_challenge_steal = "Desafío: roba el balón"

[fr.new]
mod_name = "Défis de match"
mod_description = "Défis de match que d'autres mods peuvent lancer : marquer 3 buts en 45 s, garder le ballon 15 s, voler le ballon. Avec la formation à 5 sans gardien des défis de possession et les matchs d'essai (5v5, 7v7, 3v3) que lance le bureau d'Inazuma Fantasy."
ruleset_challenge_goals = "Défi : 3 buts en 45 s"
ruleset_challenge_hold = "Défi : garde le ballon 15 s"
ruleset_challenge_steal = "Défi : vole le ballon"

[de.new]
mod_name = "Spielherausforderungen"
mod_description = "Spiel-Herausforderungen, die andere Mods starten können: 3 Tore in 45 s, den Ball 15 s halten, den Ball erobern. Mit der 5er-Formation ohne Torwart der Ballbesitz-Herausforderungen und den Probespielen (5v5, 7v7, 3v3), die das Büro von Inazuma Fantasy startet."
ruleset_challenge_goals = "Herausforderung: 3 Tore in 45 s"
ruleset_challenge_hold = "Herausforderung: halte den Ball 15 s"
ruleset_challenge_steal = "Herausforderung: erobere den Ball"

[it.new]
mod_name = "Sfide di partita"
mod_description = "Sfide di partita che altri mod possono avviare: segnare 3 gol in 45 s, tenere palla 15 s, rubare la palla. Con la formazione a 5 senza portiere delle sfide di possesso e le amichevoli di prova (5v5, 7v7, 3v3) che avvia l'ufficio di Inazuma Fantasy."
ruleset_challenge_goals = "Sfida: 3 gol in 45 s"
ruleset_challenge_hold = "Sfida: tieni palla per 15 s"
ruleset_challenge_steal = "Sfida: ruba la palla"

[pt.new]
mod_name = "Desafios de jogo"
mod_description = "Desafios de partida que outros mods podem ativar: marcar 3 gols em 45 s, segurar a bola 15 s, roubar a bola. Com a formação 5v5 sem goleiro dos desafios de posse e os amistosos de teste (5v5, 7v7, 3v3) que o escritório de Inazuma Fantasy lança."
ruleset_challenge_goals = "Desafio: 3 gols em 45 s"
ruleset_challenge_hold = "Desafio: segure a bola por 15 s"
ruleset_challenge_steal = "Desafio: roube a bola"

[ja.new]
mod_name = "試合チャレンジ"
mod_description = "他のMODが使える試合チャレンジ：45秒で3ゴール、15秒ボールキープ、ボール奪取。ポゼッション系チャレンジ用のGKなし5人制フォーメーションと、Inazuma Fantasyのオフィスが行うテストマッチ（5v5・7v7・3v3）付き。"
ruleset_challenge_goals = "チャレンジ：45秒で3ゴール"
ruleset_challenge_hold = "チャレンジ：15秒ボールキープ"
ruleset_challenge_steal = "チャレンジ：ボールを奪え"

[zh_hans.new]
mod_name = "比赛挑战"
mod_description = "其他模组可启用的比赛挑战：45秒内进3球、控球15秒、抢下球。附带控球类挑战使用的无门将5人阵型，以及Inazuma Fantasy办公室发起的测试赛（5v5、7v7、3v3）。"
ruleset_challenge_goals = "挑战：45秒内进3球"
ruleset_challenge_hold = "挑战：控球15秒"
ruleset_challenge_steal = "挑战：抢下球"

[zh_hant.new]
mod_name = "比賽挑戰"
mod_description = "其他模組可啟用的比賽挑戰：45秒內進3球、控球15秒、搶下球。附帶控球類挑戰使用的無門將5人陣型，以及Inazuma Fantasy辦公室發起的測試賽（5v5、7v7、3v3）。"
ruleset_challenge_goals = "挑戰：45秒內進3球"
ruleset_challenge_hold = "挑戰：控球15秒"
ruleset_challenge_steal = "挑戰：搶下球"
