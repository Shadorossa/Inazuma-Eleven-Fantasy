id = "training_ground"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Training Ground"
version = "1.0.1"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "A free pitch to rehearse special moves, combos and timings with no real match: top bar «Match» › «Free Mode» starts a drill from the hub you are on (5v5 or 11v11, any stadium, from no rival to a full team of any team of the game or the mods, CPU level). The clock never runs, nothing is saved, no result or rewards. SELECT in the drill opens its settings: cooldowns, tension always full, no PE / PEG / SP cost, every shot a long shot, fouls, offside, special tactics, apply, restart, leave. A module of Football Reforged; settings saved with Inazuma Fantasy are kept."
priority = 0
tags = ["Gameplay", "Mode"]
updated = "2026-10-15"
# This mod's own names (TOML keys [TrainingGround.X], Lua TrainingGround.X, commands CMND_TRAININGGROUND_*, rule flags
# training_ground.*); never VRFW.
prefix = "TrainingGround"
folder = "TrainingGround"
# Split out of Inazuma Fantasy on 2026-10-15 (owner request: «Saca de IF el campo de entrenamiento y mételo en un módulo
# de FootballReforged»; was IF's part training_field, docs/game/modes/training-field.md; this module:
# docs/game/mods/training-ground.md). Standard mod layout (docs/framework/mod-layout.md):
#   config.toml [training_ground]          formats (match row, players, CPU classes), defaults, the window's rows, the
#                                          rival team picker's series
#   scripts\training_ground.lua            settings (global save key training_field.settings), plan, rows, the
#                                          in-match effects
#   content\game\training_ground.toml      the commands CMND_TRAININGGROUND_*
#   content\game\save_import.toml          Inazuma Fantasy's saved drill settings, copied once
#   content\friendlies\training_ground.toml  the drill (the framework's friendly: no save, back to the hub)
#   content\rules\training_ground.toml     rulebook training_ground (endless, a training match, no coach mode)
#   content\modes\training_ground.toml     the mode (started from Lua)
#   content\shot_rules\long_shots.toml     «Every shot is a long shot» (the framework's shot rules)
#   content\menus\training_ground_panel.toml  the settings window's and the picker's layers on the match HUD
#   content\menus\top_bar.toml             the top bar group «Match» › «Free Mode»
#   content\inputs\panel.toml              the settings window's key (pad SELECT / keyboard U, rebindable)
#   text\rows\training_ground.toml         the window's texts (menu_text, 9 languages)
# Graft research/grafts/training_ground (mod = training_ground): the start from every hub, the title fallback in
# soccer_top_menu, the SELECT window on the match HUD.
requires = ["vr_framework>=2.4.115", "football_reforged>=1.2.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# command: its commands (the game Lua asks them)
permissions = ["command"]

[exports]
functions = []
keys = []
# the game Lua start of the drill (the mode's flow)
game_lua = ["TrainingGround_Start"]
tables = []

# A MODULE of Football Reforged (docs/framework/mod-families.md): shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too.
[module]
of = "football_reforged"
order = 50
