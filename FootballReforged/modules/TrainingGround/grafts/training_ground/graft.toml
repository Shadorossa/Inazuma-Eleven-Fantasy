# Training Ground (mod training_ground, a module of Football Reforged; docs/game/mods/training-ground.md): the game Lua
# of the drill. Was Inazuma Fantasy's graft training_field until 2026-10-15 (removed from IF that day).
#   every hub of the menus (the top bar hosts)  training_ground_start.lua: «Free Mode» served in place
#                    (VRFW_TopBarHere), the drill's start from that hub (the framework's match start service VRFW_MATCH:
#                    the plan of scripts\training_ground.lua, the friendly training_ground with return = "menus"), the
#                    restart from the same hub after «Reiniciar el entrenamiento», TrainingGround_Start (the mode's start)
#   soccer_top_menu  training_ground_hub.lua: the top bar step `training_ground` through the title (fallback)
#   soccer_menu / soccer_battle_menu  training_ground_panel.lua (11v11 / 5v5 HUD): SELECT in the drill opens its
#                    settings window (the framework's VRFW_MatchPanel; layers of content\menus\training_ground_panel.toml)
# Wrappers only; nothing at chunk load.
name = "training_ground"
mod = "training_ground"
order = 335
module = ""
requires = []
conflicts = []
wraps = ["OnInit", "PostStepSoccerMenu"]
description = "Training Ground: started from the hub the player is on (VRFW_MATCH, the retail match intro), back to that hub, its in-match settings window"

[[files]]
stem = "soccer_top_menu"

  [[files.ops]]
  type = "append_block"
  src = "training_ground_start.lua"
  marker = "training ground start"

  [[files.ops]]
  type = "append_block"
  src = "training_ground_hub.lua"
  marker = "training ground hub"

[[files]]
stem = "soccer_menu"

  [[files.ops]]
  type = "append_block"
  src = "training_ground_panel.lua"
  marker = "training ground panel"

# the HUD of a 5v5 drill (game type 2, a battle row) is soccer_battle_menu, not soccer_menu; both include
# LUA_SOCCER_MENU_INC and call PostStepSoccerMenu every frame
[[files]]
stem = "soccer_battle_menu"

  [[files.ops]]
  type = "append_block"
  src = "training_ground_panel.lua"
  marker = "training ground panel"

