schema = "VRFW.text_key/1"
# Texts of «Training Ground» (mod training_ground, a module of Football Reforged) (format: docs/framework/types/text.md):
# the «Mods» screen's name and description. A language missing here falls back to English. The drill's own texts are
# menu_text rows (text\rows\training_ground.toml).
default_lang = "en"

[en.new]
mod_name = "Training Ground"
mod_description = "A free pitch to rehearse special moves, combos and timings with no real match: top bar «Match» › «Free Mode» starts a drill from the hub you are on (5v5 or 11v11, any stadium, from no rival to a full team of any team of the game or the mods, CPU level). The clock never runs, nothing is saved, no result or rewards. SELECT in the drill opens its settings: cooldowns, tension always full, no PE / PEG / SP cost, every shot a long shot, fouls, offside, special tactics, apply, restart, leave. A module of Football Reforged; settings saved with Inazuma Fantasy are kept."

[es.new]
mod_name = "Campo de entrenamiento"
mod_description = "Un campo libre para practicar supertécnicas, combinaciones y tiempos sin partido de verdad: la barra superior «Partido» › «Modo libre» empieza un entrenamiento desde el menú en el que estés (5 contra 5 u 11 contra 11, cualquier estadio, desde ningún rival hasta un equipo completo de cualquier equipo del juego o de los mods, nivel de la CPU). El reloj no corre, no se guarda nada, sin resultado ni recompensas. SELECT en el entrenamiento abre sus ajustes: cooldowns, tensión siempre al máximo, sin gasto de PE / PEG / SP, todo tiro es tiro largo, faltas, fuera de juego, supertácticas, aplicar, reiniciar, salir. Módulo de Football Reforged; se conservan los ajustes guardados con Inazuma Fantasy."

[fr.new]
mod_name = "Terrain d'entraînement"
mod_description = "Un terrain libre pour répéter tes techniques, combinaisons et timings sans vrai match : la barre du haut «Match» › «Mode libre» lance un entraînement depuis le menu où tu es (5 contre 5 ou 11 contre 11, n'importe quel stade, d'aucun adversaire à une équipe complète de n'importe quelle équipe du jeu ou des mods, niveau de l'IA). Le chrono ne tourne pas, rien n'est sauvegardé, ni résultat ni récompenses. SELECT pendant l'entraînement ouvre ses réglages : recharges, tension toujours au maximum, pas de coût en PE / PEG / SP, tirs lointains partout, fautes, hors-jeu, tactiques spéciales, appliquer, relancer, quitter. Module de Football Reforged ; les réglages sauvegardés avec Inazuma Fantasy sont conservés."

[de.new]
mod_name = "Trainingsplatz"
mod_description = "Ein freier Platz, um Spezialtechniken, Kombinationen und Timing ohne echtes Spiel zu üben: Die obere Leiste «Spiel» › «Freier Modus» startet ein Training aus dem Menü, in dem du bist (5 gegen 5 oder 11 gegen 11, jedes Stadion, von keinem Gegner bis zu einem vollen Team aus jedem Team des Spiels oder der Mods, KI-Stufe). Die Uhr läuft nicht, nichts wird gespeichert, kein Ergebnis, keine Belohnungen. SELECT im Training öffnet seine Einstellungen: Abklingzeiten, Spannung immer voll, keine PE- / PEG- / SP-Kosten, alle Schüsse als Fernschüsse, Fouls, Abseits, Spezialtaktiken, übernehmen, neu starten, verlassen. Ein Modul von Football Reforged; mit Inazuma Fantasy gespeicherte Einstellungen bleiben erhalten."

[it.new]
mod_name = "Campo di allenamento"
mod_description = "Un campo libero per provare supertecniche, combinazioni e tempi senza una vera partita: la barra in alto «Partita» › «Modalità libera» avvia un allenamento dal menu in cui sei (5 contro 5 o 11 contro 11, qualsiasi stadio, da nessun avversario a una squadra completa di qualsiasi squadra del gioco o dei mod, livello CPU). Il cronometro non scorre, non si salva nulla, niente risultato né ricompense. SELECT durante l'allenamento apre le sue impostazioni: ricariche, tensione sempre al massimo, nessun costo di PE / PEG / SP, ogni tiro da lontano, falli, fuorigioco, supertattiche, applica, riavvia, esci. Modulo di Football Reforged; le impostazioni salvate con Inazuma Fantasy vengono mantenute."

[pt.new]
mod_name = "Campo de treino"
mod_description = "Um campo livre para praticar supertécnicas, combinações e tempos sem um jogo a sério: a barra superior «Jogo» › «Modo livre» começa um treino a partir do menu onde estás (5 contra 5 ou 11 contra 11, qualquer estádio, de nenhum adversário a uma equipa completa de qualquer equipa do jogo ou dos mods, nível da CPU). O relógio não corre, nada é guardado, sem resultado nem recompensas. SELECT no treino abre as suas definições: recargas, tensão sempre no máximo, sem gasto de PE / PEG / SP, todo remate é de longe, faltas, fora de jogo, supertáticas, aplicar, reiniciar, sair. Módulo de Football Reforged; as definições guardadas com Inazuma Fantasy são mantidas."

[ja.new]
mod_name = "練習場"
mod_description = "試合なしの自由なフィールドで必殺技やコンビネーション、タイミングを練習できる。上部バー「試合」›「フリーモード」で今いるメニューから練習を開始（5対5か11対11、好きなスタジアム、相手はゲームやMODの全チームから選べ、人数は0人からフルメンバーまで、CPUの強さ）。時計は止まったまま、セーブされず、結果も報酬もない。練習中にSELECTで設定を開く：リキャスト、テンション常に最大、PE / PEG / SP消費なし、全シュートをロングシュートに、ファウル、オフサイド、必殺タクティクス、適用、やり直し、退出。Football Reforgedのモジュール。Inazuma Fantasyで保存した設定は引き継がれる。"

[zh_hans.new]
mod_name = "训练场"
mod_description = "在自由的球场上练习必杀技、配合和时机，没有正式比赛：顶部栏「比赛」›「自由模式」从当前菜单开始训练（5对5或11对11，任意球场，对手可选游戏或模组中的任意队伍，人数从0到满员，电脑等级）。时钟不走，不保存任何内容，没有结果和奖励。训练中按SELECT打开设置：冷却、斗志始终全满、不消耗PE / PEG / SP、所有射门都可远射、犯规、越位、必杀战术、应用、重新开始、离开。Football Reforged 的模块；保留在 Inazuma Fantasy 中保存的设置。"

[zh_hant.new]
mod_name = "訓練場"
mod_description = "在自由的球場上練習必殺技、配合和時機，沒有正式比賽：頂部欄「比賽」›「自由模式」從目前選單開始訓練（5對5或11對11，任意球場，對手可選遊戲或模組中的任意隊伍，人數從0到滿員，電腦等級）。時鐘不走，不儲存任何內容，沒有結果和獎勵。訓練中按SELECT開啟設定：冷卻、鬥志始終全滿、不消耗PE / PEG / SP、所有射門都可遠射、犯規、越位、必殺戰術、套用、重新開始、離開。Football Reforged 的模組；保留在 Inazuma Fantasy 中儲存的設定。"
