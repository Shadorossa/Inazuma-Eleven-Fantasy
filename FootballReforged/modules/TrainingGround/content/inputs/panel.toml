# Training Ground › the settings window's key (docs/game/mods/training-ground.md). Polled by the match HUD (graft
# training_ground, training_ground_panel.lua) with CMND_CHECK_INPUT on the match controllers while a training match
# runs. The retail coach-mode button cannot be used: in a 5v5 drill the game never asks it. A rebindable action
# (docs/framework/types/input.md §2b), row in «Configuración de controles», tab of the match controls. Defaults: pad
# SELECT and keyboard U (the retail coach-mode key; a drill has no coach mode).
schema = "VRFW.input/1"

[[action]]
id = "TrainingGround.Panel"
command = "CMD_TRAININGGROUND_PANEL"
ctrl = ["PLAYER_SOCCER_CTRL", "PLAYER_SOCCER_ZONE_CTRL", "PLAYER_SOCCER_FOCUS_CTRL", "PLAYER_SOCCER_SETPLAY_CTRL"]
category = "match"
label = "training_ground_panel_action"
pad = "SELECT"
keyboard = "U"
screens = ["soccer_menu", "soccer_battle_menu"]
