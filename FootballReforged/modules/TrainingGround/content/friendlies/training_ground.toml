# Training Ground (docs/game/mods/training-ground.md): the drill is a friendly of the framework's match engine
# (docs/framework/types/friendly.md), started by the graft training_ground from the hub the player is on through the
# framework's match start service (docs/framework/match-start.md) with the context of the settings (row, class,
# stadium); the service closes that hub after the reservation. Nothing reaches the save while it runs (sink from the
# launch to the way back). The way back (return = "menus"): the match is left the retail way (the window's «Salir» /
# «Reiniciar» = CMND_VRFW_MATCH_EXIT, or the retail hold-to-leave) and the soccer state reopens the hub it was started
# from with the in-memory game untouched. The team is the mode's VS team (play mode Competición); a 5v5 drill without a
# complete 5v5 line-up of that team plays with the active pachanga team (training_ground_pachanga).
schema = "VRFW.friendly/1"

[[friendly]]
id = "training_ground"
name = "Training ground"
ruleset = "training_ground"   # content\rules\training_ground.toml: endless, a training match
team = "current"
pre_match = true
save = "sink"
return = "menus"
field_net = false
# the retail match intro: the encounter transition of the VS CPU list's start, then the match loading. A restart
# («Aplicar cambios», «Reiniciar») runs it under the black of the way back.
before = [{ op = "fade_encounter", frames = 120 }]

# the same drill with the player's active pachanga team (a complete 5v5 line-up: the retail member check), swapped
# into the VS team for the match and back on the way back: a 5v5 drill whose mode VS team has no complete 5v5
# line-up takes it (graft training_ground, training_ground_start.lua)
[[friendly]]
id = "training_ground_pachanga"
name = "Training ground (pachanga team)"
ruleset = "training_ground"
team = "active_friendly"
pre_match = true
save = "sink"
return = "menus"
field_net = false
before = [{ op = "fade_encounter", frames = 120 }]
