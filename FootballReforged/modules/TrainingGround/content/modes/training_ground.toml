# Training Ground as a mode of the framework's mode type (docs/framework/mode.md): entered from the top bar group
# «Match» (content\menus\top_bar.toml) through the graft training_ground's global TrainingGround_Start; no
# [[mode.entry]] (Inazuma Fantasy's «Modos de juego» hub, which hosted its box, is not a host of this mod).
schema = "VRFW.mode/1"

[[mode]]
name = "training_ground"
default = true
icon = "#/menu/100_mainmenu/mainmenu90/mainmenu90_11/mainmenu90_11.g4tx:icon_list_m02_on"

[mode.text.es]
name = "Campo de entrenamiento"
description = "Practica supertécnicas, combinaciones y tiempos en un campo libre, sin partido de verdad."
[mode.text.en]
name = "Training Ground"
description = "Rehearse special moves, combos and timings on a free pitch, with no real match."
[mode.text.fr]
name = "Terrain d'entraînement"
description = "Répète tes techniques, combinaisons et timings sur un terrain libre, sans vrai match."
[mode.text.de]
name = "Trainingsplatz"
description = "Übe Spezialtechniken, Kombinationen und Timing auf freiem Platz, ohne echtes Spiel."
[mode.text.it]
name = "Campo di allenamento"
description = "Prova supertecniche, combinazioni e tempi su un campo libero, senza una vera partita."
[mode.text.pt]
name = "Campo de treino"
description = "Pratica supertécnicas, combinações e tempos num campo livre, sem um jogo a sério."
[mode.text.ja]
name = "練習場"
description = "試合なしの自由なフィールドで、必殺技やコンビネーション、タイミングを練習できます。"
[mode.text.zh_hans]
name = "训练场"
description = "在自由的球场上练习必杀技、配合和时机，没有正式比赛。"
[mode.text.zh_hant]
name = "訓練場"
description = "在自由的球場上練習必殺技、配合和時機，沒有正式比賽。"

[mode.flow]
start = { lua = "TrainingGround_Start" }
return = "host"

[mode.save]
kind = "none"
