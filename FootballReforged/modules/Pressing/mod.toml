id = "Pressing"
former_ids = ["pressing"]
# name / description: the English fallback; the card shows the text keys mod_name / mod_description (text\keys.toml)
name = "Pressing"
version = "1.5.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "L2 without the ball is a press button instead of the focus field: while you hold it, 2 to 4 of your AI teammates nearest to the ball carrier sprint at him (never the keeper); release it or win the ball back and they play as before. The CPU presses with the same rules instead of opening its focus field. With Aura Points, a player whose sprint bar is winded does not press, and pressing drains it like any sprint. Without the ball the L2 guide reads «Press!» and your pressers show the game's «Move Up!» arrows pointing at the carrier. With the ball, L2 is the game's."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-24"
# This mod's own names (Lua Pressing.X); never VRFW.
prefix = "Pressing"
folder = "Pressing"
# Created on 2026-10-21 (owner request: replace the off-ball L2 focus field with a press button, for the user and the
# CPU; docs/game/mods/pressing.md). Standard mod layout (docs/framework/mod-layout.md):
#   config.toml             [pressing]: who presses (count, distance band, range), the sprint, the sprint bar rule,
#                           the focus field gate, your press button, the CPU's rules
#   scripts\pressing.lua    the run time: every match frame, who presses and when
#   text\keys.toml          the mod's name / description and the L2 guide's word (press_hud_label), 9 languages
#   content\images\hud\     the L2 guide's word as a sprite of soccer08_17, 9 languages (made from press_hud_label by
#                           research/scripts/vrfw_action_label_build.py)
# The framework provides the mechanisms (docs/framework/ai-move.md: VRFW.ai.move / release, VRFW.ai.focus_field_gate,
# VRFW.input.on, VRFW.ai.arrow, VRFW.hud.go_ahead_guide); this module only declares the rules. Aura Points (Character
# Reforged, 1.2.0+) is optional: its sprint bar (aura_points.sprint) limits who presses when it is on.
requires = ["VRFW>=2.153.0", "FootballReforged>=1.2.18"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# no native permission: the script's effects (VRFW.ai.move / release / focus_field_gate) are the script default
permissions = []

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged (docs/framework/mod-families.md): shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "FootballReforged"
order = 100
