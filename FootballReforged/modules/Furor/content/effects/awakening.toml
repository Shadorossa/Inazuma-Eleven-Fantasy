# Furor › the furor phase's fire look (docs/game/mechanics/furor.md §3.3). The retail awakening («Despertar») draws its
# look through ONE character-effect trigger (0x9627F4F7): the effects ega0550a-ega0553a at two body attach points and
# the body aura (effect_aura_config) ega0550a. The trigger furor_phase_fire copies those rows with recoloured COPIES of
# the four effects and another body aura: orange, yellow and red like flames. The retail ones stay untouched, so the
# game's own awakening keeps its pink-red. The rules of content\rules\gauge.toml hold it on the team's players during
# the phase with the framework's char_effect (no aura bit, no aura slot; it fades out at the phase's end).
# The colours are the tunables here: `hue` in degrees (0 red, 15-30 orange, 45-55 yellow), `saturation` multiplier.
# The noise textures _04 / _05 (distortion) and the grey masks keep theirs.
schema = "VRFW.effect/1"

# ---------------------------------------------------------------- ega0550a (the body flames, first attach point)

# the flame tongues and the materials' colour: red-orange
[[recolor]]
effect = "ega0550a"
copy = "egr0550a"
textures = ["01"]
materials = "all"
hue = 18
mode = "set"
saturation = 1.1

# the colour ramps: yellow, orange, red
[[recolor]]
object = "egr0550a"
textures = ["02"]
materials = "none"
hue = 48
mode = "set"

[[recolor]]
object = "egr0550a"
textures = ["07"]
materials = "none"
hue = 28
mode = "set"

[[recolor]]
object = "egr0550a"
textures = ["12"]
materials = "none"
hue = 6
mode = "set"
saturation = 1.1

