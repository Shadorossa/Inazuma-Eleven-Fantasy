# Furor › no player has an awakening: the furor phase is the only awakening (owner 2026-10-15: «que ningún jugador en el
# juego tenga awakening y que solo funcione por la barra de furor»). The VR-Framework's [[VRFW.Unobtainable]]
# (docs/framework/types/technique.md §2.0) over the two awakening families of aura_skill_config (AURA_CMD_INFO col 10):
# 5 awakening power (the «Despertar» powers: Sobrecarga ardiente, Determinación de portero, Guardián férreo,
