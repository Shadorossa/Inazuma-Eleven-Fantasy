# every learn list, board cell, shop and reward table, and with Matches = true no player of any team gets one in his
# match move list (CPU loadouts, preset teams, Battle Bay sets, old saves), nor an extra slot. The awakening look lives
# on as the furor phase's (content\effects\awakening.toml, content\rules\gauge.toml). With Furor off: as before.
schema = "VRFW.technique/3"

