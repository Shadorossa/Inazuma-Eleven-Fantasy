# Texts of Furor, a module of Football Reforged (docs/framework/types/text.md): the name and description of its card on
# Football Reforged's page in Mods; phase_banner = the furor phase's banner (graft research/grafts/furor_banner).
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Furor"
mod_description = "GO Strikers' furor gauge: each team's fire bar beside its crest fills with time (faster when losing) and a little with goals, saves and duels; full, the furor button (L3 / R) starts the furor phase for 12 s: every player wears his position's awakening (look and stats), moves hit harder, players run faster. The CPU starts its own. Awakenings exist only in the furor phase."
phase_banner = "Furor phase active"

[es.new]
mod_name = "Furor"
mod_description = "La barra de furor de GO Strikers: la barra de fuego de cada equipo junto a su escudo se llena con el tiempo (más rápido si pierde) y un poco con goles, paradas y duelos; llena, el botón de furor (L3 / R) inicia la fase de furor durante 12 s: cada jugador despierta con el despertar de su posición (aspecto y estadísticas), las técnicas pegan más fuerte y los jugadores corren más. La CPU activa la suya. Los despertares solo existen en la fase de furor."
phase_banner = "Fase de furor activa"

[fr.new]
mod_name = "Furie"
mod_description = "La jauge de fureur de GO Strikers : la barre de feu de chaque équipe près de son blason se remplit avec le temps (plus vite si elle perd) et un peu avec les buts, arrêts et duels ; pleine, le bouton de fureur (L3 / R) lance la phase de fureur pendant 12 s : chaque joueur prend l'éveil de son poste (apparence et stats), les techniques frappent plus fort, les joueurs courent plus vite. Le CPU lance la sienne. Les éveils n'existent que dans la phase de fureur."
phase_banner = "Phase de fureur active"

[de.new]
mod_name = "Furor"
mod_description = "Die Furor-Leiste aus GO Strikers: Der Feuerbalken jedes Teams neben seinem Wappen füllt sich mit der Zeit (schneller bei Rückstand) und etwas durch Tore, Paraden und Duelle; voll startet die Furor-Taste (L3 / R) die Furor-Phase für 12 s: Jeder Spieler erwacht mit dem Erwachen seiner Position (Aussehen und Werte), Techniken treffen härter, Spieler laufen schneller. Die CPU startet ihre eigene. Erwachen gibt es nur in der Furor-Phase."
phase_banner = "Furor-Phase aktiv"

[it.new]
mod_name = "Furore"
mod_description = "La barra di furore di GO Strikers: la barra di fuoco di ogni squadra accanto allo stemma si riempie col tempo (più in fretta se perde) e un po' con gol, parate e duelli; piena, il tasto furore (L3 / R) avvia la fase di furore per 12 s: ogni giocatore ottiene il risveglio del suo ruolo (aspetto e statistiche), le tecniche colpiscono più forte, i giocatori corrono di più. La CPU avvia la sua. I risvegli esistono solo nella fase di furore."
phase_banner = "Fase di furore attiva"

[pt.new]
mod_name = "Furor"
mod_description = "A barra de furor de GO Strikers: a barra de fogo de cada equipa junto ao emblema enche com o tempo (mais depressa se perde) e um pouco com golos, defesas e duelos; cheia, o botão de furor (L3 / R) inicia a fase de furor durante 12 s: cada jogador desperta com o despertar da sua posição (aspeto e estatísticas), as técnicas batem mais forte, os jogadores correm mais. O CPU inicia a sua. Os despertares só existem na fase de furor."
phase_banner = "Fase de furor ativa"

[ja.new]
mod_name = "フューラー"
mod_description = "GOストライカーズのテンションゲージ：各チームのエンブレム横の炎ゲージは時間（負けていると速く）とゴール・セーブ・競り合いで少し溜まり、満タンでボタン（L3 / R）を押すと12秒のヒーロータイム：全選手がポジションごとの覚醒（見た目と能力）をまとい、技が強く、選手が速くなる。CPUも自分で使う。覚醒はヒーロータイムだけのもの。"
phase_banner = "ヒーロータイム発動中"

[zh_hans.new]
mod_name = "怒火"
mod_description = "GO Strikers的怒火槽：每队队徽旁的火焰条随时间（落后时更快）及进球、扑救、对抗少量增长；满时按怒火键（L3 / R）进入12秒的怒火时刻：每名球员获得其位置的觉醒（外观与能力），必杀技更强、球员更快。电脑也会使用。觉醒只存在于怒火时刻。"
phase_banner = "怒火时刻发动中"

[zh_hant.new]
mod_name = "怒火"
mod_description = "GO Strikers的怒火槽：每隊隊徽旁的火焰條隨時間（落後時更快）及進球、撲救、對抗少量增長；滿時按怒火鍵（L3 / R）進入12秒的怒火時刻：每名球員獲得其位置的覺醒（外觀與能力），必殺技更強、球員更快。電腦也會使用。覺醒只存在於怒火時刻。"
phase_banner = "怒火時刻發動中"
