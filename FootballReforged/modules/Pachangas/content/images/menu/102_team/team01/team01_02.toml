# Pachangas (module of Football Reforged): the two cell plates of the Team Dock list's first row, «Partido» | «Pachanga»
# (graft pachanga_dock, docs/game/ui/pachanga-templates.md §18), made at build from the player's own list row plates
# (team01_02.g4tx list_base01_off / _on / _ok / _ol, 392 x 72). The mod ships no game pixel.
# The row plate is a nine-slice sprite: px 0..144 and 148..392 are drawn at their own size, px 144..148 stretched over
# the rest of its 568-unit quad. «row» rebuilds the full row as the game draws it (568 x 72: 144 px, the 4 px band
# stretched to 180, 244 px). The row is cut along one slanted seam whose two edges are the plate's own ends (its last /
# first 28 px, the slanted end caps): the left cell keeps the row's x 0..265 and the right end cap at 265 (its edge at
# 278 mid-height); the right cell the left end cap at 276 (its edge at 290) and the row from 304. Filled plates keep the
# row's own pixels (alpha from the cut), the outline plate takes the caps' strokes. Each cell covers 388 units of the
# row (left 0..388, right 180..568) and is stored as a 392 px sprite with the plate's guides (144 / 148): drawn on a
# 388-unit quad the band gets 0 units, so every pixel is drawn 1:1 and the two cells are the full row with a 12-unit
# slanted gap (the rows' own spacing).
schema = "VRFW.image/1"

# ---- list_base01_off ----
[[recipe]]
name = "off_head"
game = "#/menu/102_team/team01/team01_02/team01_02.g4tx"
sprite = "list_base01_off"
ops = [{ op = "crop", box = [0, 0, 144, 72] }]

[[recipe]]
name = "off_band"
game = "#/menu/102_team/team01/team01_02/team01_02.g4tx"
sprite = "list_base01_off"
ops = [{ op = "crop", box = [144, 0, 148, 72] }, { op = "resize", size = [180, 72] }]

[[recipe]]
name = "off_tail"
