# ---- the sprites, each in the texture page of the plate it is cut from ----
# A quad keeps its texture page on a sprite swap and only takes the new sprite's rectangle (Character Reforged 1.105.0),
# so each cell sits in its own plate's page: the page grows from 392 x 72 to 392 x 224 (the plate stays at the top,
# left cell at y 76, right cell at y 152). Same nine-slice guides as the plate (144 / 148 of 392), so the sprite draws
# the same whether the quad keeps the plate's guides or takes the sprite's.

[[texture]]
atlas = "#/menu/102_team/team01/team01_02/team01_02.g4tx"
