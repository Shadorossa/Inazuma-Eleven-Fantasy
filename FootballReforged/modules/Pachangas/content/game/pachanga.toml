# «Pachanga» (5v5) templates of the team dock (module Pachangas of Football Reforged; docs/game/ui/pachanga-templates.md).
# Logic: scripts\pachanga.lua. Commands CMND_PACHANGAS_*; their names in Inazuma Fantasy (CMND_FANTASY_PACHANGA_*) and
# before (CMND_EVT_PACHANGA_*) stay as aliases, so every graft and mod that calls them keeps working.
# CMND_PACHANGAS_UPVAL is the framework's built-in command lua_upvalues.
schema = "VRFW.game/2"

[[VRFW.Global]]
name = "pt_party"
base = "game_root"
chain = ["ROOT_PARTY"]

[[VRFW.Global]]
name = "pt_play_data"
base = "game_root"
chain = ["ROOT_PLAY_DATA"]

# CMND_PACHANGAS_INFO -> ok, active dock (-1 none), 5v5 members of it, bank (1-based), slot
[[VRFW.Command]]
name = "CMND_PACHANGAS_INFO"
aliases = ["CMND_FANTASY_PACHANGA_INFO", "CMND_EVT_PACHANGA_INFO"]
handler = "Pachangas.Info"
needs = ["Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_SET(dock 2..12, -1 = none) -> ok, code
[[VRFW.Command]]
name = "CMND_PACHANGAS_SET"
aliases = ["CMND_FANTASY_PACHANGA_SET", "CMND_EVT_PACHANGA_SET"]
handler = "Pachangas.Set"
needs = ["Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_TEAM -> ok, dock, formation dword, team name, n, handle x n (the active 5v5 team)
[[VRFW.Command]]
name = "CMND_PACHANGAS_TEAM"
aliases = ["CMND_FANTASY_PACHANGA_TEAM", "CMND_EVT_PACHANGA_TEAM"]
handler = "Pachangas.Team"
needs = ["Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_CAPTAIN -> ok, captain card, captain handle (the active 5v5 team's captain; 0 = none named)
[[VRFW.Command]]
name = "CMND_PACHANGAS_CAPTAIN"
aliases = ["CMND_FANTASY_PACHANGA_CAPTAIN"]
handler = "Pachangas.Captain"
needs = ["Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_NOTE(op "set" / "get", text) -> the note (a text handed between menu VMs: the join scene's name)
[[VRFW.Command]]
name = "CMND_PACHANGAS_NOTE"
aliases = ["CMND_FANTASY_PACHANGA_NOTE"]
handler = "Pachangas.Note"

# CMND_PACHANGAS_VS(op 1 remember / 0 take / 2 peek, vs set) -> ok, vs set (-1 none)
[[VRFW.Command]]
name = "CMND_PACHANGAS_VS"
aliases = ["CMND_FANTASY_PACHANGA_VS", "CMND_EVT_PACHANGA_VS"]
handler = "Pachangas.Vs"
needs = ["Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_FLAGS -> dock bits put back on 11v11 / 5v5 members (-1 = not ready)
[[VRFW.Command]]
name = "CMND_PACHANGAS_FLAGS"
aliases = ["CMND_FANTASY_PACHANGA_FLAGS", "CMND_EVT_PACHANGA_FLAGS"]
handler = "Pachangas.Flags"
needs = ["Party.SetOrganizedFlagBit", "Party.LogicalToPhysical", "pt_party"]

# CMND_PACHANGAS_INIT(dock) -> members removed (-1 = not ready / not a dock)
[[VRFW.Command]]
name = "CMND_PACHANGAS_INIT"
aliases = ["CMND_FANTASY_PACHANGA_INIT", "CMND_EVT_PACHANGA_INIT"]
handler = "Pachangas.Init"
needs = ["Party.SetOrganizedFlagBit", "Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party"]

# CMND_PACHANGAS_SPLIT(dock) -> removed (5v5 auto-copy emptied), 0 = kept / already checked, -1 = n/a
[[VRFW.Command]]
name = "CMND_PACHANGAS_SPLIT"
aliases = ["CMND_FANTASY_PACHANGA_SPLIT", "CMND_EVT_PACHANGA_SPLIT"]
handler = "Pachangas.Split"
needs = ["Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_TEAMSWAP(dock, on 1 / 0) -> ok, swapped dock (-1 none): 11v11 <-> 5v5 members for the team bonuses screen
[[VRFW.Command]]
name = "CMND_PACHANGAS_TEAMSWAP"
aliases = ["CMND_FANTASY_PACHANGA_TEAMSWAP", "CMND_EVT_PACHANGA_TEAMSWAP"]
handler = "Pachangas.TeamSwap"
needs = ["Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# a return to the title undoes a pending team bonuses swap (the retail command keeps running: the handler answers
# nothing). The trial's own return to the title (CMND_EVT_TRIAL_RETURN) does not pass here.
[[VRFW.CommandFilter]]
name = "PachangaGameReset"
command = "CMND_GAME_RESET"
handler = "Pachangas.OnGameReset"
needs = ["Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party"]

# Independent 5v5 / 11v11 teams from dock 02 on: around the retail place / move 193693077(toSet, pos, fromSet, hdl, team)
# (0xC35A80) the team the call is NOT about is saved (before) and put back, recounted, its dock bits restored (after).
[[VRFW.CommandFilter]]
name = "PachangaSplitPre"
command = 0x0B8B8595
handler = "Pachangas.SplitPre"
needs = ["Party.SetOrganizedFlagBit", "Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party", "pt_play_data"]

[[VRFW.CommandFilter]]
name = "PachangaSplitPost"
command = 0x0B8B8595
phase = "after"
handler = "Pachangas.SplitPost"
needs = ["Party.SetOrganizedFlagBit", "Party.RecountTeamInfo", "Party.LogicalToPhysical", "pt_party", "pt_play_data"]

# CMND_PACHANGAS_UPVAL(fn, expect1, value1 [, expect2, value2 …]) -> upvalues changed (-1 = not a function / not
# available): every numeric upvalue of the game Lua function `fn` equal to an `expect` becomes its `value` (the
# framework's built-in, through the game VM's lua_getupvalue / lua_setupvalue)
[[VRFW.Command]]
name = "CMND_PACHANGAS_UPVAL"
aliases = ["CMND_FANTASY_PACHANGA_UPVAL", "CMND_EVT_PACHANGA_UPVAL"]
builtin = "lua_upvalues"
