schema = "VRFW.text_key/1"
# Texts of «Pachangas» (mod pachangas, a module of Football Reforged) (format: docs/framework/types/text.md): the
# «Mods» screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Pachangas"
mod_description = "Team Dock gets a format row «< 11 v 11 >» (left / right pick the format, confirm switches): every Team Dock holds its own 5-a-side team next to its 11-a-side one, with its 5v5 formations, kit, emblem and bank view, and «Set as active team» picks the active 5-a-side team the friendlies are played with."

[es.new]
mod_name = "Pachangas"
mod_description = "Plantilla de equipo tiene una fila de formato «< 11 v 11 >» (izquierda / derecha eligen el formato, confirmar lo cambia): cada plantilla guarda su propio equipo de pachanga junto al de 11, con sus formaciones de 5, equipación, emblema y vista del banco, y «Establecer como equipo activo» elige el equipo de pachanga activo con el que se juegan las pachangas."

[fr.new]
mod_name = "Pachangas"
mod_description = "Composition d'équipe gagne une ligne de format « < 11 v 11 > » (gauche / droite choisissent le format, valider le change) : chaque composition garde sa propre équipe de foot à 5 à côté de celle à 11, avec ses formations à 5, sa tenue, son blason et sa vue de la réserve, et « Définir comme équipe active » choisit l'équipe de foot à 5 active des matchs amicaux."

[de.new]
mod_name = "Pachangas"
mod_description = "Die Team-Bank erhält eine Format-Zeile «< 11 v 11 >» (links / rechts wählen das Format, Bestätigen wechselt): Jede Team-Bank hat neben ihrem 11er-Team ein eigenes 5-gegen-5-Team mit seinen 5er-Formationen, Trikot, Wappen und Bankansicht, und «Als aktives Team festlegen» wählt das aktive 5-gegen-5-Team der Freundschaftsspiele."

[it.new]
mod_name = "Pachangas"
mod_description = "Lo slot squadra ha una riga del formato «< 11 v 11 >» (sinistra / destra scelgono il formato, conferma per cambiare): ogni slot tiene una propria squadra di calcetto accanto a quella a 11, con formazioni a 5, divisa, stemma e vista della riserva, e «Imposta come squadra attiva» sceglie la squadra di calcetto attiva delle amichevoli."

[pt.new]
mod_name = "Pachangas"
mod_description = "O plantel de equipa ganha uma linha de formato «< 11 v 11 >» (esquerda / direita escolhem o formato, confirmar troca): cada plantel guarda a sua própria equipa de pelada ao lado da de 11, com as suas formações de 5, equipamento, emblema e vista do banco, e «Definir como equipa ativa» escolhe a equipa de pelada ativa dos amistosos."

[ja.new]
mod_name = "Pachangas"
mod_description = "チーム編成に形式の行「< 11 v 11 >」を追加（左右で形式を選び、決定で切り替え）。各チームが11人制とは別に5人制チームを持ち、5人制フォーメーション・ユニフォーム・エンブレム・控えの表示も個別。「アクティブチームに設定」でフレンドリーマッチに使う5人制チームを選ぶ。"

[zh_hans.new]
mod_name = "Pachangas"
mod_description = "队伍编组新增赛制一栏「< 11 v 11 >」（左右选择赛制，确认后切换）：每个编组在11人队伍旁另有自己的5人制队伍，拥有各自的5人阵型、队服、队徽与替补视图；「设为当前队伍」选择友谊赛使用的5人制队伍。"

[zh_hant.new]
mod_name = "Pachangas"
mod_description = "隊伍編組新增賽制一欄「< 11 v 11 >」（左右選擇賽制，確認後切換）：每個編組在11人隊伍旁另有自己的5人制隊伍，擁有各自的5人陣型、隊服、隊徽與替補視圖；「設為當前隊伍」選擇友誼賽使用的5人制隊伍。"
