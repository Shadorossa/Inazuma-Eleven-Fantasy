schema = "VRFW.text_key/1"
# Texts of «Pachangas» (mod pachangas, a module of Football Reforged) (format: docs/framework/types/text.md): the
# «Mods» screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Pachangas"
mod_description = "Team Dock gets a type row (11v11 | 7v7 | 5v5 | 3v3; 11v11 and 5v5 available): every Team Dock holds its own 5-a-side team next to its 11-a-side one, with its 5v5 formations, kit, emblem and bank view, and «Set as active team» picks the active 5-a-side team the friendlies are played with."

[es.new]
mod_name = "Pachangas"
mod_description = "Plantilla de equipo tiene una fila de tipo (11v11 | 7v7 | 5v5 | 3v3; disponibles 11v11 y 5v5): cada plantilla guarda su propio equipo de pachanga junto al de 11, con sus formaciones de 5, equipación, emblema y vista del banco, y «Establecer como equipo activo» elige el equipo de pachanga activo con el que se juegan las pachangas."

[fr.new]
mod_name = "Pachangas"
mod_description = "Composition d'équipe gagne une ligne de type (11v11 | 7v7 | 5v5 | 3v3 ; 11v11 et 5v5 disponibles) : chaque composition garde sa propre équipe de foot à 5 à côté de celle à 11, avec ses formations à 5, sa tenue, son blason et sa vue de la réserve, et « Définir comme équipe active » choisit l'équipe de foot à 5 active des matchs amicaux."

[de.new]
mod_name = "Pachangas"
mod_description = "Die Team-Bank erhält eine Typ-Zeile (11v11 | 7v7 | 5v5 | 3v3; 11v11 und 5v5 verfügbar): Jede Team-Bank hat neben ihrem 11er-Team ein eigenes 5-gegen-5-Team mit seinen 5er-Formationen, Trikot, Wappen und Bankansicht, und «Als aktives Team festlegen» wählt das aktive 5-gegen-5-Team der Freundschaftsspiele."

[it.new]
mod_name = "Pachangas"
mod_description = "Lo slot squadra ha una riga del tipo (11v11 | 7v7 | 5v5 | 3v3; disponibili 11v11 e 5v5): ogni slot tiene una propria squadra di calcetto accanto a quella a 11, con formazioni a 5, divisa, stemma e vista della riserva, e «Imposta come squadra attiva» sceglie la squadra di calcetto attiva delle amichevoli."

[pt.new]
mod_name = "Pachangas"
mod_description = "O plantel de equipa ganha uma linha de tipo (11v11 | 7v7 | 5v5 | 3v3; disponíveis 11v11 e 5v5): cada plantel guarda a sua própria equipa de pelada ao lado da de 11, com as suas formações de 5, equipamento, emblema e vista do banco, e «Definir como equipa ativa» escolhe a equipa de pelada ativa dos amistosos."

[ja.new]
mod_name = "Pachangas"
mod_description = "チーム編成にタイプの行（11v11｜7v7｜5v5｜3v3、使えるのは11v11と5v5）を追加。各チームが11人制とは別に5人制チームを持ち、5人制フォーメーション・ユニフォーム・エンブレム・控えの表示も個別。「アクティブチームに設定」でフレンドリーマッチに使う5人制チームを選ぶ。"

[zh_hans.new]
mod_name = "Pachangas"
mod_description = "队伍编组新增类型一栏（11v11 | 7v7 | 5v5 | 3v3，可用11v11和5v5）：每个编组在11人队伍旁另有自己的5人制队伍，拥有各自的5人阵型、队服、队徽与替补视图；「设为当前队伍」选择友谊赛使用的5人制队伍。"

[zh_hant.new]
mod_name = "Pachangas"
mod_description = "隊伍編組新增類型一欄（11v11 | 7v7 | 5v5 | 3v3，可用11v11和5v5）：每個編組在11人隊伍旁另有自己的5人制隊伍，擁有各自的5人陣型、隊服、隊徽與替補視圖；「設為當前隊伍」選擇友誼賽使用的5人制隊伍。"
