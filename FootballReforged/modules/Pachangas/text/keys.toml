schema = "VRFW.text_key/1"
# Texts of «Pachangas» (mod pachangas, a module of Football Reforged) (format: docs/framework/types/text.md): the
# «Mods» screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "5-a-side teams"
mod_description = "Team Dock's list starts with one row of two columns, «Match» and «5-a-side» (left / right pick one, confirm switches): every Team Dock holds its own 5-a-side team next to its 11-a-side one, with its 5v5 formations, kit, emblem and bank view, and «Set as active team» picks the active 5-a-side team the friendlies are played with."

[es.new]
mod_name = "Equipos de pachanga"
mod_description = "La lista de Plantilla de equipo empieza con una fila de dos columnas, «Partido» y «Pachanga» (izquierda / derecha eligen, confirmar lo cambia): cada plantilla guarda su propio equipo de pachanga junto al de 11, con sus formaciones de 5, equipación, emblema y vista del banco, y «Establecer como equipo activo» elige el equipo de pachanga activo con el que se juegan las pachangas."

[fr.new]
mod_name = "Équipes à 5"
mod_description = "La liste de Composition d'équipe commence par une ligne à deux colonnes, « Match » et « Foot à 5 » (gauche / droite choisissent, valider change) : chaque composition garde sa propre équipe de foot à 5 à côté de celle à 11, avec ses formations à 5, sa tenue, son blason et sa vue de la réserve, et « Définir comme équipe active » choisit l'équipe de foot à 5 active des matchs amicaux."

[de.new]
mod_name = "Teams für 5 gegen 5"
mod_description = "Die Liste der Team-Bank beginnt mit einer Zeile aus zwei Spalten, «Spiel» und «5 gegen 5» (links / rechts wählen, Bestätigen wechselt): Jede Team-Bank hat neben ihrem 11er-Team ein eigenes 5-gegen-5-Team mit seinen 5er-Formationen, Trikot, Wappen und Bankansicht, und «Als aktives Team festlegen» wählt das aktive 5-gegen-5-Team der Freundschaftsspiele."

[it.new]
mod_name = "Squadre a 5"
mod_description = "La lista dello slot squadra inizia con una riga a due colonne, «Partite» e «Calcetto» (sinistra / destra scelgono, conferma per cambiare): ogni slot tiene una propria squadra di calcetto accanto a quella a 11, con formazioni a 5, divisa, stemma e vista della riserva, e «Imposta come squadra attiva» sceglie la squadra di calcetto attiva delle amichevoli."

[pt.new]
mod_name = "Equipas de 5"
mod_description = "A lista do plantel de equipa começa com uma linha de duas colunas, «Partida» e «Pelada» (esquerda / direita escolhem, confirmar troca): cada plantel guarda a sua própria equipa de pelada ao lado da de 11, com as suas formações de 5, equipamento, emblema e vista do banco, e «Definir como equipa ativa» escolhe a equipa de pelada ativa dos amistosos."

[ja.new]
mod_name = "5人制チーム"
mod_description = "チーム編成のリスト先頭が「試合」と「5人制」の2列の行に（左右で選び、決定で切り替え）。各チームが11人制とは別に5人制チームを持ち、5人制フォーメーション・ユニフォーム・エンブレム・控えの表示も個別。「アクティブチームに設定」でフレンドリーマッチに使う5人制チームを選ぶ。"

[zh_hans.new]
mod_name = "五人制球队"
mod_description = "队伍编组列表的第一行分为「比赛」和「五人制」两栏（左右选择，确认后切换）：每个编组在11人队伍旁另有自己的5人制队伍，拥有各自的5人阵型、队服、队徽与替补视图；「设为当前队伍」选择友谊赛使用的5人制队伍。"

[zh_hant.new]
mod_name = "五人制球隊"
mod_description = "隊伍編組列表的第一行分為「比賽」和「五人制」兩欄（左右選擇，確認後切換）：每個編組在11人隊伍旁另有自己的5人制隊伍，擁有各自的5人陣型、隊服、隊徽與替補視圖；「設為當前隊伍」選擇友誼賽使用的5人制隊伍。"
