schema = "VRFW.text_key/1"
# Texts of «Pachangas» (mod pachangas, a module of Football Reforged) (format: docs/framework/types/text.md): the
# «Mods» screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "5-a-side teams"
mod_description = "Team Dock's list starts with one row of two columns, «Match» and «5-a-side» (left / right pick one, confirm switches): every Team Dock's 5-a-side team mirrors its match team, with the same players, kit, emblem and name; its five are picked automatically by the 5v5 formation and can be swapped among those players, and the active team is one Team Dock for both formats: its 5-a-side team is the one the friendlies are played with."

[es.new]
mod_name = "Equipos de pachanga"
mod_description = "La lista de Plantilla de equipo empieza con una fila de dos columnas, «Partido» y «Pachanga» (izquierda / derecha eligen, confirmar lo cambia): el equipo de pachanga de cada plantilla es el reflejo de su equipo de partido, con los mismos jugadores, equipación, emblema y nombre; sus cinco se eligen solos según la formación de 5 y se pueden cambiar entre esos jugadores, y el equipo activo es la misma plantilla en los dos formatos: su equipo de pachanga es con el que se juegan las pachangas."

[fr.new]
mod_name = "Équipes à 5"
mod_description = "La liste de Composition d'équipe commence par une ligne à deux colonnes, « Match » et « Foot à 5 » (gauche / droite choisissent, valider change) : l'équipe de foot à 5 de chaque composition reflète son équipe de match, avec les mêmes joueurs, tenue, blason et nom ; ses cinq sont choisis automatiquement selon la formation à 5 et peuvent être échangés parmi ces joueurs, et l'équipe active est la même composition dans les deux formats : son équipe de foot à 5 joue les matchs amicaux."

[de.new]
mod_name = "Teams für 5 gegen 5"
mod_description = "Die Liste der Team-Bank beginnt mit einer Zeile aus zwei Spalten, «Spiel» und «5 gegen 5» (links / rechts wählen, Bestätigen wechselt): Das 5-gegen-5-Team jeder Team-Bank spiegelt ihr Match-Team mit denselben Spielern, Trikot, Wappen und Namen; seine Fünf werden automatisch nach der 5er-Formation gewählt und lassen sich unter diesen Spielern tauschen, und das aktive Team ist in beiden Formaten dieselbe Team-Bank: Ihr 5-gegen-5-Team spielt die Freundschaftsspiele."

[it.new]
mod_name = "Squadre a 5"
mod_description = "La lista dello slot squadra inizia con una riga a due colonne, «Partite» e «Calcetto» (sinistra / destra scelgono, conferma per cambiare): la squadra di calcetto di ogni slot rispecchia la sua squadra di partita, con gli stessi giocatori, divisa, stemma e nome; i suoi cinque si scelgono da soli secondo la formazione a 5 e si possono cambiare tra quei giocatori, e la squadra attiva è lo stesso slot in entrambi i formati: la sua squadra di calcetto gioca le amichevoli."

[pt.new]
mod_name = "Equipas de 5"
mod_description = "A lista do plantel de equipa começa com uma linha de duas colunas, «Partida» e «Pelada» (esquerda / direita escolhem, confirmar troca): a equipa de pelada de cada plantel espelha a sua equipa de partida, com os mesmos jogadores, equipamento, emblema e nome; os seus cinco são escolhidos sozinhos pela formação de 5 e podem trocar-se entre esses jogadores, e a equipa ativa é o mesmo plantel nos dois formatos: a sua equipa de pelada joga os amistosos."

[ja.new]
mod_name = "5人制チーム"
mod_description = "チーム編成のリスト先頭が「試合」と「5人制」の2列の行に（左右で選び、決定で切り替え）。各チームの5人制チームは試合チームと同じ選手・ユニフォーム・エンブレム・名前を使い、5人は5人制フォーメーションに合わせて自動で選ばれ、その選手の中で入れ替えられます。アクティブチームは両方の形式で同じチームで、その5人制チームがフレンドリーマッチに出る。"

[zh_hans.new]
mod_name = "五人制球队"
mod_description = "队伍编组列表的第一行分为「比赛」和「五人制」两栏（左右选择，确认后切换）：每个编组的五人制队伍与其比赛队伍一致，使用相同的球员、队服、队徽和队名；五名首发按五人阵型自动选出，并可在这些球员之间调换；两种赛制的当前队伍是同一个编组，其5人制队伍参加友谊赛。"

[zh_hant.new]
mod_name = "五人制球隊"
mod_description = "隊伍編組列表的第一行分為「比賽」和「五人制」兩欄（左右選擇，確認後切換）：每個編組的五人制隊伍與其比賽隊伍一致，使用相同的選手、隊服、隊徽和隊名；五名先發依五人陣型自動選出，並可在這些選手之間調換；兩種賽制的當前隊伍是同一個編組，其5人制隊伍參加友誼賽。"
