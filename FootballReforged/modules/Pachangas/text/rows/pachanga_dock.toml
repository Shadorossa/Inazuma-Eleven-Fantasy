[[row]]
id = "evt_pt_row_help"
es = "Elige el tipo de plantilla: Partido (11 contra 11) o Pachanga (5 contra 5). Cada tipo tiene su propio equipo activo."
en = "Choose the Team Dock type: Match (11 vs 11) or 5-a-side (5 vs 5). Each type has its own active team."
fr = "Choisis le type de composition : Match (11 contre 11) ou Foot à 5 (5 contre 5). Chaque type a sa propre équipe active."
de = "Wähle den Team-Bank-Typ: Match (11 gegen 11) oder 5 gegen 5. Jeder Typ hat sein eigenes aktives Team."
it = "Scegli il tipo di slot squadra: Partita (11 contro 11) o Calcetto (5 contro 5). Ogni tipo ha la sua squadra attiva."
pt = "Escolha o tipo de clube: Partida (11 contra 11) ou Pelada (5 contra 5). Cada tipo tem seu próprio time ativo."
ja = "チームドックのタイプを選択：試合（11対11）または5人制（5対5）。タイプごとにアクティブチームがあります。"
zh_hans = "选择编组队伍的类型：比赛（11对11）或五人制（5对5）。每种类型都有各自的出场队伍。"
zh_hant = "選擇編組隊伍的類型：比賽（11對11）或五人制（5對5）。每種類型都有各自的出場隊伍。"

[[row]]
id = "evt_pt_active_line"
es = "Equipo activo de partido: {match} · Equipo activo de pachanga: {pachanga}"
en = "Active match team: {match} · Active 5-a-side team: {pachanga}"
fr = "Équipe active (match) : {match} · Équipe active (foot à 5) : {pachanga}"
de = "Aktives Match-Team: {match} · Aktives 5-gegen-5-Team: {pachanga}"
it = "Squadra attiva (partita): {match} · Squadra attiva (calcetto): {pachanga}"
pt = "Time ativo de partida: {match} · Time ativo de pelada: {pachanga}"
ja = "試合のアクティブチーム：{match}・5人制のアクティブチーム：{pachanga}"
zh_hans = "比赛出场队伍：{match}・五人制出场队伍：{pachanga}"
zh_hant = "比賽出場隊伍：{match}・五人制出場隊伍：{pachanga}"

