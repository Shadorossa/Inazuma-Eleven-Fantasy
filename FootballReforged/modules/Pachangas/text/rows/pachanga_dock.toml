[[row]]
id = "evt_pt_need_five"
es = "Esta plantilla de pachanga no está completa. Coloca a 5 jugadores para poder usarla como equipo activo de pachanga."
en = "This 5-a-side Team Dock is not complete. Place 5 players to use it as the active 5-a-side team."
fr = "Cette composition de foot à 5 n'est pas complète. Place 5 joueurs pour en faire l'équipe active de foot à 5."
de = "Diese 5-gegen-5-Team-Bank ist nicht vollständig. Stelle 5 Spieler auf, um sie als aktives 5-gegen-5-Team zu nutzen."
it = "Questo slot squadra di calcetto non è completo. Schiera 5 giocatori per usarlo come squadra attiva di calcetto."
pt = "Este clube de pelada não está completo. Escale 5 jogadores para usá-lo como time ativo de pelada."
ja = "この5人制のチームドックはまだ完成していません。5人の選手を配置すると、5人制のアクティブチームにできます。"
zh_hans = "该五人制编组队伍尚未完成。请安排5名球员，才能将其设为五人制的出场队伍。"
zh_hant = "該五人制編組隊伍尚未完成。請安排5名選手，才能將其設為五人制的出場隊伍。"

[[row]]
id = "evt_pt_only_title"
es = "El tipo de plantilla solo se puede cambiar en Plantilla de equipo, entrando desde el menú principal."
en = "The Team Dock type can only be changed in Team Dock, opened from the main menu."
fr = "Le type de composition ne peut être changé que dans Composition d'équipe, ouverte depuis le menu principal."
de = "Der Team-Bank-Typ kann nur in der Team-Bank geändert werden, die über das Hauptmenü geöffnet wird."
it = "Il tipo di slot squadra si può cambiare solo in Slot squadra, aperto dal menu principale."
pt = "O tipo de clube só pode ser alterado em Clube, aberto pelo menu principal."
ja = "チームドックのタイプは、メインメニューから開いたチームドックでのみ変更できます。"
zh_hans = "编组队伍的类型只能在从主菜单打开的编组队伍中更改。"
zh_hant = "編組隊伍的類型只能在從主選單開啟的編組隊伍中更改。"

[[row]]
id = "evt_pt_no_loader"
es = "El equipo activo de pachanga necesita el cargador del mod (módulo team_banks)."
en = "The active 5-a-side team needs the mod loader (team_banks module)."
fr = "L'équipe active de foot à 5 nécessite le chargeur du mod (module team_banks)."
de = "Das aktive 5-gegen-5-Team benötigt den Mod-Loader (Modul team_banks)."
it = "La squadra attiva di calcetto richiede il loader della mod (modulo team_banks)."
pt = "O time ativo de pelada precisa do carregador do mod (módulo team_banks)."
ja = "5人制のアクティブチームにはMODローダー（team_banksモジュール）が必要です。"
zh_hans = "五人制出场队伍需要模组加载器（team_banks模块）。"
zh_hant = "五人制出場隊伍需要模組載入器（team_banks模組）。"

