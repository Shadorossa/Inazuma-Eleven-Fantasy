[[row]]
id = "evt_pt_now_active"
es = "La plantilla {n} «{team}» es ahora el equipo activo de pachanga."
en = "Team Dock {n} \"{team}\" is now the active 5-a-side team."
fr = "La composition {n} « {team} » est maintenant l'équipe active de foot à 5."
de = "Team-Bank {n} „{team}“ ist jetzt das aktive 5-gegen-5-Team."
it = "Lo slot squadra {n} \"{team}\" è ora la squadra attiva di calcetto."
pt = "O clube {n} \"{team}\" agora é o time ativo de pelada."
ja = "チームドック{n}「{team}」を5人制のアクティブチームにしました。"
