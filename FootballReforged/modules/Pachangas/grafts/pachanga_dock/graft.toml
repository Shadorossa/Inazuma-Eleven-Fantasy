# Football Reforged's module Pachangas since 2026-10-15 (was Inazuma Fantasy's, module pachanga).
# «Plantilla de equipo»: Partido (11v11) / Pachanga (5v5) templates (docs/game/ui/pachanga-templates.md).
# «Equipar todo» leaves the list, the first row is the format row «< 11 v 11 >» (left / right cycle, decide switches); in pachanga mode the retail dock shows / edits the
# docks' teamInfo[1] (the retail n10 = 1 mode, the story's 5v5 field) and «Establecer como equipo activo» sets the active
# pachanga team kept by Inazuma Fantasy's plugin (module pachanga: CMND_EVT_PACHANGA_*). Texts: menu_text rows of
# research/scripts/pachanga_text_build.py (9 languages, ids = @crc:<label>@). Utilities' team bank pages (mod
# utilities, hook graft team_banks, lua_early and loaded before IF) define UTIL_TB first: the block wraps
# UTIL_TB.refresh / UTIL_TB.header (or queues the wrapping in UTIL_TB_HOOKS; no build-time requires). Before rogue_dock (INAROGUE
# blocks the active-team key before this block sees it).
name = "pachanga_dock"
mod = "Pachangas"
order = 315
module = ""
requires = []
conflicts = []
