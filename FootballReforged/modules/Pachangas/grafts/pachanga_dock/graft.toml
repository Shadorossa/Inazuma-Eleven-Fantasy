description = "Team dock: format row «< 11 v 11 >» (Partido / Pachanga), 5v5 templates mirroring the dock's 11v11 team (players, name, emblem, kit, supertácticas, coach, managers; the five filled by the 5v5 formation), active pachanga team, Partido team restored on exit; «Equipar todo» removed"

