# Texts of Duel Auras, a module of Football Reforged (docs/framework/types/text.md): the name and description of its
# card on Football Reforged's page in Mods.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Duel auras"
mod_description = "In a duel an aura (keshin, totem, armour, Mix-Max, mode change) is never the answer to the rival's special move: it activates with its effects and the choice stays open, so a real special move or a normal action answers. The same for the CPU."

[es.new]
mod_name = "Auras en duelos"
mod_description = "En un duelo, un aura (keshin, tótem, armadura, Mix-Max, modo cambio) nunca es la respuesta a la supertécnica del rival: se activa con sus efectos y la elección sigue abierta, así que responde una supertécnica de verdad o una acción normal. Igual para la CPU."

[fr.new]
mod_name = "Auras en duel"
mod_description = "En duel, une aura (keshin, totem, armure, Mix-Max, mode change) n'est jamais la réponse à la supertechnique adverse : elle s'active avec ses effets et le choix reste ouvert, donc une vraie supertechnique ou une action normale répond. Pareil pour le CPU."

[de.new]
mod_name = "Auren im Duell"
mod_description = "Im Duell ist eine Aura (Keshin, Totem, Rüstung, Mix-Max, Wechselmodus) nie die Antwort auf die Spezialtechnik des Gegners: Sie wird mit ihren Effekten aktiviert und die Wahl bleibt offen, also antwortet eine echte Spezialtechnik oder eine normale Aktion. Ebenso für die CPU."

[it.new]
mod_name = "Aure nei duelli"
mod_description = "In un duello un'aura (keshin, totem, armatura, Mix-Max, modalità cambio) non è mai la risposta alla supertecnica avversaria: si attiva con i suoi effetti e la scelta resta aperta, quindi risponde una vera supertecnica o un'azione normale. Lo stesso per la CPU."

[pt.new]
mod_name = "Auras em duelos"
mod_description = "Num duelo, uma aura (keshin, totem, armadura, Mix-Max, modo troca) nunca é a resposta à supertécnica do rival: ativa-se com os seus efeitos e a escolha continua aberta, por isso responde uma supertécnica a sério ou uma ação normal. O mesmo para o CPU."

[ja.new]
mod_name = "デュエルのオーラ"
mod_description = "デュエルではオーラ（化身・トーテム・アームド・ミキシマックス・モードチェンジ）は相手の必殺技への応戦にならない。効果どおり発動し、選択はそのまま残るので、本当の必殺技か通常アクションで応戦する。CPUも同じ。"

[zh_hans.new]
mod_name = "对决中的灵气"
mod_description = "对决中，灵气（化身、图腾、铠甲、混合最大化、模式转换）绝不会成为对对手必杀技的应对：它照常发动并生效，选择仍然保留，由真正的必杀技或普通动作来应对。电脑方同样如此。"

[zh_hant.new]
mod_name = "對決中的靈氣"
mod_description = "對決中，靈氣（化身、圖騰、鎧甲、混合最大化、模式轉換）絕不會成為對對手必殺技的應對：它照常發動並生效，選擇仍然保留，由真正的必殺技或普通動作來應對。電腦方同樣如此。"
