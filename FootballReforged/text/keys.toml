# Texts of Football Reforged (format of the text engine: docs/framework/types/text.md): the mod's name and description
# on the «Mods» screen, in the game's language. «Football Reforged» is not translated. Its modules have their own texts
# (modules\<Module>\text\keys.toml).
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Football Reforged"
mod_description = "A base of match mechanics in modules: each module is a card on this mod's page in Mods (on / off, applies after a restart). Goalkeeper barrier: keepers resist shots while an orange part of their fatigue bar lasts. Furor: the GO Strikers tension gauge, a fire bar by each crest; full, L3 / R starts the furor phase. Both on by default."

[es.new]
mod_name = "Football Reforged"
mod_description = "Una base de mecánicas de partido en módulos: cada módulo es una tarjeta en la página de este mod en Mods (activar / desactivar, se aplica al reiniciar). Barrera del portero: los porteros resisten tiros mientras dura una parte naranja de su barra de cansancio. Furor: la barra de tensión de GO Strikers, una barra de fuego junto a cada escudo; llena, L3 / R inicia la fase de furor. Ambos activados por defecto."

[fr.new]
mod_name = "Football Reforged"
mod_description = "Une base de mécaniques de match en modules : chaque module est une carte sur la page de ce mod dans Mods (activer / désactiver, appliqué au redémarrage). Barrière du gardien : les gardiens résistent aux tirs tant qu'une partie orange de leur barre de fatigue tient. Furie : la jauge de tension de GO Strikers, une barre de feu près de chaque blason ; pleine, L3 / R lance la phase de fureur. Les deux actifs par défaut."

[de.new]
mod_name = "Football Reforged"
mod_description = "Eine Basis für Spielmechaniken in Modulen: Jedes Modul ist eine Karte auf der Seite dieses Mods unter Mods (an / aus, gilt nach einem Neustart). Torwart-Barriere: Torhüter halten Schüssen stand, solange ein oranger Teil ihres Ermüdungsbalkens hält. Furor: die Spannungsleiste aus GO Strikers, ein Feuerbalken an jedem Wappen; voll startet L3 / R die Furor-Phase. Beide standardmäßig an."

[it.new]
mod_name = "Football Reforged"
mod_description = "Una base di meccaniche di partita in moduli: ogni modulo è una carta nella pagina di questo mod in Mod (attiva / disattiva, vale al riavvio). Barriera del portiere: i portieri resistono ai tiri finché dura una parte arancione della barra di fatica. Furore: la barra di tensione di GO Strikers, una barra di fuoco accanto a ogni stemma; piena, L3 / R avvia la fase di furore. Entrambi attivi di base."

[pt.new]
mod_name = "Football Reforged"
mod_description = "Uma base de mecânicas de partida em módulos: cada módulo é um cartão na página deste mod em Mods (ativar / desativar, aplica-se ao reiniciar). Barreira do guarda-redes: os guarda-redes resistem a remates enquanto dura uma parte laranja da barra de cansaço. Furor: a barra de tensão de GO Strikers, uma barra de fogo junto a cada emblema; cheia, L3 / R inicia a fase de furor. Ambos ativos por defeito."

[ja.new]
mod_name = "Football Reforged"
mod_description = "試合メカニクスをモジュールで追加するベース。各モジュールはMODページのカードでオン・オフ（再起動後に反映）。キーパーバリア：疲労ゲージのオレンジ部分がある間キーパーはシュートに強い。フューラー：GOストライカーズのテンションゲージ。エンブレム横の炎ゲージが満タンでL3 / Rでヒーロータイム。どちらも初期状態でオン。"

[zh_hans.new]
mod_name = "Football Reforged"
mod_description = "以模块形式加入比赛机制的基础模组：每个模块是本模组页面上的一张卡片（开关，重启后生效）。门将屏障：疲劳条的橙色部分存在时门将更能抵挡射门。怒火：GO Strikers的气势槽，队徽旁的火焰条；满时按L3 / R进入怒火时刻。两者默认开启。"

[zh_hant.new]
mod_name = "Football Reforged"
mod_description = "以模組形式加入比賽機制的基礎模組：每個模組是本模組頁面上的一張卡片（開關，重啟後生效）。門將屏障：疲勞條的橙色部分存在時門將更能抵擋射門。怒火：GO Strikers的氣勢槽，隊徽旁的火焰條；滿時按L3 / R進入怒火時刻。兩者預設開啟。"
