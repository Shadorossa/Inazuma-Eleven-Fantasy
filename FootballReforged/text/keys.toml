ruleset_inazuma_street = "Inazuma Street (3 contra 3, sem goleiros nem árbitro)"

[ja.new]
mod_name = "Football Reforged"
mod_description = "試合メカニクスをモジュールで追加するベース。各モジュールはMODページのカードでオン・オフ（再起動後に反映）。キーパーバリア：疲労ゲージのオレンジ部分がある間キーパーはシュートに強い。フューラー：GOストライカーズのテンションゲージ。エンブレム横の炎ゲージが満タンでL3 / Rでヒーロータイム。どちらも初期状態でオン。ベースに試合形式も収録：7人制サッカー（7対7）、イナズマストリート（3対3、GK・審判なし）、必殺タクティクス・審判なしの5人制。他のMODやモードが選べるルール。"
ruleset_football_7 = "7人制サッカー（7対7）"
ruleset_if_pachanga_5v5 = "5人制（必殺タクティクス・審判なし）"
ruleset_inazuma_street = "イナズマストリート（3対3、GK・審判なし）"

[zh_hans.new]
mod_name = "Football Reforged"
mod_description = "以模块形式加入比赛机制的基础模组：每个模块是本模组页面上的一张卡片（开关，重启后生效）。门将屏障：疲劳条的橙色部分存在时门将更能抵挡射门。怒火：GO Strikers的气势槽，队徽旁的火焰条；满时按L3 / R进入怒火时刻。两者默认开启。基础中还包含比赛形式：7人制足球（7对7）、闪电街头（3对3，无门将、无裁判）以及无战术、无裁判的5人制友谊赛，其他模组和模式均可选用。"
ruleset_football_7 = "7人制足球（7对7）"
ruleset_if_pachanga_5v5 = "5人制友谊赛（无战术、无裁判）"
ruleset_inazuma_street = "闪电街头（3对3，无门将、无裁判）"

[zh_hant.new]
mod_name = "Football Reforged"
mod_description = "以模組形式加入比賽機制的基礎模組：每個模組是本模組頁面上的一張卡片（開關，重啟後生效）。門將屏障：疲勞條的橙色部分存在時門將更能抵擋射門。怒火：GO Strikers的氣勢槽，隊徽旁的火焰條；滿時按L3 / R進入怒火時刻。兩者預設開啟。基礎中還包含比賽形式：7人制足球（7對7）、閃電街頭（3對3，無門將、無裁判）以及無戰術、無裁判的5人制友誼賽，其他模組和模式均可選用。"
ruleset_football_7 = "7人制足球（7對7）"
ruleset_if_pachanga_5v5 = "5人制友誼賽（無戰術、無裁判）"
ruleset_inazuma_street = "閃電街頭（3對3，無門將、無裁判）"
