# Texts of Football Reforged (format of the text engine: docs/framework/types/text.md): the mod's name and description
# on the «Mods» screen, in the game's language, and ruleset_<id> = the name of the base's ruleset <id> in the rules editor
# (content\rules\). «Football Reforged» is not translated. Its modules have their own texts (modules\<Module>\text\keys.toml).
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Football Reforged"
mod_description = "A base of match mechanics in modules: each module is a card on this mod's page in Mods (on / off, applies after a restart). Goalkeeper barrier: keepers resist shots while an orange part of their fatigue bar lasts. Furor: the GO Strikers tension gauge, a fire bar by each crest; full, L3 / R starts the furor phase. Both on by default. Match formats in the base: Football 7 (7 vs 7), Inazuma Street (3 vs 3, no keepers or referee) and the 5-a-side friendly without tactics or referee, rulebooks other mods and modes can pick."
ruleset_football_7 = "7-a-side football (7 vs 7)"
ruleset_if_pachanga_5v5 = "5-a-side friendly (no tactics or referee)"
ruleset_inazuma_street = "Inazuma Street (3 vs 3, no keepers or referee)"

[es.new]
mod_name = "Football Reforged"
mod_description = "Una base de mecánicas de partido en módulos: cada módulo es una tarjeta en la página de este mod en Mods (activar / desactivar, se aplica al reiniciar). Barrera del portero: los porteros resisten tiros mientras dura una parte naranja de su barra de cansancio. Furor: la barra de tensión de GO Strikers, una barra de fuego junto a cada escudo; llena, L3 / R inicia la fase de furor. Ambos activados por defecto. Formatos de partido en la base: Fútbol 7 (7 contra 7), Inazuma Street (3 contra 3, sin porteros ni árbitro) y la pachanga 5 contra 5 sin supertácticas ni árbitro, reglamentos que otros mods y modos pueden elegir."
ruleset_football_7 = "Fútbol 7 (7 contra 7)"
ruleset_if_pachanga_5v5 = "Pachanga 5 contra 5 (sin supertácticas ni árbitro)"
ruleset_inazuma_street = "Inazuma Street (3 contra 3, sin porteros ni árbitro)"

[fr.new]
mod_name = "Football Reforged"
mod_description = "Une base de mécaniques de match en modules : chaque module est une carte sur la page de ce mod dans Mods (activer / désactiver, appliqué au redémarrage). Barrière du gardien : les gardiens résistent aux tirs tant qu'une partie orange de leur barre de fatigue tient. Furie : la jauge de tension de GO Strikers, une barre de feu près de chaque blason ; pleine, L3 / R lance la phase de fureur. Les deux actifs par défaut. Formats de match dans la base : Football à 7 (7 contre 7), Inazuma Street (3 contre 3, sans gardiens ni arbitre) et le match amical à 5 sans tactiques ni arbitre, des règlements que d'autres mods et modes peuvent choisir."
ruleset_football_7 = "Football à 7 (7 contre 7)"
ruleset_if_pachanga_5v5 = "Match amical à 5 (sans tactiques ni arbitre)"
ruleset_inazuma_street = "Inazuma Street (3 contre 3, sans gardiens ni arbitre)"

[de.new]
mod_name = "Football Reforged"
mod_description = "Eine Basis für Spielmechaniken in Modulen: Jedes Modul ist eine Karte auf der Seite dieses Mods unter Mods (an / aus, gilt nach einem Neustart). Torwart-Barriere: Torhüter halten Schüssen stand, solange ein oranger Teil ihres Ermüdungsbalkens hält. Furor: die Spannungsleiste aus GO Strikers, ein Feuerbalken an jedem Wappen; voll startet L3 / R die Furor-Phase. Beide standardmäßig an. Spielformate in der Basis: 7er-Fußball (7 gegen 7), Inazuma Street (3 gegen 3, ohne Torhüter und Schiedsrichter) und das 5-gegen-5-Freundschaftsspiel ohne Taktiken und Schiedsrichter, Regelwerke, die andere Mods und Modi wählen können."
ruleset_football_7 = "7er-Fußball (7 gegen 7)"
ruleset_if_pachanga_5v5 = "5-gegen-5-Freundschaftsspiel (ohne Taktiken und Schiedsrichter)"
ruleset_inazuma_street = "Inazuma Street (3 gegen 3, ohne Torhüter und Schiedsrichter)"

[it.new]
mod_name = "Football Reforged"
mod_description = "Una base di meccaniche di partita in moduli: ogni modulo è una carta nella pagina di questo mod in Mod (attiva / disattiva, vale al riavvio). Barriera del portiere: i portieri resistono ai tiri finché dura una parte arancione della barra di fatica. Furore: la barra di tensione di GO Strikers, una barra di fuoco accanto a ogni stemma; piena, L3 / R avvia la fase di furore. Entrambi attivi di base. Formati di partita nella base: Calcio a 7 (7 contro 7), Inazuma Street (3 contro 3, senza portieri né arbitro) e l'amichevole 5 contro 5 senza tattiche né arbitro, regolamenti che altri mod e modalità possono scegliere."
