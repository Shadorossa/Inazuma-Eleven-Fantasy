# Football Reforged › module «Barrera del portero» (docs/game/mechanics/gk-barrier.md; how to add a module:
# docs/game/mods/football-reforged.md §3). Every keeper has a barrier (25 % of his fatigue bar, drawn orange at the
# goal side) that divides the power of the shots he faces by 1.75 while it lasts and falls with his fatigue; a block
# move of his team makes his next keeper move 30 % cheaper in tension. Code: scripts\goalkeeper_barrier.lua; settings:
# config.toml [goalkeeper_barrier]; HUD: graft research/grafts/football_reforged_barrier_hud.
schema = "FootballReforged.module/1"

[FootballReforged.Module]
id = "goalkeeper_barrier"
# its on / off row of «Opciones de mods» (options.toml, child of the group row «Football Reforged»): key
# football_reforged.goalkeeper_barrier
option = "goalkeeper_barrier"
# the switch's value when no option service answers (the row's own `default` is the one the options screen uses)
default = true
# text keys (text\keys.toml): the row's name and its help line
name = "goalkeeper_barrier"
description = "goalkeeper_barrier_help"
# what the module is made of (documentation and checks; nothing is loaded from these lists)
scripts = ["scripts/goalkeeper_barrier.lua"]
config = "goalkeeper_barrier"
grafts = ["football_reforged_barrier_hud"]
