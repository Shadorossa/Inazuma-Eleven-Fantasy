schema = "VRFW.rule/1"
# Ruleset of the 5 vs 5 friendlies without special tactics or referee (Football Reforged;
# docs/game/modes/formatos-3v3-7v7.md): the retail 5v5 friendly (the framework's friendly_5v5: 15', one period, 5 a
# side, no extra time or penalties) with the 4 special-tactics slots of both teams locked and no referee (no fouls,
# cards, penalties for fouls or offside). Picked by a friendly with `ruleset = "if_pachanga_5v5"`. The id has not
# changed since it left Inazuma Fantasy (2026-10-15).
id = "if_pachanga_5v5"
name = "5-a-side friendly (no tactics or referee)"   # fallback; the game shows the text key football_reforged.ruleset_if_pachanga_5v5
version = 1

[time]
half_minutes = 15
halves = 1

[teams]
players = 5

[play]
tactics = false            # no special tactics (the 4 tactics slots of both teams locked)
referee = false            # no referee: no fouls, cards, penalties for fouls or offside

[end]
extra_time = false
golden_goal = false
penalties = false
