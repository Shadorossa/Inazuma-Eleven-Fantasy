schema = "VRFW.rule/1"
# Ruleset «Inazuma Street» (Football Reforged; docs/game/modes/formatos-3v3-7v7.md): 3 vs 3,
# no keepers, no referee. The engine only sets the players per side; pitch and goals are the row's. No keepers = the
# keeper shift (positions + 1): places 1-3 of formation 0x3285EB55 = crc32("if_form_street_3")
# (content\formations\formation_config.toml: 1 defender + 2 forwards, no place 0; 2 kicks off, 3 receives). No referee:
# no fouls, cards, offside or advantage. Clock and halves: the row's. Used by a mode
# (CMND_EVT_MATCH_ENGINE_SELECT("inazuma_street")), a friendly (`ruleset = "inazuma_street"`) or a binding.
# The id has not changed since it left Inazuma Fantasy (2026-10-15).
id = "inazuma_street"
name = "Inazuma Street (3 vs 3, no keepers or referee)"   # fallback; the game shows the text key football_reforged.ruleset_inazuma_street
version = 1

[teams]
players = 3
keepers = false            # = goalkeeper = false: every player outfield
user  = { formation = 0x3285EB55 }   # if_form_street_3
rival = { formation = 0x3285EB55 }

[play]
referee = false            # no referee: no fouls, cards, penalties for fouls or offside

[end]
extra_time = false
golden_goal = false
penalties = false
