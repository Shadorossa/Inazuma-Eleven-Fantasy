# Player Training › the team dock entry (research/scripts/tr_build.py build_team_dock; docs/game/training-classic.md
# section 7.1): «Entrenamiento» as a row of the team-command list of soccer_team_dock_menu (Plantilla de equipo ->
# «Equipar todo» list); it opens the training window evt_training_menu (graft player_training_menu) on the selected
# dock. The training replaces the beans: the list keeps Autoequipar equipo, Eliminar equipamiento and Ajustes de
# celebración de gol, then «Entrenamiento» (the bean rows and the auto-beans checkbox are hidden, as in Inazuma
# Fantasy). Was Inazuma Fantasy's graft training_dock until 2026-10-14 (same block). The row shows only while the
# mod's module bit 16 is lit (CMND_EVT_LOADER_VERSION). Wraps / replaces OpenSelectTeamMemberControlSubWindowSoccerTeamDock
# (same body, its own core with the extra row) and wraps CallbackCloseCondTeamCommandSubWinSoccerTeamDock; no engine
# call at chunk load.
name = "player_training_dock"
mod = "player_training"
order = 300
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OpenSelectTeamMemberControlSubWindowSoccerTeamDock", "CallbackCloseCondTeamCommandSubWinSoccerTeamDock"]
description = "Player Training: «Entrenamiento» row in the team dock command list"

[[files]]
stem = "soccer_team_dock_menu"

  [[files.ops]]
  type = "append_block"
  src = "evt_team_dock_training_block.lua"
  marker = "training team dock"
