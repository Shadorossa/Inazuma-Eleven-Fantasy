# Player Training › the «Entrenar» button and the training mode of Character Reforged's «Fantasy» skill table
# (evt_skill_slot_menu; docs/game/mechanics/stat-training.md §9-§10; docs/framework/skill-table-host.md). A HOOK file
# (shipped as is; GENERATED by gen_hooks.py from player_training_mode.src.lua): the button is the screen host's footer
# button this mod declares as data (content\menus\skill_table_training.toml), the mode runs the old block's code in an
# _ENV over the screen chunk's locals (CharacterReforged.SkillTable.Env) and hooks the screen's callbacks through the
# VR-Framework host evt_skill_slot_menu (Character Reforged's grafts skill_table_host / skill_table_host_hooks).
# Was Inazuma Fantasy's graft training_btn (part training) until 2026-10-14: a text block appended to the screen's
# chunk, which only Inazuma Fantasy's merged build of the screen could carry; now the training works on Character
# Reforged's screen with or without Inazuma Fantasy. The mode's layers (evt_trn_*) and the button's layer
# (evt_cmn03_07_btn_train) are declared in Character Reforged's content\menus\skill_table.toml; the dark stat icons and
# the column backing are this mod's content\images\ recipes. No engine call at chunk load.
name = "player_training_mode"
mod = "player_training"
order = 330
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Player Training: «Entrenar» button + training mode on Character Reforged's skill table"

[[hooks]]
stem = "evt_skill_slot_menu"
src = "player_training_mode.lua"
require = ["EVT_OpenOriginalBoard", "EVT_PickCoroutine"]
