schema = "VRFW.text_key/1"
# Texts of «Player Training» (mod player_training, 2026-10-14) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English. The training's own texts are menu_text
# rows (text\rows\training.toml).
default_lang = "en"

[en.new]
mod_name = "Player Training"
mod_description = "Classic training, as in Chrono Stone: every player has Freedom points, growing with his level, to spread over his base stats in a training window (team dock › command list › «Training»; L1 / R1 switch players). With no free points left, raising a stat lowers its counterpart one for one. The trained points count in matches and are kept in the save. The bean rows of that list give way to the training. Hero, Diamond and Prime cards cannot be trained. A module of Character Reforged; a training saved with Inazuma Fantasy is kept."

[es.new]
mod_name = "Player Training"
mod_description = "Entrenamiento clásico, como en Chrono Stone: cada jugador tiene puntos de Libertad, que crecen con su nivel, para repartir entre sus estadísticas base en una ventana de entrenamiento (Plantilla de equipo › lista de comandos › «Entrenamiento»; L1 / R1 cambian de jugador). Sin puntos libres, subir una estadística baja su contraria uno a uno. Los puntos entrenados cuentan en los partidos y se guardan en la partida. Las filas de judías de esa lista dejan paso al entrenamiento. Las cartas Héroe, Diamante y Prime no se pueden entrenar. Módulo de Character Reforged; se conserva el entrenamiento guardado con Inazuma Fantasy."

[fr.new]
mod_name = "Player Training"
mod_description = "Entraînement classique, comme dans Chrono Stone : chaque joueur a des points de Liberté, qui augmentent avec son niveau, à répartir entre ses statistiques de base dans une fenêtre d'entraînement (Effectif › liste de commandes › «Entraînement» ; L1 / R1 changent de joueur). Sans points libres, monter une statistique baisse sa contraire point par point. Les points entraînés comptent en match et sont gardés dans la sauvegarde. Les lignes de haricots de cette liste laissent place à l'entraînement. Les cartes Héros, Diamant et Prime ne peuvent pas être entraînées. Module de Character Reforged ; l'entraînement sauvegardé avec Inazuma Fantasy est conservé."

[de.new]
mod_name = "Player Training"
mod_description = "Klassisches Training wie in Chrono Stone: Jeder Spieler hat Freiheitspunkte, die mit seinem Level wachsen, und verteilt sie in einem Trainingsfenster auf seine Grundwerte (Kader › Befehlsliste › «Training»; L1 / R1 wechseln den Spieler). Ohne freie Punkte senkt das Erhöhen eines Werts seinen Gegenwert Punkt für Punkt. Die trainierten Punkte zählen im Spiel und bleiben im Spielstand. Die Bohnen-Zeilen dieser Liste weichen dem Training. Helden-, Diamant- und Prime-Karten können nicht trainiert werden. Ein Modul von Character Reforged; mit Inazuma Fantasy gespeichertes Training bleibt erhalten."

[it.new]
mod_name = "Player Training"
mod_description = "Allenamento classico, come in Chrono Stone: ogni giocatore ha punti Libertà, che crescono con il suo livello, da distribuire tra le sue statistiche base in una finestra di allenamento (Rosa › elenco comandi › «Allenamento»; L1 / R1 cambiano giocatore). Senza punti liberi, alzare una statistica abbassa la sua opposta uno a uno. I punti allenati contano nelle partite e restano nel salvataggio. Le righe dei fagioli di quell'elenco lasciano il posto all'allenamento. Le carte Eroe, Diamante e Prime non si possono allenare. Modulo di Character Reforged; l'allenamento salvato con Inazuma Fantasy viene mantenuto."

[pt.new]
mod_name = "Player Training"
mod_description = "Treino clássico, como em Chrono Stone: cada jogador tem pontos de Liberdade, que crescem com o seu nível, para distribuir pelos seus atributos base numa janela de treino (Plantel › lista de comandos › «Treino»; L1 / R1 trocam de jogador). Sem pontos livres, subir um atributo baixa o seu contrário um a um. Os pontos treinados contam nas partidas e ficam guardados no jogo. As linhas de feijões dessa lista dão lugar ao treino. As cartas Herói, Diamante e Prime não podem ser treinadas. Módulo de Character Reforged; o treino guardado com Inazuma Fantasy é mantido."

[ja.new]
mod_name = "Player Training"
mod_description = "クロノ・ストーンのような特訓：各選手はレベルとともに増えるフリーダムポイントを持ち、特訓ウィンドウで基本ステータスに振り分ける（チーム編成 › コマンドリスト › 「特訓」、L1 / R1で選手切替）。残りポイントがないときは、ステータスを上げると対になるステータスが1ずつ下がる。特訓したポイントは試合に反映され、セーブに残る。このリストの豆の項目は特訓に置き換わる。ヒーロー・ダイヤ・プライムのカードは特訓できない。Character Reforgedのモジュール。Inazuma Fantasyで保存した特訓は引き継がれる。"

[zh_hans.new]
mod_name = "Player Training"
mod_description = "如同《时空之石》的经典特训：每名球员拥有随等级增长的自由点数，在特训窗口中分配给基础能力（队伍编成 › 指令列表 ›「特训」；L1 / R1 切换球员）。没有剩余点数时，提升一项能力会逐点降低其对应能力。特训的点数在比赛中生效并保存在存档中。该列表中的豆子选项由特训取代。英雄、钻石和Prime卡无法特训。Character Reforged 的模块；保留在 Inazuma Fantasy 中保存的特训。"

[zh_hant.new]
mod_name = "Player Training"
mod_description = "如同《時空之石》的經典特訓：每名球員擁有隨等級增長的自由點數，在特訓視窗中分配給基礎能力（隊伍編成 › 指令列表 ›「特訓」；L1 / R1 切換球員）。沒有剩餘點數時，提升一項能力會逐點降低其對應能力。特訓的點數在比賽中生效並保存在存檔中。該列表中的豆子選項由特訓取代。英雄、鑽石和Prime卡無法特訓。Character Reforged 的模組；保留在 Inazuma Fantasy 中保存的特訓。"
