# Player Training › the training's texts (menu_text rows by id, the game's 9 languages), moved from Inazuma Fantasy's
# text\rows\menu_text.toml 2026-10-14 (research/scripts/training_text_build.py wrote them first): the rows the
# training window (graft player_training_menu: table TX), the team dock row «Entrenamiento» (graft player_training_dock)
# and the skill table's training mode (Inazuma Fantasy's graft training_btn) read with CMND_TEXT_GET. Rows the
# skill-table button and IF's miximax confirmation also use stay in IF too (same text). Format: docs/framework/types/text.md.
