# Aura Points: the sprites of its PEG / SP bars in the retail btl06_13 atlas (the match HUD gauge; graft
# aura_points_hud). Moved from Inazuma Fantasy on 2026-10-14 (its hud_peg.toml / hud_sp.toml, generated by
# research/scripts/hud_peg_build.py / hud_sp_build.py; docs/game/mechanics/aura-costs.md §12.6 / §14). The sprite names
# evt_peg_* / evt_sp_* are kept: other mods' buff-row bars (graft mx_popup) swap them in by those names.
#   evt_peg_fill01 / evt_sp_fill01   the gauge fill hp_bar02's shape in purple (PEG) / blue (SP)
#   evt_peg_tag01 / evt_sp_tag01     Chrono Stone's fighting-spirit tag (per language) / the «SP» tag
#   aura_points_gloss_00 .. _47      the glass gloss band at position NN of 48 (a copy of Inazuma Fantasy's evt_gloss,
#                                    research/scripts/hud_gloss_build.py), swept over the bar while the spirit is out
# The retail sprites are untouched.
schema = "VRFW.image/1"

