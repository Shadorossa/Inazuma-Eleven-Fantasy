schema = "AuraReworked.stat_transfer/1"
if_mod = "all_miximaxed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# All Miximaxed › the miximax stat transfer (Chrono Stone), ported from Inazuma Fantasy on 2026-10-14 (owner: «trae de
# IF al mod de All Miximaxed el tema de las stats entre jugadores miximax»; IF's content\transforms\if_miximax.toml
# [transform.stats.params], its scripts\lib\transform\mx_stats.lua; docs/game/miximax/miximax-chrono-stone.md §9.2,
# §12.9, §12.10). Read by scripts\lib\stat_transfer.lua only.
# While a created miximax runs the base keeps his stats and gains floor(partner stat × share): `favoured` on the
# partner's favoured stats (by his position, element and gender: favoured_by), else `other`; an ideal miximax (a
# retail pair, a Perfect Cascade overdrive) takes `ideal_favoured` / `ideal_other`. The player page shows the same
# gains (ATRIBUTOS Normal / Miximax view, the Hiper page).
# ONE owner of the rule: when another active mod declares its own miximax stat handler (a `[[transform]] name =
# "miximax"` with `stats.mode = "custom"`: Inazuma Fantasy), this table is not applied (that mod gives the gains).

[AuraReworked.StatTransfer]
favoured = 0.75
other = 0.5
ideal_favoured = 1.0
ideal_other = 0.5
# PE (Chrono Stone's GP): the base's max PE gains floor(partner's max PE × the share) in a match while the miximax
# runs, when that match resource exists (Aura Points' PE, the mod Stamina Points until 2026-10-16); "" = no PE transfer
pe_resource = "aura_points.pe"

# the favoured stats by the partner's position, element and gender; `never` is never favoured
[AuraReworked.StatTransfer.favoured_by]
fw = ["kick", "agility"]
mf = ["control", "technique"]
df = ["pressure", "physical"]
gk = ["agility", "technique"]
wind = ["agility"]
forest = ["technique"]
fire = ["kick"]
mountain = ["pressure"]
male = ["physical", "pe"]
female = ["luck"]
never = ["intelligence"]
