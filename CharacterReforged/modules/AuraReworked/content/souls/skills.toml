# Souls Rework › the reel's skill families (kind AuraReworked.soul/1, schema content\types\soul.toml;
# docs/game/mods/souls-rework-design.md §1.4 Galaxy values, §9 the VR mapping). Edited in ModManager («Auras», a totem's
# page) or by hand. `galaxy` names the Galaxy skill (wiki Module:WazaData `<galaxy>LV1..3`); its Galaxy values are in
# the comment above each family. VR has no GP / TP / Shibire: each mapping is the design's (§4.2). `icon` = the
# family's card icon on the skill carousel: a sprite of the game's team-buff icons (icon_teambuff atlas).
schema = "AuraReworked.soul/1"

# Galaxy: Shoot Up +100 / +150 / +250 shoot power
[[AuraReworked.Skill]]
name = "shoot_up"
text = "aura_reworked.reel_shoot_up"
icon = "icon_teambuff02"
effect = "move_power"
move_kinds = ["shoot"]
values = [10, 15, 25]
galaxy = "ShootUp"

