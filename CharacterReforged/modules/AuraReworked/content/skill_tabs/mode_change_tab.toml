schema = "VRFW.skill_tab/1"
if_mod = "all_changed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)

# All Changed › a «Modo cambio» tab on the «Habilidades» / «Técnicas» list (ability_list_menu; moved from Inazuma
# Fantasy's skill_tabs 2026-10-14, docs/game/mechanics/mode-change.md §3.1). Category 106 = aura command type 6: the
# game's own list filter keeps the mode changes there (the retail ones and this mod's; its carriers and «Crear nuevo
# cambio» follow content\transforms\mode_change.toml [ability_list]). The game has no tab for it; the VR-Framework's
# skill tab registry adds it after the game's tabs and draws it (docs/framework/card-types.md §3):
#   * plate: the Totem tab's square frame (icon type 40), with the mode change's own icon on it (the tab sprites
#     evt_mode_change_tab_on / _off that this mod adds to the game's icon_common atlas, as Inazuma Fantasy had);
#   * title: text key aura_reworked.skill_tab_mode_change (text\keys.toml, 9 languages);
#   * filter: the aura filter window of the armour tab (config 12, saved group 4), as Inazuma Fantasy's tab;
#   * the «!» badge: the game's own, for the tab's native index.
# Only while [mode_change] enabled. With a mod that writes the tab row itself (Inazuma Fantasy) the registry leaves the
# row to it, so there is never a second «Modo cambio» tab.
# 2026-10-14: the tab sits right after Mix-Max (order 75; Mix-Max is the game's 7th tab, 70) in Character Reforged's
# picker group «mix», so the skill table's mix slot picker shows Mix-Max + «Modo cambio» only (Character Reforged
# content\skill_tabs\picker_groups.toml).
[[VRFW.SkillTab]]
category = 106
order = 75
group = "mix"
icon = 40
icon_atlas = "0x8A4A118B"        # icon_common
icon_sprite = "evt_mode_change_tab_on"        # own sprite (content\images\...\mode_change_tab.toml), focused tab
icon_sprite_off = "evt_mode_change_tab_off"   # own sprite, unfocused tab
text = "aura_reworked.skill_tab_mode_change"
filter = 12
filter_group = 4
when = [{ config = "mode_change.enabled", default = true }]
