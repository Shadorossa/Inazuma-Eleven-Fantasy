schema = "VRFW.base_table/1"
# Aura Reworked › the items of its parts, added BY KEY to the game's special-skill item list
# (docs/framework/types/base_table.md §3); each [[keyed]] block belongs to one part (its `if_mod`).

# ---------------------------------------------------------------- All Changed
# All Changed: the items of the «Modo cambio» commands (content\techniques\auras\mode_change.toml), added BY KEY to the
# game's special-skill item list (docs/framework/types/base_table.md §3), so they stand on the base game and on top of
# any mod's whole edition of item_config. Moved from Inazuma Fantasy's item_config splice on 2026-10-14: the same ids
# (crc32 of the keys) and catalog numbers (6960-6968), so the saves that own them keep them. sub (skill_kind) 178 =
# mode change; icon 4006 = the mode change's; linked = the command itself.

[[keyed]]
table = "item/item_special_skill"
if_mod = "all_changed"                      # the part's switch (Mods options)
  [[keyed.add]]                         # wmc_evt_create
  key = 0xD4A87F7F
  cells = { reserved_1 = 0, name_text = 0, desc_text = 0, catalog_no = 6960, category = 160, skill_kind = 178, max_stack = 999, reserved_8 = 1, reserved_9 = 0, reserved_10 = 0, key = "wmc_evt_create", rarity = 1, reserved_13 = 0, base_item = 0, icon_index = 4006, linked = 0xD4A87F7F, flag_17 = 0 }

  [[keyed.add]]                         # wmc_evt0
  key = 0x2CFBD0A6
  cells = { reserved_1 = 0, name_text = 0, desc_text = 0, catalog_no = 6961, category = 160, skill_kind = 178, max_stack = 999, reserved_8 = 1, reserved_9 = 0, reserved_10 = 0, key = "wmc_evt0", rarity = 1, reserved_13 = 0, base_item = 0, icon_index = 4006, linked = 0x2CFBD0A6, flag_17 = 0 }

