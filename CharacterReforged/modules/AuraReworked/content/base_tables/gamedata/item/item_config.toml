# ---------------------------------------------------------------- All Miximaxed
# All Miximaxed › the items of the two miximax carriers (techniques/carriers.toml): a technique id is also its item id
# (ITEM_SPECIAL_SKILL_INFO). Rows by key, added after every mod's positional edition of item_config. Moved from
# Inazuma Fantasy's item_config splice on 2026-10-14: the same ids, keys and catalog numbers (6800 «Crear miximax»
# sorts before the retail miximax items 6873…; the carrier has none: never listed), so saves keep their copies.

[[keyed]]
table = "item/item_special_skill"
if_mod = "all_miximaxed"                    # the part's switch (Mods options)
  [[keyed.add]]                         # wmm_evt_create
  key = 0x3D99AC61
  cells = { reserved_1 = 0, name_text = 0, desc_text = 0, catalog_no = 6800, category = 160, skill_kind = 173, max_stack = 999, reserved_8 = 1, reserved_9 = 0, reserved_10 = 0, key = { text = "wmm_evt_create" }, rarity = 1, reserved_13 = 0, base_item = 0, icon_index = 1154, linked = 0x3D99AC61, flag_17 = 0 }

  [[keyed.add]]                         # wmm_evt
  key = 0x9214E3C9
  cells = { reserved_1 = 0, name_text = 0, desc_text = 0, catalog_no = 0, category = 160, skill_kind = 173, max_stack = 999, reserved_8 = 1, reserved_9 = 0, reserved_10 = 0, key = { text = "wmm_evt" }, rarity = 1, reserved_13 = 0, base_item = 0, icon_index = 1154, linked = 0x9214E3C9, flag_17 = 0 }
