# All Changed › the commands of the custom «Modo cambio» (scripts/all_changed.lua; docs/game/mods/all-changed.md):
# what a creation screen asks (Character Reforged's pairing flow). The old Inazuma Fantasy's own CMND_EVT_MC_* /
# CMND_FANTASY_MC_* copies were removed on 2026-10-15.
schema = "VRFW.game/1"
if_mod = "all_changed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)

# The created changes of the mod All Changed (2026-10-14 .. 2026-10-16, merged into Aura Reworked): copied once into
# slot<N>/aura_reworked/ (the old files are left as they are). First: a save that has them takes them.
[[VRFW.SaveImport]]
name = "AuraReworked.ChangeFromAllChanged"
from = "all_changed"
blobs = ["mode_change.json"]

# Inazuma Fantasy's created changes (blob mode_change.json of each save slot, 2026-10-04 .. 2026-10-14), for a save
# that never had All Changed's: copied once into slot<N>/aura_reworked/ when it has no such file yet.
[[VRFW.SaveImport]]
name = "AuraReworked.ChangeFromInazumaFantasy"
from = "inazuma_fantasy"
blobs = ["mode_change.json"]

# () -> enabled, cooldown s, create item id
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_ON"
aliases = ["CMND_ALLCHANGED_MC_ON"]
handler = "AuraReworked.Changed.Mc.On"

# () -> create id, the 8 carrier ids (crc32 of wmc_evt0..7)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_ITEMS"
aliases = ["CMND_ALLCHANGED_MC_ITEMS"]
handler = "AuraReworked.Changed.Mc.Items"

# (base, start[, perCall]) -> total, n, n x (hdl, param, chara, element, position, allowed)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_CANDIDATES"
aliases = ["CMND_ALLCHANGED_MC_CANDIDATES"]
handler = "AuraReworked.Changed.Mc.Candidates"

# (base, partner) -> ok, code, index (the new change is equipped)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_ADD"
aliases = ["CMND_ALLCHANGED_MC_ADD"]
handler = "AuraReworked.Changed.Mc.Add"

# (base) -> count, equipped (-1 = none)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_LIST"
aliases = ["CMND_ALLCHANGED_MC_LIST"]
handler = "AuraReworked.Changed.Mc.List"

# (base, index) -> exists, partnerHdl, partnerParam, partnerChara
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_ITEM"
aliases = ["CMND_ALLCHANGED_MC_ITEM"]
handler = "AuraReworked.Changed.Mc.Item"

# (base, index | -1) -> ok
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_EQUIP"
aliases = ["CMND_ALLCHANGED_MC_EQUIP"]
handler = "AuraReworked.Changed.Mc.Equip"

# (base, index) -> ok
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_DELETE"
aliases = ["CMND_ALLCHANGED_MC_DELETE"]
handler = "AuraReworked.Changed.Mc.Delete"

# (base) -> exists, partnerParam, partnerChara, partnerHdl (the equipped change)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_GET"
aliases = ["CMND_ALLCHANGED_MC_GET"]
handler = "AuraReworked.Changed.Mc.Get"

# (card) -> kind (0 free, 2 mode change partner), base
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_RESERVATION"
aliases = ["CMND_ALLCHANGED_MC_RESERVATION"]
handler = "AuraReworked.Changed.Mc.Reservation"

# (base, partner) -> ok, code
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_PARTNER_OK"
aliases = ["CMND_ALLCHANGED_MC_PARTNER_OK"]
handler = "AuraReworked.Changed.Mc.PartnerOk"

# (base, partner) -> code (0 = stored and equipped; 10 + Character Reforged's PairCheck code; else MC_ADD's code),
# carrier index k (wmc_evt<k>): the store of Character Reforged's create entry on the skill board («Crear nuevo cambio»,
# content\pairing\change.toml)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_CHANGE_CREATE"
aliases = ["CMND_ALLCHANGED_CREATE"]
handler = "AuraReworked.Changed.Mc.Create"
