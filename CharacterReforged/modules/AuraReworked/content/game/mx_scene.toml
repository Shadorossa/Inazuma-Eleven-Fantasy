schema = "VRFW.game/2"
if_mod = "all_miximaxed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# All Miximaxed › the commands of the MIXIMAX creation scene (scripts\miximax.lua, scripts\lib\scene.lua), asked by
# Character Reforged's skill table under their old names (graft ss2_menus PL.MxScenePlay). Left out when Inazuma
# Fantasy is active: it answers the same names with its own scene.

# (base) -> ok, event, map, partnerHdl, finalEvent, effectsOk | false, why: the scene's lists filled with the pair
[[VRFW.Command]]
name = "CMND_AURAREWORKED_MIXIMAX_SCENE"
aliases = ["CMND_ALLMIXIMAXED_SCENE", "CMND_EVT_MX_SCENE"]
handler = "AuraReworked.Miximaxed.Scene"

# () -> pending, base, seconds
[[VRFW.Command]]
name = "CMND_AURAREWORKED_MIXIMAX_SCENE_STATE"
aliases = ["CMND_ALLMIXIMAXED_SCENE_STATE", "CMND_EVT_MX_SCENE_STATE"]
handler = "AuraReworked.Miximaxed.SceneState"

# (why)
[[VRFW.Command]]
name = "CMND_AURAREWORKED_MIXIMAX_SCENE_END"
aliases = ["CMND_ALLMIXIMAXED_SCENE_END", "CMND_EVT_MX_SCENE_END"]
handler = "AuraReworked.Miximaxed.SceneEnd"
