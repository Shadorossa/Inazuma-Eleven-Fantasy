schema = "VRFW.editor/1"
# Aura Reworked (All Miximaxed): the ModManager editors of the miximax look (docs/framework/modmanager-editor-schemas.md).
# ModManager reads this file and builds its «Miximax palettes» page from it (Section = "miximax_look": the framework's
# miximax look view, with the 3D simulation of base, partner and result):
#   miximax_palettes  the per-character colours of the generated look ([[VRFW.MiximaxPalette]], every mod's files:
#                     Merge = "by_key" merges them by character in load order; an edit goes back into the last mod
#                     that declares that character, else into New of the ACTIVE MOD)
#   ideal_miximax     custom fusions: a base, a partner and, optionally, a fixed look or the pieces changed over the
#                     generated look ([[transform]] kind = "miximax" in this mod's content\transforms\ideal_miximax.toml)
# Read only by ModManager: the game does not read content\editor\.

[[Editor]]
Id = "miximax_palettes"
Title = { en = "Miximax palettes", es = "Paletas de miximax" }
Help = { en = "Each character's colours in the generated miximax look: as a partner he gives them to the base, as a base his own are replaced.", es = "Los colores de cada personaje en el aspecto generado del miximax: como compañero se los da a la base, como base se cambian los suyos." }
Section = "miximax_look"
Files = ["content/miximax_palettes/**/*.toml"]
Table = "VRFW.MiximaxPalette"
Key = "character"
Shape = "miximax_palette"
New = "content/miximax_palettes/edits.toml"
Merge = "by_key"
  # the page's own words (the miximax look view), by text key
