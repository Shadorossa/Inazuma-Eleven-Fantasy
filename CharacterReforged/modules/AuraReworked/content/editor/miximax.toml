[[Editor]]
Id = "ideal_miximax"
Title = { en = "Ideal miximax", es = "Miximax ideales" }
Help = { en = "Your own fusions of this player as the base: pick the partner and, if you want, a fixed look (another character's whole model). Without a fixed look the fusion uses the generated look (the base in the partner's palette colours), and each colour and outfit piece can be changed.", es = "Tus propias fusiones con este jugador como base: elige el compañero y, si quieres, un aspecto fijo (el modelo entero de otro personaje). Sin aspecto fijo la fusión usa el aspecto generado (la base con los colores de la paleta del compañero), y cada color y pieza de ropa se puede cambiar." }
Section = "miximax_look"
Files = ["content/transforms/ideal_miximax.toml"]
Table = "transform"
Key = "name"
Shape = "ideal_miximax"
New = "content/transforms/ideal_miximax.toml"
  # a new fusion: fired by this mod's miximax carrier (the «Create miximax» row), like the generated ones
  [Editor.Template]
  kind = "miximax"
  command = "wmm_evt"
  [Editor.Texts]
  "mxp.ideal.none" = { en = "No ideal miximax of this player yet.", es = "Este jugador aún no tiene miximax ideales." }
  "mxp.ideal.new" = { en = "+ New ideal miximax", es = "+ Nuevo miximax ideal" }
  "mxp.ideal.new_help" = { en = "A new fusion with this player as the base, in this mod's file", es = "Una fusión nueva con este jugador como base, en el archivo de este mod" }
  "mxp.ideal.preview" = { en = "See in 3D", es = "Ver en 3D" }
  "mxp.ideal.preview_help" = { en = "Shows this fusion in the Simulation tab", es = "Muestra esta fusión en la pestaña Simulación" }
  "mxp.ideal.fixed" = { en = "Fixed look: {0}", es = "Aspecto fijo: {0}" }
  "mxp.ideal.pending" = { en = "A fixed look is one whole model. Without it, the hair, skin and eye colours and the clothes, shoes and gloves chosen here change the generated look (in a match the team kit is still drawn over the clothes).", es = "Un aspecto fijo es un modelo entero. Sin él, los colores de pelo, piel y ojos y la ropa, las botas y los guantes elegidos aquí cambian el aspecto generado (en un partido la equipación del equipo se sigue viendo encima de la ropa)." }
  "mxp.ideal.shown" = { en = "Fusion {0}", es = "Fusión {0}" }

