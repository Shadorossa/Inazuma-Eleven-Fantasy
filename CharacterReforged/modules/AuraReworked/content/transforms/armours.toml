schema = "VRFW.transform/2"
if_mod = "all_keshin_armed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# All Keshin Armed: every keshin -> armour pair (189 from the v7.1.2 aura_skill_config + change_aura_skill_config, + 2
# own at the end: the retail whitelist = `users.cards`, else the armour owner's cards = `users.characters`; moved here from Inazuma
# Fantasy's content/transforms/if_armour.toml, 2026-10-13, same entries). Run by the framework's transform run time;
# who may wear them is rules.toml (`armour_wearers = "anyone"`: any player whose body has a mesh, the meshes of every
# body group are assets/chr/_armd + content/looks/armour_clothes.toml). How a player gets the armour without a game
# mode's own rule: the game's skill board (content/techniques/armour_changes.toml, docs/game/mods/all-keshin-armed.md).
# A mod that layers its own activation (Inazuma Fantasy: the armour out of the summoned keshin on RB+A, the K1 gate,
# the aura gates) declares only its [rules] / scripts: these entries stay as they are. Data, hand-maintained.

# The keshin's move stays usable under the armour; the wearer keeps his own stats, head and voice (a non-native wearer
# is himself + the armour's clothes, the framework's form::armour); the CPU arms too.
[defaults.armour]
techniques = { keep_spirit = true }
trigger = { cpu = true }
stats = { mode = "own" }
look = { no_uniform = true }
audio = { voice = "wearer" }
ui = { plate = "armour" }
text = { de = { tag = "Rüstung" }, en = { tag = "Armour" }, es = { tag = "Armadura" }, fr = { tag = "Armure" }, it = { tag = "Armatura" }, ja = { tag = "アームド" }, pt = { tag = "Armadura" }, zh_hans = { tag = "化身武装" }, zh_hant = { tag = "化身武裝" } }

