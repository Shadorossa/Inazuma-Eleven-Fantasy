# Souls Rework › the reel results as passives (kind VRFW.passive/1): a skill family of
# content\souls\skills.toml with effect "passive" names one of these; the reel grants it (grant = true: the rule flag
# <[grant] flag_prefix>.<passive>.<actor handle> = the skill level) for its seconds or while the totem is out.
schema = "VRFW.passive/1"

[[VRFW.Passive]]
name = "reel_shoot_up"
blocks = ["reel_power_shoot_10"]
grant = true

