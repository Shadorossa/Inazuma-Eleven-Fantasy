# Declares [[VRFW.MiximaxPalette]] (kind VRFW.miximax_palette/1): the colours of each character's miximax look, in a
# mod's content\miximax_palettes\*.toml (read by the framework's miximax look, transform_engine::miximax::palette;
# docs/game/mods/miximax-palettes.md). Any mod may add or fix palettes: mods merge by character, a later mod's keys win.
schema = "VRFW.decl_schema/1"
kind = "VRFW.miximax_palette/1"
folder = "content/miximax_palettes"

[entry.MiximaxPalette]
doc = "one character's colour keys: as a partner he gives them to the base, as a base his own are replaced"
character = { type = "string", required = true, doc = "the character: its game name (c01000010, c01000010_5000) or its id 0x…" }
id = { type = "string", doc = "the character's id 0x… when it is not the crc32 of the name (a mod's character)" }
head = { type = "string", doc = "the face texture recoloured (_face/<series>/<id>/<id>.g4tx); left out = an earlier mod's" }
hair = { type = "string", doc = "hair colour \"#RRGGBB\"; \"\" = no hair colour (bald, cap, hood): not recoloured" }
face = { type = "string", doc = "face skin colour \"#RRGGBB\" (the face atlas); \"\" = not recoloured" }
iris = { type = "string", doc = "eye colour \"#RRGGBB\"; \"\" = the eyes keep their colour" }
skin = { type = "string", doc = "body skin colour \"#RRGGBB\" (multiplied into the body's skin part)" }
accessories = { type = "list", doc = "pieces his miximax look carries as a partner: \"exmesh_1\"..\"exmesh_3\" (his chara_model extra mesh: put on the base in a free extra-mesh slot) or a head mesh name (editor only); an item may be { piece, color = \"#RRGGBB\" } (the colour is stored, not applied yet)" }
zones = { type = "table", doc = "the painted zones of his head, used when he is the base: { face = \"<png>\", hair = \"<png>\" } (mod-relative paths); over the face atlas (_10) red = eyebrows, green = face skin, blue = eyes; over the hair swatch (_20) red = hair. Only the painted pixels are recoloured; left out = the colour keys decide" }
