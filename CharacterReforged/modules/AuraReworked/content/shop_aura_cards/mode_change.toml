# The game's mode changes this mod sells (content\shops\mode_changes.toml) get the mode change aura card in the shop,
# as the keshin, armour, miximax and totem items do. The game draws that card only for the item sub-kinds 125 and
# 171-176; the mode changes are sub-kind 178 (the skill kind of _mode_change_shop.toml), aura type 6. The card layer
# joins the shop's menu in content\menus\shop_mode_change_card.toml.
schema = "VRFW.shop_aura_card/1"

[[VRFW.ShopAuraCard]]
name = "mode_change"
item_sub = 178
aura_type = 6
layer = "team00_30_aura_mode_change_detail_info"
