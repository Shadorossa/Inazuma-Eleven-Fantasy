schema = "CharacterReforged.pairing/1"
if_mod = "all_changed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# All Changed › its row of Character Reforged's create entry on the base game (docs/game/mods/all-changed.md §2): an
# aura piece's list on the retail skill board shows «Crear nuevo cambio» (wmc_evt_create); the partner comes from the
# retail bank picker; CMND_AURAREWORKED_CHANGE_CREATE stores and equips the change (one per player) and the carrier wmc_evt<k>
# (k = the command's 2nd value, always 0: one change per player) goes on that board slot. The pair rules are system
# `change` of Character Reforged's PairCheck (any mod's [CharacterReforged.PairRules.change]); the store answers 10 + that
# code (pair_codes), its own codes are below.
[CharacterReforged.Create.change]
item = "wmc_evt_create"
label = "aura_reworked.change_create_label"
store = "CMND_AURAREWORKED_CHANGE_CREATE"
carrier = "wmc_evt{k}"
pair_codes = 10
order = 20

# CMND_AURAREWORKED_CHANGE_CREATE's own codes (scripts\all_changed.lua: MC_ADD's) -> the refusal window's text
[CharacterReforged.Create.change.refusals]
"1" = "character_reforged.create_refused_off"
"3" = "character_reforged.create_refused_1"
"4" = "character_reforged.create_refused_2"
"5" = "character_reforged.create_refused_4"
"7" = "character_reforged.create_refused_store"
"21" = "character_reforged.create_refused_2"
"22" = "character_reforged.create_refused_5"
"23" = "character_reforged.create_refused_4"
"24" = "character_reforged.create_refused_8"
"25" = "character_reforged.create_refused_card_used"

# Character Reforged's partner locks (its scripts\partner_lock.lua): the partner of every equipped change stays in the
# player bank (greyed, never placed into a team) with this plate over his card: the blue-red «Mix» (sprite of
# content\images\menu\102_team\team11\team11_05\partner_badge.toml, word = text key partner_badge).
# scripts\all_changed.lua sends the partners (CharacterReforged.PartnerLockSet).
[CharacterReforged.PartnerLock.change]
badge_sprite = "all_changed_partner_badge"
badge_text = "aura_reworked.change_partner_badge"
order = 20
