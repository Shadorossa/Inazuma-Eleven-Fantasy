# The shop's card for the game's mode changes this mod sells (content\shops\mode_changes.toml), drawn by the framework's
# shop aura cards (content\shop_aura_cards\mode_change.toml). The game's shop_menu_setting has the layer row
# team00_30_aura_mode_change_detail_info, but its group shop_menu_buy never lists it (its six other aura cards are
# listed), so the layer is never created: it joins the group right after the awakening card, with the flags of the
# other aura cards. The framework keeps it hidden until a mode change row is focused.
schema = "VRFW.menu/2"

[[patch]]
menu = "shop_menu"
layer = "team00_30_aura_mode_change_detail_info"
groups = [{ group = "shop_menu_buy", flags = [0, 1, 1, 0, 1, 0], after = "team00_30_aura_awakening_power_detail_info" }]

# Where the card goes: the shop places its detail cards with the attach rows of item01_20_detail_win_attach_shop_locator
# (CMenuAttachLocator NullLayerName [locator, host layer, card layer, 0]); the game lists the six other aura cards there,
# not the mode change one. Each keshin card row is repeated right after itself for the mode change card, so it sits
# where the keshin card does (the same team00_30 window and size).
[[object_set]]
object = "item01_20_detail_win_attach_shop_locator"
copy = [
    { param = "NullLayerName", match = { 3 = 0x9E0726C7 }, values = { 3 = 0xBAA5B8E9 } },   # keshin card -> mode change card
]
