# All Miximaxed: the Chrono Stone MIXIMAX creation scene (docs/game/media/miximax-cutscene-cs.md §8-§10), copied from
# Inazuma Fantasy on 2026-10-14. Played over the menus after «Crear miximax» on Character Reforged's skill table:
# ev99_97010 (the two players, the CS clip, the white flash), then ev99_97020 (the fused base alone). The framework
# builds the lists at boot; the two evt lists are templates (template = true, served as <list>.template.cfg.bin):
# scripts\lib\scene.lua serves the real lists and, before each play, writes the players' chara_base names over
# c99999901_mx_scene_base_ / c99999902_mx_scene_aura_ and their body rigs over c000101 in the pack paths (keep those
# placeholders). The packs, cameras and effect objects are this mod's assets (event\ev99, effect\event\ev99); the
# main event's eff list also plays the retail Mix-Max cut-in effect ev82000100.
# Inazuma Fantasy declares the same events: this file is left out when it is active (one owner).
schema = "VRFW.anim/2"
if_mod = "all_miximaxed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
if_not_mod = "inazuma_fantasy"

