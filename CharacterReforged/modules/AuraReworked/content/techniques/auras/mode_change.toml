schema = "VRFW.technique/3"
if_mod = "all_changed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# Custom Change Mode › the «Modo cambio» commands (docs/game/mods/all-changed.md; moved from Inazuma Fantasy 2026-10-14,
# docs/game/mechanics/mode-change.md §2). All are clones of the retail mode change `mode_change_c06030060` (auraType 6:
# the mode change's lists, plates and cut-in) with
#   * power_min (cost) 0: no hyper gauge / tension; power_max (time) 90: the swap holds the timer full;
#   * no buffs (effects / unique_effects empty): the partner form is the partner card as it is; no AURA_CMD_CHARA owner;
#   * linked_skill (col 6) = the command itself, as every retail mode_change_* row.
# `wmc_evt_create` is «Crear nuevo cambio» (a creation screen's entry, never equipped); `wmc_evt0` .. `wmc_evt7` are the
# carriers of a player's change (the plates slot's mix slot holds `wmc_evt<k>`; the VR-Framework's swap turns its
# metamorphosis into the partner card). Their items: base_tables\gamedata\item\item_config.toml (sub_category
# 178 = mode change). Ids = crc32 of the keys, the same as in Inazuma Fantasy's saves.
default_lang = "none"

[[aura_command]]
key = "wmc_evt_create"
from = "mode_change_c06030060"
power_min = 0
power_max = 90
cells = { name_text = 0x79E7C50A, desc_text = 0x2C711758, linked_skill = 0xD4A87F7F, order = 7000 }
unique_effects = []
effects = []
charas = []

