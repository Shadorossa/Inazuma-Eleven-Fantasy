[[text]]
id = 0x30CE6BB4
kind = "text"
add = true
ja = "この選手とその変身先の選手を切り替える\n（RB + B、60秒ごと）。変身中は相手の姿・\n能力・技になる。テンション消費・時間制限なし。"
en = "Swap between this player and his change\n(RB + B, every 60 s): he becomes that player,\nlook, stats and moves; no tension, no time limit."
es = "Cambia entre este jugador y su cambio\n(RB + B, cada 60 s): se convierte en él, aspecto,\nestadísticas y técnicas; sin tensión ni límite de tiempo."
fr = "Alterne entre ce joueur et son changement\n(RB + B, toutes les 60 s) : il devient ce joueur,\napparence, stats et techniques ; sans tension ni limite."
de = "Wechselt zwischen diesem Spieler und seinem\nWechsel (RB + B, alle 60 s): er wird dieser Spieler,\nAussehen, Werte, Techniken; keine Spannung, kein Limit."
it = "Alterna tra questo giocatore e il suo cambio\n(RB + B, ogni 60 s): diventa quel giocatore,\naspetto, statistiche e tecniche; niente tensione né limite."
pt = "Alterna entre este jogador e a sua mudança\n(RB + B, a cada 60 s): torna-se esse jogador,\naparência, atributos e técnicas; sem tensão nem limite."
zh_hans = "在该球员与其变换对象之间切换\n（RB + B，每60秒）：变为对方的外观、\n能力与技能；不消耗气势，无时间限制。"
zh_hant = "在該選手與其變換對象之間切換\n（RB + B，每60秒）：變為對方的外觀、\n能力與技巧；不消耗氣勢，無時間限制。"

