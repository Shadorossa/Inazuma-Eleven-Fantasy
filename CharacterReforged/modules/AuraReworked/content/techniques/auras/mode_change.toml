[[text]]
id = 0x2C711758
kind = "text"
add = true
ja = "好きなキャラを選ぶ：試合中、この選手はその\nキャラに変身でき、また元に戻れる\n（RB + B、60秒ごと）。"
en = "Pick any character: in matches this player can\nswap into him and back again\n(RB + B, every 60 s)."
es = "Elige cualquier personaje: en los partidos este\njugador podrá convertirse en él y volver\n(RB + B, cada 60 s)."
fr = "Choisis un personnage : en match, ce joueur pourra\nse changer en lui et revenir\n(RB + B, toutes les 60 s)."
de = "Wähle eine Figur: Im Spiel kann sich dieser Spieler\nin sie verwandeln und zurück\n(RB + B, alle 60 s)."
it = "Scegli un personaggio: in partita questo giocatore\npotrà trasformarsi in lui e tornare\n(RB + B, ogni 60 s)."
pt = "Escolhe uma personagem: nos jogos este jogador\npoderá transformar-se nela e voltar\n(RB + B, a cada 60 s)."
zh_hans = "选择任意角色：比赛中该球员可以\n变成他，再变回来\n（RB + B，每60秒）。"
zh_hant = "選擇任意角色：比賽中該選手可以\n變成他，再變回來\n（RB + B，每60秒）。"
