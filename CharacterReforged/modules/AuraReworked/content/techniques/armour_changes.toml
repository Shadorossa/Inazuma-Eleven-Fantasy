if_mod = "all_keshin_armed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# All Keshin Armed: the game's own skill-board choice «with armour / without» for EVERY player with a keshin
# (docs/game/mods/all-keshin-armed.md §2). The board's keshin piece has an armed slot (skillEquipInvInfo.keshinArmed,
# open from the keshin piece's level + 5): set it and the skill list builder (0xD83370) turns the keshin into the
# armed form this table names for (keshin, the player's card); empty = the plain keshin. The game takes the FIRST row
# of a keshin's list for every card when its card is 0, so each keshin of transforms/armours.toml gets one row: its
# first armour in transforms/armours.toml (the pairing order the framework also uses) for card 0 = any card (the
# retail per-card lists of these keshin are replaced: the framework builds a non-native wearer's look on his own body).
# Getting a keshin item also adds the armour items of its list (add item 0xE93210). One [[aura_change]] per keshin that has
# an armour in transforms/armours.toml (keep the two files together: a new armour pair = its keshin's row here).

