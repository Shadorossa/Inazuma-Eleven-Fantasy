# Aura Reworked: the settings of its parts (read by its scripts at the start; restart the game after a change). The
# Mods options rows (options.toml) switch the parts and their choices; the numbers stay here.

# ================================================================= Custom Change Mode
[mode_change]
# false: no change can be created or equipped, the stored ones stay in the save but do nothing
enabled = true
# The swap's cooldown, button and states are the plates slot's declaration: content\extra_slots\change.toml
# ([VRFW.ExtraSlot.swap] cooldown_s = 60 s between two swaps).

# ================================================================= Souls Rework
# The totems and the skill families are content\souls\*.toml (kind AuraReworked.soul/1).

# Aura Points (optional): its per-totem SP pool and its per-player cost input. With its pool running for a totem, each
# level sets the pool's max to the totem's SP at that level; without it, each level lengthens the totem's summon time.
[souls.aura_points]
resource = "aura_points.sp"
# the rule flag <cost_flag>.<hdl> = percent of that player's SP costs (SP Saving)
cost_flag = "aura_points.cost_pct"
# the rule flag <start_flag>.<aura id> = the totem's SP at level 1: its SP bar starts there in matches and menus
start_flag = "aura_points.sp_start"

# Aura Points' match PE (optional; the mod Stamina Points until 2026-10-16): the team stamina the recovery skills refill
[souls.stamina]
resource = "aura_points.pe"

# The reel over the totem move's cut-in (graft souls_rework_reel). Seconds from the move.
[souls.reel]
# false: the rolls apply without a reel
show = true
open_s = 0.2
spin_s = 0.8
stop_s = 0.9
result_s = 1.2
close_s = 0.3
# rows per second while it spins
spin_rows_per_s = 12
# a second reel waits at most this many (a rival's rolls are never shown)
queue = 2

# The level-up pop (graft souls_rework_level_pop): a small speech bubble over the player's head with «+Nv.2» (text key
# aura_reworked.level_pop, {level} = the new level), its tail pointing down to the head, following him: it pops in,
# stays, then rises and fades out. Its colours are those of the aura type (totem, keshin, armed, miximax, …: the type's
# own icon of the game, research/scripts/souls_rework_bubble_build.py). Hidden while a cut-in or a match scene plays
# (the framework's cutin_start / cutin_end); it shows again after the scene only while its time is not over. Seconds;
# sizes in layout units of a 1920 x 1080 screen.
[souls.level_pop]
# false: no pop
show = true
# the rival (CPU) team's level-ups pop too (their levels count only with [levels] cpu = true)
cpu = true
appear_s = 0.15
# how long it stays over the player at full size (owner 2026-10-19: 3 s longer than the first 1.0)
hold_s = 4.0
out_s = 0.4
# the bubble: body height, tail height (the tail tip is `lift` above the head) and the text's scale (1 = the retail
# telop's text size)
body_height = 28
tail_height = 8
lift = 10
text_scale = 0.45
# room left and right of the text inside the body
pad_x = 8
# the body widths drawn for each aura type (the narrowest that holds the text is used); the sprites are made from this
# list by research/scripts/souls_rework_bubble_build.py: run it again after a change
bubble_widths = [36, 40, 44, 49, 54, 60, 66, 73, 80, 88, 97, 107, 118]
# a character's width at text scale 1, used only when the game does not measure the text
char_width = 24
# moves the text up (+) or down (-) inside the body
text_offset_y = 0
# the text's colour markup around it ({text}; font_color tags: [CW] white ... [C] reset)
text_markup = "[CW]{text}[C]"
# how far it rises while it fades out
rise = 24

# How a totem gains level points (LP) and levels while it is out (Galaxy's real amounts are unknown). About 4 minutes of
# live play reach level 5 without duels; each duel won is 15 s of play, a goal 30 s.
[souls.levels]
# total LP to reach level 2, 3, 4, 5 (one value per level above 1; lower them to level up faster)
thresholds = [30, 80, 150, 240]
# LP per second of live play
per_second = 1.0
# LP when its player wins a focus duel
per_duel_won = 15.0
# LP when its player scores
per_goal = 30.0
# LP when its player uses the totem's own move
per_own_move = 10.0
# without Aura Points: extra summon time = full time x (SP[level] - SP[1]) / SP[1] x this
time_scale = 1.0
# the rival (CPU) team's totems gain levels and roll the reel too (its rolls are never shown)
cpu = true
# the release button does nothing while a totem is out
no_release = true
# the soccer states of live play (the level points per second count only there)
live_states = [9, 14, 15, 16]

# the shot that a keeper duel follows: the shooter's move_power within this many seconds (Numbness +)
[souls.effects]
shot_window_s = 8
# knock-down: a field clip played on the opponent (<mod>.<name>; "" = none, only the slow-down)
knockdown_clip = ""
