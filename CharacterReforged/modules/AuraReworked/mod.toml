id = "AuraReworked"
former_ids = ["aura_reworked"]
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Aura Reworked"
version = "1.10.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "The aura reworks in one mod, each part switched on or off in its settings: Souls Rework (totems gain levels during the match like the souls of Inazuma Eleven GO Galaxy and spin a skill reel), Custom Change Mode (any player gets his own «Modo cambio» into any of your characters and swaps with RB+B, 60 seconds between two swaps), All Miximaxed (a miximax between any two of your players, as in Chrono Stone) and All Keshin Armed (every keshin with its armour, for every player). The game's own mode changes are sold in the Spirit Market, or in Inazuma Fantasy's Training Shop when that mod is on. Works with the VR-Framework and Character Reforged; Aura Points is optional."
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-10-24"
# This mod's own names (TOML keys [[AuraReworked.X]], Lua AuraReworked.X, commands CMND_AURAREWORKED_*); never VRFW.
prefix = "AuraReworked"
folder = "AuraReworked"
# Standard mod layout (docs/framework/mod-layout.md). Four parts, each switched by its own Mods options row
# (options.toml; its id = the id the part had as a mod of its own until 2026-10-16). A part that is off loads nothing of
# its own: each of its content files and script entries carries `if_mod = "<part>"` (docs/framework/merged-mods.md).
#   Souls Rework (souls_rework): totem levels and the skill reel (docs/game/mods/souls-rework-design.md)
#     content\types\soul.toml, content\souls\ (kind AuraReworked.soul/1: the totems, the skill families; ModManager's
#     «Auras» totem page edits them), content\game\souls_rework.toml, content\menus\reel.toml (the skill carousel's
#     screen aura_reworked_souls_reel_menu, its script assets\lua\screens\aura_reworked_souls_reel_menu.lua) +
#     level_pop.toml, content\images\menu\02_btl\souls_rework_pop.toml + souls_rework_reel.toml (drawn by
#     _tools\souls_rework_reel_atlas_build.py), scripts\souls_rework.lua (+ lib\data.lua, lib\auras.lua),
#     config.toml [souls.*]; graft research/grafts/souls_rework_level_pop
#   Custom Change Mode (all_changed): custom «Modo cambio» (docs/game/mods/all-changed.md)
#     content\techniques\auras\mode_change.toml, content\extra_slots\change*.toml (the swap: 60 s cooldown),
#     content\effects\mode_change_aura.toml, content\transforms\mode_change.toml, content\game\mode_change.toml,
#     content\skill_tabs\mode_change_tab.toml, content\pairing\change.toml, scripts\custom_change_mode.lua (+ lib\cards.lua)
#   All Miximaxed (all_miximaxed): a miximax between any two players (docs/game/mods/all-miximaxed.md)
#     content\transforms\miximax.toml, content\techniques\carriers.toml, content\characters\carrier.toml,
#     content\pairing\miximax.toml, content\game\miximax.toml + mx_scene.toml, content\anims\mx_scene.toml,
#     content\stat_transfer\, content\miximax_palettes\, content\telops\, content\menus\player_page_slots.toml,
#     scripts\miximax.lua (+ lib\stat_transfer.lua, lib\scene.lua), assets\evt_mx\, assets\event\ev99\, …;
#     graft research/grafts/all_miximaxed_scene
#   All Keshin Armed (all_keshin_armed): every keshin with its armour (docs/game/mods/all-keshin-armed.md)
#     content\transforms\armours.toml + rules.toml, content\techniques\armour_changes.toml + armour_owners.toml,
#     content\looks\armour_clothes.toml, content\models\armours\, content\skill_board\armour_slot.toml,
#     content\game\armour_tag.toml + board_pieces.toml + keshin_moves.toml, scripts\armour_tag.lua,
#     scripts\keshin_moves.lua, assets\chr\_armd\; the black Queen / King armours: content\techniques\
#     black_armours.toml + content\characters\black_armours.toml, their textures generated by
#     _tools\black_armour_build.py (git-ignored, installed through CharacterReforged\_deploy.toml)
#   The game's own mode changes for sale (always on): content\shops\mode_changes.toml + content\items\
#     mode_change_spirits.toml, GENERATED by research/scripts/aura_reworked_mode_change_shop.py from _mode_change_shop.toml;
#     their shop card: content\shop_aura_cards\mode_change.toml ([[VRFW.ShopAuraCard]]) + content\menus\
#     shop_mode_change_card.toml (the card layer in the shop's menu)
#   content\base_tables\gamedata\item\item_config.toml   the items of Custom Change Mode and All Miximaxed (one block each)
#   content\images\menu\102_team\team11\team11_05\partner_badge.toml   both partner plates
# Saves: the stores of Custom Change Mode (mode_change.json) and All Miximaxed (miximax.json) are this mod's per-slot blobs,
# copied once from slot<N>\all_changed\ and slot<N>\all_miximaxed\ ([[VRFW.SaveImport]] of content\game).
# vr_framework 2.4.172: [[merged]] (the four old ids keep working), the gates of VRFW.files.declarations;
# character_reforged: the family (the [module] below), its create entry, pairing rules and player page.
requires = ["VRFW>=2.151.0", "CharacterReforged>=1.9.15"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# memory: the soccer actors (Souls Rework, the keshin move option), the owned cards' save records (Custom Change Mode);
# call: the actor's unit; hook: the totem's release-button answer, the scene's menu parts; command: every part's commands
permissions = ["memory", "call", "command", "hook"]

# The four mods merged into this one on 2026-10-16 (docs/framework/merged-mods.md): an old id still satisfies
# `requires`, an enabled.toml / load_order.toml entry of it means this mod (rewritten once at boot), and
# `if_mod = "<old id>"` holds while its part's option row is on. The [[alias]] tables of text\keys.toml keep the numbers.
[[merged]]
id = "souls_rework"
version = "0.5.2"
option = "souls_rework"

[[merged]]
id = "all_changed"
version = "1.1.13"
option = "all_changed"

[[merged]]
id = "all_miximaxed"
version = "1.1.4"
option = "all_miximaxed"

[[merged]]
id = "all_keshin_armed"
version = "1.0.7"
option = "all_keshin_armed"

# What other mods may use (a mod that requires aura_reworked): Custom Change Mode's store (AuraReworked.Change<name>), All
# Miximaxed's stored fusions and blob (AuraReworked.MixFusions / MixStoreBlob), the totem data keys and the totem table
# (AuraReworked.SoulsPlayer: hdl -> level, totem, no_release). Command CMND_AURAREWORKED_SOULS_REEL / _REEL_LANDED / _TOTEM_LEVEL
# (old names CMND_SOULSREWORK_*), the swap gauge CMND_ALLCHANGED_SWAP_GAUGE (content\extra_slots\change.toml).
# «Rótulos personalizados» (Opciones de mods) offers the languages of its telops (docs/framework/content-languages.md)
[content.languages]
telops = ["es", "en", "fr", "de", "it", "pt", "zh_hans", "zh_hant"]

[exports]
functions = ["ChangeOn", "ChangeItems", "ChangeAdd", "ChangeList", "ChangeItem", "ChangeEquip", "ChangeDelete", "ChangeGet", "ChangeReservation", "ChangePartnerOk", "ChangeCandidateRows", "ChangeReservedBy", "ChangeIsBase", "ChangePairs", "ChangeCarrier", "MixFusions", "MixStoreBlob"]
keys = ["Totem", "Skill"]
tables = ["AuraReworked.SoulsPlayer"]
game_lua = []

# its own content/ folders read only by scripts (Character Reforged's pairing rules, All Miximaxed's stat transfer)
[layout]
script_folders = ["pairing", "stat_transfer"]

# A MODULE of Character Reforged (docs/framework/mod-families.md): listed inside Character Reforged's entry.
[module]
of = "CharacterReforged"
order = 10
