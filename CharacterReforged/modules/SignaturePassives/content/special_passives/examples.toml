schema = "SignaturePassives.special_passive/1"
# Signature Passives › example special passives, given to no one (a [[SignaturePassives.Character]] entry gives one to a
# character; ModManager «Pasivas» shows them as templates too).

# «This passive increases both the user's shoot block technique power by 10 and the Technique parameter of midfielder
# team members by 5 each time a team member stops an opponent's shot. Its effect is nullified whenever a team member
# scores a goal.»
[[SignaturePassives.Passive]]
name = "example_midfield_wall"
blocks = ["team_saves_shot", "stack_no_limit", "own_shoot_block_plus_10", "mf_technique_plus_5", "team_scores"]

# each goal against (at most 3): the team's kick +5 % per goal, until the team scores
[[SignaturePassives.Passive]]
name = "example_comeback"
blocks = ["opponent_scores", "stack_max_3", "team_kick_plus_5pct", "team_scores"]

# each duel he wins (at most 5, 60 s each): his move speed +2 %; gone when he loses one
[[SignaturePassives.Passive]]
name = "example_duel_streak"
blocks = ["self_wins_duel", "stack_5_for_60s", "own_speed_plus_2pct", "self_loses_duel"]
