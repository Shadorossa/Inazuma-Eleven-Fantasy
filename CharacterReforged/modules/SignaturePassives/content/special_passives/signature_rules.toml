schema = "VRFW.passive/1"
# Signature Passives › the shared rules of the signature passives (docs/game/mods/signature-passives/): the archetype
# tags the Trait blocks read (their words: text\keys.toml tag_<name>) and the caps on the summed percents of the
# passives (the docs' balance: 25 % per parameter of one player, 8 % for the open team-wide ones). The tags of each
# character are in content\special_passives\signature_<part>.toml.

[[VRFW.Tag]]
name = "striker"
text = "tag_striker"

[[VRFW.Tag]]
name = "cannon"
text = "tag_cannon"

