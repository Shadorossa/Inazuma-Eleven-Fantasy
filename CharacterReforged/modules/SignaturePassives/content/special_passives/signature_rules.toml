# every signature passive: the sum of their percents on one answer (a move's power, a stat, a rate) of one player
# stays within ±25 %
[[VRFW.PassiveCap]]
name = "signature_total"
max_percent = 25

# the open team-wide ones (no tag, group or saga): their own sub-cap of ±8 %
[[VRFW.PassiveCap]]
name = "signature_open"
max_percent = 8
