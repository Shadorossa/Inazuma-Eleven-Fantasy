schema = "VRFW.item/2"
# Signature Passives: no custom passive items from anywhere (owner request 2026-10-16: with this mod the board's custom
# passive slot holds each player's own passive, so the game's custom passive items have no use). Mechanism: the
# VR-Framework's [[VRFW.MatchDropRemove]] (docs/framework/drops.md §6); this mod only declares the rule.
# * SubCategories 177: every custom passive item of item_config (ITEM_SPECIAL_SKILL_INFO column 6 = 177, the six-sense
#   passives of board equip slot 9), derived from the game's data at boot (retail v7.1.2: 41 items, 74 prize rows).
# * Every mode: a match's drop or prize of one gives nothing (no re-roll), «Tasa de aparición» does not list them.
# * AllSources: every other grant through the game's item add is refused too (rewards, gifts, scripts, the ability
#   board); a shop purchase is not. No paid exchange is lost: no retail shop sells one, and the board's custom passive
#   piece (ability_learning_config ABILITY_LEARNING_BOARD_EFFECT) is what its points buy: with this mod the piece
#   opens the player's own passive (content\game\own_passives.toml SixSensePieceOpen), the item is never read.
# With the module off the rule is not loaded: the game's items again.
[[VRFW.MatchDropRemove]]
SubCategories = [177]
AllSources = true
