[fr.new]
mod_name = "Passifs signature"
mod_description = "Le passif personnalisé devient le passif exclusif de chaque joueur : un passif qui lui est propre, déclaré par personnage dans les mods, au lieu d'un passif à équiper. Sur le tableau de Victory Road, l'emplacement l'affiche toujours et ne peut pas être modifié ; les matchs l'utilisent. Sur le tableau Fantasy de Character Reforged, le bouton du passif personnalisé l'affiche, en lecture seule. Nécessite Character Reforged. Ajoute les passifs génériques d'élément (vent, forêt, feu, montagne et néant plus : ses techniques de cet élément ×1,15), attribués comme tout passif générique. Chaque passif spécial est composé de blocs réutilisables (quand, conditions, effets), modifiables par personnage dans ModManager."
