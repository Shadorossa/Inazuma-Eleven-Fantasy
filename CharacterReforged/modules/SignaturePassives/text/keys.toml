[de.new]
mod_name = "Signatur-Passive"
mod_description = "Die angepasste Passivfähigkeit wird zur persönlichen Passivfähigkeit jedes Spielers: eine eigene, in den Mods pro Charakter festgelegte Fähigkeit statt einer, die du ausrüstest. Auf der Tafel von Victory Road zeigt der Slot sie immer an und sie kann nicht geändert werden; die Spiele nutzen sie. Auf der Fantasy-Tafel von Character Reforged zeigt die Schaltfläche der angepassten Passivfähigkeit sie an, nur zum Ansehen. Benötigt Character Reforged. Fügt die allgemeinen Element-Passivfähigkeiten hinzu (Wind, Wald, Feuer, Berg und Neutral plus: seine Techniken dieses Elements ×1,15), zuweisbar wie jede allgemeine Passivfähigkeit. Jede Spezialpassivfähigkeit besteht aus wiederverwendbaren Bausteinen (wann, Bedingungen, Effekte), die ModManager pro Charakter bearbeitet."
