[es.new]
mod_name = "Pasivas propias"
mod_description = "La pasiva personalizada pasa a ser la pasiva propia de cada jugador: una pasiva suya, declarada por personaje en los mods, en lugar de una que equipas tú. En el tablero de Victory Road el espacio la muestra siempre y no se puede cambiar; los partidos la usan. En el tablero Fantasy de Character Reforged el botón de la pasiva personalizada la muestra, solo para consultar. Necesita Character Reforged. Añade las pasivas genéricas de elemento (aire, bosque, fuego, montaña y neutro plus: sus técnicas de ese elemento ×1,15), que se asignan como cualquier pasiva genérica. Cada pasiva especial se compone de bloques reutilizables (cuándo, condiciones, efectos) que ModManager edita por personaje."
