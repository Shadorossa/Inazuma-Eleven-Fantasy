[ja.new]
mod_name = "固有パッシブ"
mod_description = "カスタムパッシブが選手ごとの固有パッシブになる：自分で装備するものではなく、Modでキャラクターごとに決められたその選手だけのパッシブ。Victory Roadのボードではスロットに常に表示され、変更はできない。試合ではそれが使われる。Character ReforgedのFantasyボードではカスタムパッシブのボタンで確認できる（変更不可）。Character Reforgedが必要。属性の汎用パッシブ（風・林・火・山・無属性プラス：その属性の自分の技×1.15）も追加。他の汎用パッシブと同じように設定できる。特殊パッシブはすべて再利用できるブロック（タイミング・条件・効果）で組み立てられ、ModManagerでキャラクターごとに編集できる。"
