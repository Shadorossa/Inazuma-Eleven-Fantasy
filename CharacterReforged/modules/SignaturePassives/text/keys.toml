[zh_hans.new]
mod_name = "专属被动"
mod_description = "自定义被动技能变为每名球员的专属被动技能：由模组按角色设定的球员自身技能，而不是由你装备。在Victory Road的面板上，该栏位始终显示它且无法更换；比赛中会使用它。在Character Reforged的Fantasy面板上，自定义被动技能的按钮会显示它（仅供查看）。需要Character Reforged。另新增通用属性被动（风、林、火、山、无属性加成：自身该属性技能×1.15），可像其他通用被动一样设定。每个特殊被动都由可复用的模块（时机、条件、效果）组成，可在ModManager中按角色编辑。"
