schema = "VRFW.text_key/1"
# Texts of «Signature Passives» (mod SignaturePassives) (format: docs/framework/types/text.md): the «Mods» screen's name
# and description. The words of the passives' descriptions are the framework's (VRFW text\passive.toml).
default_lang = "en"

[en.new]
mod_name = "Personal Passives"
mod_description = "The custom passive becomes each player's Signature Passive: a passive of his own, declared per character by the mods, instead of one you equip. On Victory Road's board the slot always shows it and cannot be changed; matches use it. On Character Reforged's Fantasy table the custom passive button shows it, read only. Needs Character Reforged. Adds the generic elemental passives (Wind, Forest, Fire, Mountain and Void plus: his own moves of that element ×1.15), assigned like any generic passive. Every special passive is built from reusable blocks (when, conditions, effects), edited per character in ModManager."
