schema = "VRFW.game/2"
# All Keshin Armed › the skill board's keshin armed slots are this mod's (docs/framework/board-pieces.md): an armour set
# there while the mod is on belongs to its rules (any player, the card-0 armour lists). When the mod is off, the
# framework takes those armours off the save it hands to the game (the retail owner lists hide the slot, the set armour
# would still be saved) and puts them back when the mod is on again and the slot is still free.
# docs/game/mods/all-keshin-armed.md §2.4.

[[VRFW.BoardPieces]]
name = "AllKeshinArmed.ArmourSlots"
slots = ["keshin_armed"]
