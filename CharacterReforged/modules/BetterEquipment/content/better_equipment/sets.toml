schema = "BetterEquipment.sets/1"
# Better Equipment › the sets (docs/game/mods/better-equipment-proposal.md §2.6, §5): members (alternatives per slot;
# a set counts the distinct equip slots worn), the bonus tiers (cumulative): `stats` as fractions of S (printed at
# S = 70 in the comments), `effects` in the passives' vocabulary. research/scripts/better_equipment.py makes the
# [[VRFW.EquipmentSet]] and the effect passives from this file; scripts\better_equipment.lua adds the stats in matches.
# An item may be a member of several sets; a worn piece counts for one set only (the most complete one, then the one
# with more pieces, then data order: VRFW.item.resolve_sets). docs/game/mods/better-equipment-sets.md lists every set.
# The two automatic sets (Team Colours, Squad) are [[auto_set]] (no member list).

