# Texts of «Better Equipment» (format: docs/framework/types/text.md): the «Mods» screen's name and description and the
# set names. A language or key missing here falls back to English.
default_lang = "en"

[en.new]
page_name_stats = "Stats"
page_name_effect = "Effect"
page_name_set = "Set"
page3_title_any = "Set {set} ({count})"
mod_name = "Better Equipment"
mod_description = "Every equipment item is worth the same: its two raises add up to the strongest bonus of the game's equipment (70 with Inazuma Fantasy, 40 without) and it lowers one stat by a seventh of that, so items differ by shape, not power. A player whose position or element matches the item gets +15 % of its raises (+25 % with both). 67 sets give stats and effects for 2 to 4 pieces worn (an item may be in several sets; a worn piece counts for one). Themed and named items have one passive: their family of special moves +5 % power, their element's moves, tension cost, recharge, move speed, tension per duel, save or goal, stats while trailing or leading. Needs Character Reforged; the passives need Signature Passives and the move families Hissatsu Reforged."
