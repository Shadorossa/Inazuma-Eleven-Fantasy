[es.new]
page_name_stats = "Estadísticas"
page_name_effect = "Efecto"
page_name_set = "Conjunto"
page3_title_any = "Conjunto {set} ({count})"
mod_name = "Better Equipment"
mod_description = "Todo el equipamiento vale lo mismo: sus dos subidas suman el mayor bono del equipamiento del juego (70 con Inazuma Fantasy, 40 sin él) y baja una estadística un séptimo de eso, así que los objetos se distinguen por su forma, no por su potencia. Un jugador cuya posición o elemento coincide con el objeto recibe +15 % de sus subidas (+25 % con ambos). 67 conjuntos dan estadísticas y efectos con 2 a 4 piezas puestas (un objeto puede estar en varios; cada pieza cuenta para uno). Los objetos temáticos o con nombre tienen una pasiva: +5 % de potencia a su familia de supertécnicas, a las de su elemento, coste de tensión, recarga, velocidad, tensión por duelo, parada o gol, estadísticas yendo por detrás o por delante. Necesita Character Reforged; las pasivas necesitan Signature Passives y las familias de supertécnicas Hissatsu Reforged."
