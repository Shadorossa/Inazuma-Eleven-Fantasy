# Stamina Points: the rules of the match PE (read by scripts\stamina_points.lua at the start; restart the game after a
# change). The PE itself (max, drains, Físico, half-time, the «exhausted» state) is content\match_resources\pe.toml; the
# max PE of every character is content\match_resources\pe_max.toml (research/scripts/pe_per_player_build.py).
# Rules: docs/game/mechanics/match-stamina.md, aura-costs.md (§18: the Chrono Stone model), cs-exhausted-walk.md §9.
# Split out of Inazuma Fantasy's [aura_cost] / [tired_motion] on 2026-10-14 (docs/refactor/aura-mods-split.md «Stamina
# Points»): the armour's tension discount and the Hiper slot rules stayed there; the keshin PEG / totem SP pools are the
# mod Aura Points'.

# Transformation costs on the PE. The miximax pays while it runs instead of when it starts.
[pe]
enabled = true
# Cost model: "cs" = Chrono Stone's PE model (docs/game/miximax/chrono-stone-drain.md) with every CS cost × cs_scale;
# "if" = the older rules (armour_pe_mult, miximax_pe_mult, miximax_armour_pe_mult)
cost_model = "cs"
# every Chrono Stone PE cost × this (0.75 = 25 % cheaper): the PE charged at the end, the miximax PE multiplier
cs_scale = 0.75
# CS: while a keshin or an armour is out the player's PE does not drain (PE action costs 0) ...
cs_pe_free_while_out = true
# ... and when that run ends PE is charged once: cs_end_pe_k × KP × (1 − cs_end_stat_k × Físico) × cs_scale (KP = the
# keshin's PEG pool size of the mod Aura Points' table; kp_default without it), × cs_end_armour_mult if an armour was on
# (Pegaso 200, Físico 136, armour: 0.3 × 200 × 0.819 × 0.75 × 1.2 ≈ 44 PE); the charge waits cs_end_grace_ms with
# nothing out (keshin -> armour is not an end)
cs_end_pe_k = 0.3
cs_end_stat_k = 0.00133
cs_end_armour_mult = 1.2
cs_end_grace_ms = 500
kp_default = 200
# CS Miximax Trans: every PE cost × this × cs_scale (5.0 × 0.75 = ×3.75), with or without an armour; replaces
# miximax_pe_mult / miximax_armour_pe_mult. VR drains PE continuously (dash), so this is much harsher than CS: tune it
# with the «miximax PE drain» log lines (every drain_log_s seconds of a running miximax; 0 = off)
cs_miximax_pe_mult = 5.0
drain_log_s = 5.0
# the start does not spend the hyper gauge (the engine's pay is skipped)
free_activation = ["miximax"]
# the start does not need the hyper gauge at all
no_start_check = ["miximax"]
# the miximax has no time limit and ends at 0 PE (the miximax of a mod's extra slot worn under an armour: that miximax
# ends, the armour stays); false = the miximax keeps the game's timer
miximax_untimed = true
miximax_end_pe = 0.0
# PE drain multipliers while transformed (on the player's whole PE drain); "if" model only (cost_model "cs": the
# cs_miximax_pe_mult above, and no PE drain while a keshin / armour is out)
miximax_pe_mult = 1.25
miximax_armour_pe_mult = 1.30
armour_pe_mult = 1.05
# the rival (CPU) team plays by the same rules (false: only the user's team)
cpu = true
# the battery out's clip when a trait rule names none ("" = none)
clip_gauge_end = ""
# aura rows other mods ship whose start is a miximax whatever their row's auraType says (aura keys or ids): All
# Miximaxed's generic carrier and its «Crear miximax» row
miximax_carriers = ["wmm_evt", "wmm_evt_create"]

# Character traits (docs/game/mechanics/aura-costs.md §11). WHO has a trait is any mod's data: `VRFW.Traits = [...]` on
# the character (Inazuma Fantasy: characters\traits.toml); WHAT it does with the PE is one section per trait here. Keys:
# keshins (aura command ids or keys; their armour forms count), gauge_drain (false: while one of them is out its time
# follows the PE instead of the hyper gauge), pe_mult (PE multiplier while one of them is out: replaces the armour's,
# × the miximax's), battery_out ("never" / "aura" = at 0 PE with one of the keshins out / "always" = at 0 PE),
# battery_keep_armour (the armour stays on the kneeling player; a keshin is always dismissed), battery_clip ("" =
# clip_gauge_end; below: Lost Cutscenes' kneel, held by <clip>_hold), battery_hold (locomotion set held until the end
# of the match), battery_hold_after_ms.
# Battery out = the kneel clip, then the player stays kneeling and inert until the end of the match (no movement, no
# control, no pass to him, no ball); a substitution brings in a normal player.

# Perfect Cascade's androids and Mecha-Mark with Plasma Shadow (wkk00723 GK, wkd00722 DF, wko00721 AT, wks00720 SH)
[pe.trait.android]
keshins = [0x0ABB2633, 0x8CEAA470, 0x7F240509, 0x7C37F77F]
gauge_drain = false
pe_mult = 1.5
battery_out = "aura"
battery_keep_armour = true
battery_clip = "new_animations.aura_end_kneel"
battery_hold = "stamina_points.battery_out"
battery_hold_after_ms = 3000

# the Football Museum's Soccer Robots SR-101X…SR-111X: battery out at 0 PE
[pe.trait.robot]
battery_out = "always"
battery_clip = "new_animations.aura_end_kneel"
battery_hold = "stamina_points.battery_out"
battery_hold_after_ms = 3000

# Tired locomotion (docs/game/media/cs-exhausted-walk.md §9; on the PE of content\match_resources\pe.toml). Below
# run_below of his PE (until he is back above run_recover) a field player runs with ONE of run_sets, drawn when the
# episode starts and kept until it ends (reroll = "episode"; "match" = one draw per match): the Chrono Stone staggering
# run or the game's own unused tired run (content\rules\field_clips\tired.toml). At <= idle_at of his PE (0 = 0 PE),
# without the ball and in one of idle_states (9 = in play), every idle_every_s seconds he stops for idle_for_s seconds
# (speed x idle_speed) and plays the CS fatigue idle.
[tired_motion]
enabled = true
run_below = 0.10
run_recover = 0.15
run_sets = ["stamina_points.tired_cs", "stamina_points.tired_vr"]
run_weights = [1.0, 1.0]
reroll = "episode"
idle_set = "stamina_points.tired_idle"
idle_at = 0.0
idle_every_s = [6.0, 14.0]
idle_for_s = [1.2, 2.4]
idle_speed = 0.0
idle_states = [9]
keepers = false
cpu = true
