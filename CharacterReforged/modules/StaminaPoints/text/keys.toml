schema = "VRFW.text_key/1"
# Texts of «Stamina Points» (mod stamina_points, 2026-10-14) (format: docs/framework/types/text.md): the «Mods» screen's
# name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Stamina Points"
mod_description = "Every player gets a stamina bar (GP) for the whole match, as in Chrono Stone: running and above all dashing spend it, Physical makes it last longer, half-time gives some back, and an exhausted player slows down, cannot dash and staggers. Each character's GP is his Inazuma Eleven GO Galaxy value, growing with his level. A miximax has no time limit and does not spend the hyper gauge: it burns GP faster and ends at 0; a keshin or an armour stops the drain while it is out and costs GP when it ends. A yellow bar shows under the controlled player's face. Without this mod there is no GP."

[es.new]
mod_name = "Stamina Points"
mod_description = "Cada jugador tiene una barra de aguante (PE) para todo el partido, como en Chrono Stone: correr y sobre todo esprintar la gastan, el Físico la hace durar más, el descanso devuelve una parte y un jugador agotado va más lento, no puede esprintar y se tambalea. Los PE de cada personaje son su valor de Inazuma Eleven GO Galaxy y crecen con su nivel. Un miximax no tiene límite de tiempo ni gasta la barra hiperdimensional: consume PE más deprisa y termina a 0 PE; un keshin o una armadura detienen el gasto mientras están fuera y cuestan PE al terminar. Una barra amarilla aparece bajo la cara del jugador controlado. Sin este mod no hay PE."

[fr.new]
mod_name = "Stamina Points"
mod_description = "Chaque joueur a une barre d'endurance (PE) pour tout le match, comme dans Chrono Stone : courir et surtout sprinter la vident, le Physique la fait durer plus longtemps, la mi-temps en rend une partie et un joueur épuisé ralentit, ne peut plus sprinter et titube. Les PE de chaque personnage sont sa valeur d'Inazuma Eleven GO Galaxy et augmentent avec son niveau. Un miximax n'a pas de limite de temps et ne coûte pas la jauge hyperdimensionnelle : il brûle les PE plus vite et s'arrête à 0 ; un keshin ou une armure arrête la dépense tant qu'il est sorti et coûte des PE à la fin. Une barre jaune s'affiche sous le visage du joueur contrôlé. Sans ce mod, il n'y a pas de PE."

[de.new]
mod_name = "Stamina Points"
mod_description = "Jeder Spieler hat für das ganze Spiel einen Ausdauerbalken (GP), wie in Chrono Stone: Laufen und vor allem Sprinten verbrauchen ihn, Physis lässt ihn länger halten, die Halbzeit gibt einen Teil zurück, und ein erschöpfter Spieler wird langsamer, kann nicht sprinten und taumelt. Die GP jeder Figur sind ihr Wert aus Inazuma Eleven GO Galaxy und wachsen mit ihrem Level. Ein Miximax hat kein Zeitlimit und kostet keine Hyperdimensions-Leiste: Er verbraucht GP schneller und endet bei 0; ein Keshin oder eine Rüstung stoppt den Verbrauch, solange er draußen ist, und kostet GP, wenn er endet. Ein gelber Balken erscheint unter dem Gesicht des gesteuerten Spielers. Ohne diese Mod gibt es keine GP."

[it.new]
mod_name = "Stamina Points"
mod_description = "Ogni giocatore ha una barra di resistenza (PE) per tutta la partita, come in Chrono Stone: correre e soprattutto scattare la consumano, il Fisico la fa durare di più, l'intervallo ne restituisce una parte e un giocatore esausto rallenta, non può scattare e barcolla. I PE di ogni personaggio sono il suo valore di Inazuma Eleven GO Galaxy e crescono con il suo livello. Un miximax non ha limite di tempo e non consuma la barra iperdimensionale: brucia PE più in fretta e finisce a 0; un keshin o un'armatura fermano il consumo finché sono fuori e costano PE quando finiscono. Una barra gialla appare sotto il volto del giocatore controllato. Senza questa mod non ci sono PE."

[pt.new]
mod_name = "Stamina Points"
mod_description = "Cada jogador tem uma barra de resistência (PE) para toda a partida, como em Chrono Stone: correr e sobretudo arrancar gastam-na, o Físico fá-la durar mais, o intervalo devolve uma parte e um jogador esgotado fica mais lento, não pode arrancar e cambaleia. Os PE de cada personagem são o seu valor de Inazuma Eleven GO Galaxy e crescem com o seu nível. Um miximax não tem limite de tempo nem gasta a barra hiperdimensional: consome PE mais depressa e termina a 0; um keshin ou uma armadura param o gasto enquanto estão fora e custam PE ao terminar. Uma barra amarela aparece sob o rosto do jogador controlado. Sem este mod não há PE."

[ja.new]
mod_name = "Stamina Points"
mod_description = "クロノ・ストーンのように、各選手は試合を通してスタミナ（GP）ゲージを持つ：走る、特にダッシュで減り、フィジカルが高いほど長持ちし、ハーフタイムで一部回復し、ばてた選手は遅くなりダッシュできずふらつく。各キャラのGPはイナズマイレブンGOギャラクシーの値で、レベルとともに伸びる。ミキシマックスは時間制限がなく、ハイパーディメンションゲージを使わない：GPを速く消費し、0で終わる。化身やアームドは出ている間は消費を止め、終わるときにGPを払う。操作中の選手の顔の下に黄色いゲージが表示される。このMODがなければGPはない。"

[zh_hans.new]
mod_name = "Stamina Points"
mod_description = "如同《时空之石》，每名球员整场比赛拥有一条体力（GP）条：奔跑尤其是冲刺会消耗它，体格越高越持久，中场休息恢复一部分，筋疲力尽的球员会变慢、无法冲刺并踉跄。每个角色的GP取自《闪电十一人GO 银河》的数值，并随等级成长。混合最大化没有时间限制且不消耗超次元槽：它更快消耗GP，归零时结束；化身或铠甲在场时停止消耗，结束时扣除GP。操控球员的头像下方显示黄色条。没有此模组时没有GP。"

[zh_hant.new]
mod_name = "Stamina Points"
mod_description = "如同《時空之石》，每名球員整場比賽擁有一條體力（GP）條：奔跑尤其是衝刺會消耗它，體格越高越持久，中場休息恢復一部分，筋疲力盡的球員會變慢、無法衝刺並踉蹌。每個角色的GP取自《閃電十一人GO 銀河》的數值，並隨等級成長。混合最大化沒有時間限制且不消耗超次元槽：它更快消耗GP，歸零時結束；化身或鎧甲在場時停止消耗，結束時扣除GP。操控球員的頭像下方顯示黃色條。沒有此模組時沒有GP。"
