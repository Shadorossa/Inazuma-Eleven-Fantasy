# Stamina Points' match PE («PE», docs/game/mechanics/match-stamina.md) as the VR-Framework's match resource
# stamina_points.pe (docs/framework/match-resource.md). The framework drains it every frame, keeps the «exhausted»
# state, slows / stops the dash of an exhausted player, gives PE back at half-time and pays the pe_sacrifice moves with
# it. The mod's own rules on top are scripts\stamina_points.lua: the transformation costs ([pe] of config.toml: the
# miximax on PE, the Chrono Stone model's PE-free keshin / armour runs and their end charge, set on each player as the
# drain multiplier `stamina_points.aura`), the trait rules' battery out, the tired locomotion ([tired_motion]).
# Other mods add their own drain multipliers (VRFW.resource.set_mult on stamina_points.pe; Inazuma Fantasy: its
# passives) and half-time bonuses (resource:stamina_points.pe:half_time). Was Inazuma Fantasy's inazuma_fantasy.pe
# until 2026-10-14 (docs/refactor/aura-mods-split.md «Stamina Points»).
# Read once at the framework's init: restart the game after a change.
schema = "VRFW.match_resource/1"

[[VRFW.MatchResource]]
name = "pe"                       # key stamina_points.pe
# max PE: per player, the table of pe_max.toml ([[VRFW.MatchResourceMax]], generated by
# research/scripts/pe_per_player_build.py; docs/game/mechanics/pe-per-player.md): every character's Inazuma Eleven GO
# Galaxy TP (else his CS / GO / IE3 / IE2 / IE TP x that game's fitted ratio to Galaxy; without any, a deterministic
# point of his position's Galaxy TP distribution, P15..P85, from a hash of the character and his Fisico), at Lv 99; it
# grows with his level (Lv 1 x0.10 .. Lv 99 x1.00, above Lv 99 toward x1.35 at Lv 200 when a mod raises the cap) and
# his drain grows with it (drain_follows_level: same exhaustion minute at every level; pe-per-player.md §6). This
# `max` is only the fallback without that table (the table's own default covers the cards it does not list). Training
# Físico does not raise it; the plates (CMND_STAMINAPOINTS_PE_MAX with the card) and the match HUD show his value.
max = 134
pe_provider = true                # the technique type's pe_sacrifice moves (Pingüino emperador nº1) pay with it
live_states = [9, 14, 15, 16]     # in play, focus battle, scramble, zone
duel_states = [14, 15]            # the exhausted speed in a duel: focus battle, scramble

# The drain follows the length of the match being played (per_match): the framework reads the match's length at play
# (2 halves x half length / clock rate, one period without the two-halves rule; extra time not counted) and drains per
# live second base x 134 / that length x (1 + what he does), x Físico, level, keeper, transformation and the mods'
# multipliers. 134 = the bar of pe_max.toml's default (the median player).
#   base: the share of the bar the base drain alone spends over the whole match (0.45 = 45 %, whatever the length:
#     a 2 x 30' match, a 2 x 45' one, a 15' 5-a-side or a short ruleset)
#   running / dash / dash_attack / transformed: x base ADDED while he does it (dash 8.5: a dashing second costs 9.5
#     base seconds), so they follow the base and the match length
# Median player (134 PE, Físico 150, level 99, 2 x 30', half-time +15 %): only the base -> about 76 % left at the end;
# dashing 10 % of the time -> about 43 %; 16 % (a heavy match) -> about 23 %. Físico 100: 70 / 32 / 9 %. Keepers x0.5.
# Before 2026-10-16 (PE per second x 383 / match length): 88 / 58 / 38 % (Físico 150).
[VRFW.MatchResource.drain]
per_match = true
base = 0.45
running = 0.7                     # unused while consume_is_dash
dash = 8.5                        # per second as before (0.45 x 9.5 = 4.28 bars per match of dashing; was 4.10)
dash_attack = 17.0                # about dash x 2.0, as before
# the match length without a match clock (2 x 30' at the clock rate 14.1) and the shortest one used (real seconds)
match_seconds_fallback = 255
match_seconds_min = 30
# the hidden DP consume state is the engine's dash state (first in-game log, 2026-09-28): a consume tick without a
# manual dash drains like a dash (CPU / AI-driven dashes)
consume_is_dash = true
# the flat transformation drain: only for the forms the transformation costs ([pe] of config.toml) do not pay themselves
# (keshin, armour and miximax pay through [pe]; the mode change drains nothing: mode-change.md §5.5)
transformed = 4.0                 # was 0.6 PE/s: 0.45 x 5.0 = 2.25 bars per match transformed
transformed_auras = ["soul", "bond"]

# Físico makes the PE drain slower: every drain is multiplied by F = max(floor, (1 - step) ^ (Físico - ref)): each Físico
# point above ref multiplies the drain by (1 - step); below it the drain grows the same way. Físico 0 x1.32, 100 x1.00,
# 136 x0.90, 190 x0.78, 250 x0.66, 350 x0.50, 500 x0.33, 1000 x0.08, 1740+ x0.01 (floor)
[VRFW.MatchResource.stat_scale]
stat = "physical"
ref = 100
step = 0.0028
floor = 0.01

[VRFW.MatchResource.scale]
keeper = 0.5                      # goalkeepers (formation position 0)
rival = 1.0                       # the CPU team
# manual tuning on top of the drain (1.0: the shares above are what a match spends; a bigger tank than 134 lasts longer)
global = 1.0

# half-time: + max x (0.15 ± 0.07), drawn per player (8 % to 22 % of the max back; never above max). Other mods add
# their bonuses on top (Inazuma Fantasy's passives «+x % de PE recuperados en el descanso»)
[VRFW.MatchResource.half_time]
share = 0.15
jitter = 0.07
halves = [2]                      # only the break before the second half (not before extra time)

# exhausted at <= 10 % of the max until back above 15 %: speed x0.4 (x0.7 in a duel), no manual dash, a running manual
# dash is ended (its record gets its fuel back once it is over; with params\pe_no_dash_gauge.toml the fuel itself never
# runs out, so PE is the only limit of a dash)
[[VRFW.MatchResource.state]]
name = "exhausted"
below = 0.10
above = 0.15
speed_mult = 0.4
speed_mult_duel = 0.7
block_dash = true
end_dash = true
