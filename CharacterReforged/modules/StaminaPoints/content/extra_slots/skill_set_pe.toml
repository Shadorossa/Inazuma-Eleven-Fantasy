# Stamina Points › its PE rules on Character Reforged's new skill set in a match (VRFW 2.4.3 [[VRFW.ExtraSlotExtend]];
# docs/framework/extra-slot.md §7.4 / §8). While the option «Tabla de habilidades» shows the new set, the base's plates
# slot character_reforged.skill_set runs the matches: RB+B on the mix slot starts the miximax. A miximax runs on PE
# (config.toml [pe] no_start_check / free_activation: the start neither needs nor spends the hyper gauge), but without
# this rule the plates asked the retail hyper gauge for its start (at least one bar). Same rule Inazuma Fantasy
# declared on its Hiper slot (start_free on its aura table's `waived`).
#
#   start_free   an aura of the table StaminaPoints.Aura with `waived` set (the [pe] no_start_check kinds: the miximax
#                and its carriers) starts at any hyper gauge
#
# The table is named without `stamina_points/`: an extension's tables are read from the extending mod (this one). The
# keshin / armour / totem pools are the mod Aura Points' rules on the same slot (start_gate_applies / start_refused).
# Without Stamina Points nothing of this applies: the miximax starts with the retail hyper gauge.
schema = "VRFW.extra_slot/1"

[[VRFW.ExtraSlotExtend]]
slot = "character_reforged.skill_set"

[VRFW.ExtraSlotExtend.rules]
start_free = [[{ table = "StaminaPoints.Aura", key = ["skill"], field = "waived", is = "set" }]]
