id = "stamina_points"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Stamina Points"
version = "1.2.0"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Every player gets a stamina bar (PE) for the whole match, as in Chrono Stone: running and above all dashing spend it, Físico makes it last longer, half-time gives some back, and an exhausted player slows down, cannot dash and staggers. Each character's PE is his Inazuma Eleven GO Galaxy TP (or the closest game's), growing with his level. A miximax has no time limit and does not spend the hyper gauge: it burns PE faster and ends at 0 PE; a keshin or an armour stops the drain while it is out and costs PE when it ends. A yellow PE bar shows under the controlled player's face, and every player's max PE in the player header (Character Reforged's header slot). Without this mod there is no PE. Works with the VR-Framework and Character Reforged; Inazuma Fantasy adds its own rules on top."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-16"
# This mod's own names (TOML keys [StaminaPoints.X], Lua StaminaPoints.X, commands CMND_STAMINAPOINTS_*, tables
# StaminaPoints.*, resource stamina_points.pe); never VRFW.
prefix = "StaminaPoints"
folder = "StaminaPoints"
# Split out of Inazuma Fantasy on 2026-10-14 (owner request: «sacar de IF el sistema de PE también, un mod igual que el
# de PEG y SP pero para el sistema de PE y la stat de PE de todos los personajes del juego vanilla»;
# docs/refactor/aura-mods-split.md «Stamina Points»). Standard mod layout (docs/framework/mod-layout.md):
#   config.toml                          [pe]: the transformation costs on the PE (miximax on PE, Chrono Stone model),
#                                        [pe.trait.*]: what a trait tag does (battery out), [tired_motion]
#   content\match_resources\pe.toml      the PE: drains, Físico, half-time, «exhausted» (resource stamina_points.pe)
#   content\match_resources\pe_max.toml  the max PE of every character (generated by research/scripts/pe_per_player_build.py)
#   content\params\pe_no_dash_gauge.toml no team dash fuel (PE is the only limit of a dash)
#   content\resource_rules\off_pitch.toml the battery out's «off the pitch without a red card» (Resource.OffPitch)
#   content\rules\field_clips\           the tired locomotion (CS clips in assets\anims\field_clips\) and the battery out's
#                                        held kneel
#   content\game\stamina_points.toml     the cost points' providers (cost check, start pay), structs, commands
#   content\extra_slots\skill_set_pe.toml the miximax start at any hyper gauge on Character Reforged's RB plates
#   content\menus\pe_bar.toml + content\images\…\btl06_13\stamina_points_bars.toml   the HUD bar's layers / sprites
#   scripts\stamina_points.lua (+ lib\)  the run time; graft research/grafts/stamina_points_hud: the HUD bar
#   content\menus\pe_plate.toml + pe_plate_header.toml + assets\lua\_all\stamina_points_plate.lua + content\images\
#                                        …\btl06_13\stamina_points_pe_num.toml   the max PE in the player header: a
#                                        piece of Character Reforged's header slot (entry «pe» of the host
#                                        character_reforged.header; was Inazuma Fantasy's pe_card until 2026-10-14)
# vr_framework 2.4.0: the match resources (per-player max table, level curve), the cost points (hook bus `order`), the
# OffPitch rule, field clips / locomotion sets, the extra slot state (VRFW.extra_slot.players / fusion_end).
# character_reforged: the shared base of the character / aura mods (owner decision 2026-10-14); its player header slot
# (1.5.0) holds the max PE.
requires = ["vr_framework>=2.4.138", "character_reforged>=1.5.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "call", "command", "hook"]

# Other mods read the PE through the framework (VRFW.resource.* on stamina_points.pe, the answers' resource()), the
# tables below in their native answers, the commands CMND_STAMINAPOINTS_GP / _PE_MAX (aliases CMND_EVT_GP /
# CMND_EVT_PE_MAX) from their game Lua, add their drain factors (VRFW.resource.set_mult) and half-time bonuses
# (resource:stamina_points.pe:half_time), and give their inputs as rule flags (stamina_points.cost_pct.<hdl> /
# armour_free.<hdl>: scripts\stamina_points.lua). Resource.OffPitch: the battery-out players for the framework's
# OffPitch rule.
[exports]
functions = []
keys = []
tables = ["StaminaPoints.Aura", "StaminaPoints.Player", "StaminaPoints.Team", "Resource.OffPitch"]
# the HUD graft keeps the EVT_PE_* globals of Inazuma Fantasy's stamina_hud (Aura Points' bar sits under it by them)
# game_lua: StaminaPoints.PlatePe / StaminaPoints.Plate = the header piece (assets\lua\_all\stamina_points_plate.lua)
game_lua = ["StaminaPoints.Plate", "StaminaPoints.PlatePe"]

# A MODULE of Character Reforged (owner request 2026-10-14, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 50
