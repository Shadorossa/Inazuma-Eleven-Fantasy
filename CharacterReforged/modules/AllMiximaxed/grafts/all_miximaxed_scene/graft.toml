# All Miximaxed: the menus' part of the MIXIMAX creation scene (docs/game/media/miximax-cutscene-cs.md §8-§9),
# copied from Inazuma Fantasy's grafts mx_scene / mx_scene_bars / mx_scene_model on 2026-10-14. Character Reforged's
# skill table plays the scene (graft ss2_menus PL.MxScenePlay) and calls these functions in the other menus through
# the retail cross-menu call. HOOK files, shipped as is; each one steps aside when Inazuma Fantasy's own copy is in
# the same menu (one owner).
name = "all_miximaxed_scene"
mod = "all_miximaxed"
order = 975
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "All Miximaxed: the miximax creation scene's menu parts (A skips it, header bars hidden, the partner's model kept loaded)"

# A skips the scene while it plays
[[hooks]]
stem = "event_menu"
src = "scene_skip_hooks.lua"

# the header, rank and guide lines hidden during the scene (EVT_MxSceneBars, called by the skill table)
[[hooks]]
stem = "team_dock_common_top_menu"
src = "scene_bars_hooks.lua"

[[hooks]]
stem = "soccer_top_menu"
src = "scene_bars_hooks.lua"

# the partner's 3D model kept loaded in the one-model view menu (EVT_MxSceneModel*, called by the skill table)
[[hooks]]
stem = "chara_model_only_view_menu"
src = "scene_model_hooks.lua"
