schema = "VRFW.technique/3"
# All Miximaxed › the two miximax carriers (docs/game/mods/all-miximaxed.md §1; docs/game/miximax/miximax-chrono-stone.md
# §12.5). Moved from Inazuma Fantasy's techniques/auras/auras.toml and techniques/texts/texts.toml on 2026-10-14: the
# same keys, ids (crc32 of the key) and text ids, so saves keep their items.
# "none": a text written in some languages replaces only those (no default-language fallback)
default_lang = "none"

# «Crear miximax»: a clone of the retail «Miximax Trans» row wmm00220 with no owner list (any player may equip it),
# listed first among the miximax items; only a list entry (the skill board's aura list while it asks for it), never
# fired: the creation flow replaces it by the carrier.
[[aura_command]]
key = "wmm_evt_create"
from = "wmm00220"
cells = { name_text = 0x38C33D9C, desc_text = 0x6D55EFCE, order = 1 }
charas = []

# The carrier of every created miximax: a clone of the retail Mix-Max row wmm00210 (its HDP cost, time, buffs and the
# «Miximax Trans» cut-in ev82_00010) whose variant card is the carrier character's (characters/carrier.toml,
# 0x8493F412: only used without a fusion; with one, the framework builds the base himself in the partner's colours).
# Hidden in the ability lists (each board slot gets its own copy).
[[aura_command]]
key = "wmm_evt"
from = "wmm00210"
cells = { name_text = 0x7B918955, desc_text = 0x2E075B07, chara_param = 0x8493F412, order = 0x0001869F }
charas = []

# their names and descriptions (skill_text). The descriptions say what the miximax gives on its own (the partner's
# colours, as a retail Mix-Max); a game mode with more miximax rules may edit them.

[[text]]
id = 0x2E075B07
kind = "text"
add = true
ja = "選んだパートナーとのミキシマックス。\n発動中：パートナーの髪・肌・瞳の色、\n選んだ必殺技とミキシマックスの強化。"
en = "Miximax with the chosen partner.\nWhile active: his hair, skin and eye colours,\nthe chosen special move and the Mix-Max boosts."
es = "Miximax con el compañero elegido.\nMientras dura: su pelo, su piel y sus ojos,\nla supertécnica elegida y las mejoras del Mix-Max."
fr = "Miximax avec le partenaire choisi.\nPendant l'effet : ses cheveux, sa peau et ses yeux,\nla supertechnique choisie et les bonus du Mix-Max."
de = "Miximax mit dem gewählten Partner.\nSolange aktiv: seine Haar-, Haut- und Augenfarbe,\ndie gewählte Spezialtechnik und die Mix-Max-Boni."
it = "Miximax con il compagno scelto.\nMentre è attivo: capelli, pelle e occhi del compagno,\nla tecnica speciale scelta e i bonus del Mix-Max."
pt = "Miximax com o parceiro escolhido.\nEnquanto dura: o cabelo, a pele e os olhos dele,\na supertécnica escolhida e os bónus do Mix-Max."
zh_hans = "与所选搭档进行混合最大化。\n发动期间：搭档的发色、肤色和瞳色，\n所选的必杀技和混合最大化的加成。"
zh_hant = "與所選搭檔進行混合最大化。\n發動期間：搭檔的髮色、膚色和瞳色，\n所選的必殺技和混合最大化的加成。"

[[text]]
id = 0x38C33D9C
kind = "noun"
add = true
ja = "ミキシマックスを作る"
en = "Create Miximax"
es = "Crear miximax"
fr = "Créer un miximax"
de = "Miximax erstellen"
it = "Crea miximax"
pt = "Criar miximax"
zh_hans = "创建混合最大化"
zh_hant = "建立混合最大化"

[[text]]
id = 0x6D55EFCE
kind = "text"
add = true
ja = "自分の選手からパートナーと、その必殺技を\nひとつ選んでこの選手とミキシマックス：本人のまま、\nパートナーの髪・肌・瞳の色になります。"
en = "Pick a partner from your players and one of his\nspecial moves: this player fuses with him, keeps\nhimself and takes the partner's colours."
es = "Elige un compañero entre tus jugadores y una de\nsus supertécnicas: este jugador se fusiona con él,\nsigue siendo él mismo y toma sus colores."
fr = "Choisissez un partenaire parmi vos joueurs et une\nde ses supertechniques : ce joueur fusionne avec lui,\nreste lui-même et prend ses couleurs."
de = "Wähle einen Partner aus deinen Spielern und eine\nseiner Spezialtechniken: Dieser Spieler verschmilzt mit\nihm, bleibt er selbst und nimmt seine Farben an."
it = "Scegli un compagno tra i tuoi giocatori e una delle\nsue tecniche speciali: questo giocatore si fonde con\nlui, resta se stesso e ne prende i colori."
pt = "Escolhe um parceiro entre os teus jogadores e uma\ndas suas supertécnicas: este jogador funde-se com ele,\ncontinua a ser ele mesmo e fica com as suas cores."
zh_hans = "从你的球员中选择搭档和他的一个必杀技：\n该球员与他混合最大化，仍是他自己，\n换上搭档的颜色。"
zh_hant = "從你的球員中選擇搭檔和他的一個必殺技：\n該球員與他混合最大化，仍是他自己，\n換上搭檔的顏色。"

