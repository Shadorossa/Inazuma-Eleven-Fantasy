# All Miximaxed › its miximax on Character Reforged's new skill set in a match (VRFW 2.4.3 [[VRFW.ExtraSlotExtend]];
# docs/refactor/aura-mods-split.md «The 6 + 2 set over the retail data»). While the option «Tabla de habilidades»
# shows the new set, the base's plates slot character_reforged.skill_set runs the matches: a player whose mix slot
# holds the carrier wmm_evt (his stored fusion, the framework's miximax store) gets it on RB+B (the mix slot), then the
# partner's move. With «Victory Road» nothing changes: the carrier fires from the team's aura row as before.
schema = "VRFW.extra_slot/1"

[[VRFW.ExtraSlotExtend]]
slot = "character_reforged.skill_set"

[VRFW.ExtraSlotExtend.fusion]
carrier = "wmm_evt"
carrier_text = "Miximax Trans"       # the skill telop's name of the carrier (never the template's partner name)
moves = 1                            # the partner's move on the mix plate once the miximax runs
