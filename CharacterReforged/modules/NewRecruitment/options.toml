schema = "VRFW.option/2"
# New Recruitment › where new players are signed (owner request 2026-10-23), on the Mods screen's «Ajustes» of the mod
# and in Opciones › «Opciones de mods» (format: docs/app/mod-options.md §3). Value file:
# <data dir>\mod_options\new_recruitment.json. Read live by assets\lua\_all\new_recruitment_album.lua
# (NewRecruitment.RecruitSource / RecruitFrom): «Pachangas» = the pachanga zones of the Chronicle board ask to join
# (assets\lua\vs_route_town_menu\new_recruitment_pachangas.lua), «Álbum» = A on a player the club does not have in
# BetterQoL's «Álbum de jugadores» signs him after a Sí / No question (the pachangas still play, nobody joins after
# them), «Ambos» = both. Without BetterQoL the album choice has no screen to work in.

[[option]]
id = "recruit_source"                          # row key new_recruitment.recruit_source
type = "list"
label = "option_recruit_source"                # text\keys.toml, 9 languages
help = "option_recruit_source_help"
values = [
    { value = 0, name = "recruit_pachangas", text = "Pick-up matches" },
    { value = 1, name = "recruit_album", text = "Player album" },
    { value = 2, name = "recruit_both", text = "Both" },
]
default = 0                                    # the behaviour before the option: pachangas
order = 100
