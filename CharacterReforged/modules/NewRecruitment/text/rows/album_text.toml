# New Recruitment › signing a player from BetterQoL's «Álbum de jugadores» (option «Fichajes» = «Álbum»;
# assets\lua\_all\new_recruitment_album.lua). Rows of menu_text, read by id = crc32(row id); «%s» = the player's name.
# The price rule: config.toml [album].
# After a signing the pachangas' line new_recruitment_pachangas_join_done («¡%s se ha unido a tu equipo!») is shown.
schema = "VRFW.text/2"
table = "menu_text"

# the album's button guide entry on A
[[row]]
id = "new_recruitment_album_guide"
es = "Fichar"
en = "Recruit"
fr = "Recruter"
de = "Verpflichten"
it = "Ingaggia"
pt = "Contratar"
ja = "スカウト"
zh_hans = "招募"
zh_hant = "招募"

# «%s» = the player's name, then «%d» = the price, «%d» = the points the player has (always in this order)
[[row]]
id = "new_recruitment_album_ask_price"
es = "¿Quieres fichar a %s por %d puntos de amistad? (tienes %d)"
en = "Do you want to recruit %s for %d Friendship Points? (you have %d)"
fr = "Veux-tu recruter %s pour %d points d'amitié ? (tu en as %d)"
de = "Möchtest du %s für %d Freundschaftspunkte verpflichten? (du hast %d)"
it = "Vuoi ingaggiare %s per %d punti amicizia? (ne hai %d)"
pt = "Queres contratar %s por %d pontos de amizade? (tens %d)"
ja = "%sを友情ポイント%dでスカウトしますか？（所持：%d）"
zh_hans = "要招募%s吗？需要%d友情点数（你有%d）"
zh_hant = "要招募%s嗎？需要%d友情點數（你有%d）"

[[row]]
id = "new_recruitment_album_not_enough"
es = "No tienes puntos de amistad suficientes para fichar a %s: cuesta %d y tienes %d."
en = "You do not have enough Friendship Points to recruit %s: it costs %d and you have %d."
fr = "Tu n'as pas assez de points d'amitié pour recruter %s : il coûte %d et tu en as %d."
de = "Du hast nicht genug Freundschaftspunkte, um %s zu verpflichten: Er kostet %d, du hast %d."
it = "Non hai abbastanza punti amicizia per ingaggiare %s: costa %d e ne hai %d."
pt = "Não tens pontos de amizade suficientes para contratar %s: custa %d e tens %d."
ja = "%sをスカウトするには友情ポイントが足りません：必要%d、所持%d。"
zh_hans = "友情点数不足，无法招募%s：需要%d，你有%d。"
zh_hant = "友情點數不足，無法招募%s：需要%d，你有%d。"

[[row]]
id = "new_recruitment_album_owned"
es = "%s ya está en tu club."
en = "%s is already in your club."
fr = "%s est déjà dans ton club."
de = "%s ist schon in deinem Verein."
it = "%s è già nel tuo club."
pt = "%s já está no teu clube."
ja = "%sはすでにクラブにいます。"
zh_hans = "%s已经在你的俱乐部了。"
zh_hant = "%s已經在你的俱樂部了。"

[[row]]
id = "new_recruitment_album_full"
es = "No hay sitio en el banco para %s."
en = "There is no room in the bank for %s."
fr = "Il n'y a plus de place dans la banque pour %s."
de = "In der Bank ist kein Platz für %s."
it = "Non c'è posto nella banca per %s."
pt = "Não há lugar no banco para %s."
ja = "バンクに%sを入れる空きがありません。"
zh_hans = "仓库没有空位容纳%s。"
zh_hant = "倉庫沒有空位容納%s。"

[[row]]
id = "new_recruitment_album_failed"
es = "No se ha podido fichar a %s."
en = "%s could not be recruited."
fr = "Impossible de recruter %s."
de = "%s konnte nicht verpflichtet werden."
it = "Non è stato possibile ingaggiare %s."
pt = "Não foi possível contratar %s."
ja = "%sをスカウトできませんでした。"
zh_hans = "无法招募%s。"
zh_hant = "無法招募%s。"
