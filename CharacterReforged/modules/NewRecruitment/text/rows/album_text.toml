# New Recruitment › signing a player from BetterQoL's «Álbum de jugadores» (option «Fichajes» = «Álbum» or «Ambos»;
# assets\lua\_all\new_recruitment_album.lua). Rows of menu_text, read by id = crc32(row id); «%s» = the player's name.
# After a signing the pachangas' line new_recruitment_pachangas_join_done («¡%s se ha unido a tu equipo!») is shown.
schema = "VRFW.text/2"
table = "menu_text"

# the album's button guide entry on A
[[row]]
id = "new_recruitment_album_guide"
es = "Fichar"
en = "Recruit"
fr = "Recruter"
de = "Verpflichten"
it = "Ingaggia"
pt = "Contratar"
ja = "スカウト"
zh_hans = "招募"
zh_hant = "招募"

[[row]]
id = "new_recruitment_album_ask"
es = "¿Quieres fichar a %s?"
en = "Do you want to recruit %s?"
fr = "Veux-tu recruter %s ?"
de = "Möchtest du %s verpflichten?"
it = "Vuoi ingaggiare %s?"
pt = "Queres contratar %s?"
ja = "%sをスカウトしますか？"
zh_hans = "要招募%s吗？"
zh_hant = "要招募%s嗎？"

[[row]]
id = "new_recruitment_album_owned"
