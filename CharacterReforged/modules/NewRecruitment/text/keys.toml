schema = "VRFW.text_key/1"
# Texts of «New Recruitment» (mod new_recruitment, 2026-10-15) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "New Recruitment"
mod_description = "One card per character, as in the classic Inazuma Eleven games. Matches no longer drop players: you get them from other sources, such as the Recruitment Office in the Market, which sells the players of every team you have beaten. No spirit screen and no spirit notices. A save keeps one card per character: the best copy stays and the others are merged into it."

[es.new]
mod_name = "New Recruitment"
mod_description = "Una carta por personaje, como en los Inazuma Eleven clásicos. Los partidos ya no sueltan jugadores: se consiguen por otras vías, como la Oficina de fichajes del Mercado, que vende a los jugadores de cada equipo que hayas vencido. Sin pantalla de espíritus ni avisos de espíritus. Una partida conserva una carta por personaje: se queda la mejor copia y las demás se funden en ella."

[fr.new]
mod_name = "New Recruitment"
mod_description = "Une carte par personnage, comme dans les Inazuma Eleven classiques. Les matchs ne donnent plus de joueurs : ils s'obtiennent autrement, par exemple au Bureau des recrues du Marché, qui vend les joueurs de chaque équipe que tu as battue. Plus d'écran des esprits ni d'alertes d'esprits. Une partie garde une carte par personnage : la meilleure copie reste et les autres y sont fusionnées."

[de.new]
mod_name = "New Recruitment"
mod_description = "Eine Karte pro Figur, wie in den klassischen Inazuma-Eleven-Spielen. Spiele lassen keine Spieler mehr fallen: Du bekommst sie auf anderen Wegen, etwa im Transferbüro des Markts, das die Spieler jedes besiegten Teams verkauft. Kein Geister-Bildschirm und keine Geister-Hinweise. Ein Spielstand behält eine Karte pro Figur: Die beste Kopie bleibt, die anderen werden mit ihr verschmolzen."

[it.new]
mod_name = "New Recruitment"
mod_description = "Una carta per personaggio, come negli Inazuma Eleven classici. Le partite non danno più giocatori: si ottengono in altri modi, come l'Ufficio ingaggi del Mercato, che vende i giocatori di ogni squadra che hai battuto. Niente schermata degli spiriti né avvisi degli spiriti. Un salvataggio tiene una carta per personaggio: resta la copia migliore e le altre vi vengono fuse."

[pt.new]
mod_name = "New Recruitment"
mod_description = "Uma carta por personagem, como nos Inazuma Eleven clássicos. Os jogos já não dão jogadores: obtêm-se por outras vias, como o Gabinete de contratações do Mercado, que vende os jogadores de cada equipa que venceste. Sem ecrã de espíritos nem avisos de espíritos. Um jogo fica com uma carta por personagem: a melhor cópia fica e as outras fundem-se nela."

[ja.new]
mod_name = "New Recruitment"
mod_description = "昔のイナズマイレブンのように、キャラクター1人につきカード1枚。試合で選手はドロップしなくなる。選手はほかの方法で手に入れる（マーケットのスカウトオフィスでは、勝利したチームの選手を獲得できる）。スピリット画面とスピリットのお知らせはなし。セーブはキャラクター1人につきカード1枚（一番良いカードを残し、ほかはそこに統合）。"

[zh_hans.new]
mod_name = "New Recruitment"
mod_description = "像经典的闪电十一人一样，每个角色只有一张卡。比赛不再掉落球员，球员需通过其他途径获得，例如市场里的球员签约处：可签下你击败过的每支队伍的球员。没有灵魂画面和灵魂提示。存档中每个角色只保留一张卡：保留最好的一张，其余合并到它身上。"

[zh_hant.new]
mod_name = "New Recruitment"
mod_description = "像經典的閃電十一人一樣，每個角色只有一張卡。比賽不再掉落球員，球員需透過其他途徑獲得，例如市場裡的球員簽約處：可簽下你擊敗過的每支隊伍的球員。沒有靈魂畫面和靈魂提示。存檔中每個角色只保留一張卡：保留最好的一張，其餘合併到它身上。"
