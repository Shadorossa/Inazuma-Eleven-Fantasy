schema = "VRFW.text_key/1"
# Texts of «New Recruitment» (mod new_recruitment, 2026-10-15) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description, and the option row of options.toml. A language missing here falls back to
# English.
default_lang = "en"

[en.new]
mod_name = "Classic Recruitment"
mod_description = "One card per character, as in the classic Inazuma Eleven games. Matches no longer drop players: you get them from other sources, such as the Recruitment Office in the Market, which sells the players of every team you have beaten. No spirit screen and no spirit notices. A save keeps one card per character: the best copy stays and the others are merged into it. An option chooses how you sign players: the pick-up matches and the Recruitment Office, or the Clubroom's Player album (A on a player you do not have; the pick-up matches and the office are then gone)."
option_recruit_source = "How to sign new players"
option_recruit_source_help = "Pick-up matches + Office: the pick-up matches of the Chronicle board and the Recruitment Office in the Market. Album: A on a player you do not have in the Clubroom's Player album signs him to the bank; the pick-up matches and the office are gone."
recruit_pachangas_office = "Pick-up matches + Office"
recruit_album = "Album"

[es.new]
mod_name = "Classic Recruitment"
mod_description = "Una carta por personaje, como en los Inazuma Eleven clásicos. Los partidos ya no sueltan jugadores: se consiguen por otras vías, como la Oficina de fichajes del Mercado, que vende a los jugadores de cada equipo que hayas vencido. Sin pantalla de espíritus ni avisos de espíritus. Una partida conserva una carta por personaje: se queda la mejor copia y las demás se funden en ella. Una opción elige cómo fichas: las pachangas y la Oficina de fichajes, o el Álbum de jugadores de la Caseta (A sobre un jugador que no tienes; entonces no hay pachangas ni oficina)."
option_recruit_source = "Cómo fichar jugadores nuevos"
option_recruit_source_help = "Pachangas + Oficina: las pachangas del tablero de la Crónica y la Oficina de fichajes del Mercado. Álbum: A sobre un jugador que no tienes en el Álbum de jugadores de la Caseta lo ficha al banco; no hay pachangas ni oficina."
recruit_pachangas_office = "Pachangas + Oficina"
recruit_album = "Álbum"

[fr.new]
mod_name = "Classic Recruitment"
mod_description = "Une carte par personnage, comme dans les Inazuma Eleven classiques. Les matchs ne donnent plus de joueurs : ils s'obtiennent autrement, par exemple au Bureau des recrues du Marché, qui vend les joueurs de chaque équipe que tu as battue. Plus d'écran des esprits ni d'alertes d'esprits. Une partie garde une carte par personnage : la meilleure copie reste et les autres y sont fusionnées. Une option choisit comment recruter : les matchs amicaux et le Bureau des recrues, ou l'Album des joueurs de la Salle du club (A sur un joueur que tu n'as pas ; plus de matchs amicaux ni de bureau)."
option_recruit_source = "Recrutement"
option_recruit_source_help = "Matchs amicaux + Bureau : les matchs amicaux du tableau de la Chronique et le Bureau des recrues du Marché. Album : A sur un joueur que tu n'as pas dans l'Album des joueurs de la Salle du club le recrute dans la réserve ; plus de matchs amicaux ni de bureau."
recruit_pachangas_office = "Matchs amicaux + Bureau"
recruit_album = "Album"

[de.new]
mod_name = "Classic Recruitment"
mod_description = "Eine Karte pro Figur, wie in den klassischen Inazuma-Eleven-Spielen. Spiele lassen keine Spieler mehr fallen: Du bekommst sie auf anderen Wegen, etwa im Transferbüro des Markts, das die Spieler jedes besiegten Teams verkauft. Kein Geister-Bildschirm und keine Geister-Hinweise. Ein Spielstand behält eine Karte pro Figur: Die beste Kopie bleibt, die anderen werden mit ihr verschmolzen. Eine Option legt fest, wie du Spieler verpflichtest: die Freundschaftsspiele und das Transferbüro, oder das Spieleralbum im Clubraum (A auf einem Spieler, den du nicht hast; dann keine Freundschaftsspiele und kein Büro)."
option_recruit_source = "Verpflichtungen"
option_recruit_source_help = "Freundschaftsspiele + Büro: die Freundschaftsspiele auf dem Brett der Chronik und das Transferbüro im Markt. Album: A auf einem Spieler, den du nicht hast, im Spieleralbum des Clubraums verpflichtet ihn in die Reserve; keine Freundschaftsspiele und kein Büro."
recruit_pachangas_office = "Freundschaftsspiele + Büro"
recruit_album = "Album"

[it.new]
mod_name = "Classic Recruitment"
mod_description = "Una carta per personaggio, come negli Inazuma Eleven classici. Le partite non danno più giocatori: si ottengono in altri modi, come l'Ufficio ingaggi del Mercato, che vende i giocatori di ogni squadra che hai battuto. Niente schermata degli spiriti né avvisi degli spiriti. Un salvataggio tiene una carta per personaggio: resta la copia migliore e le altre vi vengono fuse. Un'opzione sceglie come ingaggi: le partitelle e l'Ufficio ingaggi, oppure l'Album dei giocatori della Sala del club (A su un giocatore che non hai; allora niente partitelle né ufficio)."
option_recruit_source = "Ingaggi"
option_recruit_source_help = "Partitelle + Ufficio: le partitelle del tabellone della Cronaca e l'Ufficio ingaggi del Mercato. Album: A su un giocatore che non hai nell'Album dei giocatori della Sala del club lo ingaggia nella riserva; niente partitelle né ufficio."
recruit_pachangas_office = "Partitelle + Ufficio"
recruit_album = "Album"

[pt.new]
mod_name = "Classic Recruitment"
mod_description = "Uma carta por personagem, como nos Inazuma Eleven clássicos. Os jogos já não dão jogadores: obtêm-se por outras vias, como o Gabinete de contratações do Mercado, que vende os jogadores de cada equipa que venceste. Sem ecrã de espíritos nem avisos de espíritos. Um jogo fica com uma carta por personagem: a melhor cópia fica e as outras fundem-se nela. Uma opção escolhe como contratas: as peladinhas e o Gabinete de contratações, ou o Álbum de jogadores da Sala do clube (A num jogador que não tens; então sem peladinhas nem gabinete)."
option_recruit_source = "Contratações"
option_recruit_source_help = "Peladinhas + Gabinete: as peladinhas do tabuleiro da Crónica e o Gabinete de contratações do Mercado. Álbum: A num jogador que não tens no Álbum de jogadores da Sala do clube contrata-o para a reserva; sem peladinhas nem gabinete."
recruit_pachangas_office = "Peladinhas + Gabinete"
recruit_album = "Álbum"

[ja.new]
mod_name = "Classic Recruitment"
mod_description = "昔のイナズマイレブンのように、キャラクター1人につきカード1枚。試合で選手はドロップしなくなる。選手はほかの方法で手に入れる（マーケットのスカウトオフィスでは、勝利したチームの選手を獲得できる）。スピリット画面とスピリットのお知らせはなし。セーブはキャラクター1人につきカード1枚（一番良いカードを残し、ほかはそこに統合）。設定で選手の獲得方法を選べます：ミニバトルとスカウトオフィス、またはクラブルームの選手アルバム（持っていない選手でA。その場合ミニバトルとオフィスはなし）。"
option_recruit_source = "スカウト"
option_recruit_source_help = "ミニバトル＋オフィス：クロニクルの盤面のミニバトルとマーケットのスカウトオフィス。アルバム：クラブルームの選手アルバムで持っていない選手にAで控えに獲得；ミニバトルとオフィスはなくなる。"
recruit_pachangas_office = "ミニバトル＋オフィス"
recruit_album = "アルバム"

[zh_hans.new]
mod_name = "Classic Recruitment"
mod_description = "像经典的闪电十一人一样，每个角色只有一张卡。比赛不再掉落球员，球员需通过其他途径获得，例如市场里的球员签约处：可签下你击败过的每支队伍的球员。没有灵魂画面和灵魂提示。存档中每个角色只保留一张卡：保留最好的一张，其余合并到它身上。可在选项中选择招募方式：街头对战和球员签约处，或俱乐部室的球员图鉴（对未拥有的球员按A；此时没有街头对战和签约处）。"
option_recruit_source = "招募"
option_recruit_source_help = "街头对战＋签约处：编年史棋盘上的街头对战和市场里的球员签约处。球员图鉴：在俱乐部室的球员图鉴中对未拥有的球员按A，将其签入替补；没有街头对战和签约处。"
recruit_pachangas_office = "街头对战＋签约处"
recruit_album = "球员图鉴"

[zh_hant.new]
mod_name = "Classic Recruitment"
mod_description = "像經典的閃電十一人一樣，每個角色只有一張卡。比賽不再掉落球員，球員需透過其他途徑獲得，例如市場裡的球員簽約處：可簽下你擊敗過的每支隊伍的球員。沒有靈魂畫面和靈魂提示。存檔中每個角色只保留一張卡：保留最好的一張，其餘合併到它身上。可在選項中選擇招募方式：街頭對戰和球員簽約處，或俱樂部室的球員圖鑑（對未擁有的球員按A；此時沒有街頭對戰和簽約處）。"
option_recruit_source = "招募"
option_recruit_source_help = "街頭對戰＋簽約處：編年史棋盤上的街頭對戰和市場裡的球員簽約處。球員圖鑑：在俱樂部室的球員圖鑑中對未擁有的球員按A，將其簽入替補；沒有街頭對戰和簽約處。"
recruit_pachangas_office = "街頭對戰＋簽約處"
recruit_album = "球員圖鑑"
