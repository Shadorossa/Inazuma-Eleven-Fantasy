schema = "VRFW.text_key/1"
# Texts of «New Recruitment» (mod new_recruitment, 2026-10-15) (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "New Recruitment"
mod_description = "One card per character, as in the classic Inazuma Eleven games. A spirit drop is the player himself, recruited straight into your club; a player you already have no longer drops. No spirit screen and no spirit notices. A save keeps one card per character: the best copy stays and the others are merged into it."

[es.new]
mod_name = "New Recruitment"
mod_description = "Una carta por personaje, como en los Inazuma Eleven clásicos. Un espíritu que cae es el propio jugador, que se ficha directamente en tu club; un jugador que ya tienes deja de caer. Sin pantalla de espíritus ni avisos de espíritus. Una partida conserva una carta por personaje: se queda la mejor copia y las demás se funden en ella."

[fr.new]
mod_name = "New Recruitment"
mod_description = "Une carte par personnage, comme dans les Inazuma Eleven classiques. Un esprit obtenu est le joueur lui-même, recruté directement dans votre club ; un joueur que vous avez déjà ne tombe plus. Plus d'écran des esprits ni d'alertes d'esprits. Une partie garde une carte par personnage : la meilleure copie reste et les autres y sont fusionnées."

[de.new]
mod_name = "New Recruitment"
mod_description = "Eine Karte pro Figur, wie in den klassischen Inazuma-Eleven-Spielen. Ein erbeuteter Geist ist der Spieler selbst und kommt direkt in deinen Verein; ein Spieler, den du schon hast, wird nicht mehr erbeutet. Kein Geister-Bildschirm und keine Geister-Hinweise. Ein Spielstand behält eine Karte pro Figur: Die beste Kopie bleibt, die anderen werden mit ihr verschmolzen."

[it.new]
mod_name = "New Recruitment"
mod_description = "Una carta per personaggio, come negli Inazuma Eleven classici. Uno spirito ottenuto è il giocatore stesso, reclutato direttamente nel tuo club; un giocatore che hai già non viene più trovato. Niente schermata degli spiriti né avvisi degli spiriti. Un salvataggio tiene una carta per personaggio: resta la copia migliore e le altre vi vengono fuse."

[pt.new]
mod_name = "New Recruitment"
mod_description = "Uma carta por personagem, como nos Inazuma Eleven clássicos. Um espírito obtido é o próprio jogador, contratado diretamente para o teu clube; um jogador que já tens deixa de aparecer. Sem ecrã de espíritos nem avisos de espíritos. Um jogo fica com uma carta por personagem: a melhor cópia fica e as outras fundem-se nela."

[ja.new]
mod_name = "New Recruitment"
mod_description = "昔のイナズマイレブンのように、キャラクター1人につきカード1枚。手に入れたスピリットはその選手本人で、そのままクラブに加入する。すでにいる選手はもうドロップしない。スピリット画面とスピリットのお知らせはなし。セーブはキャラクター1人につきカード1枚（一番良いカードを残し、ほかはそこに統合）。"

[zh_hans.new]
mod_name = "New Recruitment"
mod_description = "像经典的闪电十一人一样，每个角色只有一张卡。掉落的灵魂就是球员本人，直接加入你的俱乐部；已拥有的球员不会再掉落。没有灵魂画面和灵魂提示。存档中每个角色只保留一张卡：保留最好的一张，其余合并到它身上。"

[zh_hant.new]
mod_name = "New Recruitment"
mod_description = "像經典的閃電十一人一樣，每個角色只有一張卡。掉落的靈魂就是球員本人，直接加入你的俱樂部；已擁有的球員不會再掉落。沒有靈魂畫面和靈魂提示。存檔中每個角色只保留一張卡：保留最好的一張，其餘合併到它身上。"
