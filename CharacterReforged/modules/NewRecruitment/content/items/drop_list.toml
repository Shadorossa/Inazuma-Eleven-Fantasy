schema = "VRFW.item/2"
# New Recruitment: no player drops in matches (owner requests 2026-10-14: «una vez tengas a un jugador, que ya no salga en
# esas listas»; 2026-10-15: «quita que te puedan droppear jugadores en partido y quita lo del grupo C»). With this mod a
# player is one card; players come from other sources (scouting, shops, rewards), not from match drops.
# The mechanism is the VR-Framework's (item type [VRFW.DropList.Spirits], item_engine drop_list_rt; docs/framework/
# drops.md §5b): this mod only declares the rule.
# * ExcludeAll: no character is a spirit candidate of a match's spirit drop (the drop roll's own candidate check refuses
#   every one): a spirit drop gives nothing, its chance is lost (no re-roll, nothing moved to the items), and the
#   player rows leave «Tasa de aparición».
# * Rarities 0-7: every spirit drop rarity (0-4 the normal cards, 5-7 the Ídolo variants).
# * ExceptReservedSlots: a mode's own save (INAROGUE's) keeps the game's spirits, as it keeps its rarities
#   (the same rule as NewRecruitment.Applies, assets\lua\_all\new_recruitment_spirits.lua).
# * HideTabs 1-4: the player groups of «Tasa de aparición» (Grupo A-D) are never shown: only the items tab is left, so
#   the list has no tab switcher (graft vrfw_drop_list).
[VRFW.DropList]
HideTabs = [1, 2, 3, 4]

[VRFW.DropList.Spirits]
ExcludeAll = true
Rarities = [0, 1, 2, 3, 4, 5, 6, 7]
ExceptReservedSlots = true
