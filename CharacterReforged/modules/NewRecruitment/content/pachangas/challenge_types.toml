schema = "NewRecruitment.pachangas/1"
# New Recruitment › the mini-challenge types of the pachangas' players (owner's pick 2026-10-22,
# docs/game/mods/new-recruitment-pachangas.md §8). A rival player of a pachanga joins the club when the match ends and
# HIS challenge was met. `check` = the evaluator of scripts\pachangas.lua (fed by the VRFW match events: goal,
# shot_start, chain_window_*, duel_won / duel_lost / block_won, keeper_save / keeper_beaten, possession, move_power,
# match_end); `params` = its numbers; `text` = the menu_text row (text\rows\pachanga_text.toml) with {n}, {s}, {element}
# filled from `params`; `ready = false` = not observable yet (never assigned). The assignment of a type to each player is
# generated (research/data/pachangas/challenge_rules.toml).

[[NewRecruitment.PachangaChallenge]]
name = "score_1"
number = 1
check = "goals"
params = { n = 1 }
text = "new_recruitment_challenge_goals"

