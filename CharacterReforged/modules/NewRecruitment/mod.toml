id = "new_recruitment"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "New Recruitment"
version = "1.1.7"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "One copy per character, as in the classic Inazuma Eleven games: a save duplicated into another slot, or a save when it is loaded, keeps one card per character (the best copy; the others are merged into it and give back element spirits; a backup of the save is kept before its first change). No player spirits from anywhere: no spirit drops in any match, none from rewards, gifts, boxes, events or a retired player, and the drop-rate list shows only its items tab (players come from scouting and the other recruit paths); the spirit screen and its «!» notices are gone; a save duplicated into another slot loses its player spirits (the original save keeps them) and Options › «Ajustar save» can remove the duplicate players of the current save (never a card the club cannot release, which is always the copy kept). The Chronicle gacha «Universo del jugador» is covered (its menu row, hidden with no gap left under BetterUI, its hub map point removed (no marker, no zone) the Tab shortcut of the Chronicle board and any way in doing nothing). The Chronicle board's «Quitar aparición de ÍDOLOS ya obtenidos» toggle is gone (its guide entry and its key). The recruitment office («Oficina de fichajes», the Mercado bar of «El atrio de los indomables»): every team you have beaten has a page in it, and its players are signed for «fichas» (the element spirits of their element) at the old office's prices and levels (its requirements, players at a level, items, trial matches, are kept but off: config.toml [office] requirements; the trials stay playable), shown as the team's lineup on a pitch; a signed player can be released («Dimitir», fichas back), one page per character, built from the game's own teams and matches. The team planner counts any owned copy of a character. A mode's own save (INAROGUE) keeps the game's rules. Works with the VR-Framework and Character Reforged; with No More Rarities a recruited player is its 5★ card."
priority = 0
tags = ["Gameplay", "Characters"]
updated = "2026-10-21"
# This mod's own names (TOML keys [NewRecruitment.X], Lua NewRecruitment.X); never VRFW.
prefix = "NewRecruitment"
folder = "NewRecruitment"
# Split out of No More Rarities on 2026-10-15 (owner request: «Para el mod de No More Rarities aparta el tema del límite
# de personajes de 1 a un mod nuevo de "NewRecruitment" que sea también módulo de Character Reforged»; docs/game/mods/
# new-recruitment.md). No More Rarities keeps the rarity removal; this module the one-copy-per-character limit and the
# spirit-free recruitment. Each works alone; with both on, the behaviour is No More Rarities 1.0.13's. Standard mod
# layout (docs/framework/mod-layout.md):
#   content\duplicate_rules\new_recruitment.toml   [CharacterReforged.DuplicateRules.new_recruitment] (Character
#                                     Reforged's duplicate-players hook): one card per character on a duplicated save,
#                                     which copy is kept, element spirits per released copy; apply_on_load: the same on
#                                     every load of a player slot (Character Reforged keeps a backup of the save first)
#   content\team_planner\rule.toml    Utilities' team planner: any owned copy of a character counts
#   content\items\drop_list.toml      [VRFW.DropList.Spirits] ExcludeAll: no player spirit drops in matches (every
#                                     candidate refused, the chance lost), [VRFW.DropList] HideTabs: no player groups
#                                     in «Tasa de aparición»; not in a reserved slot
#   assets\lua\_all\new_recruitment_spirits.lua   no spirit «!» notices, no «Espíritu» row in the team docks, and a
#                                     spirit drop of a normal card (since 1.0.1 none drops outside a reserved slot,
#                                     so only there) = the player: noted on the match result screen,
#                                     recruited into the bank on the first step of a menu of the save (VRFW_Recruit), his
#                                     spirit taken back (at No More Rarities' normal card rarity when it is on, else at
#                                     the spirit's own rarity)
#   assets\lua\vs_route_town_command_select_menu\new_recruitment_idol_toggle.lua   the Chronicle board's «Quitar
#                                     aparición de ÍDOLOS ya obtenidos» guide entry removed and its key off (hooks of the
#                                     board host: SetupButtonGuide, IsHeroDropControlActived); not in a reserved slot
#   assets\lua\chronicle_mode_top_menu\new_recruitment_players_universe.lua   the Chronicle gacha «Universo del
#                                     jugador» covered: its row of the Chronicle top menu hidden and its enter does nothing
#                                     (wrappers of GetNumUsedButtons, OnDecideFocus, OnEnter, IsReservedPlayersUniverseEvent; its icon boxes (BetterUI) or small rows (retail) move up one row so no gap is left; their «!» notices stay on their own box)
#   assets\lua\vs_route_town_menu\new_recruitment_players_universe_key.lua   the Chronicle board's Tab / pad shortcut to the
#                                     gacha: OpenUniverse does nothing and the Tab button (layer 1423637364, instance 0) is hidden
#   content\triggers\w90i001.toml + w90i001.lua   the Chronicle hub map's trigger script: the gacha map point does nothing
#   content\tables\common\gamedata\map\w90i001\w90i001_oneplace_setting.toml   the gacha function point (OP_FUNC
#                                     run_players_universe_menu) deleted from the hub map: no marker, no zone
#   scripts\spirit_purge.lua + scripts\lib\spirit_purge.lua   a save duplicated through the slot screen (the
#                                     VR-Framework's slot_duplicate event) loses every player spirit in the NEW copy; the
#                                     source save is never touched
#   content\save_adjust\new_recruitment.toml + text\rows\save_tools.toml   its save adjust action (Options › «Ajustar
#                                     save»): «Quitar jugadores duplicados» on the CURRENT save, run by Character
#                                     Reforged's scripts\save_tools.lua (script = "character_reforged:save_tools.lua") with
#                                     this module's duplicate rule; a card the bank cannot retire or that did not join
#                                     by signing is never released
#   content\contact_maps\office.toml   [[VRFW.ContactSet]] office: the recruitment office (VR-Framework contact map
#                                     screen; [VRFW.ContactMap.Teams] team pages built from the game's Chronicle routes and
#                                     «Competir contra bots» matches; fichas, refund, trial friendly, fallback price tiers;
#                                     docs/game/mods/new-recruitment-office.md)
#   content\contact_maps\office_terms.toml   GENERATED (research/scripts/new_recruitment_office_terms.py): every
#                                     card's level, price in fichas, page, requirements and trials as the old office had them
#   config.toml                        [office] requirements (default false: the office asks only the price)
#   content\friendlies\office_trial.toml   the trial friendly («Prueba»), passed per card (office.{tag}.{sub})
#   content\shop_redirects\office.toml + text\rows\shop_text.toml   the Mercado bar of «El atrio de los indomables»
#                                     (0x66B2F9E6, no player sold any more) opens the office and reads «Oficina de fichajes»
#   text\rows\menu_text.toml   the office's titles
# Saved state: none under this mod's id. The pending spirit recruits are loader UI flags whose key names were kept from
# No More Rarities (no_more_rarities_spirit_pending*), so recruits noted before the split still happen; the on-load
# backup blobs are Character Reforged's. No save import is needed.
# vr_framework 2.4.32: [VRFW.DropList.Spirits]; 2.4.36: the slot_duplicate event; 2.4.40: the save tools.
# character_reforged 1.7.8: the duplicate rules' apply_on_load.
# 1.1.4 (owner test 2026-10-20): the «Espíritu» dock row is found again when BetterUI's shortcut tiles took rows 7, 8, 9 out of the list (the list was never found: the row stayed); a not-found list is logged
# 1.1.3 (owner 2026-10-20): the «Espíritu» row of «Plantilla de equipo» is hidden in every save (it was kept in a mode's reserved save); only the row, the spirit screen and its data stay
# 1.0.1 (vr_framework 2.4.133: [VRFW.DropList.Spirits] ExcludeAll): no player drops in matches, no player groups in the
# drop-rate list (owner request 2026-10-15).
# 1.0.7: no shop sells a player spirit or a Victory crate (content\shops\no_player_spirits.toml, hide_spirits), so
# nothing is paid for a card the stock refuses.
# 1.0.6 (vr_framework 2.4.142: [VRFW.DropList.Spirits] AllSources): no player spirit from any source in any mode
# (rewards, gifts, boxes, events, packs, retire); a reserved slot keeps the game's rules.
# 1.1.0 (vr_framework 2.8.42: contact map team pages, shop redirect contact_set): the recruitment office.
# 1.1.5 (vr_framework 2.8.68: Hub = "free_match"): the office opens on the free-match team list (crests, lineup),
# as Inazuma Fantasy's old office.
# 1.1.2 (vr_framework 2.8.50: [VRFW.ContactSet] Requirements, staff home-page fix): config.toml [office]
# requirements = false (owner 2026-10-20 «Quita los requisitos por ahora»): price only.
# 1.1.1 (vr_framework 2.8.46: card terms, fichas, pitch, trials, «Dimitir», shop redirect priority): the old office's
# terms and extras.
# 1.1.6 (vr_framework 2.8.72): the office team page's look (content\screen_art\contact_map.toml + the atlases
# content\images\menu\220_img\new_recruitment_office*: card plates, cost card, panel ground); the hub lists only teams with a page.
requires = ["vr_framework>=2.8.74", "character_reforged>=1.7.8"]
conflicts = []
loader_modules = ["lua_bridge"]

# its own content\ folders read by other mods' scripts: Character Reforged's duplicate hook (duplicate_rules) and
# Utilities' team planner (team_planner); vrfw check's layout lint accepts them (docs/framework/mod-layout.md)
[layout]
script_folders = ["duplicate_rules", "team_planner"]

# A MODULE of Character Reforged (docs/framework/mod-families.md): the Mods screen, the ModManager and `vrfw list` show it
# inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod of its own; switching Character
# Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 75

# Nothing other mods call.
[exports]
game_lua = []
