# board); scripts\pachangas.lua + content\game\pachangas.toml (CMND_NEWRECRUITMENT_PACHANGA_*: the zones, the armed
# match, its result from match_end, the won pachangas: save key won.<pachanga>); assets\lua\vs_route_town_menu\
# new_recruitment_pachangas.lua (the board side: a pachanga played through the VRFW match start service; on a win its
# players the club does not have join it, VRFW_Recruit, one copy per character).
requires = ["VRFW>=2.75.0", "CharacterReforged>=1.7.8"]
conflicts = []
loader_modules = ["lua_bridge"]
# its scripts answer game Lua commands (content\game\pachangas.toml: CMND_NEWRECRUITMENT_PACHANGA_*)
permissions = ["command"]

# its own content\ folders read by other mods' scripts: Character Reforged's duplicate hook (duplicate_rules) and
# Utilities' team planner (team_planner); vrfw check's layout lint accepts them (docs/framework/mod-layout.md)
[layout]
script_folders = ["duplicate_rules", "team_planner", "pachangas"]

# A MODULE of Character Reforged (docs/framework/mod-families.md): the Mods screen, the ModManager and `vrfw list` show it
# inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod of its own; switching Character
# Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "CharacterReforged"
order = 75

# Nothing other mods call.
[exports]
game_lua = []
