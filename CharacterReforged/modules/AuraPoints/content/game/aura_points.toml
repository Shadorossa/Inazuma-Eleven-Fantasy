# Aura Points › what scripts\aura_points.lua touches of the game: the soccer actors and units it reads, the cost points
# it provides answers on, the HUD commands. (Was Inazuma Fantasy's content\game\stamina.toml answers 3-6, its
# CMND_FANTASY_PEG / _PEG_INFO and the PEG / SP parts of its pays, until 2026-10-14: docs/refactor/aura-mods-split.md.)
#
# VRFW 2.3 cost points (docs/framework/match-resource.md §10): providers of the framework's one detour of each entry
# (hook bus), named by the game profile (`game =`), each with an explicit `order` (higher runs first, the engines are 0):
#   * Stamina.AuraCostCheck, order 5: inside the providers of other mods with a higher order (Inazuma Fantasy's
#     St_AuraCostCheck, order 10: its refusals - «Limitador activo», traits without Hiper, «no miximax» - are post
#     answers that run after these and win), before the rule engine and the technique engine's mini-effects (0);
#   * Duel.ProcessPending / Stamina.TensionPay, order 20: the pool start / the pool move is settled first (flag 8 / cost
#     0), so the other providers see an already free start / move.
schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ globals / structs

# A soccer actor ([g_soccerActors] + index x 0x570): its handle, team, the summon (keshin / totem) and metamorphosis
# (armour / miximax) machines, the pending action record (an aura start), the in-play byte.
[[VRFW.Struct]]
name = "ApActor"
size = 0x570
fields = { hdl = { at = 0x94, type = "u32" }, team = { at = 0xD0, type = "u8" }, pend_skill = { at = 0x188, type = "u32" }, pend_skill2 = { at = 0x18C, type = "u32" }, pend_kind = { at = 0x190, type = "u8" }, pend_flags = { at = 0x1A0, type = "u32" }, pend_armed = { at = 0x1A8, type = "u8" }, summon_skill = { at = 0x358, type = "u32" }, summon_full = { at = 0x360, type = "f32" }, summon_left = { at = 0x370, type = "f32" }, summon_state = { at = 0x374, type = "u8" }, meta_skill = { at = 0x380, type = "u32" }, meta_full = { at = 0x388, type = "f32" }, meta_left = { at = 0x39C, type = "f32" }, meta_state = { at = 0x3A0, type = "u8" }, in_play = { at = 0x497, type = "u8" } }

# A match unit: the 6 move slots (move id, category; 8 = an aura) and the aura bits (1 keshin, 2 armour, 4 miximax,
# 8 totem, 64 mode change).
[[VRFW.Struct]]
name = "ApUnit"
size = 0x380
fields = { s0 = { at = 0x30, type = "u32" }, c0 = { at = 0x42, type = "u8" }, s1 = { at = 0x4C, type = "u32" }, c1 = { at = 0x5E, type = "u8" }, s2 = { at = 0x68, type = "u32" }, c2 = { at = 0x7A, type = "u8" }, s3 = { at = 0x84, type = "u32" }, c3 = { at = 0x96, type = "u8" }, s4 = { at = 0xA0, type = "u32" }, c4 = { at = 0xB2, type = "u8" }, s5 = { at = 0xBC, type = "u32" }, c5 = { at = 0xCE, type = "u8" }, attr = { at = 0x2B4, type = "u8" } }

# ------------------------------------------------------------------------------------------------ the cost check

# bool AuraCostCheck(req{u32 hdl, u8 slot, u8 flag}) 0x16710F0: the engine's «the gauge / the tension covers this
# slot» (HUD state, input, the AI, the menus). Post, answered natively (first answer that gives a value wins), from the
# tables scripts\aura_points.lua fills (AuraPoints.Aura: the aura table, AuraPoints.Pair: per player and aura / move,
# AuraPoints.Player, AuraPoints.Team; a missing field = that answer does not apply):
#   1. a keshin / armour / totem start: its pool decides (empty this match = refused, else allowed: the gauge is not
#      looked at);
#   2. the keshin's own move under its armour (Chrono Stone, [points] cs_armour_keshin_move = false): refused; a group
#      keshin: a participant's armour blocks its move for the whole group;
#   3. the running keshin's / armour's / totem's own move (ONLY that spirit's moves, scripts\lib\route.lua): its pool
#      covers its cost (instead of the tension); a fusion keshin partner's move: every participant's pool;
#   4. CS, keshin out, only with [points] cs_keshin_moves_cost = "peg" (off: "own"): any other move costs its tension
#      in PEG.
# Every other slot falls through to the other providers and the engine (tension).
[[VRFW.Hook]]
name = "Ap_AuraCostCheck"
game = "Stamina.AuraCostCheck"
kind = "function"
order = 5

# 1. a keshin / armour / totem whose pool is empty this match
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(AuraPoints.Pair:empty, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(AuraPoints.Team:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# 1. else its pool decides: allowed (the gauge is not looked at)
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(AuraPoints.Aura:pool, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(AuraPoints.Team:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# 2. CS: the keshin's own move under its armour
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(AuraPoints.Pair:own_blocked, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 2. CS, group keshin: a participant's armour blocks its move for the whole group
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(AuraPoints.Pair:blocked, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 3. the running pool's own move (that spirit's moves only): covered (1) or not (0)
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(AuraPoints.Pair:peg_cover, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 3. a partner of a running fusion keshin: its move
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(AuraPoints.Pair:partner_cover, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 4. CS keshin out, cs_keshin_moves_cost = "peg" only: any other move costs its tension in PEG
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }, { value = "[unit([args[1]]:u32) + 0x42 + [args[1] + 4]:u8 * 0x1C]:u8", not = 8 }, { value = "[unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32", not = 0 }]
value = "if(lookup(AuraPoints.Player:keshin_out_peg, [args[1]]:u32) > 0.001, if(lookup(AuraPoints.Player:keshin_out_peg, [args[1]]:u32) + 0.001 >= [unit([args[1]]:u32) + 0x2E0 + [args[1] + 4]:u8 * 0x18]:u32, 1, 0), 0)"

# ------------------------------------------------------------------------------------------------ pays

# ProcessPending(actor) 0x15AFBB0: turns the actor's pending action record into the action and (unless its flag 8 is
# set) pays its cost. Pre (scripts\aura_points.lua, only with a pending aura start): a keshin / armour / totem that runs
# on its pool gets flag 8 (a free start).
[[VRFW.Hook]]
name = "Ap_PendingPay"
game = "Duel.ProcessPending"
kind = "function"
order = 20

# void TensionPay(req{i32 cost, u8 kind, u8 team, _, u32 hdl}) 0x16BFC80: the engine's one pay of a move's tension
# (kind 8 = the pending move). Pre (scripts\aura_points.lua, routed by scripts\lib\route.lua): ONLY the running
# keshin's / armour's / totem's own move pays its PEG / SP here and no tension ([points] move_tension_free); CS
# cs_keshin_moves_cost = "peg": a keshin-out move pays its tension in PEG. Every other move: the other providers'
# tension rules and the engine.
[[VRFW.Hook]]
name = "Ap_TensionPay"
game = "Stamina.TensionPay"
kind = "function"
order = 20

# ------------------------------------------------------------------------------------------------ HUD commands

# CMND_AURAPOINTS_PEG(hdl) -> ok, cur, max, active, armour, pegMode, source, soul (graft aura_points_hud: the PEG / SP
# bar; other mods' buff-row bars). Alias: the name Inazuma Fantasy's grafts call (was its CMND_FANTASY_PEG).
[[VRFW.Command]]
name = "CMND_AURAPOINTS_PEG"
aliases = ["CMND_EVT_PEG"]
handler = "AuraPoints.Peg"

# CMND_AURAPOINTS_PEG_INFO(aura) -> ok, kind (1 PEG, 2 SP), pool, moveCost, armourMovesFree (the move cards of other
# mods' screens: Inazuma Fantasy's Hiper page / skill screen). Alias: the name those grafts call.
[[VRFW.Command]]
name = "CMND_AURAPOINTS_PEG_INFO"
aliases = ["CMND_EVT_PEG_INFO"]
handler = "AuraPoints.PegInfo"

# CMND_AURAPOINTS_ACTIVE_PARTS() -> ok, peg, sp, pe (1 / 0): the mod's parts this start (options.toml rows peg / sp /
# pe). The buff row grafts (aura_points_buff_bar) keep the retail row and draw no bar while PEG and SP are both off.
[[VRFW.Command]]
name = "CMND_AURAPOINTS_ACTIVE_PARTS"
handler = "AuraPoints.ActiveParts"
