# Aura Points: the PEG / SP bar of the match HUD (docs/game/mechanics/aura-costs.md §12.6 / §14). Was Inazuma Fantasy's
# evt_peg_bar / evt_peg_shine / evt_peg_label of its menus\00_soccer\pe_hud.toml until 2026-10-14.
# Three new layers in soccer_inplay_menu (and its battle group, where the controlled player's face bubble also lives),
# not opened by the screen (flags like the dash ring's): the Lua of research/grafts/aura_points_hud opens them, sets
# their value from CMND_AURAPOINTS_PEG and puts them under the controlled player's face bubble (under Inazuma
# Fantasy's PE bar when that one is shown) every frame. Their object is the retail stamina gauge of the stairs race
# (btl06_13_stamina_gauge: dark frame 476 x 44, bar 448 x 24, rate settings hp_bar / hp_bar_red), renamed, with the face
# bubble's anchoring (top left, like soccer02_22_chara_face_balloon) so its layer position means the same as the
# bubble's. No retail byte in the mod: the engine derives the object from the player's own game files.
# * aura_points_peg_bar: the bar; its fill sprite hp_bar02 swapped for evt_peg_fill01 (purple) / evt_sp_fill01 (blue).
# * aura_points_peg_shine: the glass gloss over it (aura_points_gloss_NN) while the spirit is out; priority 201.
# * aura_points_peg_label: only its frame, swapped for the tag evt_peg_tag01 / evt_sp_tag01, left of the bar; priority 201.
schema = "VRFW.menu/2"

[[object]]
name = "aura_points_peg_bar"
from = "btl06_13_stamina_gauge"
add_block = [{ block = "MenuAnchorComponent", values = [], after = "CMenuAnimation" }]
add = [
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_autoCalcPos", values = [0] },
]

[[object]]
name = "aura_points_peg_shine"
from = "btl06_13_stamina_gauge"
priority = 201
add_block = [{ block = "MenuAnchorComponent", values = [], after = "CMenuAnimation" }]
add = [
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_autoCalcPos", values = [0] },
]

[[object]]
name = "aura_points_peg_label"
from = "btl06_13_stamina_gauge"
priority = 201
add_block = [{ block = "MenuAnchorComponent", values = [], after = "CMenuAnimation" }]
add = [
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalV", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointHorizontalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_anchorPointVerticalH", values = [17] },
    { block = "MenuAnchorComponent", param = "m_autoCalcPos", values = [0] },
]

[[patch]]
menu = "soccer_inplay_menu"
add_layer = { name = "aura_points_peg_bar", object = "aura_points_peg_bar", count = 1, after = "soccer08_27_catch_bomb_recast_gauge", groups = [
    { group = "soccer_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
    { group = "soccer_battle_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
] }

[[patch]]
menu = "soccer_inplay_menu"
add_layer = { name = "aura_points_peg_shine", object = "aura_points_peg_shine", count = 1, after = "aura_points_peg_bar", groups = [
    { group = "soccer_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
    { group = "soccer_battle_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
] }

[[patch]]
menu = "soccer_inplay_menu"
add_layer = { name = "aura_points_peg_label", object = "aura_points_peg_label", count = 1, after = "aura_points_peg_shine", groups = [
    { group = "soccer_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
    { group = "soccer_battle_inplay_menu", flags = [0, 0, 0, 0, 1, 0] },
] }

# the mod's own atlas aura_points_hud (the bar's fill, tag and gloss sprites: content\images\...\aura_points_bars.toml)
[[patch]]
menu = "soccer_inplay_menu"
res = ["#/menu/02_btl/aura_points_hud/<LG>/aura_points_hud.g4tx"]
