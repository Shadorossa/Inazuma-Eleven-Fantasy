# Aura Points › PE (the option feature features\pe\, read only while the option row «pe» is on): what
# scripts\stamina.lua touches of the game: the match, the soccer actors and units it reads, the cost points it provides
# answers on, the character record the plates ask the max PE of, the HUD commands. The mod Stamina Points' until
# 2026-10-16 (content\game\stamina_points.toml; its commands and hooks renamed, the old command names kept as aliases).
#
# VRFW 2.3 cost points (docs/framework/match-resource.md §10): providers of the framework's one detour of each entry
# (hook bus), named by the game profile (`game =`), each with an explicit `order` (higher runs first, the engines are 0):
#   * Stamina.AuraCostCheck, order 4: inside the providers with a higher order (Inazuma Fantasy's St_AuraCostCheck,
#     order 10: its refusals - «Limitador activo», traits without Hiper, «no miximax» - are post answers that run after
#     this one and win; the PEG / SP provider Ap_AuraCostCheck, order 5, answers only keshin / armour / totem);
#   * Duel.ProcessPending, order 15: the free miximax start is settled after Aura Points' pool starts (20) and before
#     Inazuma Fantasy's «Limitador activo» cut of a paid start (10). The PEG / SP pool starts are Ap_PendingPay (20).
schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ globals / structs

# CSceneSoccer* [0x21F6350] (a new scene object = a new match), from the scene driver's update call 0x1423EA5
[[VRFW.Global]]
name = "sp_scene"
rip = { pattern = "48 8B 0D ?? ?? ?? ?? 48 85 C9 74 09 41 0F 28 C8 E8 ?? ?? ?? ?? 4C 8D 9C 24 A0 00 00 00", disp_off = 3, next_ip_off = 7, rva = 0x1423EA5, target_rva = 0x21F6350 }

# the controlled-player manager [g_ctrlChara 0x21F6948] (+0x60 + team x 4 = the handle the user controls)
[[VRFW.Global]]
name = "sp_ctrl"
rip = { pattern = "48 8B 05 ?? ?? ?? ?? 48 85 C0 0F 84 ?? ?? ?? ?? F6 40 79 01", disp_off = 3, next_ip_off = 7, rva = 0x1570169, target_rva = 0x21F6948 }

# [g_soccerActors]: `mov r8, [rip+x]` at +8 of OnHissatsuUsed 0xEB6C60
[[VRFW.Global]]
name = "sp_actors"
game = "Match.SoccerActors.ViaSkillUsed"

# The match info block [[g_gameRoot]+0x6A58] (+0x1C the half length, +0x2BFB the half, +0x2C29 the user's team)
[[VRFW.Global]]
name = "sp_match"
base = "game_root"
chain = ["ROOT_MATCH"]

# Unit* ActorUnit(actor) 0x15B25E0: the match unit of a soccer actor
[[VRFW.Function]]
name = "SpActorUnit"
game = "Match.ActorUnit"

# A soccer actor ([g_soccerActors] + index x 0x570): its handle, team, the summon (keshin / totem) and metamorphosis
# (armour / miximax) machines, the pending action record (an aura start), the in-play byte.
[[VRFW.Struct]]
name = "SpActor"
size = 0x570
fields = { hdl = { at = 0x94, type = "u32" }, team = { at = 0xD0, type = "u8" }, pend_skill = { at = 0x188, type = "u32" }, pend_skill2 = { at = 0x18C, type = "u32" }, pend_kind = { at = 0x190, type = "u8" }, pend_cost = { at = 0x198, type = "i32" }, pend_flags = { at = 0x1A0, type = "u32" }, pend_armed = { at = 0x1A8, type = "u8" }, summon_skill = { at = 0x358, type = "u32" }, summon_full = { at = 0x360, type = "f32" }, summon_left = { at = 0x370, type = "f32" }, summon_state = { at = 0x374, type = "u8" }, meta_skill = { at = 0x380, type = "u32" }, meta_full = { at = 0x388, type = "f32" }, meta_left = { at = 0x39C, type = "f32" }, meta_state = { at = 0x3A0, type = "u8" }, in_play = { at = 0x497, type = "u8" } }

# A match unit (SpActorUnit(actor)): Físico, the member link, the aura bits (1 keshin, 2 armour, 4 miximax, 8 totem,
# 64 mode change), the character handle and card.
[[VRFW.Struct]]
name = "SpUnit"
size = 0x380
fields = { fisico = { at = 0x0C, type = "u16" }, member = { at = 0x28, type = "ptr" }, attr = { at = 0x2B4, type = "u8" }, chara = { at = 0x370, type = "u32" }, param = { at = 0x374, type = "u32" } }

# The max PE of a character status handle outside a match (the plates): its status object (record +0x08: the card id
# at +4) and its effective level.
# CharaStatus* FindCharaRecord(Container*, const u32* charaHdl) 0xD7F3E0
[[VRFW.Function]]
name = "SpFindCharaRecord"
game = "Board.FindCharaRecord"

# u16 HumanChara_GetLevel(CharaStatus*, u8* outFlag) 0xD85710
[[VRFW.Function]]
name = "SpHumanGetLevel"
game = "Chara.HumanGetLevel"

# [[g_gameRoot]+0x69D8]: the character containers (container of kind k = [this + 8 + k * 8])
[[VRFW.Global]]
name = "sp_chara_containers"
base = "game_root"
chain = [0x69D8]

# ------------------------------------------------------------------------------------------------ the cost check

# bool AuraCostCheck(req{u32 hdl, u8 slot, u8 flag}) 0x16710F0: the engine's «the gauge / the tension covers this
# slot». Post, answered natively from the tables scripts\stamina.lua fills (AuraPoints.StaminaAura: the aura table,
# AuraPoints.StaminaTeam: the teams the rules apply to; a missing record = the answer does not apply):
#   a miximax starts at any gauge ([pe] no_start_check).
[[VRFW.Hook]]
name = "Ap_StaminaCostCheck"
game = "Stamina.AuraCostCheck"
kind = "function"
order = 4

[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(AuraPoints.StaminaAura:waived, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(AuraPoints.StaminaTeam:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# ------------------------------------------------------------------------------------------------ the start pay

# ProcessPending(actor) 0x15AFBB0: turns the actor's pending action record into the action and (unless its flag 8 is
# set) pays its cost. Pre (scripts\stamina.lua, only with a pending aura start): a [pe] free_activation kind
# (the miximax) gets flag 8 (no hyper gauge spent).
[[VRFW.Hook]]
name = "Ap_StaminaPendingPay"
game = "Duel.ProcessPending"
kind = "function"
order = 15

# ------------------------------------------------------------------------------------------------ match retry

# MatchRetryReset 0x16CAF50: every battery-out bit is cleared first (scripts\stamina.lua). Prologue 19 bytes,
# chained. (The battery-out red-card answers and the substitution bits: the framework's OffPitch rule,
# content\resource_rules\off_pitch.toml.)
[[VRFW.Hook]]
name = "Ap_StaminaMatchRetry"
kind = "function"
pattern = "48 8B C4 55 48 8D 68 A1 48 81 EC A0 00 00 00 48 89 58 18"
rva = 0x16CAF50
steal = 19
args = ["ptr"]

# ------------------------------------------------------------------------------------------------ HUD commands

# CMND_AURAPOINTS_STAMINA(hdl) -> ok, cur, max, exhausted, modeOn (1), user, hdl, mult (graft aura_points_stamina_hud,
# the buff row's miximax bar of graft aura_points_buff_bar; aliases: the mod Stamina Points' CMND_STAMINAPOINTS_GP and
# CMND_EVT_GP for the screens of other mods that ask it, Inazuma Fantasy's buff row): the PE of a match player (0 = the
# user's controlled one), mult = the PE multiplier of a running transformation (the HUD's shine)
[[VRFW.Command]]
name = "CMND_AURAPOINTS_STAMINA"
aliases = ["CMND_STAMINAPOINTS_GP", "CMND_EVT_GP"]
handler = "AuraPoints.Stamina"

# CMND_AURAPOINTS_STAMINA_MAX(fisico[, charaStHdl]) -> ok, max, modeOn (1): the max PE of a character outside a match
# (his card's in content\match_resources\pe_max.toml at his level; the player header's piece
# assets\lua\_all\aura_points_stamina_plate.lua; aliases CMND_STAMINAPOINTS_PE_MAX and CMND_EVT_PE_MAX: Inazuma
# Fantasy's plates)
[[VRFW.Command]]
name = "CMND_AURAPOINTS_STAMINA_MAX"
aliases = ["CMND_STAMINAPOINTS_PE_MAX", "CMND_EVT_PE_MAX"]
handler = "AuraPoints.StaminaMax"

# CMND_AURAPOINTS_HUD_HIDDEN_LAYERS() -> ok, layer hash... (graft aura_points_hyper_gauge; alias
# CMND_STAMINAPOINTS_HUD_HIDDEN_LAYERS): the match HUD layers hidden while PE and the PEG or SP points are both on
# (config.toml [hud_hidden_layers]: the retail hyper gauge, the PEG / SP bar under the PE bar taking that role). With PE
# off this feature is not read and nothing answers; with PEG and SP off the answer is false: the HUD stays retail.
[[VRFW.Command]]
name = "CMND_AURAPOINTS_HUD_HIDDEN_LAYERS"
aliases = ["CMND_STAMINAPOINTS_HUD_HIDDEN_LAYERS"]
handler = "AuraPoints.HudHiddenLayers"

# the module bit the mods' Lua reads (CMND_EVT_LOADER_VERSION): 8 = «stamina» while the PE commands are on (was
# Inazuma Fantasy's)
[[VRFW.ModuleMask]]
bit = 8
needs = ["CMND_AURAPOINTS_STAMINA", "CMND_AURAPOINTS_STAMINA_MAX"]
