# Aura Points' match PE («PE», docs/game/mechanics/match-stamina.md) as the VR-Framework's match resource
# aura_points.pe (docs/framework/match-resource.md). The framework drains it every frame, keeps the «exhausted»
# state, slows / stops the dash of an exhausted player, gives PE back at half-time and pays the pe_sacrifice moves with
# it. The dash is also limited by the sprint bar (sprint.toml, aura_points.sprint: empty = no dash for a while).
# The mod's own rules on top are scripts\stamina.lua: the transformation costs ([pe] of config.toml: the
# miximax on PE, the Chrono Stone model's PE-free keshin / armour runs and their end charge, set on each player as the
# drain multiplier `aura_points.aura`), the trait rules' battery out, the tired locomotion ([tired_motion]).
# Other mods add their own drain multipliers (VRFW.resource.set_mult on aura_points.pe; Inazuma Fantasy: its
# passives) and half-time bonuses (resource:aura_points.pe:half_time). Was Inazuma Fantasy's inazuma_fantasy.pe
# until 2026-10-14 and the mod Stamina Points' stamina_points.pe until 2026-10-16 (still a name of it: `aliases`).
# Part of the option feature features\pe\ (option row «pe»): off = no PE resource at all (retail).
# Read once at the framework's init: restart the game after a change.
schema = "VRFW.match_resource/1"

[[VRFW.MatchResource]]
name = "pe"                       # key aura_points.pe
aliases = ["stamina_points.pe"]   # its key in the mod Stamina Points (merged into Aura Points on 2026-10-16)
# max PE: per player, the table of pe_max.toml ([[VRFW.MatchResourceMax]], generated by
# research/scripts/pe_per_player_build.py; docs/game/mechanics/pe-per-player.md): every character's Inazuma Eleven GO
# Galaxy TP (else his CS / GO / IE3 / IE2 / IE TP x that game's fitted ratio to Galaxy; without any, a deterministic
# point of his position's Galaxy TP distribution, P15..P85, from a hash of the character and his Fisico), at Lv 99; it
# grows with his level (Lv 1 x0.10 .. Lv 99 x1.00, above Lv 99 toward x1.35 at Lv 200 when a mod raises the cap) and
# his drain grows with it (drain_follows_level: same exhaustion minute at every level; pe-per-player.md §6). This
# `max` is only the fallback without that table (the table's own default covers the cards it does not list). Training
# Físico does not raise it; the plates (CMND_AURAPOINTS_STAMINA_MAX with the card) and the match HUD show his value.
max = 134
pe_provider = true                # the technique type's pe_sacrifice moves (Pingüino emperador nº1) pay with it
live_states = [9, 14, 15, 16]     # in play, focus battle, scramble, zone
duel_states = [14, 15]            # the exhausted speed in a duel: focus battle, scramble

# The drain follows the length of the match being played (per_match): the framework reads the match's length at play
# (2 halves x half length / clock rate, one period without the two-halves rule; extra time not counted) and drains per
# live second base x 134 / that length x (1 + what he does), x Físico, level, keeper, transformation and the mods'
# multipliers. 134 = the bar of pe_max.toml's default (the median player).
#   base: the share of the bar the base drain alone spends while the match clock runs a whole match (0.35 = 35 %,
#     whatever the length: a 2 x 30' match, a 2 x 45' one, a 15' 5-a-side or a short ruleset)
#   running / dash / dash_attack / transformed: x base ADDED while he does it (dash 6.0: a dashing second costs 7.0
#     base seconds), so they follow the base and the match length
# The drain runs in every live state (focus battles, scrambles and zones too) while the match clock stops in some of
# them: the balance assumes about 1.3 live seconds per clock second (the «drain tally» log lines at half-time and at
# the end give the real ratio and each player's dashing share). Target: a field player (Físico 100, any level) who
# dashes 20 % of his live time ends the match at about 15 % (half-time +15 %); 10 % dashing -> about 42 %, never
# dashing -> about 70 %, 30 % -> empty after about 80'. Físico 150: 28 / 52 / 75 %. Keepers x0.5. (Those figures are
# for dash 6.0 / half-time 15 %; since 2026-10-20 the dash drains x0.70 and half-time gives 30 %: 20 % dashing ends at
# about 46 % with the half-time gain, and the sprint bar caps the dashing near 40 % of the live time.)
# Stamina Points 1.2.0 (base 0.45, dash 8.5) on the same assumptions: 20 % dashing -> empty after about 65'.
[VRFW.MatchResource.drain]
per_match = true
base = 0.35
running = 0.7                     # unused while consume_is_dash
# the dash drain x0.70 of 6.0 / 12.0 (owner 2026-10-20: the PE spent 30 % slower while dashing; the sprint bar,
# sprint.toml, limits how long he can dash)
dash = 4.2                        # 0.35 x 5.2 = 1.82 bars per match of dashing (6.0: 2.45)
dash_attack = 8.4                 # dash x 2.0, as before
# the match length without a match clock (2 x 30' at the clock rate 14.1) and the shortest one used (real seconds)
match_seconds_fallback = 255
match_seconds_min = 30
# the hidden DP consume state is the engine's dash state (first in-game log, 2026-09-28): a consume tick without a
# manual dash drains like a dash (CPU / AI-driven dashes)
consume_is_dash = true
# the flat transformation drain: only for the forms the transformation costs ([pe] of config.toml) do not pay themselves
# (keshin, armour and miximax pay through [pe]; the mode change drains nothing: mode-change.md §5.5)
transformed = 5.4                 # 0.35 x 6.4 = 2.25 bars per match transformed (as in 1.2.0)
transformed_auras = ["soul", "bond"]

# Físico makes the PE drain slower: every drain is multiplied by F = max(floor, (1 - step) ^ (Físico - ref)): each Físico
# point above ref multiplies the drain by (1 - step); below it the drain grows the same way. Físico 0 x1.32, 100 x1.00,
# 136 x0.90, 190 x0.78, 250 x0.66, 350 x0.50, 500 x0.33, 1000 x0.08, 1740+ x0.01 (floor)
[VRFW.MatchResource.stat_scale]
stat = "physical"
ref = 100
step = 0.0028
floor = 0.01

[VRFW.MatchResource.scale]
keeper = 0.5                      # goalkeepers (formation position 0)
rival = 1.0                       # the CPU team
# manual tuning on top of the drain (1.0: the shares above are what a match spends; a bigger tank than 134 lasts longer)
global = 1.0

# before a new half: + a share of the max (never above max), every player of both teams (owner 2026-10-20): 30 % at
# the break between the halves, 25 % before each half of extra time (given at its break, or when it starts after the
# end of the regular time). Other mods add their bonuses on top (Inazuma Fantasy's passives «+x % de PE recuperados
# en el descanso»: the event resource:aura_points.pe:half_time, once per gain)
[VRFW.MatchResource.half_time]
share = 0.30
jitter = 0.0
halves = [2, 3, 4]                # the second half, the two halves of extra time
shares = [0.30, 0.25, 0.25]       # per entry of halves

# exhausted at <= 10 % of the max until back above 15 %: speed x0.46 (x0.805 in a duel), no manual dash, a running manual
# dash is ended (its record gets its fuel back once it is over; with params\pe_no_dash_gauge.toml the fuel itself never
# runs out, so PE is the only limit of a dash)
[[VRFW.MatchResource.state]]
name = "exhausted"
below = 0.10
above = 0.15
speed_mult = 0.46                 # 15 % faster than 0.4 (owner 2026-10-16)
speed_mult_duel = 0.805           # 15 % faster than 0.7
block_dash = true
end_dash = true
