texture = "stamina_points_pe_tag"
x = 4
y = 2
png = "tag/pe_it.png"

[[sprite]]
atlas = "#/menu/02_btl/btl06/btl06_13/<LG>/btl06_13.g4tx"
lang = ["", "en", "de", "zh_hans", "zh_hant"]
name = "stamina_points_pe_tag01"
texture = "stamina_points_pe_tag"
x = 4
y = 2
png = "tag/gp.png"

