# Aura Points › PE: the sprites of its match HUD bar (graft aura_points_stamina_hud) in the retail btl06_13 atlas (every
# language file); the retail sprites are untouched. Copies of Inazuma Fantasy's evt_pe_tag01 / evt_gloss_NN under this
# mod's names (2026-10-14, docs/refactor/aura-mods-split.md «Stamina Points»):
#   stamina_points_pe_tag01          the «PE» / «GP» tag left of the PE bar, Chrono Stone's own stamina-bar tag, its
#                                    picture per language (es/pt, fr, it «PE»; en/de/ja/zh «GP»;
#                                    research/scripts/hud_pe_tag_build.py)
#   stamina_points_gloss_00 .. _47   the glass gloss band at position NN of 48 across the gauge fill (centre -0.10 ..
#                                    1.10 of its width; research/scripts/hud_gloss_build.py), swept over the bar while
#                                    the player's PE drains faster (docs/game/mechanics/aura-costs.md §6)
schema = "VRFW.image/1"

# ---- the «PE» tag

[[texture]]
atlas = "#/menu/02_btl/btl06/btl06_13/<LG>/btl06_13.g4tx"
name = "stamina_points_pe_tag"
size = [64, 32]

[[sprite]]
atlas = "#/menu/02_btl/btl06/btl06_13/<LG>/btl06_13.g4tx"
lang = ["es", "pt"]
name = "stamina_points_pe_tag01"
texture = "stamina_points_pe_tag"
x = 4
y = 2
png = "tag/pe_es.png"

[[sprite]]
atlas = "#/menu/02_btl/btl06/btl06_13/<LG>/btl06_13.g4tx"
