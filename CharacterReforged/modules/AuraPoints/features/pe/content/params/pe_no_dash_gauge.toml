# Aura Points › PE: no team dash gauge (written by hand; docs/game/mechanics/match-stamina.md §13.2). Dashing is limited
# only by each player's PE: the team's dash fuel lasts an hour and never locks the dash out, so the retail «wheel» (4 s
# of fuel per team, 5.5 s lock-out when dry) never acts. The ring itself is not drawn (graft aura_points_stamina_hud).
# Was Inazuma Fantasy's content\params\pe_no_dash_gauge.toml until 2026-10-14.
schema = "VRFW.param/1"

[game_param.CSoccerGlobalParam]
teamCharaManualDashActiveTime = 3600.0       # fuel max of a manual dash (s); retail 4, IF 8
teamCharaManualDashRecastTime = 0.0          # lock-out after the fuel ran dry (s); retail 5, IF 9
teamCharaManualDashRecastDelayTime = 0.0     # delay before that lock-out (s); retail 0.5
ctrlCharaDashModeActiveTime = 3600.0         # fuel on a kickoff / restart reset (s); retail 4
