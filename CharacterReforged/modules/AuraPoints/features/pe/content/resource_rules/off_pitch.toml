# Aura Points › PE: battery out (docs/game/mechanics/match-stamina.md, docs/game/media/cs-exhausted-walk.md §9): a
# player of a «battery» trait (the trait rules [pe.trait.*] of config.toml) whose PE runs out kneels until the end of
# the match; scripts\stamina.lua sets his member's red-card bit (the engine takes him off the pitch) and writes
# his handle in the exported table Resource.OffPitch. The VR-Framework's match resource rules
# (docs/framework/match-resource.md §10) answer the red-card questions (IsSentOff / IsSentOffById) 0 for him (no red
# card telop, he can be substituted) and signal the substitutions (vrfw.off_pitch.layout / _done: the script clears the
# bit around them and sets it again while he is still on the pitch). Was Inazuma Fantasy's until 2026-10-14.
schema = "VRFW.resource_rule/1"

[[VRFW.OffPitch]]
name = "battery_out"
