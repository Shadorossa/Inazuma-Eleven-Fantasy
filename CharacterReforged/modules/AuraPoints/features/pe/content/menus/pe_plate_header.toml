# Aura Points › PE: its piece in Character Reforged's player header slot (docs/refactor/aura-mods-split.md «Player
# header»; the host character_reforged.header, CharacterReforged\content\menus\player_header_host.toml). Apart from
# pe_plate.toml so that file builds on the retail data alone (crates/plugins/menu_engine tests).
schema = "VRFW.menu/2"

# the six attach rows on Character Reforged's one-row header object (an [[object_set]] on the retail object does not
# reach that derived copy): trace, locator _pos_base01 0x5A709C12, layer, instance 0
[[object_set]]
object = "evt_soccer11_04pp_pp"
add = [
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0xFEB13517, 0x5A709C12, 0xFEB13517, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x8BC70E3E, 0x5A709C12, 0x8BC70E3E, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x540D16D3, 0x5A709C12, 0x540D16D3, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x055B3075, 0x5A709C12, 0x055B3075, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x725C00E3, 0x5A709C12, 0x725C00E3, 0] },
    { block = "CMenuAttachLocator", param = "NullLayerName", values = [0x401B0F3C, 0x5A709C12, 0x401B0F3C, 0] },
]

# the piece: AuraPoints_Stamina.PlatePe (assets\lua\_all\aura_points_stamina_plate.lua) draws the max PE at the slot's x
[[entry]]
host = "character_reforged.header"
id = "pe"
order = 100
action = { lua = "AuraPoints_Stamina.PlatePe" }
