id = "aura_points"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Aura Points"
version = "1.1.3"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Keshin, keshin armours and totems run on points instead of time, as in Chrono Stone and Galaxy, and every player gets a stamina bar (GP) for the whole match. Each player has a fighting-spirit pool (PEG) for each keshin and an SP bar for each totem: summoning is free and has no time limit, the keshin's or totem's own special move costs its points instead of tension, an armour drains its keshin's PEG while it is worn, and an empty pool sends the spirit away for the rest of the match. Running and above all dashing spend GP, Físico makes it last longer, half-time gives some back, and an exhausted player slows down, cannot dash and staggers; each character's GP is his Inazuma Eleven GO Galaxy value, growing with his level. A miximax has no time limit and does not spend the hyper gauge: it burns GP faster and ends at 0; a keshin or an armour stops the drain while it is out and costs GP when it ends. A purple PEG bar (blue for SP) and a yellow GP bar show under the controlled player's face, and every player's max GP in the player header. In the mod's settings PEG, SP and GP can each be switched off (that part keeps the game's own rules). Works with the VR-Framework and Character Reforged; Inazuma Fantasy adds its own rules on top."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-19"
# This mod's own names (TOML keys [AuraPoints.X], Lua AuraPoints.X, commands CMND_AURAPOINTS_*, tables AuraPoints.*;
# game Lua AuraPoints_Hud / AuraPoints_Stamina); never VRFW.
prefix = "AuraPoints"
folder = "AuraPoints"
# Split out of Inazuma Fantasy on 2026-10-14 (owner request; docs/refactor/aura-mods-split.md «Aura Points»): IF's
# keshin PEG / totem SP pools, their costs and the HUD bar. On 2026-10-16 the mod Stamina Points (the match PE) was
# merged into it (owner decision: one mod for the three point systems, each switched by its own option row). Standard
# mod layout (docs/framework/mod-layout.md):
#   options.toml                        the rows «peg», «sp», «pe»: which point systems run (restart = true)
#   config.toml                         [points]: the pool rules (cost model, armour drain / refill, which moves pay,
#                                       CPU); [pe], [pe.trait.*], [tired_motion], [hud_hidden_layers]: the PE rules
#   content\match_resources\            peg.toml / sp.toml: the pools per keshin / totem (generated from the wiki
#                                       export by research/scripts/peg_table_build.py / soul_table_build.py)
#   content\game\aura_points.toml       the cost points' providers (cost check, start pay, tension pay), structs, commands
#   content\menus\peg_bar.toml          the HUD bar's layers; content\images\…\btl06_13\aura_points_bars.toml its sprites
#   scripts\aura_points.lua (+ lib\)    the run time; graft research/grafts/aura_points_hud: the HUD bar
#   content\menus\buff_row.toml         the buff row's aura entries: one per player on the pitch (the row shows up to the
#                                       framework's team aura limit, graft aura_points_buff_bar)
#   content\menus\buff_bar.toml         the layer of the PEG / SP bars on the buff row's keshin / armour / totem
#                                       entries (graft research/grafts/aura_points_buff_bar: in place of the stopwatch)
#   content\menus\buff_digits.toml      the «current / max» glyph layer under every bar and the totem level label layer
#                                       (GENERATED by research/scripts/aura_points_buff_num_build.py, with the glyph
#                                       sprites content\images\...\btl06_13\aura_points_buff_num.toml; same graft)
#   content\extra_slots\skill_set_points.toml   the pool rules on Character Reforged's RB plates (start by the pool,
#                                       never by the hyper gauge; empty pool = refused; the spirit move's PEG / SP cost)
#   features\pe\                        the match PE: an option feature (evt_modfmt::layout::feature_switch), read only
#                                       while the option row «pe» is on; off = no PE (retail)
#     content\match_resources\pe.toml   the PE: drains, Físico, half-time, «exhausted» (resource aura_points.pe, alias
#                                       stamina_points.pe); pe_max.toml the max PE of every character (generated by
#                                       research/scripts/pe_per_player_build.py)
#     content\params\pe_no_dash_gauge.toml  no team dash fuel (PE is the only limit of a dash)
#     content\resource_rules\off_pitch.toml the battery out's «off the pitch without a red card» (Resource.OffPitch)
#     content\rules\field_clips\        the tired locomotion (CS clips in assets\anims\field_clips\) and the battery
#                                       out's held kneel
#     content\game\stamina.toml         the PE's cost-point providers (cost check, start pay), structs, commands
#     content\extra_slots\skill_set_pe.toml the miximax start at any hyper gauge on Character Reforged's RB plates
#     content\menus\pe_bar.toml + content\images\…\btl06_13\stamina_points_bars.toml   the HUD bar's layers / sprites
#                                       (graft research/grafts/aura_points_stamina_hud)
#     content\menus\pe_plate.toml + pe_plate_header.toml + content\images\…\btl06_13\stamina_points_pe_num.toml
#                                       the max PE in the player header: a piece of Character Reforged's header slot
#                                       (entry «pe» of the host character_reforged.header), drawn by
#                                       assets\lua\_all\aura_points_stamina_plate.lua
#     scripts\stamina.lua (+ lib\stamina\)  the PE's run time
#   graft research/grafts/aura_points_hyper_gauge + config [hud_hidden_layers]: with PE and the PEG or SP points on, the
#                                       retail hyper gauge hidden (CMND_AURAPOINTS_HUD_HIDDEN_LAYERS)
# vr_framework 2.4.174: merged mods ([[merged]], 2.4.172), option features (features\<x>\ switched by an option row)
# and match resource aliases. character_reforged 1.5.0: the shared base of the character / aura mods (owner decision
# 2026-10-14) and its player header slot (the max PE).
requires = ["vr_framework>=2.4.174", "character_reforged>=1.5.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "call", "command", "hook"]

# The mod Stamina Points (stamina_points 1.2.3) is this mod's part «pe» since 2026-10-16 (docs/framework/merged-mods.md):
# `requires` / `if_mod` on stamina_points follow the part, an old installed stamina_points folder is replaced, the
# ModLoader's boot turns `stamina_points` into `aura_points` in enabled.toml / load_order.toml / family_state.toml and
# starts the option «pe» as the old mod was. Its content is the option feature features\pe\. Its old names keep
# working: the resource stamina_points.pe (alias), the commands CMND_STAMINAPOINTS_* (aliases), the rule flags
# stamina_points.cost_pct / armour_free (read too) and its ids (`[[alias]]` of
# features\pe\content\rules\field_clips\tired.toml).
[[merged]]
id = "stamina_points"
version = "1.2.3"
option = "pe"

# Other mods read the pools and the PE through the framework (VRFW.resource.* on aura_points.peg / aura_points.sp /
# aura_points.pe, the answers' resource()), the tables below in their native answers / extra slot rules
# (`aura_points/AuraPoints.Pair`…), the commands CMND_AURAPOINTS_PEG / _PEG_INFO / _STAMINA / _STAMINA_MAX /
# _ACTIVE_PARTS from their game Lua, add their PE drain factors (VRFW.resource.set_mult) and half-time bonuses
# (resource:aura_points.pe:half_time), and give their inputs as rule flags (aura_points.free_peg / free_sp /
# cost_pct.<hdl> / exempt.<hdl> / armour_free.<hdl> / sp_start.<aura id>: scripts\aura_points.lua,
# features\pe\scripts\stamina.lua). Resource.OffPitch: the battery-out players for the framework's OffPitch rule.
[exports]
functions = []
keys = []
tables = ["AuraPoints.Aura", "AuraPoints.Player", "AuraPoints.Pair", "AuraPoints.Team", "AuraPoints.StaminaAura", "AuraPoints.StaminaPlayer", "AuraPoints.StaminaTeam", "Resource.OffPitch"]
# the PE HUD graft keeps the EVT_PE_* globals of Inazuma Fantasy's stamina_hud (the PEG / SP bar sits under it by them)
# game_lua: AuraPoints_Stamina = the player header's PE piece, its table Plate and function PlatePe
# (assets\lua\_all\aura_points_stamina_plate.lua)
game_lua = ["AuraPoints_Hud", "AuraPoints_Stamina"]

# A MODULE of Character Reforged (owner request 2026-10-14, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 40
