schema = "VRFW.text_key/1"
# Texts of «Aura Points» (mod aura_points, 2026-10-14; with the mod Stamina Points merged in on 2026-10-16) (format:
# docs/framework/types/text.md): the «Mods» screen's name and description and the option rows of options.toml. A
# language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Keshin, keshin armours and totems run on points instead of time, as in Chrono Stone and Galaxy. Each player has a fighting-spirit pool (PEG) for each keshin and an SP bar for each totem for the whole match: summoning is free and has no time limit, the keshin's or totem's own special move costs its points instead of tension, an armour drains its keshin's PEG while it is worn, and an empty pool sends the spirit away for the rest of the match. A purple PEG bar (blue for SP) shows under the controlled player's face. Every player gets a stamina bar (GP) for the whole match, as in Chrono Stone: running and above all dashing spend it, Physical makes it last longer, half-time gives some back, and an exhausted player slows down, cannot dash and staggers. A sprint strip drawn over the GP bar empties fast while he dashes; once it is empty he cannot dash for 5 seconds while it recharges, never above the GP fill. Half-time gives back 30 % of the GP, and each half of extra time 25 %. Each character's GP is his Inazuma Eleven GO Galaxy value, growing with his level. A miximax has no time limit and does not spend the hyper gauge: it burns GP faster and ends at 0; a keshin or an armour stops the drain while it is out and costs GP when it ends. A yellow bar shows under the controlled player's face. In the mod's settings PEG, SP and GP can each be switched off (that part keeps the game's own rules). Without this mod they keep the game's own timers. Without this mod there is no GP."
option_peg = "Keshin spend points, not time"
option_peg_help = "On: keshin and armours run on PEG pools. Off: the game's timers. Applies after restarting the game."
option_sp = "Totems spend points, not time"
option_sp_help = "On: totems run on SP bars. Off: the game's timers. Applies after restarting the game."
option_pe = "Stamina bar for every player"
option_pe_help = "On: every player has GP for the whole match. Off: no GP, as in the game. Applies after restarting the game."

[es.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Los keshin, las armaduras de keshin y los tótems funcionan con puntos en lugar de tiempo, como en Chrono Stone y Galaxy. Cada jugador tiene una reserva de puntos de espíritu guerrero (PEG) por keshin y una barra de SP por tótem para todo el partido: invocar es gratis y no tiene límite de tiempo, la supertécnica propia del keshin o del tótem gasta sus puntos en lugar de tensión, la armadura consume el PEG de su keshin mientras la lleva y, con la reserva vacía, el espíritu se va hasta el final del partido. Una barra morada de PEG (azul para SP) aparece bajo la cara del jugador controlado. Cada jugador tiene una barra de aguante (PE) para todo el partido, como en Chrono Stone: correr y sobre todo esprintar la gastan, el Físico la hace durar más, el descanso devuelve una parte y un jugador agotado va más lento, no puede esprintar y se tambalea. Una franja de sprint sobre la barra de PE se vacía deprisa al esprintar; vacía, no puede esprintar durante 5 segundos mientras se recarga, nunca por encima de los PE. El descanso devuelve un 30 % de los PE y cada parte de la prórroga un 25 %. Los PE de cada personaje son su valor de Inazuma Eleven GO Galaxy y crecen con su nivel. Un miximax no tiene límite de tiempo ni gasta la barra hiperdimensional: consume PE más deprisa y termina a 0 PE; un keshin o una armadura detienen el gasto mientras están fuera y cuestan PE al terminar. Una barra amarilla aparece bajo la cara del jugador controlado. En los ajustes del mod se pueden desactivar por separado los PEG, los SP y los PE (esa parte vuelve a las reglas del juego). Sin este mod siguen con el tiempo del juego. Sin este mod no hay PE."
option_peg = "Keshin: gastan puntos, no tiempo"
option_peg_help = "Activado: keshin y armaduras usan PEG. Desactivado: el tiempo del juego. Se aplica al reiniciar el juego."
option_sp = "Tótems: gastan puntos, no tiempo"
option_sp_help = "Activado: los tótems usan SP. Desactivado: el tiempo del juego. Se aplica al reiniciar el juego."
option_pe = "Barra de resistencia de cada jugador"
option_pe_help = "Activado: cada jugador tiene PE todo el partido. Desactivado: sin PE, como el juego. Se aplica al reiniciar el juego."

[fr.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Les keshin, les armures de keshin et les totems fonctionnent avec des points au lieu du temps, comme dans Chrono Stone et Galaxy. Chaque joueur a une réserve de points d'esprit guerrier (PG) par keshin et une barre de SP par totem pour tout le match : invoquer est gratuit et sans limite de temps, la technique propre du keshin ou du totem coûte ses points au lieu de la tension, une armure consomme le PG de son keshin tant qu'elle est portée, et une réserve vide renvoie l'esprit jusqu'à la fin du match. Une barre violette (bleue pour les SP) s'affiche sous le visage du joueur contrôlé. Chaque joueur a une barre d'endurance (PE) pour tout le match, comme dans Chrono Stone : courir et surtout sprinter la vident, le Physique la fait durer plus longtemps, la mi-temps en rend une partie et un joueur épuisé ralentit, ne peut plus sprinter et titube. Une bande de sprint par-dessus la barre de PE se vide vite quand il sprinte ; vide, il ne peut plus sprinter pendant 5 secondes, le temps qu'elle se recharge, jamais au-dessus des PE. La mi-temps rend 30 % des PE, et chaque mi-temps de la prolongation 25 %. Les PE de chaque personnage sont sa valeur d'Inazuma Eleven GO Galaxy et augmentent avec son niveau. Un miximax n'a pas de limite de temps et ne coûte pas la jauge hyperdimensionnelle : il brûle les PE plus vite et s'arrête à 0 ; un keshin ou une armure arrête la dépense tant qu'il est sorti et coûte des PE à la fin. Une barre jaune s'affiche sous le visage du joueur contrôlé. Dans les réglages du mod, les PG, les SP et les PE se désactivent séparément (cette partie reprend les règles du jeu). Sans ce mod, ils gardent le temps du jeu. Sans ce mod, il n'y a pas de PE."
option_peg = "Points de keshin (PG)"
option_peg_help = "Activé : keshin et armures utilisent des PG. Désactivé : le temps du jeu. Appliqué au redémarrage du jeu."
option_sp = "Points de totem (SP)"
option_sp_help = "Activé : les totems utilisent des SP. Désactivé : le temps du jeu. Appliqué au redémarrage du jeu."
option_pe = "Endurance (PE)"
option_pe_help = "Activé : chaque joueur a des PE pour tout le match. Désactivé : pas de PE. Appliqué au redémarrage du jeu."

[de.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Keshin, Keshin-Rüstungen und Totems laufen mit Punkten statt mit Zeit, wie in Chrono Stone und Galaxy. Jeder Spieler hat für das ganze Spiel einen Kampfgeist-Vorrat (KGP) pro Keshin und einen SP-Balken pro Totem: Beschwören ist gratis und ohne Zeitlimit, die eigene Spezialtechnik des Keshin oder Totems kostet seine Punkte statt Spannung, eine Rüstung verbraucht die KGP ihres Keshin, solange sie getragen wird, und ein leerer Vorrat schickt den Geist bis zum Spielende fort. Ein violetter Balken (blau für SP) erscheint unter dem Gesicht des gesteuerten Spielers. Jeder Spieler hat für das ganze Spiel einen Ausdauerbalken (GP), wie in Chrono Stone: Laufen und vor allem Sprinten verbrauchen ihn, Physis lässt ihn länger halten, die Halbzeit gibt einen Teil zurück, und ein erschöpfter Spieler wird langsamer, kann nicht sprinten und taumelt. Ein Sprintstreifen über dem GP-Balken leert sich beim Sprinten schnell; ist er leer, kann er 5 Sekunden lang nicht sprinten, während er sich auflädt, nie über die GP hinaus. Die Halbzeit gibt 30 % der GP zurück, jede Hälfte der Verlängerung 25 %. Die GP jeder Figur sind ihr Wert aus Inazuma Eleven GO Galaxy und wachsen mit ihrem Level. Ein Miximax hat kein Zeitlimit und kostet keine Hyperdimensions-Leiste: Er verbraucht GP schneller und endet bei 0; ein Keshin oder eine Rüstung stoppt den Verbrauch, solange er draußen ist, und kostet GP, wenn er endet. Ein gelber Balken erscheint unter dem Gesicht des gesteuerten Spielers. In den Einstellungen der Mod lassen sich KGP, SP und GP einzeln abschalten (dieser Teil folgt dann den Regeln des Spiels). Ohne diese Mod behalten sie die Zeit des Spiels. Ohne diese Mod gibt es keine GP."
option_peg = "Keshin-Punkte (KGP)"
option_peg_help = "An: Keshin und Rüstungen nutzen KGP. Aus: die Zeit des Spiels. Gilt nach einem Neustart des Spiels."
option_sp = "Totem-Punkte (SP)"
option_sp_help = "An: Totems nutzen SP. Aus: die Zeit des Spiels. Gilt nach einem Neustart des Spiels."
option_pe = "Ausdauer (GP)"
option_pe_help = "An: jeder Spieler hat GP für das ganze Spiel. Aus: keine GP. Gilt nach einem Neustart des Spiels."

[it.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Keshin, armature keshin e totem funzionano a punti invece che a tempo, come in Chrono Stone e Galaxy. Ogni giocatore ha una riserva di punti spirito guerriero (PSG) per keshin e una barra SP per totem per tutta la partita: evocare è gratis e senza limite di tempo, la tecnica propria del keshin o del totem costa i suoi punti invece della tensione, un'armatura consuma il PSG del suo keshin finché è indossata e una riserva vuota manda via lo spirito fino alla fine della partita. Una barra viola (blu per gli SP) appare sotto il volto del giocatore controllato. Ogni giocatore ha una barra di resistenza (PE) per tutta la partita, come in Chrono Stone: correre e soprattutto scattare la consumano, il Fisico la fa durare di più, l'intervallo ne restituisce una parte e un giocatore esausto rallenta, non può scattare e barcolla. Una striscia di scatto sopra la barra dei PE si svuota in fretta quando scatta; vuota, non può scattare per 5 secondi mentre si ricarica, mai oltre i PE. L'intervallo restituisce il 30 % dei PE e ogni tempo supplementare il 25 %. I PE di ogni personaggio sono il suo valore di Inazuma Eleven GO Galaxy e crescono con il suo livello. Un miximax non ha limite di tempo e non consuma la barra iperdimensionale: brucia PE più in fretta e finisce a 0; un keshin o un'armatura fermano il consumo finché sono fuori e costano PE quando finiscono. Una barra gialla appare sotto il volto del giocatore controllato. Nelle impostazioni della mod PSG, SP e PE si disattivano separatamente (quella parte torna alle regole del gioco). Senza questa mod mantengono il tempo del gioco. Senza questa mod non ci sono PE."
option_peg = "Punti keshin (PSG)"
option_peg_help = "Attivo: keshin e armature usano PSG. Disattivo: il tempo del gioco. Si applica al riavvio del gioco."
option_sp = "Punti totem (SP)"
option_sp_help = "Attivo: i totem usano SP. Disattivo: il tempo del gioco. Si applica al riavvio del gioco."
option_pe = "Resistenza (PE)"
option_pe_help = "Attivo: ogni giocatore ha PE per tutta la partita. Disattivo: niente PE. Si applica al riavvio del gioco."

[pt.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Keshin, armaduras de keshin e totens funcionam com pontos em vez de tempo, como em Chrono Stone e Galaxy. Cada jogador tem uma reserva de pontos de espírito guerreiro (PEG) por keshin e uma barra de SP por totem para toda a partida: invocar é grátis e sem limite de tempo, a técnica própria do keshin ou do totem gasta os seus pontos em vez de tensão, uma armadura consome o PEG do seu keshin enquanto é usada e, com a reserva vazia, o espírito vai embora até ao fim da partida. Uma barra roxa (azul para SP) aparece sob o rosto do jogador controlado. Cada jogador tem uma barra de resistência (PE) para toda a partida, como em Chrono Stone: correr e sobretudo arrancar gastam-na, o Físico fá-la durar mais, o intervalo devolve uma parte e um jogador esgotado fica mais lento, não pode arrancar e cambaleia. Uma faixa de arranque sobre a barra de PE esvazia depressa ao arrancar; vazia, não pode arrancar durante 5 segundos enquanto recarrega, nunca acima dos PE. O intervalo devolve 30 % dos PE e cada parte do prolongamento 25 %. Os PE de cada personagem são o seu valor de Inazuma Eleven GO Galaxy e crescem com o seu nível. Um miximax não tem limite de tempo nem gasta a barra hiperdimensional: consome PE mais depressa e termina a 0; um keshin ou uma armadura param o gasto enquanto estão fora e custam PE ao terminar. Uma barra amarela aparece sob o rosto do jogador controlado. Nas definições do mod, PEG, SP e PE desligam-se em separado (essa parte volta às regras do jogo). Sem este mod mantêm o tempo do jogo. Sem este mod não há PE."
option_peg = "Pontos de keshin (PEG)"
option_peg_help = "Ligado: keshin e armaduras usam PEG. Desligado: o tempo do jogo. Aplica-se ao reiniciar o jogo."
option_sp = "Pontos de totem (SP)"
option_sp_help = "Ligado: os totens usam SP. Desligado: o tempo do jogo. Aplica-se ao reiniciar o jogo."
option_pe = "Resistência (PE)"
option_pe_help = "Ligado: cada jogador tem PE para toda a partida. Desligado: sem PE. Aplica-se ao reiniciar o jogo."

[ja.new]
mod_name = "Spirit & Stamina Points"
mod_description = "化身・化身アームド・ソウルが、クロノ・ストーンやギャラクシーのように時間ではなくポイントで動く。各選手は試合を通して化身ごとにファイティングスピリット（FSP）、ソウルごとにSPを持つ：召喚は無料で時間制限なし、化身やソウル自身の必殺技はテンションの代わりにそのポイントを消費、アームド中は化身のFSPが減り続け、空になると試合終了まで戻らない。操作中の選手の顔の下に紫のFSPバー（SPは青）が表示される。クロノ・ストーンのように、各選手は試合を通してスタミナ（GP）ゲージを持つ：走る、特にダッシュで減り、フィジカルが高いほど長持ちし、ハーフタイムで一部回復し、ばてた選手は遅くなりダッシュできずふらつく。GPバーの上のダッシュゲージはダッシュ中に素早く減り、空になると回復する5秒間はダッシュできず、GPを超えては回復しない。ハーフタイムでGPが30%、延長戦の前半・後半の前にそれぞれ25%回復する。各キャラのGPはイナズマイレブンGOギャラクシーの値で、レベルとともに伸びる。ミキシマックスは時間制限がなく、ハイパーディメンションゲージを使わない：GPを速く消費し、0で終わる。化身やアームドは出ている間は消費を止め、終わるときにGPを払う。操作中の選手の顔の下に黄色いゲージが表示される。MODの設定でFSP・SP・GPを個別にオフにできる（その部分はゲーム本来のルールに戻る）。このMODがなければゲーム本来の時間制のまま。このMODがなければGPはない。"
option_peg = "化身ポイント（FSP）"
option_peg_help = "オン：化身とアームドはFSPで動く。オフ：ゲーム本来の時間制。ゲーム再起動後に反映。"
option_sp = "ソウルポイント（SP）"
option_sp_help = "オン：ソウルはSPで動く。オフ：ゲーム本来の時間制。ゲーム再起動後に反映。"
option_pe = "スタミナ（GP）"
option_pe_help = "オン：全選手が試合を通してGPを持つ。オフ：GPなし。ゲーム再起動後に反映。"

[zh_hans.new]
mod_name = "Spirit & Stamina Points"
mod_description = "化身、化身铠甲与灵魂改用点数而非时间运作，如同《时空之石》和《银河》。每名球员整场比赛每个化身拥有一份斗志点数（FSP），每个灵魂一条SP：召唤免费且没有时间限制，化身或灵魂自身的必杀技消耗其点数而非气势，铠甲穿着期间持续消耗其化身的FSP，点数用尽后该灵魂直到比赛结束都不会回来。操控球员的头像下方显示紫色FSP条（SP为蓝色）。如同《时空之石》，每名球员整场比赛拥有一条体力（GP）条：奔跑尤其是冲刺会消耗它，体格越高越持久，中场休息恢复一部分，筋疲力尽的球员会变慢、无法冲刺并踉跄。体力条上的冲刺条在冲刺时迅速减少，耗尽后有5秒恢复时间，期间无法冲刺，且不会超过体力。中场休息恢复30%的GP，加时赛上下半场开始前各恢复25%。每个角色的GP取自《闪电十一人GO 银河》的数值，并随等级成长。混合最大化没有时间限制且不消耗超次元槽：它更快消耗GP，归零时结束；化身或铠甲在场时停止消耗，结束时扣除GP。操控球员的头像下方显示黄色条。可在模组设置中分别关闭FSP、SP与GP（该部分恢复游戏原本的规则）。没有此模组时仍按游戏原本的时间运作。没有此模组时没有GP。"
option_peg = "化身点数（FSP）"
option_peg_help = "开启：化身与铠甲使用FSP。关闭：游戏原本的计时。重启游戏后生效。"
option_sp = "灵魂点数（SP）"
option_sp_help = "开启：灵魂使用SP。关闭：游戏原本的计时。重启游戏后生效。"
option_pe = "体力（GP）"
option_pe_help = "开启：每名球员整场比赛拥有GP。关闭：没有GP。重启游戏后生效。"

[zh_hant.new]
mod_name = "Spirit & Stamina Points"
mod_description = "化身、化身鎧甲與靈魂改用點數而非時間運作，如同《時空之石》和《銀河》。每名球員整場比賽每個化身擁有一份鬥志點數（FSP），每個靈魂一條SP：召喚免費且沒有時間限制，化身或靈魂自身的必殺技消耗其點數而非氣勢，鎧甲穿著期間持續消耗其化身的FSP，點數用盡後該靈魂直到比賽結束都不會回來。操控球員的頭像下方顯示紫色FSP條（SP為藍色）。如同《時空之石》，每名球員整場比賽擁有一條體力（GP）條：奔跑尤其是衝刺會消耗它，體格越高越持久，中場休息恢復一部分，筋疲力盡的球員會變慢、無法衝刺並踉蹌。體力條上的衝刺條在衝刺時迅速減少，耗盡後有5秒恢復時間，期間無法衝刺，且不會超過體力。中場休息恢復30%的GP，延長賽上下半場開始前各恢復25%。每個角色的GP取自《閃電十一人GO 銀河》的數值，並隨等級成長。混合最大化沒有時間限制且不消耗超次元槽：它更快消耗GP，歸零時結束；化身或鎧甲在場時停止消耗，結束時扣除GP。操控球員的頭像下方顯示黃色條。可在模組設定中分別關閉FSP、SP與GP（該部分恢復遊戲原本的規則）。沒有此模組時仍按遊戲原本的時間運作。沒有此模組時沒有GP。"
option_peg = "化身點數（FSP）"
option_peg_help = "開啟：化身與鎧甲使用FSP。關閉：遊戲原本的計時。重啟遊戲後生效。"
option_sp = "靈魂點數（SP）"
option_sp_help = "開啟：靈魂使用SP。關閉：遊戲原本的計時。重啟遊戲後生效。"
option_pe = "體力（GP）"
option_pe_help = "開啟：每名球員整場比賽擁有GP。關閉：沒有GP。重啟遊戲後生效。"
