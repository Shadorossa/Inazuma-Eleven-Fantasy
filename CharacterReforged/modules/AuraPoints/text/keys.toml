schema = "VRFW.text_key/1"
# Texts of «Aura Points» (mod aura_points, 2026-10-14) (format: docs/framework/types/text.md): the «Mods» screen's name
# and description. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Aura Points"
mod_description = "Keshin, keshin armours and totems run on points instead of time, as in Chrono Stone and Galaxy. Each player has a fighting-spirit pool (PEG) for each keshin and an SP bar for each totem for the whole match: summoning is free and has no time limit, the keshin's or totem's own special move costs its points instead of tension, an armour drains its keshin's PEG while it is worn, and an empty pool sends the spirit away for the rest of the match. A purple PEG bar (blue for SP) shows under the controlled player's face. Without this mod they keep the game's own timers."

[es.new]
mod_name = "Aura Points"
mod_description = "Los keshin, las armaduras de keshin y los tótems funcionan con puntos en lugar de tiempo, como en Chrono Stone y Galaxy. Cada jugador tiene una reserva de puntos de espíritu guerrero (PEG) por keshin y una barra de SP por tótem para todo el partido: invocar es gratis y no tiene límite de tiempo, la supertécnica propia del keshin o del tótem gasta sus puntos en lugar de tensión, la armadura consume el PEG de su keshin mientras la lleva y, con la reserva vacía, el espíritu se va hasta el final del partido. Una barra morada de PEG (azul para SP) aparece bajo la cara del jugador controlado. Sin este mod siguen con el tiempo del juego."

[fr.new]
mod_name = "Aura Points"
mod_description = "Les keshin, les armures de keshin et les totems fonctionnent avec des points au lieu du temps, comme dans Chrono Stone et Galaxy. Chaque joueur a une réserve de points d'esprit guerrier (PG) par keshin et une barre de SP par totem pour tout le match : invoquer est gratuit et sans limite de temps, la technique propre du keshin ou du totem coûte ses points au lieu de la tension, une armure consomme le PG de son keshin tant qu'elle est portée, et une réserve vide renvoie l'esprit jusqu'à la fin du match. Une barre violette (bleue pour les SP) s'affiche sous le visage du joueur contrôlé. Sans ce mod, ils gardent le temps du jeu."

[de.new]
mod_name = "Aura Points"
mod_description = "Keshin, Keshin-Rüstungen und Totems laufen mit Punkten statt mit Zeit, wie in Chrono Stone und Galaxy. Jeder Spieler hat für das ganze Spiel einen Kampfgeist-Vorrat (KGP) pro Keshin und einen SP-Balken pro Totem: Beschwören ist gratis und ohne Zeitlimit, die eigene Spezialtechnik des Keshin oder Totems kostet seine Punkte statt Spannung, eine Rüstung verbraucht die KGP ihres Keshin, solange sie getragen wird, und ein leerer Vorrat schickt den Geist bis zum Spielende fort. Ein violetter Balken (blau für SP) erscheint unter dem Gesicht des gesteuerten Spielers. Ohne diese Mod behalten sie die Zeit des Spiels."

[it.new]
mod_name = "Aura Points"
mod_description = "Keshin, armature keshin e totem funzionano a punti invece che a tempo, come in Chrono Stone e Galaxy. Ogni giocatore ha una riserva di punti spirito guerriero (PSG) per keshin e una barra SP per totem per tutta la partita: evocare è gratis e senza limite di tempo, la tecnica propria del keshin o del totem costa i suoi punti invece della tensione, un'armatura consuma il PSG del suo keshin finché è indossata e una riserva vuota manda via lo spirito fino alla fine della partita. Una barra viola (blu per gli SP) appare sotto il volto del giocatore controllato. Senza questa mod mantengono il tempo del gioco."

[pt.new]
mod_name = "Aura Points"
mod_description = "Keshin, armaduras de keshin e totens funcionam com pontos em vez de tempo, como em Chrono Stone e Galaxy. Cada jogador tem uma reserva de pontos de espírito guerreiro (PEG) por keshin e uma barra de SP por totem para toda a partida: invocar é grátis e sem limite de tempo, a técnica própria do keshin ou do totem gasta os seus pontos em vez de tensão, uma armadura consome o PEG do seu keshin enquanto é usada e, com a reserva vazia, o espírito vai embora até ao fim da partida. Uma barra roxa (azul para SP) aparece sob o rosto do jogador controlado. Sem este mod mantêm o tempo do jogo."

[ja.new]
mod_name = "Aura Points"
mod_description = "化身・化身アームド・ソウルが、クロノ・ストーンやギャラクシーのように時間ではなくポイントで動く。各選手は試合を通して化身ごとにファイティングスピリット（FSP）、ソウルごとにSPを持つ：召喚は無料で時間制限なし、化身やソウル自身の必殺技はテンションの代わりにそのポイントを消費、アームド中は化身のFSPが減り続け、空になると試合終了まで戻らない。操作中の選手の顔の下に紫のFSPバー（SPは青）が表示される。このMODがなければゲーム本来の時間制のまま。"

[zh_hans.new]
mod_name = "Aura Points"
mod_description = "化身、化身铠甲与灵魂改用点数而非时间运作，如同《时空之石》和《银河》。每名球员整场比赛每个化身拥有一份斗志点数（FSP），每个灵魂一条SP：召唤免费且没有时间限制，化身或灵魂自身的必杀技消耗其点数而非气势，铠甲穿着期间持续消耗其化身的FSP，点数用尽后该灵魂直到比赛结束都不会回来。操控球员的头像下方显示紫色FSP条（SP为蓝色）。没有此模组时仍按游戏原本的时间运作。"

[zh_hant.new]
mod_name = "Aura Points"
mod_description = "化身、化身鎧甲與靈魂改用點數而非時間運作，如同《時空之石》和《銀河》。每名球員整場比賽每個化身擁有一份鬥志點數（FSP），每個靈魂一條SP：召喚免費且沒有時間限制，化身或靈魂自身的必殺技消耗其點數而非氣勢，鎧甲穿著期間持續消耗其化身的FSP，點數用盡後該靈魂直到比賽結束都不會回來。操控球員的頭像下方顯示紫色FSP條（SP為藍色）。沒有此模組時仍按遊戲原本的時間運作。"
