schema = "VRFW.flag/1"
# Transforming Items › the save flag of the «Piedra Alius» (content/items/alius_stone.toml, [[VRFW.ItemTransform]]
# unlock.flag): the VR-Framework sets it when the Dark Emperors' Crónica match is won (unlock.cleared), and the
