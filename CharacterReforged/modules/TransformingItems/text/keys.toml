# Texts of Transforming Items: the mod's name and description on the Mods screen (format of the text engine:
# docs/framework/types/text.md). «Transforming Items» is not translated. A language missing here falls back to English.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Transformation Items"
mod_description = "Items that change a player's look while he wears them. Alius Crystal: a player who took the Alius stone (Dark Emperors, Royal Academy Redux, the Alius Academy players, classic versions) equips it and takes his Alius look, stats and moves; remove it and he is back. It can be equipped once the Dark Emperors are beaten in Chronicle Mode."

[es.new]
mod_name = "Transformation Items"
mod_description = "Objetos que cambian la apariencia de un jugador mientras los lleva. Piedra Alius: un jugador que tomó la piedra Alius (Emperadores Oscuros, Royal Academy Redux, los jugadores de la Academia Alius, versión clásica) se la equipa y toma su apariencia Alius, con sus estadísticas y técnicas; al quitársela vuelve a ser él. Se puede equipar tras ganar a los Emperadores Oscuros en la Crónica."

[fr.new]
mod_name = "Transformation Items"
mod_description = "Des objets qui changent l'apparence d'un joueur tant qu'il les porte. Cristal Alius : un joueur qui a pris la pierre Alius (Empereurs noirs, Nouvelle Royal Ac., les joueurs de l'Académie Alius, version classique) l'équipe et prend son apparence Alius, avec ses stats et ses techniques ; en l'enlevant, il redevient lui-même. Il s'équipe après avoir battu les Empereurs noirs dans le mode Chroniques."

[de.new]
mod_name = "Transformation Items"
mod_description = "Gegenstände, die das Aussehen eines Spielers ändern, solange er sie trägt. Alius-Stein: Ein Spieler, der den Alius-Stein nahm (Dark Emperors, Royal Academy Redux, die Spieler der Alius-Akademie, klassische Version), rüstet ihn aus und nimmt seine Alius-Gestalt an, mit ihren Werten und Techniken; legt er ihn ab, ist er wieder er selbst. Ausrüstbar, sobald die Dark Emperors im Chronik-Modus besiegt sind."

[it.new]
mod_name = "Transformation Items"
mod_description = "Oggetti che cambiano l'aspetto di un giocatore finché li indossa. Pietra di Alius: un giocatore che prese la pietra di Alius (Dark Emperors, Absolute Royal, i giocatori dell'Accademia Alius, versione classica) la equipaggia e prende il suo aspetto Alius, con le sue statistiche e tecniche; togliendola torna se stesso. Si può equipaggiare dopo aver battuto i Dark Emperors nella modalità Cronache."

[pt.new]
mod_name = "Transformation Items"
mod_description = "Objetos que mudam a aparência de um jogador enquanto os usa. Meteorito Alien: um jogador que tomou a pedra Alius (Imperadores da Escuridão, Instituto Imperial Verdadeiro, os jogadores da Academia Alius, versão clássica) equipa-o e ganha a sua aparência Alius, com os seus atributos e técnicas; ao tirá-lo volta a ser ele. Pode ser equipado depois de vencer os Imperadores da Escuridão no modo Crónica."

[ja.new]
mod_name = "Transformation Items"
mod_description = "装備している間、選手の見た目を変えるアイテム。エイリアストーン：エイリア石を手にした選手（ダークエンペラーズ、真・帝国学園、エイリア学園の選手、クラシック版）が装備すると、エイリアの姿になり、その能力値と技も変わる。外せば元に戻る。クロニクルモードでダークエンペラーズに勝つと装備できる。"

[zh_hans.new]
mod_name = "Transformation Items"
mod_description = "装备期间会改变球员外观的道具。宇宙晶石：曾使用外星石的球员（暗黑帝王、真·帝国、外星学园的球员，经典版）装备后会变为外星形态，能力值和技能也随之改变；卸下即恢复原样。在编年史模式中战胜暗黑帝王后即可装备。"

[zh_hant.new]
mod_name = "Transformation Items"
mod_description = "裝備期間會改變球員外觀的道具。宇宙晶石：曾使用外星石的球員（暗黑帝王、真·帝國、外星學園的球員，經典版）裝備後會變為外星形態，能力值和技能也隨之改變；卸下即恢復原樣。在編年史模式中戰勝暗黑帝王後即可裝備。"
