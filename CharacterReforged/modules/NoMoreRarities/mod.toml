id = "no_more_rarities"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "No More Rarities"
version = "1.0.14"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Every normal player is a 5★ Legend, as in the classic Inazuma Eleven games: the 1★-4★ rarities are gone (no rarity stat bonus, no rarity-up or fusion), every spirit source gives the 5★ card, the «Rarity» filter lists only the special cards (normal players always pass), and a save duplicated into another slot, or a save when it is loaded, has every normal card at 5★ (a backup of the save is kept before its first change); the normal cards show no rarity art nor rarity title: every normal card and plate is coloured by the player's position (goalkeeper gold, defender blue, midfielder green, forward red, the same as the player header), and so are the spirit rows of the drop lists; the coach card is white and the managers' cards pink. Héroe and Diamante cards stay as they are, and a mode's own save (INAROGUE) keeps its players' rarities and their look. One card per character (no duplicates, a spirit drop recruited as the player) is the module New Recruitment. Works with the VR-Framework and Character Reforged."
priority = 0
tags = ["Gameplay", "Characters"]
updated = "2026-10-15"
# This mod's own names (TOML keys [NoMoreRarities.X], Lua NoMoreRarities.X, commands CMND_NOMORERARITIES_*); never VRFW.
prefix = "NoMoreRarities"
folder = "NoMoreRarities"
# Split out of Inazuma Fantasy on 2026-10-14 (owner request: «Aparta de IF el eliminar las rarezas (0-4) e impedir los
# jugadores duplicados a un mod nuevo con base de CharacterReforged»; docs/refactor/aura-mods-split.md «No More
# Rarities», design docs/game/characters/rarity-removal.md). A plugin of Character Reforged: its duplicate-players hook
# runs this mod's policy (content\duplicate_rules\). 1.0.14 (2026-10-15, owner request «aparta el tema del límite de
# personajes de 1 a un mod nuevo de "NewRecruitment"»): the one-card-per-character limit and the spirit-free recruitment
# (duplicate merge, owned players out of the drops, spirit drop = the player, no spirit screen / «!», the spirit purge of
# a duplicated save and its save adjust action, the team planner's owned rule) moved to the module New Recruitment
# (modules\NewRecruitment, docs/game/mods/new-recruitment.md); this mod keeps the rarity removal and the position look.
# Standard mod layout (docs/framework/mod-layout.md):
#   content\duplicate_rules\no_more_rarities.toml   [CharacterReforged.DuplicateRules.no_more_rarities]: every normal
#                                     card -> rarity 4 on a duplicated save; apply_on_load: the same on every load of a
#                                     player slot (a backup of the save first, once per save; Character Reforged >= 1.7.8)
#   content\rarities\rarity.toml      the rarity set without the 1★-4★ rarities (normal, growing, advanced, top)
#   content\params\rarity_removal.toml  no rarity stat bonus, the spirit weights on the 5★ card (GENERATED)
#   content\base_tables\**            every spirit source gives the 5★ card: drops, fixed rewards, gifts, Players
#                                     Universe, the spirit shop (GENERATED by research/scripts/no_more_rarities_build.py
#                                     from the game's rows)
#   content\game\rarity_filter.toml   the «Rareza» tab of the filter windows lists from config.toml [rarity_filter]
#                                     first_listed_rarity on (default 5: the normal cards always pass, graft
#                                     no_more_rarities_filter)
#   content\team_planner\rule.toml    Utilities' team planner: the cards drawn as the 5★ card
#   content\images\** + assets\lua\_all\no_more_rarities_card_look.lua   the normal cards coloured by POSITION
#                                     (1.0.7; taken out of Inazuma Fantasy's position_cards, owner rule 2026-10-14: the
#                                     position colours are this mod's), chosen at run time outside a reserved slot (a
#                                     mode's own save: INAROGUE keeps its rarities exactly as in the game): a rarity 0-4
#                                     card is drawn with its position's frame 16 GK / 17 DF / 18 MF / 19 FW (NEW sprites
#                                     derived from the game's gold *_04, blue *_02, plain green *_01 and element-fire red
#                                     *_type_*03 cards; on the formation layers the slot's position), the status / personal
#                                     plates with the game's plate of the position (the FW personal plate
#                                     status_chr_plate01_19 is NEW), the rarity titles 0-4 with a transparent sprite; one
#                                     shared helper NoMoreRarities.PositionColour(card) (POSITION_LOOKS); the game's own
#                                     rarity sprites are never repainted (GENERATED by research/scripts/no_more_rarities_build.py);
#                                     1.0.11: the staff cards (Inazuma Fantasy's staff colours): the coach card white (frame
#                                     20), the managers' pink (frame 21), the leader card commands too (STAFF_LOOKS; art
#                                     derived from the game's blue card at build); the filter goes on when the engine
#                                     registers the menu command (before the first card draw: «Plantilla de equipo»'s
#                                     callbacks are redefined by a later patch, so the OnInit install never ran there)
#   content\menus\player_header.toml + assets\lua\_all\no_more_rarities_header.lua   the player page's header band
#                                     in the player's POSITION colour (a band colour of Character Reforged's host
#                                     character_reforged.header_band; special cards keep their rarity look; without
#                                     this mod the band keeps the retail rarity look); the header's rarity title only
#                                     for Ídolo and the rarities other mods declare (host character_reforged.header_rarity)
#   assets\lua\vs_route_town_drop_rate_list_menu\no_more_rarities_drop_list.lua + content\images\menu\10_win\**
#                                     the drop-rate list's spirit rows in the player's POSITION colour (1.0.8; the FW
#                                     band GENERATED by research/scripts/no_more_rarities_build.py)
# Grafts (research/grafts, mod = no_more_rarities): rar_dock (a hook file since 1.0.5: «Mejorar» hidden from the team
# dock's player popup through the VR-Framework's list rows, docs/framework/list-rows.md, and the opened team raised to
# 5★ when the dock opens), rar_menus (no fusion / rarity-up on the spirit and summon menus), no_more_rarities_filter
# (the filter windows' normal cards). Inazuma Fantasy rebuilds rar_menus into its own merged scripts (rebuilt_by).
# vr_framework 2.4.24: VRFW_ListRows
requires = ["vr_framework>=2.4.40", "character_reforged>=1.7.8"]
conflicts = []
loader_modules = ["lua_bridge"]
# loader 1.7.0: patches of INCLUDE'd scripts (the filter includes)
loader_min = "1.7.0"
# patch: the «Rareza» tab's list start (content\game\rarity_filter.toml)
permissions = ["patch"]

# its own content\ folders read by other mods' scripts: Character Reforged's duplicate hook (duplicate_rules) and
# Utilities' team planner (team_planner); vrfw check's layout lint accepts them (docs/framework/mod-layout.md)
[layout]
script_folders = ["duplicate_rules", "team_planner"]

# A MODULE of Character Reforged (owner request 2026-10-14, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 70

# game_lua: NoMoreRarities.HeaderBandColour = the header band's position colour (assets\lua\_all\
# no_more_rarities_header.lua), called by Character Reforged's CharacterReforged.Header.BandColour;
# NoMoreRarities.HeaderShowsRarity = the header's rarity title rule (Ídolo and mod-declared rarities only);
# NoMoreRarities.RarityRemovalApplies = whether the removal applies to the loaded save (never a reserved slot);
# NoMoreRarities.PositionColour(card) / PositionLookOfType(type) = the one position look (card frame, plates, rgb) of a
# normal card, nil = the retail look (assets\lua\_all\no_more_rarities_card_look.lua; card look, header band, drop lists);
# NoMoreRarities.NormalCardRarity() = the rarity every normal card has (4) while the removal applies, else nil (read by
# New Recruitment's spirit recruit)
[exports]
game_lua = ["NoMoreRarities.HeaderBandColour", "NoMoreRarities.HeaderShowsRarity", "NoMoreRarities.RarityRemovalApplies",
  "NoMoreRarities.PositionColour", "NoMoreRarities.PositionLookOfType", "NoMoreRarities.NormalCardRarity"]
