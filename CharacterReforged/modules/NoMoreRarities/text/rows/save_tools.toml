# No More Rarities › its action of the VR-Framework's save adjust (Options › «Ajustar save», content\save_adjust\
# no_more_rarities.toml, run by Character Reforged's scripts\save_tools.lua; docs/framework/save-adjust.md): title,
# description and result (%d = the count the action answers). The title is the confirmation line: one per value of
# the option «Cartas sin aspecto de rareza» (content\duplicate_rules\no_more_rarities.toml `save_adjust_label`; the
# first row = «Solo las normales» and the fallback). Rows of
# menu_text, read by id = crc32(row id).
schema = "VRFW.text/2"
table = "menu_text"

[[row]]
id = "no_more_rarities_save_tools_normal_rarity"
es = "Pasar a 5★ las cartas normales"
en = "Turn the normal cards into 5★ cards"
fr = "Passer les cartes normales en 5★"
de = "Normale Karten zu 5★-Karten machen"
it = "Portare a 5★ le carte normali"
pt = "Passar a 5★ as cartas normais"
ja = "通常カードを★5にする"
zh_hans = "将普通卡变为5★"
zh_hant = "將普通卡變為5★"

