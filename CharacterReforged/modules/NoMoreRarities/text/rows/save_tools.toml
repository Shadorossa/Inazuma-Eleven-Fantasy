[[row]]
id = "no_more_rarities_save_tools_normal_rarity_desc"
es = "Las cartas normales pasan a 5★. Las cartas Ídolo y Diamante cuya rareza quita el ajuste «Cartas sin aspecto de rareza» pasan a la carta 5★ de su personaje; si el club ya lo tiene, se juntan en la mejor copia."
en = "Normal cards become 5★. Idol and Diamond cards whose rarity the «Cards without rarity look» setting removes become their character's 5★ card; if the club already has him, they are merged into the best copy."
fr = "Les cartes normales passent en 5★. Les cartes Idole et Diamant dont le réglage « Raretés supprimées » retire la rareté deviennent la carte 5★ de leur personnage ; si le club l'a déjà, elles sont fusionnées dans la meilleure copie."
de = "Normale Karten werden zu 5★. Idol- und Diamantkarten, deren Seltenheit die Einstellung „Entfernte Seltenheiten“ entfernt, werden zur 5★-Karte ihres Charakters; hat der Klub ihn schon, werden sie in die beste Kopie zusammengeführt."
it = "Le carte normali diventano 5★. Le carte Idolo e Diamante la cui rarità è rimossa dall'impostazione «Rarità rimosse» diventano la carta 5★ del loro personaggio; se il club lo ha già, vengono unite nella copia migliore."
pt = "As cartas normais passam a 5★. As cartas Ídolo e Diamante cuja raridade a definição «Raridades removidas» retira passam à carta 5★ do seu personagem; se o clube já o tiver, juntam-se na melhor cópia."
ja = "通常カードは★5になります。「削除するレアリティ」で外されたアイドル・ダイヤモンドのカードはそのキャラの★5カードになり、クラブに同じキャラがいれば一番良いカードにまとめます。"
zh_hans = "普通卡变为5★。被「移除的稀有度」移除稀有度的偶像卡和钻石卡变为该角色的5★卡；若俱乐部已有该角色，则合并到最好的那张。"
zh_hant = "普通卡變為5★。被「移除的稀有度」移除稀有度的偶像卡和鑽石卡變為該角色的5★卡；若俱樂部已有該角色，則合併到最好的那張。"

