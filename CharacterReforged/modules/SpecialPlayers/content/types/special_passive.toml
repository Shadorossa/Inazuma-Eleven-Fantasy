# Special Players › the passives (kind SpecialPlayers.special_passive/1, a mod's content\special_passives\*.toml).
# A passive is a named list of blocks (content\passive_blocks\, kind SpecialPlayers.passive_block/1): its triggers,
# stack rule, reset, conditions and effects. Who has it:
#   [[SpecialPlayers.Passive]] carried_by    a GENERIC passive: every player carrying one of these game passives
#                                            (team passive slots or own passive slot) has it
#   [[SpecialPlayers.Character]]             a SPECIAL passive: every card of a character (or one card), his own
#                                            («Pasiva propia»: ONE per player, `passive = "<name>"`)
# Names: a block or passive of the same mod is written `<name>`, one of another mod `<mod id>.<name>`. A later mod's
# [[SpecialPlayers.Character]] for the same character or card replaces an earlier one (it never adds a second passive). vrfw check validates the files
# against this file; scripts\lib\special_passives.lua reads them.
schema = "VRFW.decl_schema/1"
kind = "SpecialPlayers.special_passive/1"
folder = "content/special_passives"

[entry.Passive]
doc = "a passive: a named list of blocks"
name = { type = "name", required = true, doc = "the passive's name (a-z 0-9 _), unique in its mod" }
blocks = { type = "strings", required = true, ref = "block", doc = "its blocks by name, in any order" }
carried_by = { type = "strings", default = [], ref = "passive", doc = "game passive keys: every player carrying one of them has this passive (a generic passive)" }
text = { type = "string", default = "", doc = "a text key of the declaring mod with the passive's own description (empty = the description made from its blocks)" }

[entry.Character]
doc = "the own passive («Pasiva propia») of a character (every card of his) or of one card: one passive per player"
unique = ["character", "card"]
character = { type = "string", default = "", ref = "character", doc = "a chara_base internal key (c01000010) or a mod character <mod>.<name>" }
card = { type = "string", default = "", ref = "card", doc = "instead of character: one card (its chara_param key or id)" }
passive = { type = "string", default = "", ref = "special_passive", doc = "his own passive by name (one per player)" }
passives = { type = "strings", default = [], max_items = 1, error = true, ref = "special_passive", doc = "older form: a list of one passive (more is an error: a player has one own passive; the first is used)" }
