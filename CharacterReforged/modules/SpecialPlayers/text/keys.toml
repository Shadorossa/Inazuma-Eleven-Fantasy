schema = "VRFW.text_key/1"
# Texts of «Special Players» (mod special_players) (format: docs/framework/types/text.md): the «Mods» screen's name and
# description, and the words a passive's description is built from (ModManager «Pasivas»): sentence frames, verbs and
# objects of the effects, whom (`target_*`, genitive), whose event (`by_*`, `whose_*`), what happens (`event_<trigger>`,
# `ev_<trigger>[_<outcome>]`), the conditions (`block_*`) and the value words. A language missing falls back to English.
default_lang = "en"

[en.new]
mod_name = "Special Players"
mod_description = "The custom passive becomes each player's Signature Passive: a passive of his own, declared per character by the mods, instead of one you equip. On Victory Road's board the slot always shows it and cannot be changed; matches use it. On Character Reforged's Fantasy table the custom passive button is gone. Needs Character Reforged. Adds the generic elemental passives (Wind, Forest, Fire, Mountain and Void plus: his own moves of that element ×1.15), assigned like any generic passive. Every special passive is built from reusable blocks (when, conditions, effects), edited per character in ModManager."
