id = "special_players"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Special Players"
version = "1.2.3"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "The custom passive becomes each player's Signature Passive: a passive of his own, declared per character by the mods, instead of one you equip. On Victory Road's board the slot always shows it and cannot be changed; matches use it. On Character Reforged's Fantasy table the custom passive button is gone. Adds the generic elemental passives (Wind, Forest, Fire, Mountain, Void plus: own moves of that element ×1.15), assigned like any generic passive. Every passive is built from reusable blocks (when / whose event, stacks, effects on chosen players, what nullifies it), edited per character in ModManager «Pasivas». Needs Character Reforged."
priority = 0
tags = ["Gameplay", "Characters"]
updated = "2026-10-15"
# This mod's own names (TOML keys [SpecialPlayers.X], Lua SpecialPlayers.X, commands CMND_SPECIALPLAYERS_*); never VRFW.
prefix = "SpecialPlayers"
folder = "SpecialPlayers"
# Character Reforged: the family base (its «Fantasy» skill table has no custom passive button).
requires = ["vr_framework>=2.4.73", "character_reforged>=1.7.35"]
conflicts = []
# hook: the custom passive slot's two engine readers answered natively; memory: the player's card (record) behind a
# handle; command: CMND_SPECIALPLAYERS_OWN_PASSIVE; call: the passive slot readers (the passives a player carries)
permissions = ["memory", "call", "command", "hook"]
# lua_bridge: graft special_players_board (hook files on ability_learning_board_menu and equip_six_sense_menu)
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# Layout:
#   content\types\passive_block.toml     the block types (VRFW.decl_schema/1, kind SpecialPlayers.passive_block/1):
#                                        triggers, conditions, effects and their keys; vrfw check and ModManager read it
#   content\types\special_passive.toml   the passives' format (kind SpecialPlayers.special_passive/1)
#   content\passive_blocks\*.toml        the blocks, by name (any active mod may ship this folder)
#   content\special_passives\*.toml      the passives (named lists of blocks) and who has them: carried_by game
#                                        passives, [[SpecialPlayers.Character]] per character (any active mod may ship it;
#                                        ModManager «Pasivas especiales» edits it)
#   scripts\lib\special_passives.lua     reads and checks the blocks and passives; the own passive slot of each card
#   scripts\passive_blocks.lua           the block interpreter: answers the behaviour-rule triggers the passives name
#   scripts\own_passives.lua             the own passive slot's native tables; CMND_SPECIALPLAYERS_OWN_PASSIVE
#   content\game\own_passives.toml       the engine entries of the own passive slot: SixSensePassiveId 0xE7B390 (the
#                                        slot's passive: the GamePassive block, else none) and SixSensePieceOpen
#                                        0x165EBF0 (unlock = "always"), the command
#   content\game\carried_passives.toml   the passive slot readers the interpreter asks
#   content\own_passives\*.toml          older own passive declarations of other mods (SpecialPlayers.own_passives/1),
#                                        still read
#   text\rows\own_passive.toml           the game's custom passive texts renamed «Pasiva propia» (9 languages)
#   text\keys.toml                       the block descriptions (9 languages) ModManager composes a passive's text from
#   content\techniques\element_plus.toml   the generic elemental passives «<element> plus» (name, text, buff icon),
#                                        offered in Utilities' «Configuración de pasivas» (content\passive_config\);
#                                        their power is content\special_passives\element_plus.toml
# A new game passive for an own passive slot is declared like any other: a [[passive]] row of a content\techniques\*.toml
# file.

# A MODULE of Character Reforged (owner request 2026-10-15, docs/framework/mod-families.md): the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "character_reforged"
order = 60

[exports]
functions = ["OwnPassiveOfCard"]

# its own content/ folders read only by its scripts (vrfw check's layout lint accepts them)
[layout]
script_folders = ["passive_blocks", "special_passives", "passive_config"]
