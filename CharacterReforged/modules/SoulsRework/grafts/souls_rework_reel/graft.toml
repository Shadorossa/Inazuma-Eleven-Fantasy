# Souls Rework's skill reel on the match HUD (docs/game/mods/souls-rework-design.md §5): when the user's totem uses its
# own move, a slot-machine reel under the scoreboard spins downwards through the totem's 6 skills and stops by itself
# on the rolled one (the module's scripts\souls_rework.lua rolls it and applies the result; CMND_SOULSREWORK_REEL hands
# the roll, labels and timing). Layer souls_rework_reel_row (the module's content\menus\reel.toml, 4 instances: title,
# 3 rows) in both match HUD scripts (soccer_constant_menu, soccer_battle_constant_menu). Wrappers only (OnInit,
# OnOpenLayer, Step); nothing runs at chunk load. Order 340: after BetterUI's duel readout (330).
name = "souls_rework_reel"
mod = "souls_rework"
order = 340
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInit", "OnOpenLayer", "Step"]
description = "Souls Rework: the totem's skill reel under the scoreboard"

[[files]]
stem = "soccer_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "souls_rework_reel.lua"
  marker = "SoulsRework reel"

[[files]]
stem = "soccer_battle_constant_menu"

  [[files.ops]]
  type = "append_block"
  src = "souls_rework_reel.lua"
  marker = "SoulsRework reel"
