# Souls Rework › the declaration schema of the totem data (kind SoulsRework.soul/1, any mod's content\souls\*.toml).
# scripts\souls_rework.lua reads the files of every active mod against this file (an unknown key, a wrong type or a
# value out of range leaves that entry out, with one warning); `vrfw check` validates them; ModManager's «Auras» page
# draws the totem editor from it (docs/game/mods/souls-rework-design.md §9 / §10).
#   Totem      one totem (an aura of auraType 3): its SP route (one value per level) and its 6 reel slots in order
#   Skill      one skill family of the reel: the mechanism it uses and its values per skill level (1-3)
# The level rule (points per second / duel / goal / move, the thresholds) is config.toml [levels], not data.
# A later mod's Totem of the same aura, or Skill of the same name, replaces the earlier one.
schema = "VRFW.decl_schema/1"
kind = "SoulsRework.soul/1"
folder = "content/souls"

[entry.Totem]
doc = "one totem: its SP route per level and its 6 reel slots"
aura = { type = "string", required = true, ref = "aura", doc = "the totem's aura key (wss000050) or a mod aura <mod>.<name>" }
galaxy = { type = "string", default = "", doc = "the Galaxy soul it follows (the wiki key: Lion, Ookami…); for reference only" }
name = { type = "string", default = "", ref = "text_key", doc = "text key of its name on the reel (<mod>.<key>); empty = the aura key" }
sp = { type = "ints", required = true, min = 1, max = 9999, doc = "SP at each level, level 1 first (with Aura Points: the SP bar's max at that level); its length is the totem's top level" }
roulette = { type = "strings", required = true, ref = "skill_slot", doc = "the 6 reel slots in order: \"<skill>:<level>\" (shoot_up:2) or \"<skill>\" for a skill without levels (miss)" }
lp_scale = { type = "number", default = 1.0, min = 0, max = 10, doc = "this totem's level points × this" }

[entry.Skill]
doc = "one skill family of the reel: what it does (`effect`) and its values per skill level"
name = { type = "name", required = true, doc = "the family's name (a-z 0-9 _), used by the totems' slots" }
text = { type = "string", required = true, ref = "text_key", doc = "text key of its reel label (<mod>.<key>); {level} = the skill level" }
effect = { type = "string", required = true, values = ["move_power", "point_cost", "shot_vs_keeper", "keeper_vs_shot", "level_points", "team_stamina", "team_tension", "team_stamina_tension", "move_speed", "untouchable", "knockdown", "none"], doc = "the mechanism: see [effects]" }
move_kinds = { type = "strings", default = [], values = ["shoot", "dribble", "block", "catch"], doc = "move_power: the kinds of his moves it powers (see [move_kinds])" }
values = { type = "numbers", default = [], min = -100, max = 1000, doc = "per skill level (level 1 first): the effect's percent (see [effects])" }
units = { type = "ints", default = [], min = 0, max = 100, doc = "team_tension / team_stamina_tension: tension units per skill level" }
seconds = { type = "numbers", default = [], min = 0, max = 600, doc = "per skill level: how long it lasts; empty = while the totem is out (instant effects ignore it)" }
fallback = { type = "string", default = "", doc = "team_stamina: the family used when no stamina resource exists (team_tension)" }
galaxy = { type = "string", default = "", doc = "the Galaxy skill it follows (wiki id prefix: ShootUp); for reference only" }

# ------------------------------------------------------------------------------------------------ shared data

# What each `effect` does with a skill level's `values` (v) / `units` (u) / `seconds` (s); read by the editor's help.
[effects]
move_power = "power of his moves of `move_kinds` × (1 + v / 100)"
point_cost = "his totem's SP costs × (1 − v / 100) with Aura Points (its rule flag cost_pct.<hdl>), else his tension costs"
shot_vs_keeper = "his shots against the keeper × (1 + v / 100) in the keeper duel"
keeper_vs_shot = "as keeper, the shots against him × (1 + v / 100) (v negative = weaker shots)"
level_points = "his totem's level points × (1 + v / 100)"
team_stamina = "at once: his team's stamina + v % of each player's max (no stamina resource: `fallback`)"
team_tension = "at once: his team's tension + u units"
team_stamina_tension = "at once: both, v % stamina and u tension units"
move_speed = "his run speed × (1 + v / 100) for s seconds"
untouchable = "no block battle starts against him while he holds the ball, for s seconds"
knockdown = "the nearest opponent's run speed × (1 + v / 100) for s seconds"
none = "nothing (a miss)"

# the move kinds of move_power: skill table `category` (1 shoot, 2 dribble, 3 block, 4 keeper)
[move_kinds]
shoot = { category = 1 }
dribble = { category = 2 }
block = { category = 3 }
catch = { category = 4 }
