schema = "VRFW.text_key/1"
# Texts of «Souls Rework» (mod souls_rework, 2026-10-15; format docs/framework/types/text.md): the «Mods» screen's
# name and description, the reel's skill labels ({level} = the skill level 1-3; the families of
# content\souls\skills.toml) and level badge, the level-up pop over a player (level_pop; {level} = the new level, unused by
# default), and the totems' names on the reel (between the «totem names» lines of
# [es.new] / [en.new]: written by research/scripts/souls_rework_build.py). A language missing here falls back to
# English.
default_lang = "en"

