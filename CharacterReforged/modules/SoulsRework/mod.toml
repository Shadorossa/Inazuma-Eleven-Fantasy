id = "souls_rework"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Souls Rework"
version = "0.5.1"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Totems work as the souls of Inazuma Eleven GO Galaxy. A totem gains levels (1 to 5) during the match while it is out, faster when its player wins duels or scores: with Aura Points each level raises its SP bar along the soul's Galaxy route; without it each summon lasts longer for the level reached. The totem cannot be released by hand. Its own special move spins a skill reel over the cut-in, under the scoreboard: it stops by itself on one of the soul's 6 Galaxy skills (power, SP saving, recovery, speed, invincibility, knock-down or a miss), which lasts while the totem is out. The rival's rolls apply too, without a reel. Works with the VR-Framework and Character Reforged; Aura Points is optional."
priority = 0
tags = ["Gameplay"]
updated = "2026-10-15"
# This mod's own names (TOML keys [[SoulsRework.X]], Lua SoulsRework.X, commands CMND_SOULSREWORK_*, tables
# SoulsRework.*); never VRFW.
prefix = "SoulsRework"
folder = "SoulsRework"
# Design and owner decisions: docs/game/mods/souls-rework-design.md (§0 answers 2026-10-15, §9 data, §10 editor).
# Standard mod layout (docs/framework/mod-layout.md):
#   content\types\soul.toml        the declaration schema (kind SoulsRework.soul/1) of content\souls\: the totems, the
#                                  skill families; ModManager's «Auras» totem page edits them
#   content\souls\totems.toml      one [[SoulsRework.Totem]] per totem: SP route, the 6 reel slots (written once by
#                                  research/scripts/souls_rework_build.py from the wiki export, then edited in place)
#   content\souls\skills.toml      the skill families ([[SoulsRework.Skill]]: mechanism, per-level values, seconds) and
#   config.toml                    the level rule ([levels]: thresholds, LP amounts), the reel's timing, the Aura Points / Stamina Points resources it uses
#   content\game\souls_rework.toml structs, the release-button answer, the reel and level-pop commands
#   scripts\souls_rework.lua (+ lib\) the run time; graft research/grafts/souls_rework_reel: the reel on the match HUD
#   content\menus\reel.toml        the reel's layers
#   content\menus\level_pop.toml   the level-up pop's layer; graft research/grafts/souls_rework_level_pop: «+Nv.»
#                                  over the player (plate content\images\menu\02_btl\souls_rework_pop.toml, config.toml [level_pop])
# Any mod may add totems or skill families in its own content\souls\*.toml (same kind; a later mod's entry of the same
# aura / name replaces the earlier one).
requires = ["vr_framework>=2.4.95", "character_reforged>=1.8.24"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# memory: the summon timer (+0x360 / +0x370) without Aura Points; hook: the release-button answer; commands: the reel
# and the level-up pop
permissions = ["memory", "call", "command", "hook"]

# Other mods read the levels through the table SoulsRework.Player (hdl: level, totem, no_release) and the command
# CMND_SOULSREWORK_REEL; Aura Points is used only through its exported pool (config.toml [aura_points] resource) and its
# rule flag cost_pct.<hdl>.
[exports]
functions = []
keys = ["Totem", "Skill"]
tables = ["SoulsRework.Player"]
game_lua = []

# A MODULE of Character Reforged (docs/framework/mod-families.md): listed inside Character Reforged's entry, after
# Aura Points (order 40).
[module]
of = "character_reforged"
order = 42
