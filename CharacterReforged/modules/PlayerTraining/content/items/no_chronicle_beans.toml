schema = "VRFW.item/2"
# Player Training: no training beans from Chronicle matches (owner request 2026-10-15: with the classic training the
# beans give nothing, content\game\player_training.toml «the training beans»). Mechanism: the VR-Framework's
# [[VRFW.MatchDropRemove]] (docs/framework/drops.md §6); this mod only declares the rule.
# * Categories 210: every stat bean of item_config (column 5 = 210, the «Judías» tr0000xx; schemas/enums.toml
#   item_category), derived from the game's data at boot.
# * Modes chronicle: only in Chronicle mode (current-mode key of the framework's game_modes.toml, play mode 4); every
#   other mode keeps the game's beans.
# * A goal's or the hero's drop that rolled a bean gives nothing (no re-roll, no pop-up): the drop tables are not
#   edited, so every other item keeps its odds. A bean prize row of the result is left out too (Prizes, default on).
#   «Tasa de aparición» lists no bean in Chronicle.
# With the module off the rule is not loaded: the game's beans again.
[[VRFW.MatchDropRemove]]
Categories = [210]
Modes = ["chronicle"]
