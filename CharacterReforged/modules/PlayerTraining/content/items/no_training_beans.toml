schema = "VRFW.item/2"
# Player Training: no training beans from anywhere (owner requests 2026-10-15 / 2026-10-16: with the classic training the
# beans give nothing, content\game\player_training.toml «the training beans»). Mechanism: the VR-Framework's
# [[VRFW.MatchDropRemove]] (docs/framework/drops.md §6); this mod only declares the rule.
# * Categories 210: every stat bean of item_config (column 5 = 210, the «Judías» tr0000xx; schemas/enums.toml
#   item_category), derived from the game's data at boot.
# * Every mode (no Modes): a match's goal / hero drop that rolled a bean gives nothing (no re-roll, no pop-up; the drop
#   tables are not edited, so every other item keeps its odds), a bean prize row is left out (Prizes, default on), and
#   «Tasa de aparición» lists no bean.
# * AllSources: every other grant of a bean through the game's item add is refused too: treasure boxes and victory
#   boxes (common_item_table), quest rewards (quest_config), trophy rewards (trophy_config), gifts and scripts. A shop
#   purchase is not refused (the shops are the shop rules' business).
# With the module off the rule is not loaded: the game's beans again.
[[VRFW.MatchDropRemove]]
Categories = [210]
AllSources = true
