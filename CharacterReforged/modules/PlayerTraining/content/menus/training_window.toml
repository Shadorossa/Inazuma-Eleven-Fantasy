# Player Training › the training window evt_training_menu (moved from Inazuma Fantasy's menus\screens.toml /
# screen_objects.toml 2026-10-14; built by research/scripts/tr_build.py): its registry row (cloned from `like`), its
# setting (the retail bean pop-up `base`, the lists that differ written whole) and its window object (the retail bean
# window with a taller layout: 9 gauge locators, 10 text nodes; the .g4pkm / .g4mg are this mod's
# assets\menu\10_win\win06\evt_win06_06_training\). No `script`: the screen's Lua is the Lua build's full file (graft
# player_training_menu, new_file). Opened from the team dock's «Entrenamiento» row (graft player_training_dock).
schema = "VRFW.menu/2"

# evt_training_menu (tr_build.py): 8 layers; base ability_learning_set_beans_menu
[[screen]]
name = "evt_training_menu"
like = "ability_learning_set_beans_menu"
base = "ability_learning_set_beans_menu"

# lists as in ability_learning_set_beans_menu: res
[screen.rows]
layer = [
    { layer = "cmn05_01_cursor" },
    { layer = "win06_06_beans_lump_use_window", object = "evt_win06_06_training" },
    { layer = "team13_16_beans_gauge", count = 9 },
    { layer = "cmn03_10_sub_window_button" },
