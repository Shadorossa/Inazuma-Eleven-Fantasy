# Character Reforged: the player page's part in the two character banks (chara_bank_menu, _for_search): their page
# table (a chunk local) gets the pages of plate_hiper_bank / Utilities' career page / plate_pages (index 6 PERFIL type 8,
# 7 ATRIBUTOS type 9), the common block (Q / E through the VR-Framework's player page registry, the Pasivas cursor
# mode, the pointer) and the bank's own lineup hidden while the page is over it. Split out of plate_pages on
# 2026-10-14 (docs/refactor/aura-mods-split.md «Player page»): Inazuma Fantasy's grafts edit the same chunks (series
# tabs, cross only, fichajes, mx_bank), so IF rebuilds this graft into its merged bank scripts (`rebuilt_by`); with
# both mods on, a VM runs this mod's copy and then IF's merged one: every wrapper goes through EVT_PPG_Wrap (one per
# function, a fresh definition wrapped again) and the page declarations replace themselves by name.
# Sources: the files of research/grafts/plate_pages.
name = "plate_pages_bank"
mod = "CharacterReforged"
rebuilt_by = ["inazuma_fantasy"]   # IF builds it into its own merged bank scripts too (its grafts edit the same chunks)
order = 975
module = "lua_bridge"
requires = ["plate_hiper_bank"]
conflicts = []
wraps = ["PostStep", "OnCloseLayer", "ChangeActiveUI", "OpenPersonalPlate", "ClosePersonalPlate",
         "SetNameSearchInputEnabled"]
description = "Player page: the pages in the two character banks"

[[files]]
stem = "chara_bank_menu"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu.main.PlatePages"
  text = '''
local t2 = {1, 0, 2, 3, 5, 6, 8, 9} -- Character Reforged player page: Hiper page (index 4, type 5), Utilities career page (index 5, type 6), PERFIL (6, type 8), ATRIBUTOS (7, type 9)
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_bank_lineup.lua"
  marker = "plate_pages bank"

[[files]]
stem = "chara_bank_menu_for_search"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu_for_search.main.PlatePages"
  text = '''
local t3 = {1, 0, 2, 3, 5, 6, 8, 9} -- Character Reforged player page: Hiper page (index 4, type 5), Utilities career page (index 5, type 6), PERFIL (6, type 8), ATRIBUTOS (7, type 9)
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_bank_lineup.lua"
  marker = "plate_pages bank"
