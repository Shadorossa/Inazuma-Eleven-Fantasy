# Character Reforged: the player page's part in the parent menus (team_dock_formation_menu, soccer_team_dock_menu,
# soccer_formation_menu): the page declarations (CharacterReforged.Profile / .Stats to the VR-Framework's registry),
# the start on PERFIL, the Pasivas cursor mode's left / right / back swallow, the pointer page steps and the dock lineup
# hide (off by default). Split out of plate_pages on 2026-10-14 (docs/refactor/aura-mods-split.md «Player page»):
# every wrapper goes through EVT_PPG_Wrap (one wrapper per function).
# Sources: the files of research/grafts/plate_pages.
name = "plate_pages_dock"
mod = "CharacterReforged"
order = 975
module = "lua_bridge"
requires = ["plate_hiper_common"]
conflicts = []
wraps = ["PostStep", "OnCloseLayer"]
description = "Player page: the pages in the parent menus (team dock, Plantilla, formation)"

[[files]]
stem = "team_dock_formation_menu"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_dock_hide.lua"
  marker = "plate_pages dock"

[[files]]
stem = "soccer_team_dock_menu"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  src = "../plate_pages/plate_dock_hide.lua"
  marker = "plate_pages dock"

[[files]]
stem = "soccer_formation_menu"

  [[files.ops]]
