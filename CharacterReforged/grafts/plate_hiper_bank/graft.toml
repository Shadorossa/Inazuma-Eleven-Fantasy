# Character Reforged (moved from Inazuma Fantasy 2026-10-14, docs/refactor/aura-mods-split.md «Player page»; the
# appended common block wraps through EVT_PH_Wrap).
# Personal plate 'Hipertécnica' page, the two player banks (research/scripts/plate_hiper_build.py patch_bank; docs/
# game/skill-slots.md): page table {1, 0, 2, 3} -> {1, 0, 2, 3, 5, 6} (type 6 = the mod Utilities' career page «TRAYECTORIA»,
# index 5, which Utilities declares to the VR-Framework's player page registry; was IF's graft career_page until
# 2026-10-08), the Q/E steps through EVT_PlateHiperStep (= VRFW_PlayerPages.Step,
# docs/framework/player-pages.md), the guide edit and the common block. Last of all (order 950, hiper-match-slot.md 16.34).
name = "plate_hiper_bank"
mod = "CharacterReforged"
order = 950
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "plate_hiper: Hiper page in the banks"

[[files]]
stem = "chara_bank_menu"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu.main.PlateHiperBank"
  text = '''
local t2 = {1, 0, 2, 3, 5, 6} -- EVT plate_hiper (index 4 = Hiper page, type 5) + Utilities career page (index 5, type 6)
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu.OnFunction.PlateHiperBank"
  text = '''
        n12 = EVT_PlateHiperStep(n12, -1, #t2) -- EVT plate_hiper
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu.OnFunction.PlateHiperBankReplace"
  text = '''
        n12 = EVT_PlateHiperStep(n12, 1, #t2) -- EVT plate_hiper
'''
  crc = "none"

  [[files.ops]]
