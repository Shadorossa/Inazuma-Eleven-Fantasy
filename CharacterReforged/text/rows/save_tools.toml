# Character Reforged › its actions of the VR-Framework's save tools (Options › «Ajustar save», scripts\save_tools.lua,
# docs/framework/save-tools.md): title, description (shown in the question before the action) and result (%d = the
# count the action answers). Rows of menu_text, read by id = crc32(row id).
schema = "VRFW.text/2"
table = "menu_text"

[[row]]
id = "character_reforged_save_tools_remove_duplicates"
es = "Quitar jugadores duplicados"
en = "Remove duplicate players"
fr = "Retirer les joueurs en double"
de = "Doppelte Spieler entfernen"
it = "Rimuovi giocatori doppi"
pt = "Remover jogadores duplicados"
ja = "重複した選手を削除"
zh_hans = "移除重复球员"
zh_hant = "移除重複球員"

[[row]]
id = "character_reforged_save_tools_remove_duplicates_desc"
es = "Deja una sola carta por personaje: se conserva la mejor copia y las demás se funden en ella y salen del club y de todos los equipos."
en = "Keeps one card per character: the best copy stays, the others are merged into it and leave the club and every team."
fr = "Garde une seule carte par personnage : la meilleure copie reste, les autres y sont fusionnées et quittent le club et toutes les équipes."
de = "Behält eine Karte pro Figur: Die beste Kopie bleibt, die anderen werden mit ihr verschmolzen und verlassen den Verein und alle Teams."
it = "Tiene una sola carta per personaggio: resta la copia migliore, le altre si fondono in essa e lasciano il club e tutte le squadre."
pt = "Mantém uma carta por personagem: fica a melhor cópia, as outras fundem-se nela e saem do clube e de todas as equipas."
ja = "1キャラにつきカード1枚にします。一番良いカードを残し、ほかはそこに統合されてクラブと全チームから外れます。"
zh_hans = "每个角色只保留一张卡：保留最好的一张，其余合并到它并离开俱乐部和所有队伍。"
zh_hant = "每個角色只保留一張卡：保留最好的一張，其餘合併到它並離開俱樂部和所有隊伍。"

[[row]]
id = "character_reforged_save_tools_remove_duplicates_done"
es = "Hecho: %d jugadores duplicados quitados."
en = "Done: %d duplicate players removed."
fr = "Terminé : %d joueurs en double retirés."
de = "Fertig: %d doppelte Spieler entfernt."
it = "Fatto: %d giocatori doppi rimossi."
pt = "Feito: %d jogadores duplicados removidos."
ja = "完了：重複した選手を%d人削除しました。"
zh_hans = "完成：移除了%d名重复球员。"
zh_hant = "完成：移除了%d名重複球員。"

[[row]]
id = "character_reforged_save_tools_normal_rarity"
es = "Igualar la rareza de los jugadores"
en = "Same rarity for every player"
fr = "Même rareté pour tous les joueurs"
de = "Gleiche Seltenheit für alle Spieler"
it = "Stessa rarità per tutti i giocatori"
pt = "Mesma raridade para todos os jogadores"
ja = "選手のレア度をそろえる"
zh_hans = "统一球员稀有度"
zh_hant = "統一球員稀有度"

[[row]]
id = "character_reforged_save_tools_normal_rarity_desc"
es = "Todas las cartas normales pasan a la rareza que fijan tus mods (con No More Rarities, 5★ Leyenda). Las cartas Héroe y Diamante no cambian."
en = "Every normal card gets the rarity your mods set (with No More Rarities, 5★ Legend). Hero and Diamond cards do not change."
fr = "Toutes les cartes normales prennent la rareté fixée par tes mods (avec No More Rarities, Légende 5★). Les cartes Héros et Diamant ne changent pas."
de = "Alle normalen Karten bekommen die Seltenheit, die deine Mods festlegen (mit No More Rarities 5★-Legende). Helden- und Diamantkarten ändern sich nicht."
it = "Tutte le carte normali prendono la rarità fissata dalle tue mod (con No More Rarities, Leggenda 5★). Le carte Eroe e Diamante non cambiano."
pt = "Todas as cartas normais passam à raridade que os teus mods definem (com No More Rarities, Lenda 5★). As cartas Herói e Diamante não mudam."
ja = "通常カードをすべてMODが決めたレア度にします（No More Raritiesなら★5レジェンド）。ヒーローとダイヤモンドのカードは変わりません。"
zh_hans = "所有普通卡变为模组设定的稀有度（使用No More Rarities时为5★传奇）。英雄卡和钻石卡不变。"
zh_hant = "所有普通卡變為模組設定的稀有度（使用No More Rarities時為5★傳奇）。英雄卡和鑽石卡不變。"

