# Texts of Character Reforged (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("character_reforged.<name>"): the mod's name and description on the «Mods» screen, in the game's language.
# «Character Reforged» is not translated. A language missing here falls back to English.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Character Reforged"
mod_description = "The shared base of the aura mods: the custom pairing screen (choose a player and a partner, confirm, the creation scene), the pairing rules and the common texts used by All Miximaxed, All Changed and Aura Points. It also gives every character his own stats, growth and moveset (4 special moves + aura) and raises the level cap to 200 (config.toml [level] cap, up to 999). Works with the VR-Framework alone."
