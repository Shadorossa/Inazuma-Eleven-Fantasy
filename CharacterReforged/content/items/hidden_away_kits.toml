# gives them (docs/game/modes/fm-kit-drops.md §3). The away look of every kit stays reachable through the kit picker's
# «Local / Visitante» switch (docs/game/mechanics/away-kit.md). `uni_u041401_20` «Equipación Revolucionarios» is not
# one of them (its own name, a match prize, no shop row).
# [[hide]]: the item stays in item_config (old saves keep loading), its shop rows are hidden and it leaves the reward
# tables. The save adjust «Quitar equipaciones ocultas» (scripts\save_tools.lua, lib\purge_kits.lua) reads these
# targets: the teams that wear one go back to their home kit and the owned copies go.

