# Character Reforged · the cards of the mod chronicles_deluxe (Chronicles Deluxe, docs/release/chronicles_deluxe.md): their own per-card values (Lv 200 stats without
# Suerte, growth), as for the retail cards (docs/refactor/aura-mods-split.md «Per-character data»). Moved from Inazuma
# Fantasy's characters\classic_teams_cards.toml on 2026-10-14 (its rebalance of those cards; the INAROGUE rarity is InaRogue's).
# Only while that mod is active (docs/framework/if-mod.md): its cards do not exist without it. Suerte is not declared:
# Character Reforged derives it (scripts\lib\stats_curve.lua, M.derived_luck).
# Regenerate the stats lines with research/scripts/mod_card_stats_build.py.
if_mod = "chronicles_deluxe"
default_lang = "en"

