schema = "VRFW.game/2"

# Character Reforged › per-character stats (owner 2026-10-14; docs/refactor/aura-mods-split.md «Per-character data»,
# docs/game/mechanics/stats-system.md §9). Moved from Inazuma Fantasy's module stats (its content\game\stats.toml):
#
# * GetCharaParamStatus 0xE80280: cards with per-character values (chara_param cols 43-54) answer out[0..7] from the
#   level curve (native answers: the named formulas below; the rows are the native tables scripts\stats.lua fills from
#   the served chara_param), × the caller's opts->mult[i] (f32, floor); other cards above Lv 99 are the game's Lv 99
#   values grown past the cap ([stats.past_cap] of config.toml) while the framework raised it ([level] cap).
# * CharaParam_GetSpecialtyType 0xE7BE20: cards with values answer the engine's scores on the curve values.
# * The match copy: the run speed from the Agilidad percentile ([[VRFW.MatchStat]], the framework's match-build
#   service; other mods' modifiers run before it: lower orders).
# * CMND_CHARACTERREFORGED_CHARA_STAT: scripts\stats.lua.
#
# The curve and its keys: scripts\lib\stats_curve.lua (header) and config.toml. The tables are exported (mod.toml
# [exports] tables): other mods' answers read them as "character_reforged/CharacterReforged.StatRow".
#
# The item transformations' variant stats: the framework swaps the chara_param of a transformed card for the game's
# code (vr_core::native::item_look); the curve reads the same variant with xform_param(<hdl>, <param>).

# ------------------------------------------------------------------------------------------------ functions

# CharacterReforged.FindCharaRecord, CharacterReforged.HumanGetLevel and character_reforged_chara_containers:
# content\game\chara_records.toml.

# ------------------------------------------------------------------------------------------------ globals

# charaMoveSpeedBase (SoccerActionGlobalParam+0x08, .data 0x1E5DF78): the `mulss xmm0, [rip+x]` of the speed-level
# switch at the end of MatchCharaBuild. The script publishes its address (VRFW.mem.global_addr) in
# character_reforged.stats.speed_base; the speed modifier reads [state(character_reforged.stats.speed_base)]:f32.
[[VRFW.Global]]
name = "character_reforged_move_speed_base"
game = "Chara.MoveSpeedBase"

# ------------------------------------------------------------------------------------------------ state keys (scripts\stats.lua)

[[VRFW.State]]
key = "character_reforged.stats.ready"           # 1 = the per-character tables are published (the hooks answer)

[[VRFW.State]]
key = "character_reforged.stats.post99"          # 1 = the framework raised the level cap: cards without values grow past Lv 99

[[VRFW.State]]
key = "character_reforged.stats.speed_on"        # 1 = the run speed follows Agilidad (the speed base resolved)

[[VRFW.State]]
key = "character_reforged.stats.speed_npc"       # 1 = also roster rows without a character ([stats] speed_npc)

[[VRFW.State]]
key = "character_reforged.stats.speed_pct"       # the band in percent (0..20; [stats] agility_speed)

[[VRFW.State]]
key = "character_reforged.stats.speed_base"      # the address of charaMoveSpeedBase

# ------------------------------------------------------------------------------------------------ the curve (named formulas)
#
# Tables (scripts\stats.lua, from the served chara_param and config.toml):
#   CharacterReforged.StatRow  [param] = { v2 (1 = Lv200 values), p (exponent of the growth type), f (Lv200 / Lv99
#                                factor), q (curve_post99), ratio (lv1_ratio), m (card multiplier), gain (past the cap,
#                                of the card's growth), agi (Agilidad percentile 0..1000) }
#   CharacterReforged.StatVal  [param, i] = the stored value of stat i (0..7; Rapidez = 0)
#   CharacterReforged.StatConst [1] = { post (1 = the framework raised the cap), max (the cap in effect, >= 100), shape,
#                                gain (Normal: cards without values), s (the cap scale S = ((max - 99) / 101)^cap_scale) }

# The Lv 99 value of a stored value: layout v1 = itself, v2 = round(v / factor) (0..9999)
[[VRFW.Formula]]
name = "CharacterReforged.V99"
params = ["P", "I"]
value = "if(lookup(CharacterReforged.StatRow:v2, P) == 1, clamp(round(lookup(CharacterReforged.StatVal, P, I) / lookup(CharacterReforged.StatRow:f, P)), 0, 9999), lookup(CharacterReforged.StatVal, P, I))"

# Growth past Lv 99 of a value V that is V at Lv 99 without a stored top, growth gain G, at level L:
# top = round(V × (1 + G × S)), V + (top − V) × (1 − (1 − u)^shape), u = (min(L, cap) − 99) / (cap − 99)
[[VRFW.Formula]]
name = "CharacterReforged.Post99"
params = ["G", "V", "L"]
value = "if(V <= 0, V, let(top, lookup(CharacterReforged.StatConst:max, 1), let(u, (min(L, top) - 99) / (top - 99), let(vmax, round(V * (1 + G * lookup(CharacterReforged.StatConst:s, 1))), clamp(round(V + (vmax - V) * (1 - pow(1 - u, lookup(CharacterReforged.StatConst:shape, 1)))), 0, 9999)))))"

# Stat I of the card P at level L: the Lv 1..99 curve toward v99; above 99 (v2) toward top = v99 + (v − v99) × S at the
# cap with exponent q, (v1) the growth past the cap; the card multiplier last (scripts\lib\stats_curve.lua, the same
# numbers)
[[VRFW.Formula]]
name = "CharacterReforged.StatAt"
params = ["P", "I", "L"]
value = """
let(v, lookup(CharacterReforged.StatVal, P, I),
let(v99, CharacterReforged.V99(P, I),
let(lv1, round(v99 * lookup(CharacterReforged.StatRow:ratio, P)),
let(base, round(lv1 + (v99 - lv1) * pow(clamp((max(L, 1) - 1) / 98, 0, 1), lookup(CharacterReforged.StatRow:p, P))),
let(cap, lookup(CharacterReforged.StatConst:max, 1),
let(at, if(lookup(CharacterReforged.StatRow:v2, P) == 1,
           if((L <= 99) + (lookup(CharacterReforged.StatConst:post, 1) == 0), if(L <= 99, base, v99),
              clamp(round(v99 + (v99 + (v - v99) * lookup(CharacterReforged.StatConst:s, 1) - v99) * pow((min(L, cap) - 99) / (cap - 99), lookup(CharacterReforged.StatRow:q, P))), 0, 9999)),
           if((L > 99) * lookup(CharacterReforged.StatConst:post, 1), CharacterReforged.Post99(lookup(CharacterReforged.StatRow:gain, P), v99, L), base)),
let(m, lookup(CharacterReforged.StatRow:m, P),
    if(m == 1, at, clamp(round(at * m), 0, 9999)))))))))
"""

# The engine's specialty type from the 7 stats of card P at level L (CharaParam_GetSpecialtyType's scores, f32): the
# first strict maximum of (It+Tc+Cr)/3, (It+Ps+Pr)/3, (Cr+Kc)/2, (Ag+Ps)/2 (all <= 0: the first), types [3, 4, 2, 1]
[[VRFW.Formula]]
name = "CharacterReforged.Specialty"
params = ["P", "L"]
value = """
let(kc, CharacterReforged.StatAt(P, 0, L), let(cr, CharacterReforged.StatAt(P, 1, L), let(tc, CharacterReforged.StatAt(P, 2, L), let(pr, CharacterReforged.StatAt(P, 3, L),
let(ps, CharacterReforged.StatAt(P, 4, L), let(it, CharacterReforged.StatAt(P, 5, L), let(ag, CharacterReforged.StatAt(P, 6, L),
let(third, f32(0.3333333432674408),
let(a, f32((it + tc + cr) * third), let(b, f32((it + ps + pr) * third), let(c, f32((cr + kc) * 0.5), let(d, f32((ag + ps) * 0.5),
let(b1, max(a, 0), let(i1, if(b > b1, 1, 0), let(b2, max(b, b1), let(i2, if(c > b2, 2, i1), let(b3, max(c, b2),
let(i3, if(d > b3, 3, i2),
    if(i3 == 0, 3, if(i3 == 1, 4, if(i3 == 2, 2, 1)))))))))))))))))))))
"""

# The run speed of card P: charaMoveSpeedBase × (1 + band × (2 × percentile − 1)) in f32 steps (the median card of its
# position keeps the game's speed)
[[VRFW.Formula]]
name = "CharacterReforged.SpeedOf"
params = ["P"]
value = "let(b, f32(clamp(int(state(character_reforged.stats.speed_pct)), 0, 20) / 100), let(pc, f32(min(lookup(CharacterReforged.StatRow:agi, P), 1000) / 1000), f32([state(character_reforged.stats.speed_base)]:f32 * f32(1 + f32(b * f32(2 * pc - 1))))))"

# ------------------------------------------------------------------------------------------------ hooks

# void GetCharaParamStatus(int out[8], u16 level, const u32* paramId, const StatusOpts* opts) 0xE80280:
# opts = { f32 mult[8]; u32 rarity; u32 editCharaId; … }, opts+0x24 = the character handle in the owned-player caller
# (the item transformations' variant rule checks it against the param). One choke point of the 3 callers (0xD84F30
# owned players, 0xC2E610 Lua, 0x1605660 match NPCs).
[[VRFW.Hook]]
name = "CharacterReforged.CharaParamStatus"
game = "Chara.GetParamStatus"
kind = "function"

# a card without values above Lv 99 while the cap is raised: the game computes Lv 99 (grown after it)
[[VRFW.Hook.answer]]
phase = "pre"
when = [{ state = "character_reforged.stats.post99", equals = 1 }, { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], not_in_table = "CharacterReforged.StatRow" }]
value = "min(args[2], 99)"
write = "args[2]"

# a card with per-character values: out[i] = floor(f32(curve × opts->mult[i]))
[[VRFW.Hook.answer]]
each = { count = "8", max = 8 }
when = { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], in_table = "CharacterReforged.StatRow" }
value = "floor(f32(CharacterReforged.StatAt(xform_param([args[4] + 0x24]:u32, [args[3]]:u32), i, args[2]) * [args[4] + i * 4]:f32))"
write = "[args[1] + i * 4]:i32"

# a card without values above Lv 99: the 7 stats (already × rarity) follow the growth past the cap with the Normal gain
# (out[7] of such a row is the speed level, not a stat: unchanged)
[[VRFW.Hook.answer]]
each = { count = "7", max = 7 }
when = [{ state = "character_reforged.stats.post99", equals = 1 }, { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], not_in_table = "CharacterReforged.StatRow" }]
value = "let(L, int(mask(regs.rdx, 0xFFFF)), if(L > 99, CharacterReforged.Post99(lookup(CharacterReforged.StatConst:gain, 1), [args[1] + i * 4]:i32, L), [args[1] + i * 4]:i32))"
write = "[args[1] + i * 4]:i32"

# u8 CharaParam_GetSpecialtyType(const u32* paramId, u16 level) 0xE7BE20
[[VRFW.Hook]]
name = "CharacterReforged.SpecialtyType"
game = "Chara.GetSpecialtyType"
kind = "function"

# a card with per-character values: the engine's scores on the curve values (the game's code does not run)
[[VRFW.Hook.answer]]
phase = "pre"
when = { value = ["[args[1]]:u32"], in_table = "CharacterReforged.StatRow" }
value = "CharacterReforged.Specialty([args[1]]:u32, args[2])"
write = "ret"

# a card without values above Lv 99: the type is a ratio of the stats, the Lv 99 answer holds
[[VRFW.Hook.answer]]
phase = "pre"
when = [{ state = "character_reforged.stats.post99", equals = 1 }, { value = ["[args[1]]:u32"], not_in_table = "CharacterReforged.StatRow" }]
value = "min(args[2], 99)"
write = "args[2]"

# ------------------------------------------------------------------------------------------------ the match copy

# the run speed from the Agilidad percentile (after the other mods' modifiers: trained points, coaches; orders < 100)
[[VRFW.MatchStat]]
name = "CharacterReforged.AgilitySpeed"
order = 100
when = [{ state = "character_reforged.stats.speed_on", equals = 1 }, { value = ["args[3]"], in_table = "CharacterReforged.StatRow" }]
speed = "CharacterReforged.SpeedOf(args[3])"

[[VRFW.MatchStat]]
name = "CharacterReforged.AgilitySpeedNpc"
order = 100
owned = false
npc = true
when = [{ state = "character_reforged.stats.speed_on", equals = 1 }, { state = "character_reforged.stats.speed_npc", equals = 1 }, { value = ["args[3]"], in_table = "CharacterReforged.StatRow" }]
speed = "CharacterReforged.SpeedOf(args[3])"

# ------------------------------------------------------------------------------------------------ commands

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CHARA_STAT"   # (charaStHdl, idx 0..8) -> value, hasPerCharacterData (errors: value < 0, false)
handler = "CharacterReforged.CharaStat"
needs = ["Board.FindCharaRecord", "Chara.HumanGetLevel", "character_reforged_chara_containers"]
