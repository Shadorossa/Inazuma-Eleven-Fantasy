schema = "VRFW.transform/2"
# Character Reforged › which forms of the new skill set's two slots run together on one player (docs/framework/
# extra-slot.md §7.7, docs/framework/types/transform.md §3). The aura slot's spirit (a keshin, or a totem: kind
# "aura") and the mix slot's fusion (a Mix-Max: kind "miximax") stack both ways: the fusion starts while the spirit is
# out, and the spirit is summoned while the fusion runs. Each keeps its own costs, time and limits (the team limit,
# the cooldown between auras, Aura Points' pools); the end of one does not end the other. No armour over the fusion
# (an armour and a fusion share the engine's one metamorphosis). Merged over the other mods' rules key by key.

[rules]
stack = ["keshin", "aura", "miximax"]
