schema = "VRFW.menu/2"
# Character Reforged · the level numbers with 3 digits (the level cap above 99, content/characters/level.toml): the
# retail menu objects that draw a character's or a team's level (lists, team banners, VS / match headers, focus
# balloons, scoreboards) get DispMaxValue 999. Moved from Inazuma Fantasy's menus/objects.toml (part level200) on
# 2026-10-14.

[[object_set]]
object = "mainmenu90_19_02_list_item"
set = [
    { param = "DispMaxValue", match = { 1 = 0xB49DEFB2 }, values = { 2 = 999 } },
