# Character Reforged › the skill table (moved from Inazuma Fantasy 2026-10-14, owner: «el nuevo tablero de habilidades
# como un activable»; docs/refactor/aura-mods-split.md «Skill table»). Used only while the option row
# character_reforged.skill_set_view («Tabla de habilidades») is on: the team dock's «Tabla de habilidades» then opens
# this screen (graft ss2_dock) instead of the game's board. The screen = 6 move rows + the aura / mix row (graft
# ss2_menus): its registry row (cloned from `like`), setting (the retail `base` with the lists that differ written
# whole), the menu objects it adds (each a retail object `from` with rows changed) and their layouts (copies of
# retail layouts with joints moved; the prebuilt .g4pkm / .g4mg / .g4tx are this mod's assets\menu\). No `script`:
# the screen's Lua is the Lua build's full file (graft ss2_menus, new_file) served from assets\script\lua\menu\
# (Inazuma Fantasy ships its own merged build of it, which replaces this one while IF is active). The layers of IF's
# additions (training panel evt_trn_*, combo partner picker evt_cpk_*, set preview evt_psp_*) stay declared here,
# hidden: only the blocks that use them show them (the training panel and its button evt_cmn03_07_btn_train: Player
# Training's hook file on the screen's host, graft skill_table_host since 2026-10-14; the button is the host's footer
# button, hidden while no mod declares one).
# Moved from Inazuma Fantasy's menus\screens.toml / screen_objects.toml / screen_layouts.toml; hand-maintained.
