# ---- the 3D model (Lua: research/grafts/plate_model + _lib/evt_model_view.lua) ---------------------------------
# evt_pp_model: the minimal retail model layer (rpg99_99_chara_model_only_view: render + CMenuCharaModelComponent),
# its render-to-texture capture rows removed, a layout without meshes (team01_01: locators only) instead of the
# full-screen background mainmenu90_00, and the model component rows of the retail «Ver apariencia» view
# (team02_01_attach_formation_frame, read from the retail objbin by if_plate_row_build.py retail_view(); 2026-10-07, Nacho:
# «coge la cámara que usa el botón de ver apariencia original»; the office camera of round 7 is gone). The start
# place is the page's (if_plate_row_build.py PAGE_PLACE): the retail view's model farther from the same camera so
# the whole body fits between the name band and the description card.
[[object]]
name = "evt_pp_model"
from = "rpg99_99_chara_model_only_view"
set = [
    { param = "SkeletonAnime", values = { 1 = "common/menu/102_team/team01/team01_01/team01_01.g4pkm" } },
    { param = "m_lightObjDataPathName", values = { 1 = "Menu_2dLight" } },
    { param = "m_menuCameraNameCrc", values = { 1 = 935586083 } },
    { param = "m_isRotateSelf", values = { 1 = 0 } },
]
remove = [
    { param = "m_isShareRenderTexture" },
    { param = "m_isEnablePreBuildResource" },
]
add = [
