[[patch]]
menu = "personal_plate_menu"
add_layer = { name = "evt_pp_model", object = "evt_pp_model", count = 1, align = ["right", "middle"], scale = 0.20000000298023224, after = "team11_01_personal_plate", groups = [{ group = "personal_plate_menu", flags = [0, 0, 0, 0, 1, 0], after = "team11_01_personal_plate" }] }
# 2026-10-12 (owner: no 3D model on the match / half-time «Formación» page): every retail menu model shown DURING a
# match is a capture (render-to-texture) object (btl01_11, soccer02_38, soccer08_47, soccer20_04, win01_15...:
# m_isEnableCapture 1); the plain menu-camera model (evt_pp_model, camera 935586083) is built in a match but never drawn.
# evt_pp_model_cap = the retail VS screen's captain capture object (soccer20_04_vs_team_info_self: shared RT 2048 x
# 1024, square 1024 cells, VS camera -1209099802 = eye (0, 1.35, 10), 512 x 512, FOV 20, light Menu_2dLight_Capture)
# with one model; its quad _chr_3d01_01 shows the RT (the retail swap 3747175963(layer, 0, _chr_3d01_01, key), as
# soccer_battle_setting_flow_vs_menu) and is placed / sized by research/grafts/plate_model (screen 1203..1718,
# 270..785: ~245 px per metre, feet at y ~773 = the Plantilla framing); the telop meshes are hidden there. A normal
# 2D layer at priority 299 (over the formation background 198, under the band / description card 300), not drawType 1.
# Start place: the model 5.95 m from the VS camera (z 4.05), feet at y 0.35: the square shows 0.3..2.4 m (2.05 m
# above the feet). Used only on the plate type 1 (a match); every other screen keeps evt_pp_model.
# 2026-10-13 (owner, first in-game look: a white slanted parallelogram instead of the model): the quad showed its own
# placeholder (icon_chr_dmy01, white 16 x 16, through the slanted mask chr_telop01_msk01) because no RT was ever bound.
# The VS object takes RT pool type 2 (m_useCharaRenderTextureIndex 0), which has only 2 cells (default grid 2 x 1,
# nie.exe FUN_1417744b0) shared with every in-match capture (soccer02_38, soccer08_47, soccer10_25, soccer01_06,
# win01_15...: 2 models each); with both cells taken FUN_14176f270 returns handle 0 and the model is never captured.
# Now the RT is pool type 3 (index 1: only btl04_02, an RPG cut-in, uses it, with the same 1 x 1 grid), one square
# 1024 x 1024 cell = the VS cell size and aspect (camera 512 x 512), so the framing / CAP_BOX stay as they were.
# 2026-10-15 (still white in a match): a per-model RT like every retail in-match capture (soccer08_47 keeper gauge,
# soccer01_06 VS skill telop: no m_isShareRenderTexture). The cell is taken when the model is built (key = the model's
# CMND_CHARA_MODEL_CHANGE key), not once when the object is created with the menu. Pool type 3 keeps its default 2 x 1
# grid (a rebuild takes the second cell while the old one is freed) and the VS atlas 2048 x 1024 (1024 x 1024 cells).
[[object]]
name = "evt_pp_model_cap"
from = "soccer20_04_vs_team_info_self"
set = [
    { param = "m_drawPriority", values = { 1 = 299 } },
    { param = "m_useObjectNum", values = { 1 = 1 } },
]
remove = [
    { param = "m_drawType" },
    { param = "m_screenStretch" },
    { param = "m_isShareRenderTexture" },
]
add = [
    { block = "CMenuCharaModelComponent", param = "m_startX", values = [0.0] },
    { block = "CMenuCharaModelComponent", param = "m_startY", values = [0.35] },
    { block = "CMenuCharaModelComponent", param = "m_startZ", values = [4.05] },
    { block = "CMenuCharaModelComponent", param = "m_startRotY", values = [-7.5] },
    { block = "CMenuCharaModelComponent", param = "m_useCharaRenderTextureIndex", values = [1] },
]

[[patch]]
menu = "personal_plate_menu"
add_layer = { name = "evt_pp_model_cap", object = "evt_pp_model_cap", count = 1, align = ["right", "middle"], scale = 0.20000000298023224, after = "evt_pp_model", groups = [{ group = "personal_plate_menu", flags = [0, 0, 0, 0, 1, 0], after = "evt_pp_model" }] }
