# the header plate on the one-row layout copy; other mods add their attach rows ([[object_set]] on this object).
# 2026-10-14 (owner: a Diamond card's rainbow effect drew a big empty frame under the band): without the retail object's
# effect block (CMenuEffectAttachComponent: the Diamond waves ega1450a_2 at _pos_status01 + (-485, -8), made for the
# retail 968 x 196 plate; one uniform scale, so it cannot follow the 64 px band). The Diamond look stays on the band:
# the rarity sprite and the seasonal frame mesh (fitted to the band above) with the basara sprites.
[[object]]
name = "evt_soccer11_04pp_pp"
from = "soccer11_04pp_chara_status_info"
set = [
    { param = "SkeletonAnime", match = { 1 = "common/menu/00_soccer/soccer11/soccer11_04pp/soccer11_04pp.g4pkm" }, values = { 1 = "common/menu/00_soccer/soccer11/evt_soccer11_04pp/evt_soccer11_04pp.g4pkm" } },
]
remove_block = ["CMenuEffectAttachComponent"]
