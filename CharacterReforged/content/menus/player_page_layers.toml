# ---- the PEG / SP pool on the Hiper page's spirit card (was IF menus/102_team/plate_peg_pool.toml)
# 2026-10-04 (user): a keshin / armour card shows its pool «170 PEG» ON the card, centred, in the TENSIÓN digits, drawn
# BEHIND the «Armadura» tag (evt_ph_armour_tag, priority 580) and over the card (evt_ph_face, 570). Layer
# evt_ph_peg_pool: one more instance of the extra rows' TENSIÓN group object evt_ph_tension (number primitive + the «T»
# slot, which the Lua swaps for «PEG»; squares, track and label hidden); research/grafts/plate_hiper_plate
# (EVT_PHI.PoolTag) scales and places it on the card. Drawn only while the mod Aura Points answers CMND_EVT_PEG_INFO.
[[patch]]
menu = "personal_plate_menu"
add_layer = { name = "evt_ph_peg_pool", object = "evt_ph_tension", count = 3, align = ["right", "middle"], scale = 0.20000000298023224, after = "evt_ph_tension", groups = [{ group = "personal_plate_menu", flags = [0, 0, 0, 0, 1, 0], after = "evt_ph_tension" }] }

# the attach row of evt_ph_tension instance 0 (0x82D588EA) repeated for evt_ph_peg_pool (0x4525A873), instance 0
[[object_set]]
object = "evt_ph_skill_detail_info"
copy = [
  { param = "NullLayerName", match = { 3 = 0x82D588EA, 4 = 0 }, values = { 3 = 0x4525A873, 4 = 0 }, optional = true },
  { param = "NullLayerName", match = { 3 = 0x82D588EA, 4 = 0 }, values = { 3 = 0x4525A873, 4 = 1 }, optional = true },
  { param = "NullLayerName", match = { 3 = 0x82D588EA, 4 = 0 }, values = { 3 = 0x4525A873, 4 = 2 }, optional = true }
]

