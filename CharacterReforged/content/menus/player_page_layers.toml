# Character Reforged: the player page's own layers on the plate screens (personal_plate_menu, _for_datafile): the
# 8-stat radar (the status base / graph objects redirected to the page's copies evt_soccer11_05 / evt_soccer11_06_9 /
# evt_soccer11_07_9, the Suerte label layer, 8 numbers), the Hiper page's card layers (evt_ph_*: move rows, armour tag,
# skill detail, tension rows, aura face, the PEG pool), the Pasivas strips' select object. Moved from Inazuma Fantasy
# on 2026-10-14 (its menus/102_team/personal_plate_menu.toml, personal_plate_menu_for_datafile.toml,
# plate_peg_pool.toml and the 4 plate redirects of menus/redirects.toml; docs/refactor/aura-mods-split.md «Player
# page»). Hand-maintained. The generated part of the page (pages, model, band / card copies, gauges, dots, hosts) is
# player_page_layout.toml; the objects / layouts are this mod's assets (assets\gamedata\menu\obj\evt_ph_*,
# evt_soccer11_0*; assets\menu\00_soccer\soccer11\evt_*). The career page's layers are the mod Utilities'.
schema = "VRFW.menu/2"

# ---- the plate's status base and radar: the page's copies (8 axes, the page-only locators)
[[redirect]]
object = "soccer11_05_formation_status_base"
to = "evt_soccer11_05_formation_status_base"
menus = ["personal_plate_menu", "personal_plate_menu_for_datafile"]

[[redirect]]
object = "soccer11_06_formation_status_graph_base"
