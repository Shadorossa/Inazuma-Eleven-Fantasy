# the aura's PEG / SP when a mod answers CMND_EVT_PEG_INFO, e.g. Aura Points). Inazuma Fantasy's file of the same name
# (GENERATED there by research/scripts/plate_peg_build.py; same sprites, same PNGs): copied here on 2026-10-14 (without
# Inazuma Fantasy the sprites were missing and the panel drew white rectangles), IF's copy removed the same day with
