# Character Reforged › the «PEG» look of the shared Hiper card (the skill table's move panels on evt_skill_slot_menu and
# the player page's Hiper card, EVT_HC.PegLook / PegPool: the TENSIÓN squares and the «T» after the number turn into
# the aura's PEG / SP when a mod answers CMND_EVT_PEG_INFO, e.g. Aura Points). Inazuma Fantasy's file of the same name
# (GENERATED there by research/scripts/plate_peg_build.py; same sprites, same PNGs): copied here on 2026-10-14 (without
# Inazuma Fantasy the sprites were missing and the panel drew white rectangles), IF's copy removed the same day with
# the player page (docs/refactor/aura-mods-split.md «Player page»). In the mod's own localised atlas
# character_reforged_plate_peg but the «T» after the number (content\sprite_redirects\plate_peg.toml serves the
# names the Lua asks team02_02 for).
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/102_team/character_reforged_own/<LG>/character_reforged_plate_peg.g4tx"
name = "character_reforged_plate_peg"
size = [172, 72]
lang = ["", "en", "es", "fr", "de", "it", "pt", "zh_hans", "zh_hant"]

[[texture]]
atlas = "#/menu/102_team/character_reforged_own/<LG>/character_reforged_plate_peg.g4tx"
name = "evt_ph_peg"
size = [408, 96]


# The «T» after the number (evt_gtxt_peg_t / evt_gtxt_sp_t) stays in the game's team02_02 page: the _gtxt_t01 quad
# keeps its texture page on a sprite swap and only takes the new UVs, so a picture in another atlas draws a piece of
# team02_02 (a white square). The squares swap pages and live in the own atlas.
[[texture]]
atlas = "#/menu/102_team/team02/team02_02/<LG>/team02_02.g4tx"
name = "team02_02"
size = [920, 612]

