# Character Reforged: the item card «Efecto» page's sprites (graft plate_pages, host table item_card.effect) in the
# card's own atlas evt_eq_fx (loaded by the icon layer's object evt_eq_fx, content/menus/item_card.toml): copies of
# retail icons (icon_common, icon_list_tab, team16_03, icon_common2), their grey copies, flat chips, gauge bars and
# a separator. No game atlas gains or loses a sprite.
schema = "VRFW.image/1"

# the atlas is new (the game has none): this texture creates it; the sprites below are packed into it by the image type
