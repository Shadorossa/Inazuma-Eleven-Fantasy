# Inazuma Fantasy: the two plates of the split Hiper row (Tabla de habilidades; docs/game/hiper/hiper-two-slots.md §3),
# a NEW atlas #/menu/00_soccer/soccer11/evt_soccer11_08_hs/evt_hs_plates.g4tx made at the first start (and after a game
# update) from the PLAYER'S own game files: the row's retail plate (soccer11_08 item_list_base01, 568 x 80, white with
# a green slanted tail) pre-tinted twice. Left = the AURA slot, purple; right = the MIX slot (a Mix-Max or a «Modo
# cambio»), orange. The tail's hue is turned first so it ends as a darker shade of the plate (a multiply alone made it
# dark green). Owner 2026-10-12: a tint from Lua (CMND_SET_PRIM_COLOR) never reached the row's plate mesh (both halves
# stayed white), so the colour is in the pixels. No Level-5 pixel ships. Read by graft ss2_menus (PL.HsSplitRow). Character Reforged's since 2026-10-14 (moved with the skill table).
schema = "VRFW.image/1"

[[recipe]]
name = "hs_plate"
game = "#/menu/00_soccer/soccer11/soccer11_08/soccer11_08.g4tx"
sprite = "item_list_base01"

[[recipe]]
name = "hs_plate_aura"
from = "hs_plate"
ops = [
    { op = "hue", turns = 0.35 },                              # the green tail -> purple
    { op = "affine", mul = [0.62, 0.42, 0.95], add = [0, 0, 0] },  # white -> purple, the tail a darker purple
]

[[recipe]]
name = "hs_plate_mix"
from = "hs_plate"
ops = [
    { op = "hue", turns = 0.67 },                              # the green tail -> orange-red
    { op = "affine", mul = [1.0, 0.55, 0.12], add = [0, 0, 0] },   # white -> orange, the tail a darker orange
]

