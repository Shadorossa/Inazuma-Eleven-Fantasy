# What the aura mods call (docs/refactor/aura-mods-split.md «CharacterReforged: shared base»).
[exports]
functions = ["PairRules", "PairCheck", "PairValidity", "Card", "BoardItems", "BoardSlotOf", "BoardPlace", "CanPlace", "AddPlaceRule", "RemovePlaceRule", "SkillSetRules", "MixGet", "MixSet", "SlotOf", "SkillSetOnNow", "StatsReady", "HasStats", "StatCard", "StatAt", "Libertad", "CharaStat", "LevelCap", "StatCurve", "LevelFactor", "Moveset", "DuplicatePolicy", "EraKitOf", "MixAddsStats", "PartnerLockSet"]
# [CharacterReforged.PairRules.<system>] and [CharacterReforged.Create.<system>] in any mod's content\pairing\*.toml (schema
# CharacterReforged.pairing/1); [CharacterReforged.DuplicateRules.<name>] in any mod's content\duplicate_rules\*.toml
# (schema CharacterReforged.duplicate_rules/1: the duplicate-players hook; DuplicatePolicy() = the merged policy);
# [CharacterReforged.SkillBoard] armour_without_item in any mod's content\skill_board\*.toml (schema
# CharacterReforged.skill_board/1: the board's armour slot without the item, scripts\armour_slot.lua; off by default,
# All Keshin Armed switches it on)
# [CharacterReforged.EraKit] in any mod's content\era_kits\*.toml (schema CharacterReforged.era_kit/1): how
# scripts\era_kits.lua derives the ídolos' era kits (native table CharacterReforged.EraKit; EraKitOf(card) = the kit)
# [CharacterReforged.PlaceRules.<name>] in any mod's content\skill_set\*.toml (schema CharacterReforged.skill_set/1):
# a mod's placement rule for the skill set (scripts\skill_set.lua; Hissatsu Level Up's one copy per set)
keys = ["PairRules", "Create", "DuplicateRules", "SkillBoard", "EraKit", "PartnerLock", "PlaceRules"]
# its native tables other mods' answers may read as "character_reforged/<name>" (the cards with per-character
# values: Inazuma Fantasy's trained-points modifier)
tables = ["CharacterReforged.StatRow", "CharacterReforged.EraKit"]
# game_lua: CharacterReforged.Header = the player header's slot (assets\lua\_all\character_reforged_header.lua): SLOT,
# Items(). A mod hangs a piece there as data: [[entry]] host = "character_reforged.header",
# action = { lua = "<Prefix>.<fn>" } (f(phase, ctx), content\menus\player_header_host.toml); its layers attach to the
# header object evt_soccer11_04pp_pp ([[object_set]]). Stamina Points' max PE is one. BandColour(layer, inst, hdl) =
# the player page's slanted header band: the band colours of the host character_reforged.header_band (No More Rarities'
# position colour), else RarityBand = the retail rarity look.
# ShowsRarity(hdl) = the row's rarity title: the rules of the host character_reforged.header_rarity (No More Rarities:
# only Ídolo and mod-declared rarities), else the retail title.
# CharacterReforged.SkillTable = the skill table's extension point (graft skill_table_host, the screen
# evt_skill_slot_menu): its entries' helpers (Chara, MoveName, Confirm, Message, Sound, Refresh), L = the screen chunk's
# locals by name, Env(globals) = an _ENV over them; the script is also the VRFW_Host host «evt_skill_slot_menu».
# CharacterReforged.Page = the player page's slots (assets\lua\_all\character_reforged_page.lua): Stat(hdl, idx),
# LuckBonus(hdl), StatTop(hdl, idx), GainsRaw(hdl), Providers(host), SkillSetOn(), MixOf(card), ModeChangePartner(card).
# A mod adds a value as data: [[entry]] host = "character_reforged.page_stat" | ".page_luck_bonus" | ".page_stat_max" |
# ".page_stat_gain" | ".mode_change_partner" (the partner of the equipped «Modo cambio»: Custom Change Mode, Inazuma Fantasy),
# action = { command = "CMND_<PREFIX>_..." } (content\menus\player_page_host.toml): Player Training (gauge tops,
# committed Suerte), Inazuma Fantasy (its stat command, the miximax gains). Pages: the VR-Framework's registry
# (VRFW_PlayerPages.Add).
game_lua = ["CharacterReforged.Header", "CharacterReforged.SkillTable", "CharacterReforged.Page"]

# its own content/ folder read only by its scripts (the pairing rules every mod may declare): vrfw check's layout lint
# accepts it (docs/framework/mod-layout.md)
[layout]
script_folders = ["pairing", "skill_set", "movesets"]
